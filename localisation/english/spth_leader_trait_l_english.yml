 leader_trait_touhou_psionic: "§UFantasy-Psionic Medium§!"
 leader_trait_touhou_psionic_desc: "$touhou_gensokyo_psionic_leader_trait_title$这位领袖具备强大的灵能力量，与她的灵力结合获得了前所未有的能力。"
 leader_trait_sp_leader_effect: "$leader_trait_spacebender_effect$\n$leader_trait_ignore_leader_cap_tt$"
 leader_trait_flandre_skill: "具备符卡能力：§P禁忌「四重存在」§!\n\n§H指挥军用舰队进入战斗后:§!\n生成三个会被优先攻击的§H分身舰队§!，§H分身舰队§!能存在§G20.00§!£time£\n冷却180.00£time£"
 NAME_leader_trait_flandre_fleet: "§P禁忌「罹难漩涡」§!"
 leader_trait_youmu_effect: "具备符卡能力：§E「八百由旬之一闪」§!\n\n§H指挥军用舰队进入战斗后§!:\n将自身§H瞬间移动§!到敌人附近，经过自身§G技能等级*2.00§!£time£后瞬间移动回原本的位置\n冷却§R180.00§!£time£"
 leader_trait_utsuho_skill: "具备符卡能力：§Y爆符「百万耀斑」§!\n\n§H指挥军用舰队进入战斗后:§!\n获得§Y200.00%§!的['concept_utsuho_bonus']与§R50.00%§!['concept_touhou_vulnerable']，持续§Y15.00§!£time£。\n失去相当于§R50.00%§!的护盾增益，持续§Y15.00§!£time£。\n冷却§R180.00§!£time£"
 leader_trait_karakasa: "The Cheery Forgotten Umbrella"
 leader_trait_karakasa_desc: "The youkai of unused umbrella.\nShe was once a normal umbrella in the outside world that was forgotten by her owner that no one claimed over time because the color of it was unpopular at the time;\nAbandoned through storms, she eventually became a youkai.\n\nShe rarely poses any real threat to humans -- she just enjoys the look of surprise on their faces.\nBut these days, it’s gotten harder to find people to scare,\nso she’s taken to reading classic ghost stories, studying the proper ways to give someone a classic move."
 leader_trait_touhou_keiki: "The Sculptor God"
 leader_trait_touhou_keiki_desc: "Bearing the hope of resurrection, human spirits of the Animal Realm summoned her.\nShe utilized sculpting art to make haniwa armies and banished animal spirits, ultimately being the master of Primate Spirit Garden.\nShe has the ability to create idols. Those delicate idols craft by her are of superior quality: they can collect faith, act as stand-ins, play with you, or decorate your home."
 leader_trait_marisa_skill: "具备符卡能力：§B恋符「极限火花」§!\n\n§H指挥军用舰队进入战斗后:§!\n对敌方舰队召唤一次§Y魔炮「Final Spark」§!打击。\n该伤害具备§H无视硬化§!的§G+100%§!§Y护盾穿透§!与§R-80%§!§Y船体伤害§!\n可以造成§Y800.00-1600.00§!点§H持续性§!伤害\n\n该伤害可以受到§Y灵力武器伤害§!加成\n持续10£time£，冷却§R180.00§!£time£"
 leader_trait_touhou_effected_by_skills: "这个特质的效果随§Y领袖$SKILL$§!的提升而§G增强§!。"
 leader_trait_touhou_admiral_focus: "§Y只能选择一种武器类型专精。§!"
 leader_trait_touhou_leader_only: "§Y这个特质只有§H《幻想乡缘起》§!追忆之人可以获得。§!"
 leader_trait_spell_card_user: "Spell Card Expert"
 leader_trait_spell_card_user_desc: "$touhou_common_leader_trait_title$ This leader has mastered spirit power, knowing its effectiveness against armor."
 leader_trait_th_skill_star_pirate: "Stellar Thief"
 leader_trait_th_skill_star_pirate_desc: "$touhou_common_leader_trait_title$ This leader smoothly steals stuff from enemies like a thievery expert, including even conceptual entities."
 leader_trait_th_skill_star_pirate_skill_1: "§HWhen commanding a fleet in combat:§!\nEnemy energy and kinetic weapon §Ypositive modifiers§! are §R-15.00%§! less effective\nLasts §Y20.00§!£time£, cooldown §R180.00§!£time£\n\nIf combat is won, steal a small amount of §Ya random type§! of resources from the enemy."
 leader_trait_th_skill_star_pirate_skill_2: "进入战斗时，敌方舰队能量与动能武器§Y增益§!修正§R-20.00%§!\n持续§Y12.00§!£time£，冷却§R75.00§!£time£\n\n若战斗获胜，窃取少量的敌方§Y随机一项§!资源"
 leader_trait_th_skill_star_pirate_skill_3: "进入战斗时，敌方舰队能量与动能武器§Y增益§!修正§R-25.00%§!\n持续§Y16.00§!£time£，冷却§R60.00§!£time£\n\n若战斗获胜，窃取少量的敌方§Y随机一项§!资源"
 leader_trait_shinmyoumaru: "一寸法师的后裔"
 leader_trait_shinmyoumaru_desc: "她拥有使用万宝槌程度的能力，是一寸法师的后裔，拥有万宝槌。万宝槌只有小人族可以使用，能够实现使用者的愿望，然而，在实现愿望的同时，必会给予其同等的代价。"
 leader_trait_kagerou: "竹林的Loup-Garou"
 leader_trait_kagerou_desc: "互助组织“草根妖怪网络”的成员之一，拥有在满月之夜变身为狼程度的能力，变身之后实力变强。虽然不擅长战斗，但狼化能够提升体能的同时还可以保持冷静，甚至召唤出狼的影子，并指挥它们扑向某个特定目标。"
 leader_trait_seija: "逆袭的天邪鬼"
 leader_trait_seija_desc: "性格扭曲的天邪鬼，有着“为叛逆而叛逆”的天性，总想着和其他人相反的事情。她的野心是把幻想乡整个翻转过来，实现“下克上”，从而建立由弱者说了算的世界。\n\n当然，她并不是真的想造反或下克上，也并不是想改变这个社会，而只是处于叛逆期，从与社会作对汲取乐趣，甚至说不定只是为了自己的身份才做出这些事。"
 leader_trait_sp_leader_subtitle_ag: "☯传奇特质☯\n£touhou_ancient_knowledge£§P通用类别§!"
 leader_trait_touhou_ancient_knowledges: "§P古代知识§!"
 leader_trait_touhou_ancient_knowledges_desc: "$touhou_ag_leader_trait_title$这位领袖知晓有关某个业已灭绝的§P先进古代文明§!与一些§E先进外星势力§!的知识，因此在对抗某些敌人时能取得更大优势。"
 leader_trait_touhou_ancient_knowledges_commander_custom_tooltip: "$t$—对§P古代文明造物§!和§M虚境侵军§!伤害: §G+50%§!"
 leader_trait_th_expertise_spirit_power: "专长: §U灵力科技§!"
 leader_trait_th_expertise_spirit_power_desc: "$touhou_common_leader_trait_title$这位领袖尤其擅长研究灵力领域的科技，她是这一领域的专家。"
 leader_trait_lunar_capital_player: "月之都行政主官"
 leader_trait_lunar_capital_player_desc: "她在月之都担任高官，却不会经常在外界面前出现。"
 leader_trait_touhou_moon_van: "净土澄澈之海"
 leader_trait_touhou_moon_van_desc: "能思考的芦苇如果终止思考，恐怕这一切便能成为一片净土吧。"
 leader_trait_touhou_moon_van_skill: "进入战斗后，获得相当于当前拥有护盾§Y10.00%§!的['concept_touhou_block',§E格挡§!]，持续§Y8.00§!£time£。"
 leader_trait_touhou_lunarian: "月之民"
 leader_trait_touhou_lunarian_desc: "舍弃了寿命，致力于消除生与死，去除污秽，因而可以永远地活着。"
 leader_trait_lunar_godness: "天津神"
 leader_trait_lunar_godness_desc: "这位领袖依靠信仰获得神力，是强大的天津神。"
 leader_trait_gensokyo_godness: "国津神"
 leader_trait_gensokyo_godness_desc: "这位领袖依靠信仰获得神力，是强大的国津神。"
 leader_trait_sagume: "招来口舌之祸的女神"
 leader_trait_sagume_desc: "她是月之民，虽然算是神灵，但是其性质非鬼非神亦非精灵，是天邪鬼的一种，也是位居天邪鬼之上的神灵。她也同时拥有天津神、国津神双方的属性。曾经多次试图利用幻想乡，使幻想乡每每陷入或差点陷入危机。 "
 leader_trait_sagume_hull_mult: "$t$-§BLunar Capital§! Ship Hull Points: §G+50%§!"
 leader_trait_sagume_skill: "具备符卡能力：§P「孤翼的白鹭」§!\n\n舰队中存在£military_ship£§H暗星幻梦§!时：\n$tt$获得§H双重武器系统§!子系统效果\n$tt$获得§H舰队修复系统§!子系统效果"
 leader_trait_sagume_1: "逆转的命运之轮"
 leader_trait_sagume_1_desc: "从口中说出便可使事态逆转程度的能力，一旦她说了某个事态，尤其是说有关的人，这个事态就会向反方向发展，本能成功的事会失败，坏事则会变成好事。由于能力的缘故，她性格寡言，甚至在梦中也是如此。"
 leader_trait_sagume_1_skill: "获取敌方§Y25.00%§!的能量、灵力伤害修正，持续§Y10.00§!£time£。"
 leader_trait_hina: "秘神流雏"
 leader_trait_hina_desc: "收集厄运的神明。所谓的疫病神。不管是人类还是妖怪只要靠近了她就会变得不幸。但是，她本人却完全没有恶意。倒不如说她是个待人友好的神明。收集厄运的本意，也只是为了不让厄运转移到人类身上。"
 leader_trait_hina_tooltip: "这个特质的效果会随着收集的§Y厄运§!增加而§G变强§!。"
 leader_trait_hina_fleet: "§H幻象§!"
 hina_doll: "幻象"
 hina_doll_plural: "幻象"
 hina_doll_desc: "人偶。"
 leader_trait_hina_doll: "诅咒的雏人偶"
 leader_trait_hina_doll_desc: "为了厄运不再回到人类，通过回收顺流而下的雏人偶，收集并看守着厄运，最终将其交诸众神。并且，收集的厄运可以成为她的力量。"
 leader_trait_hina_doll_skill: "具备符卡能力：§M厄符「厄神大人的生理节律」§!\n\n能够§H阻止领袖获得负面特质§!，不过为每位领袖阻隔厄运需要§Y360.00§!£time£冷却。\n阻隔厄运时，会将厄运收集起来，并且每增加§Y1.00§!点厄运，$touhou_hina_doll$与$NAME_hina$的能力都会得到增强。\n当前已经收集的厄运：§M[Owner.touhou_hina_skill_factor]§!"
 touhou_hina_block_negative_trait: "§Y已阻隔厄运§!"
 touhou_hina_block_negative_trait_desc: "§Y键山雏§!成功运用自己的能力阻止$LEADER|Y$获得负面特质，下次为这位领袖阻隔厄运需要§Y360.00§!£time£冷却。"
 leader_trait_touhou_effected_by_dream: "这个特质的效果随§Y领袖['concept_doremy_level',§E梦境等级或食梦等级§!]§!的提升而§G增强§!。"
 leader_trait_dream_soul: "梦魂"
 leader_trait_dream_soul_desc: "哆来咪手上的梦魂，象征着梦境世界的力量。"
 leader_trait_dream_soul_skill: "根据§H当前统治者§!的效果，提供§G与之相似的效果§!。"
 leader_trait_dream_soul_skill_sp: "若当前统治者不是§H东方统治者领袖§!，则§R不具备任何效果§!。"
 leader_trait_dream_world: "梦境居民"
 leader_trait_dream_world_desc: "这位领袖是梦境世界的居民。"
 leader_trait_dream_eater: "食梦者"
 leader_trait_dream_eater_desc: "梦境之貘能够食梦，支配梦境世界的居民协助我们。"
 leader_trait_dream_master: "造梦者"
 leader_trait_dream_master_desc: "梦境之貘能够造梦，支配梦境世界的居民协助我们。"
 leader_trait_doremy_level: "梦境等级"
 leader_trait_doremy_level_desc: "在深层的梦境里，哆来咪会发挥更强的实力。"
 leader_trait_doremy_level_skill_1: "进入战斗后，哆来咪将生成沉睡的§Y梦境幻象§!，冷却§I180.00§!£time£。"
 leader_trait_doremy_level_skill_2: "§Y哆来咪§!每§Y8.00§!£time£增加§Y1.00§!层['concept_doremy_level']，最高§Y3.00§!层。"
 leader_trait_doremy_level_skill_3: "若§Y30.00§!£time£内，§Y梦境幻象§!未被击破，哆来咪进入['concept_doremy_owner']状态。"
 leader_trait_doremy_level_skill_4: "若§Y30.00§!£time£内，§Y梦境幻象§!遭到击破，哆来咪进入持续§Y8.00§!£time£的眩晕状态。"
 leader_trait_doremy_level_skill_display: "当前哆来咪的['concept_doremy_level']：§H[Owner.get_touhou_dream_level]§!"
 touhou_dream_level: "[Owner.touhou_dream_level]"
 leader_trait_doremy_sweet: "支配梦境之貘"
 leader_trait_doremy_sweet_desc: "她是貘妖怪，拥有食梦、造梦程度的能力，能够消灭、创造、替换一切生物的梦境，并且支配者梦境世界。不过，她却自称无法强制替换梦境，无法创造新梦境，最多只能唆使梦境居民去战斗。"
 leader_trait_doremy_sweet_book: "梦日记"
 leader_trait_doremy_sweet_book_desc: "梦之支配者的梦日记，据说记录着所有人的梦，因此似乎具备着一些奇特的用法。"
 leader_trait_doremy_sweet_book_skill: "具备符卡能力：§P「在最后的周日所做的噩梦」§!\n\n如果§H已经与该种敌人交过手§!，则提升§Y10.00%-20.00%§!的§H灵力武器伤害§!，持续§Y30.00§!£time£。\n获得相当于当前护盾上限§Y25.00§!%的§H临时屏障§!。"
 doremy_sweet_book_phantom: "梦境幻象"
 doremy_sweet_book_phantom_plural: "$doremy_sweet_book_phantom$"
 doremy_sweet_book_phantom_cap: "$doremy_sweet_book_phantom$"
 leader_trait_kosuzu: "识文解意的爱书人"
 leader_trait_kosuzu_desc: "她是人类村落中的借书屋铃奈庵的店主女儿兼店员，主要负责书籍的出租和贩售工作。有些胆小，但好奇心旺盛，喜爱收集妖魔书，更拥有着§Y“可以读懂、理解任何文字的能力”§!。"
 leader_trait_kosuzu_book: "书籍收集者"
 leader_trait_kosuzu_book_desc: "这位领袖善于收集书籍，尤其是妖魔书，并且运用其中的知识协助我们的研究。"
 leader_trait_kosuzu_book_skill: "每当研究§G20.00§!次§H同种循环科技§!时，她将运用能力§Y额外研究一次科技§!。"
 leader_trait_kosuzu_book_skill_2: "研究§Y灵力循环科技§!时，额外进行研究的所需的研究次数减少§Y5.00§!次。"
 touhou_kosuzu_country: "§P借书屋铃奈庵§!"
 th_leader_sp.1.name: "§H$NAME_kosuzu$§!"
 th_leader_sp.1.desc.1: "欢迎来到借书屋！\n\n有什么感兴趣的书籍吗？\n这里基本上什么类型的都有哦。"
 th_leader_sp.1.desc.2: "欢迎，§H[Root.Species.GetName]§!。\n\n早上好，或者，你那边应该是下午，或者晚上，或者其实并不是特别需要这样区分时间？\n总之，愿你能找到想找的书。"
 th_leader_sp.1.desc.3: "欢迎，§H[Root.Species.GetName]§!。\n\n我的能力观测到的活动数据表明临近星系的天体活动相当稳定，看起来这将会是相当一段时间的好天气呢。\n这次有什么想要的书呢？"
 th_leader_sp.1.desc.4: "感谢你的协助，§H[Root.Species.GetName]§!。\n\n最近铃奈庵的访客明显比之前多了呢。\n我也招募了些新的店员来帮助我进行工作。"
 th_leader_sp.1.a: "我们想要借阅一本书。"
 th_leader_sp.1.a.response: "这本应该很合适。\n\n记得要在§H1800.00§!£time£后归还哦。\n然后，还需要什么呢？"
 th_leader_sp.1.b: "我们想要暂停科研工作。"
 th_leader_sp.1.b.alt: "我们想要继续科研工作。"
 th_leader_sp.1.b.response: "明白了。\n\n那我就不再协助你们解读科研数据了。"
 th_leader_sp.1.b.alt.response: "好的。\n\n那我就开始协助你们解读科研数据了。"
 th_leader_sp.1.b.effect: "§H$NAME_kosuzu$§!将使用自己的能力协助我们解读科研数据，§R以下效果将失效§!：\n\n$t$—$leader_trait_kosuzu_book_skill$\n$t$—$leader_trait_kosuzu_book_skill_2$"
 th_leader_sp.1.b.alt.effect: "§H$NAME_kosuzu$§!将使用自己的能力协助我们解读科研数据，§G以下效果将生效§!：\n\n$t$—$leader_trait_kosuzu_book_skill$\n$t$—$leader_trait_kosuzu_book_skill_2$"
 th_leader_sp.1.c: "有没有什么珍贵的书籍抄本呢？"
 th_leader_sp.1.c.response: "嗯哼...\n\n这个应该很合适了。"
 th_leader_sp.1.c.effect: "§H获得一个随机的['concept_specimens',书籍抄本]。§!"
 th_leader_sp.1.c.fail: "$TRIGGER_FAIL$§R已经获取了全部的珍贵书籍抄本。§!"
 th_leader_sp.1.c.fail.cooldown: "$TRIGGER_FAIL$§R我们近期刚获取了一本抄本。§!"
 th_leader_sp.1.d: "可以翻阅下《幻想乡缘起》吗？"
 th_leader_sp.1.d.response: "嗯哼...\n\n我觉得把这件物品交给你们保管应该更合适点？\n麻烦妥善储藏它了。"
 th_leader_sp.1.e: "听说你收藏了不少妖魔书，可以展示一下吗？"
 th_leader_sp.1.e.fail: "$TRIGGER_FAIL$§R我们近期已经了解过了这方面的知识§!"
 th_leader_sp.1.f: "能协助我们的太空战斗吗？"
 th_leader_sp.1.f.response: "可以。\n\n我试试召唤妖魔书里的东西协助你们，应该对你们有所帮助？"
 th_leader_sp.1.f.fail: "$TRIGGER_FAIL$§R当前没有交战中的舰队§!"
 th_leader_sp.1.exit: "就先聊到这里吧。"
 th_leader_sp.1.exit.response: "好的，欢迎下次光临哦。"
 r_touhou_gumon_shiki: "幻想乡缘起"
 r_touhou_gumon_shiki_desc: "记载了幻想乡的实态。\n\n妖怪们无法准确记住过去，幻想乡里见不到真实。因为这样，不了解妖怪的实态，人类只有害怕的份儿。若能更了解妖怪的能力和做出相应对策，回避危险的地方，认识擅长降伏妖怪的人类，那就能不用战战兢兢地生活了吧。稗田家，为了保障人类生活安全，每一百二十至一百八十年，对惹人注目的妖怪进行记录。这就是《幻想乡缘起》。"
