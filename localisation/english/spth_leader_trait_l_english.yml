 leader_trait_matara_1_skill_sub_4: "§B「里·极端寒冬」§!"
 leader_trait_matara_1_skill_sub_1_desc: "进入战斗后，获得相当于自身最大护盾/装甲/船体§Y5.00%§!的每日再生修正，持续§Y12.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L植物发芽抽枝，植物的生命力溢出的季节。是樱花烂漫盛放，希望与不安交织的最为富有未来感的季节。§!"
 leader_trait_matara_1_skill_sub_2_desc: "进入战斗后，所指挥舰队的灵力武器伤害加成§H修正§!提升§Y30.36%§!，灵力武器射速加成§H修正§!提升§Y99.61%§!，持续§Y6.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L灼热的阳光倾泻而下，热情与热气洋溢的季节。是既有蒸笼一样的酷暑，又有冲洗一切的阵雨的最为表情丰富的季节。§!"
 leader_trait_matara_1_skill_sub_3_desc: "进入战斗后，所指挥舰队的移速与闪避大幅度提升，并且舰船武器射程§H修正§!提升§Y49.50%§!，持续§Y15.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L野菜和果实开始结果，能回望一年成果的季节。是清一色绿的树木染上异色，开始为新生做准备的最为神秘的季节。§!"
 leader_trait_matara_1_skill_sub_4_desc: "进入战斗后，对全体敌方舰队召唤一次§B恋符「极限火花冻结」§!打击，对护盾与装甲造成§Y3840.00-7680.00§!点伤害，并且可以受到§Y50.00%§!的灵力与魔炮武器伤害加成。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L大地被纯白覆盖，万物沉眠的季节。是生命力渐渐衰弱，却能窥见这个世界本来样貌的最为风雅的季节。§!"
