 leader_trait_maribel_hearn: "Dr. Latency's Unsettling Eye"
 leader_trait_maribel_hearn_desc: "Member of an occult club known as \"Hifuu Club\": People of her family possessed spirit-sense since long ago, and she inherited such ability to perceive barriers across the world, the \"boundaries\". Therefore, she dedicates herself to exploring these boundaries in the Age of Science alongside Renko Usami."
 leader_trait_renko: "Magician of Starry Sky"
 leader_trait_renko_desc: "Member of an occult club known as \"Hifuu Club\": She can tell time by looking at the stars and determine location by looking at the Moon. She's doing research related to string theory. Therefore, she dedicates herself to exploring boundaries in the Age of Science alongside Maribel Hearn."
