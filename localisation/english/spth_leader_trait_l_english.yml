 leader_trait_momiji_skill: "具备符卡能力：§Y犬符「天狗铁壁」§!\n\n§H指挥军用舰队进入战斗后:§!\n$t$在所有舰船附近张开结界护盾，持续§Y10.00§!£time£\n$t$结界保护下的舰船将处于§G无敌状态§!，但§R失去全部舰船移速增益§!\n$t$§H若§Y32.00§!半径内存在敌方舰船:§!\n$tt$主动解除护盾，对范围内敌人造成§R大量伤害§!并且施加['concept_terrify',§E眩晕§!]\n再次发动需要§R120.00§!£time£冷却。"
