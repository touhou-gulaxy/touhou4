 th_leader_sp.2.name: "借书屋"
 th_leader_sp.2.desc: "近期，在§Y[This.Capital.GetName]§!上有一家借书屋开张了，其中储存了大量的妖魔书与我们帝国图书馆未能收藏的书籍。工作人员实地探访后发现，其店主居然是§Y$NAME_kosuzu$§!，在进行了简单的寒暄后，她提出了要回到我们身边的请求。"
