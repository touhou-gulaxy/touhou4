 leader_trait_touhou_from_sky_desc: "这位领袖是来自于天界的仙人之一。"
 leader_trait_lku: "美丽的绯之衣"
 leader_trait_lku_desc: "她生活在龙的世界与人类的世界之间，居住在雷云之中，拥有解读空气程度的能力，能够立即掌握和适应身处的环境。此外，她也负责预报地震和天气。"
 leader_trait_lku_skill: "具备符卡能力：§B绯星符「真相不明的落雷」§!\n\n指挥军用舰队进入战斗后:\n$t$§Y完全抹除§!敌方全部的护盾与装甲，并且§Y修复§!己方全部护盾与装甲。\n$t$§Y6.00§!£time£内会尽可能§Y阻止§!敌方护盾与装甲的再生。\n$t$触发后的§R90.00§!£time£内无法再次触发。"
 leader_trait_lku_1: "龙宫讯音"
 leader_trait_lku_1_desc: "她是龙的代言人，能听懂龙的语言，负责将龙神说出的重要的信息透露给人类和妖怪，还能稍微借用一下龙神的力量。"
 leader_trait_lku_1_skill: "具备符卡能力：§B云界「玄云海的雷庭」§!\n\n指挥军用舰队进入战斗后:\n$t$舰船的['concept_ship_spth_extra_life']触发后，对敌人的装甲造成最大装甲值§Y1.00%§!的伤害。\n$t$有§Y19.00%§!概率对其护盾造成最大护盾值§Y1.00%§!的伤害。\n$t$源自某个§P已经消亡古代文明§!的致命伤害抗性技术也能触发此效果。"
 NAME_touhou_ac_dragon_god_country: "§P天界回音§!"
 leader_trait_lumiya_boss: "堕入极暗与疯狂的吃人妖怪"
 leader_trait_lumiya_boss_desc: "因超级旗舰的能力放大导致精神失控与力量暴走的黑暗吃人妖怪。"
 leader_trait_nue: "正体不明的妖怪"
 leader_trait_nue_desc: "她拥有使原形无法识别程度的能力，本身正是一种真相不明的妖怪。这种能力可以通过施加不明的因子，将其他物体、生物的真相消去，即夺取其形态、声音、气味，仅仅只留下行动。\n\n消去真相的谜之物体，在每个人看来都是各不相同的。在目击者的心中，随意的补完外形，最终以仅能让目击者接受的面貌出现在他面前。虽说是没有鸟的真相的「飞在空中的谜之物体」，结果还是能看出来这是一只鸟的形状。只不过，这种情况下看到的是一只不知在哪里的飘忽且不安定的鸟。"
 leader_trait_nue_skill: "具备符卡能力：§l未知「轨道不明的鬼火」§!\n\n军用舰队处于隐身状态时:\n$t$每个月积累一定数量§P不明的因子§!。\n$t$§P不明的因子§!会在解除隐身时§R全部消耗§!，并且提供§Y基于消耗量的伤害加成§!。\n军用舰队主动解除隐身状态时:\n$t$['concept_terrify',§Y瘫痪§!]星系内敌军，持续时长取决于§P不明的因子§!消耗量。"
 leader_trait_nue_ag_tt: "封兽鵺指挥的§P古代舰船§!将可以额外使用§l主动隐身§!特殊动作。"
 leader_trait_nue_1: "未确认幻想飞行少女"
 leader_trait_nue_1_desc: "此外，她还拥有召唤消去敌弹的UFO的能力。看过很多UFO的照片吧？但是从来没发生过宇宙战争，因为UFO只是单纯想飞才飞而已。"
 leader_trait_nue_1_skill: ""
