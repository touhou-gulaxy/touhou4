 leader_trait_linshi: "虚空羽翼"
 leader_trait_linshi_desc: "原本是██文明所使用的先进舰载人工智能，用舰船零件拼凑出了一具机械天使的身体。她有着与自身体型明显不相称的重型火力，并且精通舰队指挥与作战。"
 leader_trait_linshi_skill: "具备符卡能力：§H绯红「时段丢失」§!\n\n指挥军用舰队进入战斗后:\n$t$获得相当于自身§H最大护盾值§!§Y25.00%§!的['concept_touhou_block',§E格挡§!]。\n$t$持续§G30.00§!£time£，冷却§R120.00§!£time£"
 leader_trait_linshi_1: "破碎的星尘"
 leader_trait_linshi_1_desc: "这位舰载人工智能所在的舰船遭受了时空乱流的损坏，本体一直在维修自身和舰船，因此外派出去的实际上只不过是投影子个体，然而其战斗能力与指挥水平依旧非常卓越。"
 leader_trait_linshi_1_skill: "具备符卡能力：§H黑洞「光子吞噬」§!\n\n['concept_ship_spth_extra_life']触发时:\n$t$在§Y180.00§!£time£内如果为§H第一次触发§!，则本次将不消耗['concept_ship_spth_extra_life']。\n$t$额外获得相当于§H最大护盾值§!§Y100.00%§!的['concept_touhou_barrier']。"
 leader_trait_wandering_in_the_void: "太虚流浪"
 leader_trait_wandering_in_the_void_desc: "这位领袖曾经统率着在虚空之中流浪的家园舰队，因此具备非常丰富的生产与应急维修经验。"
 leader_trait_wandering_in_the_void_skill: "给予§Y$leader_trait_shipbreaker$§!特质§H额外效果§!：根据§H敌舰大小§!等情况额外获得§Y更多资源§!。"
