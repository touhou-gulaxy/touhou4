 leader_trait_mugetsu: "§B梦幻少女§!"
 leader_trait_mugetsu_tt: "每次舰队战斗取胜后: \n$t$-叠加§Y1.00§!层连击效果。\n$t$-战斗时每有§Y1.00§!层连击效果，灵力武器伤害射速提升§Y10.00%§!，持续§Y20.00§!£time£。\n$t$-§Y4.00§!次战斗或战斗失败后清空层数且最多只能叠加§Y3.00§!层。"
 leader_trait_mugetsu_desc: "来自梦幻世界的恶魔，自称为女仆，但是实际能力与身份不明。"
 leader_trait_gengetsu: "§R恶魔少女§!"
 leader_trait_gengetsu_tt: "进入战斗后对敌方舰队: \n$t$-召唤一次§B幻光「调谐魔炮」§!打击，造成§Y2214.00-3036.00§!点船体伤害。\n$t$-可以受到§Y50.00%§!的灵力与魔炮伤害加成。"
 leader_trait_gengetsu_desc: "来自梦幻世界的恶魔，自称为梦幻界的主人，但是实际能力与身份不明。"
 leader_trait_gengetsu_and_mugetsu: "梦幻界的双子星"
 leader_trait_gengetsu_and_mugetsu_tt: "若星系内同时存在§B梦月§!与§R幻月§!指挥的舰队: \n$t$-在星系中心生成存在§Y30.00§!-§Y60.00§!£time£的阴阳玉。\n$t$-若阴阳玉在消失前被击破，则生成存在§Y180.00§!£time£的§M异界风暴§!。"
 leader_trait_gengetsu_and_mugetsu_desc: "最凶最恶的二姐妹。"
