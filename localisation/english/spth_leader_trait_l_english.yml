 leader_trait_th_dragon_god: "龙神之心"
 leader_trait_th_dragon_god_desc: "$touhou_common_leader_trait_title$这位领袖与龙神之间建立了某种基于灵能的精神联系，强化了这位领袖的心灵与灵力。"
 leader_trait_touhou_automation_champion: "自动化专家"
 leader_trait_touhou_automation_champion_desc: "$touhou_common_leader_trait_title$优化对这位领袖至关重要。而自动化便是关键，一切都可以自动化。无论是通过先进的机器人还是自动化产业线，任何途径都将被探索。"
 leader_trait_touhou_scholar_of_war: "战争学者"
 leader_trait_touhou_scholar_of_war_desc: "$touhou_common_leader_trait_title$这位领袖喜欢重返旧战场，从前人的成功和失误中汲取养分。"
 leader_trait_touhou_supreme_admiral: "结界调度大师"
 leader_trait_touhou_supreme_admiral_desc: "$touhou_common_leader_trait_title$这位领袖擅于将舰队中舰船的结界护盾进行串联，从而获得极大的战术优势。"
 leader_trait_touhou_supreme_admiral_skill: "基于£military_ship£§Y军用舰船数量§!获得额外§Y$MOD_SHIP_SHIELD_ADD$§!、§Y$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$§!与$MOD_SHIP_DAMAGE_REDUCTION_ADD$。"
 leader_trait_touhou_repair_crew: "舰队维护专家"
 leader_trait_touhou_repair_crew_desc: "$touhou_common_leader_trait_title$这位领袖擅长对舰船进行战时维与日常维护，只不过需要额外的消耗一些资源。"
 leader_trait_touhou_eletronic_countermeasures: "§U电子对抗§!"
 leader_trait_touhou_eletronic_countermeasures_desc: "$touhou_ultra_leader_trait_title$这位领袖深谙电子对抗手段在太空战斗中的重要性，可以依靠电子战手段为我方争取大量优势。"
 leader_trait_touhou_eletronic_countermeasures_skill: "为§Y超大型与泰坦级§!§H符卡武器§!安装['concept_touhou_weapon_emp_charge']。"
 leader_trait_touhou_fanatic: "战狂"
 leader_trait_touhou_fanatic_skill_1: "§M群星的光辉亦表亦里§!"
 leader_trait_touhou_fanatic_skill_2: "§M羔羊的内心亦强亦弱§!"
 leader_trait_touhou_fanatic_skill_3: "§M诡秘的幻景亦虚亦实§!"
 leader_trait_touhou_fanatic_desc: "$touhou_ultra_leader_trait_title$这位舰队司令狂热地想摧毁敌人，为此几乎陷入了疯狂。虽然在制造死亡方面非常有效，但其鲁莽常常导致双方的大量伤亡。"
 leader_trait_touhou_expert_survivalist: "殖民先锋"
 leader_trait_touhou_expert_survivalist_desc: "$touhou_ultra_leader_trait_title$这位领袖格外的善于发展我们的殖民地，并且可以协助我们的殖民地展开初期建设。"
 leader_trait_touhou_deep_space_explorer: "鹰眼循迹"
 leader_trait_touhou_deep_space_explorer_desc: "$touhou_ultra_leader_trait_title$这位领袖格外擅长解码分析各种深空信号，能探索最遥远的边疆、也能为我们提供预警或者战术优势。"
 leader_trait_touhou_advance_phy: "幻想魔法使"
 leader_trait_touhou_advance_phy_desc: "$touhou_advanced_leader_trait_title$魔法使中的佼佼者，长期的魔导研究经历使其对物理学研究有着独到的见解。"
 leader_trait_touhou_advance_eng: "河童重工技术官"
 leader_trait_touhou_advance_eng_desc: "$touhou_advanced_leader_trait_title$河童中的高级技术员，长期的研究经历使其对工程学研究有着独到的见解。"
 leader_trait_touhou_advance_soc: "相对性精神学者"
 leader_trait_touhou_advance_soc_desc: "$touhou_advanced_leader_trait_title$这位领袖专攻相对性精神学，长期的研究经历使其对社会学研究有着独到的见解。"
 leader_trait_touhou_rift_warped: "星界护盾"
 leader_trait_touhou_rift_warped_desc: "这位领袖善于运用星界护盾，从而显著的提升舰队抗击打能力。"
