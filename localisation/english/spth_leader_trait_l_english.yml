 leader_trait_touhou_spawn_drone: "无人机协助"
 leader_trait_touhou_spawn_drone_desc: "$touhou_advanced_leader_trait_title$这位领袖能够调度无人机来协助己方作战。"
 leader_trait_touhou_spawn_drone_skill_1: "§H进入战斗后：§!召唤§Y1-2§!队在§Y10.00§!£time£后会返航的维护无人机协助作战。"
 leader_trait_touhou_spawn_drone_skill_2: "§H进入战斗后：§!召唤§Y1-3§!队在§Y15.00§!£time£后会返航的维护无人机协助作战。"
