 concept_spth_barrier_overloaded: "Planetary Barrier Overload"
 concept_spth_barrier_overloaded_desc: "When the Planetary Barrier sustains more stress than its capacity, it's called \"overload.\" the output and upkeep modifier from Faith will change.\nWhen the stress is 100-200% of the capacity, the output will marginally increase (you may regard it as overclocking), but when the stress is greater than 200% of the capacity, the output will significantly decrease to an extent that is far below normal.\nAt the same time, the upkeep increases proportionally to the stress when the barrier is overloaded."
 concept_spth_faith_strength: "Faith Points"
 concept_spth_faith_strength_desc: "Faith points are a planet modifier naturally generated by the sapient pops. Certain jobs also provide additional faith points. As the planetary faith level increases, various jobs, districts, and buildings from this mod will have an increase in both output and upkeep."
 concept_spth_faith_strength_pressure: "Faith Pressure"
 concept_spth_faith_strength_pressure_desc: "Faith pressure is stress occurring from the faith supply needed to maintain the normal operation of various \"fantasy entities.\" \nWhen faith pressure is §Gless than§! faith points produced on the planet, the spirit power upkeep on the planet will slowly increase as the faith pressure increases. \nWhen faith pressure §Rexceeds§! the faith points, the spirit power upkeep will increase significantly at an unbearable speed and may cause various malicious incidents."
