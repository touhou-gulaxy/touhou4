 touhou_shroud_crisis: "§MShroud Invaders§!"
 lunar_jumpdrive_gateway_blocked: "Jump Gate locked due to psionic activity"
 touhou_lunar_psi_extra_44: "World Without Defilement"
 touhou_lunar_psi_extra_44_desc: "§R能思考的芦苇如果终止思考，恐怕地上便能成为一片较为洁净的草原吧。§!\n与$touhou_extra_lunar_psi$交战中的舰队越多，$touhou_extra_lunar_psi$将会获得越来越高的射速加成。"
