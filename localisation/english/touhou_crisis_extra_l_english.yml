 tech_crisis_dreamworld: "§U梦境世界核心技术§!"
 tech_crisis_dreamworld_desc: "这项科技不应该出现于正常的游戏流程，但既然你已经用控制台了等拆特手段了，请享受吧。。£th_huaji£"
 mod_touhou_difficulty_shield_crisis_psionic: ""
 mod_touhou_difficulty_armor_crisis_psionic: ""
 touhou_extra_generic: "通用设置"
 touhou_extra_generic_tooltip: "这将使你踏上万劫不复的深渊……准备好面对来自群星之间的恶意了吗？"
 touhou_generic_extra: "§R通用EXTRA设置§!"
 touhou_generic_extra_desc: "这些额外难度设置将被应用于游戏全局或者本MOD的任何势力……"
 touhou_generic_extra_11: "混沌熵增"
 touhou_generic_extra_11_desc: "舰队战斗时，如果你处于星系地图视图，将会随机重骰敌我舰队的各项加成，以及发生一些随机事件……"
 touhou_generic_extra_12: "时间封锁"
 touhou_generic_extra_12_desc: "每当你在暂停时执行某些操作，都会累积§R时间封锁§!层数，一旦到达一定层数，可能会发生一些可怕的事情……"
 touhou_generic_extra_13: "不详星空"
 touhou_generic_extra_13_desc: "进行舰队战斗时，有概率暂时放逐你的部分参战舰队或使舰队司令遭受诅咒，并在一段时间后回归……"
 touhou_generic_extra_14: "铺张浪费"
 touhou_generic_extra_14_desc: "你的星球基础设施建造、维护，岗位维护和一部分舰船维护修正无法低于§R+6.66%§!，你的星球建造速度和建设时间将会根据建筑数量而提升……"
 touhou_generic_extra_1: "+运营困难+"
 touhou_generic_extra_1_tooltip: "这将极大的干扰你的运营……"
 touhou_generic_extra_15: "迷雾萦绕"
 touhou_generic_extra_15_desc: "有概率暂时屏蔽你的部分快捷键操作，且持续期间你只能看清视野中心的一小部分区域……"
 touhou_generic_extra_16: "星空大盗"
 touhou_generic_extra_16_desc: "魔理沙偶尔会偷走你的部分资源，也可能偷的没那么少……？"
 touhou_generic_extra_17: "海市蜃楼"
 touhou_generic_extra_17_desc: "你新殖民的殖民地，将会失去一部分可建设区划，并且星球上有可能会刷出随机障碍……"
 touhou_generic_extra_18: "财政紧张"
 touhou_generic_extra_18_desc: "你的所有产出会被直接清零，但是地图上会生成特殊项目，研究可以获得资源"
 touhou_generic_extra_2: "+黑暗弥漫+"
 touhou_generic_extra_2_tooltip: "我怎么打不过对面……"
 touhou_generic_extra_21: "创伤应激"
 touhou_generic_extra_21_desc: "面对击杀过你的舰船的敌人，将会受到负面修正，且被击杀的越多影响越严重。"
 touhou_generic_extra_22: "命若繁星"
 touhou_generic_extra_22_desc: "你舰船的最大船体值、护盾与装甲上限一定程度上下降，且更容易受到伤害。"
 touhou_generic_extra_23: "亡语爆破"
 touhou_generic_extra_23_desc: "你击杀或瘫痪的敌方舰船将会爆炸，对附近的友军舰船造成百分比真实伤害。"
 touhou_generic_extra_24: "愈战愈怂"
 touhou_generic_extra_24_desc: "舰队战斗将会消耗舰队的耐久值，随着耐久值的下降舰队战斗力将会下降的越来越快。"
 touhou_generic_extra_25: "集群意识"
 touhou_generic_extra_25_desc: "敌方舰队进入战斗或被摧毁时有概率生成会存在一段时间的黑暗镜像。"
 touhou_generic_extra_26: "复生怒火"
 touhou_generic_extra_26_desc: "敌方舰船摧毁你的舰船后，会获得可以不断叠加的伤害加成。"
 touhou_generic_extra_27: "小航海亡"
 touhou_generic_extra_27_desc: "你的舰船抵达新星系时会受到负面效果影响且损失护盾，通过星门、跃迁等手段时可能会随机出现在距离目的地较远的星系中。"
 touhou_generic_extra_28: "末日终结"
 touhou_generic_extra_28_desc: "你的非东方舰船在交战中将会暂时§R受封于来自炼狱的至纯恶意§!。\n敌方舰船被摧毁时会生成逐渐扩张、可以覆盖多个星系的炼狱结界。\n炼狱结界内的舰船将会每天受到§R66§!次真实伤害，该伤害无视任何形式的减伤。\n炼狱结界在持续一段时间后会结束，除非内部有舰船存活。\n一旦有一定量舰船被摧毁，部分特殊舰船将会§G超越生死§!。"
 touhou_generic_extra_1_expand: ""
 touhou_generic_extra_2_expand: ""