 touhou_lunar_psi_extra_11_desc: "As more of the $touhou_extra_lunar_psi$ fleets are destroyed in one system, negative effects will build up."
 touhou_lunar_psi_extra_12_desc: "There's a chance for ships killed by $touhou_extra_lunar_psi$ to be converted into new psionic ships."
 touhou_lunar_psi_extra_13_desc: "Ships of $touhou_extra_lunar_psi$ can split into smaller psionic ships when destroyed."
 touhou_lunar_psi_extra_14_desc: "$touhou_extra_lunar_psi$ can benefit from §Renemy spirit power weapon attack speed modifier§! if one battle has taken long."
 touhou_lunar_psi_extra_21_desc: "$touhou_extra_lunar_psi$有概率控制境内的宜居星球。"
 touhou_lunar_psi_extra_22_desc: "在你使用跃迁后，$touhou_extra_lunar_psi$有概率直接折跃少量舰队发动攻击。"
 touhou_lunar_psi_extra_23_desc: "After victory in battle, there's a chance for $touhou_extra_lunar_psi$ fleets to call a small fleet for reinforcement."
 touhou_lunar_psi_extra_24_desc: "$touhou_extra_lunar_psi$ will receive a small reinforcement after bombardment and destruction of a colony."
 touhou_lunar_psi_extra_31_desc: "$touhou_extra_lunar_psi$ ships have a §G25%§! chance to not lose lives."
 touhou_lunar_psi_extra_32_desc: "$touhou_extra_lunar_psi$进入战斗后，将获得短时间的少量减伤效果。"
 touhou_lunar_psi_extra_33_desc: "$touhou_extra_lunar_psi$ may use a powerful psionic weapon to initiate attacks on us from the Shroud."
 touhou_lunar_psi_extra_34_desc: "$touhou_extra_lunar_psi$的残机恢复时间§G-50%§!"
 touhou_lunar_psi_extra_41_desc: "每一段时间，$touhou_extra_lunar_psi$会根据你的部分舰船设计，额外折跃少量复制舰队，并且其他舰船获得基于你该种舰船的舰容之和的固定减伤，直到复制舰队被全部摧毁。"
 touhou_lunar_psi_extra_42_desc: "§R究竟哪一边的月海才是真实的呢？还是整个月球都是虚假的露娜？§!\n你对$touhou_extra_lunar_psi$的战损比越高，$touhou_extra_lunar_psi$获得的加成将越来越高。"
 touhou_lunar_psi_extra_43_desc: "§R为何要用真实与虚幻的结界隔绝表里之月？月之民是否如此期盼呢。§!\n$touhou_extra_lunar_psi$在战斗中会召唤存在一段时间的§Y虚境之锚§!，若§Y虚境之锚§!被摧毁，将生成对敌人造成负面影响的§M灵能风暴§!。"
