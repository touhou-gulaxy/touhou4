l_english:
 START_SCREEN_HIFF: "This is the Age of Science, as dreamlike as it's magical.\n\nEven as science advanced to unprecedented heights, the human spirit could find no fulfillment.\nWhen the Great Hakurei Barrier was weakened through the activities of the Hifuu Club, the sages of Gensokyo quickly took advantage of this and exposed their realm to the outside world.\n\nAfter the cultural shock at the beginning, humans gradually accepted these beings of legend -- youkai and gods alike. Now, with the invention of the hyperdrive, this newborn civilization stands ready to step into the cosmos."
 touhou_hiff.2.name: "§UDr. Latency's Freak Report§!"
 touhou_hiff.2.desc: "The two who pushed the Age of Science to its present height, $NAME_renko$ and $NAME_maribel_hearn$, once recorded their journeys to investigate scattered boundaries in $r_th_latency$.\n\nYet within Naturalis Historia, several pages have already been lost. Perhaps there is a way for us to recover them."
 touhou_hiff.3.name: "§USpacetime rift§!"
 touhou_hiff.3.desc: "Suddenly, a spatial rift appeared in our home system. There, spacetime inclined toward converging into layers of overlapping dimensions. The boundary between spacetime structures becomes fragile and seems to connect these dimensions together.\n\nRenko and Merry sensed the existence of boundaries here. It might link to the missing pages of Naturalis Historia; maybe we should give them a try to passage."
 touhou_hiff_finish_latency_title: "§UComplete the Naturalis Historia§!"
 touhou_hiff_finish_latency_desc: "Some pages of the Swallowstone Naturalis Historia have already been lost. Maybe we can try to find them."
 touhou_hiff_finish_latency_pages: "§Gthe Unfinished Pages§!"
 touhou_rendaino: "§URendaino the Beginning§!"
 spth_astral_rift.30.name: "§UFamiliar Scene§!"
 spth_astral_rift.30.desc: "在进入裂隙后，引入眼帘的是一座生长着彼岸花的墓园。\n\n根据她们二人的回忆，这里似乎就是记忆中的“莲台野”，但是$NAME_renko$观测的结果似乎是在某个过去的时间点。\n\n「或许这里是某个平行时空中的莲台野？\n说不定还有平行时空版本的我们呢」"
 spth_astral_rift.30.a: "Amusing."
 CANNOT_EXPLORE_WITH_NOT_HIFF_CLUB: "$TRIGGER_FAIL$§ROnly the Hifuu Club two are capable of exploring this strange rift.§!"
 spth_astral_rift.31.name: "§UPassing on Through the Dendera Fields in the Night§!"
 spth_astral_rift.31.desc: "果不其然，这里似乎就是某个时间线略慢的平行时空。\n\n「是的，就是这个没错了。」\n似乎有什么令人耳熟的声音传来，然而随行人员却惊讶的发现刚刚还在身边的二人突然消失了，出现于了莲台野之中。\n\n她们二人似乎完全没有意识到这点，这处空间中仿佛在进行着某种场景重现，并且所有的人的视界都发生了变化。一阵恍惚后，发现来到了一个陌生的地方，而自己却无法动弹，在耳边却响起了声音。"
 spth_astral_rift.31.a: "What?"
 spth_astral_rift.32.name: "§UGirls' Secret Sealing Club§!"
 spth_astral_rift.32.desc: "Renko said, and showed me a notebook with some photos.\nWe came all the way here on a chilly autumn night, so it would be unfortunate if we couldn't find anything.\nThough, honestly, I hoped to avoid acting like grave-robbers.\n\n\"Merry, do you want to go see the entrance in Rendaino?\"\nIt was two days ago that she made the proposition.\nThe Hifuu Club, which only has two members, is a common, ordinary spirit medium club.\nYes, it's a group for mediums, but we don't perform any of the usual activities of such groups, like seances or exorcisms.\nFor that reason, we're considered a defective club by others, but the truth is..."
 spth_astral_rift.32.a: "..."
 spth_astral_rift.33.name: "§UAncient Temple of the Netherworld§!"
 spth_astral_rift.33.desc: "\"What is this entrance in Rendaino, Renko?\"\nI had never heard of there being any such thing in Rendaino, and she asked me so suddenly I couldn't think of anything else to say.\n\n\"Well, just take a look.\"\nRenko handed me a photo of an ancient temple. It was a temple I had never seen before.\n\n\"This is the Netherworld.\"\n\"How is it that you have a photo of the Netherworld?\"\n\"I've got a back and forth route, you know, Merry.\"\n\nI hadn't the faintest idea what sort of route it could be, but I figured that it was probably something like spirit photography with a participating corpse.\n\"Then, in this picture, if you look past the temple gate...\""
 spth_astral_rift.33.a: "..."
 spth_astral_rift.34.name: "§UIllusionary Night§!"
 spth_astral_rift.34.desc: "\"Look, right by this gate. On the other side of it, doesn't it obviously look just like our world?\"\nThe area she pointed at showed a nighttime field with a single gravestone visible.\nThe color of the atmosphere there was different from the rest of the picture. Certainly, it was the color of our world's...\nAlso, I wondered if I should tell her that the correct term is Sanmon gate rather than temple gate."
 spth_astral_rift.34.a: "..."
 spth_astral_rift.35.name: "§UMerry the Magician§!"
 spth_astral_rift.35.desc: "The truth of the Hifuu Club is that we are a group that exists in order to expose the boundaries that surround this world.\nAs there is the fear that it will upset the world's natural balance, however, such things are forbidden.\nDespite that, I can see the borders of these boundaries. I can see them without needing to do a single thing.\nI just see them, so it's an inevitability, isn't it?"
 spth_astral_rift.35.a: "..."
 spth_astral_rift.36.name: "§UUncanny Bird of the Moon, Illusion of the Bakeneko§!"
 spth_astral_rift.36.desc: "That reminds me, Renko mentioned \"an entrance in Rendaino\".\nDid she manage to use this photograph to find out where it was?\n\"It's simple. You can see that the moon and the stars are visible in this photograph, can't you?\"\nAccording to Renko, she can tell what time it is by the light of the stars and her location by looking at the moon.\nRenko is always telling me that my eyes are creepy. I think her eyes are the creepy ones."
 spth_astral_rift.36.a: "..."
 spth_astral_rift.37.name: "§UFlower of Past Days§!"
 spth_astral_rift.37.desc: "Red spider lilies are so creepy! I hate those flowers. I have ever since I was a child.\n\"The entrance is at the gravestone where red spider lilies grow thickest in Rendaino.\" For some reason, that phrase suddenly escaped my lips.\nRenko believed me entirely, saying that since it was me saying it, it was certain that it was true.\nIt seemed that she had chosen our destination of her own accord."
 spth_astral_rift.37.a: "..."
 spth_astral_rift.38.name: "§UMagical Girl's Crusade§!"
 spth_astral_rift.38.desc: "Finally, the time to carry out our Rendaino barrier-hole-exploration trip has come!\nThere's rarely a sign of life there at night, making it the ideal choice, so with that in mind we decided to depart for it in the evening.\nWe were in pleasantly high spirits when we departed, but by the time we arrived at Rendaino, we swiftly became quite grave.\nSpeaking of which, Rendaino is a graveyard..."
 spth_astral_rift.38.a: "..."
 spth_astral_rift.39.name: "§UA Highway of Cherry Trees at Evening§!"
 spth_astral_rift.39.desc: "——莲子所说的目标墓碑应该就是这个，可我什么都没看到。莲子在催我。我摆弄了下墓碑，又把卒塔婆拔了出来，做了各种尝试。莲子望着天空，念叨着，2点27分41秒。\n\n真是诡异。到头来，只有我一个人在干盗墓贼的勾当。墓碑很重，我好不容易才把它转动……。\n\n「2点30分整！」\n就在墓碑转了4分之1圈的那一刻，明明正值秋天，我们眼前却浮现出了无边无际的樱花海洋。\n在明月之下，紫色与粉色的樱花盛开着，绵延不绝。而在远处，似乎存在着广大的庭院与巨大的庭院，幽灵一样的存在在空中舞动着，构成了一幅壮丽的冥界绝景。"
 spth_astral_rift.39.a: "..."
 spth_astral_rift.40.name: "§UEternal Festival of Illusions§!"
 spth_astral_rift.40.desc: "一切突然又结束了，她们二人仿佛意识到了发生了什么，而在她们手中的，是一张书页。"
 spth_astral_rift.40.a: "神奇。"
 spth_astral_rift.40.effect: "The traits of Hifuu two are improved."