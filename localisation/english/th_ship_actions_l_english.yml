 touhou_ship_actions.17.desc: "魔界的攻坚型军用舰船能够开辟一道星界传送门，从而使用舰载的大规模杀伤性武器对遥远的星系发动攻击。这款武器最多能够选中§Y3.00§!个目标。\n\n§B世界终结之时，一定会迎来绝望的热寂吗？\n亦或是在原子级别的大撕裂中，归于虚无？\n亦或在一巡后重归奇点，进入崭新的天地。§!"
