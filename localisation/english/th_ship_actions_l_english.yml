 touhou_megastructure_system_warper_proj_fleet_action: "舰队投射"
 touhou_megastructure_system_warper_proj_fleet_activity_key: "正在开辟隙间裂口"
 touhou_megastructure_system_warper_proj_fleet_tooltip: "我们的巨型跃迁引擎不仅能够完成§Y移动星系§!的壮举，还可以作为协助我们舰队进行战略机动的工具，通过开辟隙间裂口，将星系内的全部友方舰队§Y瞬间§!投射到遥远的星系当中。由于这种舰队投射手段不依赖常规的跃迁，其可以§Y无视各种各样的阻碍§!。"
