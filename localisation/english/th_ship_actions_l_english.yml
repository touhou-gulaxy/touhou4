 touhou_auto_combat_action_player: "Shikigami \"Channeling Dakiniten\" "
 touhou_auto_combat_action_player_desc: "With the ability of using Shikigami, we can do Shikigami possession on our ships and auto-command using Shikigami, to perform combat actions, at the cost of extra $r_sr_lingli$ and $r_food$.\n\n§RThe movement and combat orders of this fleet will be take over automatically, do not give orders manually.§!"
 touhou_auto_combat_action_player_alt: "§EDeadly Toxin \"Poisonous Moth's Dance in the Dark\"§!"
 touhou_auto_combat_action_player_alt_desc: "With the ability of using Shikigami, we can do Shikigami possession on our ships and auto-command using Shikigami, to perform combat actions, at the cost of extra $r_sr_lingli$ and $r_food$.\n\n§RThe movement and combat orders of this fleet has been taken over automatically, and if you want to give orders manually, please disable automatic combat with selecting this special action.§!"
