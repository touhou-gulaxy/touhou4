 touhou_megastructure_system_warper_attack_action: "进行跨星系打击"
 touhou_megastructure_system_warper_attack_activity_key: "正在开辟隙间裂口"
 touhou_megastructure_system_warper_attack_tooltip: "我们的巨型跃迁引擎不仅能够完成§Y移动星系§!的壮举，还可以作为一种远程打击的武器，通过打开的隙间向遥远的星系投射毁灭性的引力扭曲与灵力能量，重创其中的舰队并引爆其恒星。"
 message_touhou_megastructure_pk_weapon_killed_star_desc:0 "$touhou_target_planet|Y$因遭受$touhou_attacker|Y$的$touhou_attacker_mega|Y$的跨星系攻击而被摧毁，$touhou_target_system|Y$恒星系在暗淡的超新星爆发中被毁灭。"
 message_touhou_system_warper_pk_weapon_killed_star_desc:0 "$touhou_target_planet|Y$因遭受$touhou_attacker|Y$的§Y$touhou_system_warper$§!的跨星系攻击而被摧毁，$touhou_target_system|Y$恒星系在暗淡的超新星爆发中被毁灭。"
 touhou_ship_actions.304.name: "到达§H[From.GetName]§!"
 touhou_ship_actions.304.desc: "随着§H[FromFrom.GetName]§!星系中我们的§Y巨型跃迁引擎§!启动，巨量的灵力与能量被输入了其中心的§M隙间发生器§!核心，这座巨型结构上的所有工作人员都能听到轻微的嗡嗡声，这是§H现实§!与§M隙间§!之间的帷幕被反复撕裂所产生的背景噪声——随着更多的能源涌入引力发生器，星系内的每条舰船前都开辟了一道刚好能准许其通过的隙间裂口，随后穿过这一裂口前往了§H[From.GetName]§!。\n\n在极短的时间后，在§H[From.GetName]§!附近的一片虚空中，现实再次被撕裂，随着无数的隙间裂口张开，我们的舰队到达了目标。由于这一舰队投射行为产生了巨大的空间波动与电磁信号，这次事件产生的余波将在将来的§Y数千乃至数万年内§!都能被星系中的其他文明观测到，这是§H[Root.GetName]§!科技实力的永恒体现。"
 touhou_ship_actions.304.a: "酷。"
 touhou_ship_actions.304.b: "类似的事情下次不需要再通知了。"
 requires_touhou_leader: "$TRIGGER_FAIL$§R需要由东方project领袖指挥。§!"
 touhou_sensor_deep_scan: "§U深度探测§!"
 touhou_sensor_deep_scan_desc: "§L借助灵力的能力，我们能够对星球进行深度探测，从而发现此前从未发现过的东西。§!"
 touhou_deep_scan_planet_failed: "$TRIGGER_FAIL$§R目标没有额外的资源§!"
 touhou_sensor_deep_scan_action: "$touhou_sensor_deep_scan$ - §H校准传感器§!"
 touhou_sensor_deep_scan_required_progress_tooltip: "§Y90.00§!£time£"
 touhou_sensor_deep_scan_progress_activity: "灵力探测中（§Y$PROGRESS$%§!）"
 touhou_sensor_deep_scan_tooltip: "$PLANET_EFFECTS_HEADER$$TABBED_NEW_LINE$—若目标尚未被['concept_survey',调查]则完成调查。$TABBED_NEW_LINE$可以发现在§H调查§!过程中尚未找到的§H资源矿藏§!、£anomaly£ §H异常现象§!、以及£archaeology£ §H考古遗址§!。$TABBED_NEW_LINE$—发现新§H资源矿藏§!时，移除所有§H$harvested_resources_mining$§!修正，使其可以立即开采。$TABBED_NEW_LINE$—如果星系内存在其他帝国的§Y殖民地§!、§Y开采站§!或§Y恒星基地§!，可以获得少量其§H情报§!。"
 touhou_synaptic_lathe_exouds: "时空「现实改造」"
 touhou_synaptic_lathe_exouds_tooltip: "舰队效果:$TABBED_NEW_LINE$—编辑现实，使得星系内的敌方舰队进入['concept_terrify',§R时空破碎状态§!]，持续§Y15.00§!£time£。$TABBED_NEW_LINE$—操纵宇宙规律，使得世界舰-视界刺针在§Y30.00§!£time£内§Y无法被常规的攻击手段摧毁§!。$TABBED_NEW_LINE$—改造周围星系的时空，使得§Y1.00§!跳内的星系§Y暂时无法通过跃迁进入§!。"
 touhou_synaptic_lathe_mia: "净化「世界间的裂隙」"
 touhou_synaptic_lathe_mia_tooltip: "舰队效果:$TABBED_NEW_LINE$—使得世界舰-视界刺针立刻进入§Y潜航状态§!，持续§Y1800.00§!£time£。$TABBED_NEW_LINE$—潜航状态下的方舟将从星系中消失，进入§Y世界间的裂隙§!。$TABBED_NEW_LINE$—潜航状态下的方舟将§Y不可能被攻击到§!。\n\n作为月之都的先进技术，我们能够利用视界刺针上搭载的改进出谷记模块，使得舰队潜入世界之间的裂隙，从而无法被任何形式攻击到。"
 touhou_space_shrine_mia: "境界「现实与虚幻的界线」"
 touhou_space_shrine_mia_tooltip: "舰队效果:$TABBED_NEW_LINE$—使得战斗神社立刻进入§Y虚空形态§!，持续§Y720.00§!£time£。$TABBED_NEW_LINE$—虚空形态下的方舟将从星系中消失，进入§Y现实与虚幻的间隙§!之中。$TABBED_NEW_LINE$—虚空形态下的方舟将§Y不可能被攻击到§!，且建造的舰船将会§Y瞬间抵达目标§!。\n\n借助操纵境界的力量，我们能够利用太空堡垒上搭载的隙间发生器，使得舰队潜入现实与虚幻的间隙，进入虚空形态，从而无法被任何形式攻击到。"