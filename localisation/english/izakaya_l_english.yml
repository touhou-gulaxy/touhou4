 izakaya_item_ingredient_premium_tuna_desc: "The highest quality of tuna. Very valuable."
 izakaya_item_ingredient_fugu: "Pufferfish"
 izakaya_item_ingredient_fugu_desc: "A legendary luxurious fish that is also poisonous. Careful processing is needed."
 izakaya_item_ingredient_peaches: "Peach"
 izakaya_item_ingredient_peaches_desc: "Common peach that grows from peach trees."
 izakaya_item_ingredient_ginkgo_nuts: "Ginkgo Nut"
 izakaya_item_ingredient_ginkgo_nuts_desc: "Common ginkgo nut that grows from ginkgo trees."
 izakaya_item_ingredient_shrimp: "Shrimp"
 izakaya_item_ingredient_shrimp_desc: "Freshwater shrimp that inhabits Misty Lake and Genbu Ravine. Rather common."
 izakaya_item_ingredient_honey: "Honey"
 izakaya_item_ingredient_honey_desc: "Wild honey from beehives that can be found on trees."
 izakaya_item_ingredient_cicada_shells: "Cicada Slough"
 izakaya_item_ingredient_cicada_shells_desc: "The shell of a cicada that can be found on tree trunks."
 izakaya_item_ingredient_illusory_lotus_blossom: "Udumbara"
 izakaya_item_ingredient_illusory_lotus_blossom_desc: "A miraculous flower that grows in marshlands. Very precious."
 izakaya_item_ingredient_dew: "Dew"
 izakaya_item_ingredient_dew_desc: "Dew that can only be collected in the early morning. Somewhat rare."
 izakaya_item_ingredient_bamboo_shoots: "Bamboo Shoot"
 izakaya_item_ingredient_bamboo_shoots_desc: "Common bamboo shoots you can find in Bamboo Forest of the Lost."
 izakaya_item_ingredient_butter: "Butter"
 izakaya_item_ingredient_butter_desc: "Commonly used in Western cuisines. Brings an overwhelming aroma with a small amount."
 izakaya_item_ingredient_flour: "Flour"
 izakaya_item_ingredient_flour_desc: "A common ingredient that can be used in many ways."
 izakaya_item_ingredient_bamboo: "Bamboo"
 izakaya_item_ingredient_bamboo_desc: "Light green bamboo obtained from the Bamboo Forest of the Lost, which emits a refreshing fragrance."
 izakaya_item_ingredient_glutinous_rice: "Sticky Rice"
 izakaya_item_ingredient_glutinous_rice_desc: "Very sticky rice. Cuisines made of it are either soft as cloud or tender as cream."
 izakaya_item_ingredient_moonlight_grass: "Lunar Herb"
 izakaya_item_ingredient_moonlight_grass_desc: "A specialty of Eientei. A plant that grows under the full moon and absorbs its very essence. Very rare."
 izakaya_item_ingredient_ice_cubes: "Ice Cube"
 izakaya_item_ingredient_ice_cubes_desc: "Water in solid form. Can be used for keeping foods cold."
 izakaya_item_ingredient_chili_peppers: "Chili"
 izakaya_item_ingredient_chili_peppers_desc: "An ingredient for adding spiciness to food, but opinions of it are polarized."
 izakaya_item_ingredient_grapes: "Grapes"
 izakaya_item_ingredient_grapes_desc: "Grapes cultivated at the Scarlet Devil Mansion, which are commonly used for alcohol brewing."
 izakaya_item_ingredient_cucumbers: "Cucumber"
 izakaya_item_ingredient_cucumbers_desc: "The kappa's favorite! Although it is no different from other vegetables... Why exactly are kappa so addicted to it...?"
 izakaya_item_ingredient_octopus: "Octopus"
 izakaya_item_ingredient_octopus_desc: "A squishy and lovely sea creature, but there are no seas in Gensokyo... Its tentacles are great ingredients and have an overwhelmingly chewy texture. By simply roasting them on a fire, you can enjoy their tenderness!"
 izakaya_item_ingredient_sea_urchin: "Sea Urchin"
 izakaya_item_ingredient_sea_urchin_desc: "Believed to be a legendary ingredient in the Outside World. A single one is enough to pin the deliciousness of the entire ocean in one's mind... Is it true though? It does look kinda weird..."
 izakaya_item_ingredient_black_salt: "Black Salt"
 izakaya_item_ingredient_black_salt_desc: "Composed of volcanic energy accumulated for thousands of years; Made just to purify the dirtiness of your soul... That's what the advertising slogan reads, but it's in fact just ordinary volcanic rock salt."
 izakaya_item_ingredient_cream: "Cream"
 izakaya_item_ingredient_cream_desc: "A dairy product processed in a special way that is guaranteed to instantly explode the taste buds of those with a sweet tooth!"
 izakaya_item_ingredient_crab: "Crab"
 izakaya_item_ingredient_crab_desc: "An eight-legged fool that thinks it can scurry around with its armored shell. By simply steaming, it can be turned into an ultimate delicacy! Just be careful of its pincers..."
 izakaya_item_ingredient_twin_stemmed_lotus: "Bingdi Lotus"
 izakaya_item_ingredient_twin_stemmed_lotus_desc: "Its roots grow near bridges, blooming on the water's surface when mature. It possesses a light pink hue and a subtle fragrance, a high-quality ingredient used as festive decorations in the Underworld."
 izakaya_item_ingredient_lemon: "Lemon"
 izakaya_item_ingredient_lemon_desc: "A strange fruit that only grows on a special tree near the bridge. It's said that no one can eat one while keeping a straight face. Its extremely sour taste means it can only be used as flavoring by extracting its juices."
 izakaya_item_ingredient_cheese: "Cheese"
 izakaya_item_ingredient_cheese_desc: "A precious ingredient made by fermenting cream. Melt some over a dish to add a creamy and delicious flavor."
 izakaya_item_ingredient_lotus_seeds: "Lotus Seed"
 izakaya_item_ingredient_lotus_seeds_desc: "The seeds of a very old aquatic plant-the lotus. Lotus seeds have very bitter cores, so accidentally mixing them into a customer's dish must be avoided at all costs. Careful handling is a must."
 izakaya_item_ingredient_sweet_potatoes: "Sweet Potato"
 izakaya_item_ingredient_sweet_potatoes_desc: "The world's most reliable ingredient! Sweet, soft and effectively getting rid of hunger, it even warms your hands during winter."
 izakaya_item_ingredient_pine_nuts: "Pine Nut"
 izakaya_item_ingredient_pine_nuts_desc: "Seeds from red pine trees. Apparently an endangered species in the Outside World, but still very common in Gensokyo. Said to promote longevity, it's a vital part of every fasting Taoist priest's diet."
 izakaya_item_ingredient_chestnuts: "Chestnut"
 izakaya_item_ingredient_chestnuts_desc: "It's said that while the founder of Taoism was training, he planted many chestnut trees due to a dislike of meat, substituting rice with chestnuts. They have fat kernels and are highly nutritious; Taoists hold them in high esteem, and even farmers frequently use them as a substitute for grain."
 izakaya_item_ingredient_plums: "Plum"
 izakaya_item_ingredient_plums_desc: "Fruit from a plum tree which can be dried or salted. Dried plums develop a unique taste of saltiness with a hint of sour. Combined with its savory sweet aftertaste, they make delightful appetizers."
 izakaya_item_ingredient_red_beans: "Red Bean"
 izakaya_item_ingredient_red_beans_desc: "A herbaceous plant that's very adaptable. Eating it can boost one's immune system and prevent diseases. People of ancient times believed diseases were caused by demons, hence legends that say red beans can overcome demons."
 izakaya_item_ingredient_fresh_flowers: "Flower"
 izakaya_item_ingredient_fresh_flowers_desc: "A bouquet of colorful and gorgeous flowers. We must show our respects to the task flowers must complete even at the cost of their own lives!"
 izakaya_item_ingredient_toon_tree_leaves: "Red Toon"
 izakaya_item_ingredient_toon_tree_leaves_desc: "A common wild vegetable. Poisonous; eating too much is not recommended. Must be blanched before consuming."
 izakaya_item_ingredient_tomatoes: "Tomato"
 izakaya_item_ingredient_tomatoes_desc: "A brightly colored berry. So bright that it was once called the \"wolf peach\", thought to be highly poisonous and could only be used for decoration. Mass production started after they were discovered to be edible."
 izakaya_item_ingredient_cocoa_beans: "Cocoa Bean"
 izakaya_item_ingredient_cocoa_beans_desc: "Cacao tree fruit. They are said to taste differently in different regions, some having a fruity aroma and some a smokey flavor. It can be ground and eaten, and is a basic ingredient in chocolate making."
 izakaya_item_ingredient_broccoli: "Broccoli"
 izakaya_item_ingredient_broccoli_desc: "Broccoli grown from Makai soil has a slightly different flower bulb color than the Earthly ones, as insufficient light causes their undergrowth."
 izakaya_item_ingredient_pupu_yo_fruit: "Jiguru Berry"
 izakaya_item_ingredient_pupu_yo_fruit_desc: "Weird fruits seen everywhere in Makai. Apparently grants different effects based on the type of person consuming it, which is very peculiar."
 izakaya_item_ingredient_schisandra: "Creeping Fig"
 izakaya_item_ingredient_schisandra_desc: "A medicinal and food plant. Creeping fig seeds, when soaked and then rubbed, will solidify into a crystalline gel after refrigeration. They can be used to make jellies and those alike, which are brilliant desserts to beat the summer heat."
 izakaya_item_ingredient_silver_ear_mushrooms: "Snow Fungus"
 izakaya_item_ingredient_silver_ear_mushrooms_desc: "A fungus as beautiful as a flower. It is said that royalty through the ages look upon snow fungus as a life-prolonging product, yet it seems very common in Lunar Capital. Its immaculate white fits Lunar Capital well."
 izakaya_item_ingredient_high_potency_capsaicin: "Strong Capsaicin"
 izakaya_item_ingredient_high_potency_capsaicin_desc: "Ultra spicy product made with Lunarian technology, capable of leaving horrible memories for those who dared to try it. Not even sure if it's made with chili. . ."
 izakaya_item_ingredient_bellflower: "Reisen"
 izakaya_item_ingredient_bellflower_desc: "Who am I... Why am I here...?"
 izakaya_item_ingredient_gold_leaf: "Gold Leaf"
 izakaya_item_ingredient_gold_leaf_desc: "An ingredient made by repeatedly hammering high-purity gold into thin sheets. Makes food look more expensive."
 izakaya_item_ingredient_coconut: "Coconut"
 izakaya_item_ingredient_coconut_desc: "An ingredient from the Outside World that arrived here by unknown means. Beneath its hard shell are delicious flesh and plenty of juice."
 izakaya_item_ingredient_cactus: "Cactus"
 izakaya_item_ingredient_cactus_desc: "An ingredient covered in spines. It must be carefully prepared before eating."
 izakaya_item_ingredient_green_onions: "Green Onion"
 izakaya_item_ingredient_green_onions_desc: "A very common ingredient grown in the Human Village. A good choice either as a seasoning or eaten on its own."
 izakaya_item_ingredient_garlic: "Garlic"
 izakaya_item_ingredient_garlic_desc: "A very common ingredient grown in the Human Village. Rumored to be especially effective against vampires."
 izakaya_item_ingredient_corn: "Corn"
 izakaya_item_ingredient_corn_desc: "A very common ingredient grown in the Human Village. It can serve as a staple food or be used in soups."
 izakaya_item_ingredient_condensed_milk: "Condensed Milk"
 izakaya_item_ingredient_condensed_milk_desc: "A processed dairy product with exceptional sweetness, ideal for desserts."
 izakaya_item_ingredient_marshmallows: "Marshmallows"
 izakaya_item_ingredient_marshmallows_desc: "A snack that is delicious on its own or used in cooking. Very popular with children."
 izakaya_item_food_seafood_miso_soup: "Seafood Miso Soup"
 izakaya_item_food_seafood_miso_soup_desc: "Super common in izakayas. When seaweed first appeared in Gensokyo, someone tried boiling it and discovered that it was very savory. Since then, it's been popular all across Gensokyo."
 izakaya_item_food_tofu_miso: "Miso Tofu"
 izakaya_item_food_tofu_miso_desc: "An easily prepared soup commonly found in izakayas. A clean and simple delicacy that uses tofu to highlight its freshness."
 izakaya_item_food_energy_soup: "Power Soup"
 izakaya_item_food_energy_soup_desc: "A soup with a perfect balance between meat and vegetables and seaweed and boar meat. It can quickly supply your body with all the energy you need."
 izakaya_item_food_smoked_pork_and_trout: "Pork & Trout Kebab"
 izakaya_item_food_smoked_pork_and_trout_desc: "A dish made with smoked pork and trout. Simple to make and absolutely delicious."
 izakaya_item_food_grilled_eel: "Grilled Lamprey"
 izakaya_item_food_grilled_eel_desc: "One of Mystia's signature dishes. I wanted to break the stereotype that \"restaurants with red lanterns all sell grilled birds.\" Did you know that lampreys can effectively treat night blindness? They used to be a rare delicacy."
 izakaya_item_food_energy_skewers: "Energy Skewer"
 izakaya_item_food_energy_skewers_desc: "A skewer made of beef, onion, and pumpkin. The onion's tartness and pumpkin's sweetness mitigate the greasy beef, giving the skewer a refreshing taste."
 izakaya_item_food_niten_ichi_ryu: "Niten Ichiryu"
 izakaya_item_food_niten_ichi_ryu_desc: "According to legends, a human swordsman invented this dish when making a bet with an oni and won with it. Made using grilled wild game, eating this dish gives you a massive strength boost and wakes your primal instinct."
 izakaya_item_food_rice_balls: "Rice Ball"
 izakaya_item_food_rice_balls_desc: "The simplest rice ball, made using nothing more than seaweed and rice. Convenient and cheap."
 izakaya_item_food_seared_pork_rice_ball: "Pork Rice Ball"
 izakaya_item_food_seared_pork_rice_ball_desc: "A common and affordable rice ball. By adding grilled pork to the rice, it gains a chewy texture and a delicious new taste."
 izakaya_item_food_warm_rice_ball: "Pink Rice Ball"
 izakaya_item_food_warm_rice_ball_desc: "A simple and cheap rice ball with trout and onions, merging the juicy seafood with the tart onion. Nutritious and delicious."
 izakaya_item_food_cherry_blossom_snow: "Falling Blossoms"
 izakaya_item_food_cherry_blossom_snow_desc: "A premium sushi dish. The pink tuna upon the white rice resembles sakura petals on white snow, making this an incredibly beautiful dish."
 izakaya_item_food_stir_fried_shredded_pork: "Pork Stir Fry"
 izakaya_item_food_stir_fried_shredded_pork_desc: "A home dish made using pork, chili pepper, and other ingredients. It has a strong flavor."
 izakaya_item_food_chilled_tofu: "Fresh Tofu"
 izakaya_item_food_chilled_tofu_desc: "An appetizer for cooling off in summer. Simple and refreshing."
 izakaya_item_food_braised_eel: "Kabayaki Lampreys"
 izakaya_item_food_braised_eel_desc: "One of my signature dishes. A juicy appetizer made by cooking lampreys with special sauces. The smell alone can make you drool."
 izakaya_item_food_potato_croquettes: "Potato Croquettes"
 izakaya_item_food_potato_croquettes_desc: "Made primarily from potatoes, these croquettes are crispy on the outside and soft on the inside. It's a popular fried food."
 izakaya_item_food_game_cannon: "Hunter's Casserole"
 izakaya_item_food_game_cannon_desc: "A stew made with vegetables and high-quality Iberico pork. Full of flavor, fragrant yet not greasy. Arguably the best peasant dish."
 izakaya_item_food_pork_rice_bowl: "Pork Bowl"
 izakaya_item_food_pork_rice_bowl_desc: "A common family dish. The aromatic sauce drizzled over soft rice blends with the taste of the pork. Makes anyone hungry."
 izakaya_item_food_beef_rice_bowl: "Beef Bowl"
 izakaya_item_food_beef_rice_bowl_desc: "A common family dish. The aromatic sauce drizzled over soft rice blends with the taste of beef. Makes anyone hungry."
 izakaya_item_food_fried_eel: "Fried Lampreys"
 izakaya_item_food_fried_eel_desc: "One of my signature dishes. These bizarre-looking lampreys were once the talk of Gensokyo. After frying, they gain a smooth and crispy texture, making them a very popular dish."
 izakaya_item_food_vegetable_specials: "Vegetable Salad"
 izakaya_item_food_vegetable_specials_desc: "A salad made of fresh vegetables. The low calories make it the perfect diet food for young girls."
 izakaya_item_food_white_snow: "Shirayuki"
 izakaya_item_food_white_snow_desc: "A premium stew made with lamprey, pufferfish, and seaweed. The name means \"white snow.\" The most luxurious family dish, if you can call it that."
 izakaya_item_food_tofu_hot_pot: "Tofu Stew"
 izakaya_item_food_tofu_hot_pot_desc: "A cheap stew made of tofu. It's the most common stew in the izakaya thanks to the smooth and tender texture and its rich nutrients."
 izakaya_item_food_zatsui: "Hodgepodge"
 izakaya_item_food_zatsui_desc: "A stew made with leftovers. Delicious without being wasteful, the best of both worlds."
 izakaya_item_food_sashimi_platter: "Sashimi Platter"
 izakaya_item_food_sashimi_platter_desc: "A quintessential Japanese dish. The premium-grade salmon and tuna are served with wasabi and soy sauce, leading to a wonderful melding of fresh flavors."
 izakaya_item_food_grand_feast: "Daimyo's Feast"
 izakaya_item_food_grand_feast_desc: "All premium ingredients, braised under exquisite heat control, which enhances the flavor further! The meat is tender and juicy. Those who tried it will never forget it!"
 izakaya_item_food_tonkotsu_ramen: "Tonkotsu Ramen"
 izakaya_item_food_tonkotsu_ramen_desc: "The broth, made by boiling pork and vegetables, is the essence of ramen. The smooth noodles are enriched by the flavorful and aromatic pork broth, filling and satisfying."
 izakaya_item_food_magma: "Fuji's Lava"
 izakaya_item_food_magma_desc: "A stew made from premium beef and truffles. Super hot and spicy! Got the name because the stew is bubbling hot like lava. A non-spicy version also exists for weaklings."
 izakaya_item_food_crispy_fried_cicada_sheds: "Fried Cicada Sloughs"
 izakaya_item_food_crispy_fried_cicada_sheds_desc: "The molted shells of cicadas are used as medicine to clear the throat and improve eyesight. Becomes crispy after frying and is quite popular."
 izakaya_item_food_dew_poached_eggs: "Dew Runny Eggs"
 izakaya_item_food_dew_poached_eggs_desc: "Eggs boiled with dew are sweeter than regular boiled eggs. If you can get the timing right, you can get a tender yolk that breaks with the slightest shake."
 izakaya_item_food_phantom_night_blooming_cereus_cake: "Udumbara Cake"
 izakaya_item_food_phantom_night_blooming_cereus_cake_desc: "A cake made from an ancient miraculous flower. The cake has a faint sweetness and leaves behind a lingering fragrance said to help one remember their fondest memories."
 izakaya_item_food_bear_paw_imitation: "Imitation Bear Paw"
 izakaya_item_food_bear_paw_imitation_desc: "The weirdest dish in Gensokyo! Since I can't defeat a bear, it's not made with real bear paws. But with its unforgettable fragrance and delicious taste, it's a hundred times better than the real thing!"
 izakaya_item_food_secret_recipe_dried_fish: "Secret Dried Fish Crisps"
 izakaya_item_food_secret_recipe_dried_fish_desc: "Sun-dried fish marinated with secret spices. They are crispy, delicious, and easy to store, making them a popular snack at homes."
 izakaya_item_food_carved_cold_dishes: "Carved Rose Salad"
 izakaya_item_food_carved_cold_dishes_desc: "Fresh fruits and vegetables carved into the shape of a rose. What makes this dish difficult is not the ingredients, but the requisite knife skills."
 izakaya_item_food_peach_blossom_soup: "Peach Tapioca"
 izakaya_item_food_peach_blossom_soup_desc: "A recipe from Heaven, made from fresh peach and morning dew. Not only is this dish sweet and fragrant, but it's also photogenic and healthy."
 izakaya_item_food_arctic_sweet_shrimp_and_peach_salad: "Peach & Shrimp Salad"
 izakaya_item_food_arctic_sweet_shrimp_and_peach_salad_desc: "A high-class dish made from the freshest shrimp and peaches. Supposedly, they are only served at banquets in the Outside World."
 izakaya_item_food_deep_fried_tofu: "Deep Fried Tofu"
 izakaya_item_food_deep_fried_tofu_desc: "A common family dish. Supposedly the favorite food of Inari gods and fox youkai."
 izakaya_item_food_poetic_ginkgo_nuts: "Scholar's Ginkgo"
 izakaya_item_food_poetic_ginkgo_nuts_desc: "Named after the ginkgo trees in the Temple of Confucius, they are fragrant, sweet, chewy, and can even cure coughing and hangovers."
 izakaya_item_food_authentic_seafood_miso_soup: "Real・Seafood Miso Soup"
 izakaya_item_food_authentic_seafood_miso_soup_desc: "Same old miso soup, but with REAL seafood this time! Savory and without the fish stink."
 izakaya_item_food_grilled_mushrooms: "Roasted Mushroom"
 izakaya_item_food_grilled_mushrooms_desc: "A skewer made from mushrooms. While it's a vegetarian dish, it actually kind of tastes like meat after marinating, breading, and grilling."
 izakaya_item_food_simmered_tofu: "Boiled Tofu"
 izakaya_item_food_simmered_tofu_desc: "A common family dish. In order to make the tofu as tender as possible, the heat must be carefully controlled when cooking."
 izakaya_item_food_fried_pork_chops: "Fried Pork Cutlet"
 izakaya_item_food_fried_pork_chops_desc: "A common family dish made by coating pork with flour and deep frying it. Very popular among children."
 izakaya_item_food_butter_seared_steak: "Classic Steak"
 izakaya_item_food_butter_seared_steak_desc: "Simple yet difficult. This dish can change drastically at different temperatures or with different beef. By the way, the mistress of the Scarlet Devil Mansion prefers medium rare."
 izakaya_item_food_risotto: "Italian Risotto"
 izakaya_item_food_risotto_desc: "After frying the ingredients, uncooked rice is poured in, which soaks the aroma into the rice. Supposedly originated from a peninsula from the Outside World."
 izakaya_item_food_beef_wellington: "Beef Wellington"
 izakaya_item_food_beef_wellington_desc: "Wrap seasoned beef and truffles in a puffy pastry and bake it. It's buttery, crispy, and juicy. Every ingredient is in perfect harmony. This dish is famously difficult, even in the Outside World."
 izakaya_item_food_eggs_benedict: "Eggs Benedict"
 izakaya_item_food_eggs_benedict_desc: "Poached eggs on freshly toasted muffins. A great choice for brunch."
 izakaya_item_food_warm_pancakes: "Pancakes with Syrup"
 izakaya_item_food_warm_pancakes_desc: "A simple breakfast item. Simply heat the prepared batter until done. Add honey, and voilà!"
 izakaya_item_food_scones: "Scone"
 izakaya_item_food_scones_desc: "A common British afternoon tea, crisp on the outside and soft on the inside. Usually eaten with jam or cream."
 izakaya_item_food_pan_seared_salmon: "Salmon Steak"
 izakaya_item_food_pan_seared_salmon_desc: "Made by pan-frying a whole salmon until the skin is crispy and the inside is tender. I heard they use asparagus in the Outside World, but I guess we'll make do with fresh bamboo shoots. Just call it Gensokyo-style!"
 izakaya_item_food_creamy_stew: "Creamy Vegetable Chowder"
 izakaya_item_food_creamy_stew_desc: "An easy to make creamy soup. It tastes great regardless of whether you eat it with bread or as is."
 izakaya_item_food_honey_glazed_char_siu: "Cantonese Char Siu"
 izakaya_item_food_honey_glazed_char_siu_desc: "A special dish from Meiling's homeland. While making it is hard, the unique and unforgettable taste made it all worth it."
 izakaya_item_food_ginkgo_and_radish_pork_rib_soup: "Golden Ribs Soup"
 izakaya_item_food_ginkgo_and_radish_pork_rib_soup_desc: "A soup that originates from Meiling's homeland. Not only is it the perfect blend of looks, smell, and taste, but it is also very nutritious."
 izakaya_item_food_taketori_hime: "Kaguya-hime"
 izakaya_item_food_taketori_hime_desc: "Actually, it's just steamed bamboo with sticky rice, meat, and truffle. Surprisingly, the bamboo's fragrance mitigates the greasy meat."
 izakaya_item_food_phoenix: "Immortal Turkey"
 izakaya_item_food_phoenix_desc: "A flour turkey with everyday ingredients as filling and honey brushed over. Has a crispy surface and juicy interior."
 izakaya_item_food_moonlight_dango: "Lunar Dango"
 izakaya_item_food_moonlight_dango_desc: "A special Eientei mochi. They \"taste like moonlight\" because they are made with the rare moonlight grass."
 izakaya_item_food_mochi: "Mochi"
 izakaya_item_food_mochi_desc: "The most simple type of mochi dumplings. A Japanese snack that everyone likes."
 izakaya_item_food_white_peach_nama_yatsuhashi: "Peach Yatsuhashi"
 izakaya_item_food_white_peach_nama_yatsuhashi_desc: "A classic Japanese dessert shaped like a koto. The peach filling colors make them pink. Cute and inviting."
 izakaya_item_food_moon_lover: "Lunar Lover Biscuits"
 izakaya_item_food_moon_lover_desc: "After hearing the popularity of \"Koibito\" cookies in the Outside World, Eientei invented their own."
 izakaya_item_food_pig_deer_and_butterfly: "Ino-Shika-Chou"
 izakaya_item_food_pig_deer_and_butterfly_desc: "Inspired by the hanafuda combo, pork and venison are stewed in clear soup and seasoned with flowers to bring out the freshness of the ingredients."
 izakaya_item_food_flowing_vegetarian_noodles: "Flowing Somen"
 izakaya_item_food_flowing_vegetarian_noodles_desc: "Rather than being tasty, these noodles are more about being fun."
 izakaya_item_food_stir_fried_pork_with_bamboo_shoots: "Pork & Bamboo Shoots Stir Fry"
 izakaya_item_food_stir_fried_pork_with_bamboo_shoots_desc: "The simplest way to cook bamboo shoots, with the greasiness of the pork acting as foil for the delicious freshness of the bamboo shoots."
 izakaya_item_food_steamed_egg_in_a_bamboo_tube: "Steamed Egg & Bamboo Shoots"
 izakaya_item_food_steamed_egg_in_a_bamboo_tube_desc: "A type of egg custard that uses a bamboo barrel as the container, giving the dish a unique taste."
 izakaya_item_food_penglai_jade_branch: "Hourai Branch"
 izakaya_item_food_penglai_jade_branch_desc: "To put it simply, it's just a skewer with all kinds of premium meat."
 izakaya_item_food_stinky_tofu: "Stinky Tofu"
 izakaya_item_food_stinky_tofu_desc: "Fermented black tofu with a weird flavor. Those who never tried it often wonder \"Is this even edible?\" Those who do try say you can't have enough."
 izakaya_item_food_huaguang_jade_pan_fried_buns: "Rainbow Pan-fried Pork Buns"
 izakaya_item_food_huaguang_jade_pan_fried_buns_desc: "Pan-fried buns with a rainbow aura! Some hardcore enthusiasts say only pork filling is authentic."
 izakaya_item_food_mapo_tofu: "Mapo Tofu"
 izakaya_item_food_mapo_tofu_desc: "A Chinese dish famous in Japan. Be careful, it's super spicy and addictive when you eat it with rice!"
 izakaya_item_food_boiled_fish: "Sichuan Boiled Fish"
 izakaya_item_food_boiled_fish_desc: "An authentic Chinese Sichuan dish. Fresh fish filet boiled with red chili peppers will result in exploding flavors!"
 izakaya_item_food_mooncakes: "Moon Cake"
 izakaya_item_food_mooncakes_desc: "Originally a special recipe reserved for beta testers, this dish has tormented completionists for three years. This time, it is finally available to everyone."
 izakaya_item_food_mao_yu_three_color_ice_cream: "Cubic Kedama Ice Cream"
 izakaya_item_food_mao_yu_three_color_ice_cream_desc: "Very appealing from color to flavor. It can't be missed when traveling in MC Gensokyo."
 izakaya_item_food_mao_yu_lava_tofu: "Cubic Kedama Volcanic Tofu"
 izakaya_item_food_mao_yu_lava_tofu_desc: "Looks like it's on fire! A famous delicacy in MC Gensokyo, attracting many to try its tongue-tingling flavor."
 izakaya_item_food_scarlet_devil_cake: "Scarlet Devil Cake"
 izakaya_item_food_scarlet_devil_cake_desc: "A dreamy cake modeled after the hat of the Scarlet Devil. Sweet jam oozes out like blood when cut. A rare dessert from the world of Three Fairies' Hoppin' Flappin' Great Journey!"
 izakaya_item_food_unconscious_monster_mousse: "Unconscious Youkai Mousse"
 izakaya_item_food_unconscious_monster_mousse_desc: "A precious mousse modeled after the hat of an unconscious youkai. Gaze into the infinite darkness upon cutting it and let it etch an unforgettable taste into your very soul. A rare dessert from the world of Three Fairies' Hoppin' Flappin' Great Journey!"
 izakaya_item_food_wontons: "Dumplings"
 izakaya_item_food_wontons_desc: "One of the famous recipes from Miss Meiling's hometown from the other side of the ocean! They don't look impressive, but I promise you that they have a lot to show inside! First, you need to repeatedly knead the dough until it's chewy and no longer sticky. Then add whatever ingredients you want in them. Seal them, and then boil them! It's almost magical how delicious they are!"
 izakaya_item_food_tangyuan: "Tangyuan"
 izakaya_item_food_tangyuan_desc: "One of the famous recipes from Miss Meiling's hometown from the other side of the ocean! They don't look impressive, but I promise you that there's a lot of sweetness inside! You need to use sticky rice as flour and make a small sphere, hide some sweet ingredients inside and boil them in hot water, and they can become a super tasty dessert!"
 izakaya_item_food_fried_shrimp_tempura: "Deep Fried Shrimp Tempura"
 izakaya_item_food_fried_shrimp_tempura_desc: "An iconic Japanese dish of the Outside World. Fresh shrimps are coated in flour and deep-fried until they are golden and crispy. Just the sight of it is enough to make one drool!"
 izakaya_item_food_golden_crispy_fish_cakes: "Golden Crispy Fish Cakes"
 izakaya_item_food_golden_crispy_fish_cakes_desc: "Don't underestimate these \"cakes\" made out of sweet honey and fish paste. When deep fried, they will turn golden brown!"
 izakaya_item_food_all_meat_feast: "All-Meat Feast"
 izakaya_item_food_all_meat_feast_desc: "A dish consisting of a mountainous pile of premium grilled meat. Simple yet intimidating in its appearance and portion size. It's a recipe that will easily KO diners with a keen sense of smell."
 izakaya_item_food_pickled_cucumbers: "Pickles"
 izakaya_item_food_pickled_cucumbers_desc: "By cutting and marinating cucumbers in brine and other seasonings, they gain a magical and mouth-watering taste."
 izakaya_item_food_cream_baked_crab: "Creamy Crab"
 izakaya_item_food_cream_baked_crab_desc: "Even before opening the lid, the aroma of the Creamy Crab is already irresistible. However, this is just the beginning. Cracking open a pincer reveals white and juicy flesh that when eaten together with the soup, forms a harmonious combination of delicious flavor."
 izakaya_item_food_imitation_shikigami: "Imitation Shirikodama"
 izakaya_item_food_imitation_shikigami_desc: "It is said that the shirikodama is the tailbone of a human and kappa's favorite food. In the past, it was taken from humans through a bloody method. Over time, we created something similar, though it comes at a premium cost."
 izakaya_item_food_okonomiyaki: "Okonomiyaki"
 izakaya_item_food_okonomiyaki_desc: "A popular street food of the Outside World. Made by mixing batter and various other ingredients and cooked on a flat iron grill. Crisp and rich, it is loved by many for its versatility and affordability."
 izakaya_item_food_takoyaki: "Takoyaki"
 izakaya_item_food_takoyaki_desc: "It's apparently a popular street food of the Outside World. Wrapping a layer of batter unlocks the wonders of the octopus. The chewy elastic tentacles coupled with a soft and crispy coating easily puts a smile on anyone's face."
 izakaya_item_food_sea_urchin_sashimi: "Sea Urchin Sashimi"
 izakaya_item_food_sea_urchin_sashimi_desc: "Unexpectedly simple to prepare but difficult to obtain the ingredients. It is said to be a popular premium cuisine of the present world, and is considered a delicacy worldwide."
 izakaya_item_food_sliced_meat_with_mushrooms: "Pork & Mushroom Stir Fry"
 izakaya_item_food_sliced_meat_with_mushrooms_desc: "A basic home-cooked dish: just mushrooms and sliced pork stir-fry in a pan."
 izakaya_item_food_secret_recipe_fresh_mushroom_hot_pot: "Secret Savory Mushroom Hotpot"
 izakaya_item_food_secret_recipe_fresh_mushroom_hot_pot_desc: "A secret recipe created by a human magician studying fungi for a long time. The ingredients are freshly picked mushrooms from the Forest of Magic, which are said to possess a higher nutritional value than those found elsewhere."
 izakaya_item_food_mushroom_maidens_dance_stew: "Mushroom Maiden's Tip Tap Pot"
 izakaya_item_food_mushroom_maidens_dance_stew_desc: "A dish where mushrooms are the protagonist, accompanied by a variety of fresh and tender ingredients. Its golden glow cannot be ignored, and its fragrant taste can instantly evaporate a person's soul."
 izakaya_item_food_creamy_mushroom_soup: "Cream of Mushroom Soup"
 izakaya_item_food_creamy_mushroom_soup_desc: "A wonderful soup with a rich creamy base that you can't stop eating once you taste it. Easy to make, the ingredients are readily available. Oh, it's also very nutritious."
 izakaya_item_food_plain_mini_cakes: "Ordinary \"Eat Me\" Cupcake"
 izakaya_item_food_plain_mini_cakes_desc: "A small snack containing a surprising amount of calories. Supposedly can make one stronger. It says \"Eat Me\" on it, which is very tempting. Be careful if you eat too many, you might gain weight..."
 izakaya_item_food_seven_color_yokan: "Seven-Colored Yokan"
 izakaya_item_food_seven_color_yokan_desc: "Classic Japanese treats. With special preparation methods, it gains a dreamy color. Too beautiful to eat. Almost. A single bite will leave you with an unforgettable experience."
 izakaya_item_food_hand_rolled_sushi: "Nigiri Sushi"
 izakaya_item_food_hand_rolled_sushi_desc: "One of the most quintessential Japanese dishes. Freshly sliced fish topped over hand-pressed rice balls. Filling and delicious. No wonder why it has a long history behind it."
 izakaya_item_food_pumpkin_and_shrimp_cups: "Shrimp-Stuffed Pumpkin"
 izakaya_item_food_pumpkin_and_shrimp_cups_desc: "Hollow out a small pumpkin and fill it with shrimp and tofu. Steam it, and you got yourself a sweet, delicious, and very healthy meal."
 izakaya_item_food_fantasy_buddha_jumps_over_the_wall: "Buddha Jumps Over The Wall"
 izakaya_item_food_fantasy_buddha_jumps_over_the_wall_desc: "A variation of an iconic cuisine from an ancient Eastern civilization. It is said that even a monk would walk away from enlightenment, jump over a wall to taste this dish. It is really that amazing!"
 izakaya_item_food_depressing_cheese_sticks: "Misery Cheese Sticks"
 izakaya_item_food_depressing_cheese_sticks_desc: "A snack popular among gloomy youkai. The uniquely bitter ginkgo and creamy rich cheese blend together to create a distinctly sweet aftertaste. I have no idea why though."
 izakaya_item_food_gloomy_fruit_pie: "Gloomy Fruit Pie"
 izakaya_item_food_gloomy_fruit_pie_desc: "A delectable feast for those who love sour, hot lava for those who don't! A strange dish popular only among a minority of youkai."
 izakaya_item_food_screaming_oden: "Agony Oden"
 izakaya_item_food_screaming_oden_desc: "Former Hell's most popular party snack. Various ingredients are mixed in with a dash of spice, resulting in a magical dish where you can't stop eating even when drenched in sweat."
 izakaya_item_food_crispy_tornado: "Crispy Spirals"
 izakaya_item_food_crispy_tornado_desc: "Crush the shell of insects and mix them into noodles for a crunchy and delicious dish. A strange and unique dish with a sense of otherworldly wonder."
 izakaya_item_food_ceiling_gazing_pie: "Ceiling-Longing Pie"
 izakaya_item_food_ceiling_gazing_pie_desc: "The head of a fish juts out through the pie, as if it were looking at the Underworld's ceiling. A dish filled with despair, in contrast to Hell."
 izakaya_item_food_turtle_shell_steamed_cake: "Kabuto Steamed Cake"
 izakaya_item_food_turtle_shell_steamed_cake_desc: "Whether on the surface or the Underworld, the kabuto beetle is a sign of strength and supremacy! This is a dish made in its image to celebrate its prowess!"
 izakaya_item_food_lions_head_meatballs: "Lion's Head"
 izakaya_item_food_lions_head_meatballs_desc: "The go-to dish of every wine lover! The wild and majestic head of a lion accompanied by a strong liquor makes it an essential part of an oni's breakfast!"
 izakaya_item_food_giant_tamagoyaki: "Giant Tamagoyaki"
 izakaya_item_food_giant_tamagoyaki_desc: "Enlarge a regular tamagoyaki by several times and you get the Giant Tamagoyaki! Popular among the oni, its magnificent presence alone is enough to get people excited!"
 izakaya_item_food_great_edo_boat_festival: "Oedo Boat Feast"
 izakaya_item_food_great_edo_boat_festival_desc: "With its fabulous festival boat donned with sashimi and kept fresh by the surrounding icy mist, this dish is absolutely guaranteed to be the focus of the party!"
 izakaya_item_food_cherry_blossom_pudding: "Sakura Pudding"
 izakaya_item_food_cherry_blossom_pudding_desc: "A cute pink dessert! It's soft and bouncy, sweet and fragrant! No girl in the world can withstand this irresistible dessert."
 izakaya_item_food_pick_me_up_pudding: "Energy Pudding"
 izakaya_item_food_pick_me_up_pudding_desc: "A pudding which was made terrifyingly sour, boosting one's energy even more. Just one bite is enough to rid a tired mind of any fatigue. But due to how intense the ingredients are, it's not good for oral health."
 izakaya_item_food_burn_out_pudding: "Burn-out Pudding"
 izakaya_item_food_burn_out_pudding_desc: "The ultimate forbidden dessert with sourness cranked up to the max. Just one is enough to trigger an adrenaline rush and make a youkai dance for an entire night, but after the rush you can't help but say \"I'm all burnt out.\""
 izakaya_item_food_cat_rice: "Neko-manma"
 izakaya_item_food_cat_rice_desc: "Orin said Satori used to make this simple dish for her when she first took her in. The warm taste of velveted flour sprinkled on top of fish has always been remembered fondly by her."
 izakaya_item_food_salmon_tempura: "Salmon Tempura"
 izakaya_item_food_salmon_tempura_desc: "Surround a salmon with egg white and flour, then deep-fry until golden. With each bite juicier than the last, it'll make any cat hungry!"
 izakaya_item_food_fish_leaping_over_the_dragon_gate: "Dragon Carp"
 izakaya_item_food_fish_leaping_over_the_dragon_gate_desc: "A leaping carp on the outside, precious treasures on the inside. The ultimate dish no feline can resist."
 izakaya_item_food_cheese_egg: "Cheese Omelette"
 izakaya_item_food_cheese_egg_desc: "Okuu said Satori used to make this dish for her when she first took her in. Creamy rich cheese mixed into an omelette creates an irresistible snack."
 izakaya_item_food_one_hit_kill: "Instant☆Death"
 izakaya_item_food_one_hit_kill_desc: "A super skewer with additional spices and ingredients added to further stimulate the taste buds. Okuu gave it a really imposing name, which resulted in its inexplicable popularity among wild youkai."
 izakaya_item_food_hellishly_spicy_warning: "CAUTION!! Hellish Spice!"
 izakaya_item_food_hellishly_spicy_warning_desc: "The spiciest of spicy beef curries! They say only a fool or someone with extremely high tolerance would try this dish!"
 izakaya_item_food_roasted_sweet_potato: "Baked Sweet Potato"
 izakaya_item_food_roasted_sweet_potato_desc: "A timeless street snack popular everywhere, especially during winter times. Who would be able to resist the sight of a warm stove with this yellow-colored goodness? But don't be greedy, eating too much will upset your stomach."
 izakaya_item_food_skinny_horse_dumplings: "Yashouma Dango"
 izakaya_item_food_skinny_horse_dumplings_desc: "Looks like elongated dango on the outside. Cutting it open reveals a variety of pictures, breathing a fresh sense of life into dango. Apparently Yashouma Dango symbolizes sarira. Isn't that the Buddha's ashes?"
 izakaya_item_food_scary_great_adventure: "Heart-Throbbing Surprise!"
 izakaya_item_food_scary_great_adventure_desc: "Mushrooms dyed with udumbara extract surround a treasure chest, like a rainbow patch of flowers. What surprise does this chest hold? Thinking that, you open the chest and out jumps a silly umbrella with a big tongue! Surprised?"
 izakaya_item_food_bay_of_biscay_cookies: "Biscay Biscuits"
 izakaya_item_food_bay_of_biscay_cookies_desc: "Trapped on a deserted island, the survivors of a shipwreck had no choice but to mix seawater-soaked flour and cheese into \"batter\" and bake it under the sun. Unexpectedly, it tasted very crispy and delicious, so the recipe was passed down."
 izakaya_item_food_pirate_bacon: "Smoked Buccaneer"
 izakaya_item_food_pirate_bacon_desc: "Apparently the word \"buccaneer\" originated from smoking meat over an open fire. Caribbean natives would smoke meat to sell to Caribbean pirates, which sounds as strange as eggs on scrambled eggs."
 izakaya_item_food_arhats_vegetarian_dish: "Buddha's Delight"
 izakaya_item_food_arhats_vegetarian_dish_desc: "A vegetarian dish from Buddhist cuisine. It's said that authentic Buddha's Delight is made with 18 different ingredients with complex and elaborate procedures. The finished dish is a colorful blend of elegance, with a light and fragrant taste. One could say this is the most luxurious dish in Buddhist cuisine."
 izakaya_item_food_cloud_mountain_marshmallows: "Unzan Cotton Candy"
 izakaya_item_food_cloud_mountain_marshmallows_desc: "Among Myouren Temple's disciples is a shapeshifting nyuudou whose face easily reminds one of cotton candy. A sweet but not too sweet cotton candy with added peach juice. Its interesting shape makes it very popular with kids."
 izakaya_item_food_sacred_white_lotus_seed_cake: "Pure White Lotus"
 izakaya_item_food_sacred_white_lotus_seed_cake_desc: "Shell and core a fresh lotus seed, boil until soft, add butter and flour, mix until even, stir-fry and imprint the pattern of a lotus with a mold. A pure, white lotus."
 izakaya_item_food_fantasy_star_lotus_boat: "Star Lotus Ship"
 izakaya_item_food_fantasy_star_lotus_boat_desc: "The pumpkin ship sails into fantasy with a crew of fantastical ingredients on the river of lotus seeds. It's said that anyone who consumes this dish will be spirited away into a dream. As for what kind of dream, that depends on the person."
 izakaya_item_food_pine_nut_cake: "Pine Nut Cake"
 izakaya_item_food_pine_nut_cake_desc: "A medicinal dish made with glutinous rice as the main ingredient and pine nuts as supplement. The powder of pine nut cake is soft, delicate and delicious, in addition to a refreshing pine nut flavor. A favorite among Taoist priests."
 izakaya_item_food_white_deer_and_upright_pine: "White Deer, Unyielding Pine"
 izakaya_item_food_white_deer_and_upright_pine_desc: "The white deer and the pine tree are both symbols of longevity, held in high esteem by Taoists who seek a longer life, hence the painting of a deer and a pine tree. This is a dish made in the painting's image."
 izakaya_item_food_tai_chi_bagua_fish_maw: "Eight Trigram Fish Maws"
 izakaya_item_food_tai_chi_bagua_fish_maw_desc: "A classic Taoist dish requiring very precise steps. The fish maw must be cut into thin slices-the thinner the better-the trigrams must be constructed meticulously, paying close attention to the placement of the lines. Carefully steam it and you get a vivid image of the eight trigrams with soft and delicious fish maws."
 izakaya_item_food_candied_chestnuts: "Honeyed Chestnut"
 izakaya_item_food_candied_chestnuts_desc: "The result of simmering chestnuts in honey. The chestnut's delicate yet rich flavor effectively balances out the sweetness."
 izakaya_item_food_tianshi_chestnut_braised_mushrooms: "Tianshi's Stewed Mushrooms"
 izakaya_item_food_tianshi_chestnut_braised_mushrooms_desc: "The Divine Spirit Mausoleum is located in Senkai, so the chestnuts there are said to contain divine energy. I can't really tell the difference though... Wouldn't it be more practical to stew chestnuts with mushrooms and turn this intangible divine energy into a pot of sweet and savory stew?"
 izakaya_item_food_lotus_flower_fish_and_rice_cups: "Lotus Fish Lamps"
 izakaya_item_food_lotus_flower_fish_and_rice_cups_desc: "A snow-white dish adorned with dark green mint leaves, crystal dew rolls around in the leaves, complimented by a white lotus in the center to give it a \"hermit-like\" touch. Each lotus lamp consists of a fresh pink lotus petal as the base, carrying an ensemble of mashed tuna and lotus seeds. Healthy and delicious."
 izakaya_item_food_candied_sweet_potatoes: "Candied Sweet Potato"
 izakaya_item_food_candied_sweet_potatoes_desc: "Deep fry sweet potatoes until golden brown and coat them in a layer of sugar, then serve after rolling in a greased plate. A delicious snack which won't get stuck in your teeth. But don't get greedy, eating too much will upset your stomach."
 izakaya_item_food_pan_fried_meat_rolls_with_two_types_of_mushrooms: "Golden Two-Shroom Wrap"
 izakaya_item_food_pan_fried_meat_rolls_with_two_types_of_mushrooms_desc: "A common but delicious delicacy with a balanced mix of meat and vegetables. Two different mushrooms wrapped in carefully selected meat creates a layered flavor for the taste buds."
 izakaya_item_food_assorted_tempura: "Tempura Platter"
 izakaya_item_food_assorted_tempura_desc: "Who said fried food must be birds? In land, in sea or under the ground, anything can become a crispy, mouth-watering delight once smothered in flour and deep fried. Finish with lunar herbs as garnish to subtly neutralize the greasiness of fried foods."
 izakaya_item_food_fried_tomato_strips: "Tomato Fries"
 izakaya_item_food_fried_tomato_strips_desc: "Deep fried tomato covered with flour and drizzled with homemade potato sauce gives it a distinguishing taste."
 izakaya_item_food_braised_pork_with_peaches: "Peach Braised Pork"
 izakaya_item_food_braised_pork_with_peaches_desc: "Soft tender meat on top of aromatic peach, a dish you'll never get sick of even if eaten by itself. Cook with a dash of honey to further enhance the flavor. Pairs exceedingly well with alcohol."
 izakaya_item_food_turn_the_world_upside_down: "Against The World!"
 izakaya_item_food_turn_the_world_upside_down_desc: "Molecular gastronomy recipe made with revolutionary technology; said to have originated from the moon. Many unknowns were encountered during the cooking process, therefore a certain amount of redesigning had to be done. It ultimately became an \"earthly\" dish, fusing what is perceived to be \"elegant\" and \"conventional\", as well as an embodiment of Seija's wish to mush up the world."
 izakaya_item_food_red_bean_daifuku: "Red Bean Daifuku"
 izakaya_item_food_red_bean_daifuku_desc: "Yummy red bean paste wrapped in a skin of glutinous rice. The amount of filling is just as much if not more than its wrapping, giving it its smooth and round appearance. In Japanese, \"fuku\" is the word for \"luck\", so it symbolizes luck and good fortune."
 izakaya_item_food_dorayaki: "Dorayaki"
 izakaya_item_food_dorayaki_desc: "A confection where red bean paste is sandwiched between two pancake-like patties. Its name is derived from \"dora\", or \"gong\" in Japanese, referring to how it looks like two gongs merged together."
 izakaya_item_food_hangongs_hidden_beauty: "Palace of the Han"
 izakaya_item_food_hangongs_hidden_beauty_desc: "Pure white tofu symbolizing Diao Chan's purity and a pond loach hinting at Dong Zhuo's treachery. A dish that reminds one of Wang Yun's scheme with Diao Chan, using her beauty to depose the tyrant Dong Zhuo, naturally imbuing a sense of culture into the dish."
 izakaya_item_food_stone_pot_braised_pork_with_bamboo_shoots: "Bamboo Meat Pot"
 izakaya_item_food_stone_pot_braised_pork_with_bamboo_shoots_desc: "A home-cooked dish featuring beef and bamboo shoot. Meat stewed with fresh and tender bamboo shoot whets the appetite and improves digestion. Plate it with bamboo and you get a wonderful blend of flavor and color."
 izakaya_item_food_steamed_pork_in_a_bamboo_tube: "Rice Powder Meat"
 izakaya_item_food_steamed_pork_in_a_bamboo_tube_desc: "The most tender parts of pork, cut into sections of bamboo with small holes poked in, filled with ingredients and spice, and steamed under high heat until the unique fragrance of bamboo emerges. If time allows it, adding in water during the marinating process will give the meat a shine and makes it easier to swallow."
 izakaya_item_food_emerald_bamboo_welcomes_spring: "Bamboo Spring"
 izakaya_item_food_emerald_bamboo_welcomes_spring_desc: "A variety of fresh and tender ingredients steamed inside a bamboo with multiple sections create a dish which sends a message. The fresh, jade-colored bamboo gives guests a new experience in terms of taste and sight in addition to providing a grand welcome for spring."
 izakaya_item_food_plum_tea_soaked_rice: "Plum Tea Rice"
 izakaya_item_food_plum_tea_soaked_rice_desc: "Piping hot white rice soaked in broth! The broth used in tea over rice is usually infused tea, roasted tea, or sweet and aromatic fish stock. A plum sits on top, adding color to this otherwise simple dish."
 izakaya_item_food_steamed_egg_with_sea_urchin: "Urchin Steamed Egg"
 izakaya_item_food_steamed_egg_with_sea_urchin_desc: "A simple dish which can be made by steaming egg and sea urchin until the sea urchin eggs change color. Dig in with a spoon to reveal the delectable smell of sea urchin and steamed egg guaranteed to linger on your senses."
 izakaya_item_food_fantasy_craze: "Scrumptious Storm"
 izakaya_item_food_fantasy_craze_desc: "A dish which requires unwavering focus and a very precise control over the flame to cook the meat into a perfect medium-rare. Its dark red hue laid in the shape of a destructive tornado brings out an oppressive sense of foreboding. Eating it makes you feel like you're on top of the world."
 izakaya_item_food_mystical_mushrooms_of_the_green_fields: "Mushroom Herb Road"
 izakaya_item_food_mystical_mushrooms_of_the_green_fields_desc: "Essentially a mix of mushrooms and herbs. The name gives a strange sense of wonder to it, however."
 izakaya_item_food_flowers_birds_wind_and_moon: "Nature's Beauty"
 izakaya_item_food_flowers_birds_wind_and_moon_desc: "A literal manifestation of the phrase \"flower, bird, wind, and moon\", as well as a triangular cake made in Miss Yuuka's image. It's just as elegant as her, but with one of my own feathers on top of it, it should still be a pretty interesting dish. . . Maybe?"
 izakaya_item_food_a_serene_dream: "Faint Dream"
 izakaya_item_food_a_serene_dream_desc: "A two-layered cake themed after flowers. A bouquet of flowers affixed upon delicate, soft cream, oozing with sweet fragrance. A blue butterfly gently rests atop, never leaving—it's not a dream, and yet it's beyond a dream."
 izakaya_item_food_toon_tree_pancakes: "Toon Pancake"
 izakaya_item_food_toon_tree_pancakes_desc: "A pancake made with the \"poisonous\" red toon. It tastes bitter at first, but leaves a sweet aftertaste in the mouth. REMEMBER: blanch the red toon in water before serving it to normal guests!"
 izakaya_item_food_garden_of_poisonous_mists: "Miasma Garden"
 izakaya_item_food_garden_of_poisonous_mists_desc: "A hodgepodge of various \"poisonous\" ingredients. Precise handling of each ingredient allow for the retention of \"poison\" in the ingredients to varying degrees, letting every guest experience the exact level of thrill they wish for."
 izakaya_item_food_a_little_sweet_poison: "Little Sweet \"Poison\""
 izakaya_item_food_a_little_sweet_poison_desc: "A dessert modeled after the little poisonous doll—Medicine Melancholy. Its cute appearance is accompanied by strange colors, not too dissimilar from the charmingly beautiful poisonous mushrooms in nature, tempting people to harvest them. But in actuality, it's not poisonous, just like Medicine~"
 izakaya_item_food_eel_and_soft_boiled_egg_bowl: "Eel Bowl with Egg"
 izakaya_item_food_eel_and_soft_boiled_egg_bowl_desc: "Thick slices of eel coated with gourmet soy sauce, topped with a layer of silky raw eggs. Try mixing the egg with rice and giving it a golden look, so that every one of your taste buds will feel satisfied!"
 izakaya_item_food_drunken_shrimp_in_a_bamboo_tube: "Drunk Shrimp in Bamboo"
 izakaya_item_food_drunken_shrimp_in_a_bamboo_tube_desc: "Freshly-caught shrimp marinated in sake, bathed in ice, and topped with spices. A doubled experience combined with both shrimp's umami and sake's fragrance. Delicious!"
 izakaya_item_food_beef_yuanyang_hot_pot: "Two-flavor Beef Hotpot"
 izakaya_item_food_beef_yuanyang_hot_pot_desc: "Makai pepper spicy broth on the one side, daikon beef bone broth fills the other, a red-and-white specialty beef hotpot. Divided yet coherent together, smells like family."
 izakaya_item_food_cat_canele: "Kitten Canele"
 izakaya_item_food_cat_canele_desc: "Mellow heart covered in crispy caramel coat. An astounding experience is only possible through such changing textures filled with flavors. No wonder they called it \"Angel's Bell\". . . and check out what's in the bell! It's a kitten!"
 izakaya_item_food_cat_pizza: "Kitten Pizza"
 izakaya_item_food_cat_pizza_desc: "Pizza with various toppings, a perfect balance between nutrition and impressions, especially the rich flavor coming from caramelized onions offering layers of joy for your tongue. However, biting into a cute kitten-shaped pizza has been proven difficult."
 izakaya_item_food_cat_playing_in_water: "Kitten's Water Play"
 izakaya_item_food_cat_playing_in_water_desc: "Kitten-themed stuffed toast. First, scoop out the loaf from the inside, then layer with cream, peach jam, cream again, and cover it with toast. Next, add in the crystally jelly, make it like a wave of water by covering it with cream dyed blue, and finish it with the last piece - a chocolate kitten. Now you have an interesting dish where it looks like a kitten playing on water."
 izakaya_item_food_rapunzel: "Long Hair Princess"
 izakaya_item_food_rapunzel_desc: "Delicately plated spaghetti with shrimp and pumpkin. The sweetness and mellow texture of low-fat low-calorie pumpkin make a great replacement for butter, enriching both flavor and nutrition."
 izakaya_item_food_sea_urchin_shingen_mochi: "Urchin Raindrop Cake"
 izakaya_item_food_sea_urchin_shingen_mochi_desc: "Crystal-clear raindrop cake made from tuna broth, combined with sea urchins, forming an elegant view of yellow like premium champagne. Sesame sauce at the bottom further enhances its texture. It almost feels bad to think about its fate being a dessert rather than a delicate, fine-crystal art."
 izakaya_item_food_mad_hatters_tea_party: "Mad Hatter's Tea Party"
 izakaya_item_food_mad_hatters_tea_party_desc: "Dessert takes inspiration from Makai's tea party. At first glance, it's simply a teapot made of chocolate, but inside the teapot, it's filled with layered cream cakes, decorated with mushroom and broccoli, just like the candy house from the fantasy. A dessert of happiness, filled with dreams and mystery."
 izakaya_item_food_peach_blossom_glass_roll: "Peach Flower Crystal Roll"
 izakaya_item_food_peach_blossom_glass_roll_desc: "Cute and pink peach flowers turned into crystally jelly, thanks to gelation technology. The mellow red bean paste inside preserves the sweet romance of the season."
 izakaya_item_food_moonlight_over_the_lotus_pond: "Moonlight over the Lotus Pond"
 izakaya_item_food_moonlight_over_the_lotus_pond_desc: "Refreshing grape-flavored oolong tea jelly, dressed in white cream mousse! The collision of cream's silkiness and grape's sharpness creates a new dimension of flavors. The Shine Muscat dressed across the jelly fills the mouth with a delicate, fruity smell. The interesting arrangement of raindrops on the lotus pad adds even more aesthetics to the dish."
 izakaya_item_food_dragons_roar_peach: "Dragonsong Peach"
 izakaya_item_food_dragons_roar_peach_desc: "Essentially, it's about making a peach anew with peach. Mince the peach, then recreate the shape of the peach using the minced peach. On the surface, this may seem to be a simplistic approach, but the actual making process is insanely complex and delicate."
 izakaya_item_food_molecular_egg: "Molecular Egg"
 izakaya_item_food_molecular_egg_desc: "Egg white made of less watery firm tofu, with egg yolk made of mellow pumpkin, locked in an eggshell made of chocolate, perfectly recreating both the shape and texture of a chicken egg. An idea only a genius would've thought of."
 izakaya_item_food_source_of_life: "Origin of Life"
 izakaya_item_food_source_of_life_desc: "At first sight, it's a mysterious planet covered with layers of clouds, but it's only a raw egg once the \"planet\" is opened up! The \"raw egg\" is actually tremella soup \"egg\" white with pumpkin paste \"egg\" yolk. Refreshing taste with rich pumpkin flavor."
 izakaya_item_food_mars: "Planet Mars"
 izakaya_item_food_mars_desc: "Bottom of the plate solely designed to recreate the surface of Mars, topped with a premium mix of crab jelly and white wine grape jelly, only possible through molecular gastronomy. A delicacy combining the refreshing, chilly texture of the crab and the raindrop-like fruit jelly filled with a white wine aroma. Metaphorically, it's a droplet of water on planet Mars, representing the last hope."
 izakaya_item_food_nourishing_heart_porridge: "Heart-warming Congee"
 izakaya_item_food_nourishing_heart_porridge_desc: "Tremella congee with lotus seed. Slightly sweeter than regular congee. Moisten the throat with no aftertaste. A comfort food full of nutrients that are good for the heart and mind."
 izakaya_item_food_spicy_soup: "Hot Pepper Soup"
 izakaya_item_food_spicy_soup_desc: "Ingredients include many herbs used in Chinese medicine, black pepper, and chili pepper, then brewed in beef bone broth. One spoon is enough to defeat sleepiness."
 izakaya_item_food_dark_matter: "Dark Matter"
 izakaya_item_food_dark_matter_desc: "The embodiment of \"failures.\" An indescribable cluster of mess with a dark aura. No one in their right mind would want to eat it, right?"
 izakaya_item_food_supreme_seafood_noodles: "Supreme Seafood Noodles"
 izakaya_item_food_supreme_seafood_noodles_desc: "Al dente noodles stewed in seafood broth, filled with seafood umami, a luxurious family dish. One bowl is enough to recall the deep memory of umami hidden by the sea."
 izakaya_item_food_mountain_spring_two_tone_fruit_platter: "Mountain Spring Fruit Duo"
 izakaya_item_food_mountain_spring_two_tone_fruit_platter_desc: "A fruit platter made by soaking wild mountain fruit in spring water. Smooth, cool, and sweet. Platters prepared by fairies can even keep for several days without discoloring. Perhaps their vitality is at work."
 izakaya_item_food_fish_cakes: "Fish Cakes"
 izakaya_item_food_fish_cakes_desc: "Milder than the original fish cakes from the East, with their shape adapted to the fish found in Misty Lake. A fine snack for sobering up, and a favorite with children too."
 izakaya_item_food_ginkgo_nut_spirit_bowl: "Ginkgo Spirit Bowl"
 izakaya_item_food_ginkgo_nut_spirit_bowl_desc: "A simple yet elegant chawanmushi. Ginkgo nuts replace the fresh shrimp rarely found in Misty Lake, giving it a lighter flavor than ordinary steamed egg custard. A garnish of Lunar Herb adds a glimmer of spiritual light to an otherwise humble dish. In ancient times, it might have been a rare and prized delicacy."
 izakaya_item_food_devils_donuts: "Devil's Doughnuts"
 izakaya_item_food_devils_donuts_desc: "Shaped like doughnuts with a pair of devil horns, these supposed sweets are actually cheeseburgers through and through. Be especially careful when eating them: the hole in the middle makes it easy to get your clothes dirty."
 izakaya_item_food_sculpture_of_justice: "Justice Served Sculpture"
 izakaya_item_food_sculpture_of_justice_desc: "A sculpture made from intensely sweet chocolate. It seems to depict a laughing figure in black and red trampling a pink figure underfoot. Is this what she means by 'justice served'? Well, as long as she is happy."
 izakaya_item_food_hyper_dimensional_inferno_barbecue_feast: "Super-Tier Inferno Barbecue Feast"
 izakaya_item_food_hyper_dimensional_inferno_barbecue_feast_desc: "Meat suspended with binding magic and roasted with fire magic. Full marks for the visual effects! However, someone's peculiar sense of taste demands super-tier magic for this dish, turning every cooking session into a fireworks show."
 izakaya_item_food_sweetheart_sandwiches: "Sweetheart Sandwiches"
 izakaya_item_food_sweetheart_sandwiches_desc: "Sandwiches with a truly bizarre flavor. Their colorful appearance is adorable, but the taste inside is simply staggering. Perhaps someone will like them..."
 izakaya_item_food_fuzzy_mushroom_soup: "Fluffy Mushroom Soup"
 izakaya_item_food_fuzzy_mushroom_soup_desc: "A Western-style soup topped with bits of marshmallow to resemble a sheep's fluffy coat. Beneath the soft surface lies a crimson meat broth with a fiercely assertive, powerful game flavor. Such a cute appearance for such an intense dish!"
 izakaya_item_food_blood_red_afternoon_tea: "Blood-Red Afternoon Tea"
 izakaya_item_food_blood_red_afternoon_tea_desc: "An imitation of Remilia's ordinary afternoon tea. The aged steak has been replaced with honey-glazed beef more suited to a child's palate, and the accompanying fried egg is fully cooked. Incidentally, the most authentic version serves the steak medium rare, or even rare."
 izakaya_item_food_tsukimi_mochi: "Moon-Viewing Cake"
 izakaya_item_food_tsukimi_mochi_desc: "A snack passed down in the Lunar Capital to commemorate a great figure. Round as the full moon, with a delicate, soft texture and a faint sweet fragrance. Especially suitable for children."
 izakaya_item_food_jade_colored_broth: "Jade Broth"
 izakaya_item_food_jade_colored_broth_desc: "A medicinal soup developed by Eirin, with a light sweetness and a hint of bitterness. Said to clear the lungs, soothe coughs, disperse blood stasis, and replenish qi, it is intended for weakened patients."
 izakaya_item_food_star_and_moon_peach_cake: "Starlight and Moonlight Peach Cake"
 izakaya_item_food_star_and_moon_peach_cake_desc: "A dessert made to tempt patients with poor appetites. Udumbara and Lunar Herb evoke starlight and moonlight, while a sweet peach base gently whets the appetite without overwhelming the senses. Such a delicate and thoughtful dessert could only come from the Brain of the Moon."
 izakaya_item_food_cherry_blossom_and_star_dust_jade_stew: "Scarlet Sakura and Stardust Jade Risotto"
 izakaya_item_food_cherry_blossom_and_star_dust_jade_stew_desc: "A rice dish apparently called 'risotto' in the Outside World. The god of Makai has adapted it by combining sticky rice with Parmesan cheese, adding chopped chili and mushrooms, and heating it all in a pan. A scattering of soft flower petals completes this distinctly Western dish. The glistening mushroom pieces in the fragrant, creamy rice resemble a sky full of stars illuminating a field of flowers. Each sweet and spicy bite brings together Gensokyo's springtime cherry blossoms and Makai's night sky."
 izakaya_item_food_dark_moon_wonderland_mousse: "Dark Moon Demon Realm Mousse"
 izakaya_item_food_dark_moon_wonderland_mousse_desc: "Mousse is a sweet, soft dessert made by mixing eggs, cream, and various flavorings. The god of Makai has adapted it with layers of chocolate, vanilla, and taro, topped with two red berries. Its appearance resembles Makai's magnificent palace, Pandemonium. This luxurious dessert is said to be indispensable whenever Shinki entertains guests or holds a tea party."
 izakaya_item_food_ember_colored_demon_patterned_mille_feuille: "Ember-Hued Demonic Mille-Feuille"
 izakaya_item_food_ember_colored_demon_patterned_mille_feuille_desc: "A coffee-colored mille-feuille modeled after the demon god's wings. Bitter and savory fillings combine with crisp pastry for a distinctive flavor in every bite. Pieces of chocolate and strawberry jam decorate the top, making it look just like those wings."
 izakaya_item_food_gravy_and_cheese_french_fries: "Gravy and Cheese Fries"
 izakaya_item_food_gravy_and_cheese_french_fries_desc: "A high-calorie Western fast food apparently called 'poutine' in the Outside World. It originated in Quebec and is considered Canada's national dish. With so many people of French descent living there, locals took French fries and added gravy, shredded beef, and cheese curds to create this towering calorie bomb. Modern versions often pile on diced lamb, jalapenos, bacon strips, barbecue sauce, ranch dressing, and tartar sauce as well. Just looking at it is enough to make your stomach turn from all that richness... 'More is better! Mai will absolutely love it!' says Yuki."
 izakaya_item_food_russian_hot_and_sour_soup: "Russian Hot and Sour Soup"
 izakaya_item_food_russian_hot_and_sour_soup_desc: "A Western-style soup apparently called 'solyanka' in the Outside World, said to have originated in Russia's cold Far East. Legend has it that people trying to survive the bitter winter combined whatever vegetables and meat they had with plenty of pickles and lemon to make this rich, hot and sour soup. Its sharp, spicy flavor seems to have kept it from becoming popular in Makai. Shinki is relieved that she does not have to learn another recipe. 'Hot and sour! One bowl gives you endless energy! Mai will absolutely love it!' says Yuki."
 izakaya_item_food_creamy_sweet_pancake_rolls: "Cream-Filled Cannoli"
 izakaya_item_food_creamy_sweet_pancake_rolls_desc: "A Western dessert apparently called 'cannoli' in the Outside World. Originally from Palermo, Italy, it is also Makai's most popular afternoon tea treat. Its preparation is unusual: pastry dough is wrapped around a special metal rod or foil mold, fried until golden, and then filled with cream. Cocoa powder, icing sugar, and edible gold leaf provide the finishing touches. 'A dessert like this is a breeze for a demon god like me!' A fixture of Shinki's afternoon tea, her magically prepared cannoli were praised throughout Makai... until one day she decided to try making them by hand instead."
 izakaya_item_food_grilled_corn: "Grilled Corn"
 izakaya_item_food_grilled_corn_desc: "Corn harvested by Mai herself, roasted over the red autumn leaves found everywhere, then finished with butter and caramel. Sweet and filling, with kernels toasted on the outside and tender within. A simple method that has stood the test of time."
 izakaya_item_food_russian_chilled_soup: "Russian Chilled Soup"
 izakaya_item_food_russian_chilled_soup_desc: "A Western-style soup apparently called 'okroshka' in the Outside World, perfect for cooling off in summer. Plenty of summer vegetables are mixed with condensed milk, kefir, and kvass. Preparation is simple: put the mixture in the freezer, then add salt and black pepper once it has frozen. Even Shinki can easily learn this recipe, making it very popular in Makai."
 izakaya_item_food_spanish_cold_soup: "Spanish Cold Soup"
 izakaya_item_food_spanish_cold_soup_desc: "A Western-style soup apparently called 'gazpacho' in the Outside World, with a history said to reach back to Spain's Age of Exploration. Spanish seafarers trading with other countries supposedly began making it by mixing distinctive local fruit and vegetables with garlic. Over the centuries, modern gazpacho has grown beyond a simple vegetable medley, with elaborate variations featuring flowers, ham, strawberries, shrimp, or crab. Shinki cannot master those versions, however, so the simplest one remains the most popular in Makai."
 izakaya_item_food_chestnut_cake: "Chestnut Pastry"
 izakaya_item_food_chestnut_cake_desc: "Cooked chestnuts are shelled and mashed, mixed with butter and just enough sugar, then wrapped in pastry and baked. Crisp outside, soft and sweet within, with a rich chestnut aroma. Every bite announces the arrival of autumn."
 izakaya_item_food_spring_triumph: "Sweeter than a Spring Morning"
 izakaya_item_food_spring_triumph_desc: "A sweet dish inspired by Miss Shizuha's words. Thoroughly steamed sweet potatoes are mashed and combined with seasonal grapes, chestnut puree, and condensed milk bought from farmers in the Human Village. Though every ingredient belongs to autumn, its sweet fragrance rivals any spring morning."
 izakaya_item_food_the_work_of_the_autumn_god: "The Autumn Goddess at Work"
 izakaya_item_food_the_work_of_the_autumn_god_desc: "More like a miniature potted landscape than a dish, it depicts the elder autumn goddess creating falling leaves. Sweet potatoes and chestnuts bring out the flavors of autumn, while touches of syrup enrich the texture. A gentle shake sends the carefully arranged gold leaf fluttering down like autumn foliage."
 izakaya_item_food_pumpkin_pie: "Pumpkin Pie"
 izakaya_item_food_pumpkin_pie_desc: "Golden pumpkin filling nestled in a crisp pastry crust. Cutting into it releases the warmth of autumn sunshine; lift a small piece to your lips and sweetness blossoms on your tongue."
 izakaya_item_food_cheesy_corn_baked_sweet_potatoes: "Cheesy Corn and Sweet Potato Bake"
 izakaya_item_food_cheesy_corn_baked_sweet_potatoes_desc: "Rich cheese meets sweet corn and soft sweet potato. Each bite blends their sweetness into something warm, filling, and comforting. Minoriko's little secret is to add raisins, bringing extra sweetness, texture, and nutrition."
 izakaya_item_food_scary_halloween_night: "Spooky Halloween Night"
 izakaya_item_food_scary_halloween_night_desc: "A dish inspired by old tales of the Outside World's harvest celebrations. Inside a pumpkin-headed 'castle', dark chocolate made from cocoa beans becomes bats, while marshmallows play the ghosts. Halloween surprises hide within the carved jack-o'-lantern, where chocolate bats and marshmallow ghosts rest. Truffles add flavor and a touch of luxury to this curious creation. At the center stands a scarecrow made from corn stalks, a symbol of the harvest that lends this work of art an extra hint of fright."