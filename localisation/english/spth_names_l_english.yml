 NAME_karakasa: "Kogasa Tatara"
 karakasa_BACKGROUND: "寄宿在没有人用了的伞上面的神灵，生气了便化作了付丧神。附在道具上的神明，在被人当宝物宠爱的期间，会很配合主人的。但一旦被丢弃就会露出獠牙，似乎要对人类展开攻击。任何一种道具上面都寄宿着神明，所以请不要亏待它们。就算已经不需要了也请不要草草地丢掉，把道具完全用坏掉之后再扔吧。道具中的神明是不会对被用坏掉这件事发怒的。 "
 job_spth_leader_bg_job_karakasa: "朝夕相伴的唐伞妖怪"
 job_spth_leader_bg_job_karakasa_desc: "WIP"
 NAME_touhou_keiki: "Keiki Haniyasushin"
 touhou_keiki_BACKGROUND: "灵长园的人类灵抱着起死回生之念召唤的神明。她能够制作出精巧的偶像。她所制作的偶像，能够收集信仰、当作替身、一起玩耍、装饰房间，品质上乘。"
 job_spth_leader_bg_job_touhou_keiki: "Master of Primate Spirit Garden, Sculptor God"
 job_spth_leader_bg_job_touhou_keiki_desc: "WIP"
 NAME_kagerou: "今泉影狼"
 kagerou_BACKGROUND: ""
 NAME_shinmyoumaru: "Shinmyoumaru Sukuna"
 shinmyoumaru_BACKGROUND: "她是一寸法师的后裔，因此能够使用万宝槌。初代的一寸法师降伏了鬼，得到了鬼的秘宝『万宝槌』。初代获得了长大的身体和公主这些事都如同传说中所说的一样。除此以外再也没有使用过万宝槌。\n\n因为万宝槌是鬼的法宝，由此引发的奇迹也同样来自鬼的魔力。若是随便使用必招来杀身之祸，这就是初代当时的想法。"
 NAME_seija: "Seija Kijin"
 seija_BACKGROUND: "企图下克上的天邪鬼，天邪鬼不属于鬼，只是一种性格扭曲的妖怪。她一天到晚脑子里总想着和其他人相反的事情，别人一反感她就高兴，看到别人一高兴她就开始心生厌恶。绝对不服从命令。就算自己赚了也绝不会把别人应得的给对方。这样的家伙当然会被人类、妖怪双方都厌恶，但别人越是讨厌她自然就越高兴。\n\n而她的野心就是把幻想乡整个翻转过来。毁掉如今这个由强者稳定支配的幻想乡，把这里变成一个由弱者说了算的世界。"
 job_spth_leader_bg_job_kagerou: "孤独的狼人"
 job_spth_leader_bg_job_kagerou_desc: "WIP"
 job_spth_leader_bg_job_shinmyoumaru: "Inchling, Issun-Boushi"
 job_spth_leader_bg_job_shinmyoumaru_desc: "WIP"
 job_spth_leader_bg_job_seija: "Amanojaku"
 job_spth_leader_bg_job_seija_desc: "WIP"
 NAME_sagume: "稀神探女"
 sagume_BACKGROUND: "平时，在月之民中担任高官，并不会经常在外界面前出现。虽然算是神灵，但是其性质非鬼非神亦非精灵。\n性格寡言，其理由源自能力。对于某种事态，一旦经过自己的口中（尤其是对和事情有关的人），这个事态就会向反方向发展。"
 job_spth_leader_bg_job_sagume: "神明、月之都高级顾问、月都星域行政主官、净土计划三期边防星舰设计专员、低级文明观察记录主官"
 job_spth_leader_bg_job_sagume_desc: "因为她摸了，所以这里也摸了好了。"
 NAME_hina: "键山雏"
 hina_BACKGROUND: "带走悲剧的人偶军团长，把通过消灾而被除掉的厄运贮藏起来。因此，在外行人看来，厄运正包围着她。\n\n靠近她的话，不论是人类和妖怪都会变得不幸。不过她自身却绝对不会变得不幸。说到底厄运只不过是在她周围储存着而已，为了厄运不再回到人类而看守着厄运。"
 job_spth_leader_bg_job_hina: "厄神、雏人偶制作者、雏人偶商店店主"
 job_spth_leader_bg_job_hina_desc: "因为她摸了，所以这里也摸了好了。"
 NAME_doremy_sweet: "哆来咪·苏伊特"
 doremy_sweet_BACKGROUND: "爱做白日梦的妖怪，栖息在梦境。一切生物所做的梦其实在根本都是相互联系的。在梦中前往不曾知晓的地点、遇到不曾相识的人、发现不为所知的BUG都是因为这个原因。她能够消灭、创造、替换这些梦境。"
 job_spth_leader_bg_job_doremy_sweet: "貘、梦之支配者、梦境世界监护者"
 job_spth_leader_bg_job_doremy_sweet_desc: "因为她摸了，所以这里也摸了好了。"
 NAME_kosuzu: "本居小铃"
 kosuzu_BACKGROUND: "她收藏了大量妖魔书，并且具有读懂任何文字的能力，因此时不时放出妖魔书中的妖魔，也因此曾经被各路妖怪盯上，作为争夺人类村落的支点。不过现在她已经学会了如何灵活的控制与运用自身的能力。"
 job_spth_leader_bg_job_kosuzu: "铃奈庵的女儿、妖魔书收藏者"
 job_spth_leader_bg_job_kosuzu_desc: "因为她摸了，所以这里也摸了好了。"
