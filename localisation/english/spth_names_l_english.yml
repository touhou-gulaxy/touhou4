 NAME_renko: "Renko Usami"
 renko_BACKGROUND: "Renko Usami is an university student of the near future. She is majoring in super unified physics, while also being a member of the occult club, named \"Hifuu Club\". This club seek out the gaps in the boundaries of the world in the Age of Science."
