 lunar_capital_psi.47.name: "§M隐形场失能§!"
 lunar_capital_psi.47.desc: "升格派的灵能环境在整个星系范围内造成了可怕的影响，某种不可名状的东西会使得舰船的隐形场难以发挥正常作用。"
 lunar_capital_psi.47.a: "Oh no."
