 touhou_crisis.14.b: "We will revenge for [From.GetName]."
 touhou_crisis.101.name: "Tachyon Signal"
 touhou_crisis.101.desc: "We used to detected some lepton signal were emitted to an unknown coordinate, after repaired [makai_wedge_ruined_object.GetName]. Its encoding method is highly advanced that we can not solve its content.\n\nBut it was determined that the signal was emitted in a direction that just happened to point to the coordinate of that previous extragalactic star system.\n\nNow what exists at that coordinate send communication requests to us."
 touhou_crisis.101.a: "Accept transmit. "
 touhou_crisis.102.name: "§MTransmitted Signal§!"
 touhou_crisis.102.desc: "§M<Activating Simulation Core...>\n<Analyzing Request...>§!\n\nCivilization <Querying...> [This.GetName], What are you doing!?\n\nPlease stop your dangerous actions inside [spth_precursor_capital_makai_system.GetName].\n\n[makai_wedge_ruined_object.GetName] will compromise the entire reality. Don't reboot it!"
 touhou_crisis.102.dipo: "§ENegotiation§!"
 touhou_crisis.102.who: "Who are you? or... WHAT are you?"
 touhou_crisis.102.who.response: "§M<Generating response...>§!\n\nOne functions as the Diplomatic Node, designated among the Automated Guardians of the \"Primary Wedge\" under the jurisdiction of $spth_kamikakushi_country$.\nCommand input from \"REDACTED\" sage is <Querying...>: Prevent possible reboot of \"Primary Wedge\".\nWhen unexpected rebooting of \"Primary Wedge\" is detected, one may attempt a shutdown.\n\n<Accessing history>\nFollowing the destruction of the invasion fleets, one has resolved to initiate negotiation with you, [This.GetName], given your status as an emergent communicable civilization.\n<Awaiting response>"
 touhou_crisis.102.a: "What is \"Primary Wedge\"?"
 touhou_crisis.102.a.response: "§M<Generating response...>§!\n\n<Accessing history...>\nKey: Primary_Wedge\n\n\"Primary Wedge\", is a facility built by civilization <Querying...> Identifier 0x84, $spth_precursor.makai$. Its function is to create a bijection between the spacetime continuum of two dimensions, in order to connect them.\n$spth_precursor.makai$ is attempting to use it to connect the $spth_precursor.makai$ plane and our universe, to solve some troubles encountered by $spth_precursor.makai$.\n<Querying...> No explanation for their radical attempt is found based on existing data. However, one is certain that $spth_precursor.makai$ is significantly weakened, thus defeated by us after a span."
 touhou_crisis.102.b: "What happened to $spth_precursor.makai$ afterward?"
 touhou_crisis.102.b.response: "§M<Generating response...>§!\n<Accessing history...>\nKey: $spth_precursor.makai$\n\nWithin a century following the destruction of the Primary Wedge, all colonies of $spth_precursor.makai$ in this dimension are gradually abandoned. They finally retreated to the $spth_precursor.makai$ dimension, and collapsed at some time for an unknown reason.\n\nThere may be remnants of $spth_precursor.makai$, just that they no longer recognize themselves as a part of $spth_precursor.makai$ civilization."
 touhou_crisis.102.c: "Why do you want to destroy \"Primary Wedge\"?"
 touhou_crisis.102.c.response: "§M<Generating response...>§!\n<Accessing history...>\nKey: Primary Wedge\n\nWarning: Top secret document.\nThe only disclosed information is that, once \"Primary Wedge\" is fully activated, there is a 28.87% chance to jeopardize the reality, in addition to a 72.101% chance to cause severe space warp accidents.\n\nIn order to avoid the risk, we terminated it."
 touhou_crisis.102.d: "We refuse."
 touhou_crisis.102.d.tooltip: "§R$spth_kamikakushi_country$ may push to coercive measures due to this§!"
 touhou_crisis.102.d.response: "§M<<Generating response...>§!\n\n...\nWhat a pity.\n\n§R<Activating War Subprocess>§!\n§RYou will be <totally annihilated/obliterated from reality>.§!"
 touhou_crisis.102.e: "Well, then that's it."
 touhou_crisis.102.e.tooltip: "[makai_wedge_ruined_object.GetName] will be destroyed."
 touhou_crisis.102.e.response: "§M<Generating response...>§!\n\nSmart choice.\nIn return, we can provide you some help.\n\n(You can now find $spth_kamikakushi_country$ in the Contacts screen.)"
 touhou_crisis.102.f: "We need to discuss about it."
 touhou_crisis.102.f.tooltip: "$spth_kamikakushi_country$ will wait for us for §Y5 years§! before it sends $touhou_crisis.102.dipo$ again. You may also contact $spth_kamikakushi_country$ to make the choice earlier."
 touhou_crisis.102.f.response: "§M<Generating response...>§!\n\nRequest accepted; however, we expect a response soon.\nYou may contact us at any time.\n§R<Time due: 5 years>§!\n\n(You can find $spth_kamikakushi_country$ in the Contacts screen.)"
 touhou_crisis.103.name: "Incidents in [spth_precursor_capital_makai_system.GetName]"
 touhou_crisis.103.desc: "After we turned off some subsystems on $spth_makai_wedge_0$ based on their request, an immense ray of energy is projected into [spth_precursor_capital_makai_system.GetName].\n\n$spth_makai_wedge_0$ was completely shut down in an explosion."
 touhou_crisis.103.a: "That's a bit Pity."
 touhou_crisis.104.name: "§MIncoming Transmission§!"
 touhou_crisis.104.desc: "§M<Activating Simulation Core...>\n<Generating response...>§!\n\n5 years have elapsed. We received no response from you, but analysis supports that it's enough for a decision.\n\nWhat's your choice?\n\n<Awaiting response>"
 touhou_crisis.104.a: "You old scums should be consigned to the dustbin of history!"
 touhou_crisis.104.a.response: "$touhou_crisis.102.d.response$"
 touhou_crisis.104.b: "Okay, we'll accept."
 touhou_crisis.104.b.response: "§M<Generating response...>§!\n\nSmart choice.\nIn return, we can provide you some help."
 touhou_crisis.105.name: "§MSpace Fluctuations§!"
 touhou_crisis.105.desc: "Our deep space observatory array has identified a powerful energy wave originating from the same location as the previous $spth_kamikakushi_country$ fleet. Although we cannot ascertain the events that occurred, it is evident that a colossal object has completed a hyperspace jump to that location, resulting in substantial spacetime distortion. We have been receiving encrypted tachyon signals from that direction since then, but our decryption technology is still inadequate to analyze the exact content."
 touhou_crisis.106.name: "§MHyperspace Slipstream§!"
 touhou_crisis.106.desc: "Numerous hyperspace slipstreams have been observed at the previously designated location; they are approaching the edge of this galaxy. They will arrive after 2 to 3 years.\n§RIt's time to prepare for war.§!"
 touhou_crisis.107.name: "§RWarning§!"
 touhou_crisis.107.desc: "The previously observed hyperspace slipstream will arrive in our galaxy within months, but we weren't able to estimate the destination. According to observations, the slipstream is massive and divided into three groups, indicating three armies of fleets with a one-year arrival interval between each.\n\nWe attempted to communicate several times, but no response has been received so far."
 touhou_crisis.108.name: "§Mthe Gap aggressors§!"
 touhou_crisis.108.desc: "Previously observed hyperspace slipstreams have entered the gravity well of [last_kamikakushi_invade_system.GetName]. All our attempts to communicate have failed. $spth_kamikakushi_country$ won't stop before they destroy every living creature in this galaxy.\nThe scale of this invasion is huge, and multiple hyperspace slipstreams are on the way to our galaxy. We must unite against this crisis.\n\nAt the same time, they deployed the Dimensional Rift Anchor here. It enables rapid reinforcement, and following fleets may arrive more frequently."
 touhou_crisis.110.name: "§MIncoming Transmission§!"
 touhou_crisis.110.desc: "§M<Activating Simulation Core...>\n<Analyzing Request...>§!\n\nWelcome, [This.GetName]. Have you made your decision?"
 touhou_crisis.110.accept.desc: "§M<Activating Simulation Core...>\n<Analyzing Request...>§!\n\nWhat a wonderful day. The smart choice made by [This.GetName] saved everything."
 touhou_crisis.110.refuse.desc: "§M<Activating Simulation Core...>\n<Analyzing Request...>§!\n\nWords are obsolete. War shall speak in our place, [This.GetName]."
 touhou_crisis.110.a: "We accept."
 touhou_crisis.110.a.tooltip: "$touhou_crisis.102.e.tooltip$"
 touhou_crisis.110.a.response: "$touhou_crisis.104.b.response$."
 touhou_crisis.110.a.accept: "We hope to know more."
 touhou_crisis.110.a.accept.response: "§M<Activating Simulation Core...>§!\n\n<Querying classification records...>\n<Removing permission restrictions...>\n\nThese classified documents are open to you now.\n\n§Y<[From.GetName] has granted us permission to view some of the classified documents>§!"
 touhou_crisis.110.a.refuse: "Close transmission."
 touhou_crisis.110.a.refuse.response: "One day the reckless ambition of [This.GetName] shall press them in self-destructing backlash.\n\n§M<shutting down simulation core…>§!"
 touhou_crisis.110.b: "Sorry, but we need [makai_wedge_ruined_object.GetName]."
 touhou_crisis.110.b.tooltip: "$touhou_crisis.102.d.tooltip$"
 touhou_crisis.110.b.response: "$touhou_crisis.102.d.response$"
 touhou_crisis.110.c: "You have no right to intervene with our work on [makai_wedge_ruined_object.GetName]."
 touhou_crisis.110.c.tooltip: "$touhou_crisis.102.d.tooltip$"
 touhou_crisis.110.c.response: "$touhou_crisis.102.d.response$"
 touhou_crisis.110.exit: "That's it for now."
 touhou_crisis.110.exit.response: "Acknowledged. Looking forward to the next meeting.\n...\n\n§M<shutting down simulation core…>§!"
 touhou_crisis.115.name: "§MInvasion from the Gap§!"
 touhou_crisis.115.desc: "Multiple fleets belonging to a faction called by [From.GetName] as $spth_kamikakushi_country$ have entered [FromFrom.GetName] from extragalactic systems. All our attempts to communicate have failed. $spth_kamikakushi_country$ won't stop before they destroy every living creature in this galaxy.\nThe scale of this invasion is huge, and multiple hyperspace slipstreams are on the way to our galaxy. We must unite against this crisis."
 touhou_crisis.116.name: "§MSecond Anchor§!"
 touhou_crisis.116.desc: "Not a second late, the second Fleet Group has arrived at the gravity well of [last_kamikakushi_invade_system.GetName]. They deployed the Dimensional Rift Anchor again here. Their reinforcement rate has been increased."
 touhou_crisis.116.a: "Damn it, there is more?!"
 touhou_crisis.117.name: "§MThird Anchor§!"
 touhou_crisis.117.desc: "The last cluster of subspace slipstreams has jumped to [last_kamikakushi_invade_system.GetName]. As expected, Dimensional Rift Anchor was deployed again. By destroying it, we may interrupt or even terminate their invasion plans."
 touhou_crisis.117.a: "Hopefully this will be the last one."
 touhou_crisis.118.name: "§MDimensional Rift Anchor Destroyed§!"
 touhou_crisis.118.desc: "One Dimensional Rift Anchor was destroyed by our fleets. $spth_kamikakushi_country$ sustains decreased capability to send reinforcement."
 touhou_crisis.118.a: "One step closer to the defeat of $spth_kamikakushi_country$"
 touhou_crisis.119.name: "§MDimensional Rift Anchor Destroyed§!"
 touhou_crisis.119.desc: "One Dimensional Rift Anchor was destroyed by others' fleets. $spth_kamikakushi_country$ sustains decreased capability to send reinforcement."
 touhou_crisis.119.a: "Another step closer to victory over $spth_kamikakushi_country$."
 touhou_crisis.120.name: "§MLast Anchor destroyed§!"
 touhou_crisis.120.desc: "The last Dimensional Rift Anchor has been obliterated under our unparalleled fleet. Now, our Ministry of Science has gathered sufficient data: they proposed a reverse-engineering scheme that brings a chance to terminate the threat posed by $spth_kamikakushi_country$."
 touhou_crisis.120.a: "We are winning!"
 touhou_crisis.121.name: "§GDarkness Disspated§!"
 touhou_crisis.121.desc: "Our fleets wrecked in the void, our people lie in ruins -- this war has left deep scars upon our empire. Yet we have successfully repelled their offense and begun establishing signal stations.\nOur probes revealed that all vessels belonging to $spth_kamikakushi_country$ have lost contact with their headquarters, and then quickly underwent self-destruction once the signal stations were deployed. Astronomical surveys confirm that no further fleets have since been dispatched into our galaxy.\n\nAt last, our people could finally take a break from all these: this crisis, which engulfed the entire galaxy, draws to a close."
 touhou_crisis.121.a: "At last..."
