 spth_precursor_makai_network_system_planet: "§MTerminus§!"
 spth_precursor.50.name: "§MAncient Beacon§!"
 spth_precursor.50.desc: "一束奇特的快子信号从某个我们从未观测到存在有星系的坐标传来，根据天文部门的的观测，那处地方突然出现了一个巨大的引力源，而且其中似乎不存在任何恒星或者黑洞的迹象。\n\n科学部门根据残留的辐射信息推断，这个星系应该是从魔界位面通过未知手段第进入了我们的现实，或许我们应该组织一次调查。"
 spth_precursor.51.name: "[From.GetName]发现新的星系"
 spth_precursor.51.desc: "我们的情报部门传来资料，[From.GetName]天文部门最近活动频繁，因为他们发现了一个原本不在他们星图标记范围内的星系，[spth_precursor_makai_network_system.GetName]。\n\n很巧的是，它也不在我们的星图标记范围内。"
 spth_precursor.52.name: "§MBizarre System§!"
 spth_precursor.52.desc: "§H[This.GetName]§!一进入星系，发现这里被一股异常的环境现象所笼罩。\n\n似乎这里的天体与环形装置围绕着星系中心的巨大宜居星球运行，而且其中的环形世界充满了虚幻的感觉，根据探测其似乎同时存在于两个位面之中。很快，我们的传感器分辨出了信号的来源——这个星系中的引力源，也就是那颗宜居星球。\n\n§R或许我们应该在这颗星球上面进行殖民来展开进一步调查。§!"
 spth_precursor.54.name: "§MAncient Ruin§!"
 spth_precursor.54.desc: "在我们的殖民船落地开展工作的一段时间后，殖民者们在[spth_precursor_makai_alice_arc.GetName]的地下发现了大片充满$spth_precursor.makai$风格的研究设施。\n\n根据研究设施的日志记录，该星系是$spth_precursor.makai$研究星界星门的一处设施，并且他们也成功建立了完善的星界网络用于在位面之间、星系之间快速穿梭。\n\n在$spth_precursor.makai$衰败之后，这处设施便被放弃了。直到它因为某些未知原因，跌落到了我们所在的位面。\n\n设施中记录了大量$spth_precursor.makai$的研究成果，并且星系中那处被封锁的星门就是星界网络的主节点之一。也许我们可以尝试修复这一主节点，让星界网络为我们所用。"
 spth_precursor_makai_network_repair: "修复星界网络节点"
 spth_precursor_makai_network_repair_DESC: "$tech_touhou_gateway_network_master_node_unlock_shield_desc$同时对魔界遗留的资料加以研究，之后我们就可以开始着手修复工作了。"
 spth_precursor.55.name: "§M研究完成§!"
 spth_precursor.55.desc: "我们的科研团队已经完成了对覆盖于星界网络节点上的结界护盾的初步破解，并且完成了对魔界遗留数据的解析。\n\n我们可以准备进行修复工作了。"
