 spth_moukou_drug: "Hourai Elixir(§ESample§!)"
 spth_moukou_drug_desc_short: "月都的禁药，喝下后会成为不老不死的「蓬莱人」"
 spth_moukou_drug_desc_details: "「蓬莱之药」使得「蓬莱人」不断复活，生与死的过程中会产生污秽。\n月之都将其视为禁药，禁止制造。\n这份珍贵的样品来自于妹红所服用的蓬莱之药残余，由于剂量过小加之年代久远，其大部分效果已然失效。"
