 spth_fxtz_desc_details: "在一次外星人东方展会中，它们例行举办了一场则赛。但是这次比赛邀请了对手国的选手来缓和两国关系，但对手国的胜利者举止恶劣，鞭尸和蹲头的行为引起了众外星人的反感，于是现场发生了实质性交火，展会一片混乱，随后两国正式开战。\n我们回收了会场内存放的一个绯想天则的存储介质。"
