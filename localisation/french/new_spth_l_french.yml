 touhou_wolf_tengu_shield_desc_details: ""
 touhou_mask_of_hope: "希望之面"
 touhou_mask_of_hope_desc_short: "被重新寻回的希望。"
 touhou_mask_of_hope_desc_details: "象征着情感，这是一份备用之面。\n\n此前发生的异变就源于秦心丢失了「希望之面」，情感发生暴走，使得整个人类村落陷入绝望之中。"
