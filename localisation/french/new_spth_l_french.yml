 spth_story_ring_world_1_gensokyo_DESC: "This initial skeletal frame encircles the system's sun, and serves as the platform on which we will eventually build fully habitable sections."
 spth_story_ring_world_2_common: "§UAutomated Ring World Section§!"
 spth_story_ring_world_2_common_DESC: "This skeletal frame section makes up roughly one quarter of the unfinished Ring World's total surface area. Work on the smaller habitable section has not yet been completed."
