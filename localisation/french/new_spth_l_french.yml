 trait_th_alice_doll_desc: "Replica of Alice's dolls. They are connected through magical threads and remotely manipulated at one's will. These dolls can perform all things that humans can do, including manipulating other dolls -- expect making more dolls.\nThese dolls are small; hence, they are capable of quickly evading attacks and require far less space to store or operate."
