 disappear_barrier_unlock_jump_gate_final: "跃迁星桥充能"
 disappear_barrier_unlock_jump_gate_final_DESC: "我们需要尝试给跃迁星桥提供灵力，来使其足以穿越漫长的天文距离从而抵达巨引源。"
 lunar_cluster34_shroud_country_no_color: "the Divine"
 ag_lost_ancient_ship_dialog_lunar_capital_psi.1: "We must stop $ag_lunar_capital_psi$!"
 ag_lost_ancient_ship_dialog_lunar_capital_psi.2: "$ag_lunar_capital_psi$ chose the worst option, just like the Zroni Civilization."
 ag_lost_ancient_ship_dialog_lunar_capital_psi.3: "这些野蛮的灵能意识体什么时候才能文明一点？"
 ag_lost_ancient_ship_dialog_lunar_capital_psi.4: "不论是文明世界、泽洛文明，还是他们，灵能总是带来了不好的后果。"
 ag_lost_ancient_ship_dialog_lunar_capital_psi.5: "必须清除这些灵能舰船的污染！"
 ag_lost_ancient_ship_dialog_lunar_capital_psi.6: "Just like $ag_divine$, the impacts of the Shroud are always annoying."
 ag_lost_ancient_ship_dialog_lmc.1: "想不到在文明世界之前还存在过更早的文明，而且有着文明世界不具备的技术。"
 ag_lost_ancient_ship_dialog_lcm.2: "帷幕星域发生的一切真是悲剧，[Root.GetName]也应该注意星界壁垒的变化。"
 ag_lost_ancient_ship_dialog_lcm.3: "[Root.GetName]要吸取文明世界的经验，在将来作为超星系团级别的文明时尽可能避免纷争。"
 ag_lost_ancient_ship_dialog_lcm.4: "这些技术真的很奇怪，而且文明世界看起来并没有吸收他们。"
 ag_lost_ancient_ship_dialog_lcm.5: "想不到大麦哲伦星流还有可以正常工作的灵能震爆。"
 ag_lost_ancient_ship_dialog_lcm_th.1: "原来$spth_precursor.makai$比文明世界存在的更早，而且也发源自核心星域。"
 ag_lost_ancient_ship_dialog_lcm_th.2: "原来帷幕星域发现过$spth_precursor.makai$的遗物，这些技术和你们的很像呢。"
 ag_lost_ancient_ship_dialog_lcm_th.3: "为什么核心星域就几乎没有像帷幕星域那样的$spth_precursor.makai$遗物呢，真奇怪。"
 ag_lost_ancient_ship_dialog_lcm_th.4: "[Root.GetName]也应该注意星界壁垒的变化，防止重现帷幕星域的惨剧。"
 ag_lost_ancient_ship_dialog_lcm_th.5: "也许哪天，[Root.GetName]也能重现灵能震爆这类大规模杀伤性武器吧。"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.1: "……$ag_lunar_capital_psi$？\n\n跟泽洛文明升格派一样……这些生物就不该存在……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.2: "……果然不只是泽洛文明……\n\n其他文明……也选择了糟糕的选项……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.3: "……文明世界……已经消失了……\n\n……$spth_kamikakushi_country$……不能妨碍我们!……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.4: "……嘻嘻……$ag_lunar_capital_psi$\n\n……必须……消失……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.5: "这个世界……不属于$ag_lunar_capital_psi$……\n\n……无论过去，现在，还是未来……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_lunar_capital_psi.6: "…… ……\n\n……曙光终将驱散虚境的黑暗……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_kappa_computer_dialog_lunar_capital_psi.1: "$ag_lunar_capital_psi$，为什么和灵能有关的事情总是这么糟糕。"
 ag_kappa_computer_dialog_lunar_capital_psi.2: "$ag_lunar_capital_psi$不属于这个世界！"
 ag_kappa_computer_dialog_lunar_capital_psi.3: "为什么和虚境有关的事情总是这么糟糕。"
 ag_kappa_computer_dialog_lunar_capital_psi.4: "我们必须阻止$ag_lunar_capital_psi$!"
 ag_kappa_computer_dialog_lunar_capital_psi.5: "和文明世界的升格派一样，他们也选择了这条道路。"
 ag_kappa_computer_dialog_lunar_capital_psi.6: "不能放任$ag_lunar_capital_psi$，也许将来你们可以和文明世界一样进入虚境清除智慧生命的威胁。"
 ag_extragalactic_galaxy_m106_ai_dialog_lunar_capital_psi.1: "真可惜，我没法亲自操控军舰消灭这些灵能舰船。"
 ag_extragalactic_galaxy_m106_ai_dialog_lunar_capital_psi.2: "计算资源已分配至后勤工作，我们需要更多的战舰。"
 ag_extragalactic_galaxy_m106_ai_dialog_lunar_capital_psi.3: "$ag_lunar_capital_psi$的灵能舰船似乎非常强大，希望我们之前的准备能使我们度过难关。"
 ag_extragalactic_galaxy_m106_ai_dialog_lunar_capital_psi.4: "[Root.GetName]需要集结一切力量来阻止$ag_lunar_capital_psi$毁灭银河系。"
