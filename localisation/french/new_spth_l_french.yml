 th_ag_interaction.117.b:0 "Forget it."
 spth_ag_interaction_eta_gateway_event_overwrite_project: "§PEta Area: Hack Ancient Station§!"
 spth_ag_interaction_eta_gateway_event_overwrite_project_DESC: "With the assistance of the Ancient AI, we designed a system capable of breaking the $ag_ancient_eta_gateway_control_megastructure_name$ without relying on the operation of providing it with control symbols."
 th_ag_interaction.117.starlight.desc: "After [From.GetName] and Starlight II analyzing the activity data of Vortical Fairy, $th_ag_interaction.117.desc$"
 th_ag_interaction.117.kappa.desc: "After [From.GetName] and Illustelia I analyzing the activity data of Vortical Fairy, $th_ag_interaction.117.desc$"
