 touhou_crisis.20.desc: "After [FromFrom.GetName] bombarded the last colony in [From.GetName], they took an unknown measure and accelerated the evolution of the star. Nothing in that system survived the explosion."
 touhou_crisis.20.a: "Dammit!"
