 spth_weapon_laevatain: "Taboo Lävatein"
 spth_weapon_laevatain_DESC: " \n\n\n\n\n\n\n£th_frandle_1£\n\n\n\n\n\n\nThe smart missiles that harness the power of Flame of Eternity are essentially autonomously controlled drones. They can perform surgical strike to vulnerabilities on ships, causing severe damage to enemy ships."
