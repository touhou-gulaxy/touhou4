 spth_story_ring_world_base: "§UAutomated Ring World Site§!"
 spth_story_ring_world_base_DESC: "This complex will serve as a staging ground, resource depot and living quarters for the hundreds of thousands of personnel involved in the Ring World's construction."
 spth_story_ring_world_base_MEGASTRUCTURE_DETAILS: "An §UAutomatic Ring World§! allows for multiple planet-like zones, cannibalizing all other planets in the system for materials. Meanwhile, you can choose the type of Ring Segment to construct at first, and the specialization once finished."
 spth_story_ring_world_base_CONSTRUCTION_INFO_DELAYED: "A complete §UAutomated Ring World§! consists of 4 completed Ring World sections; each section is equivalent to a real, huge Gaia World."
 spth_story_ring_world_1_common: "§UAutomated Ring World Frame§!"
 spth_story_ring_world_1_common_DESC: "This initial skeletal frame encircles the system's sun, and serves as the platform on which we will eventually build fully habitable sections."
