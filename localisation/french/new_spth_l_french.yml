 spth_precursor.215.name: "§HIncoming Transmission§!"
 spth_precursor.215.desc: "§R[This.GetName]§!，你们在干什么！\n\n……§H以太相引擎§!？你们怎么可以，随意的撕裂与虚境之间的屏障，既然你们执迷不悟，那我们只好动用武力了！\n我们会像当年消灭$spth_precursor.makai$的星界威胁一样，让你们从这个位面，彻底消失！。"
 spth_precursor.215.a: "老毕登，你早该滚回时间的洪流了！"
 spth_precursor.215.b: "Close transmission."
 spth_precursor.216.name: "§HIncoming Transmission§!"
 spth_precursor.216.desc: "……\n[This.GetName]，我们的探测器已经探查到即将进入该星域的§R未知入侵者§!，为了保护这片银河，我们将出动军事力量以应对威胁。"
 spth_precursor.204.desc.common: "……我们，§H隙间之里§!已经迷惘的足够久了，如今我们将会重新庇护这片星河。\n纵使被自己造物背叛，我们的理想也从未改变。\n\n如今，§R那些威胁§!来临了，我们将会帮助你们击退那些入侵者。"
