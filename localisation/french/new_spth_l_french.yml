 spth_ag_data_selected_message: "Sighs"
 spth_ag_data_selected_message_ag_a_desc: "Once a mighty stellar empire expanded to the entire Supercluster, now only a few wreckages."
 spth_ag_data_selected_message_ag_b_desc: "These fallen empires became stagnant, like those residuals of Ancient Civilization."
 spth_ag_data_selected_message_ag_c_desc: "What a pity, common civilizations have no chance developing to fifth-level singularity core?"
 spth_ag_data_selected_message_ag_d_desc: "Smart move. Maybe I can try to achieve something similar."
 spth_ag_data_selected_message_ag_e_desc: "Repair rapidly via the use of Living metals and Nanites."
 spth_ag_data_selected_message_ag_f_desc: "So who stolen the Key of Twilight out of the museum~"
 spth_ag_data_selected_message_ag_g_desc: "Security systems designed by ancient engineers are truly sophisticated."
 spth_ag_data_selected_message_ag_h_desc: "注意一下，投影舰队所受伤害会和本体同步～"
 spth_ag_data_selected_message_ag_i_desc: "Remove gravitational weapon for budget"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.1: "我注意到有什么信号传往了光流螺旋星系附近的虚空之中，真是奇怪，那里什么都没有的啊。"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.2: "$spth_precursor.makai$与主楔?核心星系从未发现这类存在的痕迹啊"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.3: "用于快速跨越星界壁垒的人造结构，文明世界要是能发现并且掌握这种技术就好了。"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.4: "鉴于此前的这里舰队来自光流螺旋星系附近，或许该考虑是否存在可能威胁到我们的危险了。"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.1: "……$spth_precursor.makai$……核心星垣居然没有发现过吗?……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.2: "……[spth_precursor_capital_makai_system.GetName]?……\n\n……如此之近的星系……文明世界居然没有察觉……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.3: "……我……有点不安……\n\n……有什么信号……发送到了遥远的深空……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.4: "……也许……主楔这种技术\n\n……也许可以重建文明世界……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_kappa_computer_dialog_makai_repair_wedge.1: "$spth_precursor.makai$所使用的技术，没有符合的技术特征。"
 ag_kappa_computer_dialog_makai_repair_wedge.2: "We can't build a new Secondary Wedge on ourselves. Take caution when using it."
 ag_kappa_computer_dialog_makai_repair_wedge.3: "结果我的计算与解码，[spth_precursor_capital_makai_system.GetName]此前向外传出的信号似乎不太安全。"
 ag_kappa_computer_dialog_makai_repair_wedge.4: "Using this technology to traverse the Astral Barrier will bring some risk, but it comes in handy as ultra-long-distance transportation."
 ag_extragalactic_galaxy_m106_ai_dialog_makai_repair_wedge.1: "如果文明世界当年发现这里的话，也许就不会那样了……"
 ag_extragalactic_galaxy_m106_ai_dialog_makai_repair_wedge.2: "信号接收地是…光流螺旋星系附近的虚空?文明世界此前的探查表明那里应该什么都没有啊"
 spth_ag_ai_option_makai.1: "Any information of the signal emitted from [spth_precursor_capital_makai_system.GetName]? "
 spth_ag_ai_option_makai.2: "Does Civilized World have any information of $spth_precursor.makai$?"
 spth_ag_ai_option_kamikakushi.1: "Are you familiar to $spth_kamikakushi_country$?"
 spth_ag_ai_option_makai.1.response: "According to analysis, this signal should be emitting to somewhere near the Light Flow Spiral Galaxy, where Civilized World confirmed that nothing existing there. Or perhaps, there actually exists something, but they finally being too busy to investigate, for the outbreak of the Zroni Civil War and Civilized World being involved later.\n\nThis signal does not match any signature in the Civilized World database."
 spth_ag_ai_option_makai.2.response: "No, the ruins of $spth_precursor.makai$ have never found before.\nTo be honest, I'm also curios that, [spth_precursor_capital_makai_system.GetName] is in where is so close to the core system, but why Civilized World had never discovered it.\n\nThe facilities in [spth_precursor_capital_makai_system.GetName] and your recordings indicated that, they might have highly advanced dimensional technologies, or else they would not be able to breakout the Astral Barrier with the main wedges."
 spth_ag_ai_option_kamikakushi.1.response: "Unacknowledged.\nCivilized World in the Prosperity Age had noticed some sort of energy fluctuations came from there, which are totally different with psionics or something else, and even Civilization at that age were not able to parse the contents. What more weird is that, in the next day, the storage devices recorded the primitive data were suddenly gone, and none clues are found in the after-action investigation.\n\nCivilized World also tried to attempted explorations to that region, but they got nothing there. At last, they leaving it unattended at the end after being involved in the Zroni Civilization civil war.\nIt seems like that there actually exists some mysterious faction. According to your recordings, the facilities needed for maintaining massive automatic fleets are located there, but we are not able to detect it, or it is covered by advanced cloaking fields, or other reasons. Considering about both $spth_kamikakushi_country$ and $spth_precursor.makai$ might have advanced dimensional technologies, one possibility is that the facilities are hidden with some related methods?"
 spth_makai_defence_system: "§BAstra Defense Facility§!"
 spth_makai_defence_system_crisis: "§RRogue Defense System§!"
 mod_damage_vs_country_type_spth_makai_defence_system_crisis_mult: "Damage to rogue makai defense system"
 spth_precursor.1.name: "§MTachyon Signal§!"
 spth_precursor.1.desc: "After we defeat fleets of $spth_kamikakushi_country$, a strange tachyon signal is detected. By triangulation, it's transmitted from the $spth_precursor.makai$'s home system [spth_precursor_capital_makai_system.GetName], and the destination seemed to be ordinary void.\n\nBut later observation confirmed that a giant gravitational attractor is there... It doesn't line up with our earlier observation. We should organize an investigation."
 spth_precursor.3.name: "§MAncient Ruins§!"
 spth_precursor.3.desc: "After our colony ship landed and done some work on [spth_precursor_makai_alice_arc.GetName], colonists found large city ruins that resemble the design of $spth_precursor.makai$. Something at the center of these ruins is emitting significant energy signals. A clearing of these ruins not only helps our colony expand, but also brings a chance to excavate some secrets out of these."
 spth_precursor.4.name: "§MAncient Barrier§!"
 spth_precursor.4.desc: "After the last ruin was cleared, colonists on [spth_precursor_makai_alice_arc.GetName] have found a group of buildings shielded by ancient barriers.\n\nWe need to send an archeology team down here to investigate."
 NAME_alice_planet: "§YBarrier§!"
 NAME_alice_planet_moon_1: "§PBelial§!"
 NAME_alice_planet_moon_2: "§MNebiros§!"
 spth_precursor_alice_arc: "§MSpirit Power Barrier§!"
 spth_precursor_alice_arc_desc: "A building shielded by a spirit power barrier. We need to send an archeology team to disable the barrier and excavate the secrets."
 spth_precursor_alice_project: "§MCryostasis§!"
 spth_precursor_alice_project_DESC: ""
 spth_makai_defender.1.name: "§BAstra Defense Facility§!"
 spth_makai_defender.1.desc: "In a re-examination of $spth_precursor.makai$ documents, we found the coordinate of a $spth_precursor.makai$ defense system. Based on recovered data, this defense system was commanded to hide before the defeat of $spth_precursor.makai$, hoping to assist reconstruction. Obviously, this \"Astral Defense System\" didn't work in the intended way for an unknown reason.\n\nOur scientists have decoded the command to wake this defense system. Although having risk, we may send tachyon signals to wake it to assist defense."
 spth_makai_defender.1.a: "Let's try. Maybe it can be a great ally."
 spth_makai_defender.1.a.tooltip: "We have a §G50%§! to succeed, but the defense system may §Rattack us§! if we fail."
 spth_makai_defender.1.b: "Let's not risk that."
 spth_makai_defender.2.name: "§BAstra Defense Facility§!"
 spth_makai_defender.2.desc: "<Incoming tachyon transmission>\n<Verifying protocols...>\n§G<Pass>§!\n\nWelcome, [This.GetName]. I am the 66th defense system of <data lost>. Looks like the <read failed> threat has arrived again. We will assist you to defend."
 spth_makai_defender.2.good: "Great"
 spth_makai_defender.3.name: "§RRogue Defense System§!"
 spth_makai_defender.3.desc: "<Incoming tachyon transmission>\n<Verifying protocols...>\n§R<Fail>§!\n\nDetected unknown country and <read failed> vector approaching this system. Mobilizing war assets to clear.\nWho are you? "
 spth_makai_defender.3.a: "We are [This.GetSpeciesName]."
 spth_makai_defender.3.a.response: "Oh, it's [This.GetSpeciesName]. Hmm, I will bring the doom of you all.\n\n§R<Command: Eradicate>§!"
 spth_makai_defender.3.b: "We are remnants of $spth_precursor.makai$. We need your help."
 spth_makai_defender.3.b.response: "You are not $spth_precursor.makai$. What kind of pre-sapients are you, [This.GetSpeciesName]?\n\n§R<Command: Extermination>§!"
