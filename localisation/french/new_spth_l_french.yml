 th_ag_interaction_trait_starlightII_sci: "§PSpiritual Power Theory Interface§!"
 th_ag_interaction_trait_starlightII_sci_desc: "§PStarlight 2, the advanced AI from Ancient Civilization, has learned our knowledge about spirit power. It now performs better in research and administrative management.§!"
