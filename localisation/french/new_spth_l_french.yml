 disappear_barrier.203: "§UThe Starless Depths§!"
 disappear_barrier.203.desc: "§H[This.GetName]§! reached a strange place after traveling through hyperlane.\n\nNo stars are found inside §H[From.GetName]§!, but a massive, shrine-like station occupies the supposed position of the star. There are several fleets stationed nearby, but they don't appear to be hostile toward us.\n\nAnalysis indicates that the giant space shrine ahead is the source of gravity."
 disappear_barrier.203.a: "Holy crap! Cool."
 disappear_barrier.203.b: "How mysterious."
 disappear_barrier.204: "§UAlien System§!"
 disappear_barrier.204.desc: "We get to know that [From.GetName] found a strange ancient system. Maybe we should also take surveys in that system to prevent them from surpassing us."
 disappear_barrier.204.a: "They aren't going to make it."
 disappear_barrier.204.b: "Crap."
 disappear_barrier.205.desc: "Welcome, §H[Root.Species.GetName]§!. What can I do for you?"
 disappear_barrier.205.a: "We can provide you some support."
 disappear_barrier.205.b: "Anything to trade?"
 disappear_barrier.205.c: "We hope to further our collaboration."
 disappear_barrier.205.d: "We want to establish a collaboration facility."
 disappear_barrier.205.exit: "§ELeave§!"
