 disappear_barrier.1041.desc: "§H[This.GetName]§!进入了§H[From.GetName]§!的引力井范围内，映入§H[This.Leader.GetName]§!眼帘的是一个大型人造设施，根据传感器读数，其正是整个星团的中心引力源，数颗恒星环绕着这个引力源缓缓的运动着，月都设施周围萦绕着一股灵能效应，而其中心存在着一个强大的灵力能量信号。\n\n根据§H[From.GetName]§!对星系中恒星的光电探测，这些恒星的结构非常奇特，似乎完全不是自然形成的天体。对于这一神奇的情况，§H[This.Leader.GetName]§!提议先从月都设施开始调查。"
