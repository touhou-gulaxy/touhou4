 spth_precursor.1.a: "Good"
 spth_precursor.2.name: "§MStrange System§!"
 spth_precursor.2.desc: "[This.GetName]一进入星系，发现这里被一股异常的环境现象所笼罩。其中的环形世界充满了虚幻的感觉，根据探测其似乎同时存在于两个位面之中，而中央的恒星也变为了由灵力驱动反应的怪异天体。很快，我们的传感器分辨出了信号的来源——这个星系中的一颗宜居星球。\n\n§R或许我们应该在[spth_precursor_makai_alice_arc.GetName]上面进行殖民来展开进一步调查。§!"
 NAME_alice_planet_ring: "§ERing World Frame§!"
 NAME_alice_planet_moon_3: "§BAlice§!"
 NAME_alice_planet_moon_4: "§GMaestera§!"
 d_makai_ringworld: "§MBreach on Astral Barrier§!"
 d_makai_ringworld_desc: "A tunnel is opened on this world and weakens the Astral Barrier. Hence, it exists both in our dimension and the $spth_precursor.makai$ dimension simultaneously."
 d_makai_alice_ruin: "§MAncient Ruins§!"
 d_makai_alice_ruin_desc: "Ruins of ancient $spth_precursor.makai$ cities are here. We may find something out of these."
 d_makai_alice_ruin_m: "§RAncient Ruins§!"
 d_makai_alice_ruin_m_desc: "Ruins of ancient $spth_precursor.makai$ cities are here. We may find something out of these."
 makai_ringworld_modifier: "§M位面交织§!"
 makai_ringworld_modifier_desc: "这个世界同时存在于两个位面的特性，为我们殖民地的发展提供了很大的便利。"
 NAME_alice: "Alice Margatroid"
 leader_trait_alice: "Seven-Colored Puppeteer"
 leader_trait_alice_desc: "She has the abilities of using magic and manipulating dolls. As a puppeteer, she has the skillfulness among the finest among all of Gensokyo, which enables her to control many dolls as if they're living beings. She has her hands full manipulating the dolls, so her movements are sluggish and her fighting ability is low."
 leader_trait_alice_effect: "After the commanded fleet entering battle:\nSummon §G1-3§! §Rinvincible§! phantom fleet, which will exist §G8-15§!£time£, with a 180 £time£ cooldown."
 th_alice_phantom: "§BPhantom§!"
 th_alice_phantom_ship_1: "Illustella Projection-The Queen of Hearts"
