 spth_generic_expend_zone_desc: "$zone_urban_desc$"
 spth_generic_spiritual_power_zone_desc: "Thin layers of mist always linger here, veiling the glow of the stars. While local industries participate in spirit power production, they also diffuse it into the environment, creating a comforting atmosphere for Gensokyo’s residents."
 spth_generic_spiritual_power_research_zone_desc: "While producing spirit power, researchers can also explore its properties. Additionally, the environment rich in spirit power enhances the researchers' efficiency -- a clear triple benefit."
 spth_generic_spellcard_zone_desc: "Craftsmen are busy making spellcards here. As a way to store power, it's crucial to us."
 spth_generic_spellcard_research_zone_desc: "High-quality spellcards can even store power about thoughts, which can be used to enhance researching capabilities."
 spth_generic_jinja_zone_desc: "Special spirit power environments around shrines can help with basic resource production."
 spth_generic_tushu_zone_desc: "The books inside are all grimoires, which means you can't read them unless you have competence. It's a decent place to keep and learn knowledge."
 spth_generic_jiqiao_zone_desc: "Built upon the industrial foundation of traditional foundry work with the latest advances of Spirit Power Embodiment technology, these large-scale, sophisticatedly designed magical karakuri greatly boost the production of military-grade alloys and consumer goods."
 spth_generic_renli_zone_desc: "The name is chosen to commemorate the original human settlement in Gensokyo. It produces nutritious food and some strategic resources."
 spth_generic_energy_zone_desc: "With the help of Yatagarasu, reactors can produce massive energy at higher efficiency in exchange for a small amount of spirit power."
 spth_generic_minerial_zone_desc: "Miners from foothills around Youkai Mountain are here to gather precious minerals. They are the power source of our industry."
 spth_generic_alloys_zone_desc: "The integration of modern rotary hearth furnaces with spirit-power technology has given rise to highly efficient foundries that maintain production of military-grade alloys in an unending stream."
 spth_generic_consumer_goods_zone_desc: "With the assistance of spirit power, productivity in cutting-edge production lines for consumer goods has seen unprecedented improvement."
 spth_generic_food_zone_desc: "Blessed by the powers of the Aki Sisters, our modernized farms yield abundant harvests and hasten the growth of every crop. Advanced ranching and food processing facilities further secure our prosperity."
 spth_generic_refine_zone_desc: "White and pink cherry blossoms bloom in the heights of Heaven. Within these celestial facilities, we can efficiently synthesize various strategic resources."
 spth_generic_fortress_zone_desc: "This place is built for war -- tremendous fortresses, command centers, and logistics are distributed around, providing significant assistance to planetary defense and warfare."
 spth_generic_trade_zone_desc: "Skilled in the art of trade, the Yamawaro here oversee logistics of our systems--while collecting a modest amount of entirely “legitimate” profit."
 spth_generic_zun_zone_desc: "No matter when, Gensokyo girls always love gathering to drink and make merry. The izakaya offers banquet halls to satisfy our every appetite for celebration."
 spth_generic_ag_spiritual_power_zone_desc: "$spth_generic_spiritual_power_zone_desc$"
 spth_generic_ag_spellcard_zone_desc: "$spth_generic_spiritual_power_research_zone_desc$"
 spth_generic_ag_shrine_zone_desc: "Abundant spirit power and faith together create great condition for those miners from Youkai Mountain and Yatagarasu to produce basic resources."
 spth_generic_ag_research_zone_desc: "Here, you can find various books, and most importantly -- Gumon Shiki. These books inspire the greatest people in Gensokyo."
 spth_generic_ag_forge_zone_desc: "Kappa and tengu from the Youkai Mountain use advanced industry here to produce alloys and consumer goods 24/7."
 spth_generic_ag_living_metal_zone_desc: "This area is responsible for cultivating $sr_living_metal$, just like cultivating the future of our civilization."
 spth_generic_ag_nanite_zone_desc: "In our most advanced production lines, $nanites$ will be produced just like ordinary $consumer_goods$."
 spth_generic_ag_zro_zone_desc: "The air was filled with lavender mist, dimming the light of the sun, moon and stars. Only the mist was dotted with twinkling stars. That was the most spectacular sight when we industrially synthesized $sr_zro$. \n\n§RBe careful not to get lost in the mist. §!"
 spth_generic_ag_drak_matter_zone_desc: "In our brightly lit high-tech facilities, we are able to continuously synthesize the most mysterious type of matter among the stars - $sr_dark_matter$."
 spth_generic_ag_living_metal_forge_zone_desc: "Fluid $sr_living_metal$ and hard $alloys$ are produced here and form the bones and muscles of civilization."
 spth_generic_ag_nanite_forge_zone_desc: "Anything you can think of, whether it is macro $consumer_goods$ or micro $nanites$, can be produced here."
 spth_generic_ag_zro_research_zone_desc: "When synthesizing $sr_zro$, it will inevitably have some subtle effects on the surrounding environment. Sometimes, it will make your mind become extremely clear, which is suitable for us to think about our past and future. \n\n§RIt is not recommended to look directly into the purple eyes of those researchers. §!"
 spth_generic_ag_drak_matter_refine_zone_desc: "Inside our all-day-lit, state-of-the-art facilities, we are able to produce the most mysterious matter among the stars nonstop -- the $sr_dark_matter$, along with some strategic resources."
