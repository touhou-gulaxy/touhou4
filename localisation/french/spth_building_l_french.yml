 district_gensokyo_jinja_name: "吉备津神社"
 district_gensokyo_jinja_flavor_desc: "神社是幻想乡内的著名赏樱景点和主要宴会场所，宴会举办十分频繁。"
 district_gensokyo_tushu_name: "Magic Libraries"
 district_gensokyo_tushu_flavor_desc: "存放着大量的书籍，虽然也包含来自外面世界的普通的书籍，但最主要的还是魔导书。"
 district_gensokyo_jiqiao_name: "Spirit Power Industrial Zone"
 district_gensokyo_jiqiao_flavor_desc: "这些巨大而精密的魔法机关在传统铸造生产的工业基础上融入了灵力具现化的科技结晶。"
 district_gensokyo_barrier_name: "edge of Ushitora"
 district_gensokyo_barrier_flavor_desc: "Provides extra space"
 district_gensokyo_renli_name: "Human Village"
 district_gensokyo_renli_flavor_desc: "Human Village was originally a human settlement in Gensokyo. After entering the Age of Interstellar, this name was still used to commemorate the past."
 district_gensokyo_mosen_name: "Forest of Magic"
 district_gensokyo_mosen_flavor_desc: "Forest of Magic is a vast, dense field of primitive forest in Gensokyo. According to the legends, the Forest of Magic is from the Outside World."
 district_gensokyo_yaoguai_name: "Yatsugatake"
 district_gensokyo_yaoguai_flavor_desc: "Youkai Mountain is the Yatsugatake before its reduction in height. Iwanagahime lives in here; you can even see the dense smoke fuming from the peak at the foot of the mountain."
 district_gensokyo_kyuuto_name: "Old Hell Streets"
 district_gensokyo_kyuuto_flavor_desc: "Old Capital is a subterranean city in Old Hell. It's previously the downtown area of Hell, but was abandoned during the Hell Simplification Project."
 district_gensokyo_misty_lake_name: "Very-Misty Lake"
 district_gensokyo_misty_lake_flavor_desc: "The lake is covered with dense fog in the daytime. Because of the bad visibility and coldness, very few people will approach this place."
 district_gensokyo_genbu_ravine_name: "Genbu Ravine"
 district_gensokyo_genbu_ravine_flavor_desc: "This canyon is formed by the volcanic activities in the Youkai Mountain. Traces of volcanic activities can still be found in the midst of ravines."
