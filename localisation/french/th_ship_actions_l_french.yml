 touhou_ship_actions_deploy_gateway: "部署魔界星界网络节点"
 touhou_ship_actions_deploy_gateway_desc: "部署当前移动星门框架，将其展开为可以接入魔界星界网络的节点。\n部署大约需要§G5-10§!£time£，并且同一个星系内只能部署一个节点。"
