 touhou_super_carrier_planet_killer_mode_killer: "摧毁行星"
 touhou_super_carrier_planet_killer_mode_sweeper: "摧毁行星"
 touhou_ship_actions.100.name: "§H[From.GetName]§!不宣而战"
 touhou_ship_actions.100.desc: "§H[From.GetName]§!在没有宣战的情况下，使用某种跨星系攻击的武器摧毁了我们控制的星系，我们因此也与§H[From.GetName]§!进入了战争状态。"
 touhou_ship_actions.100.a: "必须要让他们付出代价！"
 touhou_ship_actions.101.name: "熄灭星辰"
 touhou_ship_actions.101.desc: "随着§H[FromFrom.GetName]§!的主炮完成了它熄灭星辰的任务，§H[From.GetName]§!的亮度瞬间提升了数百倍，随后逐渐暗淡下去，传感器表明这颗星星已经塌缩成了一个奇点，大部分§H[From.GetName]§!毁灭时释放的致命的能量被§H[From.From.GetName]§!引导到用于彻底坍缩这个奇点，剩余的一小部分则被引导到了§H[From.solar_system.GetName]§!恒星系内的其他天体上，将这些星球炸的四分五裂。\n\n§H[From.GetName]§!死亡时发出的黯淡而又耀眼的光芒将作为象征着我们国家的实力的纪念碑，在之后的数千年间被无数文明持续观察到。"
 touhou_ship_actions.101.a: "Cool."
 message_touhou_supercarrier_pk_weapon_killed_star_desc:0 "$touhou_target_planet|Y$因遭受$touhou_attacker|Y$的$touhou_attacker_ship|Y$的跨星系攻击而被摧毁，$touhou_target_system|Y$恒星系在暗淡的超新星爆发中被毁灭。"
 touhou_ship_actions.103.name: "§U符卡系统§!"
 touhou_ship_actions.103.desc: "超级航母可以装备一些额外的特殊能力，从而启用不同的符卡功能。右侧可以配置超级航母的符卡系统，部分符卡启用时，将会解锁对应的['concept_spth_ship_skill']，其他的则为始终开启的被动技能。\n\n每个符卡均有不同的$mod_touhou_spellcard_point_use_add$与$mod_touhou_spellcard_upkeep_add$，当$mod_touhou_spellcard_point_use_add$与$mod_touhou_spellcard_upkeep_add$不大于其上限时，我们才能正常的保存符卡配置。"
 touhou_spellcard_point_info_title: "灵力容量占用"
 touhou_spellcard_point_info: "[touhou_spellcard_point_used]/[touhou_spellcard_point_max]"
 touhou_spellcard_point_upkeep_info_title: "灵力维护占用"
 touhou_spellcard_point_upkeep_info: "[touhou_spellcard_point_cap_used]/[touhou_spellcard_point_cap_max]"
 touhou_ship_actions.103.restore: "重置初始状态"
 touhou_ship_actions.103.save: "Save and Exit"
 touhou_ship_actions.103.fail: "$TRIGGER_FAIL$§R灵力容量不足§!"
 touhou_ship_actions.103.fail.cap: "$TRIGGER_FAIL$§R灵力维护不足§!"
 touhou_spellcard_11: "Barrier \"Boundary of Life and Death\""
 touhou_spellcard_11_desc: "§U进攻型符卡 主动§!\n§L世上有许多境界，可是所谓境界，多半是暧昧不清的。然而有一个境界，若不遵守，世界就无法成立，那就是生死的境界。§!§R+$@touhou_spellcard_11_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_11_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n随着$TH_super_carrier$ [spth_super_carrier_target.GetName]损失船体稳定性，敌方舰队将受到越来越高的['concept_touhou_vulnerable']。在§G90§!£time£后，将强制进入['concept_touhou_vulnerable']效果最高的阶段，冷却§R540§!£time£。"
 touhou_spellcard_21: "Divine Arts \"Omnidirectional Oni-Binding Circle\""
 touhou_spellcard_21_desc: "§U防御型符卡 主动§!\n§L用不可思议的力量夺取对手身体自由的符卡。好像可以束缚鬼，也能束缚住人。§!\n§R+$@touhou_spellcard_21_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_21_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n$TH_super_carrier$ [spth_super_carrier_target.GetName]将获得相当于自身已损失船体值的伤害减免，持续§G36§!£time£，冷却§R360§!£time£。"
 touhou_spellcard_31: "Esoterica \"Gray Thaumaturgy\""
 touhou_spellcard_31_desc: "§U防御型符卡 主动§!\n§L利用秘术，结成巨大的五芒星印，将周围空间化为不可侵入的结界。直到效果发动需要花费较长时间，但长时间无敌也是该技的强大之处。§!\n§R+$@touhou_spellcard_31_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_31_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n$TH_super_carrier$ [spth_super_carrier_target.GetName]将进入持续§G36§!£time£的无敌状态，持续时间内无法被常规火力击毁，冷却§R360§!£time£。"
 touhou_spellcard_41: "「Subterranean Rose」"
 touhou_spellcard_41_desc: "§U进攻型符卡 被动§!\n§L由于无意识的存在，蔷薇弹幕是无法通过防御来抵挡的。§!\n§R+$@touhou_spellcard_41_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_41_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n$TH_super_carrier$ [spth_super_carrier_target.GetName]的主炮将获得额外效果:\n$t$命中时，连锁伤害部分其他目标，额外造成§R10%最大装甲值§!的装甲伤害。"
 touhou_spellcard_12: "Dream Sign “Blooming Nova”"
 touhou_spellcard_12_desc: "§U辅助型符卡 主动§!\n§L虽然不能直接用于攻击，但绽放的新星将会为我们提供各种各样的优势。§!\n§R+$@touhou_spellcard_12_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_12_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n在接下来的§G60§!£time£内，为所在舰队的所有舰船提供: \n$MOD_SHIP_SHIELD_DAMAGE_MULT$：§G+50%§!\n$MOD_SHIP_ARMOR_DAMAGE_MULT$：§G+50%§!\n$MOD_SHIP_HULL_DAMAGE_MULT$：§G+50%§!"
 touhou_spellcard_22: "Dead Village \"Death of One's Home\""
 touhou_spellcard_22_desc: "§U进攻型符卡 被动§!\n§L控制大量幽灵奔逃的符卡，暂时的支配那些亡灵吧。§!\n§R+$@touhou_spellcard_22_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_22_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n如若可能，被$TH_super_carrier$摧毁的舰船将暂时为我方作战一小段时间。"
 touhou_spellcard_32: "\"Sakuya's World\""
 touhou_spellcard_32_desc: "§U防御型符卡 主动§!\n§L让周围时间的流速长时间减缓，甚至停止，但是自身不受影响。§!\n§R+$@touhou_spellcard_32_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_32_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n极大幅度地减缓星系内所有敌对舰队的攻击和移动速度，持续§G20£time£，冷却§R360§!£time£。"
 touhou_spellcard_42: "\"Illusionary Dominance\""
 touhou_spellcard_42_desc: "§U辅助型符卡 主动§!\n§L这个速度快的不寻常，虽然没有到很夸张的程度。§!\n§R+$@touhou_spellcard_42_point_cost$§! $mod_touhou_spellcard_point_use_add$\n§R+$@touhou_spellcard_42_point_upkeep$§! $mod_touhou_spellcard_upkeep_add$\n\n§G180§!£time£内为帝国境内的全部舰船无条件§G解锁跃迁能力§!，同时极大的提升舰船的航行效率与跃迁范围，冷却§R240§!£time£。"
 touhou_spellcard_action: "访问符卡系统"
