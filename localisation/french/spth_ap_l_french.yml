 toho.5011.name: "活体金属解析"
 toho.5011.desc: "作为一种无机金属，它有着通常生命体才具备的特征。\n\n当受到外部冲击时，在一定的时间后，它会恢复到之前被塑造好的形态。因此，只有在特殊的加工条件下，它才能被塑形。\n\n也许，将这种物质用于舰船防御，再加上结界技术，可以极大的增强我们舰船的装甲稳定性。"
 toho.5011.a: "Provide $r_living_metal$ samples."
 toho.5011.b: "Increase investment."
 toho.5011.c: "Experiment with caution."
 toho.5011.d: "We better take care."
 toho.5012.name: "纳米机器人解析"
 toho.5012.desc: "这些在超小尺度上运作的构造体，经过预编程后，可以提供微观水平的细致操作。\n\n针对这些纳米机器人的控制方式，目前有两种主流方案，第一种让大量纳米机器人受控于少数的中枢，可以用于大量消耗的用途；第二种是少量的纳米机器人进行专门的编程，从而从事更细致的工作。\n\n这些小东西还可以用来作为医学产品，用于增强我们的力量等。"
 toho.5012.a: "Provide $r_nanites$ samples."
 toho.5012.b: "Increase investment."
 toho.5012.c: "Experiment with caution."
 toho.5012.d: "We better take care."
 toho.5013.name: "活体金属发现"
 toho.5013.desc: "在实验中，我们的科学部门发现，适当的向活体金属材料中掺杂灵力，同时在其表面安装可以探测来袭物体的传感器，在威胁靠近时利用掺杂的灵力来激活小范围的结界，可以显著的抵御外部打击，尤其是具备穿透性质的攻击。"
 toho.5014.name: "纳米机器人发现"
 toho.5014.desc: "两种方案都有了明显的突破。\n\n前者最显著的运用方式就是纳米修复技术，可以为我们的船体与装甲提供修复，经过灵力加持后的那些纳米机器人，更是可以持续的为我们的结界护盾提供能量，甚至作为我们武器的额外能量缓冲，显著的提升威力。后者则可以用于医疗用途，让我们的各方面效率与力量都得到进一步提升。"
 toho.5015.name: "活性生产设施"
 toho.5015.desc: "最近我们的一个实验室成功突破了快速量产活体金属的方式，在适当的灵力环境下，可以以工业级的温度与压力需求进行生产与塑形。\n\n相信很快我们就可以大规模的运用活体金属了。"
 toho.5016.name: "纳米生产设施"
 toho.5016.desc: "通过凭依在生产设施上式神的灵力，我们可以快速的为纳米机器人进行预编程，同时将式神凭依于大规模纳米机器人中枢上，支持他们执行比之前更为复杂的任务。\n\n相信很快我们就可以大规模的运用纳米机器人了。"
