 toho.5001.name: "奇异物质解析"
 toho.5001.desc: "尽管灵力的力量已经足够强大，但是与我们银河中一些特殊物质的结合可以迸发出更强的潜力，这些物质可以参与我们生产设施与舰船的改进，我们需要学会利用它们。\n\n小规模实验验证了几种截然不同的发展选项，我们可以侧重其中一项，最大化的发掘其潜力。§Y$sr_living_metal$§!作为无机金属却表现出了通常生命体才会显现的特征；§Y$nanites$§!作为纳米尺度下的致动器，可以进行纳米尺度的操作与实验；§Y$sr_dark_matter$§!的性质非常奇特，也许可以展现出一些打破自然法则的现象；§Y$sr_zro$§!作为一种奇特的气溶胶，似乎可以进一步强化我们的灵力能力。\n\n我们需要进一步的实验，但在此之前，我们需要选择一个研究侧重点。"
 toho.5001.a: "$sr_living_metal$ and $nanites$"
 toho.5001.b: "$sr_dark_matter$"
 toho.5001.c: "$sr_zro$"
