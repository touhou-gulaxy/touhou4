 spth_sub_specialist.002.a: "§YEnergy§! signal!? That will be very helpful!"
 spth_sub_specialist.002.a.tt: "Finishing the special project will create a deposit containing £energy£§Y3-5 energy credit§!, and receive §Y500-1000§! energy credit."
 spth_sub_specialist.002.b: "More §Yminerals§!."
 spth_sub_specialist.002.b.tt: "Finishing the special project will create a deposit containing £minerals£§Y3-5 minerals§!, and instantly receive §Y500-1000§! minerals."
 spth_sub_specialist.002.c: "§YFood§!? What a serendipity."
 spth_sub_specialist.002.c.tt: "Finishing the special project will create a deposit containing £food£§Y3-5 food§!, and grant §Y150-450§! food."
 spth_sub_specialist.002.d: "We'd love to see extra §Yrare crystals§!."
 spth_sub_specialist.002.d.tt: "Finishing the special project will create a deposit containing £rare_crystals£§Y1-3 rare crystals§!, and grant §Y50-150§! rare crystals."
 spth_sub_specialist.002.e: "§YVolatile motes§! signals are not common."
 spth_sub_specialist.002.e.tt: "Finishing the special project will create a deposit containing £volatile_motes£§Y1-3 volatile motes§!, and grant §Y50-150§! volatile motes."
 spth_sub_specialist.002.f: "§YExotic gases§!... That's definitely strange but intriguing."
 spth_sub_specialist.002.f.tt: "Finishing the special project will create a deposit containing £exotic_gases£§Y1-3 exotic gases§!, and you will immediately receive §Y50-150 exotic gases§!."
 spth_sub_specialist.002.g: "§YSpirit power§!? Why can this place have spirit power?"
 spth_sub_specialist.002.g.tt: "Finishing the special project will create a deposit containing £sr_lingli£§Y1-3 spirit power§!, and immediately receive §Y50-150 spirit power§!."
 spth_sub_specialist.002.h: "Leaving §Yzro§! along is too dangerous."
 spth_sub_specialist.002.h.tt: "Finishing the special project will create a deposit containing £sr_zro£§Y1 zro§!, and you will immediately receive §Y25-75 zro§!."
 spth_sub_specialist.002.i: "§YDark matter§! signal raised our interest."
 spth_sub_specialist.002.i.tt: "Finishing the special project will create a deposit containing £sr_dark_matter£§Y1 dark matter§!, and you will immediately receive §Y25-75 dark matter§!."
 spth_sub_specialist.002.j: "§YLiving metal§!? We aren't going to miss such opportunities."
 spth_sub_specialist.002.j.tt: "Finishing the special project will create a deposit of £sr_living_metal£§Y1 Living metal§! and receive §Y25-75 living metal§!."
