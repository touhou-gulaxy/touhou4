 touhou_support_heavy_cruiser_core_lunar: "先进支援核心"
 tech_touhou_support_heavy_cruiser: "支援型重巡洋舰"
 tech_touhou_support_heavy_cruiser_desc: "这款重型巡洋舰主要用于提供各种各样的支援，而不是作为作战主力。"
 tech_touhou_support_heavy_cruiser_lunar: "月都支援核心"
 tech_touhou_support_heavy_cruiser_lunar_desc: "利用月都技术改进的重型巡洋舰区段，可以提供更多的支援能力。"
 tech_touhou_gunpower_turret: "重型防御炮台"
 tech_touhou_gunpower_turret_desc: "八意永琳为我们设计的先进防御炮台，其可以随时展开部署与收回，使用起来非常灵活，能够部署到我们最需要的地方，而且其配置的式神在恒星基地被摧毁的情况下也能够独立作战。其上搭载了一门极高功率的主炮，但只有在部署状态下才能由反应堆对其直接供能。"
 touhou_gunpower_turret_moveable: "防御炮台框架"
