 NAME_touhou_gunpower_turret_stationary_alt: "§B净之海§! §E「月之国的笼中鸟」§!"
 NAME_touhou_gunpower_turret_stationary_fleet: "§B守门人§! §E重型防御炮台§!"
 NAME_touhou_gunpower_turret_stationary_fleet_alt: "§B净之海§! §E重型防御炮台§!"
 touhou_gunpower_turret_power_core_1: "焰星四型 灵力能源核心"
 touhou_gunpower_turret_power_core_2: "耀星四型 灵力能源核心"
 touhou_gunpower_turret_power_core_1_DESC: "由舰载四级奇点核心供能的能源核心，还使用了灵力技术的力量进一步提升反应堆功率。"
 touhou_gunpower_turret_power_core_2_DESC: "由舰载四级奇点核心供能的能源核心，还使用了灵力技术与八呎乌的力量进一步提升反应堆功率。"
 touhou_gunpower_turret_shield_l: "大型先进结界护盾"
 touhou_gunpower_turret_armor_l: "大型中子硬化装甲"
 touhou_gunpower_turret_t_weapon: "月枪-03A 引力塌缩炮"
 touhou_gunpower_turret_t_weapon_on_hit: "该武器每命中§Y7.00§!次，必须要进行充能才能正常造成伤害。\n本次攻击将额外造成§Y无法被减免的§!§R$@touhou_aoe_damage_lunar_gravity_cannon_titanic$§!点['concept_touhou_aoe_damage_gravity_cannon_lunar_03a']。"
 touhou_gunpower_turret_t_weapon_tt: "§L这门超重型引力塌缩炮由四级奇点核心直接供能，比常规的泰坦级武器功率更大，同时融合了月之都武器技术的引力武器可以在命中点制造巨大的引力扭曲，从而对附近的其他舰船产生杀伤。但受到其电容存储上限的限制，这门主炮连续开火§Y7.00§!发后必须由奇点核心对电容进行§H重新充能§!。\n恢复全部充能大约需要§R90.00§!£time£，且可以受到§Y灵力武器射速§!加成，但效率只有§R25.00%§!且最多减少到§Y35.00§!£time£。§!"
 touhou_gunpower_turret_t_weapon_alt: "月枪-03AG 引力塌缩炮"
 touhou_gunpower_turret_l_weapon: "LunarSpear-03C Gravitational Collapse Cannon"
 touhou_gunpower_turret_m_weapon: "LunarSpear-03D Gravitational Collapse Cannon"
 touhou_gunpower_turret_pd_weapon: "月枪-03F 引力塌缩炮"
 weapon_type_touhou_gunpower_turret_main_weapon: "§U神灵§!"
 mod_weapon_type_touhou_gunpower_turret_main_weapon_weapon_damage_mult: "$weapon_type_touhou_gunpower_turret_main_weapon$武器伤害调整"
 mod_weapon_type_touhou_gunpower_turret_main_weapon_weapon_fire_rate_mult: "$weapon_type_touhou_gunpower_turret_main_weapon$武器射速调整"
 touhou_gunpower_turret_deploy: "部署炮台 - 爆发模式"
 touhou_gunpower_turret_deploy_alt: "部署炮台 - 净化模式"
 touhou_gunpower_turret_deploy_alt_title: "部署炮台 - 净化模式\n部署当前舰队中的全部$touhou_gunpower_turret_moveable$，并且将其设置为净化模式。\n\n在净化模式下，炮台上装载的超重型轴基武器将§Y半功率输出§!，虽然杀伤性不如全功率输出模式，但没有连续开火的限制。虽然不像前者一样对大部分攻击具备少量的抗性，但自身武器的射程与射速会得到提升。"
 touhou_gunpower_turret_deploy_title: "部署炮台 - 爆发模式\n部署当前舰队中的全部$touhou_gunpower_turret_moveable$，并且将其设置为爆发模式。\n\n在爆发模式下，炮台上装载的超重型轴基武器将§Y全功率输出§!，可以产生§Y难以想象§!的杀伤，但存在最大连续开火§R数量限制§!，超出后主炮将需要时间§R进行冷却§!。处于这种模式的$touhou_gunpower_turret_stationary$的防御能力将获得提升，对大部分攻击产生一定的抗性。"
 touhou_gunpower_turret_dismiss: "解除部署"
 touhou_gunpower_turret_dismiss_title: "解除部署\n这将解除部属星系中的全部$touhou_gunpower_turret_stationary$，使其可以重新机动，并且能够重新部署到我们需要的地方。"
