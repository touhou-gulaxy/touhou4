 touhou_kamikakushi_extra_31_desc: "$spth_kamikakushi_country$: There is §Ga chance of 15%§! to avoid the loss of Extra Life."
 touhou_kamikakushi_extra_32_desc: "The extra life restore time of $spth_kamikakushi_country$ §G-60%§!."
 touhou_kamikakushi_extra_33_desc: "$spth_kamikakushi_country$: Indestructible for the first 3 days of battle."
