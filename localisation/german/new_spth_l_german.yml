 touhou_wonder_technologies_title: "§U奇迹工程§!"
 touhou_wonder_technologies_desc: "早在我们之前的那些幻想的物种创造过了远比我们发达的文明，他们的绝大多数技术都远不是我们能够理解的，不过有那么几样技术奇迹，也许我们可以尝试复原它们。"
 touhou_wonder_technologies_techs: "发现的技术奇迹"
 touhou_wonder_technologies_techs_researched: "研究的科技"
 situation_reverse_engine_makai_ftl_engine: "逆向工程：星界跃迁引擎"
 situation_reverse_engine_makai_ftl_engine_type: "$situation_reverse_engine_makai_ftl_engine$"
 situation_reverse_engine_makai_ftl_engine_desc: "尝试对魔界的星界跃迁引擎进行逆向工程，获得这项技术奇迹。"
 situation_reverse_engine_makai_ftl_engine_research: "研究成果"
 situation_reverse_engine_makai_ftl_engine_monthly_change_tooltip: "我们正在逆向研究。"
 spth_precursor.56.name: "§M复原计划§!"
 spth_precursor.56.desc: "对于我们手中的$spth_precursor.makai$战舰上那台极其复杂的跃迁引擎，我们的工程师们曾经没有任何思路去复原这样的技术奇迹。\n\n直到最近，对于此前在舰船核心中保存资料的分析已经告一段落，其中提及了$spth_precursor.makai$采用的跃迁技术的一些细节。$spth_precursor.makai$普遍装备的星界跃迁引擎在工作时，会借助一套结构撕开空间、刺破星界壁垒，并且不断的注入能量来扩大那道星界细缝，使其成为一道§Y人造的星界裂隙§!，从而借助星界裂隙进行超光速航行，理论上这一技术甚至可以让$spth_precursor.makai$自如的访问其他次元。\n\n不幸的是，星界泰坦上的那台引擎不足以供我们分析出足够的结果，但是我们可以尝试前往资料中标注的一处地点，理论上在那里我们可以发现一些关键的技术资料与生产设施。由于那处地点处于$spth_precursor.makai$位面的深空之中，我们只能尝试根据现有技术改造一艘足够大的载体平台，在上面搭载足够先进的科研分析设备与物资储备，尝试开辟一道星界裂隙前往那里。"
 spth_precursor.56.a: "让我们试试看吧。"
 spth_precursor.56.b: "这难度也太高了，也许一千年后值得一试。"
 spth_precursor.57.name: "再度尝试"
 spth_precursor.57.desc: "经过了一千多年的发展，我们的技术想必已经可以研究$spth_precursor.makai$战舰上那台极其复杂的跃迁引擎了，为此我们需要改造我们的主宰，在上面搭载足够先进的科研分析设备与物资储备，尝试开辟一道星界裂隙前往此前找到的那处坐标。"
 spth_precursor.58.name: "巨舰远航"
 spth_precursor.58.desc: "随着我们的$juggernaut$被改造完成，其上大部分的武器和全部的船坞均被拆除，取而代之的是先进的实验室模块、舰载工业设施和物资仓库，此外我们还大幅削减装甲和护盾发生器的数量，并且安装了实验性的星界装置，用于进入$spth_precursor.makai$位面。这趟航程往返预计需要§Y6§!年左右，在抵达并研究完后它会将一些资料提前传送给我们以供研究。\n\n它现在已经准备好出发前往$spth_precursor.makai$位面探索$spth_precursor.makai$资料中提及的设施了。"
 spth_precursor.58.a: "启航！"
 spth_precursor.59.name: "抵达"
 spth_precursor.59.desc: "我们的$juggernaut$近期成功抵达了$spth_precursor.makai$位面，距离目的地只剩下短短的几十天文单位的路程了。远程传感器探测到他们处于一团稀薄的星际气体中，在这团星云的中心是一个大小堪比整个§H[Root.capital_scope.System.GetName]§!星系大小的巨型结构，似乎那里就是魔界资料所提及的位置了。"
 spth_precursor.60.name: "庞然巨物"
 spth_precursor.60.desc: "在我们的远航舰到达那座巨型设施后，他们通过其表面的一处破洞成功进入了其中。这座设施不知道被遗弃了多久，已经完全失去了能源供应，其远处似乎存在着一个庞大的物体，或许那里存在着我们需要调查的东西。"
 spth_precursor.61.name: "现场研究"
 spth_precursor.61.desc: "那个物体似乎是某种极其巨大的舰船的残骸，其表面坑坑洼洼，周边则环绕着不计其数的较小的碎片。不少碎片都表现出来明显的切割痕迹，并且大量内部结构直接暴露于真空中——这有利于我们的调查。\n\n经过一段时间的搜索后，他们还真发现了一些关键资料，以及巨舰中央那个完好的巨大引擎。目前这些数据正在传输中，随舰的科学团队也开始了紧锣密鼓的研究，这极大的促进了我们的逆向工程。此外，他们还发现了一些有意思的东西，有待返回后交给我们的科研部门进行分析。"
 spth_precursor.62.name: "返航"
 spth_precursor.62.desc: "随着在那处设施的研究告一段落，并且物资储备已经接近了当前阶段的阈值，我们的$juggernaut$已经准备好返航了。"
 spth_precursor.63.name: "$juggernaut$已返回"
 spth_precursor.63.desc: "在完成了必要的研究后，我们的$juggernaut$已经返回并进入了§H[Root.capital_scope.GetName]§!的轨道。"
 spth_precursor.64.name: "逆向工程：星界跃迁引擎"
 spth_precursor.64.desc: "随着理论与工程学难关全部被攻破，我们现在已经可以着手尝试复现星界跃迁引擎了。这一步我们需要实验调试诸多参数，虽然繁琐，但距离我们攻克这一先进科技只差临门一脚了。"
 spth_precursor.65.name: "研究完成"
 spth_precursor.65.desc: "我们对于星界跃迁引擎的研究已经全部完成了，在漫长的探索与逆向后，我们现在也可以像魔界那样借助星界壁垒、开辟星界裂隙来进行超光速航行了。"
 spth_precursor.65.a: "无垠星海近在眼前！"
 touhou_makai_data_terminal: "魔界数据终端"
 touhou_makai_data_terminal_desc_short: "在魔界研究设施中发现的数据终端"
 touhou_makai_data_terminal_desc_details: "其中记录了诸多珍贵的信息，介绍了魔界与另一个文明的冲突，以及整个文明最后的日子里，面对着物理意义上遮天蔽日的自动化舰队节节败退。"
 r_touhou_fragments_of_the_world: "§M世界的碎片§!"
 r_touhou_fragments_of_the_world_desc: "在魔界设施里发现的神秘物品，透过这种实验性科技似乎可以§Y观测到其他次元发生的事情§!，从而为我们提供诸多见解。"
 r_touhou_fragments_of_the_world_effect: "§Y无视一切限制，准许每项科技只需要§G1.00§!£time£即可研究完成，直到快速研究了§G3.00-9.00§!项科技。§!"
 r_touhou_fragments_of_the_world_modifier_1: "位面窥视"
 r_touhou_fragments_of_the_world_modifier_1_desc: "窥探其他位面，能够给我们带来很多灵感呢。"
 r_touhou_fragments_of_the_world_modifier_2: "§M世界的碎片§!"
 r_touhou_fragments_of_the_world_modifier_3: "§M世界的碎片§!"
 r_touhou_fragments_of_the_world_modifier_4: "§M世界的碎片§!"
 touhou_crisis.304.name: "§G夺取隙间铸造厂控制权§!"
 touhou_crisis.304.desc: "在一场艰苦卓绝的战斗中击溃了§H幻想造碑§!星系内的$spth_kamikakushi_country$精锐守卫舰队后，我们成功控制了§M隙间铸造厂§!，现在这里不再会为$spth_kamikakushi_country$提供源源不断的增援了。\n\n我们现在可以利用这一巨构快速生产大量的舰船，反过来对付$spth_kamikakushi_country$了。"
 touhou_crisis.304.a: "守住这里，防止他们夺回铸造厂！"
 touhou_crisis.305.name: "§G控制隙间铸造厂§!"
 touhou_crisis.305.desc: "我们成功获得了§M隙间铸造厂§!的控制权，现在我们可以利用这座巨型舰船生产设施为我们生产源源不断的舰船了。"
 touhou_crisis.305.a: "整挺好。"
