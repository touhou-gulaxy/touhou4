 spth_th143_evasion: "Nimble Fabric"
 spth_th143_evasion_desc_short: "使用后一定时间内会变成无敌状态！\n这是宝贵的属于自己的道具！"
 spth_th143_evasion_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n可以一瞬间当场变成无敌状态。\n无敌状态下，虽然无法移动，\n但可调整无敌时间。"
 spth_th143_camera: "Tengu's Toy Camera"
 spth_th143_camera_desc_short: "使用后能够裁剪掉敌弹！\n是被小槌的魔力侵蚀的天狗的道具！"
 spth_th143_camera_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n通过拍摄前方\n能够将敌弹裁剪掉\n自动对焦，自动卷片。"
 spth_th143_gap: "Gap Folding Umbrella"
 spth_th143_gap_desc_short: "能够在画面边缘之间移动！\n从界线妖怪那里偷来的哦"
 spth_th143_gap_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n可以快速的进行移动，还可以长时间的潜伏在界线里伺机而动。"
 spth_th143_ghost: "Ghastly Send-Off Lantern"
 spth_th143_ghost_desc_short: "能够变成一直以来憧憬的幽灵\n幽灵在各个方面都能胜过肉体"
 spth_th143_ghost_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n一定时间内，可以变成幽灵。\n成为幽灵的这段时间内是无敌的，\n既可以移动也可以射击。\n在最关键的时候使用吧。"
 spth_th143_yinyangorb: "Bloodthirsty Yin-Yang Orb"
 spth_th143_yinyangorb_desc_short: "能够瞬移到敌人面前\n非常适合血气旺盛的人"
 spth_th143_yinyangorb_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n一颗渴望鲜血的阴阳玉，受其影响的人都会变得更加好战且鲁莽，\n但是可以缩小中弹判定。"
 spth_th143_bomb: "Four-Foot Magic Bomb"
 spth_th143_bomb_desc_short: "发动很慢但能消除大范围敌弹的炸弹\n玉——屋——　键——屋——"
 spth_th143_bomb_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n点燃直径足有四尺的炸弹。\n虽然从点燃到爆炸需要一点时间，\n但可以消除较广范围内的敌弹。\n请注意自身不会成为无敌状态。"
 spth_th143_stand: "Substitute Jizo"
 spth_th143_stand_desc_short: "能够让中弹变得像没发生过一样\n只是拿着就能犯规般地安心的狸猫的道具"
 spth_th143_stand_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n即使中弹也可以抵消\n是值得感激的地藏菩萨的吉祥物。\n可以集中精神来避弹啦。"
 spth_th143_renou: "Cursed Decoy Doll"
 spth_th143_renou_desc_short: "对BOSS来说是很有魅力的被诅咒的人偶\n怎么看都很不吉利……"
 spth_th143_renou_desc_details: "在博物志中发现的过往的密宝，其曾经被鬼人正邪使用来协助自己发动异变。\n敌人会瞄准错误的目标。\n因为敌弹会向着这个人偶发射\n所以轻松不少。"
 spth_th143_hammer: "Miracle Mallet (§PReplica§!)"
 spth_th143_hammer_desc_short: "A replica with the power of Miracle Mallet\nAny troublesome kedama? Just smash it! "
 spth_th143_hammer_desc_details: "A historical treasure recovered from Naturalis Historia. It was once used by Seija Kijin to initiate an incident.\nThe strongest \\"cheat\\" items against kedama.\nOne mallet, and all the enemy issues will be resolved with its unparalleled damage.\nNo need to dodge danmaku!"
 touhou_specimens.11: "The Grimoire of Marisa"
 touhou_specimens.11.desc: "魔理沙将自己记录着各式弹幕符卡的魔法书交予了我们，这极大的协助了我们在这方面的研究。"
 touhou_specimens.12: "Treasure of Amanojaku"
 touhou_specimens.12.desc: "We recovered one of the treasures used by amanojaku from Naturalis Historia and historical research. It's very precious and can provide us some boost."
