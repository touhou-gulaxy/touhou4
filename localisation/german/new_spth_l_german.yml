 touhou_robe_of_fire_rat: "Robe of Fire Rat"
 touhou_robe_of_fire_rat_desc_short: "「火蜥蜴之盾」"
 touhou_robe_of_fire_rat_desc_details: "辉夜姬的五难题之一的密宝。\n\n一种神秘的皮毛，传说中能抵御火焰，象征着保护和勇气，是来自蓬莱的珍贵物品。"
 touhou_tengu_fan: ""
 touhou_tengu_fan_desc_short: ""
 touhou_tengu_fan_desc_details: ""
 touhou_hina_doll: "Nagashi-bina Doll"
 touhou_hina_doll_desc_short: "She will take those misfortunes instead of you. "
 touhou_hina_doll_desc_details: "Dolls storing misfortune, used by the misfortune god. To let misfortune never come back to others, she collects and preserve the Nagashi-bina dolls in which humans use to put their own misfortune and float downstream, before the dolls are passed to other gods."
 touhou_jewel_from_the_dragon_neck: "Jewel from the Dragon's Neck"
 touhou_jewel_from_the_dragon_neck_desc_short: "\"Brilliant Dragon Bullet\""
 touhou_jewel_from_the_dragon_neck_desc_details: "辉夜姬的五难题之一的密宝。\n\n五色光辉之玉，一种极其稀有的宝石，象征着财富和权力，是来自蓬莱的珍贵物品。"
 touhou_tengu_pompomos: ""
 touhou_tengu_pompomos_desc_short: ""
 touhou_tengu_pompomos_desc_details: ""
 touhou_parasol: "Parasol of Yuuka"
 touhou_parasol_desc_short: "Its master isn't going to use it tonight."
 touhou_parasol_desc_details: "The parasol used by Yuuka. It emits a strong spirit power."
 touhou_specimens.13: "辉夜姬的密宝"
 touhou_specimens.13.desc: "在近期的举办的月都万象展上，$NAME_kaguya$展出了来自蓬莱的珍贵密宝。然而，这些展品难得以完整的形态示人，却又被偷了。\n\n永远亭许诺如果我们能够找回，那么就可以将这些展品赠与我们。"
 touhou_specimens.14: "寻回密宝"
 touhou_specimens.14.desc: "近期，我们成功的寻回了一件丢失的蓬莱密宝。\n\n永远亭按照承诺说的一样，这些展品赠与了我们。"
 touhou_kaguya_specimen_unlock_1: "难题「$touhou_swallow_cowrie_shell$ - 恒原始胎」"
 touhou_kaguya_specimen_unlock_1_DESC: "Impossible Requests of Kaguya-hime. If we retrieve the lost treasures, we can obtain them."
 touhou_kaguya_specimen_unlock_2: "Impossible Request “$touhou_buddha_stone_bowl$ -Celestial Fragrance-\""
 touhou_kaguya_specimen_unlock_2_DESC: "Impossible Requests of Kaguya-hime. If we retrieve the lost treasures, we can obtain them."
 touhou_kaguya_specimen_unlock_3: "Impossible Request “Robe of Fire Rat -Solar Ward-”"
 touhou_kaguya_specimen_unlock_3_DESC: "Impossible Requests of Kaguya-hime. If we retrieve the lost treasures, we can obtain them."
 touhou_kaguya_specimen_unlock_4: "Impossible Request \"$touhou_jewel_from_the_dragon_neck$ -Galactic Ripple-\""
 touhou_kaguya_specimen_unlock_4_DESC: "Impossible Requests of Kaguya-hime. If we retrieve the lost treasures, we can obtain them."
 touhou_specimens.15: "Mask of Noh"
 touhou_specimens.15.desc: "In a recent noh show, three masks of $NAME_kokoro$ lost their function oddly. She hopes we assist her in creating new masks to better embody emotions."
 touhou_kokoro_specimen_unlock: "Create Mask of Noh"
 touhou_kokoro_specimen_unlock_DESC: "Create a new Mask of Noh for Hata no Kokoro, and help her retrieve her emotions.\nThe previous, faulty Mask of Noh can be taken as a collection in return. A win for both parties."
 touhou_specimens.16: "Mask of Hope"
 touhou_specimens.16.desc: "To not let incidents happen again, $NAME_kokoro$ hopes we will help her create a replacement for the Mask of Hope so emotions no longer go berserk when she accidentally loses it.\n\nIt's difficult to create such a replacement for the Mask of Hope; it will come at a heavy cost in time and resources."
 touhou_kokoro_specimen_final_unlock: "Create Mask of Hope"
 touhou_kokoro_specimen_final_unlock_DESC: "Creating a replacement for Kokoro's Mask of Hope. So next time she loses it, it won't be another catastrophe of emotion going berserk."
 spth_precursor.202.desc.befor_crisis: "……\n你好，我们是§H隙间之里§!，你或许已经和顶替了这个名字的势力接触过了……\n\n这样吗……\n那你们最好做好战争准备……我们原本预计要过很久才能重返现实，不过看起来已经过去了如此久远的岁月，背叛者也已经离开了。\n……\n总之无论如何，暂时不要靠近这里。"
 spth_precursor.206.name: "§HSleepers Awake§!"
 spth_precursor.206.desc: "It began as a subtle shift in §H[From.GetAdjective]§! behavior. Scattered reports of their ships, once rarely seen outside their own space, now being spotted in remote systems all across the galaxy. Highly advanced scouting vessels visiting ancient, ruined worlds, refusing all hails and fleeing when attacked. Their purpose and mission unknown... until now.\n\nWe now know that the [From.GetSpeciesName] were preparing, recovering the databanks of survey beacons and automated scouting posts left behind when they retreated to their present borders. Gathering information for their return to the galactic stage.\n\nIn [From.GetSpeciesName] space, fleets are gathering, armies are being mustered and ancient factories roar to life. For the first time in an age, the §H[From.GetName]§! are looking outwards beyond their borders and towards the galaxy at large.\n\nAs their decaying shipyards are repaired and refitted and the dormant systems of Titan foundries come online, the rest of the galaxy is left with only one question - who will this once-sleeping giant target first in their quest to reclaim age-old glory lost?"
 spth_precursor.206.a: "Giants in the playground..."
 spth_precursor.206.b: "Decrepit fools."
 spth_precursor.216.a: "What happened?"
 spth_precursor.219.name: "§HRelic Acquired§!"
 spth_precursor.219.desc: "Our forces discovered an exotic relic after we conquered the capital of §Hthe Gap Realm§!."
 spth_precursor.219.a: "Good"
