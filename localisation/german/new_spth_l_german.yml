 sc_spth_lunar_outpost: "Lunar Capital observation post"
 sc_spth_lunar_outpost_desc: "The last shelter of the Lunar Capital is not inside the physical universe. Instead, they set a gigantic barrier around the Great Attractor of the Virgo Supercluster and created an artificial star system inside. Our sensors are capable of picking up its projection in the physical universe."
 sc_spth_minigalaxynary: "Lost Galaxy"
 sc_spth_minigalaxynary_desc: "A magical star system, which contains a large number of artificial stars and artificial planets, and it seems that there is some power maintaining this landscape. Its main body is not in the physical universe, but a giant barrier the size of a star field has been opened up near the Giant Gravitational Wave Source at the center of the Virgo Supercluster. An artificial galaxy is set up in the barrier, and our observation methods can detect its projection of the physical world."
