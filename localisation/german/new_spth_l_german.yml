 toho.10020.name: "幻想涅槃"
 toho.10020.desc: "在了解了一些禁忌的密法之后，我们现在有一个机会，可以给我们的幻想特性附魔['concept_touhou_trait_reflex']增强效应，这将拓展我们的力量，让我们进一步的涅槃重生。"
 toho.10020.effect: "§Y给['trait:trait_touhou']特质附魔['concept_touhou_trait_reflex']。§!"
 toho.10030.name: "星界网络突变"
 toho.10030.desc: "近期，负责维护魔界遗留的星界网络的科学团队报告称，某处位于遥远河外星系的接口突然出现了不明能源反应，表明那里的接口被激活了。并且，似乎正有什么巨大的物体正在通过星界壁垒，其目的地为我们星系中的星界网络主节点。\n\n这个物体预计将在§Y半年§!内抵达。"
 toho.10031.name: "抵达"
 toho.10031.desc: "此前发现的正在前往我们星系的巨型物体，如今已经抵达了§Y[spth_precursor_makai_network_system.GetName]§!。\n\n随着难以想象级别的能源被注入星界星门，一艘巨大的舰船从星门中出现，它的体积之巨大我们前所未见。这条舰船的识别讯号为§M魔界§!下属的一条§Y军用舰船§!§H[touhou_sky_control_ship_event_target.GetName]§!，似乎搭载了数台我们从未见过的武器，我们只知道这些武器的能源读数§R高的离谱§!。\n\n到目前为止，这条舰船对我们的呼叫没有应答，但鉴于它似乎完全处于瘫痪状态，我们暂时不会与它交战。我们仍在进行调查并试图开启通讯。"
 toho.10031.a: "一级戒备，进入战备状态！"
 toho.10031.b: "扫描这条舰船！"
 toho.10032.name: "扫描报告"
 toho.10032.desc: "根据我们对§Y[touhou_sky_control_ship_event_target.GetName]§!的扫描结果，其似乎高度自动化，在舰桥中只存在两个生命信号，并且其中一个生命活动迹象极其微弱，似乎位于一个冷冻仓内。其他的信息由于其大部分舱室都存在某种干扰，我们无法扫描得知。\n\n要想了解这条舰船的来龙去脉，我们或许应该组织登舰行动，去调查它的航行记录仪。"
 toho.10032.a: "让我们登舰看看情况。"
 mission_touhou_travel_site: "旅游景点"
 mission_touhou_travel_site_desc: "在空间站上设置游客中心，"
 mission_touhou_indoctrination: "社会变迁"
 mission_touhou_indoctrination_desc: "通过对其社会和文化的潜移默化来让原始物种接纳我们的思考方式。\n\n这将派遣特工宣传我们的文化等因素，在慢慢的渗透中使得当地社会天然的崇拜我们帝国。\n\n§E当渗透完成，该行星可以成为我们的附庸，同时给予一定的忠诚度加成，如果没有成为附庸，则增加对我们的外交评价。§!\n\n"
 mission_touhou_covert_infiltration: "幻想渗透"
 mission_touhou_covert_infiltration_desc: "这将派遣特工散播有关妖怪等幻想的存在的谣言，从而利用人们心中的恐惧和信仰。这样，我们就可以让幻想的种子在这颗星球上播种，等到出现妖怪、妖精和神明等存在的时候，我们就可以对当地居民加以渗透，使得这颗星球变得如同当年的幻想乡一样。\n\n§E当渗透完成，该行星将并入我们的帝国，将行星住民同化为我们的物种，同时给予原住民巨大但短暂的幸福提升。§!\n\n"
