 touhou_portal_gun_desc_details: "光x科技协助你自由往返地月之间，总感觉这句话有点耳熟。"
 touhou_izanagi_object: "伊奘诺物质"
 touhou_izanagi_object_desc_short: "被认为是幻想存在的证据之一"
 touhou_izanagi_object_desc_details: "可以用来打造各种神兵利器的神秘原料，产地是虹龙洞。\n\n§Y其基础产出自开局开始计算，且每年产出都会增长。§!"
 touhou_tnt: "TNT"
 touhou_tnt_desc_short: "月都不知道从什么位面拿来的"
 touhou_tnt_desc_details: "「喂？你家被我炸了。」"
 toho.1012.name: "发现新的星系"
 toho.1012.desc: "我们已经定位了一个先前不在我们的星图标记范围内的恒星系，这一发现引起了[Root.GetName]国内各界人士对这个恒星系的兴趣，并呼吁政府组织探索活动。"
 toho.1013.name: "[touhou_system_discover_country.GetName]发现新的星系"
 toho.1013.desc: "我们注意到最近空间探索方面的内容在[touhou_system_discover_country.GetName]国内备受关注，因为他们发现了一个原本不在他们星图标记范围内的星系。\n\n很巧的是，它也不在我们的星图标记范围内。"
