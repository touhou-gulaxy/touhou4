 lunar_capital_psi_special_stone_desc: "被腐化的虚境石。"
 lunar_capital_psi_special_wildlives_plural: "$lunar_capital_psi_special_wildlives$"
 lunar_capital_psi_special_wildlives_desc: "野生的动植物在被升格派腐化后，失去了自主意识，只知道向周围不断攻击。"
 lunar_capital_psi.107.fast: "让我们快点结束这一切吧。"
 lunar_capital_psi.107.slow: "趁这段时间抓紧备战。"
 lunar_capital_psi.108.name: "§r灵能环境活跃§!"
 lunar_capital_psi.108.desc: "近期我们的§H[TouhouGetPsionicDepartment]§!发现随着月之都升格派的活动，近期虚境的灵能活动变得愈发活跃，并且虚境和现实之间的帷幕逐渐变得稀薄。\n\n总的来说这有利有弊，我们可以更容易的潜入虚境，但同时也可能在虚境中碰到什么危险。"
 lunar_capital_psi.109.name: "§r灵能活动模式§!"
 lunar_capital_psi.109.desc: "随着月之都升格派在虚境中的活动，我们的§H[TouhouGetPsionicDepartment]§!检测到在§H[This.GetName]§!的附近的太空中存在着某种灵能活动模式，同时殖民地居民感受到了“某种令人不适的注视”。\n\n§R也许有什么事要在§H[This.GetName]§!上发生了。§!"
 lunar_capital_psi.110.name: "§r第四淮安通道§!"
 lunar_capital_psi.110.desc.111: "$lunar_capital_psi.110.desc.generic$根据§H[Root.GetName]§!传回的报告，有证据表明§H[Root.GetName]§!上的传送门不会对殖民地造成任何显著影响。最开始这道传送门让人们感到惊慌失措，但很快由于无事发生，人们也就慢慢的恢复了正常的作息。虽然§H[TouhouGetPsionicDepartment]§!检测到这一灵能活动模式的强度正在不断上升，但是对星球的全面调查没有获得任何可靠的证据能够证明§H[Root.GetName]§!上会发生什么事情。不过无论如何，殖民地的正常日子还会在很长一段时间内持续，因此大概没什么好担心的了。"
 lunar_capital_psi.110.desc.112: "$lunar_capital_psi.110.desc.generic$不过，近期§H[Root.GetName]§!上失踪事件的发生频率比其他世界要高出许多，且其中一些非常蹊跷，有些[Root.Owner.Species.GetName]会在大庭广众面前毫无征兆的突然消失，有些[Root.Owner.Species.GetName]则是从某个时间点之后就再也没有出现在其他居民面前。\n\n我们的§H[TouhouGetPsionicDepartment]§!推测这一切和月都的那道灵能传送门存在关联，但是目前没有明确的证据证明这一切。"
 lunar_capital_psi.110.desc.113: "$lunar_capital_psi.110.desc.generic$唯一奇怪的是，§H[Root.GetName]§!的一些居民饱受失眠和噩梦的困扰。有时候在入睡后，这些人就会感觉自己落入了紫色的星空中，远方不时浮现出语言难以形容的怪物，它们似乎位于更高维的空间中，光是注视它们，就会感受到巨大的精神压力。但放眼四周，到处都是怪物，根本不可能不去看那些怪物。\n\n不过医学部门的检测仅仅是怀疑这些人因为灵能传送门的出现，加上工作压力导致的轻度精神问题，在进行简单治疗后这些事情就不再引起人们的重视了。"
 lunar_capital_psi.110.desc.114: "$lunar_capital_psi.110.desc.generic$唯一可疑的是，§H[Root.GetName]§!上突然出现了少量本不该出现的来自旧地狱的怨灵，但是与地灵殿方面的沟通又表明近期没有任何怨灵离开过那里。当地政府只能把这些目击报告归因为某种群体性癔症现象。"
 lunar_capital_psi.110.desc.115: "$lunar_capital_psi.110.desc.generic$§H[Root.GetName]§!上的夜空开始变得不对劲了。虽然天文观测表明所有星体都处于正确的位置，但裸眼所见的星空却与以往大不相同——星辰不再是璀璨的光点，而是变成了一道道紫色伤口，某种紫色的光晕正从那些裂口中渗出。这一现象对于星球上的兔子和月兔们影响格外明显，不少人声称，仅仅是仰望这样的星空就会听到某种悠远的呼唤，催促他们走向那道传送门。"
 lunar_capital_psi.110.desc.116: "$lunar_capital_psi.110.desc.generic$然而很快，§H[Root.GetName]§!上的灵能传送门开始发出一种持续的低频轰鸣。这种声音并非通过空气传播，而是直接回荡在每个人的脑海中。长期暴露在这种声音下的人开始出现记忆混乱的症状，尤其是那些巫女们，她们坚称自己被邀请去了曾经的月之都街道，甚至能详细描述那里存在的各种景象，但这些人中绝大多数从未离开过§H[Root.GetName]§!。"
 lunar_capital_psi.110.desc.117: "$lunar_capital_psi.110.desc.generic$尽管有些报告指出殖民地上的一些人似乎开始慢慢的流失了灵力，但是医学报告并没能发现任何异常，加上这属于极个别案例，人们并没有把这件事放在心上。"
 lunar_capital_psi.110.desc.118: "$lunar_capital_psi.110.desc.generic$直到最近，传送门周边的物理常数开始变得不稳定了。测量仪器显示的数值每天都在以微小的幅度波动，重力、温度、甚至时间的流速都在发生着无法解释的变化。一些在传送门附近工作的研究员报告称，她们在执勤期间经历了长达三个小时的时间，然而监控显示他只在那里停留了不到三分钟。这一事件被列为最高机密，但类似的报告却越来越多。"
 lunar_capital_psi.110.desc.119: "$lunar_capital_psi.110.desc.generic$除了一种诡异的气氛开始在§H[Root.GetName]§!的殖民者之间蔓延。邻里之间的猜忌加深了，人们开始怀疑身边的人是否还是原来的那个人。有报告称，一些人的举止与从前截然不同，仿佛被替换了一般。虽然当局反复强调这可能是集体癔症导致的群体性错觉，但恐慌已经在暗处悄然滋生。"
 lunar_capital_psi.110.desc.120: "$lunar_capital_psi.110.desc.generic$殖民地的日常生活没有受到任何干扰，除了部分偏远地区报告称出现了反常的天气迹象，但是由于很快就恢复了正常，这些事件都被有意无意的忽视了。"
 lunar_capital_psi.110.desc.121: "$lunar_capital_psi.110.desc.generic$随着时间推移，§H[Root.GetName]§!上总是出现一些莫名其妙的事件，多个传感器都出现了奇怪的误报、许多人声称自己目击到了空间的裂隙凭空出现又消失、一些半透明的人形生命体出现在人迹罕见的地区……\n\n但是如果重启有问题的传感器，或者从别的地方拿来新的传感器，检测数据一切又会恢复正常，并且那些目击报告又没有明确的证据，如果这些让不是在胡扯的话，这一切只可能和那个灵能传送门存在千丝万缕的联系。"
 lunar_capital_psi.110.desc.122: "$lunar_capital_psi.110.desc.generic$之后的一段时间，某些东西开始从传送门中泄漏出来了。起初那只是些细小的紫色晶体，像是虚境石在现实空间中的投影。这些晶体本身并无危害，甚至可以被安全地收集和研究。"
 lunar_capital_psi.110.desc.123: "$lunar_capital_psi.110.desc.generic$有些人目击到一种若有若无的红色薄雾从传送门中逸出，在太空中扩散着，但是光学影像和传感器都没有找到这些薄雾存在的证据。"
 lunar_capital_psi.110.desc.124: "$lunar_capital_psi.110.desc.generic$不过§H[TouhouGetPsionicDepartment]§!的最新检测表明，传送门释放的灵能波动已经与§H[Root.GetName]§!的一些地质结构产生了某种共振。这种共振目前尚不至于引发地质灾难，因此并没有引起殖民地当局的在意。"
 lunar_capital_psi.110.desc.125: "$lunar_capital_psi.110.desc.generic$但是§H[Root.GetName]§!的科学部门最近发现了一些不对劲的轻微地质活动，它们似乎具备精确的活动周期，明显不是正常的地质问题范畴。"
 lunar_capital_psi.110.desc.126: "$lunar_capital_psi.110.desc.generic$虽然§H[Root.GetName]§!上一座城市的政府报告称近期的犯罪度增加了，并且有些人目击到了紫色的雾气从部分建筑中蔓延开来，但§H[Root.GetName]§!政府有自信能处理好这些问题。"
 lunar_capital_psi.110.desc.127: "$lunar_capital_psi.110.desc.generic$§H[Root.GetName]§!上出现了一些奇特的植物，它们似乎并不是本土物种，也没有任何人引入过这些东西。"
 lunar_capital_psi.110.desc.128: "$lunar_capital_psi.110.desc.generic$近来，§H[Root.GetName]§!上有传言表明殖民地表面一些偏远的地区多次发生目击所谓“紫色迷雾”的事件，这些迷雾不经意间从传送门中出现并且移动到地表，有人靠近之后又迅速消散，不留一点痕迹。不过这些传言并无可靠证据支持，所有所谓被袭击的地点都是一片荒芜，只有地面上有少量的泽珞尘。"
 lunar_capital_psi.110.desc.129: "$lunar_capital_psi.110.desc.generic$但是§H[TouhouGetPsionicDepartment]§!观测到了传送门后的一股能量波动，仿佛有什么东西正在充能。他们建议在§H[Root.GetName]§!附近建设灵能抑制设备，以防备可能的攻击。"
 lunar_capital_psi.110.desc.130: "$lunar_capital_psi.110.desc.generic$但是§H[TouhouGetPsionicDepartment]§!观测到了传送门后的一股能量波动，仿佛有什么东西要从传送门中出现了。我们最好往§H[Root.GetName]§!附近派遣军用太空舰队，以防备可能的攻击。"
 lunar_capital_psi.110.desc.131: "$lunar_capital_psi.110.desc.generic$唯一奇怪的是每到夜晚，有些人总共听到莫名其妙的交谈声，但是又找不到声音的来源。"
 lunar_capital_psi.110.desc.132: "$lunar_capital_psi.110.desc.generic$虽然部分地区出现了不该出现的积雨云，但是这总不会代表着什么坏事。"
 lunar_capital_psi.110.desc.133: "$lunar_capital_psi.110.desc.generic$直到某天开始，传送门中传出轻微的灵能脉冲，其强度正在不断上升，或许有什么事情要发生了？"
 lunar_capital_psi.110.desc.134: "$lunar_capital_psi.110.desc.generic$虽然§H[Root.GetName]§!的部分电网设备最近出现了故障，但这也许只是设备老化导致的而已。"
 lunar_capital_psi.110.desc.135: "$lunar_capital_psi.110.desc.generic$直到最近星球上的一些仓储设施经常传出怪声，并且摄像头都工作异常，但是每次调查都显示里面没有任何人在搞鬼。"
 lunar_capital_psi.110.desc.136: "$lunar_capital_psi.110.desc.generic$不过，§H[Root.GetName]§!的一些植物似乎得了一种怪病，但是目前为止除了让这些植物变色，没有任何影响"
 lunar_capital_psi.110.desc.137: "$lunar_capital_psi.110.desc.generic$只是部分生产线最近经常出现故障，但是维修后又恢复了正常。"
 lunar_capital_psi.110.desc.138: "$lunar_capital_psi.110.desc.generic$但是天文部门观测到了传送门附近产生了某种引力势井，或许我们最好往§H[Root.GetName]§!附近派遣军用太空舰队，以防备可能的攻击。"
 lunar_capital_psi.110.desc.139: "$lunar_capital_psi.110.desc.generic$除了H[Root.GetName]§!上的有些人突然变得孤寡沉默，并且经常进行某种集会。"
 lunar_capital_psi.111.name: "§R永夜异变§!"
 lunar_capital_psi.111.desc: "§H[Root.GetName]§!上的传送门起初并没有带来什么影响，直到某个晚上之后，多个地区报告太阳再也没有升起过，随后是原本的向阳面也出现了这一情况，然而轨道上的卫星显示这颗星球仍在正常自转，一切都如此前一样正常。整个世界仿佛陷入了永夜，这一切给§H[Root.Owner.Species.GetName]§!的工作效率带来了巨大的影响，原有的生活节奏被彻底打乱，并且一些犯罪分子的兴起也让治安环境快速下降了。预计这一情况还会持续很长一段时间才会自然结束，而目前我们还找不到任何解决方案。"
 lunar_capital_psi.112.name: "§R生命凋亡§!"
 lunar_capital_psi.112.desc: "事实证明此前§H[Root.GetName]§!上的人口失踪事件与月之都息息相关。这次我们的§H[TouhouGetPsionicDepartment]§!观测到了失踪人口在虚境中的踪影，并且在失踪的§H[Root.Owner.Species.GetName]§!最后可能出现的位置附近，发现了微量的$sr_zro$尘。没过多久，大规模的人口失踪事件就发生了，殖民地居民开始成批成批地消失，只留下空荡荡的衣物散落在原地。更可怕的是，那些失踪者留在生者记忆中的痕迹也开始变得模糊，仿佛他们从未存在过一样。整个殖民地陷入了巨大的恐慌，幸存者们不知道什么时候自己也会悄无声息地被从这个世界上抹去。"
 lunar_capital_psi.113.name: "§R梦境入侵§!"
 lunar_capital_psi.113.desc: "§H[Root.GetName]§!上的居民已经无法再安然入睡了。每当他们闭上眼睛，意识就会被强行拖入紫色的星空中，并且随着不断的“下潜”，最终进入了一个由银白色光芒构成的冰冷世界，在那里他们感受到了“前所未有的宁静与安全”。醒来后，这些人发现自己身上多了一些无法解释的印记，有些人甚至会做出各种不由自主的举动——比如在午夜时分整齐划一地走出家门，前往最近的发射场，试图前往那道传送门。如果任由这种情况发展下去，整个殖民地的居民或许都会陷入类似的群体癔症。"
 lunar_capital_psi.114.name: "§R怨灵暴动§!"
 lunar_capital_psi.114.desc: "事实证明，此前§H[Root.GetName]§!上的怨灵目击报告是真实的。随着传送门灵能活动模式的增加，怨灵的目击报告越来越多，甚至有人看到晚上有成群的怨灵从那个传送门中出现，涌向§H[Root.GetName]§!。伴随着它们出现的是部分地区的气温急剧下降，而且这些怨灵与旧地狱中的那些仿佛完全不同，它们无法被常规的手段所控制，殖民地的安保部队虽然能暂时驱散它们，但无法从根本上消灭这些东西。"
 lunar_capital_psi.115.name: "§R躁动的月兔§!"
 lunar_capital_psi.115.desc: "§H[Root.GetName]§!上的月兔们受到的影响越来越严重了，不仅是她们的工作效率严重下降，偶尔还会不由自主的做出一些暴力行为，比如破坏周围的公共设施、进行各自犯罪行为、尝试响应她们脑海里的某个呼唤进入传送门之中。目前已经有数艘飞船被劫持，它们都进入了那个传送门，并且再也没有回来过。尽管其他星球上观测到的星空一切正常，然而这个星球上的人们看到的依旧是那片令人癫狂的景象。"
 lunar_capital_psi.116.name: "§R结界侵蚀§!"
 lunar_capital_psi.116.desc: "随着此前那些奇怪的声音渐渐消失，一种针对星球大结界的怪异现象开始在§H[Root.GetName]§!上蔓延。当地政府发现星球大结界内的区域似乎变小了，或者说一部分区域被另一道结界所笼罩，而这道结界明显有着月之都的特征。随着这一现象出现的是各种物资的生产效率的下降——合金突然氧化、矿物品质下降等等。"
 lunar_capital_psi.117.name: "§R灵力缺失§!"
 lunar_capital_psi.117.desc: "§H[Root.GetName]§!上的§H[Root.Owner.Species.GetName]§!正在集体经历一场可怕的枯竭。他们体内的灵力仿佛被一只无形的泵抽走，源源不断地流向那道传送门。最为严重的是那些妖怪和神明，对于习惯了运用灵力的幻想的存在而言，这种感觉就如同溺水者看着空气从肺中流逝一般绝望。与此同时，§H[TouhouGetPsionicDepartment]§!探测到传送门另一头的灵能强度正在持续攀升，显然那些被抽取的灵力正在被月之都用来强化它们自身。我们在用自己人的力量喂养敌人。"
 lunar_capital_psi.118.name: "§R灵能暗影§!"
 lunar_capital_psi.118.desc: "§H[Root.GetName]§!上的所有研究工作近期都难以开展了。尽管身体上没有感觉到任何异常，但是仪器检测到的任何数值——距离、时间、重力等等都发生了错乱，即使是更换设备也无济于事。并且§H[Root.Owner.Species.GetName]§!研究员们感到来自灵魂深处的一种感觉，仿佛有什么灵能暗影正在注视着他们，这种感觉还使得他们对于时间的感知变得扭曲了。"
 lunar_capital_psi.119.name: "§R局势不稳§!"
 lunar_capital_psi.119.desc: "§H[Root.GetName]§!最核心的权力结构似乎已经被腐化了，部分掌握重要权力的官员开始表现出异常的决策倾向，他们的命令不再是基于殖民地的安全考量，反而像是在进行某种秘密活动。有人将关键的防御情报泄露给不知名的接收方，有人颁布了明显会让治安恶化的行政命令，更有甚者直接用资金支持那些犯罪组织。在这种来自内部的背叛下，殖民地的抵抗力量受到了严重的削弱。一场针对叛徒的肃清行动已迫在眉睫，但谁又能确保肃清者本身没有被腐化呢？"
 lunar_capital_psi.120.name: "§R春雪异变§!"
 lunar_capital_psi.120.desc: "一种违背自然规律的异常天气现象降临在§H[Root.GetName]§!上。明明是理应温暖的季节，天空却突然降下了暴雪。这些雪花并非由水凝结而成，而是由纯粹的灵能结晶构成，它们堆积在地面上不会融化，反而会不断吸取周围环境的热量。如果只是这样也就罢了，陷入这片雪域的居民还会感到自己的生命力与活力被逐渐剥夺，取而代之的是一种想要永远沉睡的渴望，这一切使得清理这些“积雪”成为了某种不可能的事情。随着道路和大量的生产设施被覆盖，殖民地的生产效率受到了极其严重的负面影响。"
 lunar_capital_psi.120.desc.gensokyo: "幻想乡的春天迟到了。本应是冰雪消融、草木萌发的季节，天空中却持续飘落着带有灵能气息的雪花。这种诡异的春雪不仅没有带来生机，反而让接触到它的动植物陷入了更深层的休眠。这些雪花并非由水凝结而成，而是由纯粹的灵能结晶构成，它们堆积在地面上不会融化，反而会不断吸取周围环境的热量。这一切都与当年的春雪异变如此相像，但是春度并没有向上次一样因为人为因素消失，我们只能认为这与星球附近的灵能传送门存在关联。"
 lunar_capital_psi.121.name: "§R恶意实体§!"
 lunar_capital_psi.121.desc: "来自§H[Root.GetName]§!的报告表明我们的殖民地正在遭受攻击，部分地区突然出现了直接连通向虚境的间隙，随后灵能构成的恶意实体开始向我们发动攻击，根据我们的§H[TouhouGetPsionicDepartment]§!报告，这些恶意实体似乎是月之都中士兵的灵能幻象。伴随着这些幻象出现的还有一种苍白色的雾气，似乎接触到这些雾气的生命体会开始慢慢失去生命力，不论是动植物还是合成生命，仿佛是在“清除污秽”。\n\n我们的殖民地安保部队尝试用炮火打击这些东西，虽然能够遏制乃至驱散这些雾气，但是随行的灵能幻象也让我们造成了巨大损失，如果没有额外的支援，我们可能会失去§H[Root.GetName]§!。"
 lunar_capital_psi.122.name: "§R生命力丧失§!"
 lunar_capital_psi.122.desc: "接触了之前那些灵能晶体的人开始患上了某种未知疾病，由于完全无法解析其发病机制，即使是最先进的医疗手段都束手无策。这种疾病的感染者会感到生命力在从他们身体中抽离，随着严重程度的上升，他们的部分器官也开始变成了那些灵能晶体，最终痛苦的死亡。存在着这些晶体的区域则正在发生一种令人毛骨悚然的现象，进入这些区域的§H[Root.Owner.Species.GetName]§!会感到自己的精力在飞速流逝，仿佛有什么东西正在贪婪地吮吸着他们的生命力，最终也患上这种病症。"
 lunar_capital_psi.122.desc.gensokyo: "接触了之前那些灵能晶体的人开始患上了某种未知疾病，由于完全无法解析其发病机制，即使是最先进的医疗手段都束手无策。一些年长的妖怪记得一种和这些晶体很像的东西——石樱。只不过当年丧失了生命力的只有妖精，现在则是一切§H[Root.Owner.Species.GetName]§!。这种疾病的感染者会感到生命力在从他们身体中抽离，随着严重程度的上升，他们的部分器官也开始变成了那些灵能晶体，最终痛苦的死亡。存在着这些晶体的区域则正在发生一种令人毛骨悚然的现象，进入这些区域的§H[Root.Owner.Species.GetName]§!会感到自己的精力在飞速流逝，仿佛有什么东西正在贪婪地吮吸着他们的生命力，最终也患上这种病症。"
 lunar_capital_psi.123.name: "§R红雾弥漫§!"
 lunar_capital_psi.123.desc: "一种猩红色的浓雾从传送门的方向滚滚而来，遮天蔽日。这种红雾不仅会阻挡可见光，更会吸收所有的电磁波，使得任何形式的远程通讯和探测手段全部失效。当红雾笼罩整个地区时，人们只能依靠听觉来感知周围的环境。而更糟糕的是，红雾中似乎隐藏着什么东西，不断有巡逻队在进入红雾后失去联系，偶尔能找到的幸存者也精神失常，他们惊恐万分地描述着雾中那些“扇动着巨大翅膀的暗影”。"
 lunar_capital_psi.123.desc.gensokyo: "一股来自传送门中的的红色雾气正在侵蚀§H[Root.GetName]§!的边界。起初当地政府怀疑是某些吸血鬼在搞鬼，但这些雾气与当年的红雾异变不同，这次的红雾带有明显的虚境特征。当红雾笼罩整个地区时，§H[Root.Owner.Species.GetName]§!只能依靠听觉来感知周围的环境，这对我们的生产生活造成了极大的阻碍，§H[Root.GetName]§!请求更先进的灵能抑制设备来对抗这种东西。"
 lunar_capital_psi.124.name: "§R突然出现的间歇泉§!"
 lunar_capital_psi.124.desc: "随着地质活动的加剧，§H[Root.GetName]§!上的一些地方突然出现了数十道间歇泉。它们毫无征兆地从地底喷涌而出，但它们喷出的并不是滚烫的泉水，而是温度极低、散发着紫色荧光的液态灵能残留物。地质探测表明这些间歇泉下没有任何地下水体和热源的存在，仿佛这些液体就是突然出现在那里的。被这种液体沾染到的建筑材料会更加容易老化，因此§H[Root.GetName]§!当地政府不得不更加频繁的对星球基础设施进行维护工作。"
 lunar_capital_psi.125.name: "§R地震频发§!"
 lunar_capital_psi.125.desc: "§H[Root.GetName]§!上的地震越来越频繁了，连原先不应该存在剧烈地质活动的地方都发生了地震，并且地震的发生周期似乎与灵能传送门的灵能活动模式存在关联。这些地震并非普通的地壳运动，因为它们甚至在§H[Root.GetName]§!的地表上蚀刻出了复杂的几何图形，在太空中看来，这些图形似乎都与月都和虚境存在着关联。地震学家们对此束手无策，因为他们面对的根本不是地质问题，而是某种异常灵能活动引发的行星改造工程。"
 lunar_capital_psi.126.name: "§R城市陷落§!"
 lunar_capital_psi.126.desc: "§H[Root.GetName]§!传来了一份令人不安的报告，当地的一座城市的氛围正在变得越来越诡异，其中的居民变得不愿与外人接触，并且犯罪度逐渐升高。一段时间过后，一道似乎是月之都升格派所构筑的结界笼罩了整个城市，我们的任何探测器与调查人员都无法进入，随着苍白色的迷雾氤氲在其中，这座城市也逐渐与我们失去了联系。\n\n随着这座城市的陷落，其他地方的人们似乎提到了某种来自灵魂深处的低语，这种低语不仅会使人心烦意乱，还使得一部分§H[Root.Owner.Species.GetName]§!开始出现了暴力倾向。或许我们应该采取非常手段来应对这一切了。"
 lunar_capital_psi.127.name: "§R异常作物§!"
 lunar_capital_psi.127.desc: "起初§H[Root.GetName]§!上的这些植物一切正常，并且似乎还可以用于农业用途，然而在某个时期这些植物会一起开花，伴随着美丽的白色花簇的是未知粒子导致的辐射，被这一辐射沾染到的生物会发生基因层面的重组，变成形似兔子但是充满攻击性的生物，覆盖在这些辐射生物表面的厚重硅化层甚至可以抵御重型火力的直射。\n\n更难缠的是这些植物极难根除，这一大片区域已经彻底被这些洁白的花海污染而无法使用了。"
 lunar_capital_psi.128.name: "§R灵能迷雾§!"
 lunar_capital_psi.128.desc: "来自§H[Root.GetName]§!的报告表明我们的殖民地正在遭受攻击，起初只是某些容易被忽视的偏远地区突然变得杳无音讯，随后这种影响开始扩散，§H[Root.GetName]§!的天空被染上了绚丽而又邪恶的色彩，令敢于注视它们的人陷入疯狂，传送门中涌现出怪异的深紫色迷雾，随后降下星球地表，吞噬着它们所触及的一切。殖民地安保部队证实对它们进行攻击可以在一定程度上抑制灵能迷雾的扩散。不过§H[Root.GetName]§!已经在突如其来的攻击中遭受了巨大的损失，如果没有额外的支援，我们可能会失去§H[Root.GetName]§!。"
 lunar_capital_psi.129.name: "§R灵能攻击§!"
 lunar_capital_psi.129.desc: "一束来自虚境的灵能光束从月都开辟的传送门中出现，准确的命中了§H[This.GetName]§!。这道足以撕裂时空的攻击重创了§H[This.GetName]§!，殖民地上的绝大部分设施都遭受了严重的破坏，有大量人口因此而死，不过一切仍能被重建。"
 lunar_capital_psi.129.desc.no_psionic_inhibitor: "一束来自虚境的灵能光束从月都开辟的传送门中出现，预计其将袭击§H[This.GetName]§!。好在我们的灵能抑制器吸收了这次攻击，理论上没有任何东西能在这种足以撕裂时空的攻击下存活——因此灵能抑制器也被彻底摧毁了。如果我们想要保证§H[This.GetName]§!的安全，最好尽快重建灵能抑制器。"
 lunar_capital_psi.130.name: "§R实体入侵§!"
 lunar_capital_psi.130.desc: "在一段时间的演化后，我们此前在§H[This.GetName]§!附近发现的传送门突然扩张到了一个夸张的大小，并成为了一个由灵能维持存在的裂隙。一个灵能化身从中出现，向星系内的我方设施发动了攻击。"
 lunar_capital_psi.130.effect: "§R一个灵能实体出现在了§H[This.GetName]§!上方。§!"
 lunar_capital_psi.131.name: "§R虚境低语§!"
 lunar_capital_psi.131.desc: "整个§H[Root.GetName]§!上的所有生命体——无论智慧与否——都开始听到来自虚境的低语。这种低语不需要通过空气传播，而是直接植入意识深处。长期暴露在这种低语下的人开始表现出集体性的癔症和认知失调，整个殖民地社会的运转正在因为人们无法再信任自己的思维而逐步瘫痪。"
 lunar_capital_psi.132.name: "§R血雨§!"
 lunar_capital_psi.132.desc: "不久前，§H[Root.GetName]§!上下雨了，不是我们熟悉的雨，而是猩红色、带有刺鼻的腐臭味的雨。化学分析表明其中含有一定量的生物活性物质，但我们的科学团队无法分辨其来源。"
 lunar_capital_psi.133.name: "§R矿脉枯萎§!"
 lunar_capital_psi.133.desc: "随着灵能脉冲达到峰值，§H[Root.GetName]§!上的一条矿脉神秘消失了，确切的说，是原本的矿石一夜之间变成了普通的岩石，那些此前已被切割分离出来的矿石没有受到影响，它们也成了一条矿脉曾经存在过的仅有的证据。\n\n§H[Root.GetName]§!的科学团队对矿脉及其周围进行了调查，并未发现什么可疑之处，就好像§H[Root.GetName]§!上突然发生了某种我们此前闻所未闻的地质活动，导致我们的矿脉变成了普通的岩石。"
 lunar_capital_psi.134.name: "§R电网失灵§!"
 lunar_capital_psi.134.desc: "近期，§H[Root.GetName]§!的电网中出现了一种异常的“电流”，它实际上并不是电流，不遵循一般电流运动的规律，而是在电网里到处乱窜，造成了许多设备短路和失灵。当地政府被迫对部分电网进行了检修，但是没有找到任何原因，总体而言，我们的发电用电效率大大降低了。"
 lunar_capital_psi.135.name: "§R仓库异常§!"
 lunar_capital_psi.135.desc: "§H[Root.GetName]§!近期生产的一批资源不翼而飞了，尽管有关的生产、流通和存储记录都没有任何问题，没有任何腐败的迹象，也没有任何有关设备损坏的情况，但已经生产的东西就这样凭空消失了。\n\n我们的科学部门在调查后发现，即使是那些已被提前储存在其他星球的物资也神秘消失了，只留下空空如也的仓库，这一过程没有留下任何出库记录，仿佛§H[Root.GetName]§!的产品从未存在过一样。"
 lunar_capital_psi.136.name: "§R枯萎病§!"
 lunar_capital_psi.136.desc: "一种诡异的农作物疾病正在§H[Root.GetName]§!上蔓延，它的传播不受物种的限制，即使是来自不同星球的农作物也是如此，没人知道它的病原体和传播方式究竟是什么，似乎只要是在§H[Root.GetName]§!和§H[Root.GetName]§!的近地轨道上的植物都无法免于感染。\n\n受感染的植物起初会快速生长，但植物本身却会在生长的过程中呈现出诡异的彩色，随着植物成熟，它们却无法产生任何果实，随后，植物便会变成灰色，随风化为粉末，就像它从不存在一样。幸运的是，任何类型的植物对这种怪病都有一定的抵抗力，因此还不至于使得§H[Root.GetName]§!颗粒无收，但这也严重打击了§H[Root.GetName]§!的农业。"
 lunar_capital_psi.137.name: "§R工厂故障§!"
 lunar_capital_psi.137.desc: "§H[Root.GetName]§!的当地政府报告称当地的自动化生产线出现了未知的问题：产品的品质剧烈波动，产生了大量不合格甚至存在严重问题的产品，而且这种情况遍布整个§H[Root.GetName]§!，就好像一夜之间§H[Root.GetName]§!上大大小小的自动化生产线全都坏了。\n\n更奇怪的是，任何调查与测试都表明这些产线不存在任何问题，但是一旦开始生产就变得不正常了。"
 lunar_capital_psi.138.name: "§R虚境势井§!"
 lunar_capital_psi.138.desc: "随着引力势井的扩大，某种虚境势井突然出现取代了原先的传送门，从中出现的是一个灵能实体，开始无差别攻击周围的一切东西。"
 lunar_capital_psi.139.name: "§R邪教叛乱§!"
 lunar_capital_psi.139.desc: "一直有证据显示§H[Root.GetName]§!上存在一个大规模的邪教组织，但是当地警方的突击都没有发现任何人证物证。直到今天——他们谋划在§H[Root.GetName]§!上发动叛乱的阴谋得逞了。\n\n来自§H[Root.GetName]§!的报告显示那些邪教徒组织严密，战术灵活，精通灵能的使用，并且完全不会畏惧疼痛和死亡，在某些方面甚至比§H[Root.GetName]§!的卫戍部队做的更好。§H[Root.GetName]§!的军队在突如其来的攻击中遭受了巨大的损失，如果没有额外的支援，我们可能会失去§H[Root.GetName]§!。"
 lunar_capital_psi.140.name: "§r通道消失§!"
 lunar_capital_psi.140.desc: "没有任何预兆，那道折磨了§H[Root.GetName]§!许久的传送门突然开始急剧收缩。与其说它是在消失，不如说它完成了某种使命之后的主动撤离。\n\n这道传送门带来的负面效应还会持续相当的一段时间，但至少现在§H[Root.GetName]§!暂时安全了。"
 lunar_capital_psi.141.name: "§r[touhou_target_community_member.GetName]受到攻击§!"
 lunar_capital_psi.141.galactic_custodian: "尊敬的星海监管人，我们的星球，§H[From.GetName]§!，遭到了虚境中实体的突然袭击，我们的反击对他们几乎没有效果！\n\n我们基本毫无胜算，在星球沦陷后也不知道会发生什么不好的事情，作为星海的监管人，保护全体共同体成员不受外界的威胁是您应尽的职责，请尽您所能地提供援助吧！"
 lunar_capital_psi.141.galactic_emperor: "帝皇陛下，我们的星球，§H[From.GetName]§!，遭到了虚境中实体的突然袭击，我们的反击对他们几乎没有效果！\n\n一旦我方被击败，他们一定会吞并帝国的剩余部分！作为[Root.GetRulerTitle]，保护帝国全体国民是您应尽的职责。我们恳请您即刻出兵！"
