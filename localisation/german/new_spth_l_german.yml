 th_ag_interaction_trait_starlightII_sci_desc: "$touhou_ag_ancient_ai_leader_trait_title$ §PStarlight 2, the advanced AI from Ancient Civilization, has learned our knowledge about spirit power. It now performs better in research and administrative management.§!"
