 spth_precursor.301.name: "§P暗星幻梦§!数据库解析"
 spth_precursor.301.desc: "近期，我们的科研部门在此前被我们摧毁的古代泰坦-暗星幻梦的残骸中，发现了一个神秘的数据库。\n\n这一数据库中记载了一片残缺的星图，其似乎指向了§Y某个银河系以外的坐标§!。并且，其制造工艺与装饰均与§H先祖联盟§!或现在的堕落帝国不符，似乎是被称之为“先祖”的某个古代文明所制。也许那处坐标藏着§Y知识管理者§!发现过的某些秘密，总之科学部门建议我们对这个数据库加以解析/"
 spth_precursor.301.a: "§R落后老东西的秘密不看也罢。§!"
 spth_precursor.302.name: "河外星系"
 spth_precursor.302.desc: "对于§P暗星幻梦§!上发现的数据库的解析工作已经完成了。\n\n这个数据库的制造者自称“§P文明世界§!”，其上记录的坐标指向了一处我们从未发现过的河外星系，远程探测器表明其中存在着一个§Y反常黑洞§!，其似乎已经失去了全部的角动量与电荷。\n\n我们的天文部门强烈建议前往这一星系来一探究竟。"
 touhou_blackhole_generator_destoryed: "损坏的黑洞电容器"
 touhou_blackhole_generator_destoryed_DESC: "这座巨型装置曾经依靠抽取克尔黑洞的角动量来进行供能，此外还可以利用粒子加速器合成基本粒子，并且通过聚变反应合成各种元素。此外其还可以通过某种未知手段使黑洞获得角动量和电荷，形象的说，这就是一台§Y依靠黑洞进行储能的电池§!。"
