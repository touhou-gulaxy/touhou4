 pc_touhou_non_revolve_blackhole_desc: "这颗黑洞明显曾经是一颗高速自转的大型克尔-纽曼黑洞，这种质量的纽曼黑洞正常应该无法自然形成，极有可能是某个高等文明干预形成的。之后其电量与角动量似乎都被在其附近的巨型结构彻底采集，被还原为了一颗史瓦西黑洞。根据测算，其被采集到达这种状态所需的时间约需要10^44年以上，这已经超越了我们宇宙的年龄——这个天体本不应该存在的。"
