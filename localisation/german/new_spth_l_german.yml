 disappear_barrier.1000.name: "§BRelay§!"
 disappear_barrier.1000.desc: "经过对月之都残留资料分析，我们大致推测出来月都逃亡过程中一处中转站的坐标，那处星系在星图记录中应该是一片虚空才对，天文部门对此表示巨大的不解。\n\n同时远程探测手段无法观测到其存在，根据记载与我们的一些猜测，那个星系应该被以什么方式隐藏了起来。\n\n对于这一情况，科学部门仍在研究。"
 disappear_barrier.1000.a: "Roger."
 disappear_barrier_locate_lunar_system_1: "§BLocating - Lunar Capital Relay§!"
 disappear_barrier_locate_lunar_system_1_type: "$disappear_barrier_locate_lunar_system_1$"
 disappear_barrier_locate_lunar_system_1_desc: "Nothing was at that coordinate in our starmap. The Ministry of Science is still trying to figure this out and discover that system."
 disappear_barrier_locate_lunar_system_1_approach_positive: "Increase investment"
 disappear_barrier_locate_lunar_system_1_approach_positive_effect: "There are so many mysteries behind all these, not to say it may bring scientific breakthroughs. The paybacks will prove their value."
 disappear_barrier_locate_lunar_system_1_approach_netual: "Don't intervene"
 disappear_barrier_locate_lunar_system_1_approach_netual_effect: "We aren't sure if these records are accurate and the location is safe. Let's proceed with caution."
 disappear_barrier_locate_lunar_system_1_approach_pause: "Halt further funding"
 disappear_barrier_locate_lunar_system_1_approach_pause_effect: "Is that really reasonable?"
 disappear_barrier.1002.name: "§BUnnatural Reaction§!"
 disappear_barrier.1002.desc: "During an investigation of the designated sector, our team discovered faint spirit power reactions that defies natural causes. Scientists suggest further research since it's the only trace found so far.\n\nThe reaction is similar to phenomena on the shattered lunar barrier. One speculation is that the lunarians use the same technology and have incorporated the entire star system into the barrier at astronomical scales. The required energy to maintain such barriers is unimaginable, nonetheless."
 disappear_barrier.1002.a: "Roger."
 disappear_barrier.1003.name: "§BResearch Result§!"
 disappear_barrier.1003.desc: "With extended verification of assumptions and surveying, our scientists have proposed a theory:\n\nThis barrier uses a similar mechanism to that of Lunar Capital. Before the Second Lunar War, Yukari had used a shikigami crow to reach Sea of Tranquility with specific routes; we may be able to calculate the path and use the same logic to send unmanned probes, and then personnel, into the barrier."
 disappear_barrier.1003.a: "It makes sense."
 disappear_barrier.1004.name: "§B失落星域§!"
 disappear_barrier.1004.desc: "在损失了大量的无人探测器后，我们终于规划出了一条可以进入结界内部的路线。科研人员们决定首先派遣无人机去探测，免得对面存在什么危险。\n\n进入后，映入眼帘的是一片布满残骸的星域，其中存在着一颗脉冲星、一颗被护盾屏蔽的星球与一个破碎星球。下一步就该派遣舰船进入、寻找解除结界的方式了。"
 disappear_barrier.1004.a: "Woah."
 disappear_barrier.1005.name: "§B芝麻开门§!"
 disappear_barrier.1005.desc: "After entering the barrier on that shattered planet, our scientists have located the source of the barrier and disabled it. Based on available records, this system is named \"the Union\", previously an important relay for colony ships during the expansion era of Lunar Capital. That shielded planet was once the transit center but is locked down due to security issues. Maybe the data we are looking for is buried beneath the shield."
 disappear_barrier.1005.a: "Interesting."
 disappear_barrier.1006.name: "§BJump Gate§!"
 disappear_barrier.1006.desc: "[This.GetName]在穿越超平面航道后，发现了这个星系的边缘存在着一座被月都称为“星桥”的设施，据信月都依靠此来实现快速的点到点移动。可惜的是这座星桥目前我们无法使用，但科研部门相信他们能调查出其到底通往哪里，甚至解锁星桥。\n\n同时[This.GetName]报告，那颗破碎星球上突然有一个信标亮了起来，或许我们可以以它为调查起始点。"
 disappear_barrier.1006.a: "Roger."
 spth_lunar_union_gateway_disabled: "§BDisabled Jump Gate§!"
 spth_lunar_union_gateway_disabled_desc: "This Lunar Capital jump gate was disconnected from the other side, and we are unable to pass through."
 spth_lunar_union_system: "§Bthe Union§!"
 spth_lunar_union_unlock_shield: "§Bthe Union: disable shield§!"
 spth_lunar_union_unlock_shield_DESC: "我们可以尝试使用这颗星球上的地下设施，来解锁屏障星球之上的护盾。"
 spth_lunar_union_system_desc: "A relay used by Lunar Capital during exodus."
 disappear_barrier.1007.name: "§BAncient fleet§!"
 disappear_barrier.1007.desc: "随着覆盖星球表面的护盾被解除，我们检测到了一股独特的能源信号，同时探测到星球地表上有一只小型舰队正在起飞。我们无论如何呼叫对方都不予理睬...从他们采取的行动上看，似乎来者不善..."
 disappear_barrier.1007.a: "What?"
 spth_lunar_union_fleet_country: "§BGarrison of the Union Jump Gate§!"
 spth_lunar_union_fleet: "§BAncient fleet§!"
 spth_lunar_jumpdrive_gateway: "§BJump Gate§!"
 spth_lunar_jumpdrive_gateway_DESC: "月都可以借助跃迁星桥进行快速旅行，这些巨物的原理我们目前尚且无法解析。\n值得注意的是，跃迁星桥似乎会给通过其的舰船附着一层坚不可摧的防护力场，这使得穿越它的舰船能够免疫潜在的负面效应。"
 lunar_jumpdrive_gateway: "§BJump Gate§!"
 lunar_jumpdrive_gateway_DESC: "A §BJump Gate§! is present in this system"
 spth_lunar_union_unlock_gateway: "§BUnlock Jump Gate§!"
 spth_lunar_union_unlock_gateway_DESC: "结合我们找到的跃迁星桥密钥，尝试解锁月都遗留的跃迁星桥。"
 spth_lunar_jumpdrive_gateway_union: "§BUnion Jump Gate§!"
 spth_lunar_jumpdrive_gateway_aethon: "§BAethon Jump Gate§!"
 spth_lunar_aethon: "§BAethon§!"
 spth_lunar_aethon_desc: "一处月都跃迁星桥能抵达的星域，天文观测表明其衰老的孤独恒星中静静伫立着一座环形装置。"
 spth_lunar_aethon_star: "§B衰老孤星§!"
 spth_lunar_aethon_planet_1: "§MMonument of the Ancient§!"
 spth_lunar_aethon_ring_section: "§BSuper Section§!"
 spth_lunar_aethon_ring_colony: "§BResearch Section§!"
 d_lunar_aethon_ruin: "§RLunar Capital Ruins§!"
 d_lunar_aethon_ruin_desc: "这里存在着月都城市的残骸群，清理完或许能获得些什么东西。"
 disappear_barrier.1010.name: "§BSilent lonestar§!"
 disappear_barrier.1010.desc: "§H[This.GetName]§!穿越了跃迁星桥，经历了其中光怪陆离的景象后，进入了一片古老而衰败的星域。\n\n古老的环形装置静静的环绕着§H[From.GetName]§!中的那颗红巨星，其部分结构受损，但据§H[This.GetName]§!报告称其本身一定程度上仍在运转，甚至还有一个区段明显宜居。在环形装置与红巨星之间的区域分布着大大小小的残骸，这里无数岁月之前似乎爆发过激烈的战斗。\n\n§H[This.GetName]§!建议我们可以从那个环形装置的宜居区段入手，来寻找新的线索。"
 TH_OK: "OK."
