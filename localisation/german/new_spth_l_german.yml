 lunar_capital_psi.110.desc.generic: "§H[Root.GetName]§!附近的太空中出现了一道散发着奇异光芒的传送门，我们的§H[TouhouGetPsionicDepartment]§!根据其灵能印记将其称为“第四淮安通道”。由于这道传送门只是静静地矗立在那里，没有对殖民地造成任何直接威胁，人们很快就习惯了它的存在。\n\n"
 lunar_capital_psi.204.name: ""
 lunar_capital_psi.204.desc: ""
 lunar_capital_psi.205.name: ""
 lunar_capital_psi.205.desc: ""
 situation_lunar_capital_psionic_crisis_stage_0_approach: "无能为力"
 situation_lunar_capital_psionic_crisis_stage_0_approach_tooltip: "目前我们还什么都做不了。"
 situation_lunar_capital_psionic_crisis_stage_0_progress_desc: "局势自然发展"
 purge_touhou_lunar_capital: "净化污秽"
 purge_touhou_lunar_capital_tooltip: "受影响人口会在昏迷中慢慢的失去生命力。"
 purge_touhou_lunar_capital_tooltip_delayed: "§B真实的满月下，一切皆为狂妄的幻想。§!"
 lunar_capital_psi.207.name: "§H[FromFrom.GetName]§!防御成功"
 lunar_capital_psi.207.desc: "在§H[FromFrom.GetName]§!上的战斗最终以我们的胜利告终，纵使来自虚境的入侵者十分强大，给我们带来了惨重的伤亡与难以计数的殖民地损失，但我们的部队还是很好地完成了他们的任务。当地政府开始了殖民地的重建工作，纵使突如其来的攻击为§H[FromFrom.GetName]§!带来了灾难，不过这一切终将被抚平。"
 lunar_capital_psi.208.name: "§H[FromFrom.GetName]§!成功解放"
 lunar_capital_psi.208.desc: "在§H[FromFrom.GetName]§!上的战斗最终以我们的胜利告终，纵使来自虚境的入侵者十分强大，给我们带来了惨重的伤亡，但我们的部队还是很好地完成了他们的任务。当地政府重新接管了殖民地的控制权，纵使突如其来的攻击为§H[FromFrom.GetName]§!带来过灾难，不过这一切终将被抚平。"
 lunar_capital_psi.300.name: "§H[FromFromFrom.GetName]§!陷落"
 lunar_capital_psi.300.desc: "尽管殖民地政府尽了最大努力抵抗月之都升格派对§H[FromFromFrom.GetName]§!的入侵，但这仍然无法从致命的灵能幻象与迷雾中拯救我们的殖民地，苍白色的雾气不可抗拒地席卷了整个§H[FromFromFrom.GetName]§!。直至目前，§H[FromFromFrom.GetName]§!上所有有组织的抵抗均已失败告终，整颗星球与我们的联系已经彻底被切断了，我们难以想象原本的殖民地居民们会遭遇什么样的命运。"
 lunar_capital_psi.300.a: "不好……"
 lunar_capital_psi.300.b: "我们绝对不会放弃§H[FromFromFrom.GetName]§!。"
 lunar_capital_psi.301.name: "§B新的灵力锚点§!"
 lunar_capital_psi.301.desc: "近期我们的天文部门对§H[spth_lunar_capital_psi_sub_gate_3.GetName]§!的天文观测表明这个星系中出现了一个新的小型灵力锚点，来自虚境的能量正在不断的从其中涌出。与之前发现的灵能传送门相同，月之都升格派的灵能舰船正在源源不断的降临，开始对我们的星系发动攻击。我们的[TouhouGetPsionicDepartment]确信他们还能生成更多的灵力锚点，并且在全部的小型锚点被摧毁前，我们都无法进入主锚点所在的星系，我们必须做好应对准备。"
 lunar_capital_psi.301.a: "怎么还有？"
 lunar_capital_psi.302.name: "§B第四锚点§!"
 lunar_capital_psi.302.desc: "正如预测中的一样，§H[spth_lunar_capital_psi_sub_gate_4.GetName]§!中观测到了一座新的灵力锚点的生成过程，现在这个恒星系中出现了第四座小型锚点，作为升格派攻击我们的星系的另一个据点，他们的灵能舰船正在源源不断的降临，开始对我们的星系发动攻击。我们的[TouhouGetPsionicDepartment]发现升格派在生成它的过程中已经快要耗尽形成所需的能量了，因此大概率不会出现新的灵力锚点了。"
 lunar_capital_psi.302.a: "希望这是最后一个了……"
 lunar_capital_psi.303.name: "§G他人摧毁灵力锚点§!"
 lunar_capital_psi.303.desc: "近期天文部门的观测结果显示，§H[touhou_target_country.GetName]§!在与升格派的战斗中，成功压制了升格派的防御舰队，并且用某种方式摧毁了§H[touhou_target_system.GetName]§!中的灵力锚点，这代表着月之都升格派的力量被削弱了。"
 lunar_capital_psi.303.a: "皆大欢喜。"
 lunar_capital_psi.304.name: "§G黎明将至§!"
 lunar_capital_psi.304.desc: "在§H[touhou_target_country.GetName]§!的努力下，银河系内的小型锚点都已经被关闭了，而此前被锁定的跃迁星桥也可以正常使用了。现在我们可以一鼓作气，派遣舰队关闭位于“圣域”的主锚点了。"
 lunar_capital_psi.304.a: "终于要结束了。"
 lunar_capital_psi.305.name: "§G风波平息§!"
 lunar_capital_psi.305.desc: "在§H[touhou_target_country.GetName]§!关闭了锚点之后，月都升格派的灵能舰船再也无法派遣入侵部队了，并且由于切断了与虚境的连接，灵能舰船纷纷如同风中残烛般消逝。乐观估计在数个月内所有的入侵舰队都会消散于现实结构之中，我们赢得了这场战争的胜利。"
 lunar_capital_psi.305.a: "$TH_DAMN_PSI$"
 lunar_capital_psi.306.name: "§R净土世界§!"
 lunar_capital_psi.306.desc: "近期的天文观测报告显示，月之都升格派境内的星球，§H[touhou_target_planet.GetName]§!的表面突然出现了异常的能量反应，并且表面建立起了通往虚境的通道。如果猜测没错的话，升格派将这一星球改造为了净土世界，用于净化污秽的同时，还可以从虚境中源源不断的输送更多的灵能舰船入侵我们的银河系。"
 lunar_capital_psi.306.a: "不好……"
 lunar_capital_psi.307.name: "§G摧毁升格派星球§!"
 lunar_capital_psi.307.desc: "我们的舰队对§H[touhou_target_planet.GetName]§!表面的高强度轨道轰炸成功清除了月之都升格派境内的这颗净土世界。现在他们再也不能通过这里派遣灵能舰船入侵我们的银河系了。这颗星球的地表遭遇了升格派那净化迷雾的严重破坏，但被摧毁的一切仍并非不可恢复，也许我们需要决定如何处理这颗星球。"
 lunar_capital_psi.307.a: "干得漂亮。"
 lunar_capital_psi.308.name: "§G他人摧毁升格派星球§!"
 lunar_capital_psi.308.desc: "§H[touhou_target_country.GetName]§!的舰队最近成功的通过轨道轰炸清除了月之都升格派境内的净土世界，§H[touhou_target_planet.GetName]§!。现在他们再也不能通过这里派遣灵能舰船入侵我们的银河系了。"
 lunar_capital_psi.308.a: "不赖。"
 lunar_capital_psi.309.name: "§R遭遇反击§!"
 lunar_capital_psi.309.desc: "正在轰炸§H[touhou_target_planet.GetName]§!的舰队遭遇了来自升格派地面火力的还击，所幸这些火力的功率只能伤害到我们的护盾与装甲，不会对船体稳定性造成影响。"
 lunar_capital_psi.309.a: "怎么回事……"
 d_touhou_lunar_capital_fog: "§B迷惘之雾§!"
 d_touhou_lunar_capital_fog_desc: "月都留在这颗星球上的净化迷雾，已然成为了生命的禁区。"
 col_lunar_capital_purge: "§B净土世界§!"
 col_lunar_capital_purge_desc: "月都用于净化污秽的星球。"
 lunar_capital_psi.500.prefix.country.bad: "\n\n我们的§H[TouhouGetPsionicDepartment]§!在经过严密调查后，相信这一切和整个星系范围内日益活跃的灵能活动有关，或许要等到异常的灵能环境恢复正常，才不会再次出现这样的事情了。"
 lunar_capital_psi.501.name: "§r研究站：发现泽洛尘§!"
 lunar_capital_psi.501.desc: "我们的一座轨道研究站，§H[Root.GetName]§!报告称在收集的研究样本中发现了一些泽珞尘，不过这并不包含在当地记录在案的稀有资源之中，由于未检测到灵能活动，我们的科学团队无法解释如此大量的泽珞尘的来源，不过我们仍然可以正常的收集这些泽珞尘。"
 lunar_capital_psi.502.name: "§r开采站：发现泽洛尘§!"
 lunar_capital_psi.502.desc: "我们的一座轨道空间站，§H[Root.GetName]§!报告称在最近采集的矿物中发现了一些泽珞尘，不过这并不包含在当地记录在案的稀有资源之中，由于未检测到灵能活动，我们的科学团队无法解释如此大量的泽珞尘的来源，不过我们仍然可以正常的收集这些泽珞尘。"
 lunar_capital_psi.503.name: "§R研究站：化作齑粉§"
 lunar_capital_psi.503.desc: "Root.GetName]§!在进行日常研究时，研究站突然发生了剧烈的爆炸——有人手动引爆了研究站的能源核心，剧烈的爆炸吞噬了整个空间站。我们在事后调查中没能找到研究站的黑匣子，无论研究站上曾经发生了什么，我们可能永远不得而知了。但我们的§H[TouhouGetPsionicDepartment]§!怀疑这一事件和整个星系范围内日益活跃的灵能活动有关，或许要等到异常的灵能环境恢复正常，才不会再次出现这样的事情了。"
 lunar_capital_psi.504.name: "§R开采站：遁入虚空§!"
 lunar_capital_psi.504.desc: "来自§H[Root.solar_system.GetName]§!恒星基地的报告表明当地的开采站——§H[Root.GetName]§!内部出现了某种强烈的灵能活动，随后整个空间站被无法穿透的灵能迷雾包裹长达9小时，期间所有的救援行动均已失败告终，整座开采站没有任何成员生还。\n\n迷雾散去后，只留下一片死寂的虚空和漂浮的少量泽珞尘，无论§H[Root.GetName]§!上曾经发生了什么，我们可能永远不得而知了。"
 lunar_capital_psi.505.name: "§G研究站：产出激增§!"
 lunar_capital_psi.505.desc: "§H[Root.GetName]§!报告称他们的传感器阵列的异常功率激增，我们的科学团队未能准确的查明其原因，但这事实上短暂的提升了§H[Root.GetName]§!的探测能力，从而让我们发现了更多的可研究内容。奇怪的是，之前周密调查都未能检测出这些东西，考虑到它们的显眼性，这只可能是突然间出现的了。"
 lunar_capital_psi.506.name: "§G开采站：产出激增§!"
 lunar_capital_psi.506.desc: "§H[Root.GetName]§!报告称他们的传感器阵列的异常功率激增，我们的科学团队未能准确的查明其原因，但这事实上短暂的提升了§H[Root.GetName]§!的探测能力，从而让我们发现了更多的可开采资源。奇怪的是，之前周密调查都未能检测出这些东西，考虑到它们的显眼性，这只可能是突然间出现的了。"
 lunar_capital_psi.507.name: "§G研究站：发现资源§!"
 lunar_capital_psi.507.desc: "§H[Root.GetName]§!的监测系统记录了传感器阵列于最近因不明原因聚焦于某个特定的方向，并进行了集中的探测，但传感器阵列本身并未出现任何损坏，而§H[Root.GetName]§!的驻站人员也未在程序中发现任何问题。神奇的是，这个我们此前从未注意过的地方居然还存在着一些资源。"
 lunar_capital_psi.508.name: "§G开采站：发现资源§!"
 lunar_capital_psi.508.desc: "$lunar_capital_psi.507.desc$"
 lunar_capital_psi.509.name: "§r实验仪器故障§!"
 lunar_capital_psi.509.desc: "最近，我们境内的一些实验室仪器出现了轻微故障，不过好在这些故障很好修复。意外的是，这些仪器现在运作时居然会给我们带来少量的泽洛尘，代价仅仅是需要额外的进行维护。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.510.name: "§r发现资源§!"
 lunar_capital_psi.510.desc: "在我们境内的一些仓库中，突然多出来了一批资源。在调查团队反复核对出入库清单后，能够确认这些东西没有任何入库记录——这些资源仿佛是凭空出现的一样。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.511.name: "§r空间站受损§!"
 lunar_capital_psi.511.desc: "部分星系传来了报告称空间站上出现了原因不明的“腐蚀”问题，空间站的一些区域会因不明原因损坏，并且相关区域的监控系统同时也会被损坏——没有任何日志记录或者目击报告能够表明损坏出现的原因，事故调查仅能发现破坏活动残留了少量的泽珞尘。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.512.name: "§r舰船受损§!"
 lunar_capital_psi.512.desc: "近期我们星系中愈演愈烈的灵能活动已经开始对[Root.GetName]造成了严重的负面影响。一股怪异的负面能量席卷了[Root.GetName]，所有舰船的装甲都受到了一种怪异的腐蚀，它们的表面遍布怪异的斑点，并且很快就解体了。所幸这股负面能量不会持续太久，目前舰船已经开始了损管维修。"
 lunar_capital_psi.513.name: "§G效率提升§!"
 lunar_capital_psi.513.desc: "我们境内的灵能人口与虚境的联系突然变得更加紧密了，一种来自灵魂深处的宁静与舒适感笼罩了他们，极大的提高了他们的工作效率。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.514.name: "§G灵能强化§!"
 lunar_capital_psi.514.desc: "近期，我们的灵能使们与虚境的联系突然变得更加紧密了，一种来自灵魂深处的宁静与舒适感笼罩了他们，并且改善了他们的灵能能力。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.515.name: "§G事半功倍§!"
 lunar_capital_psi.515.desc: "一些星球上传来报告，人们在进行日常生产活动时，需要消耗的资源突然的变少了。工作流程没有任何变化，其他条件也与之前一致，但维护所需的东西就是比之前减少了。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.516.name: "§G良性效应§!"
 lunar_capital_psi.516.desc: "一些星球上传来报告，殖民地居民近期日常生活的开销变少了，但是他们的生活与工作质量没有任何下降。$lunar_capital_psi.500.prefix.country.good$"
 lunar_capital_psi.517.name: "§R异常开销§!"
 lunar_capital_psi.517.desc: "雪花般的负面报告传来，我们的舰队的关键设备开始大规模出现不明原因的磨损，虽然我们的后勤体系仍然能够确保这种现象不会对舰队的战斗能力造成影响，但是这也会使得我们的舰队的维护成本显著上升。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.518.name: "§R装甲受损§!"
 lunar_capital_psi.518.desc: "雪花般的负面报告传来，我们的舰队的装甲开始大规模出现不明原因的磨损，它们变得比以往更加容易破碎，所有修理和更换装甲的尝试均告失败，只要装甲被安装在舰船上，它们就会立刻受到影响。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.519.name: "§R劣质合金§!"
 lunar_capital_psi.519.desc: "雪花般的负面报告传来，我们的舰队的装甲不知何时变成了一种质检不通过的劣质合金，而采购记录则完全没有记录过这种东西。更诡异的是，即使我们更换了新的装甲也无济于事，只要装甲被安装在舰船上，它们就会立刻变成这种劣质玩意。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.520.name: "§R空间暗影§!"
 lunar_capital_psi.520.desc: "雪花般的负面报告传来，我们的舰队仿佛被某种暗影所笼罩，使得其工作效率大打折扣。目前已经排除了是推进器自身的问题，似乎是舰队附近的空间发生了某种性质的异变，总之我们几乎全部亚光速引擎输出功率都变低了。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.521.name: "§R消极怠工§!"
 lunar_capital_psi.521.desc: "雪花般的负面报告传来，一股忧郁的情绪席卷了整个[Root.GetName]种建设巨型结构相关的工程团队，他们纷纷感受到了某种无法形容的东西，并且既无法对其进行描述，也不清楚它是如何发挥作用的，无论如何，我们巨型结构的建设效率大打折扣了。$lunar_capital_psi.500.prefix.country.bad$"
 lunar_capital_psi.522.name: "§r灵能觉醒§!"
 lunar_capital_psi.522.desc: "最近§H[Root.GetName]§!传来报告，称当地有大量人口于近期展现出了奇怪的超自然能力，他们能够影响其他[Root.Owner.GetSpeciesNamePlural]的心智，使用意念举起重物，以及一些传闻中能使[Root.Owner.GetSpeciesNamePlural]陷入疯狂的能力。\n\n尽管自我们的文明伊始便存在着关于具有特殊能力的[Root.Owner.GetSpeciesNamePlural]的传闻，一些关于灵能者的或真或假的故事，但这次因为不明原因大量涌现的灵能者的规模远超过去的所有记录。\n\n无论导致§H[Root.GetName]§!上大量出现灵能者的原因是什么，这都为§H[Root.GetName]§!带来的一定程度的混乱，§H[Root.GetName]§!的当地政府只能尽力稳定当地的局势。"
 lunar_capital_psi.523.name: "§R星空幽灵§!"
 lunar_capital_psi.523.desc: "§H[Root.GetName]§!传来了损失报告，称舰队内几乎所有的舰船都探测到了某种“幽灵舰队”，尽管同星系内的其他传感器与舰船都未能检测到这种东西的存在。并且无论上级下达什么样的停火指令，这些舰船的船员都拒绝执行，转而向那些“幽灵舰船”开火。\n\n事实证明根本没有什么“幽灵舰队”，我们的武器从始至终攻击的都是自己的舰船，然而这些船员坚信他们攻击的是所谓的幽灵舰队。影像记录显示这些船员当时陷入了某种谵妄的状态，神情呆滞的执行着向友军开火的指令。"
 lunar_capital_psi.524.name: "§R航空引导异常§!"
 lunar_capital_psi.524.desc: "最近§H[Root.GetName]§!传来报告，一艘隶属于该舰队的舰船突然因为不明原因偏离了原轨道，并以不可思议的速度撞击了同舰队的另一艘舰船，两艘舰船在这次惨烈的事故中被毁，没有任何幸存者。\n\n对舰船黑盒子的分析结果表明，原本正常的航空引导指令在这条舰船内被传递成了错误的指令，这才酿成了这一惨剧。我们的§H[TouhouGetPsionicDepartment]§!相信这和整个星系范围内日益活跃的灵能活动有关，也许我们在未来需要更加注意提防异常的灵能环境带来的危害。"
 lunar_capital_psi.525.name: "§H[Root.GetName]§!死亡"
 lunar_capital_psi.525.desc: "近期的报告表明§H[Root.GetName]§!的工作出现了一些意料之外的变化，§H[Root.GetName]§!自身的行为与性格也随之变得诡异。直到在与一位工作人员的争执中，§H[Root.GetName]§!突然陷入了疯狂，拿出实现藏好的武器开始大肆屠杀。在言语劝导无果后，由于我们的非致命性武器对§H[Root.GetName]§!毫无效果，安保部队被迫击毙了§H[Root.GetName]§!。§H[TouhouGetPsionicDepartment]§!与尸检法医的分析报告表明其已经严重受到了星系中变换莫测的灵能环境的影响，这才导致他突然精神失常，做出这一行为。"
 lunar_capital_psi.526.name: "§H[Root.GetName]§!获得灵能能力"
 lunar_capital_psi.526.desc: "近期的报告表明§H[Root.GetName]§!展现出了某种原本不具备的超自然能力，尽管自我们的文明伊始便存在着关于具有特殊能力的[Root.Owner.GetSpeciesNamePlural]的传闻，一些关于灵能者的或真或假的故事，但这还是首次有可信证据的灵能者出现。我们的§H[TouhouGetPsionicDepartment]§!分析后认为这和整个星系范围内日益活跃的灵能活动有关，总之§H[Root.GetName]§!无意间获得了与虚境建立联系的能力。"
 lunar_capital_psi.527.name: "§R护盾失效§!"
 lunar_capital_psi.527.desc: "§H[Root.GetName]§!传来了异常报告，整个舰队内的全部舰船都突然间失去了护盾的保护。尽管检查表明护盾发射器一切正常，但就是无法投射护盾，不管是更换设备还是重启能源管线都无济于事。我们的§H[TouhouGetPsionicDepartment]§!相信这和整个星系范围内日益活跃的灵能活动有关，也许我们在未来需要更加注意提防异常的灵能环境带来的危害。"
