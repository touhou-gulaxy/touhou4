 touhou_fe_union_titan_database_DESC: "解析暗星幻梦上的舰载数据库中的信息，这看起来指向了某个河外星系。"
 touhou_ag_fe_union_lunar_blackhole_area: "§P未知星域§!"
 touhou_ag_fe_union_lunar_blackhole_area_desc: "一处在先祖联盟数据库中欧发现的河外星系坐标。"
 NAME_touhou_lunar_capital_black_hole_system: "§B神舆§!"
