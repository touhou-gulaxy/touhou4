 th_ag_interaction.118.name: "§PLight of Lonely Star Shipboard Database Analyzing§!"
 th_ag_interaction.118.desc: "The Light of Lonely Star shipboard database contains many storage devices constructed using psionic crystals. Although the contents of most devices are unreadable due to the damage of some psionic crystals, [From.GetName] can try to seek for echoes in it using spiritual power."
 th_ag_interaction.118.starlight.desc: "$th_ag_interaction.118.desc$ Then Starlight II will try to analysis the information in these psionic crystals, it will take about a month."
 th_ag_interaction.118.kappa.desc: "$th_ag_interaction.118.desc$ Then Illustelia I will try to analysis the information in these psionic crystals, it will take about a month."
 th_ag_interaction.118.a: "Good idea. Let's move on."
 th_ag_interaction.120.name: "§PLight of Lonely Star Database Analyzing Finished§!"
 th_ag_interaction.120.desc: "我在[From.GetName]的协助下对这些灵能晶体中的信息进行了一系列解码，分批次获取了孤星华光舰载数据库中的部分记录条目。您可以现在去审阅一下内容了。\n\n我们可以访问古代泰坦：孤星华光上舰载数据库的内容。\n$ag_use_actions$"
 th_ag_interaction.120.a: "Great."
 th_ag_interaction.17.name: "§PSpiritual Power Theory Learning§!"
 th_ag_interaction.17.desc: "After a period of calibration, we successfully integrated data about spirit-power theory into Starlight 2. This advanced AI from the Ancient Civilization, has now obtained even greater capabilities."
 th_ag_interaction.18.name: "§PSpiritual Power Theory Learning§!"
 th_ag_interaction.18.desc: "After a period of calibration, we successfully integrated data about spirit-power theory into Illustella 1. This advanced AI from the Ancient Civilization, has now obtained even greater capabilities."
 th_ag_interaction.19.name: "§PSpiritual Power Theory Learning§!"
 th_ag_interaction.19.desc: "With previous practice, we can quickly integrate data about spirit power to other Ancient Civilization AIs."
 th_ag_interaction.ok: "Great."
