 lunar_capital_psi.601.name: "§r$dimensional_horror$被腐化§!"
 lunar_capital_psi.601.desc: "纵使$dimensional_horror$是来自其他位面的访客，其也最终在升格派的灵能活动面前屈服。我们的天文部门观测发现，在升格派轻而易举的摧毁了§H[From.GetName]§!中的$dimensional_horror$后，它已经被重构成了由纯粹的灵能构成的实体$NAME_lunar_capital_corrupted_dimensional_horror$，被月之都所操纵，无差别的攻击周围的一切。"
