 bombardment_spth_kamikakushi_crisis_desc: "The power of the boundary drifted in silence, sweeping away the history and memory of an entire civilization.\n\n- §RMassive§! damage to §YArmies§!\n- §RModerate§! damage to §YPlanet§!\n- Will §Rkill all Pops§!\n- Will bombard undefended planets\n- Will erase the star when all colonies inside the system are destroyed."
