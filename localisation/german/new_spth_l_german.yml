 lunar_capital_psi_psionic_fog: "灵能迷雾"
 lunar_capital_psi_psionic_fog_desc: "接触到这些苍白色的迷雾的生命体，无论有机还是无机，都会慢慢的丧失生命，幸好炮火攻击对这些东西有点效果。"
