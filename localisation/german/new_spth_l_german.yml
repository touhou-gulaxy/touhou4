 spth_precursor.203.desc: "……\n你好，我们是§H隙间之里§!。\n\n你们也许不认识我们，但我们在亿万年前曾经在这片星河，与其他文明共同竞争。\n……\n总之无论如何，暂时不要靠近这里。"
