 touhou_crisis.200.name: "Sudden changes in [spth_precursor_capital_makai_system.GetName]"
 touhou_crisis.200.desc: "After [From.GetName] turned off some subsystems on $spth_makai_wedge_0$ based on the request of $spth_kamikakushi_country$, an immense ray of energy is projected into [spth_precursor_capital_makai_system.GetName].\n\n$spth_makai_wedge_0$ was completely shut down in an explosion."
 touhou_crisis.201.name: "§MSpace Fluctuations§!"
 touhou_crisis.201.desc: "After [From.GetName] rejected the request of $spth_kamikakushi_country$, an immense wave of energy was detected at the location where $spth_kamikakushi_country$ fleets previously originated. We don't know what exactly happened, but one extremely massive object must have jumped to that location and produced huge spacetime fluctuation. We can monitor frequent encrypted tachyon signals since, but we are unable to decrypt them with current technology."
 touhou_crisis.202.name: "§MHyperspace Slipstream§!"
 touhou_crisis.202.desc: "Numerous hyperspace slipstreams have been observed at the previously designated location; they are approaching the edge of this galaxy. ETA 2-3 years."
 touhou_crisis.203.name: "§MInvasion from the Gap§!"
 touhou_crisis.203.desc: "Previously observed hyperspace slipstreams have now entered [last_kamikakushi_invade_system.GetName]. $spth_kamikakushi_country$ deployed the Dimensional Rift Anchor, which is observed to be providing reinforcement rapidly. Further fleets may arrive more frequently."
 touhou_crisis.204.name: "§MDimensional Rift Anchor§!"
 touhou_crisis.204.desc: "A new Dimensional Rift Anchor has been deployed by $spth_kamikakushi_country$ in [last_kamikakushi_invade_system.GetName]."
 touhou_crisis.205.name: "§MDimensional Rift Anchor Destroyed§!"
 touhou_crisis.205.desc: "One Dimensional Rift Anchor was destroyed. $spth_kamikakushi_country$ sustains decreased capability to send reinforcement."
 touhou_crisis.206.name: "§MExtinction of the Stars§!"
 touhou_crisis.206.desc: "After [FromFrom.GetName] bombarded the last colony in [From.GetName], they took an unknown measure and accelerated the evolution of the star. Nothing in that system survived the explosion."
 spth_kamikakushi_invader_titan_1: "§MWarden§!"
 spth_kamikakushi_invader_titan_1_name: "Kind Judgment"
 th_ag_interaction.117.name: "§PSpeciel Project: Hack Eta Area Ancient Station§!"
 th_ag_interaction.117.desc: "They came up with a method that can theoretically crack the ancient security system and stably close the ancient gateway, without relying on and using control symbols to gain access to the ancient station. With the assistance of the Ancient AI and Gensokyo people such as [From.GetName], we can now finish this project in over a month."
 ag_lost_ancient_ship_dialog_kamikakushi.1: "There is such an existence in the void near the Light Flow Spiral Galaxy, why Civilized World had never been aware or even discovered $spth_kamikakushi_country$ before."
 ag_lost_ancient_ship_dialog_kamikakushi.2: "$spth_kamikakushi_country$ and $spth_precursor.makai$? It seems like the history of Core Galaxy is much older than expected."
 ag_lost_ancient_ship_dialog_kamikakushi.3: "The technology to travel across the vast void between galaxies used by $spth_kamikakushi_country$ is weird, seems to be more similar to the dimensional navigation used by Civilized World."
 ag_lost_ancient_ship_dialog_kamikakushi.4: "The ships of $spth_kamikakushi_country$ is unusually numerous, why Civilized World never discovered and wiped these possible threats out?"
 ag_epsilon_titan_leader_dialog_kamikakushi.1: "....... ......\n\nWhat exactly are they......$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.2: "... ...$spth_kamikakushi_country$?... ...\n\n... ...Civilized World... ...has no related information... ...$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.3: "...the civilized world...has gone...\n\n... ...$spth_kamikakushi_country$ can not stop us!... ...$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.4: "... ...These... ...ancient fleets\n\n... ...The database of Civilized World has no matching technology signature... ...$ag_epsilon_titan_leader_dialog_suffix$"
 ag_kappa_computer_dialog_kamikakushi.1: "$spth_kamikakushi_country$... ...Why so numerous."
 ag_kappa_computer_dialog_kamikakushi.2: "$spth_kamikakushi_country$ has no right to harm Core Galaxy!"
 ag_kappa_computer_dialog_kamikakushi.3: "Most technologies of $spth_kamikakushi_country$, I have never seen."
 ag_kappa_computer_dialog_kamikakushi.4: "We must stop $spth_kamikakushi_country$!"
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.1: "It's a shame I can't personally operate the warship to destroy these extra galactic invaders."
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.2: "Computing resources have been allocated to logistics, and we need more ships."
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.3: "The fleets of $spth_kamikakushi_country$ is unusually large. Hopefully our preparations will get us through this."
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.4: "[Root.GetName] needs to gather every forces to prevent $spth_kamikakushi_country$ from destroying Galaxy."
 spth_adv_spiritual_shield: "Barrier-enhanced Warp Shield"
 spth_adv_spiritual_armor: "Spirit Power Phasing Neutronium Armor"
 spth_adv_barrier_shield: "Advanced Spirit Power Protection Barrier"
 spth_adv_spiritual_shield_desc: "Greatly benefiting from the Warp Shield technology, the Spirit Power Barrier Shield can deflect enemy attacks to a special entropic dimension, enabling it to take more damage without malfunction."
 spth_adv_spiritual_armor_desc: "Upgrading Activated Neutronium Armor based on ancient technology. It now performs better against damage, while also improving hull stability."
 spth_adv_barrier_shield_desc: "Modified from Warp Shield, the $th_shield_jiejie2$ can absorb energy via entropic dimension. Additionally, it improves defense capabilities by creating a barrier on the armor's surface."
