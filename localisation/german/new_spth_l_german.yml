 bombardment_touhou_firesupport: "Targeted Elimination"
 bombardment_touhou_firesupport_desc: "By guiding artillery with spirit power and adjusting weapon parameters such as power output and mode, Gensokyo fleets can perform surgical strikes on populations without significant collateral damage to the planet itself.\n\n- §YAllows Orbital Bombardment§! even when there's ongoing §Yground combat§!\n- §YLethal§! damage to §RArmies§!\n- §YLight§! damage to §RPlanet§!\n- §YUnimaginable§! damage to §RPops§!\n- Will gradually §Rkill all £pops£Pops§!\n- Will bombard undefended planets "
 concept_bombardment_touhou_firesupport: "$bombardment_touhou_firesupport$"
 concept_bombardment_touhou_firesupport_desc: "$bombardment_touhou_firesupport_desc$"
 bombardment_touhou_ground_land: "Orbital Planet Assault"
 bombardment_touhou_ground_land_desc: "The \"Orbital Drop Shock Trooper (ODST)\", composed of both youkai and fairy forces, is deployed by orbital drop pods. These elite troops are able to acquire fire support from ships in orbit and rapid response fighters through tactical terminals. Such advantages will enable quick routs of hostile defense armies in ground battles.\n\n- §YAllows Orbital Bombardment§! even when there's ongoing §Yground combat§!\n- §YSevere§! damage to §RArmies§!\n- §YLight§! damage to §RPlanet§!\n- Will deploy §Ya considerable amount§! of assault armies during bombardment\n- Will bombard undefended planets "
 bombardment_touhou_ground_land_unlock: "Enables §Y$bombardment_touhou_ground_land$§! Orbital Bombardment stance"
 bombardment_touhou_ground_land_unlock_desc: "$bombardment_touhou_ground_land_desc$"
 bombardment_touhou_destroy_planet: "Spirit Power Barrage"
 bombardment_touhou_destroy_planet_desc: "Spirit-power weapons dedicated for orbital bombardment will cause significant damage over the planet. Such bombardment orders are only issued when a complete destruction of the enemy colony, and occasionally the planet as well, is desired.\n\n- §YLethal§! damage to §RArmies§!\n- §YUnimaginable§! damage to §RPlanet§!\n- §YUnimaginable§! damage to §RPops§!\n- Will bombard undefended planets\n- Killing §Yall £pop£Pops§! on the world will cause the colony to be §Yabandoned§!\n- Allows §Rcomplete destruction§! of the planet and turns it into §Y$pc_broken$§!."
 bombardment_touhou_destroy_planet_unlock: "Enables §Y$bombardment_touhou_destroy_planet$§! Orbital Bombardment stance"
 bombardment_touhou_destroy_planet_unlock_desc: "$bombardment_touhou_destroy_planet_desc$"
 tech_bombardment_touhou_ground_land: "Orbital Planet Assault"
 tech_bombardment_touhou_ground_land_desc: "The \"Orbital Drop Shock Trooper (ODST)\", composed of both youkai and fairy forces, is deployed by orbital drop pods onto enemy worlds under the cover of ally fleets. A four-man squad of youkai is responsible for calling down orbital strikes, while the fairy chapter splits up to lay siege on enemy forces."
 tech_bombardment_touhou_destroy_planet: "Orbital BDZ Barrage"
 tech_bombardment_touhou_destroy_planet_desc: "Different from conventional orbital bombardment, this type focuses on destroying the planet through maximizing fleet bombardment. With dedicated weapons for devastating bombing, it can melt the surface of an entire planet, reduce continents to atoms, and then strip it out of a planet."
 spth_fleet.108.name: "Determine the destiny of §H[From.GetName]§!"
 spth_fleet.108.desc: "Under the relentless orbital bombardment of our fleet’s §Yspiritual weapons and spell cards§!, the crust of §H[From.GetName]§! has been critically destabilized. A rift straight into the planet's core has been forced open: one that allows direct strikes against the core, causing agitation and splitting the planet open.\n\nThe planet’s fate is now ours to decide: shall we merely eliminate all populations, melt the crust into a magma ocean, or deliver high-yield spell cards into the core to destroy the planet?"
 spth_fleet.108.a: "Let's put a definitive end to §H[From.GetName]§!."
 spth_fleet.108.b: "Incinerate the surface of §H[From.GetName]§!"
 spth_fleet.108.c: "Remove all population on §H[From.GetName]§!"
 spth_fleet.108.a.tooltip: "§RThis will agitate the core of §H[From.GetName]§!, turning it into §Y$pc_broken$§!.§!"
 spth_fleet.108.b.tooltip: "§RThis will scorch the surface of §H[From.GetName]§! turning it into §Y$pc_molten$§! or §Y$pc_desert$§!.§!"
 spth_fleet.108.c.tooltip: "§RThis will purge all pops on §H[From.GetName]§!, turning it into §Y$pc_nuked$§!.§!"
 spth_fleet.108.d: "No, this world holds more value."
