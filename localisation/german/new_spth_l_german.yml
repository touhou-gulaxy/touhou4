 spth_precursor_makai_network_system_planet: "§MTerminus§!"
 spth_precursor.50.name: "§MAncient Beacon§!"
 spth_precursor.50.desc: "A strange tachyon signal was monitored from a previously empty position. Based on observations of the astronomy department, a massive gravitational source suddenly appeared there. No trace of stars or black holes was found.\n\nScientists deduced from residual radiation that, this system entered our universe from the Makai plane via unknown methods. We should investigate it."
 spth_precursor.51.name: "[From.GetName] discovered a new system"
 spth_precursor.51.desc: "Our intelligence department has concluded that the increased activity in [From.GetName]'s astronomy department is due to the discovery of a new system: [spth_precursor_makai_network_system.GetName].\n\nTo our surprise, it's neither on our starmap."
 spth_precursor.52.name: "§MBizarre System§!"
 spth_precursor.52.desc: "§H[This.GetName]§! immediately noticed the abnormal phenomenon that surrounded here upon arrival.\n\nSeems like all the celestial bodies and strange ring-shaped constructs are orbiting the giant habitable planet at the center of this system, and the Ring World within gives a feeling of... unreal. According to the survey, it exists in two different dimensions at the same time.\nSoon, our sensor determined the source of the signal: the barycenter of this system; in other words, the giant habitable planet.\n\n§RWe should colonize it to perform further investigation.§!"
 spth_precursor.54.name: "§MAncient Ruin§!"
 spth_precursor.54.desc: "As the colonization work goes, our colonists found an extensive research complex beneath the surface of [spth_precursor_makai_alice_arc.GetName], unmistakably built in the style of $spth_precursor.makai$.\n\nFacility records indicate that this system once served as a site where $spth_precursor.makai$ developed their Astral Conduit technology. They succeeded in establishing a fully operational Astral Conduit Network, enabling rapid travel between planes and star systems.\n\nBy the time $spth_precursor.makai$ collapsed, this facility was already abandoned. Until then, for reasons unknown, it descended into our plane.\n\nThe locked Gateway inside the system is in fact one of the primary nodes of the Astral Conduit Network. Beyond that, the research facility preserved a substantial amount of $spth_precursor.makai$ research data, enough for us to attempt repairs on the node.\nIf successful, the Astral Conduit Network may once again be activated--and brought under our control."
 spth_precursor_makai_network_repair: "修复星界网络节点"
 spth_precursor_makai_network_repair_DESC: "$tech_touhou_gateway_network_master_node_unlock_shield_desc$同时对魔界遗留的资料加以研究，之后我们就可以开始着手修复工作了。"
 spth_precursor.55.name: "§M研究完成§!"
 spth_precursor.55.desc: "我们的科研团队已经完成了对覆盖于星界网络节点上的结界护盾的初步破解，并且完成了对魔界遗留数据的解析。\n\n我们可以准备进行修复工作了。"
