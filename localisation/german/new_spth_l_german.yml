 spth_precursor.1.a: "Good"
 spth_precursor.2.name: "§MStrange System§!"
 spth_precursor.2.desc: "[This.GetName]一进入星系，发现这里被一股异常的环境现象所笼罩。其中的环形世界充满了虚幻的感觉，根据探测其似乎同时存在于两个位面之中，而中央的恒星也变为了由灵力驱动反应的怪异天体。很快，我们的传感器分辨出了信号的来源——这个星系中的一颗宜居星球。\n\n§R或许我们应该在[spth_precursor_makai_alice_arc.GetName]上面进行殖民来展开进一步调查。§!"
