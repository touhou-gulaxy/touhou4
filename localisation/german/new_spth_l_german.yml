 touhou_kamikakushi_super_shipyard: "隙间铸造厂"
 touhou_kamikakushi_super_shipyard_DESC: "$spth_kamikakushi_country$部署在星系中的巨型舰船生产设施，能够以令人恐惧的速度建造舰船。只要这一设施存在，他就能让$spth_kamikakushi_country$的舰船增援速度大大提高。"
 touhou_kamikakushi_super_shipyard_MEGASTRUCTURE_DETAILS: "$spth_kamikakushi_country$部署在星系中的巨型舰船生产设施，能够以令人恐惧的速度建造舰船。只要这一设施存在，他就能让$spth_kamikakushi_country$的舰船增援速度大大提高。"
 touhou_crisis.301.name: "§M隙间铸造厂§!"
 touhou_crisis.301.desc: "我们的天文部门最近在§H[spth_kamikaushi_crisis_super_shipyard_base_system]§!附近检测到了巨大的引力波动，某种巨大的物体出现在了那里，如果观测结果正确的话，$spth_kamikakushi_country$将整个被他们称为§H幻想造碑§!的星系通过隙间从某个河外星系跃迁到了我们的银河之中，随之出现的是大量$spth_kamikakushi_country$舰队的跃迁痕迹。\n\n调查显示，围绕在§H幻想造碑§!恒星附近的是一座巨型舰船生产设施，§M隙间铸造厂§!。目前这座设施正在令人恐惧的速度生产着$spth_kamikakushi_country$的军用太空舰队，如果我们不摧毁或者夺取这一巨型结构，这些自动舰队将会给我们带来巨大的麻烦。"
 touhou_crisis.301.a: "我去，这是什么鬼东西？"
