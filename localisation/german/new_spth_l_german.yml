 SPTH_COUNTRY_AWAKEN_EMPIRE_DESC: "$SPTH_COUNTRY_AWAKEN_EMPIRE$是从衰落中重新崛起的帝国，他们此前是无数岁月之前就已经存在的庞大帝国的最后遗存，甚至极有可能是第一批文明，虽然他们已不复往昔，但是他们仍然持有着及其先进的科技。"
