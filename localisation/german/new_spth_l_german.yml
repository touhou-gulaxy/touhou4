 lunar_capital_psi.400.name: "§r诡异森林§!"
 lunar_capital_psi.400.prefix: "近期，§H[Root.GetName]§!传来报告，在不知道什么时刻，星球上有一小片区域突然被一道结界笼罩，从外部无法用任何手段观测到里面发生了什么，内外的任何通信也完全失效了。与此同时，这道结界的覆盖范围还在不断地扩大，当地政府在事态发展得更为严重前迅速组织了撤离，才没能造成更大的伤亡。\n\n随后的数天内，这道结界的扩散逐渐缓慢乃至趋近于停止，目前仍不知道这是否和当地政府尝试采取的灵能阻断措施有关。所有穿越结界的尝试均以失败告终，直到§H[Root.GetName]§!传来报告的时间，结界开始缩小乃至消散，暴露出曾经被它覆盖的区域为止。无论被浓雾覆盖的区域曾经如何繁荣，如今，都已经什么也不剩了，除了"
 lunar_capital_psi.400.desc: "$lunar_capital_psi.400.prefix$一片弥漫着紫色与白色武器的诡异森林。§H[TouhouGetPsionicDepartment]§!的研究报告表明那片森林内部危机四伏，进入其中的任何生命体甚至机械都有失去理性乃至生命力的风险，这片区域俨然成为了一片生命禁区。"
 lunar_capital_psi.401.name: "§r沼泽瘴气§!"
 lunar_capital_psi.401.desc: "$lunar_capital_psi.400.prefix$一片氤氲着瘴气的沼泽。§H[TouhouGetPsionicDepartment]§!的研究报告表明在这些沼泽存在着某种东西，会使得进入其中的机器与生命体逐渐陷入幻觉，出去后很长一段时间都无法恢复正常，这片区域俨然成为了一片生命禁区。"
 lunar_capital_psi.402.name: "§r地质变动§!"
 lunar_capital_psi.402.desc: "$lunar_capital_psi.400.prefix$一片笼罩在紫色迷雾中的山脉。伴随着这些诡异雾气的是一些诡异的闪光或者声音的目击报告，以及有关§H[Root.Owner.Species.GetName]§!游客在群山中失踪的报告，并且周围的居民还时不时能听到使§H[Root.Owner.Species.GetName]§!感到疯狂的低语。\n\n由于我们派遣的任何调查团队甚至无人机，在进入后都彻底的失去联系，§H[Root.GetName]§!的科学团队认为仅靠当地的力量已经无法解决这一问题，考虑到受山脉影响的区域正在缓慢地扩大，§H[Root.GetName]§!的政府请求我们提供更有效的灵能抑制设备来清理这座§H疯狂山脉§!。"
 lunar_capital_psi.403.name: "§r新生火山§!"
 lunar_capital_psi.403.desc: "$lunar_capital_psi.400.prefix$一座火山。这座火山最奇特的是，其似乎不直接与任何地质结构连接，其中喷薄的岩浆也发生了诡异的变化，变成了一种会散发出迷幻气体的高温溶液。生命体甚至机械在接触到这种气体之后就会陷入一直迷惘的状态，如果持续暴露甚至会逐渐变得无法行动乃至死亡。\n\n如果它仅是这样的话划定隔离区就行了，不幸的是，这并不是一起可以忽视的事件，因为伴随着突然出现的岩层裂隙，一些“岩浆”开始慢慢的流下，这无疑会对周边居民造成灾难性的影响。由于这种“岩浆”还会侵蚀我们已知的所有建筑材料，目前，殖民地政府只能选择疏散可能受到影响的区域，但这只是权宜之计。"
 lunar_capital_psi.404.name: "§r地层沉降§!"
 lunar_capital_psi.404.desc: "$lunar_capital_psi.400.prefix$一片无底深渊。§H[Root.GetName]§!的报告表明，这处坑洞似乎深不见底，任何试图前往其“底部”的仪器都消失不见了。由于其内部扩散出了某种有着月之都特征的灵能活动模式，周边很大一片范围内的生命体都在一个晚上后完全消失了，即使是微生物也未能幸免。\n\n任何尝试进入的活物都会被一股无形的力场逐渐抹除，为此，§H[Root.GetName]§!的政府请求我们提供更有效的灵能抑制设备来尝试压制这种灵能活动模式。"
 lunar_capital_psi.405.name: "§r活沙§!"
 lunar_capital_psi.405.desc: "$lunar_capital_psi.400.prefix$一片沙地。起初§H[Root.GetName]§!上的人们认为这是在不普通不过的沙子，但渐渐的前往其中的部分游客再也没有回来过。当地政府组织的调查团队发现这些“沙子”实际上是活着的，在特定时刻、特定区域的部分沙子会“活过来”捕捉附近的活物，这一过程连合成人与微生物都无法幸免。哪怕是炮火与战舰的火力也完全无法摧毁这些诡异的活沙，这片区域俨然成为了一片生命禁区。"
 lunar_capital_psi.406.name: "§r雾中冰川§!"
 lunar_capital_psi.406.desc: "$lunar_capital_psi.400.prefix$那个刚出现的冰川。乍一看这些冰块似乎和普通的冰川别无二致，除了——它几乎无法自然融化。\n\n目前这片区域还在向外扩大，当地政府采取过一些措施阻止冰川的生成乃至消融冰川，但所有努力均以失败告终，他们甚至无法控制其扩张的速度。"
 lunar_capital_psi.407.name: "§r虚境石被腐化§!"
 lunar_capital_psi.407.desc: "近期，§H[Root.GetName]§!传来报告，在不知道什么时刻，星球上原本存在的虚境石被一道结界所覆盖，从外部无法用任何手段观测到里面发生了什么，内外的任何通信也完全失效了。与此同时，这道结界的覆盖范围还在不断地扩大，当地政府在事态发展得更为严重前迅速组织了撤离，才没能造成更大的伤亡。\n\n随后的数天内，这道结界的扩散逐渐缓慢乃至趋近于停止，目前仍不知道这是否和当地政府尝试采取的灵能阻断措施有关。所有穿越结界的尝试均以失败告终，直到§H[Root.GetName]§!传来报告的时间，结界开始缩小乃至消散，暴露出曾经被它覆盖的区域为止。\n\n原先的那些虚境石变成了一些漂浮在空中的诡异紫色石头，并且还会向靠近的活物发射弹幕与灵能闪电。"
 lunar_capital_psi.408.name: "§r堕落之城§!"
 lunar_capital_psi.408.desc: "§H[Root.GetName]§!传来了一份令人不安的报告，当地的一座城市的氛围正在变得越来越诡异，其中的居民变得不愿与外人接触，执着于某些灵能相关的理论和实践，并且很乐于在与外人的冲突中使用那些不成熟的危险灵能技术。试图进入其中的调查队伍要么是被消灭了，要么就是在思想上被同化。并且这座城市的存在似乎使得其他地区的人们变得焦躁易怒，整座星球的犯罪率大大增加。\n\n当地政府尝试过派遣军队进行反恐，然而覆盖在其周围的一层透明结界阻隔了他们，并且无法使用任何手段破坏。§H[Root.GetName]§!上常规的执法力量已经无法应对这种情况，只有动用非常手段才能彻底解决那座堕落之城内的问题。"
 lunar_capital_psi.409.name: "§r微光植物§!"
 lunar_capital_psi.409.desc: "$lunar_capital_psi.400.prefix$一大片由发光植物构成的花海。起初这些植物一切正常，并且似乎还可以用于农业用途，然而在某个时期这些植物会一起开花，伴随着美丽的白色花簇的是未知粒子导致的辐射，被这一辐射沾染到的生物会发生基因层面的重组，变成形似兔子但是充满攻击性的生物，覆盖在这些辐射生物表面的厚重硅化层甚至可以抵御重型火力的直射。\n\n更难缠的是这些植物极难根除，这一大片区域已经彻底被这些洁白的花海污染而无法使用了。"
 lunar_capital_psi.410.name: "§r苔藓蔓生§!"
 lunar_capital_psi.410.desc: "$lunar_capital_psi.400.prefix$那些覆盖在碎石与瓦砾上的微光苔藓。这些苔藓在§H[Root.GetName]§!上大量蔓延，没人知道这种神秘的植物究竟从何而来，是以什么方式传播的。目前我们可以确认那些诡异的苔藓不会直接伤害§H[Root.Owner.Species.GetName]§!，但它们会覆盖农田、道路、建筑外墙上，并且会散发出一种令人迷幻的气体。这种气体似乎不会直接作用于我们的身体，而是让我们脑海中突然出现一种感觉。当地政府还发现这些苔藓还极难清除，并且重新生长出来的苔藓会散发出更多的气体。"
 lunar_capital_psi.411.name: "§r低语之墙§!"
 lunar_capital_psi.411.desc: "$lunar_capital_psi.400.prefix$刚刚出现的一堆整洁墙体。这些墙体矗立在那里，使得任何凝视其的人都能听到来自灵魂深处的低语，从而变得具有暴力倾向。到后来甚至发展到了一旦通过任何载体——照片、视频等——认知到这些墙体就会变得极度烦躁。当地政府在加派警力控制犯罪蔓延的同时，正在尝试清理这些墙体，但收效甚微。"
 lunar_capital_psi.412.name: "§r死亡荒原§!"
 lunar_capital_psi.412.desc: "$lunar_capital_psi.400.prefix$那些薄薄的白色物质。这些白色物质覆盖在地表，形成了一片巨大的平原。经过化验分析，当地政府得出了一个令人毛骨悚然的结论——这些东西都是§H[Root.Owner.Species.GetName]§!的燃烧残骸，或者说骨灰。随着气象运动，这些白色物质还会形成粉尘，随风运动，任何吸入这些物质的人都会变得浑浑噩噩，并且开始从潜意识里认为自己应该效忠于月之都。一些地区甚至出现了打着“清除污秽”口号的献祭仪式，当地政府目前已经难以控制局势了。"
 lunar_capital_psi.413.name: "§r神秘雕像§!"
 lunar_capital_psi.413.desc: "$lunar_capital_psi.400.prefix$一群神秘雕像。起初人们毫不在意，直到这些空心雕像的眼中开始流出透明的液体。当地的科学团队检查了整个雕像，实心的雕像内部没有任何管道，也没有渗水的迹象，但液体就是会凭空出现，并且这些液体还会使得附近的§H[Root.Owner.Species.GetName]§!感到心烦意乱，工作效率大打折扣。"
 lunar_capital_psi.414.name: "§r局部低温§!"
 lunar_capital_psi.414.desc: "近期，§H[Root.GetName]§!传来报告，在不知道什么时刻，星球上有一小片区域突然被一道结界笼罩，从外部无法用任何手段观测到里面发生了什么，内外的任何通信也完全失效了。与此同时，这道结界的覆盖范围还在不断地扩大，当地政府在事态发展得更为严重前迅速组织了撤离，才没能造成更大的伤亡。\n\n随后的数天内，这道结界的扩散逐渐缓慢乃至趋近于停止，目前仍不知道这是否和当地政府尝试采取的灵能阻断措施有关。所有穿越结界的尝试均以失败告终，直到§H[Root.GetName]§!传来报告的时间，结界开始缩小乃至消散，暴露出曾经被它覆盖的区域为止。最初这片区域的建筑使用起来一切正常，但是部分区域的管道会毫无缘由地结霜，即使周围的环境非常炎热也无法阻止这种现象，这使得我们基础设施的运转效率大打折扣了。"
 lunar_capital_psi.415.name: "§r突然出现的房间§!"
 lunar_capital_psi.415.desc: "近期，§H[Root.GetName]§!传来报告，在不知道什么时刻，星球上有一小片区域突然被一道结界笼罩，从外部无法用任何手段观测到里面发生了什么，内外的任何通信也完全失效了。与此同时，这道结界的覆盖范围还在不断地扩大，当地政府在事态发展得更为严重前迅速组织了撤离，才没能造成更大的伤亡。\n\n随后的数天内，这道结界的扩散逐渐缓慢乃至趋近于停止，目前仍不知道这是否和当地政府尝试采取的灵能阻断措施有关。所有穿越结界的尝试均以失败告终，直到§H[Root.GetName]§!传来报告的时间，结界开始缩小乃至消散，暴露出曾经被它覆盖的区域为止。这些区域看似正常，然而部分建筑物中出现了此前从未设计的房间，并且所有的建筑图纸也在一夜之间被修改了，当初的工程师们也不知道为什么会存在这些东西。处于这些房间内部的§H[Root.Owner.Species.GetName]§!会感到有什么东西在向自己灌输各种末日言论，并且他们往往会在低语的指引下做出许多危险的举动。初步测试表明只要摧毁这些建筑，并且销毁设计图纸，就不会再出现这种情况，但是这将带来巨大的重建成本。"
 lunar_capital_psi.416.name: "§r迷雾水域§!"
 lunar_capital_psi.416.desc: "$lunar_capital_psi.400.prefix$一片散发着诡异的光芒的水域。§H[TouhouGetPsionicDepartment]§!的研究报告表明，这片区域中的动物完全消失了，而剩下的植物与微生物会对进入水体中的活物发动无差别攻击。"
 lunar_capital_psi.417.name: "§r攻击性野生动物§!"
 lunar_capital_psi.417.desc: "近期，§H[Root.GetName]§!传来报告，在不知道什么时刻，星球上有一小片区域突然被一道结界笼罩，从外部无法用任何手段观测到里面发生了什么，内外的任何通信也完全失效了。与此同时，这道结界的覆盖范围还在不断地扩大，当地政府在事态发展得更为严重前迅速组织了撤离，才没能造成更大的伤亡。\n\n随后的数天内，这道结界的扩散逐渐缓慢乃至趋近于停止，目前仍不知道这是否和当地政府尝试采取的灵能阻断措施有关。所有穿越结界的尝试均以失败告终，直到§H[Root.GetName]§!传来报告的时间，结界开始缩小乃至消散，暴露出曾经被它覆盖的区域为止。这片区域内部的野生动物变得焦躁易怒且极具攻击性，且身体机能也得到了大幅强化——更聪明，力量更强，更不容易被杀死。甚至有部分动物还获得了灵能跃迁的能力，开始突破封锁并且攻击其他地区的§H[Root.Owner.Species.GetName]§!。"
 lunar_capital_psi.418.name: "§r暮色植被§!"
 lunar_capital_psi.418.desc: "$lunar_capital_psi.400.prefix$一片植被。与常规的植被不同，这些植被似乎完全失去了色彩的概念，变得黑白的同时也会让陷入其中的物体变得黑白。考虑到这些植物还在通过孢子向外扩张，当地政府不得不花费大力气来彻底根除这些诡异的玩意。"
 lunar_capital_psi.400.a: "我们必须要清理这片区域。"
 lunar_capital_psi.500.name: "§G灵能链接§!"
 lunar_capital_psi.500.desc: "近期，我们的灵能使们举行灵潜仪式需要的时间极大的缩短了，总而言之，我们可以更加容易接触虚境了。$lunar_capital_psi.500.prefix.country.good$"
 touhou_lunar_capital_psi_crisis_buff_shroud_link: "§G灵能链接§!"
 touhou_lunar_capital_psi_crisis_buff_shroud_link_desc: "活跃的灵能环境使得我们更加容易接触虚境。"
 touhou_lunar_capital_psi_crisis_buff_workforce_1: "§G效率提升§!"
 touhou_lunar_capital_psi_crisis_buff_workforce_1_desc: "活跃的灵能环境提升了灵能人口的工作效率。"
 touhou_lunar_capital_psi_crisis_buff_workforce_2: "§G灵能思维§!"
 touhou_lunar_capital_psi_crisis_buff_workforce_2_desc: "活跃的灵能环境提升了灵能使的工作效率。"
 touhou_lunar_capital_psi_crisis_buff_workforce_3: "§G事半功倍§!"
 touhou_lunar_capital_psi_crisis_buff_workforce_3_desc: "活跃的灵能环境少量减少了我们需要的维护费。"
 touhou_lunar_capital_psi_crisis_buff_workforce_4: "§G良性效应§!"
 touhou_lunar_capital_psi_crisis_buff_workforce_4_desc: "活跃的灵能环境少量减少了我们的人口维护。"
 touhou_lunar_capital_psi_crisis_debuff_fleet_upkeep: "§R异常开销§!"
 touhou_lunar_capital_psi_crisis_debuff_fleet_upkeep_desc: "我们舰队的关键资源维护异常的增加了。"
 touhou_lunar_capital_psi_crisis_debuff_armor_loss: "§R装甲受损§!"
 touhou_lunar_capital_psi_crisis_debuff_armor_loss_desc: "我们的舰队意外的受到了装甲损伤。"
 touhou_lunar_capital_psi_crisis_debuff_armor_unless: "§R劣质合金§!"
 touhou_lunar_capital_psi_crisis_debuff_armor_unless_desc: "我们舰队使用的合金仿佛突然变得劣质了，影响了装甲的可靠性。"
 touhou_lunar_capital_psi_crisis_debuff_speed_loss: "§R空间暗影§!"
 touhou_lunar_capital_psi_crisis_debuff_speed_loss_desc: "一片空间暗影笼罩在星间，降低了我们推进器的工作效率。"
 touhou_lunar_capital_psi_crisis_debuff_megastructure: "§R巨构建设效率下降§!"
 touhou_lunar_capital_psi_crisis_debuff_megastructure_desc: "不知为何，工人们和机器都突然开始消极怠工。"
 lunar_capital_psionic_avatar: "灵能实体"
 lunar_capital_psionic_avatar_cap: "$lunar_capital_psionic_avatar$"
 lunar_capital_psionic_avatar_plural: "$lunar_capital_psionic_avatar$"
 lunar_capital_psionic_avatar_section: "虚境意志"
 NAME_lunar_capital_psionic_avatar: "§M月都化身§!"
 situation_lunar_capital_psionic_crisis_stage_0: "§M虚境入侵§!"
 situation_lunar_capital_psionic_crisis_stage_0_type: "$situation_lunar_capital_psionic_crisis_stage_0$"
 situation_lunar_capital_psionic_crisis_stage_0_desc: "当年月之都中的升格派，成功地进入了深层虚境之中，它们的思想远比月之都更加激进，试图毁灭一切沾染了所谓“污秽”的存在。\n\n现在距离升格派的舰队来到现实宇宙还需要一段时间，在此期间它们会借由虚境的力量向我们发动攻击，而我们需要进行防御的同时做好应对入侵的准备。"
 touhou_lunar_capital_psi_crisis_eternal_night: "永夜异变"
 touhou_lunar_capital_psi_crisis_eternal_night_desc: "整颗星球上都出现了异象——进入夜晚之后，太阳不再升起，仿佛世界进入了永夜。"
 touhou_lunar_capital_psi_crisis_marked: "§B第四淮安通道§!"
 touhou_lunar_capital_psi_crisis_marked_desc: "一道明显有着月之都特征的传送门在这颗星球上展开了，其中溢出着深层虚境的灵能……\n\n§M也许这里会发生什么不好的事情。§!"
 d_touhou_corrupted_aura_blocker: "£blocker£ §B空灵植被§!"
 d_touhou_corrupted_aura_blocker_desc: "这片曾经是虚境植物的地方散发着不祥的气息，进入其中的人们会感到发自内心的恐惧。"
 d_touhou_corrupted_wildlives:0 "£blocker£ §B腐化动物§!"
 d_touhou_corrupted_wildlives_desc:0 "受灵能侵蚀的野生动物变得焦躁易怒且极具攻击性，且比以往更加难以杀死，为此我们不得不抽调额外的安保部队进行防卫。"
 d_touhou_corrupted_kelp:0 "£blocker£ §r诡异水域§!"
 d_touhou_corrupted_kelp_desc:0 "月之都的力量使得这片水域变成了没有任何动物存在的诡异月海，其中的植物甚至水本身都在散发着诡异的气息。"
 d_touhou_corrupted_swamp:0 "£blocker£ §r暮光沼泽§!"
 d_touhou_corrupted_swamp_desc:0 "这片沼泽中闪烁着诡异的光芒。"
 d_touhou_corrupted_mountain:0 "£blocker£ §r疯狂山脉§!"
 d_touhou_corrupted_mountain_desc:0 "令人失去理智的疯狂山脉。"
 d_touhou_corrupted_volcano:0 "£blocker£ §r沉寂火山§!"
 d_touhou_corrupted_volcano_desc:0 "这座火山看似沉寂，但是会流出诡异的灵能液体。"
 d_touhou_corrupted_sinkhole:0 "£blocker£ §r无底深渊§!"
 d_touhou_corrupted_sinkhole_desc:0 "深不见底，诡异至极。"
 d_touhou_corrupted_quicksand:0 "£blocker£ §r活沙盆地§!"
 d_touhou_corrupted_quicksand_desc:0 "这些沙子仿佛活过来了一样，会吞噬靠近它的生命体。"
 d_touhou_corrupted_glacier:0 "£blocker£ §r不详冰川§!"
 d_touhou_corrupted_glacier_desc:0 "这片冰川不断的向周围扩张，并且几乎不会融化。"
 d_touhou_corrupted_city_ruins:0 "£blocker£ §r堕落城市§!"
 d_touhou_corrupted_city_ruins_desc:0 "这座城市因长期受到灵能侵蚀而被腐化了。"
 d_touhou_corrupted_corps:0 "§r荧光作物§!"
 d_touhou_corrupted_corps_desc:0 "这颗星球上快速生长的荧光植物看起来可以被用于农业用途，但是不知道其到底是否安全……"
 d_touhou_corrupted_corps_clear: "有一定概率无法被清除，或者额外增长为两块$d_touhou_corrupted_corps$。"
 d_touhou_corrupted_moss:0 "£blocker£ §r微光苔藓§!"
 d_touhou_corrupted_moss_desc:0 "这些苔藓不知道从何处开始生长的，仿佛是从什么地方突然出现的，难以根除的同时其清除“污秽”的过程还会令人极度不适。每当我们尝试清除时这一效应都会进一步放大。"
 d_touhou_corrupted_wall:0 "£blocker£ §r低语之墙§!"
 d_touhou_corrupted_wall_desc:0 "墙中传来阵阵低语，令人着迷。"
 d_touhou_corrupted_fields:0 "£blocker£ §r灾厄平原§!"
 d_touhou_corrupted_fields_desc:0 "这片地区原本生机勃勃，但是在月之都升格派的影响下，一切生命都被抹去了，同时这片区域还诡异的在向周围扩张……"
 d_touhou_corrupted_statue:0 "£blocker£ §r哭泣雕像§!"
 d_touhou_corrupted_statue_desc:0 "雕像的眼中流出了透明的液体，成分与眼泪相近，没人知道液体从何而来，但站在雕像周围的人都会感到心烦意乱，无法集中精力。"
 d_touhou_corrupted_pipe:0 "£blocker£ §r结霜管道§!"
 d_touhou_corrupted_pipe_desc:0 "一部分管道的温度会莫名其妙的降低，导致它们很容易因冷热交替而损坏，替换管道后这种现象就消失了，但替换所有不正常的管道将会是一项大工程。"
 d_touhou_corrupted_room:0 "£blocker£ §r低语房间§!"
 d_touhou_corrupted_room_desc:0 "一部分房间连同周围的基础设施都在不断向周围的居民低语，引导他们做出通常会导致他们失去生命的危险行为。"
