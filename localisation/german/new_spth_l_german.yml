 lunar_capital_psi_avatar_tt: "§M月之都升格派在星球上投射了灵能幻象，对我们发起了陆军入侵。§!"
 lunar_capital_psi_assault_army: "灵能幻象"
 lunar_capital_psi_assault_army_desc: "这些灵能幻象仿佛是以前的月人士兵们，能够发射出致命的弹幕和灵能闪电对我们展开攻击。"
