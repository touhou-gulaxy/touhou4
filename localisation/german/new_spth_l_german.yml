 spth_grimoire_of_marisa: "The Grimoire of Marisa"
 spth_grimoire_of_marisa_desc_short: "Danmaku makes no sense in a world without rules"
 spth_grimoire_of_marisa_desc_details: "划过夜空的流星，受花香引诱而飞舞的蝴蝶，流向低处的河水，深邃黑暗的浓雾。\n自然界发生的事情都有其各自的道理。人类为了证明自己能够说明这些道理进而捏造出种种理由。\n映入眼帘的这一切，都将为人类所有……本来应该是如此的。\n对于自然界中发生的现象到处都产生了不同的解释。这对于那些喜欢被统一的理论的人类们来说，他们会认为除了其中的一个正确答案以外，其他的种种解释都是错误的吧。\n但是妖怪们思考的方式却是这样的。眼中所见的东西，周围发生的事情，就连对这些东西产生的思考，一切都是正确的。要问为什么的话，因为妖怪本身，也是从现象和思考中诞生的东西吧。\n我因为一个偶然的机会得以窥见天狗的手册。那本天狗用来记录世间所发生的事情的手册。\n那本手册里记录着从和我完全不同的视点下看到的许多非常平淡无奇的日常事物。天狗的观察力非常敏锐，她们似乎已经超越了我所能理解的世界，构筑起了一个独自的世界。\n就算是平淡无奇的日常也无所谓，只要全部都记录下来的话一定就可以从中发现什么吧。那么想着的我，便决定将以前一直认为平淡无奇的那个——符卡集中起来写成一本书。\n比我看天狗的手册时还要古旧的事情虽然需要一定的回忆，不过通过记录也许可以发现研究新魔法的灵感。\n这本书就是在这样的念头下诞生了。这是人类所写的幻想乡唯一的魔法弹幕书籍。可绝不是在模仿爱丽丝在写的那些魔法书哦。\n我希望能使用更多的魔法。不对，是预定能使用啦。最终我要被大家称呼为大魔法使。\n为此我虽然决定不惜一切努力，但到最后这本记录真的能成为对我有用的食粮吗。\n不过嘛，假如要是没用的话就给它安个幻想弹幕博物图画集或者其他什么夸张的名字，高价卖给图书馆就好了嘛——。\n\n——魔理沙"
