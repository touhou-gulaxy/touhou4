 spth_precursor.201.name: "§HSpatial Fluctuations§!"
 spth_precursor.201.desc: "我们检测到银河边缘传来了未知的空间波动，伴随着某种未知的引力源，天文部门观测到有某种巨大的物体正在接近，目前我们的科学家也不知道这到底是怎么回事。\n\n预计数个月后就会抵达我们的银河系。"
 spth_precursor.202.name: "§HIncoming Transmission§!"
 spth_precursor.202.desc: "……\n你好，我们是§H隙间之里§!，你或许已经和顶替了这个名字的势力接触过了……\n\n没有吗？\n那是好事，我们原本预计要过很久才能重返现实。看起来已经过去了如此久远的岁月，背叛者也已经离开了。\n……\n总之无论如何，暂时不要靠近这里。"
 spth_precursor.202.desc.after_crisis: "……\n你好，我们是§H隙间之里§!，你或许已经和顶替了这个名字的势力接触过了……\n\n你们击退了他们？\n真想不到啊，我们原本预计要过很久才能重返现实。看起来已经过去了如此久远的岁月，背叛者也已经离开了。\n……\n总之无论如何，暂时不要靠近这里。"
 spth_precursor.202.desc.ag: ""
