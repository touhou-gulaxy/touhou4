 lunar_capital_psi_aura: "§B终焉「亘古星脉」§!"
 lunar_capital_psi_aura_desc: "这一灵能光环由来自深层虚境中的月都升格派产生，其灵能活动产生了极大的负面作用，混乱的灵能不断的从裂口中涌出，哪怕是所谓超主的力量也丝毫无法与其对抗。"
 lunar_capital_psi_psionic_aura_spread_effect: "$try_spread_aura_tt$\n$lunar_capital_psi_aura$ spreads infinitely"
 touhou_disabled_shroud_seal: "失效的虚境封印"
 touhou_disabled_shroud_seal_DESC: "这台复杂的机器原本会释放可以中和灵能能量的低频率波，以此驱散并逐渐消除灵能光环，但是它却被某种未知的灵能力量无效化了，不仅无法发挥原先的作用，甚至还起到了相反的效果。"
 lunar_capital_psi.48.name: "Spirit Power Inhibitor"
 lunar_capital_psi.48.desc: "针对月之都升格派的灵能光环，近期我们的科学家成功开发出了具备针对其灵能抑制效应的装置。其可以在局部范围内将其完全抑制住，使得我们的殖民地不再遭受负面影响，这种设备需要被部署在维持灵能信号的星系内。\n\n此外这种灵能抑制器还对大多数的灵能活动模式都具备一定的抑制效果，不过物种的灵能天赋会在星系内灵能抑制装置的影响下逐渐消退。"
 lunar_capital_psi.48.a: "好诶"
 kamikakushi_aura: "§M华灯「救济之魔女」§!"
 kamikakushi_aura_desc: "能够抵抗大部分灵能光环的活动带来的负面效应，还会使得星系内的灵能物种逐渐地失去灵能。"
 kamikakushi_psionic_aura_spread_effect: "此§H灵能抑制光环§!将尝试散播至周边星系。\n$kamikakushi_aura$的传播范围没有限制。"
 d_touhou_corrupted_jungle:0 "£blocker£ §r孢子森林§!"
 d_touhou_corrupted_jungle_desc:0 "这片幽暗的森林会吸收光线，其中弥漫着诡异的孢子。由于这片区域的“污秽”被清除了，在这里看不到任何动物的痕迹。"
 d_touhou_corrupted_shroudstone: "£blocker£ §B活体之石§!"
 d_touhou_corrupted_shroudstone_desc: "这些诡异的岩层曾经是由$PSIONIC_AURA_PLURAL$形成的虚境石，但现在在更强大灵能力量的影响下变成了扭曲的活体岩层，有些岩石未被注视时会高速移动并追杀靠近其之人，有些则诡异的漂浮在空中向靠近之人发射弹幕与灵能闪电。"
 touhou_psionic_inhibitor: "Spirit Power Inhibitor"
 touhou_psionic_inhibitor_plural: "$touhou_psionic_inhibitor$"
 touhou_psionic_inhibitor_cap: "$touhou_psionic_inhibitor$"
 touhou_psionic_inhibitor_DESC: "这一灵能抑制器可以在局部范围内将大部分灵能活动完全抑制住，使得我们的殖民地不再遭受负面影响，这种设备需要被部署在维持灵能信号的星系内。"
 touhou_psionic_inhibitor_core: "Spirit Power Inhibitor Core"
 NAME_touhou_psionic_inhibitor: "§ULantern \"Witch of Salvation\"§!"
 tech_touhou_psionic_inhibitor: "$touhou_psionic_inhibitor$"
 tech_touhou_psionic_inhibitor_desc: "我们成功找到了能一定程度抑制月都升格派灵能活动的方式，通常这一抑制器对其他的灵能活动也具有一定效果，不过物种的灵能天赋会在星系内灵能抑制装置的影响下逐渐消退。"
 touhou_requires_no_existing_psionic_inhibition_station_in_system: "$TRIGGER_FAIL$\"§RCannot be built in a system with an existing Spirit Power Inhibitor§!"
 touhou_requires_no_existing_psionic_burster_station_in_system: "$TRIGGER_FAIL$\"§RCannot be built in a system with an existing Spirit Power Amplifier§!"
