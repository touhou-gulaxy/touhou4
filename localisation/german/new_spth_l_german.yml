 spth_precursor_makai_locate_capital_action: "§MLocate: $spth_precursor.makai$ system§!"
 spth_precursor_makai_locate_capital_action_desc: "We have gathered enough data to locate the system of $spth_precursor.makai$."
 site_spth_precursor_makai_wedge: "§MArtificial Construct§!"
 site_spth_precursor_makai_wedge_intro: "A damaged construct called the \"Primary Wedge\". Its power supply is already lost.\nWe can send science ships inside to investigate in order to find out clues about the disappearance of $spth_precursor.makai$."
 spth_precursor_107_finish_effect: "§MAncient $spth_precursor.makai$ Ship Core§! Acquired."
 spth_precursor_capital_makai: "§MPrimigenial Axis§!"
 spth_precursor_capital_makai_star: "§MPrimigenial Star§!"
 spth_precursor_capital_makai_home: "§MArcane Radiance§!"
 spth_precursor_capital_makai_lunar: "§MThe Seventh Isle§!"
 spth_precursor_capital_makai_wedge_object: "§MStarfall§!"
 spth_precursor_capital_makai_wedge_object_desc: "A construct named \"Primary Wedge\"; it is severely damaged, however, and has lost its power supply. What remains are only minor fluctuations of spirit power."
 spth_precursor_capital_makai_wedge_active_object: "§MStarfall§!"
 spth_precursor_capital_makai_wedge_active_object_desc: "A construct named \"Primary Wedge\". For an unknown reason, its power supply is suddenly restored and becomes activated."
 spth_precursor_capital_makai_wedge_repair: "Repair Primary Wedge"
 spth_precursor_capital_makai_wedge_repair_desc: "Attempt to repair Primary Wedge with information we obtained."
 spth_makai_wedge_0: "§MPortal of Myriad Stars§!"
 spth_makai_wedge_0_DESC: "The device named \"Primary Wedge\", made by $spth_precursor.makai$, is already reconditioned with our maintenance.\nAlthough it lost the function to connect different dimensions, it can still create warps in space to help our fleets cross the galaxy in a short span.\nWith an existing $spth_precursor.makai$ ship core, it can project the fleet inside the entire system to a location near the $spth_precursor.makai$ ship core. A recharge of 180 £time£ is needed after every use."
 spth_makai_wedge_0_warp_used: "Projection functionality of Secondary Wedge is currently on cooldown"
 spth_makai_wedge_1: "§MPortal of Myriad Stars - Secondary Wedge Projection§!"
 spth_makai_wedge_1_DESC: "The device named \"Primary Wedge\", made by $spth_precursor.makai$, is already reconditioned with our maintenance.\nAlthough it lost the function to connect different dimensions, it can still create warps in space to help our fleets cross the galaxy in a short span.\nWith an existing $spth_precursor.makai$ ship core, it can project the fleet inside the entire system to a location near the $spth_precursor.makai$ ship core. A recharge of 180 £time£ is needed after every use."
 spth_precursor_capital_makai_discover: "§MLocate $spth_precursor.makai$ system§!"
 spth_precursor_capital_makai_discover_desc: "After investigation, we find out that $spth_precursor.makai$ actually originated from the same universe as us. We now have sufficient data to locate the homeworld of $spth_precursor.makai$."
 spth_precursor_capital_makai.poi: "$spth_precursor.makai$ homeworld"
 spth_precursor_capital_makai.poi.desc: "location of $spth_precursor.makai$ homeworld found with data analysis"
 spth_precursor.115.name: "$spth_precursor_capital_makai$"
 spth_precursor.115.desc: "With data gathered early on, we successfully located the homeworld of $spth_precursor.makai$, the system now designated as [spth_precursor_capital_makai_system.GetName].\nWe have never detected this system before. Distant observation confirms that this system §Remits no light§!.\n\nWe should send a science ship to investigate."
 spth_precursor.116.name: "[From.GetName] found a new system"
 spth_precursor.116.desc: "Our intelligence department has concluded that the increased activity in [From.GetName]'s astronomy department is due to the discovery of a new system, [spth_precursor_capital_makai_system.GetName].\n\nTo our surprise, it's not on our starmap, either."
 spth_precursor.117.name: "§MThe Starless Depths§!"
 spth_precursor.117.desc: "§H[This.GetName]§! reached a strange place after traveling through hyperlane.\n\nNo stars are found inside §H[From.GetName]§!. What's more bizarre is that the moon [spth_precursor_capital_makai_lunar.GetName] orbiting $spth_precursor.makai$ is a $pc_spiritual_power_star$.\n\nObservation indicates that the abandoned construct at the center is the most massive object inside this system, which is similar to the \\"Primary Wedge\\" entry in our database. Although the construct has lost its power supply, we can try to investigate and fix it."
 spth_precursor.118.name: "§REnergy signal§!"
 spth_precursor.118.desc: "After finishing up investigation work, we detected an intense signal being sent to an unknown location--nothing should be there based on our starmap. Then \\"Primary Wedge\\" is suddenly active. We are uncertain about the cause, but it's advisable to be cautious."
 spth_precursor.119.name: "§RHyperspace slipstream§!"
 spth_precursor.119.desc: "The \\"Primary Wedge\\" in [spth_precursor_capital_makai_system.GetName] appears to have established a connection to the previous unknown location. We have detected immense energy on \\"Primary Wedge\\", with some following hyperspace activity. eta is 2-3 years.\n\n§RWe should evacuate people and fleets inside the system§!"
 spth_precursor.120.name: "§RWarning§!"
 spth_precursor.120.desc: "The hyperspace slipstream previously detected has approached this galaxy. Our Astronomy Department observed one larger object and multiple smaller objects within, all of which appeared similar to our fleet.\n\nETA 1-2 years until this fleet arrives [spth_precursor_capital_makai_system.GetName]."
 spth_precursor.121.name: "§RGuardian§!"
 spth_precursor.121.desc: "The foreign fleet has completed its orbital insertion into [makai_wedge_ruined_object.GetName] within [spth_precursor_capital_makai_system.GetName]. No action is observed thereafter.\n\nThis fleet calls themselves \"Gap Guardians\". They demand us to not enter [spth_precursor_capital_makai_system.GetName], and all action against this will be regarded as hostility. All of our communication attempts are refused with \"No comment.\"\n\nThe scan revealed that these ships' signals match those of the faction that previously fought $spth_precursor.makai$."
 spth_precursor.121.a: "That's it, never mind."
 spth_precursor.121.b: "Prepare for war."
 spth_kamikakushi_invader: "§Mthe Gap Realm§!"
 mod_damage_vs_country_type_spth_kamikakushi_invader_mult: "Damage to $spth_kamikakushi_invader$ Guardian Fleet"
 spth_precursor.123.name: "§MDefeat the Guardian§!"
 spth_precursor.123.desc: "We have defeated the foreign fleet in [spth_precursor_capital_makai_system.GetName]. Data recovered from debris revealed that this fleet is automated to eradicate all threats posed by the \"Primary Wedge\".\n\nThe record indicates that the \"Primary Wedge\" possesses the ability to interconnect two dimensions. With it, $spth_precursor.makai$ tried to connect the $spth_precursor.makai$ plane to this plane in order to solve the issue they encountered in the $spth_precursor.makai$ plane, but finally failed due to assaults conducted by the faction named \"the Gap Realm\". It remains unclear what kind of plights $spth_precursor.makai$ faced that prompted this action, but it is no longer a concern. The $spth_precursor.makai$ empire, which once traversed hundreds of systems, spent a tough time and ultimately fell apart over decades due to the failure of this project. At last, the survivors of the $spth_precursor.makai$ empire could only find refuge in the $spth_precursor.makai$ plane, where they barely managed to linger.\n\nThe data we recovered should be enough to push a repair on \"Primary Wedge\"."
 spth_precursor.123.a: "What a pity."
 spth_precursor.124.name: "§MRepair works finished§!"
 spth_precursor.124.desc: "Our repair on Primary Wedge $spth_makai_wedge_0$ has finished.\n\nAlthough it can no longer connect different dimensions, it still has the capability to warp space and help our fleets to cross the galaxy in a short time. We may also use the ship core we found earlier, the Secondary Wedge, as a beacon and conduct jumps of military fleets in [spth_precursor_capital_makai_system.GetName] to the Secondary Wedge. Each use requires 180£time£ afterward to recharge."
 spth_precursor.124.a: "A great march to victory,"
 spth_precursor.125.name: "§RUnknown interference§!"
 spth_precursor.125.desc: "The combat system of our Super Carrier [spth_temp_ship_target.GetName] suffered some interference due to the Gap Realm. It no longer works well against fleets of the Gap Realm."
 spth_precursor.125.a: "What a nuisance."
