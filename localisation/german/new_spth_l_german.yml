 toho.10011.name: "怪异空间站"
 toho.10011.desc: "乍一看，§H[From.GetName]§!是一个空旷、死寂的恒星系，但其中有一个东西显得与其他天体格格不入——那是一座仍在活跃的大型空间站，§H[Root.GetName]§!的初步扫描显示这玩意和我们的一款$the_grand_archive$的设计高度相似。然而诡异的是，其内部似乎存在着大量灵力反应和生命信号，规模远超§H[Root.GetName]§!的科学团队的想象——这座空间站是活着的。\n\n值得注意的是，在我们对§H[From.GetName]§!内的大型空间站进行扫描的时候，空间站的核心明显活跃了起来，其能量读数显著增强，并且有什么大功率的武器正在被启动！"
 toho.10011.a: "布豪，启动紧急超光速跃迁！"
 toho.10011.b: "$TH_WORYING$"
 toho.10012.name: "摧毁怪异空间站"
 toho.10012.desc: "很明显，§H[FromFrom.solar_system.GetName]§!内的那座神秘空间站对我们不怀好意，我们的舰队一进入星系，就遭到了大功率武器的攻击。好在，我们的舰队足够先进，这种水平的武器还不足以造成大量损失，而我们的舰队却能轻松地用炮火将那座空间站变成太空垃圾。\n\n在这座空间站内，一定还有什么珍贵的藏品没有被损坏，而且也许我们应该借此机会了解这一神秘空间站背后的秘密。"
 toho.10012.a: "有意思，让我们看看是这么个事。"
 toho.10012.b: "让空间站和那些令人厌恶的真相一起烂在那里吧。"
 toho.10013.name: "被侵占的博物天枢"
 toho.10013.desc: "我们对这一空间站残骸的研究已经告一段落了。\n\n在仅存的部分舱室中，我们发现了来自§B月之都§!的资料记录，似乎这座空间站曾经是§B月之都§!的一座太空博物馆，配备了少量的标准自卫手段。在他们因为不明原因放弃了这片星域的漫长时间之后，这座空间站被$spth_kedama$所占据，此前我们观测到的生命信号和灵力反应正是来自那些$spth_kedama$。\n\n至于这群$spth_kedama$的来源，似乎是§B月之都§!出于博物展览的目的，将他们收藏在了这座设施之中，直到无数年后他们突破了收容。在这座空间站中，尚且保存着§B月之都§!的部分收藏，也许可以为我们所用。"
 toho.10013.a: "有趣。"
 touhou_kedama_the_grand_archive_project: "研究空间站残骸"
 touhou_kedama_the_grand_archive_project_DESC: "派遣调查队伍探索这座空间站的残骸，看看里面还有些什么东西。"
