 spth_precursor.204.name: "§H觉醒§!"
 spth_precursor.204.desc: "……我们，§H隙间之里§!已经迷惘的足够久了，如今我们将会重新庇护这片星河。\n纵使被自己造物背叛，我们的理想也从未改变。\n\n§R[enemy_empire.GetName]§!，就是银河系中最大的威胁，拒绝根除他们，无异于愚蠢的赌博。\n我们徒劳地在黑暗中度过永恒，而他们却攫取了我们的成就，据为己有。"
 spth_precursor.204.a: "Close transmission."
 spth_precursor.204.b: "Prepare for war."
