 d_makai_ringworld: "§MBreach on Astral Barrier§!"
 d_makai_ringworld_desc: "A tunnel is opened on this world and weakens the Astral Barrier. Hence, it exists both in our dimension and the $spth_precursor.makai$ dimension simultaneously."
 d_makai_alice_ruin: "§MAncient Ruins§!"
 d_makai_alice_ruin_desc: "Ruins of ancient $spth_precursor.makai$ cities are here. We may find something out of these."
