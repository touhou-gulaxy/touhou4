 spth_kamikakushi_crisis_invasion_desc: "$spth_kamikakushi_country$, the faction that previously attacked $spth_precursor.makai$, left an enormous fleet to guard Primary Wedge. Because of our activity in restarting it, these automated fleets have initiated total war on us. It won't stop until every living creature in this galaxy is destroyed. We must unite as one to overcome this harsh situation."
