 TH_YEAH: "Hooray!"
 touhou_cleansed_crystal_mirror: "净玻璃之镜"
 touhou_cleansed_crystal_mirror_desc_short: "一面澄澈的明镜。"
 touhou_cleansed_crystal_mirror_desc_details: "阎魔大人所持有的宝镜。用这面镜子映照受审者，受审者过去的一切言行都将在镜中得到再现。托这面宝镜的福，审判得以获得公正的裁决，不过这同时也是让阎魔大人厌倦繁琐枯燥的审判的罪魁祸首。"
 touhou_keystone: "Keystone"
 touhou_keystone_desc_short: "武甕槌大神之石"
 touhou_keystone_desc_details: "「要石」被祭祀于神社中，半埋入地下，作为镇压地震的灵石。不过，看起来天子也有很多不合常理的使用方法。。。"
 touhou_swallow_cowrie_shell: "Swallow's Cowrie Shell"
 touhou_swallow_cowrie_shell_desc_short: "\"Life Spring Infinity\""
 touhou_swallow_cowrie_shell_desc_details: "辉夜姬的五难题之一的密宝。\n\n象征着自由和希望，是来自蓬莱的珍贵物品。"
 touhou_swallow_cowrie_shell_effect: "§U$touhou_swallow_cowrie_shell$§!"
 touhou_fox_mask: "妖狐面具"
 touhou_fox_mask_desc_short: "眼神锐利，可能代表认真、充满战意，也是秦心发动符卡时戴的面具。"
 touhou_fox_mask_desc_details: "秦心所使用的面具，妖狐面表现的是狡黠智慧的狐妖、狐神，可能以此表现妖异的特质。"
 touhou_hyottoko_mask: "火男面具"
 touhou_hyottoko_mask_desc_short: "表情诙谐，嘴巴张圆偏向一边。"
 touhou_hyottoko_mask_desc_details: "秦心所使用的面具，「火男」指用竹管朝炉灶里吹气的人，面具表现其张嘴吹气的样子，因为形象滑稽用来表现丑角。"
 touhou_karakasa: "Karakasa"
 touhou_karakasa_desc_short: "\"Forgotten Karakasa\""
 touhou_karakasa_desc_details: "Thrown aside for her unlovely colors and left to weather countless storms,\nshe waited alone through wind and rain for the one who abandoned her to glance back;\nuntil that longing itself gave her form, and she awoke as a tsukumogami."
 touhou_philosopher_stone: "Philosopher's Stone"
 touhou_philosopher_stone_desc_short: "Although Philosopher's Stone is the ultimate pursue of alchemy, Patchouli launch them like ordinary danmaku."
 touhou_philosopher_stone_desc_details: "“The quintessence of all elements; indestructible by any, eternal and pure.\nThe Fifth Element -- living quicksilver, bearing its own soul, that purifies all which is frail or base.\nThe Light everlasting, the panacea of all afflictions,\nthe phoenix of divine grace,\nthe richest jewel of creation,\nthe sacred property of all Nature.”"
 touhou_broken_amulet: "Broken Amulet"
 touhou_broken_amulet_desc_short: "「对不起，你不是准神。」"
 touhou_broken_amulet_desc_details: "This misfortune amulet is broken, but it seems to still provide some protection."
 touhou_hannya_mask: "Mask of Hannya"
 touhou_hannya_mask_desc_short: "凶神恶煞，可能代表愤怒、凶恶。"
 touhou_hannya_mask_desc_details: "秦心所使用的面具，能剧中般若面对应怨灵、恶鬼，故事中常常是因嫉妒、嗔怒化作厉鬼的女性。"
 touhou_crow_tengu_wing: ""
 touhou_crow_tengu_wing_desc_short: ""
 touhou_crow_tengu_wing_desc_details: ""
 touhou_buddha_stone_bowl: "Buddha's Stone Bowl"
 touhou_buddha_stone_bowl_desc_short: "\"Buddhist Diamond\""
 touhou_buddha_stone_bowl_desc_details: "辉夜姬的五难题之一的密宝。\n\n象征着智慧和慈悲的宝物，是来自蓬莱的珍贵物品。\n\"渡海超山心血尽，取来石钵泪长流。\""
 touhou_wolf_tengu_shield: ""
 touhou_wolf_tengu_shield_desc_short: ""
 touhou_wolf_tengu_shield_desc_details: ""
 touhou_mask_of_hope: "Mask of Hope"
 touhou_mask_of_hope_desc_short: "The retrieved hope"
 touhou_mask_of_hope_desc_details: "象征着情感，这是一份备用之面。\n\n此前发生的异变就源于秦心丢失了「希望之面」，情感发生暴走，使得整个人类村落陷入绝望之中。"
 touhou_the_mighty_shaku: "威风的笏板"
 touhou_the_mighty_shaku_desc_short: ""
 touhou_the_mighty_shaku_desc_details: ""
