 ag_psionic_mutation_ghost_of_damaku_DESC: "灵能结构使得舰船完整性即将崩溃时，能再度从虚境中汲取能量重构自身。"
 ag_psionic_mutation_ship_part_ran_computer_DESC: "泽洛文明升格派的意识碎片寄宿其中，能够准确的解算火控。"
 ag_psionic_mutation_phase_stealth_generator_DESC: "这种隐身发生器凭借灵能力量将自身存在的痕迹从现实中抹去。"
 ag_psionic_mutation_ship_part_lingli_afterburner_DESC: "诡异的灵能迷雾萦绕在孢子之中，为舰船提供额外的能量。"
 ag_psionic_mutation_ship_part_outworld_protector_DESC: "生物体内的灵能活动与灵力结合，提高了护盾与装甲的运行效率。"
 ag_psionic_mutation_ship_part_moon_repairer_DESC: "灵能阱源源不断的从虚境中获取能量用于修复自身。"
 ag_psionic_mutation_shield_jiejie1_DESC: "上皮激发的结界能够阻挡大部分的敌方炮火，而体内的灵能活动进一步增加了它的强度。"
 ag_psionic_mutation_shield_jiejie2_DESC: "皮肤激发的结界能够阻挡大部分的敌方炮火，而体内的灵能活动进一步增加了它的强度。"
 ag_psionic_mutation_armor_scarlet1_DESC: "复杂的灵能结构能够有效提升舰船的防御能力。"
 ag_psionic_mutation_armor_scarlet2_DESC: "复杂的灵能结构能够有效提升舰船的防御能力。"
 ag_psionic_mutation_yuyuko_butterfly_DESC: "几乎所有防御手段都对这种奇异而致命的灵能闪电无效。"
 ag_psionic_mutation_ex_muso_DESC: "几乎所有防御手段都对这种奇异而致命的灵能闪电无效。"
