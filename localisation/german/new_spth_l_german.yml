 makai_ringworld_modifier_desc: "The features of two dimensions coexist on this world, providing a huge convenience for colonization."
 NAME_alice: "Alice Margatroid"
 leader_trait_alice: "Seven-Colored Puppeteer"
 leader_trait_alice_desc: "She has the abilities of using magic and manipulating dolls. As a puppeteer, she has the skillfulness among the finest among all of Gensokyo, which enables her to control many dolls as if they're living beings. She has her hands full manipulating the dolls, so her movements are sluggish and her fighting ability is low."
 leader_trait_alice_effect: "After the commanded fleet entering battle:\nSummon §G1-3§! §Rinvincible§! phantom fleet, which will exist §G8-15§!£time£, with a 180 £time£ cooldown."
