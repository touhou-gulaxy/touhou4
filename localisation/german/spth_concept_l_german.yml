 concept_touhou_difficulty: "§EDifficulty Factor§!"
 concept_touhou_difficulty_desc: "['concept_touhou_difficulty'] affects various aspects of enemy strength in events of this mod.\nGenerally speaking, EASY difficulty has a difficulty factor of 1, LUNATIC of 4, and OVERDRIVE of 8."
 concept_touhou_difficulty_shield_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_shield_kamikakushi_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ modifer §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)r*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*50%§!\n\n§RAfter applying PHANTASM difficulty:§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §G+8%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ §G+12800§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_shield_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_shield_lunar_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ modifer §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*100%§!\n\n§RAfter applying PHANTASM difficulty:§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §G+8%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ §G+12800§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_armor_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_armor_kamikakushi_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ modifier §G+(difficulty factor - 1)*2§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*4§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*2§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*4§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*0.5§!\n\n§RAfter applying PHANTASM difficulty§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_PERC$§G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$§G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ §G+360§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_armor_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_armor_lunar_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ modifier §G+(difficulty factor - 1)*100%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*200%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ modifier §G+(difficulty factor - 1)§!\n\n§RAfter applying PHANTASM difficulty:§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ §G+360§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_damage_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_damage_kamikakushi_desc: "§H受到东方MOD['concept_touhou_difficulty']影响§!: $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×25%§!\n§H在HARD及以上的难度§!: $TOUHOU_DIFFICULTY_GUNGNIR_DAMAGE$ §G+难度系数×10%§!$TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×100%§!\n§H在LUNATIC及以上的难度§!: $TOUHOU_DIFFICULTY_GUNGNIR_DAMAGE$ §G+难度系数×15%§!$TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×50%§!\n\n§R应用PHANTASM难度后§!: $TABBED_NEW_LINE$—获得更多的加成\n§R启用['concept_touhou_difficulty_wtf']后§!: $TABBED_NEW_LINE$—各方面属性大幅度提升"
 concept_touhou_difficulty_damage_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_damage_lunar_desc: "§H受到东方MOD['concept_touhou_difficulty']影响§!: $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×25%§!\n§H在HARD及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×100%§!\n§H在LUNATIC及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×75%§!\n\n§R应用PHANTASM难度后§!: $TABBED_NEW_LINE$—获得更多的加成\n§R启用['concept_touhou_difficulty_wtf']后§!: $TABBED_NEW_LINE$—各方面属性大幅度提升"
 concept_touhou_difficulty_extra_life: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_extra_life_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$mod_ship_spth_extra_life$§G+difficulty factor×1§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$§G+difficulty factor×2§!\n\n§RAfter applying PHANTASM difficulty§!: $TABBED_NEW_LINE$-$mod_ship_spth_armor_efficiency$ §G+1000%§!$TABBED_NEW_LINE$-$mod_ship_spth_shield_efficiency$ §G+1000%§!"
 concept_touhou_difficulty_wtf: "§RDifficulty: Impossible§!"
 concept_touhou_difficulty_wtf_desc: "When §RPHANTASM§! Difficulty is on, while ['concept_touhou_difficulty'] §Gis greater than 8§!, impossible difficulty will be activated. Enemy damage and HP will increase greatly."
 concept_spth_ship_skill_monadic_qerr: "§HReality editing§!"
 concept_spth_ship_skill_monadic_qerr_desc: "利用视界刺针进行现实编辑。\n\n消耗: §R3200§!£sr_fuka£\n冷却：§R720§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!"
