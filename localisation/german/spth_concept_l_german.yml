 concept_spth_super_carrier_switch_planet_killer_mode_desc: ""
 concept_spth_super_carrier_switch_remote_mode: "§H调整跨星系攻击功率§!"
 concept_spth_super_carrier_switch_remote_mode_desc: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。"
 concept_spth_super_carrier_switch_remote_mode_tooltip: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。\n点击可以在['concept_spth_super_carrier_remote_attack_fleet']、['concept_spth_super_carrier_remote_attack_star']、['concept_spth_super_carrier_remote_attack_star_1']三种攻击模式中轮换。\n当前的攻击模式: [spth_super_carrier_get_remote_mode]"
 spth_super_carrier_remote_mode_1: "['concept_spth_super_carrier_remote_attack_fleet']"
 spth_super_carrier_remote_mode_2: "['concept_spth_super_carrier_remote_attack_star']"
 spth_super_carrier_remote_mode_3: "['concept_spth_super_carrier_remote_attack_star_1']"
 concept_spth_super_carrier_remote_attack_fleet: "§H打击舰队§!"
 concept_spth_super_carrier_remote_attack_fleet_desc: "超级航母的主炮释放的能量能够对目标星系中的敌方舰队造成致命伤害，这一过程中能量会被精细的引导来避免对星系中的天体造成损伤。\n\n冷却: 720£time£"
 concept_spth_super_carrier_remote_attack_star: "§H转化恒星§!"
 concept_spth_super_carrier_remote_attack_star_desc: "\"超级航母的主炮释放的能量不足以彻底摧毁恒星，但撕裂空间的攻击和磅礴的灵力将会席卷整个恒星，使其转化为灵力星体，同时对星系内殖民地造成可怕的伤害。\n\n冷却: 1280£time£"
 concept_spth_super_carrier_remote_attack_star_1: "§H摧毁恒星§!"
 concept_spth_super_carrier_remote_attack_star_1_desc: "超级航母的主炮释放的能量将会引爆恒星，制造一场超新星爆发，引导超新星爆发释放的少量能量来摧毁恒星系中的几乎所有天体，大部分能量则用于彻底熄灭这颗恒星。\n\n冷却: 1800£time£"
 touhou_ship_action_super_carrier_eater_cooldown: "['concept_spth_ship_skill_super_carrier_eater'] cooldown"
 touhou_ship_action_super_carrier_eater_cooldown_tt: "§R超级航母主炮射速：减半§!"
 touhou_ship_action_super_carrier_eater_cooldown_desc: "超级航母的跨星系打击能力正在冷却。"
 concept_ship_hyper_point: "§U月华石§!"
 concept_ship_hyper_point_desc: "击杀不同大小的敌舰可以获得不同数量的['concept_ship_hyper_point']，当['concept_ship_hyper_point']达到§G24§!后，舰船将进入['concept_status_th_hyper']状态。"
 concept_status_th_hyper: "§P暴走§!"
 concept_status_th_hyper_desc: "舰船以获得§R+32%§!的['concept_touhou_vulnerable']为代价:\n$t$自身部分武器射速§G翻倍§!\n$t$清除自身全部的['concept_ship_hyper_point']\n$t$获得等同于自身§G最大护盾§!的减伤，持续2£time£\n$t$持续期间无法获得['concept_ship_hyper_point']\n该状态将持续8£time£"
 concept_psionic_inhibitor: "灵能抑制器"
 concept_psionic_inhibitor_desc: "更先进的灵能抑制器能够有效的抑制大多数的灵能活动模式，从而逐渐阻断星系内的灵能光环等灵能活动影响，抑制灵能光环的扩散，甚至让灵能物种缓慢的失去灵能能力。\n\n面对某些§M危害性的灵能活动§!，其完全不会被腐化，同时表现出显著的抑制效应。"
 concept_psionic_burster: "灵能增幅器"
 concept_psionic_burster_desc: "灵能增幅器能够有效的增强大多数的灵能活动模式，从而逐渐增强星系内的灵能光环等灵能活动影响，加强灵能光环的扩散，甚至让无灵能物种缓慢的获得灵能能力。\n\n面对某些§P灵能抑制效应§!，其仍然可以生效。"
 concept_touhou_vulnerable: "易伤"
 concept_touhou_vulnerable_desc: "舰船所受到的伤害将会额外增加，此修正将与减伤互相抵消。"
 concept_touhou_psionic_conduit_ancient_titan_action: "灵力能源供应"
 concept_touhou_psionic_conduit_ancient_titan_action_desc: "为古代文明的舰船传输灵力，使其作战能力进一步增强。\n\n对于当前舰队中可以从灵能导管接受能源供给的舰船:\n$t$灵能导管供能时长 §G+5§!\n$t$灵能导管冷却时长 §G-25%§!\n$t$该状态持续时，需要为古代舰船提供额外的$r_sr_lingli$与$r_sr_fuka$维护费。"
 concept_touhou_psionic_conduit_ancient_titan_action_alt: "§R停止灵力能源供应§!"
 concept_touhou_blood_slash: "猩红斩击"
 concept_touhou_blood_slash_desc: "附带了猩红斩击的攻击将使得被命中的舰船陷入['concept_touhou_bleeding',流血状态]，持续§G3-5§!£time£。"
 concept_touhou_bleeding: "流血"
 concept_touhou_bleeding_desc: "处于流血状态的舰船将会缓慢地损失装甲或舰体稳定性，但是不能直接致死。"
 concept_touhou_sunbeam: "星光射线"
 concept_touhou_sunbeam_desc: "生成一道隙间裂口，从星系黄道面上方召来一道魔炮光束，对敌人造成一定量的护盾伤害，该伤害可以受到$mod_weapon_type_spark_weapon_damage_mult$与$mod_weapon_type_lingli_weapon_damage_mult$的少量加成。"
 concept_touhou_cleanse: "净化"
 concept_touhou_cleanse_desc: "清除自身的['concept_touhou_echo',回响状态]与['concept_touhou_bleeding',流血状态]，并且根据本次攻击的伤害获得一定量的临时生命值。"
 concept_touhou_constraint: "封印"
 concept_touhou_constraint_desc: "处于封印状态的舰船，移动速度将大幅度下降，并且闪避与射速会少量下降。"
 concept_touhou_echo_strike: "回响打击"
 concept_touhou_echo_strike_desc: "附带了回响打击效果的攻击将使得被命中的舰船陷入['concept_touhou_echo',回响状态]，持续3-5£time£。"
 concept_touhou_echo: "回响"
 concept_touhou_echo_desc: "处于回响状态的舰船，如果受到同一来源的再次攻击，将在短时间后受到一定量的装甲伤害，并且清除回响状态。"
