l_korean:
 spth_word_concept_ap_hm3: "HellSing"
 spth_word_concept_ap_hm3_desc: "$ap_hm3_desc$\nThis passage is from the European medieval alchemical manuscript \"The Ripley Scroll\"."
 spth_word_concept_armor_shield_efficiency: "Shield/Armor Efficiency"
 spth_word_concept_armor_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond_tt$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$/$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾/装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_ship_weapon_tuning: "Weapon calibration"
 spth_word_concept_armor_ship_weapon_tuning_desc: ""
 spth_word_concept_weapon_use_target: "Weapon retargeting"
 spth_word_concept_weapon_use_target_desc: "This determines whether this weapon retargets enemy because other weapon will kill target prior to this weapon, causing a waste of damage.\nEnabling this might increase valid damage under some circumstances, as targeting efficiency is increased(to avoid wasting damage). But this also lowers firing rate as more time taken for retargeting.\nDisabling this cause weapon to keep firing at any time instead of retargeting to prevent wasting damage. As mentioned above, this causes invalid damage(wasting damage on those died).\nMost vanilla and modded weapons are defaulted to enable."
 spth_word_concept_shield_efficiency: "§GShield efficiency§!"
 spth_word_concept_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond_tt$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_efficiency: "§GArmor efficiency§!"
 spth_word_concept_armor_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond_tt$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 concept_spth_genso_industry: "Gensokyo Special Industry"
 concept_spth_genso_industry_desc: "The ['concept_spth_genso_district',Special Districts], ['concept_spth_special_building',Special Buildings] and ['concept_spth_common_building',Common Buildings] of ['authority:auth_gensokyo'] provide stronger output.\nThis industry relies on ['concept_spth_barrier_overloaded',Planetary Barrier] and ['concept_spth_faith_strength',Faith] mechanism. ['concept_spth_barrier_overloaded'] and ['concept_spth_faith_strength_pressure',Faith Overload] can cause positive and negative effects.\nMeanwhile, the ['civic:origin_spth_story_gensokyo'] will have access to stronger technologies and productivity.\n\nThere are two special economic systems in this mod: Gensokyo Ecumenopolis and Gensokyo World. Gensokyo Ecumenopolis mainly relies on jobs provided by districts for output, similar to the vanilla Ecumenopolis. On the other hand, Gensokyo World has a relatively complex output&upkeep formula; players need to manually balance the output carefully."
 concept_spth_genso_district: "Gensokyo Special Districts"
 concept_spth_genso_district_desc: "Districts of ['authority:auth_gensokyo'], consist of Fantasy Ecumenopolis District, Fantasy World District, Generic District and Spirit Power Produce District.\nFantasy World District, like ['district:district_gensokyo_misty_lake'], provides district output which can be increased by some factors. While Fantasy Ecumenopolis, such as ['district:district_gensokyo_jiqiao'] District provides pop jobs for output. Meanwhile, ['district:district_spth_sp_produce'] has same output formula as Fantasy World Districts in Fantasy World.\n\n['district:district_spth_generic_factory'] in Generic District provides different jobs according to different colony designation, and Spirit Power Produce District is available for any planet class. "
 concept_spth_special_building: "Gensokyo Special Buildings"
 concept_spth_special_building_desc: "['authority:auth_gensokyo']的星球副首府建筑(['building:building_spth_eientei'], ['building:building_spth_barrier_manager'], ['building:building_spth_kappa_labor_union'], ['building:building_spth_hakurei_shrine'], ['building:building_spth_moriya_shrine'])，以及会产生$mod_planet_barrier_capacity_use$的特殊建筑。大部分特殊建筑都会提供1个提供特定产出加成修正的特殊岗位。"
 concept_spth_common_building: "Gensokyo Common Buildings"
 concept_spth_common_building_desc: "['authority:auth_gensokyo']的普通量产建筑，产能相较['concept_spth_special_building']较高，但是不提供额外提供产出修正的岗位。"
 concept_spth_designation_construction: "§UTouhou Stellar Chronicles§!: $planet_automation_designation_construction$"
 concept_spth_designation_construction_desc: "允许行星自动建设['concept_spth_genso_industry']，以符合行星的规划类型。当没有空缺岗位、或者一个待业的人口能够在同规划类型相关的岗位上工作时，会自动建造提供岗位的建筑和区划。\n\n该规划类型会自动建设§U东方繁星录§!的MOD建筑与区划。\n§U建筑建设方案§!: \n$t$['building:building_spth_cloner']: ['building:building_spth_cloner']将只会建设一个，且保证所在星球的$mod_planet_barrier_capacity_use$不会超出$mod_planet_barrier_capacity_add$。\n$t$['concept_spth_special_building']: \n$tt$§L副首府建筑§!: 根据殖民地类型建设合适的副首府建筑。\n$tt$特殊建筑：根据殖民地类型进行建设的同时保证所在星球的$mod_planet_barrier_capacity_use$不会超出$mod_planet_barrier_capacity_add$。\n$t$['concept_spth_common_building']与['concept_spth_genso_district']: 根据殖民地类型进行建设。"
 concept_spth_gensokyo_sp_trait: "§U$leader_trait_sp_leader$§!"
 concept_spth_gensokyo_sp_trait_desc: "$leader_trait_sp_leader_desc$"
 concept_ship_spth_extra_life: "§PExtra Life§!"
 concept_ship_spth_extra_life_desc: "After a ship is destroyed, you can consume a residual machine to revive it (specifically triggered when the hull stability is less than §Y1%§!). \nThe cost is that the ship's firepower will be reduced for a certain period of time according to the value of ['concept_ship_spth_extra_life_power_down']. \n\nEach residual machine will take 180 days to recover naturally after being consumed."
 concept_ship_spth_extra_life_power_down: "§ELife loss penalty§!"
 concept_ship_spth_extra_life_power_down_desc: "Determines the extent to which the ship's damage is reduced after being disabled. The maximum reduction is §Y90%§! of the ship's damage and §Y修正§!."
 concept_spth_start_select_leaders: "Gensokyo starting leaders"
 concept_spth_start_select_leaders_desc: "You can acquire a set of leaders from factions within gensokyo at game start. They possess various powerful traits and abilities."
 concept_ship_toyohime_instant_kill: "Toyohime's fan"
 concept_ship_toyohime_instant_kill_desc: "Toyohime's fan is capable of purifying everything into elementary particles.\n\nDuring battle:\nDamage dealt by this weapon will §Rsignificantly increase§!\nReturn to normal after killing a number of ships."
 concept_weapon_type_th_toyohime: "§BFan of Lunar§!"
 concept_weapon_type_th_toyohime_desc: "$concept_ship_toyohime_instant_kill_desc$"
 concept_spth_ship_skill: "§USpecial Actions§!"
 concept_spth_ship_skill_desc: "Some ships have ['concept_spth_ship_skill'] that allow manual execution, and you can open the menu of ['concept_spth_ship_skill'] through fleet view.\nFor common ships ['concept_spth_ship_skill'] is only available with Gensokyo reactors."
 concept_spth_ship_skill_yuyuko: "§HEternal Sleep in Dreamland§!"
 concept_spth_ship_skill_yuyuko_desc: "召唤一支会被§G优先打击§!且§G较难摧毁§!的幽灵舰队协助作战，该舰队将在§G12§!£time£后消失。\n\n消耗: §R1000§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_satori: "§HEyesight of Truth§!"
 concept_spth_ship_skill_satori_desc: "强制解除距离自身超空间航道距离§G2§!跳以内所有敌方舰船的隐身，当退出隐身时还会受到§G负面影响§!。\n\n消耗: §R2000§!£sr_fuka£\n冷却：§R180§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!§!"
 concept_spth_ship_skill_reimu: "§HFantasy Dimensional Rift§!"
 concept_spth_ship_skill_reimu_desc: "利用亚空穴将当前舰队在短时间内跃迁到§G可以到达的所有星系§!。\n\n消耗: §R3200§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!§!"
 concept_spth_ship_skill_scarlet: "§HSpear of Scarlet Stars§!"
 concept_spth_ship_skill_scarlet_desc: "Provide $weapon_type_gungnir$ Damage: +50% * spiritual power weapon damage.\n\nCost: §R2400§!£sr_fuka£\nCooldown: §R240§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_sanae: "§HNight with Overly Bright Guest Stars§!"
 concept_spth_ship_skill_sanae_desc: "以自身§R50%§!的护盾能量为代价，使得敌方的§G大部分§!护盾暂时无效化。\n\n消耗: §R5600§!£sr_fuka£\n冷却：§R270§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_sanae_shrine: "§HDimensional Cloaking System§!"
 concept_spth_ship_skill_sanae_shrine_desc: "With the ability to cause miracles, we can hide the giant space fortress into the dimensional wrinkles.\n\nCost: §R6400§!£sr_fuka£\nCooldown: §R360§!£time£\n§KUse this action again to disable cloaking§!."
 concept_spth_ship_skill_yukari: "§HBorder of Phantasm§!"
 concept_spth_ship_skill_yukari_desc: "操纵真实与虚幻的境界，在遥远的星系中投射当前舰队的幻影，幻影舰队能够存在45£time£。\n\n消耗: §R4800§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_space_shrine_drive: "§HOverclocking Jump Driver§!"
 concept_spth_ship_skill_space_shrine_drive_desc: "通过超频$spth_space_shrine_station_ftl$，使我们的太空堡垒在90£time£内可以连续进行跃迁。\n\n消耗: §R7200§!£sr_fuka£\n冷却：§R450§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_super_carrier_eater: "§HStarfall \"Ultimate Nirvana\"§!"
 concept_spth_ship_skill_super_carrier_eater_desc: "§H远程攻击目标§!\n通过超级航母上的隙间驱动器开辟隙间裂口，使用其主炮对遥远的星系发动精确且致命的打击，打击效果取决于攻击模式。\n\n消耗: §R19200§!£sr_fuka£\n冷却：§G30§!£time£ + §G动态冷却时间§!\n§H动态冷却时间取决于攻击模式，且可以受到§Y灵力与动能武器射速修正影响§!，但效率只有§Y25%§!§!"
 concept_spth_ship_skill_space_shrine_beacon: "§HGap Jump Drive System§!"
 concept_spth_ship_skill_space_shrine_beacon_desc: "$spth_space_shrine_station_ftl$能够开辟多重大型隙间裂口，从而使得星系内的其他舰队与太空堡垒一同跃迁。\n\n消耗: §R17000§!£sr_fuka£\n冷却：§R200§!£time£\n§L使用该技能后，在跃迁时即可触发该效果。§!\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 TOUHOU_DIFFICULTY_LINGLI_FIRERATE: "$TABBED_NEW_LINE$-$mod_weapon_type_lingli_weapon_fire_rate_mult$"
 TOUHOU_DIFFICULTY_LINGLI_DAMAGE: "$TABBED_NEW_LINE$- $mod_weapon_type_lingli_weapon_damage_mult$"
