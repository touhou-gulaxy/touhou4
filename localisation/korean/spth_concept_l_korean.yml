 concept_touhou_difficulty_armor_player_desc: "§HAffected by [GetTouhouDifficultyAlt]§!: [GetTouhouDifficultyPlayerArmorAlt]"
 concept_spth_ship_skill_ag: "§PSpecial Action§!"
 concept_spth_ship_skill_ag_desc: "Some ancient ships are equipped with ['concept_spth_ship_skill_ag']. You may access it from Fleet Management."
 concept_ancient_titan_touhou_fleet_repair: "§H舰队修复系统§!"
 concept_ancient_titan_touhou_fleet_repair_desc: "§L为舰队内的其他舰船供能，从而使其恢复能力大幅度提升。\n某些不具备兼容的能量传输系统的舰船，供能提供的恢复效果会有所下降。§!\n\n持续时间内，每§Y1.00§!天为舰队内的其他舰船提供相当于其§H最大船体值§!§G1.00%§!的船体修复，冷却§R360.00§!£time£。\n船体修复能够提供最多相当于§H最大船体值§!§G10.00%§!的临时船体稳定性。\n\n对于古代文明或者幻想乡相关的舰船：\n$t$额外提供对于护盾的修复功能，但效率只有§H50.00%§!\n对于其他舰船：\n$t$由于不具备兼容的能量传输方式，效率下降§H50.00%§!"
 ancient_titan_touhou_fleet_repair_ag_tt: "§Y当启用Ancient Empire MOD且装备了§H舰队修复系统§!子系统时，效果将获得提升且转换为古代帝国的特殊动作。§!"
 concept_touhou_difficulty_alt: "东方MOD§E难度系数§!"
 concept_touhou_difficulty_alt_ag: "Ancient Empire Mod难度修正系数"
 concept_touhou_difficulty_player_damage_default: "$TOUHOU_DIFFICULTY_FIRERATE$ §G+难度系数×25%§! $TOUHOU_DIFFICULTY_DAMAGE$ §G+难度系数×50%§!\n§H在HARD及以上的难度§!: $TOUHOU_DIFFICULTY_DAMAGE$ §G+难度系数×50%§!\n§H在LUNATIC及以上的难度§!: $TOUHOU_DIFFICULTY_FIRERATE$ §G+难度系数×25%§!"
 concept_touhou_difficulty_player_damage_ag: "\n武器伤害 §G+(难度系数-1)×100%§!\n武器射速 §G+(难度系数-1)×50%§!"
 concept_touhou_difficulty_shield_player_default: "$TABBED_NEW_LINE$—$MOD_SHIP_SHIELD_ADD$修正 §G+难度系数×100%§!$TABBED_NEW_LINE$—$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$修正 §G+难度系数×200%§!$TABBED_NEW_LINE$—$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+难度系数×1.0§!"
 concept_touhou_difficulty_shield_player_ag: "\n$MOD_SHIP_SHIELD_HP_ADD$ §G+(难度系数-1)×200%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §G+(难度系数-1)×200%§!$TABBED_NEW_LINE$—$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(难度系数-1)×2.0§!"
 concept_touhou_difficulty_armor_player_default: "$TABBED_NEW_LINE$—$MOD_SHIP_HULL_ADD$修正 §G+难度系数×100%§!$TABBED_NEW_LINE$—$MOD_SHIP_HULL_REGEN_ADD_STATIC$修正 §G+难度系数×200%§!$TABBED_NEW_LINE$—$MOD_SHIP_ARMOR_ADD$修正 §G+难度系数×100%§!$TABBED_NEW_LINE$—$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$修正 §G+难度系数×200%§!$TABBED_NEW_LINE$—$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+难度系数×1.0§!"
 concept_touhou_difficulty_armor_player_ag: "\n$MOD_SHIP_HULL_ADD$ §G+(难度系数-1)×200%§!\n$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ §G+(难度系数-1)×200%§!\n$MOD_SHIP_ARMOR_ADD$ §G+(难度系数-1)×200%§!\n$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ §G+(难度系数-1)×200%§!\n$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(难度系数-1)×2.0§!"
 concept_touhou_dynamic_damage: "§EDynamic Weapon Damage§!"
 concept_touhou_dynamic_damage_desc: "§H受到[GetTouhouDifficultyAlt]影响§!: \n§H进入战斗时§!：\n武器伤害 §G+(难度系数-1)×50%§!\n武器射速 §G+(难度系数-1)×50%§!\n持续时间：§Y5§! £time£"
 concept_touhou_aoe_damage_titanic: "§EArea Damage§!"
 concept_touhou_aoe_damage_titanic_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，但循环科技的加成效率只有§Y50%§!，冷却§R$@touhou_aoe_damage_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_extra_large: "§EArea Damage§!"
 concept_touhou_aoe_damage_extra_large_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，但循环科技的加成效率只有§Y50%§!，冷却§R$@touhou_aoe_damage_extra_large_cooldown$§!£time£。"
 touhou_shell_world_durability: "$touhou_shell_world$维持度"
 touhou_shell_world_durability_desc: "['touhou_shell_world_durability']表明了当前壳世界上层壳层的结构稳定性。当维持度不足时，负面事件§R更有可能发生§!；当$touhou_shell_world$维持度处于高水平时，$touhou_shell_world$将会获得§G额外的增益§!。若维持度清零，则殖民地将会承受重大损失，但§M某些因素§!会保证壳世界不会发生结构崩溃。\n\n我们可以使用$r_minerals$、$r_alloys$或者$r_nanites$与$r_living_metal$来维持壳世界的结构稳定性，也可以选择放任不管，并且不同的维护材料会带来不同的效果。\n\n通过星球决议进行灵力注入也可以提升['touhou_shell_world_durability']，并且短时间内会使得['touhou_shell_world_durability']无法下降。"
 concept_touhou_aoe_damage_titanic_lunar_capital: "§EArea Damage§!"
 concept_touhou_aoe_damage_titanic_lunar_capital_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_capital_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_extra_large_lunar_capital: "§EArea Damage§!"
 concept_touhou_aoe_damage_extra_large_lunar_capital_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_capital_extra_large_cooldown$§!£time£。"
 concept_touhou_bombardment_real_damage: "轨道轰炸造成的额外破坏度"
 concept_touhou_bombardment_real_damage_desc: "§L在我们特殊能力引导下的轨道轰炸可以发挥更大的威力，并且对星球护盾等防御手段具备穿透效应，从而更有效的造成破坏。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£可以对星球造成一定的§H额外破坏度§!，该伤害取所有轨道舰船提供的伤害§Y平均值§!且§Y无法被任何常规手段减免§!。"
 databank_touhou: "Touhou Project"
