 concept_touhou_difficulty: "§EDifficulty Factor§!"
 concept_touhou_difficulty_desc: "['concept_touhou_difficulty'] affects various aspects of enemy strength in events of this mod.\nGenerally speaking, EASY difficulty has a difficulty factor of 1, LUNATIC of 4, and OVERDRIVE of 8."
 concept_touhou_difficulty_shield_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_shield_kamikakushi_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ modifer §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)r*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*50%§!\n\n§RAfter applying PHANTASM difficulty:§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §G+8%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ §G+12800§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_shield_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_shield_lunar_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ modifer §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*200%§! $TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*400%§! $TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*100%§!\n\n§RAfter applying PHANTASM difficulty:§!: $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_PERC$ §G+8%§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_ADD$ §G+12800§! $TABBED_NEW_LINE$-$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_armor_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_armor_kamikakushi_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ modifier §G+(difficulty factor - 1)*2§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*4§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)*2§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*4§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ §G+(difficulty factor - 1)*0.5§!\n\n§RAfter applying PHANTASM difficulty§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_PERC$§G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$§G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ §G+360§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_armor_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_armor_lunar_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ modifier §G+(difficulty factor - 1)*100%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)*200%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ modifier §G+(difficulty factor - 1)§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ modifier §G+(difficulty factor - 1)§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$ modifier §G+(difficulty factor - 1)§!\n\n§RAfter applying PHANTASM difficulty:§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_HULL_REGEN_ADD_STATIC$ §G+360§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_PERC$ §G+8%§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_ADD$ §G+12800§!$TABBED_NEW_LINE$-$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$ §G+360§!"
 concept_touhou_difficulty_damage_kamikakushi: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_damage_kamikakushi_desc: "§H受到东方MOD['concept_touhou_difficulty']影响§!: $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×25%§!\n§H在NORMAL及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×50%§!\n§H在HARD及以上的难度§!: $TOUHOU_DIFFICULTY_GUNGNIR_DAMAGE$ §G+难度系数×10%§!$TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×100%§! $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×10%§!\n§H在LUNATIC及以上的难度§!: $TOUHOU_DIFFICULTY_GUNGNIR_DAMAGE$ §G+难度系数×15%§!$TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×50%§! $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×15%§!\n\n§R应用PHANTASM难度后§!: $TABBED_NEW_LINE$—获得更多的加成\n§R启用['concept_touhou_difficulty_wtf']后§!: $TABBED_NEW_LINE$—各方面属性大幅度提升"
 concept_touhou_difficulty_damage_lunar: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_damage_lunar_desc: "§H受到东方MOD['concept_touhou_difficulty']影响§!: $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×25%§!\n§H在NORMAL及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×50%§!\n§H在HARD及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×100%§! $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×10%§!\n§H在LUNATIC及以上的难度§!: $TOUHOU_DIFFICULTY_LINGLI_DAMAGE$ §G+难度系数×75%§! $TOUHOU_DIFFICULTY_LINGLI_FIRERATE$ §G+难度系数×15%§!\n\n§R应用PHANTASM难度后§!: $TABBED_NEW_LINE$—获得更多的加成\n§R启用['concept_touhou_difficulty_wtf']后§!: $TABBED_NEW_LINE$—各方面属性大幅度提升"
 concept_touhou_difficulty_extra_life: "§EDifficulty Modifier§!"
 concept_touhou_difficulty_extra_life_desc: "§HAffected by ['concept_touhou_difficulty'] from touhou mod§!: $TABBED_NEW_LINE$-$mod_ship_spth_extra_life$§G+difficulty factor×1§!$TABBED_NEW_LINE$-$MOD_SHIP_DAMAGE_REDUCTION_ADD$§G+difficulty factor×2§!\n\n§RAfter applying PHANTASM difficulty§!: $TABBED_NEW_LINE$-$mod_ship_spth_armor_efficiency$ §G+1000%§!$TABBED_NEW_LINE$-$mod_ship_spth_shield_efficiency$ §G+1000%§!"
 concept_touhou_difficulty_wtf: "§RDifficulty: Impossible§!"
 concept_touhou_difficulty_wtf_desc: "When §RPHANTASM§! Difficulty is on, while ['concept_touhou_difficulty'] §Gis greater than 8§!, impossible difficulty will be activated. Enemy damage and HP will increase greatly."
 concept_spth_ship_skill_monadic_qerr: "§HReality editing§!"
 concept_spth_ship_skill_monadic_qerr_desc: "利用视界刺针进行现实编辑。\n\n消耗: §R3200§!£sr_fuka£\n冷却：§R720§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!"
 concept_spth_super_carrier_switch_planet_killer_mode: "切换神隐之触输出功率"
 concept_spth_super_carrier_switch_planet_killer_mode_desc: ""
 concept_spth_super_carrier_switch_remote_mode: "§H调整跨星系攻击功率§!"
 concept_spth_super_carrier_switch_remote_mode_desc: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。"
 concept_spth_super_carrier_switch_remote_mode_tooltip: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。\n点击可以在['concept_spth_super_carrier_remote_attack_fleet']、['concept_spth_super_carrier_remote_attack_star']、['concept_spth_super_carrier_remote_attack_star_1']三种攻击模式中轮换。\n当前的攻击模式: [spth_super_carrier_get_remote_mode]"
 spth_super_carrier_remote_mode_1: "['concept_spth_super_carrier_remote_attack_fleet']"
 spth_super_carrier_remote_mode_2: "['concept_spth_super_carrier_remote_attack_star']"
 spth_super_carrier_remote_mode_3: "['concept_spth_super_carrier_remote_attack_star_1']"
 concept_spth_super_carrier_remote_attack_fleet: "§HStrike force§!"
 concept_spth_super_carrier_remote_attack_fleet_desc: "Super Carrier can unleash terrifying energy using its main armament and deal lethal damage to enemy fleets inside the target system. Energy will be precisely guided in this process to prevent accidental damage to nearby celestial bodies in the system.\n\nCooldown: 720£time£"
 concept_spth_super_carrier_remote_attack_star: "§H转化恒星§!"
 concept_spth_super_carrier_remote_attack_star_desc: "\"超级航母的主炮释放的能量不足以彻底摧毁恒星，但撕裂空间的攻击和磅礴的灵力将会席卷整个恒星，使其转化为灵力星体，同时对星系内殖民地造成可怕的伤害。\n\n冷却: 1280£time£"
 concept_spth_super_carrier_remote_attack_star_1: "§H摧毁恒星§!"
 concept_spth_super_carrier_remote_attack_star_1_desc: "超级航母的主炮释放的能量将会引爆恒星，制造一场超新星爆发，引导超新星爆发释放的少量能量来摧毁恒星系中的几乎所有天体，大部分能量则用于彻底熄灭这颗恒星。\n\n冷却: 1800£time£"
 touhou_ship_action_super_carrier_eater_cooldown: "['concept_spth_ship_skill_super_carrier_eater'] cooldown"
 touhou_ship_action_super_carrier_eater_cooldown_tt: "§R超级航母主炮射速：减半§!"
 touhou_ship_action_super_carrier_eater_cooldown_desc: "超级航母的跨星系打击能力正在冷却。"
 concept_ship_hyper_point: "§U月华石§!"
 concept_ship_hyper_point_desc: "击杀不同大小的敌舰可以获得不同数量的['concept_ship_hyper_point']，当['concept_ship_hyper_point']达到§G24§!后，舰船将进入['concept_status_th_hyper']状态。"
 concept_status_th_hyper: "§PFrenzy§!"
 concept_status_th_hyper_desc: "Ships suffer §R+32%§! ['concept_touhou_vulnerable']. In return, they receive:\n$t$§GDoubled§! fire rate of some weapons\n$t$Clear all ['concept_ship_hyper_point']\n$t$Receive damage reduction equal to the §Gmax shield§!, last 2£time£\n$t$Can't get ['concept_ship_hyper_point'] in duration\nThis status will last £time£"
 concept_psionic_inhibitor: "灵能抑制器"
 concept_psionic_inhibitor_desc: "更先进的灵能抑制器能够有效的抑制大多数的灵能活动模式，从而逐渐阻断星系内的灵能光环等灵能活动影响，抑制灵能光环的扩散，甚至让灵能物种缓慢的失去灵能能力。\n\n面对某些§M危害性的灵能活动§!，其完全不会被腐化，同时表现出显著的抑制效应。"
 concept_psionic_burster: "灵能增幅器"
 concept_psionic_burster_desc: "灵能增幅器能够有效的增强大多数的灵能活动模式，从而逐渐增强星系内的灵能光环等灵能活动影响，加强灵能光环的扩散，甚至让无灵能物种缓慢的获得灵能能力。\n\n面对某些§P灵能抑制效应§!，其仍然可以生效。"
 concept_touhou_vulnerable: "Vulnerable"
 concept_touhou_vulnerable_desc: "Affected ships take more damage. This modifier can cancel with damage reduction."
 concept_touhou_psionic_conduit_ancient_titan_action: "灵力能源供应"
 concept_touhou_psionic_conduit_ancient_titan_action_desc: "为古代文明的舰船传输灵力，使其作战能力进一步增强。\n\n对于当前舰队中可以从灵能导管接受能源供给的舰船:\n$t$灵能导管供能时长 §G+5§!\n$t$灵能导管冷却时长 §G-25%§!\n$t$该状态持续时，需要为古代舰船提供额外的$r_sr_lingli$与$r_sr_fuka$维护费。"
 concept_touhou_psionic_conduit_ancient_titan_action_alt: "§R停止灵力能源供应§!"
 concept_touhou_blood_slash: "猩红斩击"
 concept_touhou_blood_slash_desc: "附带了猩红斩击的攻击将使得被命中的舰船陷入['concept_touhou_bleeding',流血状态]，持续§G3-5§!£time£。"
 concept_touhou_bleeding: "Bleeding"
 concept_touhou_bleeding_desc: "Ships affected by bleeding will lose hull and armor over time. However, such damage won't destroy a ship directly."
 concept_touhou_sunbeam: "星光射线"
 concept_touhou_sunbeam_desc: "生成一道隙间裂口，从星系黄道面上方召来一道魔炮光束，对敌人造成一定量的护盾伤害，该伤害可以受到$mod_weapon_type_spark_weapon_damage_mult$与$mod_weapon_type_lingli_weapon_damage_mult$的少量加成。"
 concept_touhou_cleanse: "Purification"
 concept_touhou_cleanse_desc: "Clear ship ['concept_touhou_echo',Echoing] and ['concept_touhou_bleeding',Bleeding], and gain temporary hitpoints based on damage dealt by this attack."
 concept_touhou_constraint: "Sealed"
 concept_touhou_constraint_desc: "Ships affected by Sealed will have sublight speed significantly decreased, with minor decreases in evasion chance and fire rate."
 concept_touhou_echo_strike: "Echoing Strike"
 concept_touhou_echo_strike_desc: "附带了回响打击效果的攻击将使得被命中的舰船陷入['concept_touhou_echo',回响状态]，持续3-5£time£。"
 concept_touhou_echo: "Echoing"
 concept_touhou_echo_desc: "For ships affected by echo status, when taking attack again from the same source, they will receive armor damage after a short time and clear echo status."
 concept_touhou_bombardment_ruin_fortress: "轨道轰炸摧毁堡垒权重"
 concept_touhou_bombardment_ruin_fortress_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的削弱星球防御。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£有概率对星球上的一座['concept_touhou_fortress']造成连带伤害，使其被摧毁，该概率取所有轨道舰船提供的权重之和除以§Y10000.00§!。\n对于§G大于100%§!的概率，会继续§G额外的判定§!，直到剩余概率被消耗完。"
 concept_touhou_bombardment_kill_army: "轨道轰炸击杀陆军权重"
 concept_touhou_bombardment_kill_army_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的打击星球陆军。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£有概率对星球上的一支§H陆军§!造成§R致命伤害§!，该概率取所有轨道舰船提供的权重之和除以§Y10000.00§!。\n对于§G大于100%§!的概率，会继续§G额外的判定§!，直到剩余概率被消耗完。"
 concept_touhou_bombardment_damage_army: "轨道轰炸造成的范围陆军伤害"
 concept_touhou_bombardment_damage_army_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的打击星球陆军。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£可以对§G10%-25%§!的敌方陆军造成一定的连带伤害，该伤害取所有轨道舰船提供的伤害平均值。"
 concept_touhou_fortress: "Fortress Buildings"
 concept_touhou_fortress_desc: "Including these buildings:\n -$building_stronghold$\n -$building_fortress$\n -$building_fe_fortress$\n -$building_fe_stronghold$\n -$building_military_academy$\n -$building_planetary_shield_generator$\n -$building_spth_police_station$\n -§PAdvanced Fortress Cluster§!"
