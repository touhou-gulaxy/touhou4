 concept_touhou_aoe_damage_gravity_cannon_lunar_03a: "§E范围伤害§!"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03a_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_gravity_cannon_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03ag: "§E范围伤害§!"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03ag_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_gravity_cannon_extra_large_cooldown$§!£time£。"
 concept_doremy_level: "§Y梦境等级§!"
 concept_doremy_level_desc: "§L在深层的梦境里，哆来咪会发挥更强的实力。§!\n\n哆来咪的梦境等级为§Y0.00§!时，为其指挥的舰队增加§Y64.00§!点能够阻隔固定伤害的屏障。\n每增加§Y1.00§!层梦境等级，都会提升该屏障§Y32.00§!点抗性。\n当哆来咪进入['concept_doremy_owner']或者眩晕状态时，将转化为食梦等级。"
 concept_doremy_owner: "§U梦境主宰者§!"
 concept_doremy_owner_desc: "§L作为梦境世界的支配者，她能够消灭、创造、替换一切生物的梦境。§!\n\n清除全部的梦境等级，并且转化为食梦等级；如果进入眩晕状态，则将当前的梦境等级转化为食梦等级。\n哆来咪将为其指挥的舰队增加§Y200.00§!点能够阻隔固定伤害的屏障。\n并且每§Y30.00§!£time£，都会追加召唤一队§H梦境实体§!，梦境造物§R不可能受到任何伤害§!，但只能存在最多§Y60.00§!£time£。"
 concept_touhou_accuray: "精准"
 concept_touhou_accuray_desc: "精准的伤害无法被任何手段闪避，必定会命中。"
 concept_touhou_barrier: "临时结界"
 concept_touhou_barrier_desc: "临时结界能够为我方舰船增加§H额外的护盾§!，该护盾可以§H超过§!舰船的§Y最大护盾值§!\n最多可以使得舰船的护盾达到相当于最大护盾值的§Y200.00%§!"
 concept_touhou_block: "格挡"
 concept_touhou_block_desc: "在持续时间内，能够阻挡固定值的伤害。"
 concept_touhou_frigile: "脆弱"
 concept_touhou_frigile_desc: "进入脆弱状态的舰船，其所受到的伤害将会额外增加固定值。\n脆弱属性值可以受到§Y100.00%§!的§Y灵力伤害加成§!。"
 concept_utsuho_bonus: "§P伤害加成§!"
 concept_utsuho_bonus_desc: "增益自身的伤害加成，每获得§Y1.00%§!的['concept_utsuho_bonus']，所有的来源伤害加成都会提升§Y1.00%§!。例如具有§Y1000.00%§!的能量武器伤害加成与§Y100.00%§!的['concept_utsuho_bonus']，则额外获得§Y1000.00%§!的能量伤害加成。\n支持的伤害类型：§I能量§!、§I动能§!、§I灵力§!、§I引力武器§!、§I灵能武器§!、§I灵能抑制武器§!与§R冈格尼尔§!等东方MOD的武器类型。"
 concept_touhou_hull_repair_percent: "§E战时每日船体再生§!"
 concept_touhou_hull_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大船体值§!§G固定比例§!的£hit_points£船体，该再生可以§G超出§!最多§Y100.00%§!的最大船体值。"
 concept_touhou_armor_repair_percent: "§E战时每日装甲再生§!"
 concept_touhou_armor_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大装甲值§!§G固定比例§!的£armor£装甲，该再生可以§G超出§!最多§Y100.00%§!的最大装甲值。"
 concept_touhou_shield_repair_percent: "§E战时每日护盾再生§!"
 concept_touhou_shield_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大护盾值§!§G固定比例§!的£shield£护盾，该再生可以§G超出§!最多§Y100.00%§!的最大护盾值。该修复§Y不会受到§!§H护盾过载§!产生的§R再生停用§!影响，在护盾过载后仍然可以正常修复，不需要额外充能时间。"
 concept_touhou_weapon_emp_charge: "§E改装器：电磁脉冲充能§!"
 concept_touhou_weapon_emp_charge_desc: "使得§H武器命中时§!额外施加以下效果：\n\n累积§Y1.00§!层§E电磁脉冲干扰§!，降低敌方的航速与武器伤害。\n§E电磁脉冲干扰§!达到§Y8.00§!层时，受到§R大量护盾伤害§!。\n§E电磁脉冲干扰§!达到§Y16.00§!层时，将会被暂时['concept_terrify',§R瘫痪§!]§Y1.00-3.00§!£time£。\n\n进入['concept_terrify',§R瘫痪状态§!]的舰船在§R18.00§!£time£内无法被再次施加§E电磁脉冲干扰§!。"
