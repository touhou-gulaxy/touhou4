 councilor_ruler_th_miko: "Shrine Maiden"
 councilor_ruler_th_miko_female: "$councilor_ruler_th_miko$"
 councilor_ruler_th_miko_desc: "Once, the shrine maiden is in charge of the Great Hakurei Barrier and protects Gensokyo. Gensokyo will turn into a uninhabitable hell if the Great Hakurei Barrier collapses, whether from the outside or the inside.\nTherefore, even in the reinvented Gensokyo, the authority of the shrine maiden is still widely acknowledged."
 councilor_spth_eirin: "Hourai drug vendor"
 councilor_spth_eirin_desc: "负责管理幻想乡制药相关的工作与研究，也给人类和妖怪送药。关于从何处学到一身医药知识的，为什么会制妖怪的药，在开药店之前是干什么的，无法知道的很多。"
 councilor_spth_satori: "Detective Satori"
 councilor_spth_koishi: "Unconscious Youkai"
 councilor_spth_koishi_tt: "当古明地恋任职该内阁时，她将获得特殊效果。"
 councilor_spth_satori_desc: "负责监视地底的家伙，防止他们出现在地上，也会作为侦探出面调查旧地狱的各种事件。由于自身读心的能力，能够很好的管理怨灵，也可以与动物们交流，并且和她在一起的宠物会逐渐变强，成为强大的妖怪。"
 councilor_spth_koishi_desc: "恋一直处于无意识的状态，以至于她本人也不知道接下来她自己会做什么，无心无欲地顺从着周遭的环境生活着，就像随风飘舞的布片一般，没有任何目的，仅仅只是在周围四处游荡。"
 councilor_spth_satori_allow: "§R只有觉妖怪能够胜任该内阁职位§!"
 councilor_spth_hiffu: "Rift research manager"
 councilor_spth_hiffu_desc: "$TITLE$'s duty is to explore"
