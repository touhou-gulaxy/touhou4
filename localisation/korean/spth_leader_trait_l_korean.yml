 leader_trait_sp_leader_anti_cap_tooltip: "\n§YBy performing an emergency retreat of fleet, they can't be captured by boarding squads.§!"
 spth_leader_recruit.name: "§E[spth_leader_recruit_temp.get_spth_leader_title]§! [spth_leader_recruit_temp.GetName]"
 spth_leader_recruit.desc: "This leader is recorded in §EGensokyo Chronicle§!, which is written by 9th \"Child of Miare\" -- Hieda no Akyuu.\nThe Fantasy Recollections bring her back to us.\n\n§H[spth_leader_recruit_temp.get_spth_leader_background_job]§!\n$t$§L[spth_leader_recruit_temp.get_spth_leader_desc]§!"
 spth_leader_recruit.a: "Welcome back to [This.GetName]!"
 leader_trait_tenshi: "Mistress of Bhavaagra"
 leader_trait_tenshi_desc: "Once the eldest daughter of the Hinanawi clan, she ascended into heaven and became celestials along with the Hinanawi clan. However, because she became celestials by serving the Nawi clan, as opposed to training, she lacked the reputation or discipline expected of a celestial and hence was labeled as \"delinquent\" celestials. Her Sword of Scarlet Thought adapts to the opponent's vulnerabilities by taking specific forms of weather and striking them accurately."
 leader_trait_tenshi_tt_1: "\n§HImprove accuracy and tracking based on level.\nAt the start of battle, deal damage to the enemy fleet depending on the ship size and improve ally fleet regen. Last 1-9£time£.§!"
 leader_trait_tenshi_tt_2: "\n§HWhen cosmic storms or $SCARLET_WEATHER$ are present: Improve the damage and fire rate of Spirit Power weapons depending on the level.§!"
 leader_trait_yuza: "Flower Master of the Four Seasons"
 leader_trait_yuza_desc: "Yuuka Kazami lives in the Garden of the Sun, and if anyone disturbs her, be they youkai or human, she eliminates them with tremendous power no matter what. Her ability to manipulate flowers is something to the extent of being able to make flowers bloom, shift sunflowers to face towards the sun, or restore withered flowers. During the fights, she uses her umbrella and scatters flower petals to perform graceful attacks; she usually performs overwhelming physical attacks rather than relying on youkai abilities or magic to perform spiritual attacks"
 leader_trait_eirin: "Brain of the Moon"
 leader_trait_eirin_desc: "Eirin Yagokoro is among one of the Tsukuyomi's relatives that he had utmost trust in. Eirin Yagokoro has lived even longer than Tsukuyomi. When he moved to the moon and built the capital, the one he relied on the most was Eirin Yagokoro.\nLong ago, Eirin was one of a party of messengers who were sent to bring Kaguya back to the moon; the crime for which she was exiled to Earth had been forgiven. For some reason, she helped Kaguya kill all the other messengers instead. She finally built Eientei and lived together with Kaguya in it."
 leader_trait_eirin_skill: "\n§HIt has seen the sky and the stars beyond, and it has seen the Earth and the end of days.\nShe knows something §Pspecial§!.§!"
 leader_trait_mokou: "Phoenix of Hourai"
 leader_trait_mokou_desc: "Ever since she drank the Hourai Elixir, Mokou possessed the ability of eternal youth and immortality. In her long life, she mastered various kinds of sorcery and is capable of manipulating fire, bringing her to the point in which she can handle youkai lightly."
 leader_trait_mokou_skill: "\n§H不死鸟的舍身击\n\n指挥军用舰队时:\n$mod_ship_spth_extra_life$触发时，对敌方造成§R一定§!的护盾伤害\n同时增加当前船体值*100%的临时船体值\n\n指挥陆军时:\n被击杀的东方特殊陆军有概率降级为§G1§!支较低级的陆军\n同时回收少量资源§!"
 leader_trait_reisen: "Lunatic Red Eyes"
 leader_trait_reisen_desc: "Reisen, as a moon rabbit, the ability to sense and manipulate waves and picking up \"ESP waves\" of other moon rabbits, no matter how far they are. With perfect practice of her abilities, she can easily hide herself and distracting others, or creating hallucinations and attacking enemies in combat."
 leader_trait_reisen_skill: "\n§HMilitary Fleets in Combat:\n-Chance to clear all enemy range buff.\n-Act as FTL inhibitor and disable enemy from retreat\n-Lasts for 180£time£§!"
 leader_trait_kaguya: "The Sinner of Eternity and the Instantaneous"
 leader_trait_kaguya_desc: "Kaguya was once a princess of the Lunarians of the Lunar Capital on the Moon before she was exiled to Earth. After she killed emissaries from the Moon, she had since hidden in Eientei inside the Bamboo Forest of the Lost during the following thousand years, and finally came out of hiding after the Eternal Night Incident.\nHer ability is Manipulation of eternity and the instantaneous. The spell of eternity she cast stops the flow of history and rejects any impurity or change. Even if anything happened, it's still the same as if time stopped."
 leader_trait_kaguya_skill: "\n§H能够保护所管理的星球免受轨道轰炸前§G90§!£time£的伤害\n对于星域内的星球持续时间减半，冷却360£time£\n管理的星域存在宇宙风暴或$SCARLET_WEATHER$时每个月将会修复一次破坏度。§!"
 leader_trait_yuza_skill: "\n§H指挥军用舰队进入战斗后:\n增幅§G100%-200%§!魔炮伤害，该增益可受到循环科技影响\n持续时间：自身技能等级*2£time£，最长30£time£\n冷却时间：90£time£§!"
 leader_trait_shikieiki: "Supreme Judge of Paradise"
 leader_trait_shikieiki_desc: "拥有明鉴黑白程度的能力，用非常复杂而全面的标准来判断善恶，涵盖从案件的成立到有关人员的成长史等等内容。她的净玻璃之镜，用这面镜子映照受审者，受审者过去的一切言行都将在镜中得到再现，毫无隐私可言。"
 leader_trait_shikieiki_skill: "\n§HShe possesses a formidable power.§!"
 leader_trait_komachi: "Guide of the Sanzu River"
 leader_trait_komachi_desc: "担任三途河的摆渡人一职的死神，负责把渡河的方法告诉死者们，这方法便是给她“钱”（即摆渡钱）来请她摆渡。同时可以放出与操控怨灵、地缚灵、浮游灵、紧缚灵、恶灵等多种幽灵，不过这些其实是滥用职权的技能。"
 leader_trait_komachi_skill: "\n§H指挥军用舰队进入战斗后:\n释放出可存在20£time£的幽灵协助己方作战，冷却180£time£"
 leader_trait_lilywhite: "\"Spring-Welcoming Dance\""
 leader_trait_lilywhite_desc: "拥有告知春天到来程度的能力，能让花的种子生长盛开，并且在传递春天来临的消息的时候最具力量。在春天来临之际能觉察到普通人未注意到的细节，但是不能在春天以外的季节自由行动，因此会积攒压力。"
 leader_trait_lilywhite_skill: "\n§H在春季时会提供强大加成，其他季节则会积攒信仰压力。§!"
 leader_trait_kokoro: "Hopeless Masquerade"
 leader_trait_kokoro_desc: "秦河胜使用的66个面具被长久放置后化成的付丧神，拥有操纵感情程度的能力，组成她的每个面具都代表固定的感情，戴上面具后她本人感情就会随之变化，同时也会影响到附近的人。"
 leader_trait_kokoro_skill: "\n§H指挥军用舰队进入战斗后:\n随机一种面具为己方舰船加成60£time£，对敌方进行抑制\n随机§G1-3§!个面具凭依于部分舰船上，持续10£time£，冷却30£time£\n面具凭依持续时间结束后:\n若被凭依的舰船被击毁，被凭依的舰船会受到面具对应效果10£time£加成\n若未被击毁，未被凭依的舰船会受到面具对应效果10£time£加成\n\n当所在星系内存在由$NAME_koishi$指挥的军用舰队时:\n概率两支舰队获得额外60£time£秦心面具加成\n§R但是有小概率发生非常可怕的事情§!§!"
 leader_trait_cirno: "Fairy of Ice"
 leader_trait_cirno_desc: "baka baka?\nCirno is the strongest! ...?"
 leader_trait_cirno_baka: "bakabakabaka"
 leader_trait_cirno_baka_desc: "这个领袖是连1+1都能算成⑨的超级笨蛋\n不过因为她批阅文件很快，殖民地的建设效率似乎提升了。。吗？"
 leader_trait_koishi_skill: "\n§H指挥军用舰队进入战斗后:\n使得该舰队免疫来自$th_ship_part_koishi$的压制\n随机选择以下效果触发：\n神游:将星系内敌方舰队强制牵引至20～100的范围内，冷却60£time£\n本我:舰队射程修正+100%，灵力武器射速修正+50%，持续60£time£\n平静:32£time£内每4£time£随机修复己方的船体或者装甲，冷却60£time£\n热情:敌我双方获得§G+100%§!['concept_touhou_vulnerable']，持续60£time£\n\n对敌方舰队:\n§P「梅莉小姐的电话」§!\n以一定概率击杀敌方舰队司令\n该概率受到恋恋与敌方舰队司令的领袖等级影响\n$leader_trait_koishi_skill_ag$§!"
 leader_trait_koishi_skill_ag: "§PGensokyo, Ancient Civilization and Shroud Invaders are immune to this effect§!"
 leader_trait_koishi_skill_msg: "When directing $TH_FLEET_NAME|Y$, Commander $TH_LEADER_NAME|Y$ was overwhelmed during the crushing assault on subconsciousness by Manipulation of the Unconscious Mind. From behind, §EKoishi Komeiji§! took form and struck the fatal blow."
 spth_koishi_kill_leader_message: "§EEGO Youkai of Unconsciousness§!"
 leader_trait_koishi_skill_msg_self: "When directing $TH_FLEET_NAME|Y$, Commander $TH_LEADER_NAME|Y$ was overwhelmed during the crushing assault on subconsciousness. §EKoishi Komeiji§! took advantage of her ability, sneaked into the bridge, and finished the assassination under these unaware guards."
