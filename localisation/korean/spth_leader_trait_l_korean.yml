 leader_trait_spth_subclass_sp_tt: "Require selecting $subclass_commander_general$ to activate effects for armies."
 leader_trait_marisa_tt: "所在舰队获得相当于§Y能量武器伤害§G50%§!的魔炮伤害加成"
 leader_trait_maribel_hearn: "Dr. Latency's Unsettling Eye"
 leader_trait_maribel_hearn_desc: "灵异社团“秘封俱乐部”的成员之一，她的家族似乎从前就是灵感很强的一族，她也能够自然的看到世界中的结界，也就是那些境界线。也因此，正在和宇佐见莲子一同进行着在科学世纪探寻遍布四处的结界的活动。"
 leader_trait_renko: "Magician of Starry Sky"
 leader_trait_renko_desc: "灵异社团“秘封俱乐部”的成员之一，似乎具备着看见星星便知晓目前的时间，看见月亮便知晓目前的所在地的能力，最近在做弦论方面的研究。也因此，正在和梅莉一同进行着在科学世纪探寻遍布四处的结界的活动。"
