l_russian:
 spth_word_concept_ap_hm3: "HellSing"
 spth_word_concept_ap_hm3_desc: "$ap_hm3_desc$\nThis passage is from the European medieval alchemical manuscript \"The Ripley Scroll\"."
 spth_word_concept_armor_shield_efficiency: "Shield/Armor Efficiency"
 spth_word_concept_armor_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$/$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾/装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_ship_weapon_tuning: "Weapon calibration"
 spth_word_concept_armor_ship_weapon_tuning_desc: ""
 spth_word_concept_weapon_use_target: "Weapon retargeting"
 spth_word_concept_weapon_use_target_desc: "This determines whether this weapon retargets enemy because other weapon will kill target prior to this weapon, causing a waste of damage.\nEnabling this might increase valid damage under some circumstances, as targeting efficiency is increased(to avoid wasting damage). But this also lowers firing rate as more time taken for retargeting.\nDisabling this cause weapon to keep firing at any time instead of retargeting to prevent wasting damage. As mentioned above, this causes invalid damage(wasting damage on those died).\nMost vanilla and modded weapons are defaulted to enable."
 spth_word_concept_shield_efficiency: "§GShield efficiency§!"
 spth_word_concept_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_efficiency: "§GArmor efficiency§!"
 spth_word_concept_armor_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 concept_spth_genso_industry: "Gensokyo Special Industry"
 concept_spth_genso_industry_desc: "The ['concept_spth_genso_district',Special Districts], ['concept_spth_special_building',Special Buildings] and ['concept_spth_common_building',Common Buildings] of ['authority:auth_gensokyo'] provide more powerful production.\nThis industry system relays on ['concept_spth_barrier_overloaded',Planetary Barrier] and ['concept_spth_faith_strength',Faith], and the ['concept_spth_barrier_overloaded'] and ['concept_spth_faith_strength_pressure',Faith Overload] can produce positive and negative effects.\nMeanwhile the ['civic:origin_spth_story_gensokyo'] will have more powerful technologies and production.\n\nThere exist two economic systems in this mod, Gensokyo City and Gensokyo Planet. Gensokyo Cities mainly relies on jobs provided by the district for output, with a positioning similar to Ecumenopolis. And Gensokyo Planets have a relatively complex output maintenance formula, and output balancing must be performed manually."
 concept_spth_genso_district: "Gensokyo Special Districts"
 concept_spth_genso_district_desc: "['authority:auth_gensokyo']的星球区划，大体上分为幻想城区划、幻想星区划、通用区划、灵力生产区划。\n幻想星区划需要依赖某些因素增加区划产出，如['district:district_gensokyo_misty_lake']；而幻想城区划则提供岗位进行产出，如['district:district_gensokyo_jiqiao']。此外，['district:district_spth_sp_produce']在幻想星上同样享受幻想星的产出公式。\n\n通用区划中的['district:district_spth_generic_factory']根据不同的殖民地规划提供不同类型的岗位，灵力生产区划则是任意星球类型可用的区划。"
 concept_spth_special_building: "Gensokyo Special Buildings"
 concept_spth_special_building_desc: "['authority:auth_gensokyo']的星球副首府建筑(['building:building_spth_eientei'], ['building:building_spth_barrier_manager'], ['building:building_spth_kappa_labor_union'], ['building:building_spth_hakurei_shrine'], ['building:building_spth_moriya_shrine'])，以及会产生$mod_planet_barrier_capacity_use$的特殊建筑。大部分特殊建筑都会提供1个提供特定产出加成修正的特殊岗位。"
 concept_spth_common_building: "Gensokyo Common Buildings"
 concept_spth_common_building_desc: "['authority:auth_gensokyo']的普通量产建筑，产能相较['concept_spth_special_building']较高，但是不提供额外提供产出修正的岗位。"
 concept_spth_designation_construction: "§BTouhou Stellar Chronicles§!: $planet_automation_designation_construction$"
 concept_spth_designation_construction_desc: "Allow automatic construct of ['concept_spth_genso_industry'] to fit planet specialization. When there's no empty job, or unemployed pop has appropriate strata to work for the desired job, corresponding building and district will be built.\n\nThis mod of planet automation can automatically construct the buildings and districts from mod §BTouhou Stellar Chronicles ~ Symphony of Phantasmag§!\n§BBuilding construct plan§!:\n$t$ ['building:building_spth_cloner']: Only one ['building:building_spth_cloner'] will be constructed. $mod_planet_barrier_capacity_use$ on the planet will not exceed $mod_planet_barrier_capacity_add$.\n$t$ ['concept_spth_special_building']:\n$tt$ §LAssistant Planetary Capital§!: Construct appropriate Assistant Planetary Capital based on designated colony type.\n$tt$Special buildings: will be constructed based on the colony type, while ensuring $mod_planet_barrier_capacity_use$ of planet will not exeed $mod_planet_barrier_capacity_add$.\n$t$ ['concept_spth_common_building'] and ['concept_spth_genso_district']: constructed based on colony type."
 concept_spth_gensokyo_sp_trait: "§B$leader_trait_sp_leader$§!"
 concept_spth_gensokyo_sp_trait_desc: "$leader_trait_sp_leader_desc$"
 concept_ship_spth_extra_life: "§PExtra Life§!"
 concept_ship_spth_extra_life_desc: "After a ship is destroyed, you can consume a residual machine to revive it (specifically triggered when the hull stability is less than §Y1%§!). \nThe cost is that the ship's firepower will be reduced for a certain period of time according to the value of ['concept_ship_spth_extra_life_power_down']. \n\nEach residual machine will take 180 days to recover naturally after being consumed."
 concept_ship_spth_extra_life_power_down: "§ELife loss penalty§!"
 concept_ship_spth_extra_life_power_down_desc: "Determines the extent to which the ship's damage is reduced after being disabled. The maximum reduction is §Y90%§! of the ship's damage and §Y修正§!."
 concept_spth_start_select_leaders: "Gensokyo starting leaders"
 concept_spth_start_select_leaders_desc: "You start the game with a set of leaders from factions within gensokyo. They possess various powerful traits and abilities."
 concept_ship_toyohime_instant_kill: "Toyohime's fan"
 concept_ship_toyohime_instant_kill_desc: "Toyohime's fan is capable of purifying everything into elementary particles.\n\nDuring battle:\nDamage dealt by this weapon will §Rsignificantly increase§!\nReturn to normal after killing a number of ships."
 concept_weapon_type_th_toyohime: "§BFan of Lunar§!"
 concept_weapon_type_th_toyohime_desc: "$concept_ship_toyohime_instant_kill_desc$"
 concept_spth_ship_skill: "§BSpecial Actions§!"
 concept_spth_ship_skill_desc: "Some ships have ['concept_spth_ship_skill'] that allow manual execution, and you can open the menu of ['concept_spth_ship_skill'] through fleet view.\nFor common ships ['concept_spth_ship_skill'] is only available with Gensokyo reactors."
 concept_spth_ship_skill_yuyuko: "§HEternal Sleep in Dreamland§!"
 concept_spth_ship_skill_yuyuko_desc: "Summon a ghost fleet which will be §Gtargeted first§! and §Gharder to destroy§! to assistant combat, and the fleet will disappear after §G12§!£time£.\n\nCost: §R1000§!£sr_fuka£\nCooldown: §R360§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_satori: "§HEyesight of Truth§!"
 concept_spth_ship_skill_satori_desc: "Force all enemy ships within the system where the ship is located §G2 jumps§! nearby to forcibly disable their cloaking equipment, and they will be apply §Gnegative modifiers§!.\n\nCost: §R2000§!£sr_fuka£\nCooldown: §R180§!£time£\n§HThe cooldown for this skill is §Gindependent for each fleet§!."
 concept_spth_ship_skill_reimu: "§HFantasy Dimensional Rift§!"
 concept_spth_ship_skill_reimu_desc: "The fleet can jump to §Gall reachable systems§! in a short time with the Dimensional Rift.\n\nCost: §R3200§!£sr_fuka£\nCooldown: §R360§!£time£\n§HThe cooldown for this skill is §Gindependent for each fleet§!."
 concept_spth_ship_skill_scarlet: "§HSpear of Scarlet Stars§!"
 concept_spth_ship_skill_scarlet_desc: "Provide $weapon_type_gungnir$ Damage: +50% * spiritual power weapon damage.\n\nCost: §R2400§!£sr_fuka£\nCooldown: §R240§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_sanae: "§HNight with Overly Bright Guest Stars§!"
 concept_spth_ship_skill_sanae_desc: "Temporally invalidate §Gmost of§! shields of enemy fleets at the cost of §R50%§! shield energy.\n\nCost: §R5600§!£sr_fuka£\nCooldown: §R270§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_sanae_shrine: "§HDimensional Cloaking System§!"
 concept_spth_ship_skill_sanae_shrine_desc: "With the ability to cause miracles, we can hide the giant space fortress into the dimensional wrinkles.\n\nCost: §R6400§!£sr_fuka£\nCooldown: §R360§!£time£\n§KUse this action again to disable cloaking§!."
 concept_spth_ship_skill_yukari: "§HBorder of Phantasm§!"
 concept_spth_ship_skill_yukari_desc: "Able to projection the phantom of the fleet onto far systems, but the damage taken by the phantom fleet will sync to the real fleet.\n\nCost: §R4800§!£sr_fuka£\nCooldown: §R720§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_space_shrine_drive: "§HOverclocking Jump Driver§!"
 concept_spth_ship_skill_space_shrine_drive_desc: "By overclocking $spth_space_shrine_station_ftl$, our space fortress is able to perform continuously jump drive within 90 £time£.\n\nCost: §R1000§!£sr_fuka£\nCooldown: §R360§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_super_carrier_eater: "§HStarfall - Ultimate Nirvana§!"
 concept_spth_ship_skill_super_carrier_eater_desc: "Open a Gap portal with the Gap driver of the super carrier, we are able to perform accurate and deadly strike to enemy fleets in the far systems, and this process will not damage the planets in target systems.\n\nCost: §R19200§!£sr_fuka£\nCooldown: §R1080§!£time£\n§HThe cooldown for this skill is §Rshared among all fleets§!."
 concept_spth_ship_skill_space_shrine_beacon: "§HGap Jump Drive System§!"
 concept_spth_ship_skill_space_shrine_beacon_desc: "$spth_space_shrine_station_ftl$ is capable of creating multiple large Gap rifts, enabling other fleets inside the system to perform hyperspace jumps together.\n\nCost: §R17000§!£sr_fuka£\nCooldown: §R200§!£time£\n§LUse jump after activating skill to trigger effect§!\n§HThe cooldown is §Rshared across fleets§!"
 TOUHOU_DIFFICULTY_LINGLI_FIRERATE: "$TABBED_NEW_LINE$-$mod_weapon_type_lingli_weapon_fire_rate_mult$"
 TOUHOU_DIFFICULTY_LINGLI_DAMAGE: "$TABBED_NEW_LINE$- $mod_weapon_type_lingli_weapon_damage_mult$"
