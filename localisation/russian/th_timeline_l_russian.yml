l_russian:
 timeline_story_barrier_break: "§UFall of the Barrier§!"
 timeline_story_barrier_break_tp: "§HFall of the Barrier§!\n§YHistorical Events§!\n\nThe Great Hakurei Barrier was collapsed since [GetDate]. Gensokyo and the Outside World is finally connected."
 timeline_story_barrier_break_text: "Great Hakurei Barrier starts to collapse: [GetDate]"
 timeline_lunar_capital_history_1: "§BFallen Lunar Capital§!"
 timeline_lunar_capital_history_1_tp: "§HFallen Lunar Capital§!\n§YHistorical Events§!\n\nLunar Capital left the moon for an unknown reason: circa [GetDate]."
 timeline_lunar_capital_history_1_text: "Approximate date of the Fall of the Lunar Capital: [GetDate]"
 timeline_story_barrier_torifune_shielded: "§UShielded Torifune§!"
 timeline_story_barrier_torifune_shielded_tp: "§HFall of the Barrier§!\n§YHistorical Event§!\n\nWe begin to prepare for disabling the spirit power barrier on Torifune on [GetDate]."
 timeline_story_barrier_torifune_shielded_text: "Ready to disarm shield on Torifune: [GetDate]"
 timeline_lunar_capital_history_2: "§BBarrier on the moon§!"
 timeline_lunar_capital_history_2_tp: "§HFallen Lunar Capital§!\n§YHistorical Event§!\n\nOn [GetDate], we found the secret buried inside the lunar barrier: Lunar Capital has been forced into exile by the attack of an unknown faction."
 timeline_lunar_capital_history_2_text: "[GetDate], getting closer to the truth?"
 timeline_lunar_capital_history_3: "§BRelay - Union§!"
 timeline_lunar_capital_history_3_tp: "§HFallen Lunar Capital§!\n§YHistorical Event§!\n\nBy analyzing legacy data, our scientists entered a Lunar Capital barrier on [GetDate]. This should be a relay of the Lunar Capital."
 timeline_lunar_capital_history_3_text: "Discovery of the Union system: [GetDate]"
 timeline_lunar_capital_history_4: "§BJump Gate§!"
 timeline_lunar_capital_history_4_tp: "§H陨落月都§!\n§Y里程碑§!\n\n[GetDate]，我们的科研船进入时发现了神奇的月都巨构，跃迁星桥，据信月都依靠此来实现快速的点到点移动。"
 timeline_lunar_capital_history_4_text: "Discovery of Jump Gate: [GetDate]"
 timeline_lunar_capital_history_5: "§BHostile Fleet§!"
 timeline_lunar_capital_history_5_tp: "§H陨落月都§!\n§Y遭遇威胁§!\n\n随着覆盖星球表面的护盾被解除，我们检测到了一股独特的能源信号，同时探测到星球地表上有一只小型舰队正在起飞。我们无论如何呼叫对方都不予理睬...从他们采取的行动上看，似乎来者不善..."
 timeline_lunar_capital_history_5_text: "Hostile Garrison: [GetDate]"
 timeline_lunar_capital_history_6: "§B撤离地§!"
 timeline_lunar_capital_history_6_tp: "§H陨落月都§!\n§Y里程碑§!\n\n这颗星球的护盾之下，与另一个位面的存在发生了交换，这似乎是月之都某种用来进行第二道保险的技术。但以我们目前的技术，完全无法使得两个位面之间重新发生空间交换，何况这理论上需要巨量的能源。不过好消息是我们发现了解除跃迁星桥锁定的方式。"
 timeline_lunar_capital_history_6_text: "New clues about Lunar Capital: [GetDate]"
 timeline_lunar_capital_history_7: "§B寂静孤星§!"
 timeline_lunar_capital_history_7_tp: "§H陨落月都§!\n§Y历史事件§!\n\n我们穿越了跃迁星桥，经历了其中光怪陆离的景象后，进入了一片古老而衰败的星域。在其中巨大的环形装置与红巨星之间的区域分布着大大小小的残骸，这里无数岁月之前似乎爆发过激烈的战斗。"
 timeline_lunar_capital_history_7_text: "Discovery of Aethon system: [GetDate]"
 timeline_lunar_capital_history_8: "§BAncient Buildings§!"
 timeline_lunar_capital_history_8_tp: "§H陨落月都§!\n§Y历史事件§!\n\n在清理环形装置上的古代城市残骸时，我们发现了一座保存较为良好的月都大型建筑，当地政府随即组织了初步探索。而对其周边环境的调查表明，这座古代建筑应该是一座档案馆。不过这座设施的入口已经牢牢封死，构成这座建筑外墙的材料也非常坚固，同时当地政府并不想破坏这座建筑，我们或许应该派遣专门团队去尝试破解。"
 timeline_lunar_capital_history_8_text: "Discovery of ancient archive: [GetDate]"
 timeline_lunar_capital_history_9: "§BHistory of Aethon§!"
 timeline_lunar_capital_history_9_tp: "§H陨落月都§!\n§Y历史事件§!\n\n我们的科研团队根据数据库索引确定档案馆中记载了一些月之都的历史。\n\n与月都交战的文明因领土与理念争端多次与月都发生交战，月都最初还能依靠自身的科技优势进行抵抗，但随着未知文明对于星界技术的开发利用，月都面对能够灵活跃迁机动的敌人逐渐难以招架。\n\n袭击了月球的舰船为未知文明曾经部署的自动化隐身巡游舰，一旦月都结界出现波动，这些舰船就会部署某种纯化的污秽存在突破结界发动进攻，并且不断的进行追猎。"
 timeline_lunar_capital_history_9_text: "Discovery of ancient archive: [GetDate]"
 timeline_lunar_capital_history_10: "§BAncient Data Analysis§!"
 timeline_lunar_capital_history_10_tp: "§H陨落月都§!\n§Y重要数据§!\n\n我们发现了月之都\"暗星\"计划的小型舰船，尽管线索不多，但科研团队可以确定月都的一款相当后期的舰船设计，主要任务为护卫主力舰和边境巡逻，并且可能具备相当的实战经历。\n不幸的是，我们与月都之间科技差距过大，目前我们只能考虑在其上加装属于我们的武器与能源网络。"
 timeline_lunar_capital_history_10_text: "暗星计划: [GetDate]"
 timeline_lunar_capital_history_11: "§BObelisk Facility§!"
 timeline_lunar_capital_history_11_tp: "§HFallen Lunar Capital§!\n§YMilestone§!\n\nThe last part of the document mentioned that the Lunar Capital has done some changes on an Obelisk facility before leaving the system. To prevent others from entering this facility, we should colonize the planet where it is located to perform further study."
 timeline_lunar_capital_history_11_text: "New trace of the Lunar Capital: [GetDate]"
 timeline_lunar_capital_history_12: "§B幽谷之碑§!"
 timeline_lunar_capital_history_12_tp: "§H陨落月都§!\n§Y里程碑§!\n\n殖民地当地政府报告这座被称作\"幽古之碑\"的方尖碑对当地居民产生了奇特的效果。\n\n此外，地质探测发现在方尖碑数公里的区域地下有着一处空洞，其通过一条隧道直接连到方尖碑的底座，或许我们应该组织一次探索。"
 timeline_lunar_capital_history_12_text: "New trace of the Lunar Capital: [GetDate]"
 timeline_lunar_capital_history_13: "§BDangerous Experiment§!"
 timeline_lunar_capital_history_13_tp: "§H陨落月都§!\n§Y历史事件§!\n\n月之都曾经在这里进行着某种灵能实验，研发将灵能用于强化灵力能力的装置。而且，他们利用方尖碑的灵能效应对跃迁星桥进行了某种修改，不过我们的科学家提出了月都可能的修改方案，如果我们进行反向调谐的话也许有机会逆转对跃迁星桥的修改。"
 timeline_lunar_capital_history_13_text: "Found ways to modify the Obelisk: [GetDate]"
 timeline_lunar_capital_history_14: "§Bthe Lunar Sanctuary§!"
 timeline_lunar_capital_history_14_tp: "§HFallen Lunar Capital§!\n§YHistorical Event§!\n\nAs we managed to modify the Obelisk in a correct way, the energy inside the jump gate surged, and then burst into a flash brighter than a star. Quickly, it dimmed like before, but our navigation system added a new system -- the Sanctuary."
 timeline_lunar_capital_history_14_text: "Discovery of the Sanctuary: [GetDate]"
 timeline_lunar_capital_history_15: "§BRing Construct§!"
 timeline_lunar_capital_history_15_tp: "§H陨落月都§!\n§Y历史事件§!\n\n圣域星系内存在着一段被灵力护盾所屏蔽的环形区段，其护盾活动数据与此前鸟船护盾的非常相像。\n\n而在护盾下方，存在着一个信标以每1200秒为一个周期对外发送着灵力信号，按理说这一信号应该是无法穿透护盾的才对。我们应该尝试解除护盾后对环形装置进行调查。"
 timeline_lunar_capital_history_15_text: "Prepare to unlock the shield on the Ring Construct: [GetDate]"
 timeline_lunar_capital_history_16: "§BStrange Signal§!"
 timeline_lunar_capital_history_16_tp: "§H陨落月都§!\n§Y历史事件§!\n\n在解除了环形装置之上的结界屏蔽后，我们在这处破损严重的环形装置区段地表下30千米处大致定位到了此前的灵力信号源头，现在我们需要派遣工程和研究团队来进行探索。"
 timeline_lunar_capital_history_16_text: "Explore the Ring Construct: [GetDate]"
 timeline_lunar_capital_history_17: "§BAncient AI§!"
 timeline_lunar_capital_history_17_tp: "§H陨落月都§!\n§Y历史事件§!\n\n信号源所在的空间居然处于深层虚境之中，我们之前一直都认为只有浅层虚境才是可以进入的，深层虚境由于灵能活动的复杂性对任何文明都过于危险。\n\n对设施中数据的进一步解读过程中，科学团队发现其中反复提及了“升格”、“融合”、“灵力”、“灵能”等词汇，而月之都对于这处地方最终发生的事情似乎完全不敢提及，仿佛存在着什么禁忌一样。\n\n此外我们还发现并且重新激活了古代AI，或许可以向它问问情况。"
 timeline_lunar_capital_history_17_text: "Contact of Ancient AI: [GetDate]"
 timeline_lunar_capital_history_18: "§BNegotiation Breakdown§!"
 timeline_lunar_capital_history_18_tp: "§H陨落月都§!\n§Y历史事件§!\n\n我们与古代AI的谈判进行的非常不顺利，她甚至还威胁我们要“清理污秽”。不过我们得到了一个至关重要的信息：这里的某种灵能模式阻碍了我们前往月都最终的避难地。"
 timeline_lunar_capital_history_18_text: "与古代AI的谈判破裂: [GetDate]"
 timeline_lunar_capital_crisis_psi_1: "§M虚境变化§!"
 timeline_lunar_capital_crisis_psi_1_tp: "§H陨落月都§!\n§M虚境天灾§!\n\n此前遗留在人造空间中的无人探测器观测到了一些灵能构成的舰船开始从较深层虚境开始往浅层虚境进发。\n\n如果我们的理论正确，即使是对于已经灵能化的他们，想要安全的从虚境前往现实空间，也需要在浅层虚境进行交通。这意味着我们在他们正式袭击前还有准备时间。"
 timeline_lunar_capital_crisis_psi_1_text: "准备迎战威胁: [GetDate]"
 timeline_lunar_capital_crisis_psi_2: "§Mthe Divine§!"
 timeline_lunar_capital_crisis_psi_2_tp: "§H陨落月都§!\n§M虚境天灾§!\n\n天文部门与哨站观测到圣域中的恒星突然发射出了巨大的能量信号，来自虚境中实体的能量将它们转化为了灵力星体，并且以其为媒介出现了通往虚境的灵力锚点。一些完全由灵能组成的舰船开始从中出现，根据能量特征与外形判断，应该是经过灵能化的月都舰船，他们开始向这片银河中的存在发动攻击。"
 timeline_lunar_capital_crisis_psi_2_text: "月之都升格派的入侵: [GetDate]"
 timeline_lunar_capital_crisis_psi_3: "§M威胁散去§!"
 timeline_lunar_capital_crisis_psi_3_tp: "§H陨落月都§!\n§M虚境天灾§!\n\n在关闭了锚点之后，月都升格派的灵能舰船再也无法派遣入侵部队了，并且由于切断了与虚境的连接，灵能舰船纷纷如同风中残烛般消逝。乐观估计在数个月内所有的入侵舰队都会消散于现实结构之中，我们赢得了这场战争的胜利。科学家们也成功回收了一部分月都舰船的数据，我们可以尝试建造这些强大的舰船了。\n\n随着灵能活动的平息，也许很快我们就能提供跃迁星桥访问月都最终的藏身地了。根据初步的测量，月都最终藏身地的物理位置位于室女座超星系团中那神秘的巨引源处，考虑到物理距离的遥远，我们或许只能通过跃迁星桥前往那附近了。"
 timeline_lunar_capital_crisis_psi_3_text: "the Divine repelled: [GetDate]"
 timeline_makai_intro: "§M$spth_precursor.makai$§!"
 timeline_makai_intro_tp: "§U远古先驱§!\n§Y历史事件§!\n\n[GetDate]，我们的科研船发现了部分来自$spth_precursor.makai$的遗物。"
 timeline_makai_intro_text: "$spth_precursor.makai$ discovered: [GetDate]"
 timeline_kamikakushi_crisis_1: "§M隙间侵军§!"
 timeline_kamikakushi_crisis_1_tp: "§U远古先驱§!\n§R危机事件§!\n\n由于我们重启主楔的行为，曾经攻击了$spth_precursor.makai$的势力，隙间之里，向我们派遣了庞大的舰队进行入侵，我们必须要团结一致应对这一威胁。"
 timeline_kamikakushi_crisis_1_text: "Invasion of the Gap Realm: [GetDate]"
 timeline_site_mifeng_bwz: "§USuddenly appeared ruins§!"
 timeline_site_mifeng_bwz_tp: "§U幻想乡§!\n§Y历史事件§!\n\n[GetDate]，我们的卫星发现就在我们的首都似乎发生了一次空间异常波动现象，就在科学家前去查看时，本该一无所有的地方却凭空出现了一块废墟。"
 timeline_site_mifeng_bwz_text: "神秘废墟的现身: [GetDate]"
 timeline_site_mifeng_bwz_end: "§USuddenly appeared ruins§!"
 timeline_site_mifeng_bwz_end_tp: "§U幻想乡§!\n§Y历史事件§!\n\n也许是很长一段时间，也可能是瞬间，但是考察人员都已经能重新掌控自己的身体了，在恢复行动后，他们在遗址的深处，发现了那可能是这一切事件的源头——燕石博物志。"
 timeline_site_mifeng_bwz_end_text: "Return of Swallowstone Naturalis Historia: [GetDate]"
