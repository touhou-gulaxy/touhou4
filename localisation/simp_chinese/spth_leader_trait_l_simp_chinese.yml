 leader_trait_touhou_xeno_cataloger: "经验丰富"
 leader_trait_touhou_xeno_cataloger_desc: "$touhou_advanced_leader_trait_title$这位领袖经验非常丰富。"
 leader_trait_touhou_xeno_cataloger_skill: "随着§Y领袖等级的提升§!，这位领袖将额外获得一定的§Y有效$SKILL$§!。"
 leader_trait_touhou_strike: "一击脱离"
 leader_trait_touhou_strike_desc: "$touhou_advanced_leader_trait_title$这位领袖懂得如何灵活机动来创造战术与战略优势。"
 leader_trait_touhou_space_creature: "航空管制"
 leader_trait_touhou_space_creature_desc: "$touhou_ultra_leader_trait_title$运用灵力与符卡能力，这位领袖能够实现对敌方舰载机的航空压制。"
 leader_trait_touhou_space_creature_skill: "§H进入战斗后：§Y16.00§!£time£内使得敌方的§Y舰载机放飞能力§!受到§R极大的压制§!。"
 leader_trait_touhou_mining_station: "深岩银河"
 leader_trait_touhou_mining_station_desc: "$touhou_common_leader_trait_title$等等，你是不是走错片场了？——八云紫"
 leader_trait_touhou_mining_station_skill: "这又是什么东西？？？"
 leader_trait_touhou_megastructure: "巨构建筑维护者"
 leader_trait_touhou_megastructure_desc: "$touhou_ultra_leader_trait_title$这位领袖格外擅长领导巨型结构的维护工作。"
 leader_trait_touhou_defence: "防御结界"
 leader_trait_touhou_defence_desc: "$touhou_advanced_leader_trait_title$调用额外的能量与灵力，这位领袖可以极大的增加舰船的抗打击能力。"
 leader_trait_touhou_defence_skill_1: "§H进入战斗后：§!获得相当于§Y最大船体值5.00%§!的['concept_touhou_block']，持续§Y4.00§!£time£。"
