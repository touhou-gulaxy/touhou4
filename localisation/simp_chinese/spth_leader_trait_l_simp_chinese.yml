 leader_trait_touhou_cloaking: "隐身场调谐"
 leader_trait_touhou_cloaking_desc: "$touhou_common_leader_trait_title$这位领袖深谙灵力之道，能够运用灵力增幅我们舰队的隐身场运作效率。"
 leader_trait_touhou_tactical_laser: "战术炮击光束"
 leader_trait_touhou_tactical_laser_desc: "$touhou_advanced_leader_trait_title$这位领袖善于发现空间中隐藏的间隙，并借此打开次级传送门发射战术炮击光束。"
