 leader_trait_aki_minoriko: "丰裕与收成的象征"
 leader_trait_aki_minoriko_desc: "拥有掌管丰收程度的能力，可以使作物发育成熟，也可以使农作物枯萎。这项能力只对秋天成熟的作物起作用，并且只能一个一个的使作物成熟，并且能力的范围只有信仰者耕种总量。"
 leader_trait_aki_minoriko_planet_skill: "当前为§H秋季§!时，将提供更多的加成。"
