 leader_trait_lunar_capital: "§B月之都指挥官§!"
 leader_trait_lunar_capital_subtitle: "☯传奇特质☯\n£empire£通用类别"
 leader_trait_lunar_capital_desc: "月之都的舰队司令。"
 leader_trait_lunar_capital_psionic: "§M灵能实体§!"
 leader_trait_lunar_capital_psionic_desc: "当初月之都升格派的一份子，将自己化作纯粹能量构成的灵能实体后成为了深层虚境中的存在。"
 leader_trait_lunar_capital_psionic_effect: "§L强烈的灵能效应使得幻象消散后其影响仍有可能继续存在。§!"
 NAME_lunar_capital_shroud: "§M月都幻象§!"
 lunar_capital_shroud_bg: "§L这是一个纯粹能量构成的灵能实体。§!"
 lunar_capital_shroud_catch: "所有的污秽，必须清理干净。"

 leader_trait_touhou_mirror_empire: "§U梦境世界指挥官§!"
 leader_trait_touhou_mirror_empire_desc: "来自梦境世界的舰队指挥官。"
 leader_trait_touhou_mirror_empire_clone: "§U梦幻境倒影§!"
 leader_trait_touhou_mirror_empire_clone_desc: "这位领袖能够汲取部分敌方舰队的能力为己所用。"

 leader_trait_touhou_seige: "§U妖怪贤者§!"
 leader_trait_touhou_seige_desc: "$touhou_gensokyo_leader_trait_title$作为制造今天的幻想乡的贤者，不论她的职责是什么，都背负着守护幻想乡的使命，维护着幻想乡的安全与稳定。"
 leader_trait_matara: "究极的绝对秘神"
 leader_trait_matara_desc: "没有人知晓她的真身，是真身不可见、不可闻、不可语的，究极的秘神。但是，秘神这个说法并不是说她一直隐介藏形，偶尔也会光明正大地现世，夸示自己的存在。"
 leader_trait_matara_1: "被隐匿的季节"
 leader_trait_matara_1_desc: "隐匿在四季之中的第五个季节，土用。"
 leader_trait_matara_1_skill_1: "根据§Y当前季节§!，可以发动§Y不同的§!符卡能力。"
 leader_trait_matara_1_skill_2: "当前季节：§Y[spth_get_season]§!"
 leader_trait_matara_1_skill_3: "当前符卡能力：[spth_matara_get_season_skill]"
 leader_trait_matara_1_skill_4: "四季分别对应的符卡能力："
 leader_trait_matara_1_skill_4_1: "$t$春：$spth_matara_get_season_skill_1$"
 leader_trait_matara_1_skill_4_2: "$t$夏：$spth_matara_get_season_skill_2$"
 leader_trait_matara_1_skill_4_3: "$t$秋：$spth_matara_get_season_skill_3$"
 leader_trait_matara_1_skill_4_4: "$t$冬：$spth_matara_get_season_skill_4$"
 spth_matara_get_season_skill_1: "['leader_trait_matara_1_skill_sub_1']"
 spth_matara_get_season_skill_2: "['leader_trait_matara_1_skill_sub_2']"
 spth_matara_get_season_skill_3: "['leader_trait_matara_1_skill_sub_3']"
 spth_matara_get_season_skill_4: "['leader_trait_matara_1_skill_sub_4']"
 leader_trait_matara_1_skill_sub_1: "§G「里·吹拂樱花」§!"
 leader_trait_matara_1_skill_sub_2: "§H「里·完美夏冰」§!"
 leader_trait_matara_1_skill_sub_3: "§P「里·疯狂秋风」§!"
 leader_trait_matara_1_skill_sub_4: "§B「里·极端寒冬」§!"
 leader_trait_matara_1_skill_sub_1_desc: "进入战斗后，获得相当于自身最大护盾/装甲/船体§Y5.00%§!的每日再生修正，持续§Y12.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L植物发芽抽枝，植物的生命力溢出的季节。是樱花烂漫盛放，希望与不安交织的最为富有未来感的季节。§!"
 leader_trait_matara_1_skill_sub_2_desc: "进入战斗后，所指挥舰队的灵力武器伤害加成§H修正§!提升§Y30.36%§!，灵力武器射速加成§H修正§!提升§Y99.61%§!，持续§Y6.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L灼热的阳光倾泻而下，热情与热气洋溢的季节。是既有蒸笼一样的酷暑，又有冲洗一切的阵雨的最为表情丰富的季节。§!"
 leader_trait_matara_1_skill_sub_3_desc: "进入战斗后，所指挥舰队的移速与闪避大幅度提升，并且舰船武器射程§H修正§!提升§Y49.50%§!，持续§Y15.00§!£time£。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L野菜和果实开始结果，能回望一年成果的季节。是清一色绿的树木染上异色，开始为新生做准备的最为神秘的季节。§!"
 leader_trait_matara_1_skill_sub_4_desc: "进入战斗后，对全体敌方舰队召唤一次§B恋符「极限火花冻结」§!打击，对护盾与装甲造成§Y3840.00-7680.00§!点伤害，并且可以受到§Y50.00%§!的灵力与魔炮武器伤害加成。\n$SEPARATOR$$SEPARATOR$$SEPARATOR$$SEPARATOR$\n§L大地被纯白覆盖，万物沉眠的季节。是生命力渐渐衰弱，却能窥见这个世界本来样貌的最为风雅的季节。§!"
 leader_trait_matara_2: "后户之国"
 leader_trait_matara_2_desc: "她有着在万物背上制作门扉程度的能力，只要她想，把幻想乡推倒重建这种事也是轻而易举。"
 leader_trait_matara_2_skill: "§Y对敌方舰队效果(持续§Y9.00§!£time£)：§!"
 leader_trait_matara_2_skill_1: "$t$固定伤害减免§H修正§!: §R-25.00%§!"
 leader_trait_matara_2_skill_2: "$t$伤害减免§H修正§!: §R-25.00%§!"
 leader_trait_yuuma: "贪婪的饕餮"
 leader_trait_yuuma_desc: "拥有什么都能吸收程度的能力，无论实体还是灵体，有机物还是无机物，任何事物都会被她囫囵吞入肚中，因而一般的攻击对尤魔没有效果。"
 leader_trait_yuuma_1: "饕餮动物灵"
 leader_trait_yuuma_1_desc: "她能通过吞入腹中这一行为去理解被她吞入的事物，将其转化为自己的力量，并且吞下的事物，似乎也会对她的性格造成影响。"
 leader_trait_yuuma_1_skill: "具备符卡能力：§M暴食「饕餮的晚餐」§!\n\n§H指挥军用舰队进入战斗后:§!\n$t$随机§Y吞噬一队敌方舰队§!，并且获得其§G部分加成§!，持续§Y60.00§!£time£。\n$t$在§Y30.00§!£time£后会重新吐出被吞噬的舰队，并且§R使其受损§!。\n$t$冷却§R120.00§!£time£"

 leader_trait_remi: "红魔上将"
