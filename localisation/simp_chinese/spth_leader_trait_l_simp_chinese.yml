 leader_trait_aki_minoriko_skill_bonus_autumn: "§H秋符「无常秋日与少女的心」§!\n$tt$在§Y10.00§!£time£内使得己方舰船的恢复能力提升§Y100.00%§!\n$tt$§Y180.00§!£time£内第一次触发['concept_ship_spth_extra_life']时，§Y2.00§!£time£内无法受到任何伤害"
 leader_trait_aki_minoriko_skill_bonus_winter: "§B冬符「凌冽寒冬」§!\n$tt$为敌方舰船恢复§R10.00%§!船体值\n$tt$使敌方舰船被['concept_terrify',§R沉默§!]§Y5.00§!£time£"
 leader_trait_aki_minoriko_1: "丰裕与收成的象征"
 leader_trait_aki_minoriko_1_desc: "拥有掌管丰收程度的能力，可以使作物发育成熟，也可以使农作物枯萎。这项能力只对秋天成熟的作物起作用，并且只能一个一个的使作物成熟，并且能力的范围只有信仰者耕种总量。"
