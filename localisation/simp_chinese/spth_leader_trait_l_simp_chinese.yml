 touhou_dream_level: "[Owner.touhou_dream_level]"
 leader_trait_doremy_sweet: "支配梦境之貘"
 leader_trait_doremy_sweet_desc: "她是貘妖怪，拥有食梦、造梦程度的能力，能够消灭、创造、替换一切生物的梦境，并且支配者梦境世界。不过，她却自称无法强制替换梦境，无法创造新梦境，最多只能唆使梦境居民去战斗。"
 leader_trait_doremy_sweet_book: "梦日记"
 leader_trait_doremy_sweet_book_desc: "梦之支配者的梦日记，据说记录着所有人的梦，因此似乎具备着一些奇特的用法。"
 leader_trait_doremy_sweet_book_skill: "具备符卡能力：§P「在最后的周日所做的噩梦」§!\n\n如果§H已经与该种敌人交过手§!，则提升§Y10.00%-20.00%§!的§H灵力武器伤害§!，持续§Y30.00§!£time£。\n获得相当于当前护盾上限§Y25.00§!%的§H临时屏障§!。"
