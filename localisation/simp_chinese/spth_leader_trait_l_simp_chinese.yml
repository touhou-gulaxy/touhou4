 leader_trait_flandre: "绯色月下"
 leader_trait_flandre_desc: "红魔馆的二小姐，与蕾米莉亚为亲姐妹，但是内心时常被破坏冲动所控制，拥有着幻想乡内也首屈一指的破坏能力"
 leader_trait_flandre_tt: "$t$— 所在舰队获得相当于§Y能量武器伤害§G50%§!的莱瓦汀伤害加成§!"
 leader_trait_flandre_skill: "具备符卡能力：§P禁忌「四重存在」§!\n\n§H指挥军用舰队进入战斗后:§!\n生成三个会被优先攻击的§H分身舰队§!，§H分身舰队§!能存在§G20.00§!£time£\n冷却180.00£time£"
 NAME_leader_trait_flandre_fleet: "§P禁忌「罹难漩涡」§!"
 leader_trait_sakuya: "完美潇洒的女仆"
 leader_trait_sakuya_desc: "红魔馆的女仆长，绝技为时间停止——世界「The World」，来历成迷，但对大小姐蕾米莉亚忠心耿耿，被称为红魔的忠犬"
 leader_trait_patchouli: "不动的大图书馆"
 leader_trait_patchouli_desc: "蕾米莉亚的好友，巴瓦鲁图书馆的主人，种族为魔女（魔法使），因身体的原因很少外出，其所掌握的七曜魔法是威力与灵活并存的超复杂魔法"
 leader_trait_koakuma: "大图书馆的助手"
 leader_trait_koakuma_desc: "帕秋莉的助理，负责帕秋莉的日常生活与巴瓦鲁图书馆的整理，有说法其是帕秋莉的使魔，但是无法得到证实"
 leader_trait_meirin: "华人小娘"
 leader_trait_meirin_desc: "中国风的妖怪，也是中国风的武术家，来历成迷，其头上的帽子纹着"龍"与星，被怀疑为跃过龙门的鲤鱼妖，在红魔馆担任门卫，但个性嗜睡"
 leader_trait_meirin_skill: "§Y$NAME_sakuya$§!提供协作符卡: §E幻世「The World」§!\n\n§H指挥军用舰队进入战斗后:§!\n$t$极大的放缓时间，接近到§Y时间停止§!的程度，使敌人的行动§Y近乎静止§!\n$t$己方与中立舰船仍然可以活动自如\n$t$持续§Y20.00§!£time£，冷却§R180.00§!£time£。"
 leader_trait_yuyuko1: "华胥的亡灵"
 leader_trait_yuyuko1_desc: "具有光辉传统的西行寺家的大小姐，现在是亡灵公主。主要拥有操纵死亡程度的能力。与幻想乡的贤者八云紫是好友。听说胃口极大，能够飞行却速度缓慢，有说法是她吃的太多太重了"
 leader_trait_youmu: "半人半灵-魂魄二刀流"
 leader_trait_youmu_desc: "妖梦是半人半灵，是白玉楼的园艺师，身兼冥界大小姐西行寺幽幽子的护卫和剑术指导（但似乎没有在做），拥有使用剑术程度的能力。由于年龄尚小，性格认真直率而不成熟，脑子有些缺根筋，经常斩了再说和被人戏弄。"
 leader_trait_youmu_effect: "具备符卡能力：§E「八百由旬之一闪」§!\n\n§H指挥军用舰队进入战斗后§!:\n将自身§H瞬间移动§!到敌人附近，经过自身§G技能等级*2.00§!£time£后瞬间移动回原本的位置\n冷却§R180.00§!£time£"
 leader_trait_youki: "老道的剑圣"
 leader_trait_youki_desc: "妖梦的爷爷，而且是剑术的老师，并不是和蔼的爷爷，有着难以接近的威严和本领，曾是被西行寺家雇佣的可靠的护卫。不过幽幽子好像也觉得他虽然可靠但有点难打交道。而且，即使作为妖梦的师傅，却是“技术是偷回来的”风格，什么都不会说，要是问一下换来的只是被大喝一声。自从护卫由妖梦代替之后，护卫虽然变成非常不可靠的看院人的程度，但西行寺家的气氛却变了很多。"
 leader_trait_sanae: "祭祀风的人类"
 leader_trait_sanae_desc: "居住在妖怪之山守矢神社的巫女。从外部世界来的，代代单传的拥有秘术的人类，很难得地适应了幻想乡的生活。虽然是人类，但其实她也是神明。维持人类身份而成为神明者被称作现人神。她和八坂神奈子与泄矢诹访子，总共三位神明居住在守矢神社之内。她在守矢神社中担任的工作，就是到村里进行凝聚信仰的营业"
 leader_trait_xrs: "奇迹的现人神"
 leader_trait_xrs_desc: "原本是祭祀着风之神的人类，但是在使用了秘密的秘术引发呼云唤雨的奇迹之后，周围的人们对施行秘术的人类也产生了信仰。也就是说，由风神大人引发的奇迹，不知何时开始，被错认为是由人类所引发的奇迹了。正因为如此，她们这些使用着秘术的人类，以人类之身收集了信仰，受到了和神同样的待遇。"
 leader_trait_kanako: "天水之源"
 leader_trait_kanako_desc: "妖怪之山的神明。虽然根据名字八坂（无数的山坡）来看，她也被叫作山神，不过实际上却是掌管风雨的神。"
 leader_trait_suwako: "祟神洩矢"
 leader_trait_suwako_desc: "远古时管治御左口之神并创立泄矢王国，现在守矢神社被供奉着的以青蛙为象征的神明，是在妖怪之山里的八百万神明的领导者。"
 leader_trait_junshen: "军神"
 leader_trait_junshen_desc: "擅长战争的神明"
 leader_trait_junshen_tt: "$t$— 所在舰队获得相当于§Y动能武器伤害§G25%§!的洩矢符卡与御柱伤害加成§!"
 leader_trait_spth_subclass_sp_tt: "需要选择$subclass_commander_general$才能激活对陆军的效果"
 leader_trait_kasen: "$leader_trait_kasan$"
 leader_trait_kasen_desc: "$leader_trait_kasan_desc$"
 leader_trait_kasen_skill: ""
 leader_trait_aya: "风雨之鸦"
 leader_trait_aya_desc: "妖怪之山的新闻记者，隶属于天狗组织中的报道机构。她单手拿着照相机在幻想乡四处飞行，一旦发现有趣的事情，就会立刻拍下来飞回去"
 leader_trait_hatate: "天狗念写法"
 leader_trait_hatate_desc: "鸦天狗的新闻记者，但是是极少外出取材的类型，因为她是用念写拍摄照片，并借由照片来撰写新闻。极觉得这很方便，于是认为没有必要从家中走出去了。"
 leader_trait_tgjz: "天狗记者"
 leader_trait_tgjz_desc: "天狗族的记者，拥有敏锐的新闻嗅觉与超快的速度"
 leader_trait_nitori: "河童技师"
 leader_trait_nitori_desc: "居住在玄武之泽的河童之一，那里栖息着相当多的河童，形成了一个社会。所有河童的共通特征，就是手艺非常灵巧，擅长制作道具。"
 leader_trait_momiji: "狂犬断噬"
 leader_trait_momiji_desc: "妖怪之山的下端警戒天狗，有着看见千里之外程度的能力"
 leader_trait_momiji_skill: "具备符卡能力：§Y犬符「天狗铁壁」§!\n\n§H指挥军用舰队进入战斗后:§!\n$t$在所有舰船附近张开结界护盾，持续§Y10.00§!£time£\n$t$结界保护下的舰船将处于§G无敌状态§!，但§R失去全部舰船移速增益§!\n$t$§H若§Y32.00§!半径内存在敌方舰船:§!\n$tt$主动解除护盾，对范围内敌人造成§R大量伤害§!并且施加['concept_terrify',§E眩晕§!]\n再次发动需要§R120.00§!£time£冷却。"
 leader_trait_yuyuko: "亡灵使役"
 leader_trait_yuyuko_desc: "亡灵的公主能够使役低端的亡灵"
 leader_trait_ran: "九尾策士"
 leader_trait_ran_desc: "蓝作为式神听从紫的吩咐行事，她本身也能驱使式神。那就是蓝的式神橙。不过似乎橙还不够成熟，工作还不会交给她做。智力相当高，尤其擅长数学。据说连人类所无法想象程度的计算都能够在瞬间完成。只不过，由于擅长计算，比起构思新的概念，她更倾向于分析求解现有的事物"
 leader_trait_chen: "凶兆的黑猫"
 leader_trait_chen_desc: "居住在迷途之家的妖怪猫，同时也是是八云蓝的式神。动作敏捷，式神状态时妖力增强。不过仍然怕水。看起来很聪明，事实上只有附近人类的小孩程度的智慧。"
 leader_trait_yukari: "幻想的境界"
 leader_trait_yukari_desc: "幻想乡的贤者之一，是在幻想乡中，静静栖息在最边境的妖怪。从这里，边看着博丽大结界边生活着。她那与起源相关的能力十分危险，此外，她的行踪神出鬼没，个性缺乏人情，行为原理也和人类大相径庭，因此根本没有人敢对付她"
 leader_trait_letty: "北极的胜利者"
 leader_trait_letty_desc: "她是只能在冬天见到的妖怪。喜欢寒冷的地方，能将人冻结陷入战斗不能的可怕妖怪。说得简单些，就是雪女的一种。"
 leader_trait_lumiya_boss: "堕入极暗与疯狂的吃人妖怪"
 leader_trait_lumiya_boss_desc: "因超级旗舰的能力放大导致精神失控与力量暴走的黑暗吃人妖怪。"
 leader_trait_lumiya: "宵暗的妖怪"
 leader_trait_lumiya_desc: "拥有操纵黑暗程度的能力，能够把自己包裹在黑暗里，不过实力相对较弱？"
 leader_trait_reimu: "博丽巫女"
 leader_trait_reimu_desc: "她是解决异变的专家。每当异变发生时，平常的悠哉随即消影无踪，她会连忙前去一探究竟，同时设法解决。解决异变原本是博丽巫女专属的工作。"
 leader_trait_boli: "博丽大结界"
 leader_trait_boli_desc: "博丽大结界是沟通幻想乡与现实世界的一道庞大的结界整体，它完全的隔离了幻想乡与现实世界，使得妖怪 人类 无法得知幻想乡的存在，从根本上保护了幻想乡"
 leader_trait_akyuu: "幻想乡的记忆"
 leader_trait_akyuu_desc: "稗田家御阿礼之子的第九代转生，现稗田家的主人，也是幻想乡与外界隔绝后第一位转生的御阿礼之子。负责撰写《幻想乡缘起》，写下幻想乡的每人每事——无论是否极端危险的地方。"
 leader_trait_marisa: "极限火花"
 leader_trait_marisa_desc: "会使用魔法。主要擅长具备光与热的魔法。“不华丽就不算是魔法，弹幕最重要的就是火力哩”是她的口头禅。她所使用的魔法看起来都很华丽，不过使用这些魔法，过程却很朴素。"
 leader_trait_marisa_tt: "$t$— 所在舰队获得相当于§Y能量武器伤害§G50%§!的魔炮伤害加成§!"
 leader_trait_marisa_skill: "具备符卡能力：§B恋符「极限火花」§!\n\n§H指挥军用舰队进入战斗后:§!\n对敌方舰队召唤一次§Y魔炮「Final Spark」§!打击。\n该伤害具备§H无视硬化§!的§G+100%§!§Y护盾穿透§!与§R-80%§!§Y船体伤害§!\n可以造成§Y800.00-1600.00§!点§H持续性§!伤害\n\n该伤害可以受到§Y灵力武器伤害§!加成\n持续10£time£，冷却§R180.00§!£time£"
 leader_trait_kasan: "独臂有角的仙人"
 leader_trait_kasan_desc: "住在妖怪之山中，一直在修行的仙人。真实身份是鬼，山之四天王之一，在右臂被斩下后，她的邪气也一并被封印在了右臂，因此她对地狱失去了兴趣，为了前往新天地而志在成为仙人"
 leader_trait_suika: "小小的百鬼夜行"
 leader_trait_suika_desc: "她在整个幻想乡都近乎彻底淡忘鬼族的时候突然出现，不知为何开始留在幻想乡中生活，与其他妖怪相比，乍看之下萃香并非可怕得让人毛骨悚然，可她毕竟也是鬼族的一员。她拥有骇人听闻的恐怖力量，她曾经说过只要她愿意，就可以要凭一己之力摧毁妖怪之山这样的豪言壮语（鬼族言而有信说到做到，从来不说谎。）。"
 leader_trait_keine: "吞噬历史的半兽"
 leader_trait_keine_desc: "当她是人类的时候，能消除历史；当她变成白泽时，则能创造历史。而幻想乡的历史就是由她创造的，但稗田家所著的《幻想乡缘起》是稗田家所拥有的历史，是慧音力有未逮的。"
 leader_trait_satori: "第三只眼"
 leader_trait_satori_desc: "地灵殿的主人，她独居在旧地狱的地灵殿，完全放弃和他人沟通。旧地狱里满是受人厌恶的妖怪，但其中仍然有一种离群索居、被归为遭人厌恶的类别，那就是“觉”。那理由，就是来自她的读心能力。无论谁都不想要跟会读心的家伙碰面啦。被读心这种事不仅是等同自己赤着身子跟她说话，而是意味着连普通地对话也无法做到"
 leader_trait_satori_effect: "§H能够安抚$kedama$与$space_amoeba$§!"
 leader_trait_dld: "地灵殿"
 leader_trait_dld_desc: "当地狱从地底都市迁出后，古明地觉在灼热地狱遗址上建立起了地灵殿，与她的宠物们一同管理着残留下的无数怨灵。因为地底世界极为广阔，所以地灵殿内部也是非常宽敞，包括宏伟的大堂和相当多的房间，同时地灵殿内部自带暖气。"
 leader_trait_koishi: "紧闭的恋之瞳"
 leader_trait_koishi_desc: "古明地恋，和姐姐一样是觉（种族名）。但是，她察觉到了人们对于自己的心事轻易被察知的那种厌恶，于是她便闭上了给予她读心的能力的第三只眼。从此她失去了洞察人心的能力，自此变为了一个四处游荡的妖怪，只有一小部分人看得见她，她所有的动作都是在无意识下进行，被称为『想象中的朋友』。"
 leader_trait_koishi_skill: "具备符卡能力：§P「无意识弹幕测验」§!\n\n§H指挥军用舰队进入战斗后:§!\n使得该舰队免疫来自§H$th_ship_part_koishi$§!的压制\n§H随机选择以下效果触发：§!\n§Y神游§!:将星系内敌方舰队强制牵引至20～100的范围内，冷却60£time£\n§Y本我§!:舰队射程修正+100%，灵力武器射速修正+50%，持续60£time£\n§Y平静§!:32£time£内每4£time£随机修复己方的船体或者装甲，冷却60£time£\n§Y热情§!:敌我双方获得§G+100%§!['concept_touhou_vulnerable']，持续60£time£\n\n对敌方舰队:\n§P「梅莉小姐的电话」§!\n以一定概率§G击杀敌方舰队司令§!\n该概率受到恋恋与敌方舰队司令的§Y领袖等级§!影响\n$leader_trait_koishi_skill_ag$"
 leader_trait_koishi_skill_ag: "§P幻想乡、来自古代文明的造物与虚境侵军免疫该效果§!"
 leader_trait_koishi_skill_msg: "$TH_FLEET_NAME|Y$的指挥官$TH_LEADER_NAME|Y$在指挥舰队作战时，因为承受不了无意识能力对其潜意识的过饱和攻击，被从身后具现的§E古明地恋§!刺杀。"
 spth_koishi_kill_leader_message: "§E无意识的本我妖怪§!"
 leader_trait_koishi_skill_msg_self: "§E古明地恋§!成功完成了对$TH_FLEET_NAME|Y$的指挥官$TH_LEADER_NAME|Y$潜意识的过饱和攻击，并且凭借自己无意识的能力潜入戒备森严的舰桥将其刺杀。"
 th_koishi_fleet_status_1: "神游"
 th_koishi_fleet_status_1_desc: "绝对不是作者东方光耀夜玩多了"
 th_koishi_fleet_status_2: "本我"
 th_koishi_fleet_status_2_desc: "绝对不是作者东方光耀夜玩多了"
 th_koishi_fleet_status_3: "平静"
 th_koishi_fleet_status_3_desc: "绝对不是作者东方光耀夜玩多了"
 th_koishi_fleet_status_4: "热情"
 th_koishi_fleet_status_4_desc: "绝对不是作者东方光耀夜玩多了"
 leader_trait_utsuho: "难以驾驭的神之火"
 leader_trait_utsuho_desc: "栖息于旧地狱的地狱鸦。负责控制灼热地狱的火力。每日每夜，虽然都在作同一件事，但她也满足这平稳充实的生活。但是有一日，不知何人从地上，在谁都不没有察觉的情况下进入了灼热地狱遗迹。那人与空进行对话，对话的内容激起了空的好奇心。然后，空被一阵光芒包围，并好像被什么进入了体内。当清醒起来的时候发现自己的姿态已经大为变化。她获得了神灵的力量。这神灵拥有的究极之力量，就是创造原子的力量——核融合。"
 leader_trait_utsuho_skill: "具备符卡能力：§Y爆符「百万耀斑」§!\n\n§H指挥军用舰队进入战斗后:§!\n获得§Y200.00%§!的['concept_utsuho_bonus']与§R50.00%§!['concept_touhou_vulnerable']，持续§Y15.00§!£time£。\n失去相当于§R50.00%§!的护盾增益，持续§Y15.00§!£time£。\n冷却§R180.00§!£time£"
 leader_trait_rin: "夺尸的猫车"
 leader_trait_rin_desc: "栖息于旧地狱，是被厌恶的妖怪之一，被称作火车。在人们的传说中，她会在葬礼中出现，做出夺走尸体这种不吉的行当，是给悲伤中的人们火上浇油的讨厌妖怪。"
 leader_trait_parsee: "地壳下的嫉妒心"
 leader_trait_parsee_desc: "居住在地底的妖怪，桥姬。她是嫉妒心很强烈的妖怪。其实算是看守连结地上与地下的纵坑的守护神。负责守望着他人能够平安从地上世界到达地下世界，以及从地下世界来到地上世界"
 leader_trait_yuugi: "人所谈论的怪力乱神"
 leader_trait_yuugi_desc: "和萃香一起曾经被称为山中四天王的鬼族一员。现居住于旧都中。传闻说她有异常程度的怪力。同样身为鬼的萃香也说过「虽然咒术系的力量比我弱，但身体使出来的力量大概比我强"
 leader_trait_tenshi: "有顶天的大小姐"
 leader_trait_tenshi_desc: "本是比那名居家的大小姐，随家族成为天人，因此不具备天人应有的品行，性格也与其他天人不同，因此被称为“不良天人”。她手中的绯想之剑能够将对手的气质雾化并转换为某种具体形态（天气），能洞察对手气质的弱点并转化为性质缠绕，准确无误地将弱点击中。"
 leader_trait_tenshi_tt_1: "\n§H根据自身等级提升命中与追踪\n战斗开始后对敌方造成基于舰船大小的伤害，对我方提升恢复能力，持续1-9£time£。§!"
 leader_trait_tenshi_tt_2: "\n§H星系内存在宇宙风暴或$SCARLET_WEATHER$时：根据自身等级提升灵力武器伤害射速。§!"
 leader_trait_yuza: "四季的鲜花之主"
 leader_trait_yuza_desc: "幽香生活在太阳花田，会消灭一切闯入打扰的人类和妖怪，拥有操纵花程度的能力，能让花盛开、使向日葵面向太阳、让枯萎的花再度盛开等。而在战斗中，她使用伞放出飞散的花这般优雅的攻击方式，并且更多的会用拥有压倒性力量的物理攻击而不是妖术或者魔法。"
 leader_trait_yuza_skill: "具备符卡能力：§B幻想「花鸟风月，啸风弄月」§!\n\n§H指挥军用舰队进入战斗后:§!\n对敌方舰队召唤一次§Y魔炮「花鸟风月」§!打击。\n该伤害具备§H无视硬化§!的§G+100%§!§Y护盾穿透§!与§R-50%§!§Y船体伤害§!\n可以造成§Y1000.00-2000.00§!点§H持续性§!伤害\n\n该伤害可以受到§Y灵力武器伤害§!加成\n持续10£time£，冷却§R180.00§!£time£"
 leader_trait_shikieiki: "乐园的最高裁判长"
 leader_trait_shikieiki_desc: "拥有明鉴黑白程度的能力，用非常复杂而全面的标准来判断善恶，涵盖从案件的成立到有关人员的成长史等等内容。她的净玻璃之镜，用这面镜子映照受审者，受审者过去的一切言行都将在镜中得到再现，毫无隐私可言。"
 leader_trait_shikieiki_skill: "\n§H她拥有强大的力量。§!"
 leader_trait_karakasa: "愉快的遗忘之伞"
 leader_trait_karakasa_desc: "不被人使用的伞变成的妖怪。\n她原本是被人遗忘的伞，因为颜色不讨人喜欢，所以从来没有人捡起她，\n在大风大雨中变成了妖怪。\n\n很少给人类带来实质的威胁，只是看到被吓到的人，自己会觉得心情舒畅。\n可是最近吓人的机会变少了，于是开始看经典的鬼故事，学习起经典的吓人手法来。"
 leader_trait_touhou_keiki: "造物的神明"
 leader_trait_touhou_keiki_desc: "被抱着起死回生之念的人类灵召唤到灵长园，用造形术制造出埴轮兵团，以此将动物灵逐出灵长园，成为灵长园的支配者。\n拥有创造偶像程度的能力，能制作出精巧的偶像，而且这些偶像能够收集信仰、当作替身、一起玩耍、装饰房间，品质上乘。"
 leader_trait_komachi: "三途河的引航人"
 leader_trait_komachi_desc: "担任三途河的摆渡人一职的死神，负责把渡河的方法告诉死者们，这方法便是给她“钱”（即摆渡钱）来请她摆渡。同时可以放出与操控怨灵、地缚灵、浮游灵、紧缚灵、恶灵等多种幽灵，不过这些其实是滥用职权的技能。"
 leader_trait_komachi_skill: "具备符卡能力：§E死神「彼岸归航」§!\n\n§H指挥军用舰队进入战斗后:§!\n释放出可存在§G20.00§!£time£的幽灵协助己方作战，冷却§R180.00§!£time£"
 leader_trait_lilywhite: "迎春之舞"
 leader_trait_lilywhite_desc: "拥有告知春天到来程度的能力，能让花的种子生长盛开，并且在传递春天来临的消息的时候最具力量。在春天来临之际能觉察到普通人未注意到的细节，但是不能在春天以外的季节自由行动，因此会积攒压力。"
 leader_trait_lilywhite_skill: "\n§H在春季时会提供强大加成，其他季节则会积攒信仰压力。§!"
 leader_trait_kokoro: "亡失的情感"
 leader_trait_kokoro_desc: "秦河胜使用的66个面具被长久放置后化成的付丧神，拥有操纵感情程度的能力，组成她的每个面具都代表固定的感情，戴上面具后她本人感情就会随之变化，同时也会影响到附近的人。"
 leader_trait_kokoro_skill: "具备符卡能力：§Y面具「完全凭依」§!\n\n§H指挥军用舰队进入战斗后:\n随机一种面具为己方舰船加成60.00£time£，对敌方进行抑制\n随机§G1-3§!个面具凭依于部分舰船上，持续10£time£，冷却30£time£\n面具凭依持续时间结束后:\n若被凭依的舰船被击毁，被凭依的舰船会受到面具对应效果10£time£加成\n若未被击毁，未被凭依的舰船会受到面具对应效果10£time£加成\n\n当所在星系内存在由$NAME_koishi$指挥的军用舰队时:\n概率两支舰队获得额外60£time£秦心面具加成\n§R但是有小概率发生非常可怕的事情§!§!"
 leader_trait_cirno: "冰之小妖精"
 leader_trait_cirno_desc: "baka baka?\n琪露诺是最强的(吗)"
 leader_trait_cirno_baka: "笨蛋笨蛋苯"
 leader_trait_cirno_baka_desc: "这个领袖是连1+1都能算成⑨的超级笨蛋\n不过因为她批阅文件很快，殖民地的建设效率似乎提升了。。吗？"
 leader_trait_eirin: "月之头脑"
 leader_trait_eirin_desc: "八意永琳是月夜见亲族中值得其信赖之人，比月夜见活得更久。月夜见移居到月球后，建立都市时最依靠的就是永琳。月之公主辉夜为赎罪而被放逐至地上，刑期届满之时，她正是前去带回辉夜的使者之一。她却为了某个原因而与辉夜共谋，一起杀害了其它使者，最终修建并和辉夜一起定居于永远亭之中。"
 leader_trait_eirin_skill: "\n§H斗转星移，沧海桑田。\n她知道一些§P特别§!的东西。§!"
 leader_trait_mokou: "蓬莱的不死鸟"
 leader_trait_mokou_desc: "自从服用蓬莱之药后，妹红就拥有了不老不死程度的能力。由于活了很久，她身上有各种妖术，能够在某种程度上操纵火焰，据说能和妖怪势均力敌。"
 leader_trait_mokou_skill: "具备符卡能力：§H不死鸟的舍身击§!\n\n指挥军用舰队时:\n$t$$mod_ship_spth_extra_life$触发时，对敌方造成相当于其最大护盾值§Y20.00%§!的护盾伤害与相当于其最大装甲§Y20.00%§!的装甲伤害，并且为自身增加相当于§H最大船体值§!§Y5.00%§!的['concept_touhou_block']与相当于最大护盾值§Y25.00%§!的['concept_touhou_barrier']\n$t$['concept_touhou_block']能够持续§Y3.00§!£time£。\n\n指挥陆军时:\n$t$被击杀的东方特殊陆军有概率降级为§G1§!支较低级的陆军\n同时回收少量资源§!"
 leader_trait_reisen: "狂气的赤瞳"
 leader_trait_reisen_desc: "铃仙作为月兔，拥有操纵波长程度的能力和无视距离感知其他月兔发出的兔之波动（念波）的能力。运用这项能力，铃仙能够轻易地隐藏身形和扰乱人心，还可以扰乱认知或进行攻击。"
 leader_trait_reisen_skill: "具备符卡能力：§P「幻胧月睨」§!\n\n§H指挥军用舰队进入战斗后:§!\n清除敌方的所有射程与闪避增益\n使敌人失去§R一切撤离机会§!且超光速受到抑制\n180.00£time£"
 leader_trait_kaguya: "永远和须臾的罪人"
 leader_trait_kaguya_desc: "辉夜在被流放到地上前曾居住在月之都，在杀死月之使者后的一千多年里隐居在迷途竹林内的永远亭中，如今不再隐居，过着普通的生活。她拥有操纵永远和须臾程度的能力，能施下永远的魔法，停止一切历史的行进，拒绝任何污秽以及变化，就算有活动，也和停止时间一样。"
 leader_trait_kaguya_skill: "\n§H能够保护所管理的星球免受轨道轰炸前§G90§!£time£的伤害\n对于星域内的星球持续时间减半，冷却360£time£\n管理的星域存在宇宙风暴或$SCARLET_WEATHER$时每个月将会修复一次破坏度。§!"
 leader_trait_maribel_hearn: "Dr.Latency的令人不安之瞳"
 leader_trait_maribel_hearn_desc: "灵异社团“秘封俱乐部”的成员之一，她的家族似乎从前就是灵感很强的一族，她也能够自然的看到世界中的结界，也就是那些境界线。也因此，正在和宇佐见莲子一同进行着在科学世纪探寻遍布四处的结界的活动。"
 leader_trait_renko: "星空的魔术师"
 leader_trait_renko_desc: "灵异社团“秘封俱乐部”的成员之一，似乎具备着看见星星便知晓目前的时间，看见月亮便知晓目前的所在地的能力，最近在做弦论方面的研究。也因此，正在和梅莉一同进行着在科学世纪探寻遍布四处的结界的活动。"
 leader_trait_shinmyoumaru: "一寸法师的后裔"
 leader_trait_shinmyoumaru_desc: "她拥有使用万宝槌程度的能力，是一寸法师的后裔，拥有万宝槌。万宝槌只有小人族可以使用，能够实现使用者的愿望，然而，在实现愿望的同时，必会给予其同等的代价。"
 leader_trait_kagerou: "竹林的Loup-Garou"
 leader_trait_kagerou_desc: "互助组织“草根妖怪网络”的成员之一，拥有在满月之夜变身为狼程度的能力，变身之后实力变强。虽然不擅长战斗，但狼化能够提升体能的同时还可以保持冷静，甚至召唤出狼的影子，并指挥它们扑向某个特定目标。"
 leader_trait_seija: "逆袭的天邪鬼"
 leader_trait_seija_desc: "性格扭曲的天邪鬼，有着“为叛逆而叛逆”的天性，总想着和其他人相反的事情。她的野心是把幻想乡整个翻转过来，实现“下克上”，从而建立由弱者说了算的世界。\n\n当然，她并不是真的想造反或下克上，也并不是想改变这个社会，而只是处于叛逆期，从与社会作对汲取乐趣，甚至说不定只是为了自己的身份才做出这些事。"
 leader_trait_hina: "秘神流雏"
 leader_trait_hina_desc: "收集厄运的神明。所谓的疫病神。不管是人类还是妖怪只要靠近了她就会变得不幸。但是，她本人却完全没有恶意。倒不如说她是个待人友好的神明。收集厄运的本意，也只是为了不让厄运转移到人类身上。"
 leader_trait_hina_tooltip: "这个特质的效果会随着收集的§Y厄运§!增加而§G变强§!。"
 leader_trait_hina_fleet: "§H幻象§!"
 hina_doll: "幻象"
 hina_doll_plural: "幻象"
 hina_doll_desc: "人偶。"
 leader_trait_hina_doll: "诅咒的雏人偶"
 leader_trait_hina_doll_desc: "为了厄运不再回到人类，通过回收顺流而下的雏人偶，收集并看守着厄运，最终将其交诸众神。并且，收集的厄运可以成为她的力量。"
 leader_trait_hina_doll_skill: "具备符卡能力：§M厄符「厄神大人的生理节律」§!\n\n能够§H阻止领袖获得负面特质§!，不过为每位领袖阻隔厄运需要§Y360.00§!£time£冷却。\n阻隔厄运时，会将厄运收集起来，并且每增加§Y1.00§!点厄运，$touhou_hina_doll$与$NAME_hina$的能力都会得到增强。\n当前已经收集的厄运：§M[Owner.touhou_hina_skill_factor]§!"
 leader_trait_kosuzu: "识文解意的爱书人"
 leader_trait_kosuzu_desc: "她是人类村落中的借书屋铃奈庵的店主女儿兼店员，主要负责书籍的出租和贩售工作。有些胆小，但好奇心旺盛，喜爱收集妖魔书，更拥有着§Y“可以读懂、理解任何文字的能力”§!。"
 leader_trait_kosuzu_book: "书籍收集者"
 leader_trait_kosuzu_book_desc: "这位领袖善于收集书籍，尤其是妖魔书，并且运用其中的知识协助我们的研究。"
 leader_trait_kosuzu_book_skill: "每当§Y研究20.00次同种循环科技§!时，她将运用能力§Y额外研究一次科技§!。"
 leader_trait_kosuzu_book_skill_2: "研究§Y灵力循环科技§!时，额外进行研究的所需的研究次数减少§Y5.00§!次。"
 touhou_kosuzu_country: "§P借书屋铃奈庵§!"
 th_leader_sp.1.name: "§H$NAME_kosuzu$§!"
 th_leader_sp.1.desc.1: "欢迎来到借书屋！\n\n有什么感兴趣的书籍吗？\n这里基本上什么类型的都有哦。"
 th_leader_sp.1.desc.2: "欢迎，§H[Root.Species.GetName]§!。\n\n早上好，或者，你那边应该是下午，或者晚上，或者其实并不是特别需要这样区分时间？\n总之，愿你能找到想找的书。"
 th_leader_sp.1.desc.3: "欢迎，§H[Root.Species.GetName]§!。\n\n我的能力观测到的活动数据表明临近星系的天体活动相当稳定，看起来这将会是相当一段时间的好天气呢。\n这次有什么想要的书呢？"
 th_leader_sp.1.desc.4: "感谢你的协助，§H[Root.Species.GetName]§!。\n\n最近铃奈庵的访客明显比之前多了呢。\n我也招募了些新的店员来帮助我进行工作。"
 th_leader_sp.1.a: "我们想要借阅一本书。"
 th_leader_sp.1.a.response: "这本应该很合适。\n\n记得要在§H1800.00§!£time£后归还哦。\n然后，还需要什么呢？"
 th_leader_sp.1.b: "我们想要暂停科研工作。"
 th_leader_sp.1.b.alt: "我们想要继续科研工作。"
 th_leader_sp.1.b.response: "明白了。\n\n那我就不再协助你们解读科研数据了。"
 th_leader_sp.1.b.alt.response: "好的。\n\n那我就开始协助你们解读科研数据了。"
 th_leader_sp.1.b.effect: "§H$NAME_kosuzu$§!将使用自己的能力协助我们解读科研数据，§R以下效果将失效§!：\n\n$t$—$leader_trait_kosuzu_book_skill$\n$t$—$leader_trait_kosuzu_book_skill_2$"
 th_leader_sp.1.b.alt.effect: "§H$NAME_kosuzu$§!将使用自己的能力协助我们解读科研数据，§G以下效果将生效§!：\n\n$t$—$leader_trait_kosuzu_book_skill$\n$t$—$leader_trait_kosuzu_book_skill_2$"
 th_leader_sp.1.c: "有没有什么珍贵的书籍抄本呢？"
 th_leader_sp.1.c.response: "嗯哼...\n\n这个应该很合适了。"
 th_leader_sp.1.c.effect: "§H获得一个随机的['concept_specimens',书籍抄本]。§!"
 th_leader_sp.1.c.fail: "$TRIGGER_FAIL$§R已经获取了全部的珍贵书籍抄本。§!"
 th_leader_sp.1.c.fail.cooldown: "$TRIGGER_FAIL$§R我们近期刚获取了一本抄本。§!"
 th_leader_sp.1.d: "可以翻阅下《幻想乡缘起》吗？"
 th_leader_sp.1.d.response: "嗯哼...\n\n我觉得把这件物品交给你们保管应该更合适点？\n麻烦妥善储藏它了。"
 th_leader_sp.1.e: "听说你收藏了不少妖魔书，可以展示一下吗？"
 th_leader_sp.1.e.fail: "$TRIGGER_FAIL$§R我们近期已经了解过了这方面的知识§!"
 th_leader_sp.1.f: "能协助我们的太空战斗吗？"
 th_leader_sp.1.f.response: "可以。\n\n我试试召唤妖魔书里的东西协助你们，应该对你们有所帮助？"
 th_leader_sp.1.f.fail: "$TRIGGER_FAIL$§R当前没有交战中的舰队§!"
 th_leader_sp.1.exit: "就先聊到这里吧。"
 th_leader_sp.1.exit.response: "好的，欢迎下次光临哦。"
 r_touhou_gumon_shiki: "幻想乡缘起"
 r_touhou_gumon_shiki_desc: "记载了幻想乡的实态。\n\n妖怪们无法准确记住过去，幻想乡里见不到真实。因为这样，不了解妖怪的实态，人类只有害怕的份儿。若能更了解妖怪的能力和做出相应对策，回避危险的地方，认识擅长降伏妖怪的人类，那就能不用战战兢兢地生活了吧。稗田家，为了保障人类生活安全，每一百二十至一百八十年，对惹人注目的妖怪进行记录。这就是《幻想乡缘起》。"
 touhou_kosuzu_country_modifier_15_desc: "我们从§H$NAME_kosuzu$§!那里借来了书籍，一定程度上改善了我们帝国的状况。"
 touhou_kosuzu_country_modifier_15: "铃奈庵书籍借阅"
 touhou_kosuzu_country_modifier_14_desc: "我们从§H$NAME_kosuzu$§!那里借来了书籍，一定程度上改善了我们帝国的状况。"
