 spth_leader_recruit.meirin.desc: "§H来访者有一头及腰的红色长发，两侧的鬓发扎成麻花，末梢系着黑色的丝带，戴着绿色的上有写着“龍”字金属星形物的帽子。穿着绿白色的上衣和裙子，裙子长度大概到小腿，领口有黑色丝绳系成的蝴蝶结。§!\n\n我是红美铃，之前是红魔馆的门卫，日后还请多多关照了。"
