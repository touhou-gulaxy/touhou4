 leader_trait_junko: "纯化光耀"
 leader_trait_junko_desc: "她拥有纯化程度的能力，是对于月之民抱有怨恨的存在，自身也是被怨恨纯化的灵。"
 leader_trait_makai_god: "魔界之神"
 leader_trait_makai_god_desc: "创造了整个魔界的魔界之神。"
 leader_trait_shinki_1: "魔界尽头的地狱之都"
