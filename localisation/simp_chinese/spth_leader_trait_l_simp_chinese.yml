 leader_trait_touhou_servant_desc: "$touhou_common_leader_trait_title$境界感知仪可以使得这位领袖晰地感知到境界的缝隙。"
 leader_trait_touhou_advance_phy: "幻想魔法使"
 leader_trait_touhou_advance_phy_desc: "$touhou_advanced_leader_trait_title$魔法使中的佼佼者，长期的魔导研究经历使其对物理学研究有着独到的见解。"
 leader_trait_touhou_advance_eng: "河童重工技术官"
 leader_trait_touhou_advance_eng_desc: "$touhou_advanced_leader_trait_title$河童中的高级技术员，长期的研究经历使其对工程学研究有着独到的见解。"
 leader_trait_touhou_advance_soc: "相对性精神学者"
 leader_trait_touhou_advance_soc_desc: "$touhou_advanced_leader_trait_title$这位领袖专攻相对性精神学，长期的研究经历使其对社会学研究有着独到的见解。"
 leader_trait_touhou_rift_warped: "星界护盾"
 leader_trait_touhou_rift_warped_desc: "这位领袖善于运用星界护盾，从而显著的提升舰队抗击打能力。"
 leader_trait_touhou_rift_warped_skill: "具备符卡能力：§P光魔「星界充能」§!\n\n$t$舰船护盾值低于§Y50.00%§!时，激活§B星界护盾§!，立即修复§Y50.00%§!的护盾。\n$t$同时获得相当于§G最大护盾值§!§Y1.00%§!的固定§Y伤害减免§!，持续§Y15.00§!£time£。\n$t$§B星界护盾§!每§R90.00§!£time£只能激活一次。"

