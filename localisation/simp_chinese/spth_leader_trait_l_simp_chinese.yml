 leader_trait_th_skill_magic: "大魔法使"
 leader_trait_th_skill_magic_desc: "$touhou_common_leader_trait_title$这位少女擅长使用灵力魔法术式协调我们的舰队战斗。"
 leader_trait_th_skill_zako: "杂鱼指挥官"
 leader_trait_th_skill_zako_desc: "$touhou_common_leader_trait_title$这位少女十分擅长指挥杂兵来构建火力网"
 leader_trait_th_skill_snipe: "自机狙"
 leader_trait_th_skill_snipe_desc: "$touhou_common_leader_trait_title$她特别喜欢在弹幕战里安排一堆自机狙"
 leader_trait_th_skill_impact: "体术大师"
 leader_trait_th_skill_impact_desc: "$touhou_common_leader_trait_title$这位领袖更喜欢使用体术去近距离打击敌军。"
 leader_trait_th_skill_flowering: "开花弹幕机师"
 leader_trait_th_skill_flowering_desc: "$touhou_common_leader_trait_title$这位领袖喜欢在弹幕战中释放大量华丽的弹幕"
 leader_trait_th_skill_bomb: "灵击机师"
 leader_trait_th_skill_bomb_desc: "$touhou_common_leader_trait_title$这位领袖喜欢积攒大量符卡并在决战时倾泻全部火力"
 leader_trait_th_skill_nudge: "微移机师"
 leader_trait_th_skill_nudge_desc: "$touhou_common_leader_trait_title$这位领袖喜欢在弹幕战中保持低速移动，以确保弹幕火力能够集中输出"
 leader_trait_th_skill_graze: "擦弹机师"
 leader_trait_th_skill_graze_desc: "$touhou_common_leader_trait_title$这位领袖享受在弹幕中优雅穿行的感觉，传闻她能够在雨天不带雨具而不被淋湿"
 leader_trait_th_skill_sighwalls: "叹息之壁"
 leader_trait_th_skill_sighwalls_desc: "$touhou_common_leader_trait_title$这位领袖知晓如何通过为改进复合装甲填料来提升抗击能力，但不知为何她从不愿意提及其中的奥妙"
 leader_trait_th_skill_rocket_dolls: "弹幕维新派"
 leader_trait_th_skill_rocket_dolls_desc: "$touhou_common_leader_trait_title$这位领袖坚信舰载机与制导导弹也是弹幕战的一部分"
 leader_trait_th_skill_kekkai: "结界使"
 leader_trait_th_skill_kekkai_desc: "$touhou_common_leader_trait_title$这位领袖专精于构建与运用结界"
 leader_trait_th_skill_sentinel: "星域哨卫"
 leader_trait_th_skill_sentinel_desc: "$touhou_common_leader_trait_title$这位领袖致力于守护幻想乡星域的安定"
 leader_trait_th_skill_logistics: "后勤策士"
 leader_trait_th_skill_logistics_desc: "$touhou_common_leader_trait_title$这位领袖是一位高明的策士，能出色的够为舰队提供后勤保障"
 leader_trait_th_skill_ntrgpt: "河童工业辅助AI"
 leader_trait_th_skill_ntrgpt_desc: "$touhou_common_leader_trait_title$这位领袖拥有一套河童工业科研辅助AI，但每个月都因此需要支付高额电费"
 leader_trait_th_skill_attractive: "魅力非凡"
 leader_trait_th_skill_attractive_desc: "$touhou_common_leader_trait_title$这位领袖能凭借出色的个人魅力，领导科研人员们为共同的目标而努力"
 leader_trait_th_skill_mentor: "伟大导师"
 leader_trait_th_skill_mentor_desc: "$touhou_common_leader_trait_title$这位领袖积极投身到教育事业中，为幻想乡培育出了无数人才"
 leader_trait_th_skill_civil_engineering: "土木工程大师"
 leader_trait_th_skill_civil_engineering_desc: "$touhou_common_leader_trait_title$这位领袖不但在工程学研究上有着出色的成果，还积极参与了实际建设规划"
 leader_trait_th_skill_bibliophile: "图书收藏家"
 leader_trait_th_skill_bibliophile_desc: "$touhou_common_leader_trait_title$这位领袖有收集藏书的癖好，一些先行者的智慧与奇思妙想或许能帮助我们的科研部门少走许多弯路"
 leader_trait_th_expertise_spirit_power: "专长: §U灵力科技§!"
 leader_trait_th_expertise_spirit_power_desc: "$touhou_common_leader_trait_title$这位领袖尤其擅长研究灵力领域的科技，她是这一领域的专家。"
 leader_trait_th_skill_wanhu: "科研推动者"
 leader_trait_th_skill_wanhu_desc: "$touhou_common_leader_trait_title$这位领袖清晰的认识到了科研的重要性，并鼓励人们一同为科研事业添砖加瓦"
 leader_trait_th_skill_media: "文化传媒领袖"
 leader_trait_th_skill_media_desc: "$touhou_common_leader_trait_title$这位领袖在文化传媒领域有着非凡的影响力，并致力于推动相关产业的发展"
 leader_trait_th_skill_planner: "生产计划师"
 leader_trait_th_skill_planner_desc: "$touhou_common_leader_trait_title$这位领袖擅长制定完善的生产计划以获得更高的产值"
 leader_trait_th_skill_xianren: "修仙狂"
 leader_trait_th_skill_xianren_desc: "$touhou_common_leader_trait_title$这位领袖痴迷于通过炼制丹药进行修仙"
 leader_trait_th_skill_longmai: "龙脉风水师"
 leader_trait_th_skill_longmai_desc: "$touhou_common_leader_trait_title$这位领袖能够通过勘测风水龙脉来提升灵力的产出"
 leader_trait_th_skill_armame: "军备组织者"
 leader_trait_th_skill_armame_desc: "$touhou_common_leader_trait_title$这位领袖致力于扩充幻想乡的武装力量，以威慑觊觎幻想乡的敌对势力"
 leader_trait_th_skill_administration: "民生治理者"
 leader_trait_th_skill_administration_desc: "$touhou_common_leader_trait_title$这位领袖致力于改善居民们的生活水平"
 leader_trait_th_skill_alchemist: "炼金术师"
 leader_trait_th_skill_alchemist_desc: "$touhou_common_leader_trait_title$这位领袖致力于通过古老的炼金术来提升合金产量"
 leader_trait_th_skill_controller: "宏观经济管理者"
 leader_trait_th_skill_controller_desc: "$touhou_common_leader_trait_title$这位领袖对幻想乡的市场经济状况了如指掌，并不断通过调整产业结构使我们的经济稳步发展"
 leader_trait_th_skill_architect: "建筑工程专家"
 leader_trait_th_skill_architect_desc: "$touhou_common_leader_trait_title$这位领袖有丰富的工程设计与建设经验，并致力于通过优化流程与更好的设计降低建造所需成本"
 leader_trait_th_skill_hannya: "般若"
 leader_trait_th_skill_hannya_desc: "$touhou_common_leader_trait_title$这位领袖的作战风格如同般若般恐怖，敌人无不闻风丧胆"
 leader_trait_th_skill_support: "受拥戴者"
 leader_trait_th_skill_support_desc: "$touhou_common_leader_trait_title$这位指挥官凭借自身强大的实力与极具魅力的个人作风受到属下士兵们的一致拥戴"
 leader_trait_th_skill_producer: "生产组织者"
 leader_trait_th_skill_producer_desc: "$touhou_common_leader_trait_title$这位领袖擅于通过组织生产的方式降低部队维护成本，还能用盈余资金为士兵购置更好的防护装备\n该特质可以使领袖根据麾下陆军数量产出消费品£consumer_goods£和食物£food£"
 leader_trait_th_skill_defender: "捍卫者"
 leader_trait_th_skill_defender_desc: "$touhou_common_leader_trait_title$这位领袖精通于星球防御战，并擅长通过用妖力制造迷雾来大幅降低进攻方的攻击效率"
 leader_trait_th_skill_deterrence: "震慑者"
 leader_trait_th_skill_deterrence_desc: "$touhou_common_leader_trait_title$对于外交界来说，这位领袖的存在本身就是一种震慑"
 leader_trait_th_skill_military_reformer: "军事改革家"
 leader_trait_th_skill_military_reformer_desc: "$touhou_common_leader_trait_title$这位领袖致力于通过军事改革强化陆军在新时代背景下的战斗理念"
 leader_trait_spiritual_power_user: "灵力运用专家"
 leader_trait_spiritual_power_user_desc: "$touhou_common_leader_trait_title$这位领袖善于运用灵力，并且知道如何针对性的打击护盾。"
 leader_trait_spell_card_user: "符卡使用专家"
 leader_trait_spell_card_user_desc: "$touhou_common_leader_trait_title$这位领袖善于运用灵力，并且知道如何针对性的打击装甲。"
 leader_trait_th_skill_star_pirate: "星空大盗"
 leader_trait_th_skill_star_pirate_desc: "$touhou_common_leader_trait_title$这位领袖善于偷窃一些敌方的物品，甚至包括一些概念性的东西。"
 leader_trait_th_skill_star_pirate_skill_1: "进入战斗时，敌方舰队能量与动能武器§Y增益§!修正§R-15.00%§!\n持续§Y8.00§!£time£，冷却§R90.00§!£time£\n\n若战斗获胜，窃取少量的敌方§Y随机一项§!资源。"
 leader_trait_th_skill_star_pirate_skill_2: "进入战斗时，敌方舰队能量与动能武器§Y增益§!修正§R-20.00%§!\n持续§Y12.00§!£time£，冷却§R75.00§!£time£\n\n若战斗获胜，窃取少量的敌方§Y随机一项§!资源"
 leader_trait_th_skill_star_pirate_skill_3: "进入战斗时，敌方舰队能量与动能武器§Y增益§!修正§R-25.00%§!\n持续§Y16.00§!£time£，冷却§R60.00§!£time£\n\n若战斗获胜，窃取少量的敌方§Y随机一项§!资源"

