 leader_trait_touhou_firepower_desc: "$touhou_advanced_leader_trait_title$这位领袖强调火力优势学说，认为压倒性的火力是战场上的致胜关键。"
 leader_trait_touhou_firepower_skill_1: "进入战斗后每§Y6.00§!£time£在以下加成中轮换："
 leader_trait_touhou_firepower_skill_1_2: "§E安全界限器§!：§Y能量武器伤害修正§! §G+25.00%§!"
