 leader_trait_touhou_control_ghost_desc: ""
 leader_trait_touhou_era_armor: "爆反装甲爱好者"
 leader_trait_touhou_era_armor_desc: "$touhou_advanced_leader_trait_title$这位领袖痴迷于运用各类爆炸反应装甲，甚至给舰载机都贴满了化石-42爆反装甲。"
 leader_trait_touhou_era_armor_skill_1: "§H进入战斗后：§!由于爆反装甲，§Y3.00§!£time£内§G几乎无法受到任何伤害§!，冷却§Y60.00§!£time£"
