 leader_trait_shinki_desc: "她具备强大的灵力，同时也能使役魔法，能够运用魔力进行战斗与管理。"
 leader_trait_shinki_skill: "具备符卡能力：§P神翼「魔界神的威光」§!\n\n$t$使得敌方舰队的§E伤害减免修正§!§Y-20.00%§!。\n$t$对敌方舰队施加§Y20.00%§!的['concept_touhou_vulnerable']与少量['concept_touhou_frigile']。\n$t$持续§G15.00§!£time£，冷却§R90.00§!£time£"
