 NAME_spth_kamikakushi_species: "妖怪?"
 leader_trait_kamikakushi: "§M隙间之里指挥官§!"
 leader_trait_kamikakushi_subtitle: "☯传奇特质☯\n£empire£通用类别"
 leader_trait_kamikakushi_desc: "隙间之里的舰队司令，以其创造者作为虚拟形象。"
 leader_trait_kamikakushi_level_1: "\n普通司令，拥有调控维护结界程度的能力"
 leader_trait_kamikakushi_level_2: "\n高级司令，指挥作战与自身能力更加出众"
 leader_trait_kamikakushi_level_3: "\n传奇司令，曾经亲自参与了亿万年前的远古战争"
 leader_trait_kamikakushi_spark: "散落的火花"
 leader_trait_kamikakushi_spark_desc: "这位领袖善于使用魔法与灵力。"
 leader_trait_kamikakushi_sakura: "生死之间花吹雪"
 leader_trait_kamikakushi_sakura_desc: "这位领袖拥有生与死相关的能力。"
 leader_trait_kamikakushi_gap: "人类与妖怪的铁幕"
