 # 二胡少女
 NAME_astral_rift_touhou_satsuki_rin: "§M次元之间的界线§!"
 spth_astral_rift.119: "龙神讯音"
 spth_astral_rift.119.desc: "这天，八云紫神秘兮兮的找上了我们，她说，龙神的使者向她传达了某件事，这件事对我们可能会非常重要。\n\n按她的说法，她会在我们首都§Y[This.Capital.GetName]§!上开辟一道特殊的裂隙，我们只需要派人进去探索就行了。"
 spth_astral_rift.119.a: "叽里咕噜的说什么呢。"
 spth_astral_rift.119.b: "还在谜语人，还在谜语人。"
 spth_astral_rift.119.c: "好好好（敷衍）"
 astral_rift_touhou_satsuki_rin_intro: "§M次元之间的境界线§!"
 spth_astral_rift.120: "§M次元之间的境界线§!"
 spth_astral_rift.120.desc: "我们进入了紫所开辟的那道奇特的裂隙当中，据她解释，这个裂隙是她用操纵境界线的力量开辟的，次元之间的界线。\n\n她说，会让我们见到一位，本该于红雾异变时，出现在我们身边的人物。\n\n然而在我们这个世界线发生过一些变动，帷幕之外的因素导致这位少女未能现身协助我们解决蕾米莉亚为主犯的那次异变。"
 spth_astral_rift.120.a: "§G有意思，让我看看。§!"
 spth_astral_rift.120.b: "§R残缺也是一种完美。§!"
 spth_astral_rift.121: "§M离开§!"
 spth_astral_rift.121.desc: "我们拒绝了紫的请求，我们没有精力，也没有时间再去寻找一个不知能否派上用场的人。\n\n过去的就让它过去吧，既然因为世界线的变动导致了其消失，那我们也没有必要去逆着命运的流向去寻找她。已然消失的事物，我们不需要去打扰她的安眠。"
 spth_astral_rift.121.a: "我们要把重心放在更重要的事情上面"
 spth_astral_rift.122: "§M仙界§!"
 spth_astral_rift.122.desc: "我们答应了紫的请求，并进入了那道裂隙之中。\n\n映入眼帘的独立于幻想乡存在的异界，根据我们的经验，这里应该是某人的仙界，但这里开满了§H不知名的花§!，其风格并不是我们已知的那几位仙人的仙界。\n\n而且这里的环境极其特殊，我们的探测仪器并不能正常运转。现在只能到处看看，碰碰运气了，毕竟我们总不能空手而归。"
 spth_astral_rift.122.a: "话说没人问问紫那家伙我们要找谁吗？"
 spth_astral_rift.123: "§M追溯过去§!"
 spth_astral_rift.123.desc: "我们在花海之中四处游荡的同时，看到了一些幻影，那似乎是某人的记忆，也可能是幻想乡某处发生过的事情，但具体时间难以推测。\n\n「帮忙照看那孩子？你通过隙间来偷窥比我更方便吧？」\n「啊啦啦拜托了§Y麟§!，毕竟你经常被人认作是巫女，想必和她更好接触吧？更何况我还有事要做呢。」\n「你那所谓的‘更多的事’其实就是整天睡觉吧？」\n幻象消散而又再次重组，这次呈现出了全新的影像……\n「那么，庭院的扫除就拜托你了§Y■■麟§!小姐。」\n「我还以为紫让我来是有什么重要的事呢……」\n「妖梦~饭还没好吗~」\n「幽幽子大人！」\n\n除此之外，似乎还有许多的人与其接触过，包括神绮，魅魔等人。\n但似乎是因为是幻影的原因，我们没有办法看清她到底长什么样，但我们至少知道了她名字的一部分。\n一股莫名其妙的熟悉感从我们心中涌出，虽然我们还不知道她的姓氏。却异口同声的问出了那个名称——"
 spth_astral_rift.123.a: "冴月麟？"
 spth_astral_rift.124: "§M天界§!"
 spth_astral_rift.124.desc: "我们看到的最后一个影像是那人受紫之托前往红魔馆，然而我们已经在此地晃悠许久，不仅没有找到那个人，也没有找到方法前往过去的红魔馆。\n\n正当我们一筹莫展之际，我们却突然来到了一片云海之上，在那云海上盛开着鲜花，即便是盖亚星球似乎也难以和这里的环境相比。\n\n而在我们面前，站着一个穿着白色长袖衬衫，胸前系红色丝带，一头蓝紫色及肩短发上戴着一顶黑色帽子的女性，正是§Y永江衣玖§!。\n\n「啊啊，虽然现在还不是我们相见的时候，但§Y龙神大人§!似乎有意帮助你们呐。」\n「总之祂让我祝你们一路顺风，去把那被遗忘的孩子带回来吧。」\n随后我们只感到一阵天旋地转，就像是被丢到了滚筒洗衣机里面！"
 spth_astral_rift.124.a: "这家伙就不能先提醒一句吗！"
 spth_astral_rift.124.b: "这种感觉真是难受死了！"
 spth_astral_rift.125: "§M红魔馆§!"
 spth_astral_rift.125.desc: "等我们回过神来（实际上是等该吐的全吐完了），我们已经来到了雾之湖湖畔，只要抬眼望去，就能看见那座红窗的洋馆……\n……以及笼罩天地的红雾和漫天飞舞的弹幕。\n\n那深红的月亮高悬于天，在红雾之中隐约能看见一个红色的身影正在和一个白色的家伙使用弹幕对轰。\n根据我们的记忆，现在已经是这次异变的尾声了，留给我们找到冴月麟的时间不多了。"
 spth_astral_rift.125.a: "这么快就到蕾米莉亚了？"
 spth_astral_rift.125.b: "怎么没有9961环节。"
 spth_astral_rift.125.c: "话说魔理沙去哪了？"
 spth_astral_rift.126: "§M风与花之夜§!"
 spth_astral_rift.126.desc: "我们加急冲向红魔馆，路上还看到魔理沙带着一堆书往外跑，而后面的……呃，帕秋莉似乎根本追不上她。但这些都不是重点，重点在于我们似乎看见了§Y根本没有看见过的符卡§!。\n\n§Y那是花瓣§!，在血色的月光下，肆意地、忧伤地飞舞，我们看到了漫天的花雨，也看到了那泼洒花瓣的人。\n\n那道模糊的身影逐渐聚焦，凝实，而周围的一切也开始渐渐慢了下来，随着少女显现出真正的身姿，周围的一切也停滞了下来。少女穿着红白的巫女服，金色的长发上戴着红色的蝴蝶结，手上还拿着二胡。\n\n想必她就是我们要找的人了。"
 spth_astral_rift.126.a: "她就是冴月麟？"
 spth_astral_rift.127: "§M二胡少女§!"
 spth_astral_rift.127.desc: "少女凝视着，不发一言。\n\n「你就是冴月麟吗？」\n「是，我就是冴月麟。」\n「紫想让我们带你回去。」\n「紫……吗？倒也像她会做的事，虽然平时整天睡觉神出鬼没，但上一任博丽巫女死后让我去照看一段时间幼小的灵梦也好，关照幽幽子也罢，她其实挺在乎和自己亲近的人的。」\n「所以你为何没有出现在我们身边过？」\n「嗯……解释起来有点复杂，你就当时间线出了点差错，加上我本身存在感就极低，导致我消失了吧。虽然不知道你们是怎么做到的，但谢谢你们把我重新带回来。」\n「我们可以和你们一起回归，但是我不确保未来我会不会再次消失，我的能力和符卡也不一定能派上用场，这样也可以吗？」"
 spth_astral_rift.127.a: "当然，欢迎加入"
 spth_astral_rift.127.a.tooltip: "§Y「那么，在这里再次感谢你们的帮助，往后请多多指教。」§!"
 spth_astral_rift.128: "§M离开§!"
 spth_astral_rift.128.desc: "在冴月麟答应加入后，她问了一个我们都没考虑过的问题。\n\n「说起来，你们要怎么回去？」\n这句话让我们所有人都陷入了沉思，以及一种不祥的预感。\n正当大家一筹莫展之际，那熟悉的被丢到滚筒洗衣机的感觉再次出现，随后我们一群人就歪七扭八的躺在了紫的旁边。"
 spth_astral_rift.128.a: "衣玖！！！"
 spth_astral_rift.128.b: "喂喂，龙神你们真的不能提醒一下吗！"
 spth_astral_rift.128.c: "至少结果是好的，至少把人带回来了……"
 spth_astral_rift.129: "§B天界回音§!"
 spth_astral_rift.129.desc: "在我们准备离开的时候，随着一阵空间扭曲，此前在裂隙中遇到的$NAME_lku$也出现在了我们的面前。\n\n「我觉得现在是回归的好时机了。」\n「至少龙神祂是希望我回归的。」"
 spth_astral_rift.129.a: "欢迎回来，§Y$NAME_lku$§!。"
 spth_astral_rift.129.a.tt: "§H$NAME_lku$§!作为行政官回归了§H[This.GetName]§!。\n§Y<我们现在可以在通讯界面里联系$NAME_touhou_ac_dragon_god_country$来切换$NAME_lku$与$NAME_satsuki_rin$的领袖类型了。>§!"
 spth_astral_rift.130.desc: "我们可以在这里切换$NAME_lku$与$NAME_satsuki_rin$的领袖类型，或者让她们二人重新回归我们身边。"
 spth_astral_rift.130.a: "将§Y$NAME_lku$§!任命为§H$commander$§!"
 spth_astral_rift.130.b: "将§Y$NAME_lku$§!任命为§H$official$§!"
 spth_astral_rift.130.c: "将§Y$NAME_satsuki_rin$§!任命为§H$commander$§!"
 spth_astral_rift.130.d: "将§Y$NAME_satsuki_rin$§!任命为§H$official$§!"
 spth_astral_rift.130.exit: "离开"

 touhou_astral_action_makai_exploration: "§M窥探魔界位面§!"
 touhou_astral_action_makai_exploration_desc: "在$spth_precursor.makai$遗留的$spth_makai_wedge_0$设施帮助下，我们可以利用$sr_dark_matter$与$astral_threads$，在灵力力量的协助下，短暂的打开前往魔界位面的通道。我们可以观察并记录那里的物理定律、先驱者的活动遗迹，并适当地收集一些能量。"
