 touhou_lunar_psi_extra_43: "虚假的月海"
 touhou_lunar_psi_extra_44: "无秽的世界"
 touhou_lunar_psi_extra_11_desc: "同一个星系击杀$touhou_extra_lunar_psi$的舰队后，会受到越来越严重的负面效果影响。"
 touhou_lunar_psi_extra_12_desc: "$touhou_extra_lunar_psi$击杀的敌方舰船有概率被转化为新的灵能舰船。"
 touhou_lunar_psi_extra_13_desc: "$touhou_extra_lunar_psi$的舰船被摧毁后，有概率分裂出更小的灵能舰船。"
 touhou_lunar_psi_extra_14_desc: "$touhou_extra_lunar_psi$进入战斗后在一段时间内将对方的部分灵力武器射速修正转换给自身。"
 touhou_lunar_psi_extra_21_desc: "$touhou_extra_lunar_psi$有概率控制境内的宜居星球。"
 touhou_lunar_psi_extra_22_desc: "在你使用跃迁后，$touhou_extra_lunar_psi$有概率直接折跃少量舰队发动攻击。"
 touhou_lunar_psi_extra_23_desc: "$touhou_extra_lunar_psi$的舰队取胜后，有概率折跃少量舰队增援。"
 touhou_lunar_psi_extra_24_desc: "$touhou_extra_lunar_psi$在轰炸摧毁殖民地后将获得额外的少量舰队增援。"
 touhou_lunar_psi_extra_31_desc: "$touhou_extra_lunar_psi$有§G25%§!的概率不损失残机"
 touhou_lunar_psi_extra_32_desc: "$touhou_extra_lunar_psi$进入战斗后，将获得短时间的少量减伤效果。"
 touhou_lunar_psi_extra_33_desc: "$touhou_extra_lunar_psi$可能会使用大功率的灵能武器，从虚境中直接向我们发动攻击。"
 touhou_lunar_psi_extra_34_desc: "$touhou_extra_lunar_psi$的残机恢复时间§G-50%§!"
 touhou_lunar_psi_extra_41_desc: "每一段时间，$touhou_extra_lunar_psi$会根据你的部分舰船设计，额外折跃少量复制舰队，并且其他舰船获得基于你该种舰船的舰容之和的固定减伤，直到复制舰队被全部摧毁。"
 touhou_lunar_psi_extra_42_desc: "§R究竟哪一边的月海才是真实的呢？还是整个月球都是虚假的露娜？§!\n你对$touhou_extra_lunar_psi$的战损比越高，$touhou_extra_lunar_psi$获得的加成将越来越高。" # p=K/D玩家与月之都战损比，月之都获得B(r)=2*min(难度系数, sqrt(max(0, p-1)))的额外伤害与船体加成。
 touhou_lunar_psi_extra_43_desc: "§R为何要用真实与虚幻的结界隔绝表里之月？月之民是否如此期盼呢。§!\n$touhou_extra_lunar_psi$在战斗中会召唤存在一段时间的§Y虚境之锚§!，若§Y虚境之锚§!被摧毁，将生成对敌人造成负面影响的§M灵能风暴§!。"
 touhou_lunar_psi_extra_44_desc: "§R能思考的芦苇如果终止思考，恐怕地上便能成为一片较为洁净的草原吧。§!\n与$touhou_extra_lunar_psi$交战中的舰队越多，$touhou_extra_lunar_psi$将会获得越来越高的射速加成。"
 touhou_lunar_psi_extra_ag: "§M虚境盟约§!"
 touhou_lunar_psi_extra_ag_desc: "不论是$touhou_zro_divide_faction$的碎片，还是$touhou_extra_lunar_psi$，祂们的目的互不冲突，而且$touhou_extra_lunar_psi$的行为可以协助$touhou_zro_divide_faction$对于自身的重建，因此——\n$touhou_extra_lunar_psi$将会与$touhou_shroud_crisis$结盟。"
 touhou_lunar_psi_extra_ag_allow: "一切都太晚了，既定的事实无法改变。"
 touhou_lunar_psi_extra_ag_evt_name: "$touhou_lunar_psi_extra_ag$"
 touhou_lunar_psi_extra_ag_evt_desc: "这些来自虚境的势力仿佛把这片银河当作祂们的游乐场，而祂们之间的结盟将无疑带来无穷无尽的灾难。"
 touhou_lunar_psi_extra_ag_evt_opt: "不论如何，击退它们。"
 touhou_lunar_psi_extra_ag_evt_effect: "$touhou_extra_lunar_psi$与$touhou_shroud_crisis$结盟。"
 touhou_zro_divide_faction: "§M泽洛文明升格派§!"
 touhou_shroud_crisis: "§M虚境侵军§!"
