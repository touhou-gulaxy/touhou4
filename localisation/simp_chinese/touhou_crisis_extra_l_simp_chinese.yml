 touhou_kamikakushi_extra_34_desc: "$spth_kamikakushi_country$将极大的干扰我方航空指挥系统，使得其放飞舰载机效率下降。"
 touhou_kamikakushi_extra_41_desc: "你向星神许下了不竭财富的愿望，§R但是似乎有什么不好的事情§!" # 完成
