 touhou_kamikakushi_extra_13_desc: "$spth_kamikakushi_country$进入战斗后有概率§G获得少量增援§!。" # 完成
 touhou_kamikakushi_extra_14_desc: "$spth_kamikakushi_country$进入战斗后小概率使对方§G全部舰船§!一段时间内受到严重结构损害。" # 完成
