 touhou_kamikakushi_extra_22_desc: "与$spth_kamikakushi_country$进攻舰队交战的舰队有概率在§G一段时间§!内受到迟滞。" # 完成
 touhou_kamikakushi_extra_23_desc: "$spth_kamikakushi_country$进入战斗后在一段时间内将对方的部分能量武器射速伤害修正转换给自身。" # 完成
 touhou_kamikakushi_extra_24_desc: "$spth_kamikakushi_country$守卫舰队进入战斗后对敌方舰队造成负面效果。" # 完成
 touhou_kamikakushi_extra_31_desc: "$spth_kamikakushi_country$有§G15%概率§!不损失残机。" # 完成
 touhou_kamikakushi_extra_32_desc: "$spth_kamikakushi_country$的残机恢复时间§G-50%§!" # 完成
