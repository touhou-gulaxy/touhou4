 sm_touhou_arkship_target_grid: "结界「光明与黑暗的网目」"
 sm_touhou_arkship_target_grid_desc: "借由隙间去探测敌方目标，并且直接在敌舰面前开辟隙间，使得舰船炮火能够直接命中目标。"
 sm_touhou_arkship_support_auras_1: "结界「动与静的均衡」"
 sm_touhou_arkship_support_auras_2: "结界「梦境与现实的咒术」"
 sm_touhou_arkship_support_auras_1_desc: "将一系列的支援组件安装在了我们的战斗堡垒之上，从而为我们的战斗提供多种多样的支援。"
 sm_touhou_arkship_support_auras_2_desc: "将一系列的压制组件安装在了我们的战斗堡垒之上，从而为对敌方舰船造成巨大的干扰。"
 sm_touhou_arkship_strike_craft_support: "魍魉「二重黑死蝶」"
 sm_touhou_arkship_strike_craft_support_desc: "更为先进的航空指挥手段。"
 sm_touhou_arkship_shield_generator: "先进型结界灵力护盾组"
 sm_touhou_arkship_shield_generator_desc: "直接由战斗堡垒反应堆供能的结界护盾，可以有效的提升防御能力。"
