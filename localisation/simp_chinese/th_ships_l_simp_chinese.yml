 spth_space_shrine_station_desc: "河童们寻思了一下，在我们的太空神社上面搭建了巨型推进器与其他组件，使之成为了一座大型战斗空间站。通常用于伴随舰队作战提供支援，但是其上搭载的武备与防护可以令其与整支小型舰队抗衡。同样可以将其锚定于星球上方作为牢不可破的太空堡垒。"
