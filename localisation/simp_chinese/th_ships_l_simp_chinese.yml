 spth_super_carrier_computer_fight_back_desc: "\"$spth_super_carrier_destroyed_storm_DESC$\"\n\n在本舰被摧毁的时候，将会释放出§R致命§!的爆炸，\n对该星系内所有敌军造成两段的§R高额§!伤害。\n$spth_super_carrier_destroyed_storm$: 造成一次伤害约§Y495000§!的全星系范围伤害。\n$spth_super_carrier_destroyed_storm_last$: 每天造成一次伤害约§Y51400§!的全星系范围伤害，持续§I3§!£time£。"
