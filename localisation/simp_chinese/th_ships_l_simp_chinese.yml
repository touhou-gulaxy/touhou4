 touhou_gunpower_turret_t_weapon: "月枪-03A 引力塌缩炮"
 touhou_gunpower_turret_t_weapon_on_hit: "该武器每命中§Y7.00§!次，必须要进行充能才能正常造成伤害。"
 touhou_gunpower_turret_t_weapon_tt: "§L这门超重型引力塌缩炮由四级奇点核心直接供能，比常规的泰坦级武器功率更大，同时融合了月之都武器技术的引力武器可以在命中点制造巨大的引力扭曲，从而对附近的其他舰船产生杀伤。但受到其电容存储上限的限制，这门主炮连续开火§Y7.00§!发后必须由奇点核心对电容进行§H重新充能§!。\n恢复全部充能大约需要§R90.00§!£time£，且可以受到§Y灵力武器射速§!加成，但效率只有§R25.00%§!且最多减少到§Y35.00§!£time£。§!"
 touhou_gunpower_turret_t_weapon_common_tt: "§L这门超重型轴基武器由四级奇点核心直接供能，比常规的泰坦级武器功率更大，同时可以在命中点制造巨大的引力扭曲，从而对附近的其他舰船产生杀伤。但受到其电容存储上限的限制，这门主炮连续开火§Y7.00§!发后必须由奇点核心对电容进行§H重新充能§!。\n恢复全部充能大约需要§R90.00§!£time£，且可以受到§Y灵力武器射速§!加成，但效率只有§R25.00%§!且最多减少到§Y35.00§!£time£。§!"
 touhou_gunpower_turret_t_weapon_alt: "月枪-03AG 引力塌缩炮"
 touhou_gunpower_turret_t_weapon_alt_on_hit: "本次攻击将对半径§Y120.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_gravity_cannon_extra_large$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_gravity_cannon_lunar_03ag']。"
