 tech_touhou_sky_control_ship: "$touhou_sky_control_ship$"
 tech_touhou_sky_control_ship_desc: "这种舰船并不依赖传统的引力井内作战武器，其主要作为搭载大规模杀伤性武器的通用平台，因此仅携带了能够自卫的武器和少量护卫舰船。"
 touhou_sky_control_ship_core: "突围核心www"
 touhou_sky_control_ship_core_alt: "攻击核心www"
 touhou_sky_control_ship_petascale: "梦蚀「伪境交错」"
 touhou_sky_control_ship_petascale_DESC: "§B天上的星斗闪烁不定，预示着人的命运无常。\n\n北斗南斗，阴与阳，黑与白。\n在冥冥之中，决定了生与死。§!"
 touhou_sky_control_ship_petascale_on_hit: "§G罪孽根源§!: 若攻击被减免，对目标造成§Y与原伤害相近§!且§Y无视伤害减免§!的伤害。"
 touhou_sky_control_ship_petascale_aoe: "§G梦境侵蚀§!: 本次攻击将对半径§Y100.00§!范围内的敌方舰船施加§Y4.00§!层['concept_touhou_sky_control_ship_petascale_hit']。"
 touhou_sky_control_ship_gigantic: "幻雪「凛然之风」"
 touhou_sky_control_ship_gigantic_DESC: "§R生者必灭，诸行无常。\n\n生前惶惶不可终日，畏惧不知何时到来的无常。\n待到那勾魂使者当真现身，反而会无比释然吧？§!"
 touhou_sky_control_ship_gigantic_on_hit: "§G致命创伤§!: 移除§Y全部的§!固定伤害减免并且§Y削弱§!装甲再生效果，持续§Y8.00§!£time£"
 touhou_sky_control_ship_starkiller: "幻梦「幻之恶魔」"
 touhou_sky_control_ship_starkiller_tt: "§B由反应堆直接供能的舰载的大规模杀伤性武器，能够开辟星界传送门对遥远星系中的目标发动攻击，同时还可以作为常规对舰武器使用。如果停用跨星系打击系统，其甚至可以在短时间内不再消耗['concept_ship_reapers_instant_kill']。§!"
 touhou_sky_control_ship_starkiller_on_hit: "§R魍魉诏令§!: §R被['concept_ship_reapers_instant_kill']命中的舰船几乎无法幸存。§!\n如果关闭跨星系打击: 在§Y15.00§!£time£内不再消耗['concept_ship_reapers_instant_kill']。"
 touhou_sky_control_ship_starkiller_alt: "§R梦终「灰墨余生」§!·§B跨星系打击充能中§!"
 touhou_sky_control_ship_starkiller_alt_on_hit: "$touhou_sky_control_ship_starkiller_on_hit$"
 touhou_sky_control_ship_starkiller_DESC: "§R世界终结之时，璀璨的繁星都在黑暗背景下湮灭。\n\n当熵达到最大值，一切都将陷入无穷无尽的死寂。\n世界迎来最绝望的结局：冰冷、安静、了无生机。§!"
 touhou_sky_control_ship_any_weapon: "梦终「梦之少女」"
 touhou_sky_control_ship_any_weapon_DESC: "§B梦是那么令人依恋，谁都不愿意醒来。\n\n但梦，有终结之时。\n当少女停止做梦，一切都会归于虚无。§!"
 touhou_sky_control_ship_aux_shield: "神翼「防御结界」"
 touhou_sky_control_ship_aux_shield_tt: "§G联结护盾§!: 周期性的获得持续§Y$@touhou_dynamic_modifier_system_interval$§!£time£的§G+100.00%§!伤害减免。\n§G生魂信标§!: 进入战斗时，能够输入战备代码来呼叫§Y护航舰队§!协助战斗，冷却§Y90.00§!£time£。"
 touhou_sky_control_ship_aux_shield_DESC: "§B命运把我们紧紧联结在一起。\n\n沉重的引力让我们无法分离。\n除非死亡，才能分开彼此。§!"
 touhou_sky_control_ship_aux_armor: "光狱「以太之海」"
 touhou_sky_control_ship_aux_armor_DESC: "§R在夸克之外，有着无边无际的以太粒子之海。\n\n也许那就是超脱现实，魔法和梦想都存在的世界。\n当大海扰动之时，幻想的世界亦将变化万千。§!"
 touhou_sky_control_ship_aux_reapers: "引魂「死神祝福」"
 touhou_sky_control_ship_aux_reapers_tt: "§G因果效应§!: 根据舰船已损失的['concept_ship_spth_extra_life']提供伤害加成。"
 touhou_sky_control_ship_aux_reapers_DESC: "§B将死之人，冥冥间踏上了白色彼岸花盛开的道路。\n\n少女向你嫣然一笑，举起闪烁着幽光的提灯。\n你向她报以微笑，生魂从体内飞出，向灯光飞去。§!"
 touhou_sky_control_ship_aux_wither: "斩魄「死镰主宰」"
 touhou_sky_control_ship_aux_wither_aura: "§M凋零共生§!"
 touhou_sky_control_ship_aux_wither_DESC: "§R将死之人，冥冥间踏上了红色彼岸花盛开的道路。\n\n少女向你嫣然一笑，举起闪烁着赤光的死镰。\n你向她报以微笑，精魄在死镰挥下时，消散如烟。§!"
 touhou_sky_control_ship_shield: "星落「光子帷幕」"
 touhou_sky_control_ship_shield_DESC: "§B从银河眼中得到力量，作为光之化身降临。\n\n黑暗中闪耀的光之幕，横亘在那虚空深处。\n异界最硬的盾牌，誓要牢牢守护至福乐土。§!"
 touhou_sky_control_ship_armor: "绝壁「星界铁幕」"
 touhou_sky_control_ship_armor_DESC: "§R从星海尽头的虚空中，到星界彼岸的万神殿。\n\n一道铁幕正缓缓落下，分割对立的两个世界。\n隔绝月海与天国的，正是那创世的魔界之神。§!"

