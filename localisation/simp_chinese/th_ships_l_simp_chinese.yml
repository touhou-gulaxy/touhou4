 lunar_capital_ftl_engine_crisis_DESC: "$lunar_capital_ftl_engine_DESC$"
 lunar_capital_aux_truiser: "月扇「天衣无缝」"
 lunar_capital_aux_truiser_tooltip: "该舰船具有相当于§Y当前护盾§!§G2.00§!%的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$。"
 lunar_capital_aux_truiser_DESC: "§B逃离了无秽的世界，来到了污秽的乐园。§!"
 tech_lunar_capital_engines: "先进整合推进器"
 tech_lunar_capital_engines_desc: "月之都将FTL引擎与常规引擎结合在了一起，同一套引擎既可以驱动月都的舰船进行亚光速航行，又可以在星系内或星系间进行长距离跃迁。"
 touhou_makai_reactor: "魔神「法界之火」"
 touhou_makai_reactor_DESC: "这种先进的反应堆并不实际产生能量，其依赖内置的小型星界网络接口，从魔界位面传输源源不断的能量，并且可以长期储存多余能量来提供自持力。"
 touhou_makai_gateway_ship_reactor: "星界能源核心"
 touhou_makai_gateway_ship_reactor_DESC: "$touhou_makai_reactor_DESC$"
 touhou_makai_ftl_engine: "虚灵「星之航路」"
 touhou_makai_ftl_engine_DESC: "魔界所使用的跃迁引擎不依赖于常见的虚境或者隙间，而是刺破星界壁垒，打开一个人为的临时星界裂隙进行超光速航行。"
