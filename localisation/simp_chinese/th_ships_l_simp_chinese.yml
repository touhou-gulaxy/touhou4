 touhou_makai_ftl_engine_crisis_DESC: "$touhou_makai_ftl_engine_DESC$"
 touhou_makai_ftl_engine_player: "$touhou_makai_ftl_engine$"
 touhou_makai_ftl_engine_player_DESC: "$touhou_makai_ftl_engine_DESC$"
 touhou_astral_gap_ftl_engine_player: "结界「虚幻与现实的界线」"
 touhou_astral_gap_ftl_engine_player_DESC: "经由隙间技术强化的星界跃迁引擎更加可靠，不仅能更轻松刺破星界壁垒打开星界裂隙进行超光速航行的同时，还可以借助隙间进行超光速航行与辅助亚光速航行。"
 tech_touhou_makai_ftl_engine: "星界跃迁引擎"
 tech_touhou_makai_ftl_engine_desc: "魔界所使用的跃迁引擎不依赖于常见的虚境或者隙间，而是刺破星界壁垒，打开一个人为的临时星界裂隙进行超光速航行，因此可以规避大部分可能的风险。"
 kamikakushi_reactor: "界线「真实与虚幻的境界」"
 kamikakushi_reactor_DESC: "我们完全弄不明白这东西的运作原理，只知道其依赖隙间妖怪的能力进行运作。\n\n§M「生与死之间有一条纤薄的境界线。你会在那里找到我。」§!"

