 sm_touhou_arkship_strike_crafts: "先进舰载机机库"
 sm_touhou_arkship_strike_crafts_DESC: "安装额外的舰载机机库。"
 sm_touhou_arkship_extra_thruster: "灵力推进器组"
 sm_touhou_arkship_extra_thruster_desc: "通过安装额外的推进器，让我们的战斗神社机动更加灵活。"
 sm_touhou_arkship_support_aura: "灵力结界强化"
 sm_touhou_arkship_support_aura_desc: "增设额外的结界防御手段，让我们的战斗堡垒更加难以摧毁，还使得护盾在某些恶劣条件下仍能正常工作。"
 touhou_ship_skill_space_shrine_warp_comp: "高级隙间驱动器"
 touhou_ship_skill_space_shrine_warp_comp_DESC: "河童们为虚空神社设计了能够驱动其前往任意地点的隙间驱动器，这一技术奇迹允许我们的战斗堡垒立即抵达目标星系，甚至能够在跃迁引擎难以运作的地方正常工作。"
 touhou_ship_skill_space_shrine_warp: "隙间潜航"
 touhou_ship_skill_space_shrine_warp_key: "正在利用隙间驱动器传送至$NAME|Y$"
 touhou_ship_skill_space_shrine_warp_activity_key: "启动隙间驱动器"
 touhou_ship_skill_space_shrine_warp_required_progress_key: "§Y瞬间§!"
 touhou_ship_skill_space_shrine_warp_tooltip: "§H舰队效果§!:\n$t$-舰船将无视一切限制，立即抵达预计散射半径内的星系。\n$t$-将星系内的友方舰队在§Y1.00§!£time£后传送至目标星系。\n\n§Y河童们为虚空神社设计了能够驱动其前往任意地点的隙间驱动器，这一技术奇迹允许我们的战斗堡垒立即抵达目标星系，甚至能够在跃迁引擎难以运作的地方正常工作。§!"
 touhou_arkship_shield_generator_comp: "先进型结界灵力护盾"
 touhou_arkship_shield_generator_comp_desc: "直接由战斗堡垒反应堆供能的结界护盾，可以有效的提升防御能力。"

