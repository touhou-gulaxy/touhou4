 SHIP_GRAPHICS_SPTH_KAMIKAKUSHI_TITAN_DESC: "这些舰船是隙间之里所使用的舰队旗舰，具备较为强大的指挥与综合作战能力，能在战斗中提升舰队的护盾与装甲运作效率，某些情况还能投射保护场。"
 SHIP_GRAPHICS_SPTH_KAMIKAKUSHI_CRUSIER_DESC: "隙间之里使用的自动化小型护航舰，具备相当可靠的防御性能，同时可以撑起舰队防空网。"
