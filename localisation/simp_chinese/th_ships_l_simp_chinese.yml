 tech_spth_hv_bombardment_desc: "先进的支援体系。"
 spth_hv_bombardment_beacon: "引导信标"
 spth_hv_bombardment_beacon_tooltip: "可以引导己方的§M$spth_hv_bombardment_ship$§!为自身所在舰队提供跨星系火力支援。\n§M$spth_hv_bombardment_ship$§!将会开辟一道隙间裂口，通过该裂口进行火力支援。"
 spth_hv_bombardment_beacon_DESC: "为己方的火力支援单位标识炮击坐标用的引导信标。"
 spth_hv_bombardment_dw: "幽冥蝶舞"
 spth_hv_bombardment_dw_effect: "跨星系火力支援模块：可以为一定范围内，交战中且携带了引导信标的己方舰队进行火力支援，其伤害可以受到各种修正影响。§R注意：支援武器相同的远程轰炸舰只会生效一次§!\n☯\n前置冷却: §Y4§!£time£\n增援距离: 超空间距离2跳\n支援冷却: §Y7§!£time£\n伤害类型: §Y能量§!,§Y动能§!,§M该武器会将射速等比例转化为伤害§!\n冷却: §Y1.0§!£time£\n伤害: §Y6435.00-6435.00§!\n§G+200.00%装甲穿透§!\n§G+200.00%护盾穿透§!\n该远程支援武器根据目标大小的§G+16.00%§!造成额外伤害"
 spth_hv_bombardment_dw_DESC: "穿甲效率与伤害较高的跨星系支援型武器，冷却较长且射程较短。"
 spth_hv_bombardment_fc: "悔悟之棒"
 spth_hv_bombardment_fc_effect: "跨星系火力支援模块：可以为一定范围内，交战中且携带了引导信标的己方舰队进行火力支援，其伤害可以受到各种修正影响。§R注意：支援武器相同的远程轰炸舰只会生效一次§!\n☯\n前置冷却: §Y2§!£time£\n增援距离: 超空间距离3跳\n支援冷却: §Y5§!£time£\n伤害类型: §Y能量§!,§Y灵力§!,§M该武器会将射速等比例转化为伤害\n冷却: §Y0.30§!£time£\n伤害: §Y1968.00-1968.00§!\n§G+200%装甲穿透§!\n§R-50.00%装甲伤害§!\n§G+300.00%护盾伤害§!\n§G+50.00%船体伤害§!"
 spth_hv_bombardment_fc_DESC: "对护盾特化伤害的跨星系支援型武器，冷却较短且射程较长。"
 spth_hv_bombardment_sk: "离魂之镰"
 spth_hv_bombardment_sk_effect: "跨星系火力支援模块：可以为一定范围内，交战中且携带了引导信标的己方舰队进行火力支援，其伤害可以受到各种修正影响。§R注意：支援武器相同的远程轰炸舰只会生效一次§!\n☯\n前置冷却: §Y2§!£time£\n增援距离: 超空间距离3跳\n支援冷却: §Y6§!£time£\n伤害类型: §Y动能§!,§Y灵力§!,§M该武器会将射速等比例转化为伤害\n冷却: §Y1.0§!£time£\n伤害: §Y240.00-265.00§!\n该远程支援武器根据目标大小的§G+725.00%§!造成额外伤害"
 spth_hv_bombardment_sk_DESC: "对大型目标特化的跨星系支援型武器，冷却中等且射程较长。"
 spth_hv_bombardment_ship_desc: "该舰船与常规战舰不同，其定位更倾向于重装部队，更擅长火力支援而不是正面交战。可以为附近星系的己方舰队提供火力支援，具体范围与效果取决于舰船部件。\n远程轰炸：该舰船会为爆破武器提供额外加成，并且具有极远的射程。"
