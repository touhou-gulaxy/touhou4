 SHIP_GRAPHICS_TOUHOU_COMMAND_DREADNOUGHT_DESC: "专职舰队指挥与电子战的先进旗舰，其可以极大地增强我们舰队的作战能力，此外其搭载的专门设计的轴基主炮可以为为舰队作战带来更多的优势。"
 SHIP_GRAPHICS_TOUHOU_SUPPORT_HEAVY_CRUISER_DESC: "这款重型巡洋舰主要用于提供各种各样的支援，而不是作为作战主力，其上可以搭载各种电子战设备，利用电子对抗为我方舰队创造优势。"
 SHIP_GRAPHICS_TOUHOU_MAKAI_GATEWAY_SHIP_DESC: "魔界设计的移动星门框架，其可以移动到需要的位置并且部署为星界网络节点，从而为我们创造机动性等方面的优势。"
 SHIP_GRAPHICS_TOUHOU_SUPERSTARBASE_MOVE_DESC: "这是一种独立于恒星基地外的防御平台，其自身搭载的AI保证了它们§Y在恒星基地失守的情况下仍能保持战斗力§!。同时通过底部额外搭载的灵力反应堆，它可以为远超常规防御炮台数量的大型武器供能，因此具备相当强大的作战能力。"
 SHIP_GRAPHICS_TOUHOU_EVENT_DRONE_DESC: "小型无人机，可以协助我们舰队作战。"
 SHIP_GRAPHICS_SPTH_STORY_SCIENCE_SHIP_DESC: "这种先进的科研船可以携带一定数量的武装，从而帮助其摆脱甚至直接消灭危险。"
 SHIP_GRAPHICS_LUNAR_CAPITAL_CARRIER_DESC: "月之都静海计划一期所设计的大型主力舰，作为舰队指挥中枢的同时，几乎没有任何舰船可以在被其上专门设计的轴基主炮打击后幸存下来，搭载的数门轴基与超大型武器同时可以毫不留情的撕碎敌方舰队。这种奇迹般的战舰在每队月之都的舰队当中都必然会配置1-2条，能够在舰队战中撕开敌方战线，将敌人分割、歼灭。"
 SHIP_GRAPHICS_LUNAR_CAPITAL_BATTLSHIP_DESC: "月之都静海计划四期所设计的中型主力舰，可以作为舰队的中坚力量，其上搭载的轴基与超大型武器可以向敌人倾泻毁灭性的火力，大型武器阵列同时可以重创敌方的舰队，此外搭载的结界发生器赋予其奇迹般的抗打击能力。"
 SHIP_GRAPHICS_LUNAR_CAPITAL_ESCORT_DESC: "月之都净土计划二期所设计的中型护航星舰，其主要输出手段为五台重型反舰导弹发射器，并且利用先进的结界技术来储存远超这种体型的舰船应有的备弹量，在舰队作战中可以负责护卫主力舰与兼职反舰任务。"
 SHIP_GRAPHICS_LUNAR_CAPITAL_FRIGATE_DESC: "月之都净土计划三期所设计的专职防空舰船，在可以撑起舰队防空火力网的同时也可以作为边防巡逻星舰，并且具备两种自卫武器配置：短程大功率爆发武器或者中程重型反舰导弹。"
 SHIP_GRAPHICS_TH_BATTLE_CRUISER_DESC: "$TH_battle_cruiser_desc$"
