 spth_fleet.2021.name: "§R隐身失能§!"
 spth_fleet.2021.desc: "§H[From.GetName]§!中似乎存在某种敌对势力部署的探测设备，其探测到了§H[FromFrom.GetName]§!的存在，并且使得我们舰队的隐身场失去了作用，甚至还额外受到了损伤。"
 spth_fleet.2021.a: "什么？"
 spth_fleet.2021.a.effect: "§H§R[FromFrom.GetName]§!被迫解除隐身，并且受到了严重的负面效应。§!"
 spth_fleet.2021.b: "此类消息以后不要再通知了。"
 spth_fleet.2022.name: "§G隐身反制§!"
 spth_fleet.2022.desc: "§H[From.GetName]§!中我们的先进探测设备探测到了§H[FromFrom.GetName]§!的存在，并且使得这支舰队的隐身场失去了作用，甚至还额外受到了损伤。"
 spth_fleet.2022.a: "整挺好。"
 spth_fleet.2022.a.effect: "§G§R[FromFrom.GetName]§!被迫解除隐身，并且受到了严重的负面效应。§!"
 spth_fleet.2022.b: "此类消息以后不要再通知了。"

