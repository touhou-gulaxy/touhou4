 concept_th_toyohime_weapon_titanic: "§B崩解§!"
 concept_th_toyohime_weapon_titanic_desc: "每拥有一层['concept_th_toyohime_weapon_titanic']：\n§R+5%§! $MOD_SHIP_TARGET_WEIGHT_MULT$\n§R-5§! $MOD_SHIP_ARMOR_REGEN_ADD_STATIC$\n§R-2%§! $MOD_SHIP_TRACKING_ADD$"
 concept_th_toyohime_weapon_extra_large: "§B标记§!"
 concept_th_toyohime_weapon_extra_large_desc: "每拥有一层['concept_th_toyohime_weapon_extra_large']：\n§R+5%§! $MOD_SHIP_TARGET_WEIGHT_MULT$\n§R-5§! $MOD_SHIP_EVASION_ADD$\n§R-2%§! $MOD_SHIP_EVASION_MULT$"
 th_toyohime_weapon_titanic_lore: "\n§L月之都的常规轴基武器能够释放出携带了巨大能量的快子束，对落点附近造成恐怖的大范围杀伤，并且借助连接山海程度的能力，传输敌方能源网络中的能量到己方舰船来协助舰船的自我维修进程。§!"
 th_toyohime_weapon_instant_kill_lore: "\n§L月之都的旗舰级轴基主炮能够吹起净化之风，其释放的致命能量流能够切断目标物体原子结构内的相互作用，将所命中事物瞬间化为基本粒子，从而对敌方舰船造成难以想象的巨大杀伤。§!"
 th_toyohime_weapon_instant_kill_effect: "§R被['concept_weapon_type_th_toyohime']命中的舰船几乎不可能存活。§!"
 th_toyohime_weapon_instant_kill_aoe_effect_crisis: "\n本次攻击将对半径§Y150.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_instant_kill_crisis_titanic$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_titanic_lunar_capital']。"
 th_toyohime_weapon_instant_kill_aoe_effect_alt: "\n本次攻击将对半径§Y120.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_instant_kill_alt_titanic$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_titanic_lunar_capital']。"
 th_toyohime_weapon_titanic_effect: "命中目标会附带§R+1§!层['concept_th_toyohime_weapon_titanic']\n['concept_th_toyohime_weapon_titanic']达到10层时该舰船将被附加持续§G10.00§!£time£的§R+100%§!['concept_touhou_vulnerable']并且清除所有的['concept_th_toyohime_weapon_titanic']"
 th_toyohime_weapon_extra_large_effect: "命中目标会附带§R+1§!层['concept_th_toyohime_weapon_extra_large']\n['concept_th_toyohime_weapon_extra_large']达到十层时该舰船将被附加持续§G10.00§!£time£的§R-100%§!闪避并且清除所有的['concept_th_toyohime_weapon_extra_large']"
 th_toyohime_weapon_extra_large_aoe_effect_crisis: "\n本次攻击将对半径§Y60.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_crisis_extra_large$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_extra_large_lunar_capital']。"
 th_toyohime_weapon_extra_large_aoe_effect_alt: "\n本次攻击将对半径§Y50.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_alt_extra_large$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_extra_large_lunar_capital']。"
 th_toyohime_weapon_titanic_aoe_effect_crisis: "\n本次攻击将对半径§Y120.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_crisis_titanic$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_titanic_lunar_capital']。"
 th_toyohime_weapon_titanic_aoe_effect_alt: "\n本次攻击将对半径§Y100.00§!范围内的敌方舰船造成§R$@touhou_aoe_damage_lunar_alt_titanic$§!点§Y无视伤害减免§!的['concept_touhou_aoe_damage_titanic_lunar_capital']。"
 th_toyohime_weapon_g_effect: "命中目标后对目标的护盾造成相当于其最大护盾§G2.00%§!的§R百分比伤害§!。\n若目标护盾值低于§Y16.00%§!，则对其装甲造成相当于其最大装甲§G2.00%§!的§R百分比伤害§!。"
