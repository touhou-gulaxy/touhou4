 touhou_makai_wedge_titan_petascale_on_hit: "['concept_terrify',§R恐惧§!]。\n\n每次攻击有§G20.00%§!概率造成致命伤害，触发后冷却§G8.00§!£time£。"
 toho.4227.name: "完善副楔设计"
 toho.4227.desc: "近期，在§Y神绮§!的协助下，我们的科学部门完成了重构此前发现的§Y魔界古船核心§!的方案。\n\n据了解，这种舰船上搭载了大型的星界星门，被用于在主楔与自身之间，借助星界网络进行快速的舰队投送。并且其使用星界传输接口，可以搭载各种大功率的§Y大规模杀伤性武器§!，以及我们难以想象级别的§Y旗舰级武器§!。为了，我们专门设计了§H远比泰坦级武器要更庞大的轴基武器§!，其直接由星界传输接口供能，威力将远超我们的大部分轴基主炮。"
