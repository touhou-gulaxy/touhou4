 tech_touhou_gunpower_turret_gravity_cannon: "月狂之枪 - 引力塌缩炮"
 tech_touhou_gunpower_turret_gravity_cannon_desc: "对根据暗星幻梦上搭载的引力塌缩炮进行逆向，我们成功制造出了能够适配重型防御炮台的引力武器。"
