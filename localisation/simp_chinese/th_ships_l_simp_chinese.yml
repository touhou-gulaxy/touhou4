 tech_touhou_makai_wedge_titan_petascale: "魔符「天堂之威光」"
 tech_touhou_common_bow_desc: "这种舰船上搭载了大型的星界星门，被用于在主楔与自身之间，借助星界网络进行快速的舰队投送。并且其使用星界传输接口，可以搭载各种大功率的§Y大规模杀伤性武器§!，以及我们难以想象级别的§Y旗舰级武器§!。"
 tech_touhou_makai_wedge_titan_petascale_desc: "作为远比泰坦级武器要更庞大的轴基武器，其需要消耗难以想象级别的能源，同时可以发挥出极其恐怖的威力。"
 touhou_makai_wedge_titan_gigantic: "§M破咒「拨云见月」§!"
 touhou_makai_wedge_titan_petascale: "§M魔符「天堂之威光」§!"
 touhou_makai_wedge_titan_gigantic_DESC: "这种武器搭载了一些实验性的符卡技术，从而可以更加有效的对抗敌方的各种防御手段。"
 touhou_makai_wedge_titan_petascale_DESC: "作为远比泰坦级武器要更庞大的轴基武器，其需要消耗难以想象级别的能源，同时可以发挥出极其恐怖的威力。"
