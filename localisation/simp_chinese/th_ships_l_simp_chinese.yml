 spth_fleet.1217.desc: "我们已经建成了我们的第一座$touhou_superstarbase_move$，这是一种独立于恒星基地外的防御平台，其自身搭载的AI保证了它们§Y在恒星基地失守的情况下仍能保持战斗力§!。\n\n通过底部额外搭载的灵力反应堆，它可以为远超常规防御炮台数量的大型武器供能，因此具备相当强大的作战能力。"

