 lunar_capital_reactor_DESC: "月之都所使用的舰载§Y七级奇点§!反应堆，这项技术奇迹需要用复杂的结界屏蔽网来稳定用于供能的奇点核心。\n\n§B真实的满月下，一切皆为狂妄的幻想。§!"
 lunar_capital_reactor_psi: "净土「终天启示」"
 lunar_capital_reactor_psi_DESC: "月之都升格派所使用的舰载§Y虚境核心§!反应堆，这一奇迹般的灵能技术可以直接从§Y深层虚境§!中抽取源源不断的灵能，从而为灵能舰船供能。\n\n§B真实的满月下，一切皆为狂妄的幻想。§! "
 lunar_capital_ftl_engine: "静海「月之羽衣」"
 lunar_capital_ftl_engine_DESC: "月之都使用的§Y整合式推进器§!，将FTL引擎与常规引擎结合在了一起，同一套引擎既可以驱动月都的舰船进行亚光速航行，又可以在星系内或星系间进行长距离跃迁。如果具备精确的坐标与引导，其甚至可以驱动舰船跨越§Y河系之间§!的遥远距离。\n\n§B残留的月的回忆。§!"
