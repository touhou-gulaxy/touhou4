 concept_psionic_inhibitor: "灵能抑制器"
 concept_psionic_inhibitor_desc: "更先进的灵能抑制器能够有效的抑制大多数的灵能活动模式，从而逐渐阻断星系内的灵能光环等灵能活动影响，抑制灵能光环的扩散，甚至让灵能物种缓慢的失去灵能能力。\n\n面对某些§M危害性的灵能活动§!，其完全不会被腐化，同时表现出显著的抑制效应。"
 concept_psionic_burster: "灵能增幅器"
 concept_psionic_burster_desc: "灵能增幅器能够有效的增强大多数的灵能活动模式，从而逐渐增强星系内的灵能光环等灵能活动影响，加强灵能光环的扩散，甚至让无灵能物种缓慢的获得灵能能力。\n\n面对某些§P灵能抑制效应§!，其仍然可以生效。"

 concept_utsuho_bonus: "§P伤害加成§!"
 concept_utsuho_bonus_desc: "增益自身的伤害加成，每获得§Y1.00%§!的['concept_utsuho_bonus']，所有的来源伤害加成都会提升§Y1.00%§!。例如具有§Y1000.00%§!的能量武器伤害加成与§Y100.00%§!的['concept_utsuho_bonus']，则额外获得§Y1000.00%§!的能量伤害加成。\n支持的伤害类型：§I能量§!、§I动能§!、§I灵力§!、§I引力武器§!、§I灵能武器§!、§I灵能抑制武器§!与§R冈格尼尔§!等东方MOD的武器类型。"
 concept_touhou_vulnerable: "易伤"
 concept_touhou_vulnerable_desc: "舰船所受到的伤害将会额外增加，此修正将与减伤互相抵消。"
 concept_touhou_barrier: "临时结界"
 concept_touhou_barrier_desc: "临时结界能够为我方舰船增加§H额外的护盾§!，该护盾可以§H超过§!舰船的§Y最大护盾值§!\n最多可以使得舰船的护盾达到相当于最大护盾值的§Y200.00%§!"
 concept_touhou_block: "格挡"
 concept_touhou_block_desc: "在持续时间内，能够阻挡固定值的伤害。"
 concept_touhou_frigile: "脆弱"
 concept_touhou_frigile_desc: "进入脆弱状态的舰船，其所受到的伤害将会额外增加固定值。\n脆弱属性值可以受到§Y100.00%§!的§Y灵力伤害加成§!。"

 concept_touhou_blood_slash: "猩红斩击"
 concept_touhou_blood_slash_desc: "附带了猩红斩击的攻击将使得被命中的舰船陷入['concept_touhou_bleeding',流血状态]，持续§G3-5§!£time£。"
 concept_touhou_bleeding: "流血"
 concept_touhou_bleeding_desc: "处于流血状态的舰船将会缓慢地损失装甲或舰体稳定性，但是不能直接致死。"
 concept_scarlet_destiny: "绯红命运"
 concept_scarlet_destiny_desc: "当舰船的§R['concept_scarlet_destiny']§!层数到达§R6.00§!层后，清空§R['concept_scarlet_destiny']§!层数，并且在§R2.00§!£time£内将无法造成任何伤害。\n\n§L命运已经被操纵改变了，强制结束你的回合！§!"
 concept_touhou_sunbeam: "星光射线"
 concept_touhou_sunbeam_desc: "生成一道隙间裂口，从星系黄道面上方召来一道魔炮光束，对敌人造成一定量的护盾伤害，该伤害可以受到$mod_weapon_type_spark_weapon_damage_mult$与$mod_weapon_type_lingli_weapon_damage_mult$的少量加成。"
 concept_touhou_cleanse: "净化"
 concept_touhou_cleanse_desc: "清除自身的['concept_touhou_bleeding',流血状态]，并且根据本次攻击的伤害偷取一定量的临时结界。"
 concept_touhou_constraint: "封印"
 concept_touhou_constraint_desc: "处于封印状态的舰船，移动速度将大幅度下降，并且闪避与射速会少量下降。"
 concept_touhou_echo_strike: "§B星尘幻想§!"
 concept_touhou_echo_strike_desc: "当['concept_touhou_echo_strike']层数到达§Y16.00§!层，舰船将进入['concept_touhou_echo',爆发状态]并清空全部的['concept_touhou_echo_strike']，持续§G6.00§!£time£。"
 concept_touhou_echo: "§B爆发§!"
 concept_touhou_echo_desc: "处于['concept_touhou_echo',爆发状态]的舰船，§B魔炮§!类武器的伤害增益将§G翻倍§!。"
 concept_touhou_poison: "§M中毒状态§!"
 concept_touhou_poison_desc: "处于中毒状态的敌人将会§G持续性的流失生命值§!，该伤害可以受到各类伤害加成，§Y无视盾甲保护§!，但§Y可以被减免§!，且§R无法摧毁舰船§!。"
 concept_touhou_ghostly: "§B天衣无缝§!"
 concept_touhou_ghostly_desc: "每§Y1.00§!£time£受到的伤害§G不会超过§!§Y10.00§!，且每§Y1.00§!£time£失去一层['concept_touhou_ghostly']。"
 concept_touhou_aoe_damage_titanic: "§E范围伤害§!"
 concept_touhou_aoe_damage_titanic_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，但循环科技的加成效率只有§Y75%§!，冷却§R$@touhou_aoe_damage_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_extra_large: "§E范围伤害§!"
 concept_touhou_aoe_damage_extra_large_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，但循环科技的加成效率只有§Y75%§!，冷却§R$@touhou_aoe_damage_extra_large_cooldown$§!£time£。"
 concept_touhou_aoe_damage_titanic_lunar_capital: "§E范围伤害§!"
 concept_touhou_aoe_damage_titanic_lunar_capital_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_capital_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_extra_large_lunar_capital: "§E范围伤害§!"
 concept_touhou_aoe_damage_extra_large_lunar_capital_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_capital_extra_large_cooldown$§!£time£。"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03a: "§E范围伤害§!"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03a_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_gravity_cannon_titanic_cooldown$§!£time£。"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03ag: "§E范围伤害§!"
 concept_touhou_aoe_damage_gravity_cannon_lunar_03ag_desc: "对命中舰船附近造成扩散性的一次性范围伤害，该伤害§H无视减伤§!且可以受到循环科技影响，冷却§R$@touhou_aoe_damage_lunar_gravity_cannon_extra_large_cooldown$§!£time£。"

 concept_touhou_bombardment_ruin_fortress: "轨道轰炸摧毁堡垒权重"
 concept_touhou_bombardment_ruin_fortress_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的削弱星球防御。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£有概率对星球上的一座['concept_touhou_fortress']造成连带伤害，使其被摧毁，该概率取所有轨道舰船提供的权重之和除以§Y10000.00§!。\n对于§G大于100%§!的概率，会继续§G额外的判定§!，直到剩余概率被消耗完。"
 concept_touhou_bombardment_kill_army: "轨道轰炸击杀陆军权重"
 concept_touhou_bombardment_kill_army_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的打击星球陆军。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£有概率对星球上的一支§H陆军§!造成§R致命伤害§!，该概率取所有轨道舰船提供的权重之和除以§Y10000.00§!。\n对于§G大于100%§!的概率，会继续§G额外的判定§!，直到剩余概率被消耗完。"
 concept_touhou_bombardment_damage_army: "轨道轰炸造成的范围陆军伤害"
 concept_touhou_bombardment_damage_army_desc: "§L在我们特殊能力引导下的轨道轰炸可以更加精准的锁定军事目标，从而更有效的打击星球陆军。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£可以对§G10%-25%§!的敌方陆军造成一定的连带伤害，该伤害取所有轨道舰船提供的伤害平均值。"
 concept_touhou_fortress: "堡垒建筑"
 concept_touhou_fortress_desc: "包含以下建筑：\n-$building_stronghold$\n-$building_fortress$\n-$building_fe_fortress$\n-$building_fe_stronghold$\n-$building_military_academy$\n-$building_planetary_shield_generator$\n-$building_spth_police_station$\n-§P先进型堡垒群§!"
 concept_touhou_bombardment_real_damage: "轨道轰炸造成的额外破坏度"
 concept_touhou_bombardment_real_damage_desc: "§L在我们特殊能力引导下的轨道轰炸可以发挥更大的威力，并且对星球护盾等防御手段具备穿透效应，从而更有效的造成破坏。§!\n\n轨道轰炸时，每§Y$@touhou_planet_bombardment_special_event_cooldown$§!£time£可以对星球造成一定的§H额外破坏度§!，该伤害取所有轨道舰船提供的伤害§Y平均值§!且§Y无法被任何常规手段减免§!。"

 concept_doremy_level: "§Y梦境等级§!"
 concept_doremy_level_desc: "§L在深层的梦境里，哆来咪会发挥更强的实力。§!\n\n哆来咪的梦境等级为§Y0.00§!时，为其指挥的舰队增加§Y64.00§!点能够阻隔固定伤害的屏障。\n每增加§Y1.00§!层梦境等级，都会提升该屏障§Y32.00§!点抗性。\n当哆来咪进入['concept_doremy_owner']或者眩晕状态时，将转化为食梦等级。"
 concept_doremy_owner: "§U梦境主宰者§!"
 concept_doremy_owner_desc: "§L作为梦境世界的支配者，她能够消灭、创造、替换一切生物的梦境。§!\n\n清除全部的梦境等级，并且转化为食梦等级；如果进入眩晕状态，则将当前的梦境等级转化为食梦等级。\n哆来咪将为其指挥的舰队增加§Y200.00§!点能够阻隔固定伤害的屏障。\n并且每§Y30.00§!£time£，都会追加召唤一队§H梦境实体§!，梦境造物§R不可能受到任何伤害§!，但只能存在最多§Y60.00§!£time£。"
 concept_touhou_accuray: "精准"
 concept_touhou_accuray_desc: "精准的伤害无法被任何手段闪避，必定会命中。"
 concept_touhou_time_broken: "§U时之破碎§!"
 concept_touhou_time_broken_desc: "处于['concept_touhou_time_broken',§U时之破碎状态§!]的舰船，每天都将受到额外的船体伤害和负面效果，并且暂时失去行动能力。"
 concept_touhou_time_attack: "§R时域冲击§!"
 concept_touhou_time_attack_desc: "当拥有大于等于§Y1.00§!层['concept_touhou_time_attack']时，每§Y6.00§!£time£触发一次§U时空震荡§!效果，扣除§Y1.00§!层['concept_touhou_time_attack']，并对所有敌人的§Y护盾与装甲§!造成基于当前['concept_touhou_time_attack']层数的伤害，该伤害可以享受$weapon_type_knife$类型武器的加成。"

 concept_touhou_hull_repair_percent: "§E战时每日船体再生§!"
 concept_touhou_hull_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大船体值§!§G固定比例§!的£hit_points£船体，该再生可以§G超出§!最多§Y100.00%§!的最大船体值。"
 concept_touhou_armor_repair_percent: "§E战时每日装甲再生§!"
 concept_touhou_armor_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大装甲值§!§G固定比例§!的£armor£装甲，该再生可以§G超出§!最多§Y100.00%§!的最大装甲值。"
 concept_touhou_shield_repair_percent: "§E战时每日护盾再生§!"
 concept_touhou_shield_repair_percent_desc: "进入战斗后，每§Y1.00§!天额外修复相当于§H最大护盾值§!§G固定比例§!的£shield£护盾，该再生可以§G超出§!最多§Y100.00%§!的最大护盾值。该修复§Y不会受到§!§H护盾过载§!产生的§R再生停用§!影响，在护盾过载后仍然可以正常修复，不需要额外充能时间。"
 concept_touhou_weapon_emp_charge: "§E改装器：电磁脉冲充能§!"
 concept_touhou_weapon_emp_charge_desc: "使得§H武器命中时§!额外施加以下效果：\n\n累积§Y1.00§!层§E电磁脉冲干扰§!，降低敌方的航速与武器伤害。\n§E电磁脉冲干扰§!达到§Y8.00§!层时，受到§R大量护盾伤害§!。\n§E电磁脉冲干扰§!达到§Y16.00§!层时，将会被暂时['concept_terrify',§R瘫痪§!]§Y1.00-3.00§!£time£。\n\n进入['concept_terrify',§R瘫痪状态§!]的舰船在§R18.00§!£time£内无法被再次施加§E电磁脉冲干扰§!。"
 concept_touhou_weapon_extra_damage: "§E改装器：暴击供能核心§!"
 concept_touhou_weapon_extra_damage_desc: ""
