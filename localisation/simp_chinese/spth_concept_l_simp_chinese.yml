l_simp_chinese:
 spth_word_concept_ap_hm3: "地狱之歌"
 spth_word_concept_ap_hm3_desc: "$ap_hm3_desc$\n本段文字出自欧洲中世纪炼金术文稿《瑞普利卷轴》"
 spth_word_concept_shield_efficiency: "§G护盾效率§!"
 spth_word_concept_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_efficiency: "§G装甲效率§!"
 spth_word_concept_armor_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_shield_efficiency: "护盾/装甲运行效率"
 spth_word_concept_armor_shield_efficiency_desc: "§G舰船上的神社可以通过一些原理不明的方式增加提升我们护盾装甲的运行效率。§!\n$spth_combat_system_close_sp_kuat_cond$\n\n运行效率分为两个部分的效果：\n§H刚进入战斗时§!，每提升§Ix§!的$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$，则提升该舰船§Y60*x§!的$MOD_SHIP_SHIELD_REGEN_ADD_STATIC$/$MOD_SHIP_ARMOR_REGEN_ADD_STATIC$。同时计算整个舰队的§S平均效率§!，每提升§Yx§!的§S平均效率§!，则降低敌方舰船护盾/装甲伤害§Yx*100%§!，但降低幅度不得高于§R50%§!\n§H战斗时每§Y$@spth_efficiency_system_check_interval$§!天运行§Y1§!次§!，尽可能保证该舰船硬化不低于§Y$mod_ship_spth_shield_efficiency$/$mod_ship_spth_armor_efficiency$ * 200%§!，并且尽可能使得敌方舰船对应穿透不高于§R100%§!。"
 spth_word_concept_armor_ship_weapon_tuning: "武器调谐"
 spth_word_concept_armor_ship_weapon_tuning_desc: ""
 spth_word_concept_weapon_use_target: "武器重新索敌"
 spth_word_concept_weapon_use_target_desc: "决定该武器在其他武器是否会提前击杀目标导致输出浪费的情况下，进行重新索敌。\n启用在某些情况下因为索敌效率得到提升，武器的有效伤害效率也会增加（避免溢出），但也会导致因为重新索敌导致的射速下降。\n禁用后该武器将不会进行再次索敌而是尽可能开火，但可能导致无效伤害（伤害溢出）。\n大部分原版和mod武器都是默认启用。"

 concept_spth_genso_industry: "幻想乡特色产业"
 concept_spth_genso_industry_desc: "['authority:auth_gensokyo']的['concept_spth_genso_district',特色区划]，['concept_spth_special_building',特殊建筑]与['concept_spth_common_building',普通建筑]提供了更强大的产出。\n这套产业依赖于['concept_spth_barrier_overloaded',星球结界]与['concept_spth_faith_strength',信仰]机制，['concept_spth_barrier_overloaded']与['concept_spth_faith_strength_pressure',信仰过载]可以产生增益与负面效果。\n同时['civic:origin_spth_story_gensokyo']会有着更强大的产能与科技。\n\n本mod内的经济体系包括两种特殊体系，幻想城与幻想星。幻想城主要依赖区划提供的岗位进行产出，定位类似理想城。而幻想星则有着较为复杂的产出维护公式，需自行进行产出配平。"
 concept_spth_genso_district: "幻想乡特色区划"
 concept_spth_genso_district_desc: "['authority:auth_gensokyo']的星球区划，大体上分为幻想城区划、幻想星区划、通用区划、灵力生产区划。\n幻想星区划需要依赖某些因素增加区划产出，如['district:district_gensokyo_misty_lake']；而幻想城区划则提供岗位进行产出，如['district:district_gensokyo_jiqiao']。此外，['district:district_spth_sp_produce']在幻想星上同样享受幻想星的产出公式。\n\n通用区划中的['district:district_spth_generic_factory']根据不同的殖民地规划提供不同类型的岗位，灵力生产区划则是任意星球类型可用的区划。"
 concept_spth_special_building: "幻想乡特殊建筑"
 concept_spth_special_building_desc: "['authority:auth_gensokyo']的星球副首府建筑(['building:building_spth_eientei'], ['building:building_spth_barrier_manager'], ['building:building_spth_kappa_labor_union'], ['building:building_spth_hakurei_shrine'], ['building:building_spth_moriya_shrine'])，以及会产生$mod_planet_barrier_capacity_use$的特殊建筑。大部分特殊建筑都会提供1个提供特定产出加成修正的特殊岗位。"
 concept_spth_common_building: "幻想乡普通建筑"
 concept_spth_common_building_desc: "['authority:auth_gensokyo']的普通量产建筑，产能相较['concept_spth_special_building']较高，但是不提供额外提供产出修正的岗位。"
 concept_spth_designation_construction: "§U东方繁星录§!: $planet_automation_designation_construction$"
 concept_spth_designation_construction_desc: "允许行星自动建设['concept_spth_genso_industry']，以符合行星的规划类型。当没有空缺岗位、或者一个待业的人口能够在同规划类型相关的岗位上工作时，会自动建造提供岗位的建筑和区划。\n\n该规划类型会自动建设§U东方繁星录§!的MOD建筑与区划。\n§U建筑建设方案§!: \n$t$['building:building_spth_cloner']: ['building:building_spth_cloner']将只会建设一个，且保证所在星球的$mod_planet_barrier_capacity_use$不会超出$mod_planet_barrier_capacity_add$。\n$t$['concept_spth_special_building']: \n$tt$§L副首府建筑§!: 根据殖民地类型建设合适的副首府建筑。\n$tt$特殊建筑：根据殖民地类型进行建设的同时保证所在星球的$mod_planet_barrier_capacity_use$不会超出$mod_planet_barrier_capacity_add$。\n$t$['concept_spth_common_building']与['concept_spth_genso_district']: 根据殖民地类型进行建设。"
 concept_spth_gensokyo_sp_trait: "§U$leader_trait_sp_leader$§!"
 concept_spth_gensokyo_sp_trait_desc: "$leader_trait_sp_leader_desc$"
 concept_ship_spth_extra_life: "§P残机§!"
 concept_ship_spth_extra_life_desc: "在舰船被击破后，可以消耗一个残机来进行复活（具体是在船体稳定性不足§Y1%§!时触发）。\n代价是会根据['concept_ship_spth_extra_life_power_down']的数值在一定时间内降低舰船火力。\n\n每个残机被消耗后都需要180天进行自然恢复。"
 concept_ship_spth_extra_life_power_down: "§E掉残火力惩罚§!"
 concept_ship_spth_extra_life_power_down_desc: "决定了在掉残后舰船伤害的减少程度，最多只能减少§Y90%§!的舰船伤害§Y修正§!。"
 concept_ship_toyohime_instant_kill: "丰姬的扇子"
 concept_ship_toyohime_instant_kill_desc: "丰姬的扇子拥有能把一切物质分解为基本粒子的能量。\n\n进入战斗后：\n该武器伤害会§R大幅增加§!\n击杀一定数量舰船后恢复正常"
 concept_weapon_type_th_toyohime: "§B天之扇§!"
 concept_weapon_type_th_toyohime_desc: "$concept_ship_toyohime_instant_kill_desc$"
 concept_spth_start_select_leaders: "幻想乡开局领袖"
 concept_spth_start_select_leaders_desc: "游戏开局可以初始拥有幻想乡中各势力的领袖，其拥有各种强力特性与能力。"
 concept_ship_hyper_point: "§U月华石§!"
 concept_ship_hyper_point_desc: "击杀不同大小的敌舰可以获得不同数量的['concept_ship_hyper_point']，当['concept_ship_hyper_point']达到§G24§!后，舰船将进入['concept_status_th_hyper']状态。"
 concept_status_th_hyper: "§P暴走§!"
 concept_status_th_hyper_desc: "舰船以获得§R+32%§!的['concept_touhou_vulnerable']为代价:\n$t$自身部分武器射速§G翻倍§!\n$t$清除自身全部的['concept_ship_hyper_point']\n$t$获得等同于自身§G最大护盾§!的减伤，持续2£time£\n$t$持续期间无法获得['concept_ship_hyper_point']\n该状态将持续8£time£"

 concept_spth_ship_skill: "§U特殊动作§!"
 concept_spth_ship_skill_desc: "某些舰船会具备['concept_spth_ship_skill']，你可以通过舰队界面来打开这些['concept_spth_ship_skill']的访问菜单。\n对于普通舰船需要使用幻想乡的反应堆才能使用['concept_spth_ship_skill']。"
 concept_spth_ship_skill_yuyuko: "§H华胥的永眠§!"
 concept_spth_ship_skill_yuyuko_desc: "召唤一支会被§G优先打击§!且§G较难摧毁§!的幽灵舰队协助作战，该舰队将在§G12§!£time£后消失。\n\n消耗: §R1000§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_satori: "§H真实之视§!"
 concept_spth_ship_skill_satori_desc: "强制解除距离自身超空间航道距离§G2§!跳以内所有敌方舰船的隐身，当退出隐身时还会受到§G负面影响§!。\n\n消耗: §R2000§!£sr_fuka£\n冷却：§R180§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!§!"
 concept_spth_ship_skill_reimu: "§H梦想亚空穴§!"
 concept_spth_ship_skill_reimu_desc: "利用亚空穴将当前舰队在短时间内跃迁到§G可以到达的所有星系§!。\n\n消耗: §R3200§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!§!"
 concept_spth_ship_skill_scarlet: "§H绯红星辰之枪§!"
 concept_spth_ship_skill_scarlet_desc: "提供相当于当前舰队的灵力伤害加成50%的$weapon_type_gungnir$伤害加成。\n\n消耗: §R2400§!£sr_fuka£\n冷却：§R240§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!"§!
 concept_spth_ship_skill_sanae: "§H客星辉煌之夜§!"
 concept_spth_ship_skill_sanae_desc: "以自身§R50%§!的护盾能量为代价，使得敌方的§G大部分§!护盾暂时无效化。\n\n消耗: §R5600§!£sr_fuka£\n冷却：§R270§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_sanae_shrine: "§H维度隐形系统§!"
 concept_spth_ship_skill_sanae_shrine_desc: "利用引发奇迹程度的能力，使得巨大的太空堡垒能隐藏于维度褶皱之中。\n\n消耗: §R6400§!£sr_fuka£\n解除隐身后冷却：§R360§!£time£\n§K再次使用可以解除隐身§!"
 concept_spth_ship_skill_yukari: "§H幻想的境界§!"
 concept_spth_ship_skill_yukari_desc: "操纵真实与虚幻的境界，在遥远的星系中投射当前舰队的幻影，幻影舰队能够存在45£time£。\n\n消耗: §R4800§!£sr_fuka£\n冷却：§R360§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_space_shrine_drive: "§H跃迁驱动器超频§!"
 concept_spth_ship_skill_space_shrine_drive_desc: "通过超频$spth_space_shrine_station_ftl$，使我们的太空堡垒在90£time£内可以连续进行跃迁。\n\n消耗: §R7200§!£sr_fuka£\n冷却：§R450§!£time£\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_super_carrier_eater: "§H星落「究竟涅槃」§!"
 concept_spth_ship_skill_super_carrier_eater_desc: "§H远程攻击目标§!\n通过超级航母上的隙间驱动器开辟隙间裂口，使用其主炮对遥远的星系发动精确且致命的打击，打击效果取决于攻击模式。\n\n消耗: §R19200§!£sr_fuka£\n冷却：§G30§!£time£ + §G动态冷却时间§!\n§H动态冷却时间取决于攻击模式，且可以受到§Y灵力与动能武器射速修正影响§!，但效率只有§Y25%§!§!"
 concept_spth_ship_skill_space_shrine_beacon: "§H隙间跃迁系统§!"
 concept_spth_ship_skill_space_shrine_beacon_desc: "$spth_space_shrine_station_ftl$能够开辟多重大型隙间裂口，从而使得星系内的其他舰队与太空堡垒一同跃迁。\n\n消耗: §R17000§!£sr_fuka£\n冷却：§R200§!£time£\n§L使用该技能后，在跃迁时即可触发该效果。§!\n§H该技能的冷却时间为§R所有舰队彼此共享§!§!"
 concept_spth_ship_skill_monadic_qerr: "§H现实编辑§!"
 concept_spth_ship_skill_monadic_qerr_desc: "利用视界刺针进行现实编辑。\n\n消耗: §R3200§!£sr_fuka£\n冷却：§R720§!£time£\n§H该技能的冷却时间为§G每个舰队互相独立§!"
 concept_spth_super_carrier_switch_planet_killer_mode: "切换神隐之触输出功率"
 concept_spth_super_carrier_switch_planet_killer_mode_desc: ""
 concept_spth_super_carrier_switch_remote_mode: "§H调整跨星系攻击功率§!"
 concept_spth_super_carrier_switch_remote_mode_desc: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。"
 concept_spth_super_carrier_switch_remote_mode_tooltip: "调整超级航母主炮的输出功率，从而改变['concept_spth_ship_skill_super_carrier_eater']的打击效果。\n点击可以在['concept_spth_super_carrier_remote_attack_fleet']、['concept_spth_super_carrier_remote_attack_star']、['concept_spth_super_carrier_remote_attack_star_1']三种攻击模式中轮换。\n当前的攻击模式: [spth_super_carrier_get_remote_mode]"
 spth_super_carrier_remote_mode_1: "['concept_spth_super_carrier_remote_attack_fleet']"
 spth_super_carrier_remote_mode_2: "['concept_spth_super_carrier_remote_attack_star']"
 spth_super_carrier_remote_mode_3: "['concept_spth_super_carrier_remote_attack_star_1']"
 concept_spth_super_carrier_remote_attack_fleet: "§H打击舰队§!"
 concept_spth_super_carrier_remote_attack_fleet_desc: "超级航母的主炮释放的能量能够对目标星系中的敌方舰队造成致命伤害，这一过程中能量会被精细的引导来避免对星系中的天体造成损伤。\n\n冷却: 720£time£"
 concept_spth_super_carrier_remote_attack_star: "§H转化恒星§!"
 concept_spth_super_carrier_remote_attack_star_desc: ""超级航母的主炮释放的能量不足以彻底摧毁恒星，但撕裂空间的攻击和磅礴的灵力将会席卷整个恒星，使其转化为灵力星体，同时对星系内殖民地造成可怕的伤害。\n\n冷却: 1280£time£"
 concept_spth_super_carrier_remote_attack_star_1: "§H摧毁恒星§!"
 concept_spth_super_carrier_remote_attack_star_1_desc: "超级航母的主炮释放的能量将会引爆恒星，制造一场超新星爆发，引导超新星爆发释放的少量能量来摧毁恒星系中的几乎所有天体，大部分能量则用于彻底熄灭这颗恒星。\n\n冷却: 1800£time£"
 touhou_ship_action_super_carrier_eater_cooldown: "['concept_spth_ship_skill_super_carrier_eater']冷却"
 touhou_ship_action_super_carrier_eater_cooldown_tt: "§R超级航母主炮射速：减半§!"
 touhou_ship_action_super_carrier_eater_cooldown_desc: "超级航母的跨星系打击能力正在冷却。"

 TOUHOU_DIFFICULTY_LINGLI_FIRERATE: "$TABBED_NEW_LINE$—$mod_weapon_type_lingli_weapon_fire_rate_mult$"
 TOUHOU_DIFFICULTY_LINGLI_DAMAGE: "$TABBED_NEW_LINE$—$mod_weapon_type_lingli_weapon_damage_mult$"
 TOUHOU_DIFFICULTY_GUNGNIR_DAMAGE: "$TABBED_NEW_LINE$—$mod_weapon_type_gungnir_weapon_damage_mult$"
 concept_touhou_difficulty: "§E难度系数§!"
 concept_touhou_difficulty_desc: "['concept_touhou_difficulty']会影响本MOD内各种事件敌人的作战能力。\n一般而言，EASY难度为难度系数1，而LUNATIC难度为难度系数4，OVERDRIVE难度为难度系数8。"
 concept_touhou_difficulty_shield_kamikakushi: "§E难度修正§!"
