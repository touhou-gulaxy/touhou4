 building_izakaya_ingredient_twin_stemmed_lotus: "£izakaya_ingredients_item_twin_stemmed_lotus£$IZAKAYA_TIER_2_COLOR_PREFIX$并蒂莲$IZAKAYA_TIER_COLOR_ENDFIX$"
 building_izakaya_ingredient_twin_stemmed_lotus_desc: "根茎生长在桥的附近，花朵成熟后会破水而出，淡红色并有淡香味。高级食材，也是地底人的节日装饰。"
 building_izakaya_ingredient_twin_stemmed_lotus_tt: "关联料理：['izakaya_food_fantasy_star_lotus_boat']、['izakaya_food_lotus_flower_fish_and_rice_cups']\n食材数量：§Y[owner.izakaya_ingredient_twin_stemmed_lotus_val]/[get_izakaya_ingredient_max_val]§!"
