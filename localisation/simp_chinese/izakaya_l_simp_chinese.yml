 izakaya_food_cheesy_corn_baked_sweet_potatoes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_corn$、$building_izakaya_ingredient_sweet_potatoes$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_cheese$\n香浓芝士遇上清甜玉米和软糯红薯，一口下去甜蜜交织，温暖又饱腹，是幸福的味道。穰子的小秘方是在其中加入葡萄干，不仅增加了些许甜味，还提升了口感和营养。"
