 izakaya_food_roasted_sweet_potato_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sweet_potatoes$\n无论什么时候都大受欢迎的民间小吃。尤其在寒冷的冬天，看到热气腾腾的烤炉，想到那红皮黄瓤的颜色，热乎甜软的口感，谁能忍得住呢？但不能贪嘴，吃太多容易导致胃腹不适。"
