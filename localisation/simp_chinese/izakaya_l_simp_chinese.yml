 izakaya_food_star_and_moon_peach_cake: "£izakaya_result_foods_item_star_and_moon_peach_cake£星月桃子糕"
 izakaya_food_star_and_moon_peach_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_dew$\n给食欲不振的病人开胃的甜点，使用了幻昙华和月光草模拟了星光和月光，而桃子的甜香底味可以很好的刺激病人的胃口，又不至于过于刺激。是非常精致又非常贴心的甜点呢，不愧是月之头脑的作品。"
