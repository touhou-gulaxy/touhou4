 izakaya_food_cream_baked_crab: "£izakaya_result_foods_item_cream_baked_crab£奶油焗蟹"
 izakaya_food_cream_baked_crab_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_crab$\n奶油焗的螃蟹在没开盖之前就已经香气四溢，然而这香气只是前戏。撕开蟹钳，弹出白嫩饱满的肉质，此时再细细地吸入汤汁，螃蟹固有的鲜味才彻底的融合和释放。"
