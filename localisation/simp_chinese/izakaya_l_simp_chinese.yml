 izakaya_food_scary_halloween_night_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_marshmallows$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_corn$\n从古老传说中外界庆祝丰收的节日中获得的灵感而制作出的料理。在名为南瓜头的“城堡”里，可可豆制成的黑巧克力化身“蝙蝠”，棉花糖扮演“幽灵”。万圣夜的惊喜藏于雕刻南瓜灯内，黑巧蝙蝠和棉花糖幽灵静卧此处，松露为这道奇妙菜品增加了风味和高级感。最中央则是玉米杆搭成的稻草人，不仅是丰收的象征，更为这份“艺术品”增添了一笔惊怖气氛。"
