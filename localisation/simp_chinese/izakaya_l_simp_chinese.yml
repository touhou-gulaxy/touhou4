 izakaya_food_white_deer_and_upright_pine: "£izakaya_result_foods_item_white_deer_and_upright_pine£白鹿贞松"
 izakaya_food_white_deer_and_upright_pine_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_pine_nuts$\n白鹿和松树都有长寿的寓意，深受追求长生的道教人士的推崇，于是有“鹿寿松贞”之画，即一只白鹿立于松树之下。这道菜就是以这幅画为印象创作出来的。"
