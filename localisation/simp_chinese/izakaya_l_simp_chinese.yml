 izakaya_food_golden_crispy_fish_cakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_honey$\n在鱼馅儿内加入适量蜂蜜搅拌后，碾压成鱼饼，投入油锅炸至金黄色，随炸随食。"
