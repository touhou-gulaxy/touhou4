 building_izakaya_ingredient_lotus_seeds: "£izakaya_ingredients_item_lotus_seeds£莲子"
 building_izakaya_ingredient_lotus_seeds_desc: "非常古老的水生植物——莲的种子。莲子的芯很苦，千万得处理好，别混到料理给客人吃了。"
 building_izakaya_ingredient_lotus_seeds_tt: "关联料理：['izakaya_food_arhats_vegetarian_dish']、['izakaya_food_sacred_white_lotus_seed_cake']、['izakaya_food_fantasy_star_lotus_boat']、['izakaya_food_lotus_flower_fish_and_rice_cups']、['izakaya_food_nourishing_heart_porridge']\n食材数量：§Y[owner.izakaya_ingredient_lotus_seeds_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_sweet_potatoes: "£izakaya_ingredients_item_sweet_potatoes£地瓜"
 building_izakaya_ingredient_sweet_potatoes_desc: "世上最实在的食材！不仅香甜软糯，而且能强效地应对饥饿，在冬天还有暖手的效果。"
 building_izakaya_ingredient_sweet_potatoes_tt: "关联料理：['izakaya_food_roasted_sweet_potato']、['izakaya_food_candied_sweet_potatoes']、['izakaya_food_spring_triumph']、['izakaya_food_the_work_of_the_autumn_god']、['izakaya_food_cheesy_corn_baked_sweet_potatoes']\n食材数量：§Y[owner.izakaya_ingredient_sweet_potatoes_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_pine_nuts: "£izakaya_ingredients_item_pine_nuts£松子"
 building_izakaya_ingredient_pine_nuts_desc: "红松树的种子。据说在外界已经被列为濒危物种，但在幻想乡仍然很常见。传说松子有延年益寿的功能，是古代道士辟谷时的常备之物。"
 building_izakaya_ingredient_pine_nuts_tt: "关联料理：['izakaya_food_arhats_vegetarian_dish']、['izakaya_food_pine_nut_cake']、['izakaya_food_white_deer_and_upright_pine']\n食材数量：§Y[owner.izakaya_ingredient_pine_nuts_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_chestnuts: "£izakaya_ingredients_item_chestnuts£板栗"
 building_izakaya_ingredient_chestnuts_desc: "相传道教创始人修炼时，由于不爱荤腥，便栽了许多板栗树，以栗代饭。栗子种仁肥厚，营养丰富，不仅受到许多道教人士的推崇，也经常被农民用来代替粮食。"
 building_izakaya_ingredient_chestnuts_tt: "关联料理：['izakaya_food_candied_chestnuts']、['izakaya_food_tianshi_chestnut_braised_mushrooms']、['izakaya_food_chestnut_cake']、['izakaya_food_spring_triumph']、['izakaya_food_the_work_of_the_autumn_god']\n食材数量：§Y[owner.izakaya_ingredient_chestnuts_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_plums: "£izakaya_ingredients_item_plums£梅子"
 building_izakaya_ingredient_plums_desc: "果梅树结的果实，可以盐渍或干制。做成梅干后有种咸中带酸的特殊口感，能够大大激起食欲，且品尝后唇齿留甘，让人回味无穷。"
 building_izakaya_ingredient_plums_tt: "关联料理：['izakaya_food_turn_the_world_upside_down']、['izakaya_food_plum_tea_soaked_rice']、['izakaya_food_garden_of_poisonous_mists']\n食材数量：§Y[owner.izakaya_ingredient_plums_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_red_beans: "£izakaya_ingredients_item_red_beans£红豆"
 building_izakaya_ingredient_red_beans_desc: "又称赤豆，是适应能力较强的草本植物，食用能够起到增强自身免疫力和抗病能力的效果。古代人觉得中风得病都是疫鬼作祟，所以有“赤豆打鬼”的传说。"
 building_izakaya_ingredient_red_beans_tt: "关联料理：['izakaya_food_red_bean_daifuku']、['izakaya_food_dorayaki']、['izakaya_food_peach_blossom_glass_roll']\n食材数量：§Y[owner.izakaya_ingredient_red_beans_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_fresh_flowers: "£izakaya_ingredients_item_fresh_flowers£鲜花"
 building_izakaya_ingredient_fresh_flowers_desc: "一朵朵绚丽烂漫的鲜花扎成的花束。花儿们以生命为代价也要完成的事，必须要对此付出敬意！"
 building_izakaya_ingredient_fresh_flowers_tt: "关联料理：['izakaya_food_turn_the_world_upside_down']、['izakaya_food_flowers_birds_wind_and_moon']、['izakaya_food_a_serene_dream']、['izakaya_food_cherry_blossom_and_star_dust_jade_stew']、['izakaya_food_spanish_cold_soup']\n食材数量：§Y[owner.izakaya_ingredient_fresh_flowers_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_toon_tree_leaves: "£izakaya_ingredients_item_toon_tree_leaves£香椿"
 building_izakaya_ingredient_toon_tree_leaves_desc: "一种常见的野菜。具有一定的毒性，不建议过量食用，并且食用前须焯水烹饪。"
 building_izakaya_ingredient_toon_tree_leaves_tt: "关联料理：['izakaya_food_mystical_mushrooms_of_the_green_fields']、['izakaya_food_toon_tree_pancakes']\n食材数量：§Y[owner.izakaya_ingredient_toon_tree_leaves_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_tomatoes: "£izakaya_ingredients_item_tomatoes£西红柿"
 building_izakaya_ingredient_tomatoes_desc: "颜色鲜艳的浆果，曾经还因为太鲜艳被视为“狐狸的果实”，觉得它具有剧毒，所以只用来观赏。在发现可以食用以后就开始大面积种植了。"
 building_izakaya_ingredient_tomatoes_tt: "关联料理：['izakaya_food_fried_tomato_strips']、['izakaya_food_fantasy_craze']、['izakaya_food_spanish_cold_soup']\n食材数量：§Y[owner.izakaya_ingredient_tomatoes_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_cocoa_beans: "£izakaya_ingredients_item_cocoa_beans£可可豆"
 building_izakaya_ingredient_cocoa_beans_desc: "可可树的果实。据说在不同地区有不同的风味，有的会带点儿果香，有的带有烟熏的风味。可以磨成粉食用，是制作巧克力的基本原料。"
 building_izakaya_ingredient_cocoa_beans_tt: "关联料理：['izakaya_food_cat_canele']、['izakaya_food_cat_playing_in_water']、['izakaya_food_mad_hatters_tea_party']、['izakaya_food_dragons_roar_peach']、['izakaya_food_molecular_egg']、['izakaya_food_source_of_life']、['izakaya_food_sculpture_of_justice']、['izakaya_food_ember_colored_demon_patterned_mille_feuille']、['izakaya_food_creamy_sweet_pancake_rolls']、['izakaya_food_scary_halloween_night']\n食材数量：§Y[owner.izakaya_ingredient_cocoa_beans_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_broccoli: "£izakaya_ingredients_item_broccoli£西兰花"
 building_izakaya_ingredient_broccoli_desc: "魔界土壤培育出来的西蓝花。因为光照不足植株徒长，花球颜色和地上也略微有些不同。"
 building_izakaya_ingredient_broccoli_tt: "关联料理：\n食材数量：§Y[owner.izakaya_ingredient_broccoli_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_pupu_yo_fruit: "£izakaya_ingredients_item_pupu_yo_fruit£噗噗哟果"
 building_izakaya_ingredient_pupu_yo_fruit_desc: "魔界里到处可见的怪异果子。似乎会根据食用者的类型产生不同的食用效果，十分奇特。"
 building_izakaya_ingredient_pupu_yo_fruit_tt: "关联料理：\n食材数量：§Y[owner.izakaya_ingredient_pupu_yo_fruit_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_schisandra: "£izakaya_ingredients_item_schisandra£薜茘"
 building_izakaya_ingredient_schisandra_desc: "一种药食两用植物。将薜荔籽浸泡后搓汁，冷藏后会凝固成晶莹剔透的胶状物，可以用来制作果冻和凉粉等，是消暑神品。、"
 building_izakaya_ingredient_schisandra_tt: "关联料理：['izakaya_food_cat_playing_in_water']、['izakaya_food_peach_blossom_glass_roll']、['izakaya_food_moonlight_over_the_lotus_pond']、['izakaya_food_mars']\n食材数量：§Y[owner.izakaya_ingredient_schisandra_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_silver_ear_mushrooms: "£izakaya_ingredients_item_silver_ear_mushrooms£银耳"
 building_izakaya_ingredient_silver_ear_mushrooms_desc: "一种像花儿一样美丽的菌类。据说历代皇家贵族把银耳看作延年益寿之品，但在月都似乎很常见。这种看起来一尘不染的洁白，和月都的感觉很相衬。"
 building_izakaya_ingredient_silver_ear_mushrooms_tt: "关联料理：['izakaya_food_sea_urchin_shingen_mochi']、['izakaya_food_moonlight_over_the_lotus_pond']、['izakaya_food_source_of_life']、['izakaya_food_nourishing_heart_porridge']\n食材数量：§Y[owner.izakaya_ingredient_silver_ear_mushrooms_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_high_potency_capsaicin: "£izakaya_ingredients_item_high_potency_capsaicin£强效辣椒素"
 building_izakaya_ingredient_high_potency_capsaicin_desc: "使用了月之科技制作的极·辣品，能让食用者留下恐怖的回忆。是不是真的用辣椒做的就说不清了。"
 building_izakaya_ingredient_high_potency_capsaicin_tt: "关联料理：\n食材数量：§Y[owner.izakaya_ingredient_high_potency_capsaicin_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_bellflower: "£izakaya_ingredients_item_bellflower£铃仙"
 building_izakaya_ingredient_bellflower_desc: "我是谁？？？我在哪？？？我为什么会在这里？？？"
 building_izakaya_ingredient_bellflower_tt: "不可用于合成，适合拍照（？）\n食材数量：§Y[owner.izakaya_ingredient_bellflower_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_gold_leaf: "£izakaya_ingredients_item_gold_leaf£金箔"
 building_izakaya_ingredient_gold_leaf_desc: "用高纯度黄金反复捶打制成的食材，能让食物看起来更加昂贵。"
 building_izakaya_ingredient_gold_leaf_tt: "关联料理：['izakaya_food_hyper_dimensional_inferno_barbecue_feast']、['izakaya_food_creamy_sweet_pancake_rolls']、['izakaya_food_the_work_of_the_autumn_god']\n食材数量：§Y[owner.izakaya_ingredient_gold_leaf_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_coconut: "£izakaya_ingredients_item_coconut£椰子"
 building_izakaya_ingredient_coconut_desc: "不知道从哪儿流入的外来食材，坚硬的外壳下有美味的果肉和丰富的汁水。"
 building_izakaya_ingredient_coconut_tt: "关联料理：\n食材数量：§Y[owner.izakaya_ingredient_coconut_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_cactus: "£izakaya_ingredients_item_cactus£仙人掌"
 building_izakaya_ingredient_cactus_desc: "浑身长满刺的食材，需要细心处理后才能食用。"
 building_izakaya_ingredient_cactus_tt: "关联料理：\n食材数量：§Y[owner.izakaya_ingredient_cactus_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_green_onions: "£izakaya_ingredients_item_green_onions£大葱"
 building_izakaya_ingredient_green_onions_desc: "人间之里产的食材，十分常见。作为调味品或是直接吃都是个不错的选择。"
 building_izakaya_ingredient_green_onions_tt: "关联料理：['izakaya_food_russian_chilled_soup']\n食材数量：§Y[owner.izakaya_ingredient_green_onions_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_garlic: "£izakaya_ingredients_item_garlic£大蒜"
 building_izakaya_ingredient_garlic_desc: "人间之里产的食材，十分常见。传闻对吸血鬼有独特的杀伤力。"
 building_izakaya_ingredient_garlic_tt: "关联料理：['izakaya_food_spanish_cold_soup']\n食材数量：§Y[owner.izakaya_ingredient_garlic_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_corn: "£izakaya_ingredients_item_corn£玉米"
 building_izakaya_ingredient_corn_desc: "人间之里产的食材，十分常见。既可以作为主食，也可以拿来煲汤。"
 building_izakaya_ingredient_corn_tt: "关联料理：['izakaya_food_grilled_corn']、['izakaya_food_cheesy_corn_baked_sweet_potatoes']、['izakaya_food_scary_halloween_night']\n食材数量：§Y[owner.izakaya_ingredient_corn_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_condensed_milk: "£izakaya_ingredients_item_condensed_milk£炼乳"
 building_izakaya_ingredient_condensed_milk_desc: "经过精炼的奶制品，具备非同寻常的甜度，适合用来制作甜点一类的料理。"
 building_izakaya_ingredient_condensed_milk_tt: "关联料理：['izakaya_food_sculpture_of_justice']、['izakaya_food_russian_chilled_soup']、['izakaya_food_spring_triumph']\n食材数量：§Y[owner.izakaya_ingredient_condensed_milk_val]/[get_izakaya_ingredient_max_val]§!"
 building_izakaya_ingredient_marshmallows: "£izakaya_ingredients_item_marshmallows£棉花糖"
 building_izakaya_ingredient_marshmallows_desc: "直接拿来吃或者用来做菜都非常不错的小零食，很受孩子们的欢迎。"
 building_izakaya_ingredient_marshmallows_tt: "关联料理：['izakaya_food_fuzzy_mushroom_soup']、['izakaya_food_scary_halloween_night']\n食材数量：§Y[owner.izakaya_ingredient_marshmallows_val]/[get_izakaya_ingredient_max_val]§!"
 izakaya_food_seafood_miso_soup: "£izakaya_result_foods_item_seafood_miso_soup£海鲜味噌汤"
 izakaya_food_seafood_miso_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_nori$\n居酒屋常见的快手汤羹。来历不明却随处可见的海带在幻想乡出现之初，有人好奇水煮了一下，结果意外地发现有种异样的鲜味，从此便在幻想乡流行开了。"
 izakaya_food_tofu_miso: "£izakaya_result_foods_item_tofu_miso£豆腐味噌"
 izakaya_food_tofu_miso_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$\n居酒屋常见的快手汤羹。使用了豆腐来提鲜，最简单又最原始的美味。"
 izakaya_food_energy_soup: "£izakaya_result_foods_item_energy_soup£力量汤"
 izakaya_food_energy_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_wild_boar$\n荤素搭配的美味汤羹。使用了野猪肉和海带煲煮而成，能最快捷地补充身体所需能量。"
 izakaya_food_smoked_pork_and_trout: "£izakaya_result_foods_item_smoked_pork_and_trout£猪肉鳟鱼熏"
 izakaya_food_smoked_pork_and_trout_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_pork$\n把猪肉和鳟鱼放在一起熏制而成，是简单好吃的肉食料理，也比较能保存。"
 izakaya_food_grilled_eel: "£izakaya_result_foods_item_grilled_eel£烤八目鳗"
 izakaya_food_grilled_eel_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_conger_eel$\n本店招牌。为了打破红灯笼店就是烤鸟肉店的成见，特意选择了对夜盲症有奇效的八目鳗，据说在过去还被视作珍宝。"
 izakaya_food_energy_skewers: "£izakaya_result_foods_item_energy_skewers£能量串"
 izakaya_food_energy_skewers_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_pumpkin$\n牛肉搭配洋葱、南瓜烤成的串串。巧妙地利用了洋葱的刺激和南瓜的甜味去除肉质的油腻，食之更加清爽。"
 izakaya_food_niten_ichi_ryu: "£izakaya_result_foods_item_niten_ichi_ryu£二天一流"
 izakaya_food_niten_ichi_ryu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wild_boar$、$building_izakaya_ingredient_kurobuta_pork$\n传说中和鬼立下赌约并获胜的人类剑士所创下的烤串流派，特别使用了野性十足的肉类烧制而成，食之有种冲天的气魄，让人惊叹不已。"
 izakaya_food_rice_balls: "£izakaya_result_foods_item_rice_balls£饭团"
 izakaya_food_rice_balls_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_nori$\n最普通的饭团，加点儿海带随便捏捏就可以了，超便捷的经典。"
 izakaya_food_seared_pork_rice_ball: "£izakaya_result_foods_item_seared_pork_rice_ball£炙猪肉饭团"
 izakaya_food_seared_pork_rice_ball_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$\n常见的平价饭团。在饭团中放入烤制后的猪肉，为其增加了一份香浓的嚼劲。"
 izakaya_food_warm_rice_ball: "£izakaya_result_foods_item_warm_rice_ball£温暖饭团"
 izakaya_food_warm_rice_ball_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_trout$\n常见的平价饭团。内馅儿加入了鳟鱼和洋葱，融合了海鲜的细腻口感和洋葱的炽热，无论是营养还是口感都属上佳。"
 izakaya_food_cherry_blossom_snow: "£izakaya_result_foods_item_cherry_blossom_snow£樱落雪"
 izakaya_food_cherry_blossom_snow_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_premium_tuna$\n高级寿司的一种。粉红色的高级生鱼片盖在白米饭上，就如樱花飘落在白雪上，有着不可思议的美感。"
 izakaya_food_stir_fried_shredded_pork: "£izakaya_result_foods_item_stir_fried_shredded_pork£炒肉丝"
 izakaya_food_stir_fried_shredded_pork_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$\n以猪肉作为主要食材制作而成的家常菜，口味偏重。"
 izakaya_food_chilled_tofu: "£izakaya_result_foods_item_chilled_tofu£冷豆腐"
 izakaya_food_chilled_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_tofu$\n夏天的消暑下酒菜，简单爽口。"
 izakaya_food_braised_eel: "£izakaya_result_foods_item_braised_eel£红烧鳗鱼"
 izakaya_food_braised_eel_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_conger_eel$\n本店招牌。将鳗鱼用特殊酱料进行烧制后肉汁四溢，光闻着香味便让人垂涎不已。"
 izakaya_food_potato_croquettes: "£izakaya_result_foods_item_potato_croquettes£土豆可乐饼"
 izakaya_food_potato_croquettes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_potatoes$\n主要由土豆制成的，外表酥脆，内在绵软可口，在油炸类食品中有着较高的人气。"
 izakaya_food_game_cannon: "£izakaya_result_foods_item_game_cannon£野味加农"
 izakaya_food_game_cannon_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_kurobuta_pork$\n用农家蔬菜佐以优质黑毛猪肉炖煮的烩锅。口感饱满，香浓却不油腻，是农家人最高级的大菜。"
 izakaya_food_pork_rice_bowl: "£izakaya_result_foods_item_pork_rice_bowl£猪肉盖浇饭"
 izakaya_food_pork_rice_bowl_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$\n常见的家常菜。看上去颗颗饭粒饱满，淋上的香酱和猪肉的口感融为一体，令人胃口倍增。"
 izakaya_food_beef_rice_bowl: "£izakaya_result_foods_item_beef_rice_bowl£牛肉盖浇饭"
 izakaya_food_beef_rice_bowl_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$\n常见的家常菜。看上去颗颗饭粒饱满，淋上的香酱和牛肉的口感融为一体，令人胃口倍增。"
 izakaya_food_fried_eel: "£izakaya_result_foods_item_fried_eel£炸八目鳗"
 izakaya_food_fried_eel_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_conger_eel$\n本店招牌。长相怪异的八目鳗在喜欢尝鲜的幻想乡曾一度成为话题，油炸后爽滑酥嫩，深受大众喜爱。"
 izakaya_food_vegetable_specials: "£izakaya_result_foods_item_vegetable_specials£蔬菜专辑"
 izakaya_food_vegetable_specials_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_pumpkin$\n用新鲜的蔬菜生拌而成的沙拉。口感清新，可以去除嘴里的油腻，不知为何被年轻的姑娘们奉为减肥圣餐。"
 izakaya_food_white_snow: "£izakaya_result_foods_item_white_snow£白雪"
 izakaya_food_white_snow_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_fugu$、$building_izakaya_ingredient_conger_eel$、$building_izakaya_ingredient_nori$\n使用鲜美的八目鳗和河豚，再佐以海带炖煮而成的高级烩锅。由于煮的过程中会飘出纯白的泡沫而得名，是非常高级的家庭料理。"
 izakaya_food_tofu_hot_pot: "£izakaya_result_foods_item_tofu_hot_pot£豆腐锅"
 izakaya_food_tofu_hot_pot_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$\n由豆腐炖煮而成的烩锅。滑嫩的口感再加上其本身具有的较高营养价值，使这道平价料理成为居酒屋最常见的烩锅。"
 izakaya_food_zatsui: "£izakaya_result_foods_item_zatsui£杂炊"
 izakaya_food_zatsui_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_trout$\n使用一些边角料食材杂烩而成的烩锅。享受美味的同时还能避免浪费，可谓一举两得。"
 izakaya_food_sashimi_platter: "£izakaya_result_foods_item_sashimi_platter£刺身拼盘"
 izakaya_food_sashimi_platter_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_tuna$\n作为和风料理的代表，将刺身级的三文鱼和金枪鱼鱼生配上芥末和酱油，引出鲜味的绝妙料理。"
 izakaya_food_grand_feast: "£izakaya_result_foods_item_grand_feast£大奢宴"
 izakaya_food_grand_feast_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_fugu$\n奢侈地选用了一系列高级食材炖煮成烩锅。通过火候的精妙控制，将食材之间的特点全部提炼了出来，肉质鲜嫩多汁、香滑入味，令人其味无穷。"
 izakaya_food_tonkotsu_ramen: "£izakaya_result_foods_item_tonkotsu_ramen£豚骨拉面"
 izakaya_food_tonkotsu_ramen_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_nori$\n用猪肉和蔬菜经过长时间熬制出来的高汤，堪称整碗拉面的精髓和灵魂所在。香浓醇厚的豚骨汤底配上香弹可口的拉面，饱腹之余也让舌尖得到最大的满足。"
 izakaya_food_magma: "£izakaya_result_foods_item_magma£岩浆"
 izakaya_food_magma_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_fugu$、$building_izakaya_ingredient_truffles$\n用高级牛肉和松露炖煮而成的烩锅，最初以麻辣为特色，因炖煮中冒出的气泡如岩浆而得名，款款而起的香味更是让人食指大动。改良后也增加了不辣的版本。"
 izakaya_food_crispy_fried_cicada_sheds: "£izakaya_result_foods_item_crispy_fried_cicada_sheds£香炸蝉蜕"
 izakaya_food_crispy_fried_cicada_sheds_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cicada_shells$\n蝉科昆虫黑蚱羽化后的蜕壳，可以入药，有利咽开音、明目退翳之效，香炸后口感酥脆，颇受欢迎。"
 izakaya_food_dew_poached_eggs: "£izakaya_result_foods_item_dew_poached_eggs£露水煮蛋"
 izakaya_food_dew_poached_eggs_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_eggs$\n采集了清晨的露珠煮成的蛋，比一般的水煮蛋多出一种甘甜的味道，为了保持鲜嫩只煮到半熟，蛋黄水嫩得似乎稍加晃动就会流出来。"
 izakaya_food_phantom_night_blooming_cereus_cake: "£izakaya_result_foods_item_phantom_night_blooming_cereus_cake£幻昙花糕"
 izakaya_food_phantom_night_blooming_cereus_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_dew$\n用上古时期便存在的奇迹之花制作的糕点，不仅甜而不腻，食后更是齿颊留香，据说能勾起人心中最想怀念的回忆。"
 izakaya_food_bear_paw_imitation: "£izakaya_result_foods_item_bear_paw_imitation£赛熊掌"
 izakaya_food_bear_paw_imitation_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_fugu$\n黑不溜秋的怪异美食之首！香飘万里，让人回味无穷。因为打不过熊，没法直接用熊掌做，但是比真正的熊掌还要鲜美百倍。"
 izakaya_food_secret_recipe_dried_fish: "£izakaya_result_foods_item_secret_recipe_dried_fish£秘制小鱼干"
 izakaya_food_secret_recipe_dried_fish_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$\n用秘制的香料将小鱼干腌制后晒干，酥脆香口的同时又易于保存，寻常人家都喜欢在家中保存一份。"
 izakaya_food_carved_cold_dishes: "£izakaya_result_foods_item_carved_cold_dishes£凉菜雕花"
 izakaya_food_carved_cold_dishes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_radish$\n将鲜果蔬菜雕刻成鲜花的模样，虽然材料简单，但却非常考验刀工。"
 izakaya_food_peach_blossom_soup: "£izakaya_result_foods_item_peach_blossom_soup£桃花羹"
 izakaya_food_peach_blossom_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_ice_cubes$、$building_izakaya_ingredient_dew$\n来自天上的配方，采摘新鲜的桃花，配以清晨的甘露水煮而成。不仅芳香清甜，而且具有祛病美容的神奇功效。"
 izakaya_food_arctic_sweet_shrimp_and_peach_salad: "£izakaya_result_foods_item_arctic_sweet_shrimp_and_peach_salad£北极甜虾蜜桃色拉"
 izakaya_food_arctic_sweet_shrimp_and_peach_salad_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_ice_cubes$、$building_izakaya_ingredient_shrimp$\n选用品质最好、肉质最鲜的虾和桃子加工而成的高级料理，据说在外界只有在宴席上才有机会一见。"
 izakaya_food_deep_fried_tofu: "£izakaya_result_foods_item_deep_fried_tofu£油豆腐"
 izakaya_food_deep_fried_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$\n常见的家常菜。传说中是稻荷神的狐狸使者最喜欢的食物。"
 izakaya_food_poetic_ginkgo_nuts: "£izakaya_result_foods_item_poetic_ginkgo_nuts£诗礼银杏"
 izakaya_food_poetic_ginkgo_nuts_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_honey$\n以选用孔庙“诗礼堂”前银杏树所结果实烹制而得名，清香甜美，柔韧筋道，可解酒止咳。"
 izakaya_food_authentic_seafood_miso_soup: "£izakaya_result_foods_item_authentic_seafood_miso_soup£真·海鲜味噌汤"
 izakaya_food_authentic_seafood_miso_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_trout$\n选用新鲜鳟鱼和海带煲煮而成的味噌汤。浓浓的鲜味四处漂荡，鲜而不腥。"
 izakaya_food_grilled_mushrooms: "£izakaya_result_foods_item_grilled_mushrooms£烤蘑菇"
 izakaya_food_grilled_mushrooms_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$\n采用蘑菇为原料，将蘑菇用竹签串起来后，刷少量油进行烧烤，撒上粗盐，味道简直不输给直接吃肉！"
 izakaya_food_simmered_tofu: "£izakaya_result_foods_item_simmered_tofu£煮豆腐"
 izakaya_food_simmered_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$\n常见的家常菜，但也讲究烧制的火候，才能将豆腐的鲜嫩口感得到最大展现。"
 izakaya_food_fried_pork_chops: "£izakaya_result_foods_item_fried_pork_chops£炸猪肉排"
 izakaya_food_fried_pork_chops_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$\n常见的家常菜。以猪肉为主要材料，裹以面粉一炸，邻居家的孩子都馋哭了。"
 izakaya_food_butter_seared_steak: "£izakaya_result_foods_item_butter_seared_steak£黄油牛排"
 izakaya_food_butter_seared_steak_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_butter$\n简单而复杂，根据火候和食材的选择，呈现出不同感觉的基础西餐。顺带一提红魔馆的那位喜欢的是三分熟。"
 izakaya_food_risotto: "£izakaya_result_foods_item_risotto£意式烩饭"
 izakaya_food_risotto_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_butter$\n将食材炒熟之后倒入生米，充分混合米粒和食材香味的外界某个半岛的做法。"
 izakaya_food_beef_wellington: "£izakaya_result_foods_item_beef_wellington£惠灵顿牛排"
 izakaya_food_beef_wellington_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_truffles$\n将牛排和松露这两种鲜美的食材调味后包裹在酥皮中进行烘焙，让黄油酥皮的香味和牛排蘑菇的鲜美充分融合的极致菜肴。工序繁复，在外界是出了名的难做。"
 izakaya_food_eggs_benedict: "£izakaya_result_foods_item_eggs_benedict£班尼迪克蛋"
 izakaya_food_eggs_benedict_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_flour$\n流黄的水波蛋和大口的碳水，是早午餐的常见选择。"
 izakaya_food_warm_pancakes: "£izakaya_result_foods_item_warm_pancakes£热松饼"
 izakaya_food_warm_pancakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$\n早餐的简单选择，将准备好的面糊煎熟，浇上蜂蜜就可以吃了。"
 izakaya_food_scones: "£izakaya_result_foods_item_scones£司康饼"
 izakaya_food_scones_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_flour$\n英式下午茶的常客，外酥内软。一般蘸着果酱或者奶油一起吃。"
 izakaya_food_pan_seared_salmon: "£izakaya_result_foods_item_pan_seared_salmon£香煎三文鱼"
 izakaya_food_pan_seared_salmon_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_bamboo_shoots$\n将整块带皮的三文鱼煎至外焦里嫩，配上鲜嫩的竹笋——不过外界这个菜谱一般是芦笋，这也算是幻想乡式的融合菜吧。"
 izakaya_food_creamy_stew: "£izakaya_result_foods_item_creamy_stew£奶油炖菜"
 izakaya_food_creamy_stew_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_butter$\n制作家常奶油浓汤，制作方法简单，无论是蘸面包还是当作炖菜来吃都是非常不错的料理。"
 izakaya_food_honey_glazed_char_siu: "£izakaya_result_foods_item_honey_glazed_char_siu£蜜汁叉烧"
 izakaya_food_honey_glazed_char_siu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_honey$\n来自红美铃老家的特殊做法，制作工序有点儿繁复，但是口感独一无二，令人难忘。"
 izakaya_food_ginkgo_and_radish_pork_rib_soup: "£izakaya_result_foods_item_ginkgo_and_radish_pork_rib_soup£白果萝卜排骨汤"
 izakaya_food_ginkgo_and_radish_pork_rib_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_pork$\n来自红美铃老家的煲汤技巧，色香味俱全，益气补血。"
 izakaya_food_taketori_hime: "£izakaya_result_foods_item_taketori_hime£竹取姬"
 izakaya_food_taketori_hime_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_kurobuta_pork$\n在永远亭就地取材，使用新鲜的食材和米饭一起塞进竹筒中蒸熟。饭被竹子的清香充分浸润后，中和了山猪肉带来的油腻。"
 izakaya_food_phoenix: "£izakaya_result_foods_item_phoenix£不死鸟"
 izakaya_food_phoenix_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_radish$\n使用面粉烘培出烤火鸡的形状，在表面刷上蜂蜜，肚子里塞满食材，进行充分的烘烤。出炉的假烤鸡有着香脆的外皮和多汁的内馅儿。"
 izakaya_food_moonlight_dango: "£izakaya_result_foods_item_moonlight_dango£月光团子"
 izakaya_food_moonlight_dango_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_glutinous_rice$\n永远亭特产改良的麻薯团子，加入了高级食材月光草，造型可爱的同时，还有“月光一样的口感”。"
 izakaya_food_mochi: "£izakaya_result_foods_item_mochi£麻薯"
 izakaya_food_mochi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_glutinous_rice$\n最普通的糯米团子，大家都喜欢的和风甜食。"
 izakaya_food_white_peach_nama_yatsuhashi: "£izakaya_result_foods_item_white_peach_nama_yatsuhashi£白桃生八桥"
 izakaya_food_white_peach_nama_yatsuhashi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_glutinous_rice$、$building_izakaya_ingredient_peaches$\n状似外界古筝的经典和果子，加入白桃内馅儿之后呈现淡粉色，非常诱人。"
 izakaya_food_moon_lover: "£izakaya_result_foods_item_moon_lover£月之恋人"
 izakaya_food_moon_lover_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_moonlight_grass$\n外界似乎很流行使用〇〇恋人作为地区伴手礼，永远亭也不甘落后潮流，推出了自己的版本！"
 izakaya_food_pig_deer_and_butterfly: "£izakaya_result_foods_item_pig_deer_and_butterfly£猪鹿蝶"
 izakaya_food_pig_deer_and_butterfly_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wild_boar$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_moonlight_grass$\n脱胎于花札的猪鹿蝶牌型，将猪肉和鹿肉清炖，佐以花朵引出食材本身鲜味的精致料理。"
 izakaya_food_flowing_vegetarian_noodles: "£izakaya_result_foods_item_flowing_vegetarian_noodles£流水素面"
 izakaya_food_flowing_vegetarian_noodles_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_bamboo$\n比起好吃，流水素面更多的是好玩。"
 izakaya_food_stir_fried_pork_with_bamboo_shoots: "£izakaya_result_foods_item_stir_fried_pork_with_bamboo_shoots£竹笋炒肉"
 izakaya_food_stir_fried_pork_with_bamboo_shoots_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_pork$\n最朴素的的竹笋吃法，由猪肉的油光引出竹笋的鲜美。"
 izakaya_food_steamed_egg_in_a_bamboo_tube: "£izakaya_result_foods_item_steamed_egg_in_a_bamboo_tube£竹筒蒸蛋"
 izakaya_food_steamed_egg_in_a_bamboo_tube_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_mushrooms$\n竹子作为容器蒸出来的茶碗蒸，别有一番风味。"
 izakaya_food_penglai_jade_branch: "£izakaya_result_foods_item_penglai_jade_branch£蓬莱玉枝"
 izakaya_food_penglai_jade_branch_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_venison$\n简单地说就是使用竹签串起各种高级肉类，一口吃个饱的料理。但是在辉夜小姐的胁迫下，成为了高级的冠名料理。"
 izakaya_food_stinky_tofu: "£izakaya_result_foods_item_stinky_tofu£臭豆腐"
 izakaya_food_stinky_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_chili_peppers$\n少见的黑色豆腐，散发着令人难以接近的味道…让人不禁怀疑这真的可以吃吗？但是实际吃过的人表示根本停不下来。"
 izakaya_food_huaguang_jade_pan_fried_buns: "£izakaya_result_foods_item_huaguang_jade_pan_fried_buns£华光玉煎包"
 izakaya_food_huaguang_jade_pan_fried_buns_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_kurobuta_pork$\n散发着七彩的气场的高级生煎包。据说有些生煎原教旨主义者尖锐地反对加入猪肉以外食材的做法。"
 izakaya_food_mapo_tofu: "£izakaya_result_foods_item_mapo_tofu£麻婆豆腐"
 izakaya_food_mapo_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_chili_peppers$\n在日本很有名的中华料理。使用独特的豆腐烹饪技巧烹制而成的辛辣料理，用它来拌饭吃可是会上瘾的哦。"
 izakaya_food_boiled_fish: "£izakaya_result_foods_item_boiled_fish£水煮鱼"
 izakaya_food_boiled_fish_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_chili_peppers$\n正宗的四川中华料理。鲜嫩肥美的鱼肉和犹如半天朱霞的辣椒一起翻滚，煮成了一道鱼香四溢、椒味袭人的绝味。"
 izakaya_food_mooncakes: "£izakaya_result_foods_item_mooncakes£月饼"
 izakaya_food_mooncakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_flour$\n原本是内测人员的特殊食谱，三年来一直令全收集强迫症玩家坐卧不宁，这次彻底开放了。"
 izakaya_food_mao_yu_three_color_ice_cream: "£izakaya_result_foods_item_mao_yu_three_color_ice_cream£毛玉三色冰激凌"
 izakaya_food_mao_yu_three_color_ice_cream_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_eggs$\n方形的三色毛玉冰激凌，从颜色到口味上都非常惹人喜爱。几乎是人手一份的招牌甜品。"
 izakaya_food_mao_yu_lava_tofu: "£izakaya_result_foods_item_mao_yu_lava_tofu£毛玉熔岩豆腐"
 izakaya_food_mao_yu_lava_tofu_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_onions$\n方形的火山毛玉造型，仿佛着了火的熔岩豆腐。受到喜欢舌苔刺激的人的追捧。"
 izakaya_food_scarlet_devil_cake: "£izakaya_result_foods_item_scarlet_devil_cake£猩红恶魔蛋糕"
 izakaya_food_scarlet_devil_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_honey$\n以猩红恶魔头上的帽子为原型制作的梦幻甜食，切开会有仿佛血液一般的甜美酱料流出。"
 izakaya_food_unconscious_monster_mousse: "£izakaya_result_foods_item_unconscious_monster_mousse£无意识妖怪慕斯"
 izakaya_food_unconscious_monster_mousse_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_onions$\n以无意识妖怪的帽子为原型制作的深沉甜食，即使切开感受到的也是无尽的黑暗，但香醇的程度令人流连忘返。"
 izakaya_food_wontons: "£izakaya_result_foods_item_wontons£水饺"
 izakaya_food_wontons_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$\n海的另一边，红美铃小姐家乡的著名食谱。用面粉制作成的筋道面皮，在其中包入任意喜欢的食材，放入沸腾的热水中煮熟，就会成为超级美味的食物。外表看起来朴素无华，内在却包着世间的宝藏。"
 izakaya_food_tangyuan: "£izakaya_result_foods_item_tangyuan£汤圆"
 izakaya_food_tangyuan_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_glutinous_rice$\n海的另一边，红美铃小姐家乡的著名食谱。用弹牙的糯米揉成小团，在其中包入甜品食材，放入沸腾的热水中煮熟，就会成为超级可口的甜品。外表看起来朴素无华，内在却包着世间的甜蜜。"
 izakaya_food_fried_shrimp_tempura: "£izakaya_result_foods_item_fried_shrimp_tempura£炸虾天妇罗"
 izakaya_food_fried_shrimp_tempura_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_shrimp$、$building_izakaya_ingredient_flour$\n“天妇罗”又名“天麸罗”。将新鲜大虾裹上面粉做的罗衣，放入油锅炸至金黄酥脆，再控油捞出，隔壁家的童子都馋哭了。"
 izakaya_food_golden_crispy_fish_cakes: "£izakaya_result_foods_item_golden_crispy_fish_cakes£黄金酥鱼饼"
 izakaya_food_golden_crispy_fish_cakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_honey$\n在鱼馅儿内加入适量蜂蜜搅拌后，碾压成鱼饼，投入油锅炸至金黄色，随炸随食。"
 izakaya_food_all_meat_feast: "£izakaya_result_foods_item_all_meat_feast£全肉盛宴"
 izakaya_food_all_meat_feast_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wild_boar$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_wagyu_beef$\n将各种高级烤肉堆成小山的料理。无论视觉还是分量上都简单暴力，对于嗅觉灵敏的食客是秒杀级的食谱。"
 izakaya_food_pickled_cucumbers: "£izakaya_result_foods_item_pickled_cucumbers£腌黄瓜"
 izakaya_food_pickled_cucumbers_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cucumbers$、$building_izakaya_ingredient_black_salt$\n将黄瓜切段后用盐等调味腌制，出现了神奇而难以抗拒的风味。"
 izakaya_food_cream_baked_crab: "£izakaya_result_foods_item_cream_baked_crab£奶油焗蟹"
 izakaya_food_cream_baked_crab_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_crab$\n奶油焗的螃蟹在没开盖之前就已经香气四溢，然而这香气只是前戏。撕开蟹钳，弹出白嫩饱满的肉质，此时再细细地吸入汤汁，螃蟹固有的鲜味才彻底的融合和释放。"
 izakaya_food_imitation_shikigami: "£izakaya_result_foods_item_imitation_shikigami£拟尻子玉"
 izakaya_food_imitation_shikigami_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_cicada_shells$\n据说尻子玉是人类进化后残存的尾骨，是河童一族最喜欢的食物。从前用血腥的方式从人类那里夺取，但是随着时代的进步，已经有了料理的方式来替代，只是成本昂贵。"
 izakaya_food_okonomiyaki: "£izakaya_result_foods_item_okonomiyaki£大阪烧"
 izakaya_food_okonomiyaki_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_radish$\n听说是外界流行的街边小吃，使用面糊和各种食材混合后在铁板上烧制而成，脆香而丰富，因其百变和平价的特性被所有人喜爱。"
 izakaya_food_takoyaki: "£izakaya_result_foods_item_takoyaki£章鱼烧"
 izakaya_food_takoyaki_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_octopus$\n听说也是外界流行的街边小吃，在特制的面糊中裹上引发奇迹的章鱼脚，糯脆的外衣之下Q弹的章鱼脚产生让人幸福的感觉。"
 izakaya_food_sea_urchin_sashimi: "£izakaya_result_foods_item_sea_urchin_sashimi£海胆刺身"
 izakaya_food_sea_urchin_sashimi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sea_urchin$、$building_izakaya_ingredient_dew$\n制作意外的简单，但获取食材却非常困难。据说是现世流行的超高级料理，是每个人的梦想。"
 izakaya_food_sliced_meat_with_mushrooms: "£izakaya_result_foods_item_sliced_meat_with_mushrooms£蘑菇肉片"
 izakaya_food_sliced_meat_with_mushrooms_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_pork$\n将蘑菇和肉切片后，混入锅里一起炒，是非常基本的家常料理。"
 izakaya_food_secret_recipe_fresh_mushroom_hot_pot: "£izakaya_result_foods_item_secret_recipe_fresh_mushroom_hot_pot£秘制鲜菌煲"
 izakaya_food_secret_recipe_fresh_mushroom_hot_pot_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_dew$\n长期专研于蘑菇学的人类魔法使所创的秘制菜谱。食材均选自魔法森林所产的新鲜菌类，据说较其他地方产出的菌类有更高营养价值。"
 izakaya_food_mushroom_maidens_dance_stew: "£izakaya_result_foods_item_mushroom_maidens_dance_stew£蘑女的舞踏烩"
 izakaya_food_mushroom_maidens_dance_stew_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_shrimp$、$building_izakaya_ingredient_octopus$、$building_izakaya_ingredient_chili_peppers$\n蘑菇为主角，佐以各种鲜嫩食材的强力料理。金灿灿的光芒散发着强烈的存在感，香浓的口感可以瞬间蒸发人的灵魂，一发沉沦。"
 izakaya_food_creamy_mushroom_soup: "£izakaya_result_foods_item_creamy_mushroom_soup£奶香蘑菇汤"
 izakaya_food_creamy_mushroom_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_cream$\n浓郁的奶香汤底煮出来的魔性之汤，尝下第一口就无法停下来。制作简单，材料随处可见，还拥有极高的营养价值。"
 izakaya_food_plain_mini_cakes: "£izakaya_result_foods_item_plain_mini_cakes£普通小蛋糕"
 izakaya_food_plain_mini_cakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_cream$\n有着惊人热量的小点心，据说能迅速强健体魄。上面写着“吃掉我”，非常诱人，吃多了估计会长胖吧…"
 izakaya_food_seven_color_yokan: "£izakaya_result_foods_item_seven_color_yokan£七色羊羹"
 izakaya_food_seven_color_yokan_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_illusory_lotus_blossom$\n经典甜食辅以特殊的处理，呈现梦幻的色彩，让人敬畏，只敢远观不敢亵玩。能吃上一次，终生难忘。"
 izakaya_food_hand_rolled_sushi: "£izakaya_result_foods_item_hand_rolled_sushi£手握寿司"
 izakaya_food_hand_rolled_sushi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_tuna$\n日本最传统的料理之一。将鱼切片后盖在手握的饭团上，解饿又鲜美，拥有很长的历史。"
 izakaya_food_pumpkin_and_shrimp_cups: "£izakaya_result_foods_item_pumpkin_and_shrimp_cups£南瓜虾盅"
 izakaya_food_pumpkin_and_shrimp_cups_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_shrimp$、$building_izakaya_ingredient_tofu$\n掏空小南瓜，用鲜嫩的虾肉和豆腐填充，再进行蒸制，香甜可口，又非常健康。"
 izakaya_food_fantasy_buddha_jumps_over_the_wall: "£izakaya_result_foods_item_fantasy_buddha_jumps_over_the_wall£幻想佛跳墙"
 izakaya_food_fantasy_buddha_jumps_over_the_wall_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_fugu$、$building_izakaya_ingredient_truffles$\n由东方文明古国最强料理改造而来，据说得道的真佛也会因为它的气味夺墙而走，摒弃斋戒，真的很神奇！"
 izakaya_food_depressing_cheese_sticks: "£izakaya_result_foods_item_depressing_cheese_sticks£丧气芝士条"
 izakaya_food_depressing_cheese_sticks_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cheese$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_ginkgo_nuts$\n在一些阴郁的妖怪中流行的零食，在浓郁的芝士中混有白果独有的苦味，能让味觉产生强烈的回甘后味，但我完全无法理解。"
 izakaya_food_gloomy_fruit_pie: "£izakaya_result_foods_item_gloomy_fruit_pie£阴郁水果派"
 izakaya_food_gloomy_fruit_pie_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_lemon$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_cheese$\n对喜欢酸味的人来说是味蕾的盛宴，但不喜欢酸味的人就是牙齿和舌头的炸弹！只在一些小众的妖怪中流行的奇怪做法。"
 izakaya_food_screaming_oden: "£izakaya_result_foods_item_screaming_oden£绝叫关东煮"
 izakaya_food_screaming_oden_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_tofu$\n旧地狱中最流行的聚会小吃。将各种食材置入后，加上辣椒刺激，让人汗流满面的同时却无法停下，是魔力十足的料理。"
 izakaya_food_crispy_tornado: "£izakaya_result_foods_item_crispy_tornado£脆旋风"
 izakaya_food_crispy_tornado_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_cicada_shells$\n将虫类的甲壳磨成大碎块，拌入面中，吃起来香脆又下火，有一种别样的异世界猎奇感的奇怪料理。"
 izakaya_food_ceiling_gazing_pie: "£izakaya_result_foods_item_ceiling_gazing_pie£仰望天花板派"
 izakaya_food_ceiling_gazing_pie_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_peaches$\n在水果派里探出一个鱼头，仿佛看着地底的天花板，充满了和地狱相衬的绝望气息。"
 izakaya_food_turtle_shell_steamed_cake: "£izakaya_result_foods_item_turtle_shell_steamed_cake£兜甲蒸糕"
 izakaya_food_turtle_shell_steamed_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_cicada_shells$\n无论是地上还是地下，兜角甲虫都是力量和无敌的象征！这是憧憬它的力量而诞生的盔甲料理！"
 izakaya_food_lions_head_meatballs: "£izakaya_result_foods_item_lions_head_meatballs£狮子头"
 izakaya_food_lions_head_meatballs_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$\n爱酒之人无不喜欢的基础下酒菜！气派又野性的狮子头配上烈性的酒，是鬼族起床的早餐！"
 izakaya_food_giant_tamagoyaki: "£izakaya_result_foods_item_giant_tamagoyaki£巨人玉子烧"
 izakaya_food_giant_tamagoyaki_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_eggs$\n将普通的玉子烧做大许多倍，就是这款在鬼族中流行的巨人玉子烧了！其澎湃的存在感让豪迈之人为其燃烧！"
 izakaya_food_great_edo_boat_festival: "£izakaya_result_foods_item_great_edo_boat_festival£大江户船祭"
 izakaya_food_great_edo_boat_festival_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_tuna$、$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_ice_cubes$\n用华丽的祭典船造型，摆满上好的鱼刺身，周围散发着保鲜而制作的冰雾，是真真正正的宴会的焦点！"
 izakaya_food_cherry_blossom_pudding: "£izakaya_result_foods_item_cherry_blossom_pudding£樱花布丁"
 izakaya_food_cherry_blossom_pudding_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_peaches$\n粉色的可爱甜品，Q软又富有弹性，香蜜的甜美气息使它成为世界上所有的女孩子都无法拒绝的无敌甜品。"
 izakaya_food_pick_me_up_pudding: "£izakaya_result_foods_item_pick_me_up_pudding£提神布丁"
 izakaya_food_pick_me_up_pudding_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_lemon$\n大大提升了酸度的可怕布丁，改良了提神的效果，只要吃一口，就能让困倦的身体打起精神。但因为其用料过于凶猛，很不利于口腔健康…"
 izakaya_food_burn_out_pudding: "£izakaya_result_foods_item_burn_out_pudding£燃尽布丁"
 izakaya_food_burn_out_pudding_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_lemon$、$building_izakaya_ingredient_lemon$\n究极加料、一颗就调动起身上包括多巴胺和肾上腺激素等多种兴奋元素疯狂舞动的禁忌甜食。妖怪食用后可以疯狂舞蹈一整夜，但是兴奋过后会不由地感到“我燃尽了”。"
 izakaya_food_cat_rice: "£izakaya_result_foods_item_cat_rice£猫饭"
 izakaya_food_cat_rice_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_flour$\n据说是阿燐刚刚被觉收养时，觉常做给她的简易盖浇饭。面粉勾芡后淋在鱼肉上，那种温柔的味道一直留在燐的记忆里。"
 izakaya_food_salmon_tempura: "£izakaya_result_foods_item_salmon_tempura£三文鱼天妇罗"
 izakaya_food_salmon_tempura_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_salmon$、$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_flour$\n将三文鱼裹上蛋液和面粉，炸至通体金黄，咬一口汁水四溢，隔壁的猫猫都馋哭啦！"
 izakaya_food_fish_leaping_over_the_dragon_gate: "£izakaya_result_foods_item_fish_leaping_over_the_dragon_gate£鱼跃龙门"
 izakaya_food_fish_leaping_over_the_dragon_gate_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_truffles$\n外表是鲤鱼起跳的造型，剖开后尽是梦幻的宝藏，是猫科动物无法抵抗的究极美食。"
 izakaya_food_cheese_egg: "£izakaya_result_foods_item_cheese_egg£芝士蛋"
 izakaya_food_cheese_egg_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_cheese$\n据说是阿空刚刚被觉收养时，觉常做给她的料理。在蛋饼里混入浓香的芝士，让人无法拒绝的小吃。"
 izakaya_food_one_hit_kill: "£izakaya_result_foods_item_one_hit_kill£一击☆必杀"
 izakaya_food_one_hit_kill_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wild_boar$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_onions$\n加入了极为刺激的食材和辅料，对味觉的刺激满点的超级烤串，阿空亲自为它起了一个中二度满满的名字，结果在保持野性的妖怪中莫名的有人气。"
 izakaya_food_hellishly_spicy_warning: "£izakaya_result_foods_item_hellishly_spicy_warning£地狱激辛警告！"
 izakaya_food_hellishly_spicy_warning_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_cheese$、$building_izakaya_ingredient_beef$\n超超超级辣加倍的牛肉咖喱饭！据说只有拥有极限忍耐力的人和傻瓜才会尝试这道料理！"
 izakaya_food_roasted_sweet_potato: "£izakaya_result_foods_item_roasted_sweet_potato£烤地瓜"
 izakaya_food_roasted_sweet_potato_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sweet_potatoes$\n无论什么时候都大受欢迎的民间小吃。尤其在寒冷的冬天，看到热气腾腾的烤炉，想到那红皮黄瓤的颜色，热乎甜软的口感，谁能忍得住呢？但不能贪嘴，吃太多容易导致胃腹不适。"
 izakaya_food_skinny_horse_dumplings: "£izakaya_result_foods_item_skinny_horse_dumplings£瘦马团子"
 izakaya_food_skinny_horse_dumplings_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_glutinous_rice$、$building_izakaya_ingredient_glutinous_rice$\n外表看起来像是拉长了的团子，切开后中间裹着各式各样的图案，大大增加了团子的新鲜感。据说瘦马团子象征佛舍利，那不就是佛祖的骨灰吗？"
 izakaya_food_scary_great_adventure: "£izakaya_result_foods_item_scary_great_adventure£惊吓！大冒险"
 izakaya_food_scary_great_adventure_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_cream$\n从幻昙华中提取色素，给一个个蘑菇伞染上颜色，将之铺在宝箱周围就像被锦花簇拥着。宝箱里究竟藏有什么惊喜呢？怀着这样的想法打开，跳出来的却是伸着大舌头的滑稽的伞！吓一跳了吧——？"
 izakaya_food_bay_of_biscay_cookies: "£izakaya_result_foods_item_bay_of_biscay_cookies£比斯开湾饼干"
 izakaya_food_bay_of_biscay_cookies_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_cheese$\n从海难中逃到荒岛的幸存者，万般无奈地将已被海水浸湿的面粉和芝士混合成的“面糊”放在阳光下烤，没想到味道变得十分香脆可口。于是这个做法流传了下来。"
 izakaya_food_pirate_bacon: "£izakaya_result_foods_item_pirate_bacon£海盗熏肉"
 izakaya_food_pirate_bacon_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_black_salt$、$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_honey$\n据说“海盗”这个词的来源是在明火上烹制的熏肉。加勒比本地人就是用这种做法来处理肉类，然后卖给海盗。听起来就和米饭盖浇米饭一样奇怪。"
 izakaya_food_arhats_vegetarian_dish: "£izakaya_result_foods_item_arhats_vegetarian_dish£罗汉上素"
 izakaya_food_arhats_vegetarian_dish_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_pine_nuts$、$building_izakaya_ingredient_lotus_seeds$\n源自佛门的斋菜。传闻正宗的罗汉斋用十八种原料制成，工序复杂考究，成菜色泽缤纷雅致，味道清淡香郁。堪称佛门最奢华的一道素菜。"
 izakaya_food_cloud_mountain_marshmallows: "£izakaya_result_foods_item_cloud_mountain_marshmallows£云山棉花糖"
 izakaya_food_cloud_mountain_marshmallows_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_peaches$\n命莲寺的弟子中有个能够变幻形态的入道，只要见过他的样子，就很容易联想到棉花糖。加入桃汁制作的棉花糖甜而不腻，造型生动有趣，深受小孩子的喜爱。"
 izakaya_food_sacred_white_lotus_seed_cake: "£izakaya_result_foods_item_sacred_white_lotus_seed_cake£圣白莲子糕"
 izakaya_food_sacred_white_lotus_seed_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_lotus_seeds$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_butter$\n将新鲜莲子剥壳去芯，煮至软烂，再将黄油和面粉搅拌均匀，最后混合翻炒，用磨具压出美丽的莲花图案，看起来神圣洁白。"
 izakaya_food_fantasy_star_lotus_boat: "£izakaya_result_foods_item_fantasy_star_lotus_boat£幻想星莲船"
 izakaya_food_fantasy_star_lotus_boat_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_lotus_seeds$、$building_izakaya_ingredient_tuna$、$building_izakaya_ingredient_twin_stemmed_lotus$、$building_izakaya_ingredient_moonlight_grass$\n以南瓜做的船，承载着如梦似幻的食材，在莲子铺成的河上驶入幻想。据说每每享用完这道料理，都会有如梦方醒的感觉。至于究竟是何种梦境，便是因人而异了。"
 izakaya_food_pine_nut_cake: "£izakaya_result_foods_item_pine_nut_cake£松子糕"
 izakaya_food_pine_nut_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_glutinous_rice$、$building_izakaya_ingredient_pine_nuts$\n以糯米为主料、辅以松子制作的药膳。松子糕的粉质细腻，柔软可口，并有清香的松子味，深受道士们喜爱。"
 izakaya_food_white_deer_and_upright_pine: "£izakaya_result_foods_item_white_deer_and_upright_pine£白鹿贞松"
 izakaya_food_white_deer_and_upright_pine_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_pine_nuts$\n白鹿和松树都有长寿的寓意，深受追求长生的道教人士的推崇，于是有“鹿寿松贞”之画，即一只白鹿立于松树之下。这道菜就是以这幅画为印象创作出来的。"
 izakaya_food_tai_chi_bagua_fish_maw: "£izakaya_result_foods_item_tai_chi_bagua_fish_maw£太极八卦鱼肚"
 izakaya_food_tai_chi_bagua_fish_maw_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_ginkgo_nuts$\n做法极其讲究的道教经典名菜。鱼肚片片，要越薄越好；太极图则要注意造型圆整、八卦形等距，最后再经过细心蒸煮，才能呈现出这道形象生动、鱼肚软糯的道家名菜。"
 izakaya_food_candied_chestnuts: "£izakaya_result_foods_item_candied_chestnuts£蜜饯栗子"
 izakaya_food_candied_chestnuts_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_chestnuts$\n把栗子用蜂蜜熬煮之后的成品。栗子里温和而浓郁的味道，可以有效地平衡外在的甜味。"
 izakaya_food_tianshi_chestnut_braised_mushrooms: "£izakaya_result_foods_item_tianshi_chestnut_braised_mushrooms£天师板栗焖菇"
 izakaya_food_tianshi_chestnut_braised_mushrooms_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chestnuts$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_truffles$\n神灵庙位处仙界，所栽种的栗树据说都蕴含仙气。但我是分辨不出啦…将栗子佐以蘑菇焖煮，把看不见摸不着的仙气浓缩成一锅鲜甜味美又解馋的杂烩，岂不是更实在？"
 izakaya_food_lotus_flower_fish_and_rice_cups: "£izakaya_result_foods_item_lotus_flower_fish_and_rice_cups£荷花鱼米盏"
 izakaya_food_lotus_flower_fish_and_rice_cups_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_twin_stemmed_lotus$、$building_izakaya_ingredient_lotus_seeds$、$building_izakaya_ingredient_dew$\n洁白的盘中铺上碧绿的荷叶，叶上还滚动着晶莹的水珠，盘中央一朵白荷则增添了“仙气”。每一盏里都以鲜嫩的粉色荷花花瓣为底，盛着极上金枪鱼、莲子组成的“鱼米盏”，又好吃又健康。"
 izakaya_food_candied_sweet_potatoes: "£izakaya_result_foods_item_candied_sweet_potatoes£拔丝地瓜"
 izakaya_food_candied_sweet_potatoes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sweet_potatoes$、$building_izakaya_ingredient_honey$\n将番薯下锅炸至金黄，再裹上能拉出细丝的糖衣，最后在抹过油的盘子上滚一圈，既可口又不粘牙。但不能贪嘴，吃太多容易导致胃腹不适。"
 izakaya_food_pan_fried_meat_rolls_with_two_types_of_mushrooms: "£izakaya_result_foods_item_pan_fried_meat_rolls_with_two_types_of_mushrooms£香煎双菇肉卷"
 izakaya_food_pan_fried_meat_rolls_with_two_types_of_mushrooms_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_truffles$\n荤素搭配均匀，味道也很好的常见佳肴。用两种不同口感的菇类，包裹着精挑细选的嫩肉，给味蕾带来层次感十足的享受。"
 izakaya_food_assorted_tempura: "£izakaya_result_foods_item_assorted_tempura£什锦天妇罗"
 izakaya_food_assorted_tempura_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_conger_eel$、$building_izakaya_ingredient_moonlight_grass$\n谁说炸物就必须得是鸟类呢？地上跑的、土里长的、水里游的都可以裹上面粉放到油锅里炸一炸，出锅皆是香味四溢、酥脆爽口。最后以梦幻的月光草为缀，巧妙地中和了炸物拼盘的油腻。"
 izakaya_food_fried_tomato_strips: "£izakaya_result_foods_item_fried_tomato_strips£炸番茄条"
 izakaya_food_fried_tomato_strips_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tomatoes$、$building_izakaya_ingredient_potatoes$\n把西红柿裹上面粉后放到油锅炸一炸，出锅后淋上自制土豆酱，尝起来也算是别有一番趣味。"
 izakaya_food_braised_pork_with_peaches: "£izakaya_result_foods_item_braised_pork_with_peaches£蜜桃红烧肉"
 izakaya_food_braised_pork_with_peaches_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_pork$\n软糯的肉加上香甜的桃子，即使白嘴吃也不会觉得腻。淋上蜂蜜一起翻炒，更是红润添香，非常适合下酒。"
 izakaya_food_turn_the_world_upside_down: "£izakaya_result_foods_item_turn_the_world_upside_down£逆转天地！"
 izakaya_food_turn_the_world_upside_down_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_plums$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_truffles$\n使用革新技术制作的分子料理。据说是来自月都的食谱。在制作过程中存在许多无法理解之处，所以经过一定程度的再创作，最终成为这样一个结合了世人眼中的“雅”和“俗”之物的地上料理，也寄托着正邪想要搅混天下的意愿。"
 izakaya_food_red_bean_daifuku: "£izakaya_result_foods_item_red_bean_daifuku£红豆大福"
 izakaya_food_red_bean_daifuku_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_red_beans$、$building_izakaya_ingredient_glutinous_rice$\n用糯米制成的外皮，里头包着饱满的带皮红小豆馅儿。馅料的量跟饼皮的量一样甚至更多，使得大福的外型圆浑有致。据说大福就因为这样的外型而被称为“大腹饼”，后人取其吉祥的谐音改称“大福”。"
 izakaya_food_dorayaki: "£izakaya_result_foods_item_dorayaki£铜锣烧"
 izakaya_food_dorayaki_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_red_beans$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_flour$\n一种烤制面皮、内置红豆沙夹心的甜点。因由两块像铜锣一样的饼合起来的，故而得名铜锣烧。"
 izakaya_food_hangongs_hidden_beauty: "£izakaya_result_foods_item_hangongs_hidden_beauty£汉宫藏娇"
 izakaya_food_hangongs_hidden_beauty_desc: "需求：§Y烧烤架§!\n原材料：\n用豆腐的洁白来形容貂婵的纯洁，以泥鳅的钻营来影射董卓的奸滑。让人在品尝中，想到王允献貂婵，巧使美人计而除奸贼董卓的故事，自然为美食增添了文化的含量。"
 izakaya_food_stone_pot_braised_pork_with_bamboo_shoots: "£izakaya_result_foods_item_stone_pot_braised_pork_with_bamboo_shoots£石锅竹笋炖肉"
 izakaya_food_stone_pot_braised_pork_with_bamboo_shoots_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_bamboo_shoots$、$building_izakaya_ingredient_beef$\n以牛肉、竹笋为主要食材的一道家常菜品。鲜嫩的竹笋炖肉具有开胃、促进消化的作用，再以竹子作为摆盘，可谓是色香味俱全。"
 izakaya_food_steamed_pork_in_a_bamboo_tube: "£izakaya_result_foods_item_steamed_pork_in_a_bamboo_tube£竹筒粉蒸肉"
 izakaya_food_steamed_pork_in_a_bamboo_tube_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_kurobuta_pork$\n将猪身上最嫩的部位，以新鲜的竹筒锯留成节笆，通小孔，灌上菜料和香料，开大火蒸熟后飘出竹子的独特清香。有时间的条件下，在腌渍肉片的时候加点儿清水会更加晶莹润口。"
 izakaya_food_emerald_bamboo_welcomes_spring: "£izakaya_result_foods_item_emerald_bamboo_welcomes_spring£翠竹迎春"
 izakaya_food_emerald_bamboo_welcomes_spring_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cucumbers$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_moonlight_grass$\n将各种鲜嫩的食材放入多节竹筒蒸熟，寓意节节高升。而春竹翠绿娇艳的样子，既给客人带来视觉味觉上的新意，还蕴含着迎春的美好寓意。"
 izakaya_food_plum_tea_soaked_rice: "£izakaya_result_foods_item_plum_tea_soaked_rice£梅子茶泡饭"
 izakaya_food_plum_tea_soaked_rice_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_plums$、$building_izakaya_ingredient_nori$\n用汤汁和热腾腾的白饭制作的茶泡饭！茶泡饭所用的汤汁通常为煎茶、烘焙茶或富有柴鱼香气的高汤，最后加入的梅子给这道素淡的菜品增添了一抹艳色。"
 izakaya_food_steamed_egg_with_sea_urchin: "£izakaya_result_foods_item_steamed_egg_with_sea_urchin£海胆蒸蛋"
 izakaya_food_steamed_egg_with_sea_urchin_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sea_urchin$、$building_izakaya_ingredient_eggs$\n将鸡蛋加入海胆蒸至海胆黄变色就可以出锅的简单料理。吃的时候用勺子挖下去，一口一勺，海胆和蛋羹互相融合渗透的美味就在味蕾上蔓延了。"
 izakaya_food_fantasy_craze: "£izakaya_result_foods_item_fantasy_craze£幻想风靡"
 izakaya_food_fantasy_craze_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_tomatoes$\n对火候要求极其苛刻的一道菜，需聚息凝神地将肉品烤至完美的三分熟。暗红的色调以及极具破坏性的龙卷风形状，带来了山海欲来的压迫感。一口下去，有种仿佛征服了天下的快感。"
 izakaya_food_mystical_mushrooms_of_the_green_fields: "£izakaya_result_foods_item_mystical_mushrooms_of_the_green_fields£绿野仙菇"
 izakaya_food_mystical_mushrooms_of_the_green_fields_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_toon_tree_leaves$、$building_izakaya_ingredient_mushrooms$\n本质上是野菜拌蘑菇，但因为这个名字多了一些奇妙的童话感。"
 izakaya_food_flowers_birds_wind_and_moon: "£izakaya_result_foods_item_flowers_birds_wind_and_moon£花鸟风月"
 izakaya_food_flowers_birds_wind_and_moon_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_cream$\n牵丝攀藤地解开“花鸟风月”一词，同时想象着幽香小姐做出来的三角蛋糕。整体风格就像她本人一样风雅，不过上面插了一根我的羽毛，应该还算有趣吧？"
 izakaya_food_a_serene_dream: "£izakaya_result_foods_item_a_serene_dream£幽梦"
 izakaya_food_a_serene_dream_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_dew$、$building_izakaya_ingredient_cream$\n以花卉为主题的双层奶油蛋糕。锦簇花团铺在细腻的奶油上，散发出丝丝香甜，蓝色的蝴蝶轻轻驻足，久久不归。这不是梦境，却胜似梦境。"
 izakaya_food_toon_tree_pancakes: "£izakaya_result_foods_item_toon_tree_pancakes£香椿煎饼"
 izakaya_food_toon_tree_pancakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_toon_tree_leaves$、$building_izakaya_ingredient_eggs$\n用有“毒”的野菜——香椿制成的煎饼。初尝有种苦苦涩涩的味道，嚼下去后口齿留甘。牢记！给普通客人食用须先将香椿用开水焯过一遍！"
 izakaya_food_garden_of_poisonous_mists: "£izakaya_result_foods_item_garden_of_poisonous_mists£毒瘴花园"
 izakaya_food_garden_of_poisonous_mists_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_fugu$、$building_izakaya_ingredient_plums$、$building_izakaya_ingredient_conger_eel$、$building_izakaya_ingredient_ginkgo_nuts$\n用各种“毒食材”混合炖煮的杂炊。通过细致而精巧的食材处理手段，能够不同程度地保留食材中的“毒性”，让不同需求的客人均能体验到他们想要的刺激。"
 izakaya_food_a_little_sweet_poison: "£izakaya_result_foods_item_a_little_sweet_poison£小小的甜蜜「毒药」"
 izakaya_food_a_little_sweet_poison_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_ginkgo_nuts$\n这是专门给小小的毒人偶——梅蒂欣制作的印象甜品。可爱中带着诡异的色彩，犹如自然界中徇丽的毒蘑菇勾人采摘。实际是没有毒的，梅蒂欣也是。"
 izakaya_food_eel_and_soft_boiled_egg_bowl: "£izakaya_result_foods_item_eel_and_soft_boiled_egg_bowl£鳗鱼嫩蛋丼"
 izakaya_food_eel_and_soft_boiled_egg_bowl_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_conger_eel$、$building_izakaya_ingredient_eggs$\n厚切的鳗鱼块抹上特调酱汁，再覆盖一层软嫩的生蛋，在食用前将其搅拌得金灿灿的样子，吃下去超级满足！"
 izakaya_food_drunken_shrimp_in_a_bamboo_tube: "£izakaya_result_foods_item_drunken_shrimp_in_a_bamboo_tube£竹筒烧醉虾"
 izakaya_food_drunken_shrimp_in_a_bamboo_tube_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_shrimp$\n把新鲜的虾放进醇香的酒中浸泡，再冰镇后淋上香料食用。既可以尝到虾的鲜香，同时也可以尝到酒的洌香，十分可口。"
 izakaya_food_beef_yuanyang_hot_pot: "£izakaya_result_foods_item_beef_yuanyang_hot_pot£牛肉鸳鸯火锅"
 izakaya_food_beef_yuanyang_hot_pot_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_radish$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_wagyu_beef$\n一边是魔界辣椒汤底，一边是萝卜牛骨汤底，兼具红白两种汤汁的特色双锅牛肉。一家人，一个锅，两种口味团团圆圆，仿佛有了它就有家的气息。"
 izakaya_food_cat_canele: "£izakaya_result_foods_item_cat_canele£猫咪可露丽"
 izakaya_food_cat_canele_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$\n迷人的焦糖脆外壳和软糯香浓的内心，无论在口感层次变化或者味觉体验都堪称一绝，不愧是“天使的铜铃”——咦？铃铛里居然还藏了只小猫咪！"
 izakaya_food_cat_pizza: "£izakaya_result_foods_item_cat_pizza£猫咪披萨"
 izakaya_food_cat_pizza_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_onions$\n在发酵的圆面饼上面覆盖各种配料烤制而成，完美兼顾了营养和品相，焦糖洋葱的醇香滋味更是为其带来了多重的舌尖享受。可爱的猫咪外形让人有些不忍下嘴呢。"
 izakaya_food_cat_playing_in_water: "£izakaya_result_foods_item_cat_playing_in_water£猫咪戏水"
 izakaya_food_cat_playing_in_water_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_schisandra$、$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_cocoa_beans$\n猫咪主题的吐司盒。把一整个方块吐司挖空，底部涂上一层奶油，放入一层桃子果酱，再涂上一层奶油，铺一片吐司，加入晶莹剔透的白凉粉，最后再用调色奶油映照出蓝色的水面效果，放入巧克力做的猫咪，就成了一副有趣的猫咪戏水图了。"
 izakaya_food_rapunzel: "£izakaya_result_foods_item_rapunzel£长发公主"
 izakaya_food_rapunzel_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_shrimp$\n摆盘精致的虾仁南瓜意面。南瓜蒸熟后又甜又糯，用它代替奶油做出来的意面低脂低卡，味道浓郁，营养十足！"
 izakaya_food_sea_urchin_shingen_mochi: "£izakaya_result_foods_item_sea_urchin_shingen_mochi£海胆信玄饼"
 izakaya_food_sea_urchin_shingen_mochi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_sea_urchin$、$building_izakaya_ingredient_tuna$、$building_izakaya_ingredient_silver_ear_mushrooms$、$building_izakaya_ingredient_dew$\n以金枪鱼高汤制作的饼身清透干净，和新鲜海胆组成高级的香槟色系搭配，底层的胡麻酱更增一丝醇厚的口感。如此玲珑的甜品，让人不忍破坏这晶莹剔透的美丽。"
 izakaya_food_mad_hatters_tea_party: "£izakaya_result_foods_item_mad_hatters_tea_party£疯帽子茶会"
 izakaya_food_mad_hatters_tea_party_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_mushrooms$\n以魔界茶会为印象制作的甜品。表面看起来是一个巧克力做的茶壶，茶壶的肚子里是层层堆叠的奶油蛋糕，周围装饰着蘑菇和西蓝花，就像某个故事里的巧克力房子一样，是充满了梦幻和不可思议的幸福甜品。"
 izakaya_food_peach_blossom_glass_roll: "£izakaya_result_foods_item_peach_blossom_glass_roll£桃花琉璃卷"
 izakaya_food_peach_blossom_glass_roll_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_red_beans$、$building_izakaya_ingredient_schisandra$\n通过胶凝化技术，把粉嫩可爱的桃花制成晶莹剔透的琉璃果冻外皮，裹着糯叽叽的豆沙馅儿，记录季节的浪漫和甜蜜。"
 izakaya_food_moonlight_over_the_lotus_pond: "£izakaya_result_foods_item_moonlight_over_the_lotus_pond£荷塘月色"
 izakaya_food_moonlight_over_the_lotus_pond_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_schisandra$、$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_silver_ear_mushrooms$\n清爽细腻的葡萄乌龙冻，白色的是奶油慕斯！奶油的绵密和葡萄的清爽在舌尖碰撞出别样滋味，茶冻间点缀片片青提，馥郁果香充盈唇齿。菏泽上的小露珠也相当有趣。"
 izakaya_food_dragons_roar_peach: "£izakaya_result_foods_item_dragons_roar_peach£龙吟桃子"
 izakaya_food_dragons_roar_peach_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_peaches$\n本质上就是用桃子来制作桃子。将桃子作为原材料打碎，最后再还原出最初始的形状，从表面来看似乎是贯彻了一种返璞归真的理念，但制作过程极其繁琐考究。"
 izakaya_food_molecular_egg: "£izakaya_result_foods_item_molecular_egg£分子蛋"
 izakaya_food_molecular_egg_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_cream$\n选用水分较少的北豆腐作为蛋白，甜糯的南瓜作为蛋黄，再用白巧克力做成蛋壳，还原出鸡蛋的模样和口感，让人意想不到呢。"
 izakaya_food_source_of_life: "£izakaya_result_foods_item_source_of_life£生命之源"
 izakaya_food_source_of_life_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_silver_ear_mushrooms$、$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_dew$\n初见就像是云山雾罩的神秘星球，打开一看“星球”里竟然摆了个生鸡蛋？仔细看蛋液其实是银耳汤，蛋黄则是南瓜泥。吃起来口感清爽，还有香浓的南瓜味。"
 izakaya_food_mars: "£izakaya_result_foods_item_mars£火星"
 izakaya_food_mars_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_schisandra$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_crab$、$building_izakaya_ingredient_dew$\n特别定制的盘底如火星地表一般，上面盛放着顶级的螃蟹冻以及白葡萄分子技术制作的果凝。螃蟹口感冰凉顺滑不腻，果凝如水滴一般，而且带着淡淡酒香。寓意火星上一滴水珠，代表着最后的希望。"
 izakaya_food_nourishing_heart_porridge: "£izakaya_result_foods_item_nourishing_heart_porridge£养心粥"
 izakaya_food_nourishing_heart_porridge_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_silver_ear_mushrooms$、$building_izakaya_ingredient_lotus_seeds$\n口味偏甜、营养丰富的银耳莲子粥。滋润而不腻滞，还具有养心安神的功效。"
 izakaya_food_spicy_soup: "£izakaya_result_foods_item_spicy_soup£胡辣汤"
 izakaya_food_spicy_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_tofu$\n由多种天然中草药按比例配制的汤料，再加入胡椒和辣椒，又用骨头汤做底料的牛肉胡辣汤，喝一口就能驱散瞌睡虫。"
 izakaya_food_dark_matter: "£izakaya_result_foods_item_dark_matter£黑暗物质"
 izakaya_food_dark_matter_desc: "需求：§Y烧烤架§!\n原材料：\nREPLACE_ME"
 izakaya_food_supreme_seafood_noodles: "£izakaya_result_foods_item_supreme_seafood_noodles£至尊海鲜面"
 izakaya_food_supreme_seafood_noodles_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_premium_tuna$、$building_izakaya_ingredient_nori$、$building_izakaya_ingredient_octopus$、$building_izakaya_ingredient_tofu$、$building_izakaya_ingredient_shrimp$\n以海鲜汤料煨煮的汤面，劲道爽滑，汤浓鲜美，是一道非常豪华的家常菜。凭一碗海鲜面，便能让人记住深藏着的大海的味道。"
 izakaya_food_mountain_spring_two_tone_fruit_platter: "£izakaya_result_foods_item_mountain_spring_two_tone_fruit_platter£山泉双色果盘"
 izakaya_food_mountain_spring_two_tone_fruit_platter_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_grapes$\n选取山间的泉水浸泡山上的野果而成的果盘，口感顺滑，冰凉甜美。由妖精制作的果盘更是可以保存数天而不变色，也许是她们的生命力在起效。"
 izakaya_food_fish_cakes: "£izakaya_result_foods_item_fish_cakes£鱼饼"
 izakaya_food_fish_cakes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_trout$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_tofu$\n相比来自东方的原版鱼饼口味更清淡一些，外形上也针对雾之湖的鱼种进行了调整。是一道非常不错的解酒小吃，也很受孩子们的喜欢。"
 izakaya_food_ginkgo_nut_spirit_bowl: "£izakaya_result_foods_item_ginkgo_nut_spirit_bowl£白果灵盅"
 izakaya_food_ginkgo_nut_spirit_bowl_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_bamboo$\n简单而美观的茶碗蒸，使用白果替换了雾之湖少见的鲜虾，口味相比一般的茶碗蒸更显清淡。月光草作为点缀，为本来平凡的蒸蛋增加了一丝闪烁的灵光。如果放在上古时代，大概会是难得一见的名贵菜肴吧。"
 izakaya_food_devils_donuts: "£izakaya_result_foods_item_devils_donuts£恶魔的甜甜圈"
 izakaya_food_devils_donuts_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_cheese$\n形似甜甜圈而长了一对恶魔的角，说是甜品而其实完全就是芝士口味的汉堡包。不过由于中间有洞，吃的时候要尤其留意不要弄脏了衣服。"
 izakaya_food_sculpture_of_justice: "£izakaya_result_foods_item_sculpture_of_justice£正义执行雕塑"
 izakaya_food_sculpture_of_justice_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_condensed_milk$\n高甜度巧克力所制作雕塑，似乎描绘的是大笑着的黑红色身影将粉色的身影踩在脚下的景象。所谓的“正义执行”指的就是这个吗？她开心就好。"
 izakaya_food_hyper_dimensional_inferno_barbecue_feast: "£izakaya_result_foods_item_hyper_dimensional_inferno_barbecue_feast£超位·业火烧烤宴"
 izakaya_food_hyper_dimensional_inferno_barbecue_feast_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_gold_leaf$\n利用火焰魔法和束缚魔法固定住肉类然后烧烤的料理，视觉特效上值得满分。不过出于某人的奇妙心理，这道料理使用了超位级魔法，导致每次烹饪都像烟花表演。"
 izakaya_food_sweetheart_sandwiches: "£izakaya_result_foods_item_sweetheart_sandwiches£甜心三明治"
 izakaya_food_sweetheart_sandwiches_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_tuna$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_chili_peppers$\n超级猎奇口味的三明治，外表做得五颜六色很可爱，然而内里的味道简直令人咋舌。或许有些人会喜欢吧…"
 izakaya_food_fuzzy_mushroom_soup: "£izakaya_result_foods_item_fuzzy_mushroom_soup£毛茸茸蘑菇汤"
 izakaya_food_fuzzy_mushroom_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_marshmallows$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_mushrooms$\n利用了散碎的棉花糖模拟了绵羊般毛茸茸外表的西式汤。毛茸茸的表层下面是猩红色的肉汤，入口是极具侵略性和力量感的野味。是外表很可爱然而实际很暴力的料理呢。"
 izakaya_food_blood_red_afternoon_tea: "£izakaya_result_foods_item_blood_red_afternoon_tea£血色下午茶"
 izakaya_food_blood_red_afternoon_tea_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wagyu_beef$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_butter$\n对蕾米莉亚一顿普通下午茶的模仿。区别是本来的熟成牛排被替换成了更贴近小孩子口味的蜜汁牛肉，配套的煎蛋也换成了全熟。顺带一提，最正宗的做法是牛排三分甚至一分熟。"
 izakaya_food_tsukimi_mochi: "£izakaya_result_foods_item_tsukimi_mochi£月见饼"
 izakaya_food_tsukimi_mochi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_flour$\n月之都为了纪念一位伟人而流传的零食。外形圆润如满月，口感细腻松软，带着淡淡的甜香，很适合小朋友食用。"
 izakaya_food_jade_colored_broth: "£izakaya_result_foods_item_jade_colored_broth£玉色良汤"
 izakaya_food_jade_colored_broth_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_ginkgo_nuts$、$building_izakaya_ingredient_dew$\n永琳所研发的药膳，口味带着一丝苦味的清甜。可以通肺止咳，化瘀补气，适合虚弱的病人食用。"
 izakaya_food_star_and_moon_peach_cake: "£izakaya_result_foods_item_star_and_moon_peach_cake£星月桃子糕"
 izakaya_food_star_and_moon_peach_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_peaches$、$building_izakaya_ingredient_illusory_lotus_blossom$、$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_dew$\n给食欲不振的病人开胃的甜点，使用了幻昙华和月光草模拟了星光和月光，而桃子的甜香底味可以很好的刺激病人的胃口，又不至于过于刺激。是非常精致又非常贴心的甜点呢，不愧是月之头脑的作品。"
 izakaya_food_cherry_blossom_and_star_dust_jade_stew: "£izakaya_result_foods_item_cherry_blossom_and_star_dust_jade_stew£樱绯星屑缀玉烩"
 izakaya_food_cherry_blossom_and_star_dust_jade_stew_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chili_peppers$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_glutinous_rice$、$building_izakaya_ingredient_cheese$\n在外界似乎被称为“Risotto”的烩饭料理。魔界之神对此进行改良，使用糯米与帕尔马芝士糅合，添上辣椒碎与菌菇碎，在锅中炒热后，再撒上柔软的花瓣，这道西洋感满满的烩饭就做成了。香糯的芝士烩饭中，晶莹的菌菇碎如同满天星斗，照亮了遍布鲜花的原野。一口下去，是幻想乡春樱漫野结合魔界夜空般的甜辣。"
 izakaya_food_dark_moon_wonderland_mousse: "£izakaya_result_foods_item_dark_moon_wonderland_mousse£黯月魔境慕斯"
 izakaya_food_dark_moon_wonderland_mousse_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_cream$\n慕斯是一种混合鸡蛋、奶油和各种调味食材，口感香甜松软的甜品。魔界之神对此进行了改良，使用巧克力、香草与香芋的层层搭配，再放上两颗红色浆果，外观看上去犹如气派的魔界宫殿“万魔殿”。据说是神绮平时用来招待客人以及举办茶会时必备的高级甜点。"
 izakaya_food_ember_colored_demon_patterned_mille_feuille: "£izakaya_result_foods_item_ember_colored_demon_patterned_mille_feuille£烬色魔纹千层酥"
 izakaya_food_ember_colored_demon_patterned_mille_feuille_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_butter$\n以魔神之翼为原型设计而成的咖啡色千层酥，苦涩与鲜香的夹心结合着酥脆的酥皮，一口咬下去别有一番风味。最顶层使用成块的巧克力配上草莓果酱作为点缀，看起来就像魔神的翅膀一般。"
 izakaya_food_gravy_and_cheese_french_fries: "£izakaya_result_foods_item_gravy_and_cheese_french_fries£肉汁奶酪薯条"
 izakaya_food_gravy_and_cheese_french_fries_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_pork$、$building_izakaya_ingredient_cheese$\n在外界似乎被称为“Poutine”的高热量西式快餐，最早起源于加拿大魁北克省，是加拿大的国菜。因该省有着大量法国后裔，因此当地人在法式炸薯条的基础上，加上了肉汁、手撕牛肉与奶酪块，构成了这道如同塔一般宏伟的热量炸弹。现代的肉汁奶酪薯条还经常会在此基础上额外加上羊肉粒、墨西哥辣椒、培根条、烧烤酱、牧场沙拉酱以及塔塔酱，真是让人看一眼就会腻到反胃…“多就是好！舞舞绝对会喜欢！”雪如此评价这道料理。"
 izakaya_food_russian_hot_and_sour_soup: "£izakaya_result_foods_item_russian_hot_and_sour_soup£俄罗斯酸辣汤"
 izakaya_food_russian_hot_and_sour_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_lemon$、$building_izakaya_ingredient_cucumbers$\n在外界似乎被称为“Solyanka”的西式汤品，最早起源于俄罗斯寒冷的远东地区。相传，当时的人们为了度过寒冷的严冬，只能使用手中仅有的蔬菜和肉类，加上大量的酸黄瓜和柠檬来做成这道又酸又辣的浓汤。也正因为其又酸又辣，在魔界似乎没有流行起来，神绮也表示不用专门学新的菜谱真是帮了大忙。“酸酸辣辣，喝完就有用不完的力量了，舞舞绝对会喜欢！”雪如此评价这道料理。"
 izakaya_food_creamy_sweet_pancake_rolls: "£izakaya_result_foods_item_creamy_sweet_pancake_rolls£奶油甜煎饼卷"
 izakaya_food_creamy_sweet_pancake_rolls_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_cream$、$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_gold_leaf$\n在外界似乎被称为“Cannoli”的西式甜点，最早起源于意大利巴勒莫，也是魔界最为流行的下午茶点心。奶油甜煎饼卷的制作方式非常奇特：首先用特制的铁棍或者锡箔纸固定住面粉做的酥皮，放入油锅中炸至金黄，然后往里面填入奶油馅料，最后在顶端撒上可可粉、糖霜以及可食用金箔便大功告成了。”这种甜点嘛，对于本魔神而言轻轻松松啦！“作为神绮平时下午茶必备的甜点，其本人使用魔法制作的奶油甜煎饼卷受到魔界人的好评，直到有一天，她灵机一动没有使用魔法而是亲手下厨…"
 izakaya_food_grilled_corn: "£izakaya_result_foods_item_grilled_corn£烤玉米"
 izakaya_food_grilled_corn_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_corn$、$building_izakaya_ingredient_butter$\n舞亲手收获的玉米，用秋季随处可见的红叶烘烤，最后撒上黄油与焦糖，既保存了甜味又能充饥。高温使谷粒外壳焦香、内里柔软，做法简单却流传至今。"
 izakaya_food_russian_chilled_soup: "£izakaya_result_foods_item_russian_chilled_soup£俄罗斯冻汤"
 izakaya_food_russian_chilled_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_green_onions$、$building_izakaya_ingredient_cucumbers$、$building_izakaya_ingredient_condensed_milk$、$building_izakaya_ingredient_potatoes$\n在外界似乎被称为“Okroshka”的西式汤品，是一道适合在夏季消暑降温的料理。使用大量夏季产出的蔬菜，混合炼乳、开菲尔与格瓦斯。做法非常简单，只需要将混合物放入冰柜，等到冷冻完成后加入盐和黑胡椒即可直接食用。就连神绮都能轻松学会这道菜，因此在魔界非常流行。"
 izakaya_food_spanish_cold_soup: "£izakaya_result_foods_item_spanish_cold_soup£西班牙冷汤"
 izakaya_food_spanish_cold_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_garlic$、$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_tomatoes$、$building_izakaya_ingredient_cucumbers$\n在外界似乎被称为“Gazpacho”的西式汤品，历史最早可以追溯到西班牙大航海时期。相传最早是西班牙人在通过海路与各国贸易中，使用各国独特的蔬菜水果混合大蒜而成的简单料理。经过多个世纪的发展，现代的西班牙冷汤已经不只是一道简单的蔬菜大杂烩，而是额外衍生出了如添加鲜花、火腿、草莓或是虾肉蟹肉之类的各种高级版本。不过由于神绮大人无法掌握，因此在魔界流行的是最基础的版本。"
 izakaya_food_chestnut_cake: "£izakaya_result_foods_item_chestnut_cake£板栗饼"
 izakaya_food_chestnut_cake_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_butter$、$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_chestnuts$\n板栗煮熟后去壳碾碎，与黄油和适量糖拌成馅料，包裹在饼皮内烤制而成。外皮酥脆，内馅软甜，栗香浓郁，每一口都宣告着秋天的到来。"
 izakaya_food_spring_triumph: "£izakaya_result_foods_item_spring_triumph£胜春朝"
 izakaya_food_spring_triumph_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_sweet_potatoes$、$building_izakaya_ingredient_chestnuts$、$building_izakaya_ingredient_condensed_milk$\n受到静叶小姐话语的启发，研究出的甜蜜料理。将红薯彻底蒸熟，碾磨成泥，加上当季的葡萄、栗泥，从人里农户手里买来的炼乳而制成。虽然用的材料都是秋季的食材，但是却散发着不输春朝的甜蜜芬芳。"
 izakaya_food_the_work_of_the_autumn_god: "£izakaya_result_foods_item_the_work_of_the_autumn_god£秋神的工作"
 izakaya_food_the_work_of_the_autumn_god_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_honey$、$building_izakaya_ingredient_sweet_potatoes$、$building_izakaya_ingredient_chestnuts$、$building_izakaya_ingredient_gold_leaf$\n比起菜肴更像一道盆栽景观，描绘了秋神中的姐姐正在制造落叶的场景。红薯和板栗凸显着秋季风味，糖浆的点缀增添了口感。轻轻一晃就会让精心布置在上面的金箔洒下，宛如秋日的落叶一般。"
 izakaya_food_pumpkin_pie: "£izakaya_result_foods_item_pumpkin_pie£南瓜派"
 izakaya_food_pumpkin_pie_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_butter$\n金黄南瓜入馅，与酥脆派皮相拥。切开时，秋日暖阳气息扑面而来；叉起一小块品尝，甜蜜在舌尖绽放。"
 izakaya_food_cheesy_corn_baked_sweet_potatoes: "£izakaya_result_foods_item_cheesy_corn_baked_sweet_potatoes£芝士玉米焗红薯"
 izakaya_food_cheesy_corn_baked_sweet_potatoes_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_corn$、$building_izakaya_ingredient_sweet_potatoes$、$building_izakaya_ingredient_grapes$、$building_izakaya_ingredient_cheese$\n香浓芝士遇上清甜玉米和软糯红薯，一口下去甜蜜交织，温暖又饱腹，是幸福的味道。穰子的小秘方是在其中加入葡萄干，不仅增加了些许甜味，还提升了口感和营养。"
 izakaya_food_scary_halloween_night: "£izakaya_result_foods_item_scary_halloween_night£惊吓万圣夜"
 izakaya_food_scary_halloween_night_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_pumpkin$、$building_izakaya_ingredient_cocoa_beans$、$building_izakaya_ingredient_marshmallows$、$building_izakaya_ingredient_truffles$、$building_izakaya_ingredient_corn$\n从古老传说中外界庆祝丰收的节日中获得的灵感而制作出的料理。在名为南瓜头的“城堡”里，可可豆制成的黑巧克力化身“蝙蝠”，棉花糖扮演“幽灵”。万圣夜的惊喜藏于雕刻南瓜灯内，黑巧蝙蝠和棉花糖幽灵静卧此处，松露为这道奇妙菜品增加了风味和高级感。最中央则是玉米杆搭成的稻草人，不仅是丰收的象征，更为这份“艺术品”增添了一笔惊怖气氛。"
