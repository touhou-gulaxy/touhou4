 izakaya_food_okonomiyaki_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_flour$、$building_izakaya_ingredient_eggs$、$building_izakaya_ingredient_radish$\n听说是外界流行的街边小吃，使用面糊和各种食材混合后在铁板上烧制而成，脆香而丰富，因其百变和平价的特性被所有人喜爱。"
