 izakaya_food_tianshi_chestnut_braised_mushrooms_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_chestnuts$、$building_izakaya_ingredient_mushrooms$、$building_izakaya_ingredient_truffles$\n神灵庙位处仙界，所栽种的栗树据说都蕴含仙气。但我是分辨不出啦…将栗子佐以蘑菇焖煮，把看不见摸不着的仙气浓缩成一锅鲜甜味美又解馋的杂烩，岂不是更实在？"
