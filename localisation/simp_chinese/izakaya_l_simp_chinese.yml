 izakaya_food_all_meat_feast_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_wild_boar$、$building_izakaya_ingredient_venison$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_wagyu_beef$\n将各种高级烤肉堆成小山的料理。无论视觉还是分量上都简单暴力，对于嗅觉灵敏的食客是秒杀级的食谱。"
