 izakaya_food_turn_the_world_upside_down: "£izakaya_result_foods_item_turn_the_world_upside_down£逆转天地！"
 izakaya_food_turn_the_world_upside_down_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_bamboo$、$building_izakaya_ingredient_fresh_flowers$、$building_izakaya_ingredient_plums$、$building_izakaya_ingredient_kurobuta_pork$、$building_izakaya_ingredient_truffles$\n使用革新技术制作的分子料理。据说是来自月都的食谱。在制作过程中存在许多无法理解之处，所以经过一定程度的再创作，最终成为这样一个结合了世人眼中的“雅”和“俗”之物的地上料理，也寄托着正邪想要搅混天下的意愿。"
