 izakaya_food_russian_hot_and_sour_soup: "£izakaya_result_foods_item_russian_hot_and_sour_soup£俄罗斯酸辣汤"
 izakaya_food_russian_hot_and_sour_soup_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_onions$、$building_izakaya_ingredient_beef$、$building_izakaya_ingredient_potatoes$、$building_izakaya_ingredient_lemon$、$building_izakaya_ingredient_cucumbers$\n在外界似乎被称为“Solyanka”的西式汤品，最早起源于俄罗斯寒冷的远东地区。相传，当时的人们为了度过寒冷的严冬，只能使用手中仅有的蔬菜和肉类，加上大量的酸黄瓜和柠檬来做成这道又酸又辣的浓汤。也正因为其又酸又辣，在魔界似乎没有流行起来，神绮也表示不用专门学新的菜谱真是帮了大忙。“酸酸辣辣，喝完就有用不完的力量了，舞舞绝对会喜欢！”雪如此评价这道料理。"
