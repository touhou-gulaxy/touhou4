 izakaya_food_tsukimi_mochi: "£izakaya_result_foods_item_tsukimi_mochi£月见饼"
 izakaya_food_tsukimi_mochi_desc: "需求：§Y烧烤架§!\n原材料：$building_izakaya_ingredient_moonlight_grass$、$building_izakaya_ingredient_flour$\n月之都为了纪念一位伟人而流传的零食。外形圆润如满月，口感细腻松软，带着淡淡的甜香，很适合小朋友食用。"
