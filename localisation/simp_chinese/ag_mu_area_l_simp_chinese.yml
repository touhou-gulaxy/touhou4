 ag_mu.2.name:0 "§PM星域§!"
 ag_mu.2.desc:0 "§H[Root.GetName]§!在进入§H[From.GetName]§!后，报告称初步探测结果表明§H[From.GetName]§!的恒星上存在着一座古代文明设施，维持着一个能源特征奇特的扭曲护盾，内部似乎是某种舰船，其风格和古代文明格格不入。\n\n而环绕着恒星的$pc_ringworld_habitable$附近，存在着一些银白色涂装的空间站与舰船，它们的设计似乎和失落帝国的舰船存在一定的相似性，但是远比失落帝国的技术先进。这些舰船的AI对我们抱有敌意，阻止了我们对§H[From.GetName]§!的进一步探测。"
 ag_mu.2.a:0 "$ag_worrying$"

 ag_mu.3.name:0 "古代设施"
 ag_mu.3.desc:0 "在一场激烈的战斗后，我们的舰队成功摧毁了§H[ag_ancient_mu_star.GetName]§!内那些具备着失落帝国风格的舰船，对残骸的分析表明它们属于数千年前自称“先祖联盟”的某个文明，某种程度上已经具备了舰载四级奇点与引力武器技术，而那些空间站似乎是他们的研究站，只不过已经被放弃了。\n\n§H[ag_ancient_mu_star.GetName]§!内还有其他值得我们注意的东西，比如那座维持着扭曲护盾的设施，以及护盾之下的舰船，这些东西的具体作用我们尚不清楚，不过很明显那条舰船是经过古代文明技术改造的其他文明舰船，其没有古代文明典型的设计风格。此外，还有环绕着恒星的$pc_ringworld_habitable$，分析表明它很显然属于古代文明，其本身目前仍在运作，并且散发出来一些不属于古代文明和先祖联盟的能源读数。\n\n我们的[Root.GetScienceTeam]认为$pc_ringworld_habitable$上的生态区很可能能够对我们研究§H[ag_ancient_mu_star.GetName]§!内的其他东西起到一定的帮助。"
 ag_mu.3.a:0 "派遣[Root.GetScienceTeam]调查这座$pc_ringworld_habitable$。"
 ag_mu.3.b:0 "这个扭曲护盾肯定有它存在的意义，别管它了。"
 ag_mu.3.b.tooltip:0 "§R结束与§!§P[ag_ancient_mu_star.GetName]§!§R有关的事件组。§!"

