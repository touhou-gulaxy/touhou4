 # 研究古代文明信息
 ag_mu.10.name:0 "古代信息"
 ag_mu.10.prefix:0 "我们的[Root.GetScienceTeam]对古代数据进行解读后，确认了扭曲护盾包裹下的舰船并非由古代文明建造，而是被古代文明发现的一条未完工舰船，其设计高度自动化且运用了一些古代文明未接触过的技术。\n\n"
 ag_mu.10.prefix.gensokyo:0 "我们的[Root.GetScienceTeam]对古代数据进行解读后，确认了扭曲护盾包裹下的舰船并非由古代文明建造，而是被古代文明发现的一条未完工舰船，其设计高度自动化且运用了一些古代文明未接触过的技术，不过这些技术对我们而言非常眼熟，包含了一些灵力技术的设计。\n\n"
 ag_mu.10.prefix.kamikakushi:0 "我们的[Root.GetScienceTeam]对古代数据进行解读后，确认了扭曲护盾包裹下的舰船并非由古代文明建造，而是被古代文明发现的一条未完工舰船，其设计高度自动化且运用了一些古代文明未接触过的技术，不过这些技术对我们而言非常眼熟，包含了一些与隙间之里相似的设计。\n\n"
 ag_mu.10.suffix:0 "古代文明在其基础上进行了研究与改造，并且将其称为“星辰守护者”。古代文明通过对这条舰船上设备的研究，开发出了一些奇特的技术，然而这些技术没有得到广泛运用的原因我们仍不清楚，甚至他们后面还封存了这座设施。\n\n好在通过这些资料，加上[Root.GetScienceTeam]的研究，我们找到了解锁古代文明扭曲护盾的方式。"
 ag_mu.10.desc:0 "$ag_mu.10.prefix$$ag_mu.10.suffix$"
 ag_mu.10.desc.gensokyo:0 "$ag_mu.10.prefix.gensokyo$$ag_mu.10.suffix$"
 ag_mu.10.desc.gensokyo.kamikakushi:0 "$ag_mu.10.prefix.kamikakushi$$ag_mu.10.suffix$"

 # 特殊项目完成，可以升级巨构来解锁扭曲护盾
