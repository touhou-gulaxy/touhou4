 # 欸我船呢
 ag_mu.13.name:0 "§R舰船消失§!"
 ag_mu.13.desc:0 "就在我们成功获得这条舰船的控制权之后，它突然打开了一道神奇的裂口，然后就这么从太空中消失了。\n\n我们的[Root.GetScienceTeam]根据收集到的能量活动特征推测，这条舰船应该是通过那道裂口前往了其他地方，至少目的地不是我们的银河系。"
 ag_mu.13.a:0 "$ag_worrying$"
 ag_mu.13.a.tooltip:0 "§R希望不会有什么坏事发生§!"
 ag_mu.13.b:0 "至少对我们应该没什么影响。"
 ag_mu.13.b.tooltip:0 "§R真的如此吗？§!"

 # 害害害我回来搞事了
