l_simp_chinese:
 START_SCREEN_HIFF: "这是一个如梦如幻的科学世纪。\n\n科学高度发展的时候，人们的精神世界却的不到满足。\n当博丽大结界由于秘封二人的行为变得薄弱时，幻想乡的贤者们决定借势而为，让幻想乡暴露在了现世面前。\n\n最初的文化冲击之后，人们接纳了这些曾经只在传说中听说过的妖怪、神明。而现在随着超空间引擎的发明，新生的文明已经做好了迈入繁星的准备。"

 touhou_hiff.2.name: "§UDr.Latency的博物志§!"
 touhou_hiff.2.desc: "推动科学世纪如今变化的二人，$NAME_renko$与$NAME_maribel_hearn$，曾经在$r_th_latency$中记述了他们探寻遍布四处的结界的活动。\n\n然而这本博物志中，已然有部分书页丢失，或许我们有某种办法可以将其寻回。"

 touhou_hiff.3.name: "§U空间裂隙§!"
 touhou_hiff.3.desc: "在我们的母星系中，突然出现了一道空间裂隙。在那处地方，时空倾向于汇聚成一层层互相叠盖的位面，不同时空结构之间的壁垒变得薄弱，其似乎通往其他的位面。\n\n梅莉与莲子则在那里察觉到了结界的存在，并且似乎与我们缺失的残页存在联系，或许我们应该让她们尝试穿行。"

 touhou_hiff_finish_latency_title: "§U完善博物志§!"
 touhou_hiff_finish_latency_desc: ""
 touhou_hiff_finish_latency_pages: "§G收集到的未竟之页§!"

 CANNOT_EXPLORE_WITH_NOT_HIFF_CLUB: "$TRIGGER_FAIL$§R只有秘封俱乐部的二人有能力探索这处奇怪的裂隙。§!"

 touhou_rendaino: "§U梦始莲台野§!"
 spth_astral_rift.30.name: "§U熟悉的场景§!"
 spth_astral_rift.30.desc: "在进入裂隙后，引入眼帘的是一座生长着彼岸花的墓园。\n\n根据她们二人的回忆，这里似乎就是记忆中的“莲台野”，但是$NAME_renko$观测的结果似乎是在某个过去的时间点。\n\n「或许这里是某个平行时空中的莲台野？\n说不定还有平行时空版本的我们呢」"
 spth_astral_rift.30.a: "真是神奇。"
 spth_astral_rift.31.name: "§U走在夜晚的莲台野§!"
 spth_astral_rift.31.desc: "果不其然，这里似乎就是某个时间线略慢的平行时空。\n\n「是的，就是这个没错了。」\n似乎有什么令人耳熟的声音传来，然而随行人员却惊讶的发现刚刚还在身边的二人突然消失了，出现于了莲台野之中。\n\n她们二人似乎完全没有意识到这点，这处空间中仿佛在进行着某种场景重现，并且所有的人的视界都发生了变化。一阵恍惚后，发现来到了一个陌生的地方，而自己却无法动弹，在耳边却响起了声音。"
 spth_astral_rift.31.a: "哈？"
 spth_astral_rift.32.name: "§U少女秘封俱乐部§!"
 spth_astral_rift.32.desc: "说着，莲子给我看了看贴有照片的笔记。在这寒意渐浓的秋夜里，特意跑到这个地方来，要是什么都看不到，那可就太亏了。不过说实话，真不想干这种盗墓贼的勾当呀。\n\n「梅莉，想不想去莲台野里的入口看看？」\n两天前，莲子向我发出了这样一个邀请。我们秘封俱乐部仅有两名成员，是个很常见的灵能者社团。但和一般的灵能者社团相比，我们又比较特别，并不喜欢除灵或者降灵。在旁人看来，我们是一个没从事过正经灵能活动的不良社团\n\n…但事实，并非如此。"
 spth_astral_rift.32.a: "..."
 spth_astral_rift.33.name: "§U古老的冥界寺§!"
 spth_astral_rift.33.desc: "「莲台野里的入口，是什么？ 莲子。」\n我从未听说过莲台野里还有什么入口，而且她话说得实在是没头没脑，所以我也只能这样回应了。\n\n「嗨呀，你看看这个。」\n莲子递来一张照片，上面是一座古老寺院——一座我从未见过的寺院。\n\n「这就是冥界。」\n「你为什么会有冥界的照片呀？」\n「我可是有内部途径的哦。梅莉。」\n\n我完全没懂她说的是什么途径，不过想来,无非是以尸体为对象的念写吧。\n「瞧，这张照片。你看山门里面……」"
 spth_astral_rift.33.a: "..."
 spth_astral_rift.34.name: "§U幻视之夜§!"
 spth_astral_rift.34.desc: "「看，门的这里。\n门的另一边。显然是现世对吧？」\n她指向的地方，是夜色中的平原，从照片上，还能看到一块墓碑。\n\n墓碑旁边的空气颜色与周围有些不同，更像是，我们世界的颜色…\n我犹豫着要不要告诉莲子，山门这个词用汉字写成三门才是正确的。"
 spth_astral_rift.34.a: "..."
 spth_astral_rift.35.name: "§U魔术师梅莉§!"
 spth_astral_rift.35.desc: "是的，这才是秘封俱乐部的真面目——我们社团致力于揭露遍布四处的结界。\n\n虽说这种行为有可能打破平衡，因此遭到了禁止。但是，我可以看到结界的界线。即使什么都不做也看得见。\n无论如何都会看见的话，那也就是不可抗力，对吧。"
 spth_astral_rift.35.a: "..."
 spth_astral_rift.36.name: "§U月之妖鸟、化猫之幻§!"
 spth_astral_rift.36.desc: "说起来，莲子说的是『莲台野里的入口』呀，她是通过这张照片确定了入口的位置吗？\n\n「很简单啊。这里不是拍到了月亮和星星嘛。」\n莲子似乎能够通过星光就能知道现在的时间，通过看月亮就能知道现在所处的位置。莲子总说我的眼睛很诡异，但要我说，她的眼睛才更诡异啊。"
 spth_astral_rift.36.a: "..."
 spth_astral_rift.37.name: "§U过去的花§!"
 spth_astral_rift.37.desc: "彼岸花很诡异对吧。我讨厌彼岸花，从小时候起就很讨厌。\n在莲台野里，彼岸花长得最多的坟墓就是入口哟——\n\n不知为何我突然说出了这样一番话。莲子却对此深信不疑，说什么梅莉的判断准没错，就这样自顾自地敲定了目的地。"
 spth_astral_rift.37.a: "..."
 spth_astral_rift.38.name: "§U魔法少女十字军§!"
 spth_astral_rift.38.desc: "莲台野结界缺口探索之日，终于到来了！\n\n由于夜深人静时最合适行动，我们决定在夜间出发。出发时，我们还算是意气风发，可一到莲台野，就突然冷静了下来。说起来，莲台野是一片墓地呀——"
 spth_astral_rift.38.a: "..."
 spth_astral_rift.39.name: "§U夜樱街道§!"
 spth_astral_rift.39.desc: "——莲子所说的目标墓碑应该就是这个，可我什么都没看到。莲子在催我。我摆弄了下墓碑，又把卒塔婆拔了出来，做了各种尝试。莲子望着天空，念叨着，2点27分41秒。\n\n真是诡异。到头来，只有我一个人在干盗墓贼的勾当。墓碑很重，我好不容易才把它转动……。\n\n「2点30分整！」\n就在墓碑转了4分之1圈的那一刻，明明正值秋天，我们眼前却浮现出了无边无际的樱花海洋。\n在明月之下，紫色与粉色的樱花盛开着，绵延不绝。而在远处，似乎存在着广大的庭院与巨大的庭院，幽灵一样的存在在空中舞动着，构成了一幅壮丽的冥界绝景。"
 spth_astral_rift.39.a: "..."
 spth_astral_rift.40.name: "§U幻想的永远祭§!"
 spth_astral_rift.40.desc: "一切突然又结束了，她们二人仿佛意识到了发生了什么，而在她们手中的，是一张书页。"
 spth_astral_rift.40.a: "神奇。"
 spth_astral_rift.40.effect: "秘封二人的特质得到了增强。"
