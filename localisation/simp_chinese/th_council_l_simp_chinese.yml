 councilor_ruler_th_miko: "巫女"
 councilor_ruler_th_miko_female: "$councilor_ruler_th_miko$"
 councilor_ruler_th_miko_desc: "曾经，巫女管理着大结界，守护着幻想乡。一旦大结界崩坏，无论是从里面还是从外面，幻想乡都不会平安无事。\n因此即使是在全新的幻想乡中，巫女的统治地位也是广为承认的。"
 councilor_ruler_th_scarlet: "大小姐"
 councilor_ruler_th_scarlet_female: "$councilor_ruler_th_scarlet$"
 councilor_ruler_th_scarlet_desc: ""
 councilor_ruler_th_psionic: "巫女"
 councilor_ruler_th_psionic_female: "$councilor_ruler_th_psionic$"
 councilor_ruler_th_psionic_desc: "$councilor_ruler_th_miko_desc$"
 councilor_th_gensokyo: "贤者助理"
 councilor_th_gensokyo_female: "$councilor_th_gensokyo$"
 councilor_th_gensokyo_desc: "协助幻想乡领袖管理帝国发展，之所以叫“贤者”助理单纯是因为幻想乡整体更迭之后大家并不习惯修改称呼。"
 councilor_th_the_wind_of_miracles: "妖怪山建筑总管"
 councilor_th_the_wind_of_miracles_female: "$councilor_th_the_wind_of_miracles$"
 councilor_th_the_wind_of_miracles_desc: ""
 councilor_th_the_wind_of_miracles_tooltip: "提高风祝的产出（还没做）"
 councilor_th_scarlet_devil: "女仆长"
 councilor_th_scarlet_devil_female: "$councilor_th_scarlet_devil$"
 councilor_th_scarlet_devil_effect: "—§H当$NAME_sakuya$担任此职位时，她将获得额外的效果§!\n$councilor_spth_can_replace_DIPLOMACY$"
 mod_planet_civilians_produces_mult: "平民人口资源产出"
 councilor_th_scarlet_devil_desc: ""
 councilor_th_river_child: "联合重工代表"
 councilor_th_river_child_female: "$councilor_th_river_child$"
 councilor_th_river_child_desc: "全名——河童重工驻幻想乡总署代表兼幻想乡总署驻河童重工督察。"
 councilor_th_moon_science: "月都考古总管"
 councilor_th_moon_science_female: "$councilor_th_moon_science$"
 councilor_th_moon_science_desc: "负责管辖月之都考古的方方面面，以图尽可能多地从月之都科技中获益。"
 councilor_th_fight_little_devil: "小恶魔专职联络员"
 councilor_th_fight_little_devil_female: "$councilor_th_fight_little_devil$"
 councilor_th_fight_little_devil_desc: "负责和小恶魔进行24小时不间断通讯，帮助小恶魔作战的同时也能总结小恶魔的先进战斗经验供其他舰队参考。"
 councilor_th_fight_little_devil_tooltip: "（还没做）"
 councilor_th_research_little_devil: "魔法助手"
 councilor_th_research_little_devil_desc: "负责进行探索与辅助研究的使魔，也能兼职一些研究性质的工作，但主要职责还是进入星界裂隙探索、调查小行星、被盐焗兽捕食(这段删掉)。"
 councilor_th_patchouil: "魔法使"
 councilor_th_patchouil_desc: "被魔法所迷住了的人，已经成为了魔法作为身体的原动力的妖怪，便是魔法使。以魔法的研究为其职业，每天都在思考新的魔法，在妖怪之中是最接近人类的。善于使役使魔、式神，使用魔法，且灵力强大。"
 councilor_spth_kanako: "建御名方神"
 councilor_spth_kanako_female: "$councilor_spth_suwa$"
 councilor_spth_kanako_desc: "古老的建御名方神，祂负责的事情中包括了军事，因此也被视作军神。"
 councilor_spth_suwako: "御社宫司神"
 councilor_spth_suwako_female: "$councilor_spth_suwa$"
 councilor_spth_suwako_desc: "古老的御社宫司神，祂负责的事情中包括了军事，因此也被视作军神。"
 councilor_spth_eirin: "蓬莱药贩"
 councilor_spth_eirin_desc: "负责管理幻想乡制药相关的工作与研究，也给人类和妖怪送药。关于从何处学到一身医药知识的，为什么会制妖怪的药，在开药店之前是干什么的，无法知道的很多。"
 councilor_spth_satori: "读心侦探"
 councilor_spth_koishi: "无意识的妖怪"
 councilor_spth_koishi_tt: "当古明地恋任职该内阁时，她将获得特殊效果。"
 councilor_spth_satori_desc: "负责监视地底的家伙，防止他们出现在地上，也会作为侦探出面调查旧地狱的各种事件。由于自身读心的能力，能够很好的管理怨灵，也可以与动物们交流，并且和她在一起的宠物会逐渐变强，成为强大的妖怪。"
 councilor_spth_koishi_desc: "恋一直处于无意识的状态，以至于她本人也不知道接下来她自己会做什么，无心无欲地顺从着周遭的环境生活着，就像随风飘舞的布片一般，没有任何目的，仅仅只是在周围四处游荡。"
 councilor_spth_satori_allow: "§R只有觉妖怪能够胜任该内阁职位§!"
 councilor_spth_hiffu: "裂隙研究主管"
 councilor_spth_hiffu_desc: "$TITLE$的职责是探求"

