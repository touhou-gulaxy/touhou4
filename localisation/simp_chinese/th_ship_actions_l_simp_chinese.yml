 touhou_ship_actions.100.name: "§H[From.GetName]§!不宣而战"
 touhou_ship_actions.100.desc: "§H[From.GetName]§!在没有宣战的情况下，使用某种跨星系攻击的武器摧毁了我们控制的星系，我们因此也与§H[From.GetName]§!进入了战争状态。"
 touhou_ship_actions.100.a: "必须要让他们付出代价！"
 touhou_ship_actions.101.name: "熄灭星辰"
 touhou_ship_actions.101.desc: "随着§H[FromFrom.GetName]§!的主炮完成了它熄灭星辰的任务，§H[From.GetName]§!的亮度瞬间提升了数百倍，随后逐渐暗淡下去，传感器表明这颗星星已经塌缩成了一个奇点，大部分§H[From.GetName]§!毁灭时释放的致命的能量被§H[From.From.GetName]§!引导到用于彻底坍缩这个奇点，剩余的一小部分则被引导到了§H[From.solar_system.GetName]§!恒星系内的其他天体上，将这些星球炸的四分五裂。\n\n§H[From.GetName]§!死亡时发出的黯淡而又耀眼的光芒将作为象征着我们国家的实力的纪念碑，在之后的数千年间被无数文明持续观察到。"
 touhou_ship_actions.101.a: "酷。"
 message_touhou_supercarrier_pk_weapon_killed_star_desc:0 "$touhou_target_planet|Y$因遭受$touhou_attacker|Y$的$touhou_attacker_ship|Y$的跨星系攻击而被摧毁，$touhou_target_system|Y$恒星系在暗淡的超新星爆发中被毁灭。"

 touhou_auto_combat_action_player: "式神「凭依荼吉尼天」"
 touhou_auto_combat_action_player_desc: "利用使役式神程度的能力，将式神凭依于我们的舰船上并且借助式神进行自动指挥，并且完成该舰队的战争行为，代价是需要额外为式神支付$r_sr_lingli$与$r_food$。\n\n§R在开启该动作后会自动接管舰队的移动行为与作战，请不要手动下达命令。§!"
 touhou_auto_combat_action_player_alt: "§E式神「凭依荼吉尼天」§!"
 touhou_auto_combat_action_player_alt_desc: "利用使役式神程度的能力，将式神凭依于我们的舰船上并且借助式神进行自动指挥，并且完成该舰队的战争行为，代价是需要额外为式神支付$r_sr_lingli$与$r_food$。\n\n§R当前舰队的移动行为与作战已经被接管，如要手动下达命令，请选择该特殊动作来关闭接管。§!"
 enable_touhou_auto_action_player: "已启用$touhou_auto_combat_action_player$"
 touhou_kuat_mega_starbase_stormed: "§E联动动作: 补给风暴§!"
 touhou_kuat_mega_starbase_stormed_alt: "§P联动动作: 补给风暴§!"
 touhou_kuat_mega_starbase_stormed_desc: "通过战斗神社开辟隙间裂口，来为附近的舰队远程输送必要的补给。\n开启补给风暴后，风暴所影响的星系内：当为开启时，获得舰队补给；当为关闭时，舰队无法获得任何补给\n当开启时将默认关闭堡垒自身的隙间风暴产生器。\n\n状态: $touhou_kuat_mega_starbase_stormed_status$"
 touhou_kuat_mega_starbase_stormed_status: "[This.get_touhou_kuat_mega_starbase_stormed_status]"
 touhou_kuat_mega_starbase_stormed_status_on: "§E已开启§!"
 touhou_kuat_mega_starbase_stormed_status_off: "§E已关闭§!"
 touhou_kuat_mega_starbase_stormed_larged: "§E联动动作: 强化补给§!"
 touhou_kuat_mega_starbase_stormed_larged_allow: "需要已经开启补给风暴"
 touhou_kuat_mega_starbase_stormed_larged_desc: "超频战斗神社的隙间驱动器，来更高效的为附近的舰队远程输送必要的补给。\n风暴所影响的星系内：强化舰队补给\n\n花费: 3000000 $r_alloys$\n冷却: 720£time£"
 touhou_kuat_mega_starbase_stormed_closed: "§E联动动作: 超级旗舰舰队§!"
 touhou_kuat_mega_starbase_stormed_closed_desc: "战斗神社通过使用夸特的技术可以建造舰队并且存储在隙间之中，并且在需要的时候紧急呼叫。\n风暴所影响的星系内：快速呼叫一支满编的【超级旗舰】星际无畏舰舰队。\n\n花费: 2000000 $r_alloys$ 500000 $r_sr_fuka$ 100000 $r_sr_lingli$\n冷却: 720£time£"
 touhou_kuat_mega_starbase_stormed_calling: "§E联动动作: 航母旗舰舰队§!"
 touhou_kuat_mega_starbase_stormed_calling_desc: "战斗神社通过使用夸特的技术可以建造舰队并且存储在隙间之中，并且在需要的时候紧急呼叫。\n风暴所影响的星系内：快速呼叫一支满编的【航母普旗】星际无畏舰舰队。\n\n花费: 1000000 $r_alloys$ 500000 $r_sr_fuka$ 100000 $r_sr_lingli$\n冷却: 480£time£"
 touhou_kuat_mega_starbase_stormed_calling_1: "§E联动动作: 炮击旗舰舰队§!"
 touhou_kuat_mega_starbase_stormed_calling_1_desc: "战斗神社通过使用夸特的技术可以建造舰队并且存储在隙间之中，并且在需要的时候紧急呼叫。\n风暴所影响的星系内：快速呼叫一支满编的【炮击普旗】星际无畏舰舰队。\n\n花费: 1000000 $r_alloys$ 500000 $r_sr_fuka$ 100000 $r_sr_lingli$\n冷却: 480£time£"
 touhou_kuat_mega_starbase_stormed_calling_2: "§E联动动作: 导弹旗舰舰队§!"
 touhou_kuat_mega_starbase_stormed_calling_2_desc: "战斗神社通过使用夸特的技术可以建造舰队并且存储在隙间之中，并且在需要的时候紧急呼叫。\n风暴所影响的星系内：快速呼叫一支满编的【导弹普旗】星际无畏舰舰队。\n\n花费: 1000000 $r_alloys$ 500000 $r_sr_fuka$ 100000 $r_sr_lingli$\n冷却: 480£time£"
