 touhou_system_warper_target_multiple_attack: "$touhou_system_warper$: §H多目标攻击§!"
 touhou_system_warper_target_multiple_attack_desc: "我们的巨型跃迁引擎不仅能够完成§Y移动星系§!的壮举，还可以作为一种远程打击的武器，通过打开的隙间向遥远的星系投射毁灭性的引力扭曲与灵力能量，重创其中的舰队或者引爆其恒星。\n\n在经过改装之后，其储能设施能够支撑其同时对§H多个星系§!展开§Y跨星系打击§!，并且整体的充能时间依旧不变。\n\n§H跨星系打击目标上限§!：§Y[Root.touhou_system_warper_target_max]§!\n§H预计冷却时间§!：§R1080.00§!£time£"
