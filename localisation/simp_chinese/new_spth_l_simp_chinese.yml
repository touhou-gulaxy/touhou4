 spth_story_ring_world_base: "§U自动环形世界基址§!"
 spth_story_ring_world_base_DESC: "这个设施将作为集结地、资源仓库，并为成千上万的环形世界建设者提供居住区。"
 spth_story_ring_world_base_MEGASTRUCTURE_DETAILS: "一个§U自动环形世界§!容纳了数个行星大小的区块，但需要拆除星系中其他的行星天体作为材料。同时你在初期建设后可以选择建设类型，完成后可以选择专精方向。"
 spth_story_ring_world_base_CONSTRUCTION_INFO_DELAYED: "一个完整的§U自动环形世界§!包含了４个修建完成的环形世界区段，每一段都相当于一个真正的、巨大的盖亚星球。"
 spth_story_ring_world_1_common: "§U自动环形世界框架§!"
 spth_story_ring_world_1_common_DESC: "这个初期的框架结构环绕着星系内的恒星，并会作为我们最后建设完整宜居带的平台。"
 spth_story_ring_world_1_gensokyo: "§U自动幻想星环框架§!"
 spth_story_ring_world_1_gensokyo_DESC: "这个初期的框架结构环绕着星系内的恒星，并会作为我们最后建设完整宜居带的平台。"
 spth_story_ring_world_2_common: "§U自动环形世界区段框架§!"
 spth_story_ring_world_2_common_DESC: "这个框架结构大体上构成了未完成的环形世界的总表面区域的四分之一。其中较小型的宜居区块的建设工作还没有完成。"
 spth_story_ring_world_2_gensokyo: "§U自动幻想星环区段框架§!"
 spth_story_ring_world_2_gensokyo_DESC: "这个框架结构大体上构成了未完成的环形世界的总表面区域的四分之一。其中较小型的宜居区块的建设工作还没有完成。"
 spth_story_ring_world_3_common: "§U已完成的自动环形世界区段§!"
 spth_story_ring_world_3_common_DESC: "一个功能完整的环形世界区段、包含了一个可供居住的活跃生态圈。"
 spth_story_ring_world_3_gensokyo: "§U已完成的自动幻想星环区段§!"
 spth_story_ring_world_3_gensokyo_DESC: "一个功能完整的环形世界区段、包含了一个可供居住的活跃生态圈。"
 gensokyo_ringworld_ruined: "§U损坏的幻想星环§!"
 gensokyo_ringworld_ruined_DESC: "这个环形世界区段曾容纳过一个功能齐全的居住地，但现在已经废弃。在理论它修复还可以被修复，但这需要更先进的科技和大量的资源。"
 gensokyo_ringworld_restored: "§U已完成的幻想星环区段§!"
 gensokyo_ringworld_restored_DESC: "一个功能完整的环形世界区段、包含了一个可供居住的活跃生态圈。"
 SPTH_STORY_RING_WORLD_SHOW_NAME: "§U环形区段§!"
 spth_lunar_outpost_portal: "§M结界隧道§!"
 spth_lunar_outpost_portal_DESC: "连通月都在巨引源布置下的结界两边的隧道。"
 spth_lunar_jumpdrive_gateway: "§B跃迁星桥§!"
 spth_lunar_jumpdrive_gateway_DESC: "月都可以借助跃迁星桥进行快速旅行，这些巨物的原理我们目前尚且无法解析。\n值得注意的是，跃迁星桥似乎会给通过其的舰船附着一层坚不可摧的防护力场，这使得穿越它的舰船能够免疫潜在的负面效应。"
