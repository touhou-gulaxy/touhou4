 ##############
 # 剧情起源文本 #
 ##############
 # 事件链顺序
 #  开局->失落历史->定位月之都->月都前哨站->月都派发任务
 #  ->做完一半任务->发现线索->选择：是否相信月都
 #   相信->做完任务->灵异珠->月之都具现化->选择：追随月都
 #    追随->直接开启异界入侵，但是全科技有支援
 #    不追随->被消灭->灭世->be->得知全貌
 #   不相信->新线索->灵异珠->质问前哨站->开战
 #  ->击败月都前哨站->挖坟->月都通讯->月都回归并开战
 #  ->月都战败->部分真相->定位裂隙->选择：是否封锁
 #   不封锁裂隙->初代巫女告知真相->修补现实->he?->20年后灭世，莲子剧情
 #   封锁裂隙->异界入侵(外神)
 #  异界入侵->打不过，但是找到了线索->秘封活动遗迹->现实计算机
 #  ->研究出反制方法->获胜/得到灾飞路线，飞升->he!->莲子梅莉回归
 # 基本设定
 #  0. 本质是秘封二人用计算机模拟的，梅莉意识神隐进入过多导致被吸了意识昏迷，莲子决定斩断因果链
 #  1. 外神相关势力与一切异变是莲子的努力
 #  2. 月都润是因为为了躲避毁灭，大结界避免了被毁灭
 #  3. 反制方法是主动修改过去的东西，从而切断因果链，让秘封二人安全的进入。
 #  4. 灾飞突破第四面墙，但是历史轮回
 #  5. 如果选择不开启事件链或者开局事件未完成，将在100～200年内全银河被爆破。
 # 失落历史事件链：
 # 月都、鸟船、不明异变、汇总已知信息并定位、废弃空间站、前月都殖民地、月都数据中心
 #  非必需: 蕾米莉亚帝国(if线)
 # 月都流程
 #  清理完障碍 - 挖坟
 #  解锁多段特殊项目，特殊项目需要反复研究
 #
 # 鸟船流程
 # 触发于灵力护盾科技研究完
 # 三个鸟船护盾的特殊项目
 #  收集数据 - 2科研船
 #  研究性质 - 概率失败，失败需要重新收集数据
 #           成功了随机roll 3~5个方案
 #  解除护盾 - 工程船，根据研究性质时roll的方案数量
 #            失败一次后尝试下一个方案
 #            每个方案有60%几率失败
 #            最后一个必定成功。
 # 完成项目后解锁居住站，需要派遣陆军占领
 # 占领后清理完障碍可以解锁秘封考古
 #
 # 不明异变
 # 开启失落历史2-3年后，触发一系列异变
 #
 # 前月都殖民地
 # 开启事件链后，5～15年内刷出星系，自带冰封星球+屏蔽星球。
 # 考古后星球变宜居，殖民清理玩障碍后开启项目解锁屏蔽星球
 # 屏蔽星球解锁后刷出敌对舰队，再次考古，定位新坐标。
 # 事件链引入
 disappear_barrier.2: "§U结界消逝§!"
 disappear_barrier.2.desc: "自从那个时候博丽大结界在未知影响下变得稀薄，而与外界融合的时候，这两个世界都彻底改变了。曾经被外界人类遗忘的妖怪们重新出现在了世界舞台上，强大的种族的联合使得这个文明再次繁荣。而如今我们发明了超空间引擎，正式踏入了浩瀚星海。\n\n但是随之而来的是更多的谜团——为何结界会衰弱、月球上出现的神秘破碎结界、以及早已被遗忘的鸟船空间站发生的异常。这一切都发生的太过突然且集中，或许这背后有什么人在暗中策划这一切。总之我们迟早要对这些现象展开调查，这可能会带来危险，但也可能带来更多的机遇。\n\n同时，我们还需要修复下我们母星§Y[spth_story_sol_system_earth.GetName]§!因为以前的事故等造成的环境破坏，不然可能会有一些§Y生态问题§!。"
 disappear_barrier.2.a: "§R不论是什么都无法阻止我们§!"
 disappear_barrier.3: "§B破碎结界§!"
 disappear_barrier.3.desc: "§Y[spth_story_sol_system_lunar_capital.GetName]§!是我们母星的唯一一颗卫星。其表面荒凉，被认为必须要经过环境改造才能殖民。但是之前的探测显示某处出现了神秘的结界裂口，其中存在着大量城市废墟，奇怪的是这刚好和以前科学世纪时的§Y某些传闻§!相吻合了，或许我们应该殖民这颗星球来开展后续研究。"
 disappear_barrier.3.a: "或许我们应该殖民加以调查"
 spth_repair_gensokyo_env: "§U修复母星环境§!"
 spth_repair_gensokyo_env_desc: "我们母星§Y[spth_story_sol_system_earth.GetName]§!的环境恶化问题已经刻不容缓了，我们必须在形势进一步恶化前，利用我们的先进技术进行修复，否则随着时间增长问题将会越来越§R严重§!！"
 disappear_barrier.4: "§U情况危急§!"
 disappear_barrier.4.desc: "我们母星的环境进一步恶化了，如果再不修复或许将§R永远§!失去这一宝贵的机会。"
 disappear_barrier.4.a: "§G该死§!"
 disappear_barrier.4.b: "§R我知道了§!"
 disappear_barrier.4.better_tooltip: "§G重新发起特殊项目，但是20年内没有研究完成负面效果将永远不会消失§!"
 disappear_barrier.4.worst_tooltip: "§R母星上的负面修正将不会消失，并且随着人口增长越来越严重！§!"
 disappear_barrier.207: "§R警告§!"
 disappear_barrier.207.desc: "根据我们多个部门的计算与观测，§Y[spth_story_sol_system_earth.GetName]§!上的环境问题或许会产生某些§R灵力异象§!，一些受到灵力影响的野生动物开始攻击人群。\n\n§R军事部门建议我们增加驻军的数量。§!"
 disappear_barrier.207.a: "了解了。"
 disappear_barrier.208: "§R入侵§!"
 disappear_barrier.208.desc: "§Y[spth_story_sol_system_earth.GetName]§!的环境问题使得一些受到灵力影响的野生动物开始攻击人群。这些受到了影响的动物群变得狂暴且难以击杀，开始向我们的城市发动攻击。"
 disappear_barrier.208.a: "该死！"
 disappear_barrier.5: "§U繁荣一统§!"
 disappear_barrier.5.desc: "在我们多个项目团队的共同努力下，过去的生态问题得到了彻底解决，如今我们可以全心投入到对于浩瀚宇宙的探索中了——以及寻找与调查一系列异变背后的推手。"
 disappear_barrier.5.a: "了解了"
 disappear_barrier.6: "§U工程设计§!"
 disappear_barrier.6.desc: "翻阅以前的数据时发现了一些遗留的图纸。\n\n这些图纸描绘了一种较为先进的科研船设计，或许对我们很有用？"
 disappear_barrier.6.a: "还有这么好的事"
 disappear_barrier.6.b: "哇多么好的机会啊"
 disappear_barrier.7: "§U过往历史§!"
 disappear_barrier.7.desc: "种种迹象都表明我们星系的历史比我们想象中的要深远。月球上暴露的结界、内部陨落的都市、被神秘力量的屏蔽的鸟船、消逝的结界，这一切背后必然有着什么操纵着。无论如何，在踏入星海之后，我们终将解开那重重谜团，不论隐藏着什么样的过往与危险。"
 disappear_barrier.7.a: "OK"
 disappear_barrier.8: "§U舰船图纸§!"
 disappear_barrier.8.desc: ""
 disappear_barrier.8.a: ""
 disappear_barrier.9: "§U设计完善§!"
 disappear_barrier.9.desc: ""
 disappear_barrier.9.a: ""
 disappear_barrier.10: "§U项目完工§!"
 disappear_barrier.10.desc: ""
 disappear_barrier.10.a: ""
 disappear_barrier.11: "§U先进民用船只§!"
 disappear_barrier.11.desc: ""
 disappear_barrier.11.a: ""
 disappear_barrier.12: "§U表里之月§!"
 disappear_barrier.12.desc: "我们殖民船正式落在了母星的这颗卫星上。殖民者们组织了一队调查人员，开始了对[spth_story_sol_system_lunar_capital.GetName]上出现的神秘结界裂口的探索。\n\n里面明显存在着一个高度发达文明遗留下来的废弃城市群，而且可以肯定的是他们的文字系统与我们非常相像，但是更为远古且复杂。根据妖怪贤者们的叙述以及§Y科学世纪§!时的一些传闻，这座陨落的城市应当属于一个被称作§Y月之都§!的先进文明，而且其建造者在诸多方面与我们高度的相似。\n\n在城市外围，还发现了疑似存在海洋的痕迹——巨大的地形洼地中遍布着水流过的痕迹、边缘绵延了数百米的沙地等，但是不知为何这结界内的干涸月海之中没有任何生物存在过的痕迹。"
 disappear_barrier.12.a: "真是有趣"
 disappear_barrier.13: "§U被屏蔽的空间站§!"
 disappear_barrier.13.desc: "鸟船，这座本来停驻于地月拉格朗日点的空间站，早在§U结界消逝§!一事之前就被注意到在未知影响下偏离了轨道，开始围绕着[spth_story_sol_system_earth.GetName]进行公转，并且表面还被一种未知的护盾所笼罩。如今，在研究了灵力护盾技术之后，可以发现这一护盾的本质和我们的灵力护盾比较相像，但是目前我们的技术水平仍然不够，或许在§Y技术再次进步§!后就可以尝试去破解鸟船的护盾了。"
 disappear_barrier.13.a: "真是有趣"
 disappear_barrier.14: "§U少女秘封俱乐部§!"
 disappear_barrier.14.desc: "根据我们的一些记录，这本博物志应该出自科学世纪时期两位少女所属的社团“秘封俱乐部”之手，似乎她们是少有的，在§U结界消逝§!一事之前，大结界尚存时能进入幻想乡之中的外界人类。\n\n至于寄宿其中的那股神秘力量，我们则完全未知。"
 disappear_barrier.14.a: "有趣"

 disappear_barrier.203: "§U没有星光的领域§!"
 disappear_barrier.203.desc: "§H[This.GetName]§!在穿过超平面航道后，到达了一片怪异的领域。\n\n§H[From.GetName]§!内居然没有恒星，只有一个巨大的神社状空间站位于这个星系的引力源所处的位置。周围还有数支舰队在此驻扎，不过他们似乎对我们没有敌意。\n\n根据分析，这个星系的引力源正是我们面前的那座巨型太空神社。"
 disappear_barrier.203.a: "我去，酷。"
 disappear_barrier.203.b: "太神必了。"
 disappear_barrier.204: "§U外星星系§!"
 disappear_barrier.204.desc: "我们得知[From.GetName]发现了一个奇特的远古星系，或许我们也应该对其进行调查，以防被他们所超越。"
 disappear_barrier.204.a: "可不能被他们超越了。"
 disappear_barrier.204.b: "惊了。"
 disappear_barrier.205.desc: "欢迎，§H[Root.Species.GetName]§!，请问你们有什么需要的吗？"
 disappear_barrier.205.a: "我们可以为你提供一些援助。"
 disappear_barrier.205.b: "有什么可以交易的东西吗？"
 disappear_barrier.205.c: "我们希望可以进一步合作"
 disappear_barrier.205.d: "我们想建立一座合作设施。"
 disappear_barrier.205.exit: "§E离开§!"

 spth_situation_unknown_result: "我们尚不清楚这会对我们带来什么影响。"

 disappear_barrier.1000.name: "§B中转地§!"
 disappear_barrier.1000.desc: "经过对月之都残留资料分析，我们大致推测出来月都逃亡过程中一处中转站的坐标，那处星系在星图记录中应该是一片虚空才对，天文部门对此表示巨大的不解。\n\n同时远程探测手段无法观测到其存在，根据记载与我们的一些猜测，那个星系应该被以什么方式隐藏了起来。\n\n对于这一情况，科学部门仍在研究。"
 disappear_barrier.1000.a: "好的。"
 disappear_barrier_locate_lunar_system_1: "§B定位 - 月都中转地§!"
 disappear_barrier_locate_lunar_system_1_type: "$disappear_barrier_locate_lunar_system_1$"
 disappear_barrier_locate_lunar_system_1_desc: "我们所发现的坐标在星图记录中什么都没有才对，对于这一情况科学部门仍在研究，相信一定能找到这背后的原因，从而顺利的找到那个星系。"
 disappear_barrier_locate_lunar_system_1_approach_positive: "加大投入"
 disappear_barrier_locate_lunar_system_1_approach_positive_effect: "这背后的谜团实在是太多了，而且突破这一问题可能会带来新的理论，这一切是值得的。"
 disappear_barrier_locate_lunar_system_1_approach_netual: "顺其自然"
 disappear_barrier_locate_lunar_system_1_approach_netual_effect: "我们还不确定这些记录是否真实准确，而且不知道是否存在着危险，小心谨慎为好。"
 disappear_barrier_locate_lunar_system_1_approach_pause: "停止投入"
 disappear_barrier_locate_lunar_system_1_approach_pause_effect: "这一切真的合理吗？"
 disappear_barrier_locate_lunar_system_1_monthly_change_tooltip: "该局势的进展取决于我们的投入。"
 disappear_barrier.1002.name: "§B异常反应§!"
 disappear_barrier.1002.desc: "对坐标附近星域的调查过程中，一队团队无意间发现了一处非常细微的灵力反应，这种现象绝对不可能是自然产生的。鉴于这是我们目前找到的唯一线索，他们建议以此为突破口进行调查。\n\n这一反应与月球上破碎的表里结界中渗出的反应较为类似，一种合理猜测是月都使用同样技术，在天文尺度上将整个星系都纳入了结界之中，但是维持这一状态需要的能量是难以想象的。"
 disappear_barrier.1002.a: "好的。"
 disappear_barrier.1003.name: "§B研究成果§!"
 disappear_barrier.1003.desc: "经过一段时间的理论论证与实地考察后，科研部门提出了一种理论：\n\n这处结界的进入方式和月之都上曾经结界的方式类似，八云紫曾经在第二次月面战争前使用式神凭依的乌鸦，沿着特定的路线进入了静海上空。或许我们可以用类似的方式，使用无人探测器去探索、规划路线，再派遣人员沿着那条路线前进，进入结界内部。"
 disappear_barrier.1003.a: "有道理。"
 disappear_barrier.1004.name: "§B失落星域§!"
 disappear_barrier.1004.desc: "在损失了大量的无人探测器后，我们终于规划出了一条可以进入结界内部的路线。科研人员们决定首先派遣无人机去探测，免得对面存在什么危险。\n\n进入后，映入眼帘的是一片布满残骸的星域，其中存在着一颗脉冲星、一颗被护盾屏蔽的星球与一个破碎星球。下一步就该派遣舰船进入、寻找解除结界的方式了。"
 disappear_barrier.1004.a: "惊了。"
 disappear_barrier.1005.name: "§B芝麻开门§!"
 disappear_barrier.1005.desc: "进入结界内部后，在那颗破碎星球上，科研人员们定位到了结界的源头，并且成功解锁了结界。根据记录，这个星系名叫“联合”，曾经是月都扩张时期殖民舰队的一处重要中转站，那颗屏障星球原本是中转枢纽，现如今因为安全原因被封锁了起来，或许我们要找的关键信息就在那颗星球的护盾之下。"
 disappear_barrier.1005.a: "有意思。"
 disappear_barrier.1006.name: "§B星桥§!"
 disappear_barrier.1006.desc: "[This.GetName]在穿越超平面航道后，发现了这个星系的边缘存在着一座被月都称为“星桥”的设施，据信月都依靠此来实现快速的点到点移动。可惜的是这座星桥目前我们无法使用，但科研部门相信他们能调查出其到底通往哪里，甚至解锁星桥。\n\n同时[This.GetName]报告，那颗破碎星球上突然有一个信标亮了起来，或许我们可以以它为调查起始点。"
 disappear_barrier.1006.a: "好的。"
 spth_lunar_union_gateway_disabled: "§B被禁用的星桥§!"
 spth_lunar_union_gateway_disabled_desc: "这座月都的星桥设施与另一端的星桥断开了连接，因此我们无法通行。"
 spth_lunar_union_system: "§B联合§!"
 spth_lunar_union_system_desc: "月都撤离时曾经使用的一处中转地。"
 spth_lunar_union_unlock_shield: "§B联合：解锁护盾§!"
 spth_lunar_union_unlock_shield_DESC: "我们可以尝试使用这颗星球上的地下设施，来解锁屏障星球之上的护盾。"
 disappear_barrier.1007.name: "§B古代舰队§!"
 disappear_barrier.1007.desc: "随着覆盖星球表面的护盾被解除，我们检测到了一股独特的能源信号，同时探测到星球地表上有一只小型舰队正在起飞。我们无论如何呼叫对方都不予理睬...从他们采取的行动上看，似乎来者不善..."
 disappear_barrier.1007.a: "什么？"
 disappear_barrier.1008.name: "§B舰船残骸分析§!"
 disappear_barrier.1008.desc: ""
 disappear_barrier.1008.a: ""
 spth_lunar_union_fleet_country: "§B联合星桥守备部队§!"
 spth_lunar_union_fleet: "§B古代舰队§!"
 spth_lunar_union_unlock_gateway: "§B解锁跃迁星桥§!"
 spth_lunar_union_unlock_gateway_DESC: "结合我们找到的跃迁星桥密钥，尝试解锁月都遗留的跃迁星桥。"
 spth_lunar_jumpdrive_gateway_union: "§B联合跃迁星桥§!"
 spth_lunar_jumpdrive_gateway_aethon: "§B艾同跃迁星桥§!"
 spth_lunar_aethon: "§B艾同§!"
 spth_lunar_aethon_desc: "一处月都跃迁星桥能抵达的星域，天文观测表明其衰老的孤独恒星中静静伫立着一座环形装置。"
 spth_lunar_aethon_star: "§B衰老孤星§!"
 spth_lunar_aethon_planet_1: "§M幽古之碑§!"
 spth_lunar_aethon_ring_section: "§B超级区段§!"
 spth_lunar_aethon_ring_colony: "§B研究区段§!"
 d_lunar_aethon_ruin: "§R月都遗迹§!"
 d_lunar_aethon_ruin_desc: "这里存在着月都城市的残骸群，清理完或许能获得些什么东西。"
 d_lunar_aethon_obelisk: "§E古代方尖碑§!"
 d_lunar_aethon_obelisk_desc: "我们尚不知道这座方尖碑的具体用途。\n不过它似乎可以激发周围人的灵力力量，从而略微提高工作效率。\n代价是变得，唔，精力旺盛。"
 building_lunar_aethon_archive_alt: "§B古代建筑§!"
 building_lunar_aethon_archive_alt_desc: "$spth_lunar_aethon$上保存较为完好的古代建筑，用途未知。"
 building_lunar_aethon_archive: "§B月都档案馆§!"
 building_lunar_aethon_archive_desc: "$spth_lunar_aethon$上的月都档案馆，我们可以对其进行研究。"
 disappear_barrier.1010.name: "§B寂静孤星§!"
 disappear_barrier.1010.desc: "§H[This.GetName]§!穿越了跃迁星桥，经历了其中光怪陆离的景象后，进入了一片古老而衰败的星域。\n\n古老的环形装置静静的环绕着§H[From.GetName]§!中的那颗红巨星，其部分结构受损，但据§H[This.GetName]§!报告称其本身一定程度上仍在运转，甚至还有一个区段明显宜居。在环形装置与红巨星之间的区域分布着大大小小的残骸，这里无数岁月之前似乎爆发过激烈的战斗。\n\n§H[This.GetName]§!建议我们可以从那个环形装置的宜居区段入手，来寻找新的线索。"
 disappear_barrier.1010.a: "$TH_INTERESTRING$"
 disappear_barrier.1011.name: "§B古代建筑§!"
 disappear_barrier.1011.desc: "在清理§H[lunar_aethon_event_rw.GetName]§!上的古代城市残骸时，我们发现了一座保存较为良好的§B月都大型建筑§!，当地政府随即组织了初步探索。而对其周边环境的调查表明，这座古代建筑应该是一座档案馆。不过这座设施的入口已经牢牢封死，构成这座建筑外墙的材料也非常坚固，同时当地政府并不想破坏这座建筑，我们或许应该派遣专门团队去尝试破解。"
 disappear_barrier.1011.a: "$TH_ACKNOWLEDGED$"
 disappear_barrier_aethon_research_section: "§H$spth_lunar_aethon$档案馆§!"
 disappear_barrier_aethon_research_section_type: "$disappear_barrier_aethon_research_section$"
 disappear_barrier_aethon_research_section_desc: "我们在$spth_lunar_aethon$星系的环形装置上发现了月都的一处档案馆，对其进行调查或许能揭示月都前往的下一处星域。"
 disappear_barrier_aethon_research_section_approach_positive: "加大投入"
 disappear_barrier_aethon_research_section_approach_netual: "正常投入"
 disappear_barrier_aethon_research_section_approach_negative: "减少投入"
 disappear_barrier_aethon_research_section_approach_positive_effect: "我们应该尽早完成解读，寻找月都离开的线索。"
 disappear_barrier_aethon_research_section_approach_netual_effect: "还是让事情顺其自然比较好，对吧？"
 disappear_barrier_aethon_research_section_approach_negative_effect: "之前的星域已经足够危险了，谁知道还会有什么等着我们？"
 disappear_barrier_aethon_research_section_monthly_change_tooltip: "该局势的进展取决于我们的投入。"
 disappear_barrier.1012.name: "$disappear_barrier_aethon_research_section$"
 disappear_barrier.1012.desc: "我们的科研团队在抵达§H[lunar_aethon_event_rw.GetName]§!一段时间后，成功的破解并打开了§H[lunar_aethon_event_rw.GetName]§!上月都古代档案馆的大门。紧接着，在殖民地当地政府的协助下，科考团队开始了对建筑的探索。\n\n综合现阶段我们收到的所有报告，他们在建筑内部发现了一座庞大的数据库，从其维护情况来看，它似乎在它的使用者离开之后仍然被精心保存着，这也为我们对它的研究提供了相当程度的便利。不过由于我们与月都的科技差距较大，短时间内可能难以取得较大进展。"
 disappear_barrier.1012.a: "$TH_OK$"
 disappear_barrier.1013.name: "$disappear_barrier_aethon_research_section$"
 disappear_barrier.1013.desc: "一段时间的研究后，我们的科研团队根据数据库索引确定档案馆中记载了一些月之都的历史、这个星系的相关信息和一种舰船的设计资料，并且根据数据库的日志，在很久之前大部分资料都被人为删除了。\n\n我们首先完成了对于历史部分的解读：\n与月都交战的文明因领土与理念争端多次与月都发生交战，月都最初还能依靠自身的科技优势进行抵抗，但随着未知文明对于星界技术的开发利用，月都面对能够灵活跃迁机动的敌人逐渐难以招架。\n经过确认，袭击了月球的舰船为未知文明曾经部署的自动化隐身巡游舰，在未知文明因为第三方干预退出这个位面的同时，他们也派遣了这些舰船在月球附近待命。一旦月都结界出现波动，这些舰船就会部署某种纯化的污秽存在突破结界发动进攻，并且不断的进行追猎。\n\n而在最后一篇记录中，提到了有两个令我们熟悉的人类身影曾经出现于里之月...\n其他部分的记录还在读取与解密中，目前针对以上信息，我们正在结合$r_th_latency$中的记载进行解读。"
 disappear_barrier.1013.a: "$TH_SO_INTERESTRING$"
 disappear_barrier.1014.name: "$disappear_barrier_aethon_research_section$"
 disappear_barrier.1014.desc: "接下来的部分包含了月都一种舰船的框架，根据分析其应该为此前我们遭遇的月都舰船之一。月都称其为$lunar_capital_frigate$，并且存在着两种设计——\"$NAME_lunar_capital_frigate_crisis$\"与\"$NAME_lunar_capital_frigate_s_crisis$\"，前者为强调防空能力特化的配装，而后者强调拦截敌方舰船推进。\n\n月都将其归类为\"暗星\"计划，尽管线索不多，但科研团队可以确定月都的一款相当后期的舰船设计，主要任务为护卫主力舰和边境巡逻，并且可能具备相当的实战经历。\n\n不过可惜的是我们对于这些舰船的武器尚不了解，加上我们与月都之间科技差距过大，我们只能考虑在其上加装属于我们的武器与能源网络。"
 disappear_barrier.1014.a: "$TH_SO_BAD$"
 disappear_barrier.1015.name: "$disappear_barrier_aethon_research_section$"
 disappear_barrier.1015.desc: "最后关于这个星系的资料也大致解析整理完了，除了一小部分关于那颗宜居星球的资料，其可以概述如下：\n这个星系的研究基地上研究着月都用来研究转移大型宏观物体，如整个星系，进入结界之中，同时在外界制造虚像的技术，在月都提出的理论模型之中甚至包含了将银心巨型黑洞转移的疯狂计划，并且此前联合星系的情况或许就是月都这一技术的实际成果。\n\n还有一部分处于高度加密状态的资料离完全解密也不远了。"
 disappear_barrier.1015.a: "多么疯狂的技术，很难想象他们是怎么做到的。"
 disappear_barrier.1016.name: "$disappear_barrier_aethon_research_section$"
 disappear_barrier.1016.desc: "最后一部分资料提及月都在离开这一星系前调整了该星系中的一座方尖碑设施，以防外人前往其他设施。或许我们应该尝试去殖民方尖碑所在的星球[spth_story_lunar_capital_aethon_planet_1.GetName]，来进行细致研究。"
 disappear_barrier.1016.a: "$TH_ACKNOWLEDGED$"
 disappear_barrier.1017.name: "§M幽古之碑§!"
 disappear_barrier.1017.desc: "随着殖民地建立在§H[spth_story_lunar_capital_aethon_planet_1.GetName]§!之上一段时间，殖民地当地政府报告这座被称作\"§M幽古之碑§!\"的方尖碑对当地居民产生了奇特的效果，他们的灵力力量得到了显著的提升，但同时似乎受到了一定的催情作用，对于这一效应的机理，当地政府的调查人员毫无头绪。\n\n此外，地质探测表面在方尖碑数公里的区域地下有着一处空洞，其通过一条隧道直接连到方尖碑的底座，或许我们应该组织一次探索。"
 disappear_barrier.1017.a: "$TH_OK$"
 decision_disappear_barrier_aethon_adjust_obelisk: "§M调整方尖碑§!"
 decision_disappear_barrier_aethon_adjust_obelisk_desc: "我们可以尝试对方尖碑进行重新调制，逆转月都的修改。"
 decision_disappear_barrier_aethon_adjust_obelisk_effect: "§M我们尚未知道可能的效果。§!"
 disappear_barrier.1018.name: "§B修改失败§!"
 disappear_barrier.1018.desc: "很不幸，我们对方尖碑的修改似乎是错误的，或许我们应该尝试其他方案。"
 disappear_barrier.1018.a: "可惜。"
 disappear_barrier.1019.name: "§B芝麻开门§!"
 disappear_barrier.1019.desc: "在我们正确调整了方尖碑后，星系内的$spth_lunar_jumpdrive_gateway$的能量功率激增，随后爆发出了一阵比恒星还要闪耀的闪光。很快，其又黯淡了下来，根据我们安装的控制模块，其导航系统中已经添加了一处新的星系——圣域。"
 spth_lunar_area_toyohime: "§B圣域§!"
 spth_lunar_area_toyohime_star: "寒冷之星"
 spth_lunar_area_toyohime_shroud: "§B战栗§!"
 spth_lunar_area_toyohime_desc: "一处月都曾经使用设施所在的星系。"
 spth_lunar_area_toyohime_shielded_ring: "§R屏障区段§!"
 sc_spth_cluster34: "星团"
 sc_spth_cluster34_desc: "天文观测表明这处星域是数个星系组成的一个星团，其中心存在着一处引力源约束着这些星系，但是对其的数学建模表明这样的结构并不合理，同时与其放射体不成比例的瑞利效应、过于对称的恒星周期等迹象表明这里的恒星极有可能是人工的。\n不论如何，这个星团非常的神奇而诡异。"
 spth_lunar_cluster34: "§B34号星团§!"
 spth_lunar_cluster34_star: "贝尔格莱德" # Beltegrades
 spth_cluster34_installation: "§B月都设施§!"
 spth_cluster34_installation_DESC: "34号星团中的奇怪月都设施，原理不明，用途未知。"
 disappear_barrier.1019.a: "$TH_SO_INTERESTRING$"
 disappear_barrier.1020.name: "§M神秘信号§!"
 disappear_barrier.1020.desc: "在我们启动古代方尖碑的一段时间后，帝国境内多处哨站检测到了一股神秘的子空间通讯信号，由于其最终进入了深层$NAME_The_Shroud$，加上目前我们对于深层$NAME_The_Shroud$实际上知之甚少，无法确定这股信号的最终目的地。\n\n并且之后在我们的一些殖民地上也检测到了轻微的灵能活动，根据殖民地政府的报告，当地部分居民总感觉有某种「存在」在他们背后邪恶的注视着他们，但当他们转过身时却什么都没有发现。这或许预示着什么，也许与此前的神秘信号有关。"
 disappear_barrier.1020.a: "$TH_WORYING$"
 disappear_barrier_cluster34_psi_worlds_tt: "§M如下的殖民地受到了神秘信号引发的灵能活动干扰：§!"
 disappear_barrier_cluster34_psi_signal_title: "§M灵能活动§!"
 disappear_barrier_cluster34_psi_signal_desc: "在我们通过古代方尖碑获得了前往34号星团的方式之后，某种神秘信号带来的灵能活动正在我们的一些殖民地上传播着，其背后到底意味着什么我们尚未知晓。"
 disappear_barrier_cluster34_psi_signal_planets: "§H受到灵能活动干扰的星球§!"
 disappear_barrier_cluster34_psi_signal_ships: "§H受到灵能活动干扰的舰船§!"
 disappear_barrier_cluster34_psi_signal_enm_armies: "§R现存的灵能实体§!"
 disappear_barrier_cluster34_psi_signal_enm_ships: "§R现存的灵能舰船§!"
 disappear_barrier_cluster34_psi_signal_sources: "§R灵力虚境锚点§!"
 disappear_barrier_cluster34_psi_mark: "灵能标记"
 disappear_barrier_cluster34_mark_0: "§M灵能恶兆§!"
 disappear_barrier_cluster34_mark_1: "§R灵能现象§!"
 disappear_barrier_cluster34_mark_2: "§B灵能异变§!"
 disappear_barrier_cluster34_mark_0_desc: "某种灵力与灵能混合的模式，非常的古怪。"
 disappear_barrier_cluster34_mark_1_desc: "灵能现象开始让人变得暴躁易怒，性格孤僻，影响了殖民地的秩序。"
 disappear_barrier_cluster34_mark_2_desc: "灵能环境引发异变开始出现，我们必须立刻进行退治。"
 disappear_barrier.1021.name: "§B圣域星系§!"
 disappear_barrier.1021.desc: "§H[This.GetName]§!进入了这个被称作“圣域”的星系，初步的远程探测表明，该星系内存在着一段被灵力护盾所屏蔽的环形区段，其护盾活动数据与此前鸟船护盾的非常相像。\n\n而在护盾下方，存在着一个信标以每1200秒为一个周期对外发送着灵力信号，按理说这一信号应该是无法穿透护盾的才对。§H[Leader.GetName]§!建议尝试解除护盾后对环形装置进行调查。"
 disappear_barrier.1021.a: "很好的计划，批准了。"
 disappear_barrier.1022.name: "§B灵能现象§!"
 disappear_barrier.1022.desc: "一段时间后，这些同时携带着灵力与灵能模式的灵能活动逐渐开始变强，引发了一系列灵能现象。有些人注意到时常有一些紫色与蓝色混合的雾气出现在殖民地的某些地方上空，其中闪烁着不祥的闪电，同时能在其中检测到某些具有灵力力量的存在，每当这些雾气出现时，总是让人感到焦躁不安。同时受影响殖民地上的人逐渐孤僻，生产效率明显受到了负面影响，更有传言说一些宣扬着“末日降临”、“祂们将具现化”的邪教教派出现。\n\n根据我们科学部门与灵能敏感者的分析，这些灵能现象由虚境中一些明显有着灵力力量的存在散发，更令人不安的是，这些存在的外形似乎接近于完全由灵能组成的月人与月都舰船。"
 disappear_barrier.1023.name: "§B混乱加剧§!"
 disappear_barrier.1023.desc: ""
 disappear_barrier.1024.name: "§B灵能异变§!"
 disappear_barrier.1024.desc: "§H[This.GetName]§!上的一伙邪教徒举行了献祭仪式，当地政府试图阻止的时候已经来不及了，他们打开了一道传送门。一些人形灵能实体开始从中出现对殖民地发起攻击，同时在周围形成了紫色与蓝色混合的雾气，接触到这些雾气的生物纷纷化作了一些粉尘。当地防御部队正在尝试抵抗，显然面对这些反则级别的弹幕收效甚微，我们或许应该派遣陆军进行支援。"
 disappear_barrier.1026.name: "§M月都·升格派§!"
 disappear_barrier.1026.desc: "在此前与月都AI那不愉快的交流后，天文部门与哨站观测到$spth_lunar_area_toyohime$中的恒星突然发射出了巨大的能量信号，来自虚境中实体的能量将它们转化为了灵力星体，并且以其为媒介出现了通往虚境的灵力锚点。一些完全由灵能组成的舰船开始从中出现，根据能量特征与外形判断，应该是经过灵能化的月都舰船。\n\n同时我们的跃迁星桥被莫名其妙的锁定了，科学团队尚且找不到解除锁定的方式。"
 disappear_barrier.1026.a: "了解了，准备战争。"
 disappear_barrier.1030.name: "§B无法抵达的终点§!"
 disappear_barrier.1030.desc: "在升格派对现实的入侵结束的数年后，圣域中的灵能环境逐渐的消散了。\n\n根据派驻在跃迁星桥的科学团队，最近其上的封锁也随着灵能环境的消失而解除了，根据其导航模块的记录，其最终目的地指向了如今室女座超星系团的中心。早在我们登入太空之前，就有天文学家测量出在那处位置存在着某个“巨引源”，但是它的本质直到现在我们都尚不清楚。由于矩尺座星系团的天文活动，其星系十分密集，很多星系互相碰撞合并，辐射出大量的无线电波，是一个理想的隐匿带，月之都将其作为最终的藏身地想必也十分合理。\n\n根据我们的测算，只需要给跃迁星桥提供足够的灵力，或许可以将其激活，使我们有能力前往那个曾令无数天文学家遐想的，永远无法抵达的终点。"
 disappear_barrier.1030.a: "神奇。"
 spth_lunar_toyohime_shield_data: "§B灵力护盾数据收集§!"
 spth_lunar_toyohime_shield_data_DESC: ""
 lunar_capital_psi.100.name: "§G特殊项目完成§!"
 lunar_capital_psi.100.desc: "我们的科学团队成功收集了这一灵力护盾的相关数据，经过分析其在月都常见的灵力护盾之内封装了一层常识的结界，从而难以击破。不过好消息是，幻想乡中的贤者们提出了理论可行的绕过这一机制的方法。\n\n§R此外在护盾下方检测出了一些与之前月都设施中灵能印记相似的痕迹，或许我们应该小心行事。§!"
 spth_lunar_toyohime_unlock_shield: "§B灵力护盾破解§!"
 spth_lunar_toyohime_unlock_shield_DESC: "根据此前的数据收集，这一灵力护盾通过常识的结界进行了进一步封锁，好在我们之中的贤者们提出了解除的方法，现在可以尝试破解这一灵力护盾了。"
 lunar_capital_psi.101.name: "§G特殊项目完成§!"
 lunar_capital_psi.101.desc: "我们成功破解了这一灵力护盾，不过在护盾之下的环形装置区段看起来破损严重。目前我们已经定位到了信号的来源，或许我们可以在那里找到新的线索。"
 lunar_capital_psi.102.name: "§B月都古代AI§!"
 lunar_capital_psi.102.desc: "你好啊，§R<读取物种名称失败§!>，我是§R<数据查询失败>§!，有着展现海市蜃楼程度的能力。\n\n你们也和我的创造者一样，具有灵力呢。"
 lunar_capital_psi.102.a: "§H[from.GetName]§!怎么了？"
 lunar_capital_psi.102.a.response: "啊。\n\n她的身体暂时被我占据了而已，但是请放心，她的意识尚且完好。"
 lunar_capital_psi.102.b: "你为什么要占据§H[from.GetName]§!的身体？"
 lunar_capital_psi.102.b.response: "因为我本体其实正处在虚境之中。\n\n我需要一个现实空间之中的锚点，才能与你们交流。"
 lunar_capital_psi.102.c: "这里到底曾经发生了什么？"
 lunar_capital_psi.102.c.response: "这里曾经爆发过战斗哦。\n\n月之都拒绝像我们一样使用灵能，真是一群迂腐的老家伙。\n不过我们也只是抵抗他们的攻击而已。"
 lunar_capital_psi.102.d: "那月之都呢？"
 lunar_capital_psi.102.d.response: "月之都？\n\n他们被人攻击了，踏入了逃亡之路。\n这处星系的跃迁星桥可以通往他们最终的目的地。\n但是目前而言，这里的灵能环境会阻止任何试图穿越前往的舰船。"
 lunar_capital_psi.102.e: "是谁在攻击月之都？"
 lunar_capital_psi.103.name: "§B月都古代AI§!"
 lunar_capital_psi.103.desc: "$spth_precursor.makai$。\n\n月之都和$spth_precursor.makai$之间一直存在冲突的，但是一直没有过于撕破脸皮。\n但是我们也没想到他们做的那么绝。\n在$spth_precursor.makai$支离破碎后，他们用某种未知方式在你们所知的月球附近的空间褶皱内，部署了自动舰队，在我们的结界出现缺口的时候，这些自动舰队向我们发动了进攻。\n长期的不思进取使得月都完全无法应对这一突然袭击，只能不断的逃亡。"
 lunar_capital_psi.103.desc.find_makai: "$spth_precursor.makai$。\n\n你们应该已经知晓了他们的存在吧？\n月之都和$spth_precursor.makai$之间一直存在冲突的，但是一直没有过于撕破脸皮。\n但是我们也没想到他们做的那么绝。\n在$spth_precursor.makai$支离破碎后，他们用某种未知方式在你们所知的月球附近的空间褶皱内，部署了自动舰队，在我们的结界出现缺口的时候，这些自动舰队向我们发动了进攻。\n长期的不思进取使得月都完全无法应对这一突然袭击，只能不断的逃亡。"
 lunar_capital_psi.103.a: "那你们到底是什么？"
 lunar_capital_psi.104.name: "§B月都古代AI§!"
 lunar_capital_psi.104.desc: "我们？\n\n我们也是月之都，但也不完全是。\n很早之前我们就意识到现实空间里文明的发展是有上限的，文明的需求哪怕是灵力提供的产出也无法满足。\n于是我们决定，将自己灵能化，进行升格，进入虚境生存。\n月之都那些大人物们对此似乎非常恐惧，一直在尝试镇压我们。\n只不过，在他们逃亡过程中发现这里时，我们距离成功已经不远了。尽管损失惨重，但我们还是升格进入了略深层的虚境，在这里我们可以获得难以想象的能源与物质，代价只不过的现实空间的灵能环境逐渐变得不太稳定而已。"
 lunar_capital_psi.104.desc.ag: "我们？\n\n我们也是月之都，但也不完全是。\n很早之前我们就意识到现实空间里文明的发展是有上限的，文明的需求哪怕是灵力提供的产出也无法满足。\n于是我们决定，将自己灵能化，进行升格，进入虚境生存。\n月之都那些大人物们对此似乎非常恐惧，一直在尝试镇压我们。\n只不过，在他们逃亡过程中发现这里时，我们距离成功已经不远了。尽管损失惨重，但我们还是升格进入了略深层的虚境，在这里我们可以获得难以想象的能源与物质，代价只不过的现实空间的灵能环境逐渐变得不太稳定而已。\n\n其实在你们之前，在我们之后，那两个自称“泽洛”与“文明世界”的家伙，也曾经造成过严重的灵能环境不稳呢。"
 lunar_capital_psi.104.a: "那这样不会导致现实空间的灵能环境不稳定吗？"
 lunar_capital_psi.105.name: "§B月都古代AI§!"
 lunar_capital_psi.105.desc: "很不幸，的确会。\n\n但那又怎么样呢？不论是灵力科技还是灵能科技都存在着上限，我们的生存比什么都重要。\n还有，拒绝进步是愚蠢的哦。"
 lunar_capital_psi.105.desc.ag: "很不幸，的确会。\n\n但那又怎么样呢？不论是灵力科技还是灵能科技都存在着上限，我们的生存比什么都重要。\n\n你们已经发现了自称“文明世界”的家伙的遗产吧？他们玩弄灵能的后果你也看到了吧？\n泽洛文明的升格派，他们造成的灾难你也知道了吧？\n拒绝进步是愚蠢的哦。"
 lunar_capital_psi.105.a: "你们只不过是一群毫无理性的疯子，不顾现实的安危。"
 lunar_capital_psi.105.a.response: "随便你们吧。\n\n但是不论如何，我们成功了不是吗？\n我们成功的在稍深层的虚境定居了下来，现实不论发生什么都不会影响到我们。\n哪怕是那些自以为是的文明，以为能够牺牲虚境来提升自己，他们也只不过是毁掉了浅层虚境，完全没有意识到反而滋养了我们。\n\n至于那些高高在上的月都大人物，早就狼狈的把自己躲藏了起来，不过身为同族，我还是会用灵能阻止任何人提供跃迁星桥访问他们的藏身地。"
 lunar_capital_psi.105.b: "为什么要阻止我们前往。"
 lunar_capital_psi.105.b.response: "你以为我不知道你们想干什么吗？\n\n你们这些年轻的文明只知道破坏和掠夺，让你们前往只会让污秽沾染到纯净的地方。\n月之都一直不愿意清理你们这些污秽，但我们可不会有任何顾忌。\n你们只能从我们的尸体上踏过，我们维持的灵能环境永远不会消散。"
 lunar_capital_psi.105.c: "你们无法阻止我们。"
 lunar_capital_psi.105.c.response: "哦。\n我劝你们把这里的舰船撤离，避免无意义的损失，然后接受我们仁慈的怒火吧。\n\n说实话，本来我打算稍迟点清理污秽的，因为你们还蛮可爱的。但是你确实把我惹恼了。"
 lunar_capital_psi.106.name: "§R灵能环境§!"
 lunar_capital_psi.106.desc: "根据天文观测，圣域中的灵能环境正在不断的恶化，人员汇报称自己感受到了来自未知的恶意。考虑到之前和古代AI不太友善的对话，我们或许应该撤离这里，并且准备战争。"
 lunar_capital_psi.107.name: "§R虚境变化§!"
 lunar_capital_psi.107.desc: "此前遗留在人造空间中的无人探测器观测到了一些灵能构成的舰船开始从较深层虚境开始往浅层虚境进发。\n\n如果我们的理论正确，即使是对于已经灵能化的他们，想要安全的从虚境前往现实空间，也需要在浅层虚境进行交通。这意味着我们在他们正式袭击前还有准备时间。"
 lunar_capital_psi.150.name: "§B灵力锚点§!"
 lunar_capital_psi.150.desc: "根据天文部门的报告，我们的银河系中出现了两处小型灵力锚点，来自虚境的能量正在不断的涌出，敌对的灵能舰船也正在源源不断的降临。同时根据现有信息推断，我们需要关闭这些锚点后才能关闭位于“圣域”中的大型灵力锚点，从而彻底阻止敌人的入侵。"
 lunar_capital_psi.151.name: "§B一线希望§!"
 lunar_capital_psi.151.desc: "在我们的舰队攻入§H[lunar_gate.GetName]§!后，我们的科研部门根据收集到的灵能舰船数据与对锚点星系内诸多现象的分析，找到了关闭锚点的可能方式。\n\n但是目前我们收集到的数据仍然不足，通过击毁更多的敌方舰船应该可以推进项目的进行。"
 lunar_capital_psi.17.name: "§B隐身抑制场§!"
 lunar_capital_psi.17.desc: "§H[From.GetName]§!中似乎存在着某种灵能环境产生的隐身抑制场，我们的隐身失去了效果。"
 th_disable_cloaking: "§M灵能侵蚀§!"
 lunar_capital_psi.23.name: "§B研究突破§!"
 lunar_capital_psi.23.desc: "在我们的舰队摧毁了足够的灵能舰船后，科学部门成功研究出了灵力锚点的应对措施，现在可以准备进行逆向工程来关闭这些讨人厌的虚境传送门了。"
 lunar_capital_psi.24.name: "§B§H[spth_system.GetName]§!锚点已关闭§!"
 lunar_capital_psi.24.desc: "我们成功关闭了位于§H[spth_system.GetName]§!的锚点，这里不会再出现灵能舰船入侵了。"
 lunar_capital_psi.25.name: "§G黎明降至§!"
 lunar_capital_psi.25.desc: "在我们的努力下，银河系内的小型锚点都已经被关闭了，而此前被锁定的跃迁星桥也可以正常使用了。现在我们可以一鼓作气，派遣舰队关闭位于“圣域”的主锚点了。"
 lunar_capital_psi.26.name: "§G风波平息§!"
 lunar_capital_psi.26.desc: "在关闭了锚点之后，月都升格派的灵能舰船再也无法派遣入侵部队了，并且由于切断了与虚境的连接，灵能舰船纷纷如同风中残烛般消逝。乐观估计在数个月内所有的入侵舰队都会消散于现实结构之中，我们赢得了这场战争的胜利。科学家们也成功回收了一部分月都舰船的数据，我们可以尝试建造这些强大的舰船了。\n\n此外，对于这一突发事件的一种主流猜测认为，月都中灵能派系一直试图将自己升格为虚境中更强大的存在，之前我们碰到的月都AI正是负责主管灵能派系试验的。由于AI自身的灵能与灵力结合本就不稳定，加之各种输入数据使其本身人格矩阵开始变得越发偏激，最终导致了其对我们的敌对行为，引导已经灵能实体化的灵能派月都向我们发动了这次进攻。\n\n随着灵能活动的平息，也许很快我们就能提供跃迁星桥访问月都最终的藏身地了。"
 lunar_capital_psi.26.a: "唉，$TH_DAMN_PSI$"
 lunar_capital_psi.28.name: "§B[From.GetName]被摧毁§!"
 lunar_capital_psi.28.desc: "[FromFrom.GetName]轰炸了我们的殖民地[From.GetName]，那里的人民彻底消失在了神秘的灵力反应之中。"
 lunar_capital_psi.28.a: "可恶。"
 lunar_capital_psi.28.b: "我们会为[From.GetName]复仇的。"
 lunar_capital_psi.34.name: "§M$crisis_sphere_4$被毁§!"
 lunar_capital_psi.34.desc: "位于§H[spth_target_system.GetName]§!的$crisis_sphere_4$突然遭受到了来自虚境的某种远程打击，其中呈现出了月都升格派的灵能活动模式，同时由于星系中剧烈的灵能活动远远超出了我们的控制能力，或许要等之后才能对其进行修复了。"
 lunar_capital_psi.34.a: "什么？"
 lunar_capital_psi.36.name: "§M灵能模式§!"
 lunar_capital_psi.36.desc: "§H[This.GetName]§!上的殖民者汇报，星球上出现了某种奇特的灵能环境，其呈现出了一定的灵能模式，对生产和日常活动带来了不小的影响。"
 lunar_capital_psi.36.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.37.name: "§M[This.GetName]遭受攻击§!"
 lunar_capital_psi.37.desc: "不久之前，在§H[This.GetName]§!之上的灵能活动消失了。然而正当星球生产开始重回正轨后，星球轨道上突然打开了一道灵力锚点，向§H[This.GetName]§!发射了灵能闪电，在殖民地上造成了重大损失。"
 lunar_capital_psi.37.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.38.name: "§M船坞遭受攻击§!"
 lunar_capital_psi.38.desc: "位于§H[spth_shipyard_system.GetName]§!的船坞突然遭受了来自虚境的灵能攻击，虽然结构稳定性没有遭到损坏，但是其生产舰船的效率大打折扣了。"
 lunar_capital_psi.38.a: "该死。"
 lunar_capital_psi.38.a.effect: "§R该船坞失去了大部分的造船速度。§!"
 lunar_capital_psi.39.name: "§M灵能抑制平台被消耗§!"
 lunar_capital_psi.39.desc: "§H[spth_target_system.GetName]§!星系中的灵能抑制平台以自身为代价成功阻止了升格派从虚境中发动的灵能攻击。"
 lunar_capital_psi.39.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.40.name: "§M传感器失效§!"
 lunar_capital_psi.40.desc: "星系中的灵能活动对[Root.GetName]产生了严重的影响，其目前已经严重干扰了我们的深空探测活动，我们所有深空探测手段的分辨能力都显著降低了。\n\n目前为止，我们所有深空探测活动都受到了极大的限制，预计要好几年才能让传感器恢复正常运作。"
 lunar_capital_psi.40.a: "真是可怕。"
 lunar_capital_psi.40.a.effect: "§R在§Y10年§!内，我们无法通过$spy_orb_4$获取全星系范围内的视野。§!"
 lunar_capital_psi.41.name: "§M物质解压器异常§!"
 lunar_capital_psi.41.desc: "§H[spth_target_system.GetName]§!星系中的物质解压器受到了星系中灵能环境的影响，产出受到了影响，预计在数年后这一效应才会消失。"
 lunar_capital_psi.41.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.42.name: "§M戴森球异常§!"
 lunar_capital_psi.42.desc: "§H[spth_target_system.GetName]§!星系中的戴森球受到了星系中灵能环境的影响，产出受到了影响，预计在数年后这一效应才会消失。"
 lunar_capital_psi.42.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.43.name: "§M灵能觉醒§!"
 lunar_capital_psi.43.desc: "§H[This.GetName]§!上的部分[This.Owner.Species.GetName]人口最近突然觉醒了灵能能力，科学部门怀疑这是灵能环境的影响。"
 lunar_capital_psi.43.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.44.name: "§M科学枢纽异常§!"
 lunar_capital_psi.44.desc: "§H[spth_target_system.GetName]§!星系中的科学枢纽受到了星系中灵能环境的影响，产出受到了影响，预计在数年后这一效应才会消失。"
 lunar_capital_psi.44.a: "$TH_ACKNOWLEDGED$"
 lunar_capital_psi.45.name: "§M舰队遭受攻击§!"
 lunar_capital_psi.45.desc: "§H[This.GetName]§!的舰队遭受了来自虚境的攻击，许多舰船的船身完整性受到了负面影响，同时关键部位持续不断的受到损伤，因此维护费短时间内不得不提高，预计数年后才能恢复正常。"
 lunar_capital_psi.45.a: "怎么会这样？"
 lunar_capital_psi.46.name: "§M武器失能§!"
 lunar_capital_psi.46.desc: "§H[spth_target_system.GetName]§!星系中的舰队遭受了星系中灵能环境的影响，船员们汇报舰船的能源网络中的灵力不断的散失，似乎有什么虚境中的存在建立了某种高维能量通道，让我们的武器难以发挥该有的战斗力。考虑到这种规模的能量通道难以维持太久，预计数年后就能恢复正常。"
 lunar_capital_psi.46.a: "怎么会这样？"
 lunar_capital_psi.46.a.effect: "§R[spth_target_system.GetName]中的舰队暂时失去了全部的能量、灵力循环增益。§!"
 lunar_capital_psi_close_sub_gate: "§B关闭锚点§!"
 lunar_capital_psi_close_sub_gate_DESC: ""
 lunar_capital_psi_close_main_gate: "§B关闭主锚点§!"
 lunar_capital_psi_close_main_gate_DESC: ""
 lunar_cluster34_shroud_country: "§B升格派§!"
 lunar_cluster34_shroud_entity_army_l: "灵能幻影"
 lunar_cluster34_shroud_entity_army_m: "灵能实体"
 lunar_cluster34_shroud_entity_army_s: "灵能虚像"
 lunar_cluster34_shroud_entity_army_l_desc: "似乎是完全由灵能组成的大型炮艇，会使用大量的弹幕与灵能导弹进行火力压制。"
 lunar_cluster34_shroud_entity_army_m_desc: "这些充斥着恶意的人形灵能实体会释放出反则的弹幕压制祂们的敌人，同时召唤出灵能闪电与精神攻击。"
 lunar_cluster34_shroud_entity_army_s_desc: "月兔形状的灵能投影，会发射子弹状的自机狙与追踪弹幕进行攻击。"
 spth_lunar_capital_psi_sub_gate_1: "灵力锚点"
 spth_lunar_capital_psi_sub_gate_2: "灵力锚点"
 spth_lunar_capital_psi_sub_gate_3: "灵力锚点"
 spth_lunar_capital_psi_sub_gate_desc: "这里存在着一处虚境入侵的灵力锚点。"
