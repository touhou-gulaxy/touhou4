 spth_precursor.202.name: "§H传入信号§!"
 spth_precursor.202.desc: "……\n你好，我们是§H隙间之里§!，你或许已经和顶替了这个名字的势力接触过了……\n\n没有吗？\n那是好事，我们原本预计要过很久才能重返现实。看起来已经过去了如此久远的岁月，背叛者也已经离开了。\n……\n总之无论如何，不要靠近这里。"
 spth_precursor.202.desc.after_crisis: ""
 spth_precursor.202.desc.ag: ""
 spth_precursor.202.a: "……"
 spth_precursor.203.name: "§H传入信号§!"
 spth_precursor.203.desc: ""
 spth_precursor.203.a: "……"
 spth_precursor.204.name: "§H[contact_empire.GetName]的觉醒§!"
 spth_precursor.204.desc: "……我们，[contact_empire.GetName]已经迷惘的足够久了，如今我们将会重新庇护这片星河。\n\n我们是§H隙间之里§!，万物与秩序的守护者。\n银河之根基，我们精心培育，使其根深蒂固。\n生命之所在，我们无数世代的智慧便渗透了那片土壤。\n我们的力量，是向所有智慧生物绽放的璀璨太阳。\n也是它们得以繁荣的坚不可摧的庇护所。\n\n纵使被自己造物背叛，我们的理想也从未改变。\n§R[enemy_empire.GetName]§!，就是银河系中最大的威胁，拒绝根除他们，无异于愚蠢的赌博。\n我们徒劳地在黑暗中度过永恒，而他们却攫取了我们的成就，据为己有。\n你们可以任意评说我们的作为，但不要怀疑这一现实。\n回归过程……已经开始。"
 spth_precursor.204.desc.common: "……我们，[contact_empire.GetName]已经迷惘的足够久了，如今我们将会重新庇护这片星河。\n\n我们是§H隙间之里§!，万物与秩序的守护者。\n银河之根基，我们精心培育，使其根深蒂固。\n生命之所在，我们无数世代的智慧便渗透了那片土壤。\n我们的力量，是向所有智慧生物绽放的璀璨太阳。\n也是它们得以繁荣的坚不可摧的庇护所。\n\n纵使被自己造物背叛，我们的理想也从未改变。\n你们可以任意评说我们的作为，但不要怀疑这一现实。\n回归过程……已经开始。"
 spth_precursor.204.a: "关闭通讯。"
 spth_precursor.204.b: "准备战争。"
