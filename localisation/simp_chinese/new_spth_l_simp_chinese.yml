 spth_kamikakushi_country: "$spth_kamikakushi_invader$"
 spth_kamikakushi_country_no_color: "隙间之里"
 mod_damage_vs_country_type_spth_kamikakushi_country_mult: "对$spth_kamikakushi_invader$伤害"
 spth_makai_defence_system: "§B星界防卫设施§!"
 spth_makai_defence_system_crisis: "§R失控防御系统§!"
 mod_damage_vs_country_type_spth_makai_defence_system_crisis_mult: "对失控魔界防御系统伤害"
 spth_precursor.123.name: "§M击败守卫§!"
 spth_precursor.123.desc: "我们成功击败了[spth_precursor_capital_makai_system.GetName]中的河外舰队。残骸中回收的数据显示，这支舰队是完全自动化的，旨在消除“主楔”的威胁。\n\n根据其上记载，“主楔”可以连通两个次元，$spth_precursor.makai$当初试图用该装置让$spth_precursor.makai$位面与我们的位面直接相连，来解决$spth_precursor.makai$位面遇到的某些麻烦，但遭到了这支自称为“隙间之里”的势力袭击而失败。有关$spth_precursor.makai$到底遇到了什么样的麻烦使得他们做出该行动仍不得而知，不过这或许不是我们应该担心的了。最终$spth_precursor.makai$因为这项工程被敌对势力破坏，横贯上百个星系的帝国在数百年的时间内慢慢的崩溃，最终$spth_precursor.makai$的幸存者们只能躲进$spth_precursor.makai$位面苟延残喘。\n\n现在我们已经回收到了足够的数据，应该可以尝试对“主楔”进行修复了。"
 spth_precursor.123.a: "令人惋惜。"
 spth_precursor.124.name: "§M修复工作完成§!"
 spth_precursor.124.desc: "我们对于主楔$spth_makai_wedge_0$的修复已经完成。\n\n虽然已经无法连接不同的次元，但它扭曲空间的能力仍可以让我们的舰队在短时间内跨越星海。我们还可以将之前的那艘舰船核心，也就是副楔，作为定位信标，将[spth_precursor_capital_makai_system.GetName]星系内的军用舰队短时间内跃迁至副楔附近，每次使用大概需要180£time£的充能时间。"
 spth_precursor.124.a: "一场伟大的胜利。"
 spth_precursor.125.name: "§R不明干扰§!"
 spth_precursor.125.desc: "我们超级航母[spth_temp_ship_target.GetName]的战斗系统因为隙间之里的某些不明干扰，在与隙间之里舰队交战时无法正常运作。"
 spth_precursor.125.a: "真是个坏消息。"
 spth_precursor.1.name: "§M快子信号§!"
 spth_precursor.1.desc: "在我们击败了$spth_kamikakushi_country$的舰队之后，我们侦测到了一束奇特的快子信号。根据测量与定位，其传出自$spth_precursor.makai$的母星系[spth_precursor_capital_makai_system.GetName]，而目的坐标为本该为一片虚空的地方。\n\n但是现在我们观测可以确定那里存在着一个巨大的引力源，而此前那里还是什么都没有的。或许我们应该组织调查。"
 spth_precursor.1.a: "好好"
 spth_precursor.2.name: "§M奇特的星系§!"
 spth_precursor.2.desc: "[This.GetName]一进入星系，发现这里被一股异常的环境现象所笼罩。其中的环形世界充满了虚幻的感觉，根据探测其似乎同时存在于两个位面之中，而中央的恒星也变为了由灵力驱动反应的怪异天体。很快，我们的传感器分辨出了信号的来源——这个星系中的一颗宜居星球。\n\n§R或许我们应该在[spth_precursor_makai_alice_arc.GetName]上面进行殖民来展开进一步调查。§!"
 spth_precursor.3.name: "§M古代遗迹§!"
 spth_precursor.3.desc: "在我们的殖民船落地开展工作的一段时间后，殖民者们在[spth_precursor_makai_alice_arc.GetName]上发现了大片充满$spth_precursor.makai$风格的城市废墟。而这片废墟的中央似乎有什么东西，产生了巨大的能源信号。或许我们应该尝试清理这些废墟，不仅可以协助殖民地拓展工作，还能去搜寻一些秘密。"
 spth_precursor.4.name: "§M古代屏障§!"
 spth_precursor.4.desc: "清理了最后一片废墟后，[spth_precursor_makai_alice_arc.GetName]上的殖民者们发现了一处被古代屏障屏蔽的建筑。\n\n或许我们应该组织一队科考团队进行调查。"
 spth_precursor.10.name: "§M古代信标§!"
