 # first contact
 spth_fcsum_enclave_curator_1: "我们发现§H[This.ContactCountry.GetName]§!建立在§H[This.System.GetName]§!恒星系的一个单一的太空站上，周围似乎存在着一些守卫用的舰船。"
 spth_fcsum_enclave_curator_2: "与§H[This.ContactCountry.GetName]§!的通讯已建立。"
 spth_first_contact.2.name: "有规律的信号"
 spth_first_contact.2.desc: "我们收到了来源不明的读数。这些信号似乎遵循着某种重复的句法，证明其来源应为智慧生物。我们应进一步研究它。它们似乎集中在一个空间站附近，但尚不清楚这个空间站是不是一个更大的太空文明的一部分。"
 spth_first_contact.3.name: "$NAME_spth_curator$"
 spth_first_contact.3.desc: "在成功的翻译了他们的语言之后，我们与§H[This.ContactCountry.GetRealName]§!的独立空间站建立了通讯。"
 spth_first_contact.3.a: "居然是$NAME_spth_curator_leader$"
 spth_first_contact.4.name: "$NAME_spth_curator$"
 spth_first_contact.4.desc: "你们好，§H[Root.Species.GetName]§!...\n等等？\n\n想不到还能在这里碰到幻想乡的存在，我是香霖堂的店主，$NAME_spth_curator_leader$。"
 spth_first_contact_kedama_1: "我们发现§H[This.ContactCountry.GetName]§!"
 spth_first_contact_kedama_2: "§H[This.ContactCountry.GetName]§!被识别为称为“太空毛玉”的具有敌意的灵力生命。"
 touhou_kedama.10.name: "奇特的存在"
 touhou_kedama.10.desc: "当我们进入[This.System.GetName]时，传感器获取了一个奇怪的数据。一开始把它们当成发光的小行星而忽视了，但后来当发现它们会对太空中的移动物体哪怕距离很远都会做出一定的进攻性反应，事情就变得有趣了起来。\n\n建议最好从安全的距离上观察这些东西。"
 touhou_kedama.10.a: "最好从远处观察，继续吧。"
 touhou_kedama.11.name: "太空毛玉"
 touhou_kedama.11.prefix: "我们的舰队此前遭遇到的实体是一种新发现的太空生命形式。\n\n由于最初对传感器数据的粗略误读，我们很快就给它们起昵称为§H“太空毛玉”§!。"
 touhou_kedama.11.desc: "$touhou_kedama.11.prefix$\n这些生命似乎是一种在幻想乡中常十分见的生物，其外表看起来像是一团毛绒绒的球体，内部结构无法观测。\n不知道为什么变得巨大化了然后在整个银河系中四处游荡。"
 touhou_kedama.11.a: "有趣。"
 touhou_kedama.11.a.dld: "也许我们可以尝试安抚它们。"
 touhou_kedama.12.name: "安抚毛玉的可能"
 touhou_kedama.12.desc: "这些太空毛玉目前难以交流，但是$NAME_satori$提出了一种可以安抚这些灵力生物的方案，借助她读心的能力，我们也许可以尝试与这些毛玉沟通。"
 touhou_kedama.12.a: "$TH_OK$"
 touhou_kedama_home: "繁樱原野"

 spth_th07_yuyuko_fan_object: "御所车画屏"
 spth_th07_yuyuko_fan_object_tt: "己身的忧愁倘若去思考只会更加的苦闷，但在所谓没有出世的时代是无法超脱的。"
 spth_th07_yuyuko_fan_object_desc: "己身的忧愁倘若去思考只会更加的苦闷，但在所谓没有出世的时代是无法超脱的。\n一面巨大的御所车画屏展开于战场之上，幽冥楼阁的亡灵少女的力量笼罩着这个星系。"

 # diplomacy phrases
 01_gsk_HOSTILE_GREETING: "[From.GetSpeciesName]，你们这群无魂的异端无信者，我们不会与任何无魂的污秽妖怪进行交流，请不要挑战我们的耐心。"
 02_gsk_HOSTILE_GREETING: "[From.GetSpeciesName]，我们不会与你们这群妖言惑众的异端妖怪进行任何交流。要是你想把[Root.GetName]人转化成你们无良教义下的信徒，我就切断通信了。"
 03_gsk_HOSTILE_GREETING: "我们的庞大陆军会踏平[From.GetSpeciesNameInsult]的妖术国度，你们那弱小的“弹幕”在我们的强大战舰面前没有任何作用，只是一堆无用的烟花。"
 04_gsk_HOSTILE_GREETING: "你们这些肮脏的[From.GetSpeciesNameInsult]的“弹幕”巫术真是星系和平的一大威胁，我们会让你们明白你们的愚蠢带来的后果！"
 05_gsk_HOSTILE_GREETING: "效率低下的[From.GetSpeciesNameInsult]啊，你们的正确做法应该是投降，我们保证不计前嫌，还会让你们从“弹幕”巫术之下被解放。"
 06_gsk_HOSTILE_GREETING: "你们所谓的灵力在我们的灵能面前除了衬托气氛面前毫无作用，[From.GetSpeciesNameInsult]应该尽早认识到这一点，卑微的妖怪们。"
 07_gsk_HOSTILE_GREETING: "我们见识过无数的文化在这片星河绽放。而[From.GetSpeciesNameInsult]，你们那些愚傻的妖术白白毁灭了你们辉煌的文化遗产。"
 08_gsk_HOSTILE_GREETING: "肮脏的异形！你们这群肮脏的巫术使用者让我们只想对[From.GetSpeciesNameInsult]赶尽杀绝！如果有机会，我们会摧毁你们，异形！"
 09_gsk_HOSTILE_GREETING: "你们居然还敢自称[From.GetSpeciesClassPlural]……这让我感到发自内心的难堪。堕落之徒！你们只不过是我们这些纯正的[Root.GetSpeciesClassPlural]的肮脏影子而已。"
 10_gsk_HOSTILE_GREETING: "高贵的[This.GetName]举国上下都对低贱的[From.GetSpeciesNameInsult]抱有轻蔑之感，你们这些非自然的存在只会让我们不舒服。"
 11_gsk_HOSTILE_GREETING: "干什么，你们这群污秽的[From.GetSpeciesNameInsult]！我们拒绝与任何与帝国政策相违背的东西交流，我们的耐心早已被你毫无意义的玩笑耗尽。。"
 12_gsk_HOSTILE_GREETING: "说明来意，愚蠢的[From.GetSpeciesNameInsult]，否则我们会净化你们这群妖孽。"
 13_gsk_HOSTILE_GREETING: "我们不想和你们这群恶心的妖物有任何关系，[From.GetSpeciesNameInsult]。你们为什么要联络[Root.GetName]呢？"
 14_gsk_HOSTILE_GREETING: "§R<<检测到<转义:非自然/污秽>存在>>§!<启动外交羞辱子处理器，计算中...>$tt$结果: if (recipient.auth == \"auth_gensokyo\") closeConnection()"
 01_gsk_FRIENDLY_GREETING: "[From.GetSpeciesName]，你们在进行魔法研究时一定也不要忽视了灵力的潜力啊，[Root.GetName]能看出这一圣洁的力量中的强大。我们真心祝福你们。"
 02_gsk_FRIENDLY_GREETING: "幸会了，[From.GetSpeciesName]。有人把你们视作奇异妖术的使用者，但我们都知道灵力的客观存在与可利用价值，因此充分理解你们的行为。你们想谈些什么呢，朋友？"
 03_gsk_FRIENDLY_GREETING: "啊，是[From.GetSpeciesNameCompliment]啊。我们希望你们能加强常规军事力量，万一弹幕与符卡出现了什么问题，[Root.GetName]不可能时时刻刻保护你们。"
 04_gsk_FRIENDLY_GREETING: "你们的弹幕与符卡真是极大的促进了星系间的和平与发展，多么令人羡慕啊。我们祝你们的国家永远繁荣，[From.GetSpeciesNameCompliment]朋友！"
 05_gsk_FRIENDLY_GREETING: "[From.GetSpeciesNameCompliment]朋友，你们的灵力研究进行的如何了？需要我们的协助时可以随时联系，祝你们一帆风顺！"
 06_gsk_FRIENDLY_GREETING: "灵力与灵能或许是一体两面呢...啊，欢迎你们，[From.GetSpeciesNameCompliment]。愿神灵赐予你们和平与繁荣，来一起促进心灵力量吗？"
 07_gsk_FRIENDLY_GREETING: "[From.GetSpeciesNameCompliment]的文化一直在[Root.GetName]内饱受欢迎呢，有你们在真的是太好了，促进了这片星河的文化发展。"
 08_gsk_FRIENDLY_GREETING: "放心吧，我们对异形的恐惧在[From.GetSpeciesNameCompliment]自然的就解除了。[Root.GetName]时刻准备着给你们提供帮助，朋友。"
 09_gsk_FRIENDLY_GREETING: "看到一张熟悉的[From.GetSpeciesNameCompliment]脸庞一直是一件愉快的事情。这表明我们不仅仅是作为幻想的存在，而是真正的伟大之人。"
 10_gsk_FRIENDLY_GREETING: "[Root.GetName]向尊贵的[From.GetSpeciesNamePlural]发出诚挚的问候。我们的人民对你们充满了欢迎，一定要来多多作客啊。"
 11_gsk_FRIENDLY_GREETING: "想不到真的能看到神明的存在，[From.GetSpeciesNamePlural]。你们不仅仅是幻想，而是真正的神迹之人啊。"
 12_gsk_FRIENDLY_GREETING: "我们很乐意倾听来自幻想乡的声音，[From.GetSpeciesName]朋友们。跟你们的交谈实在是太高兴了。"
 13_gsk_FRIENDLY_GREETING: "[Root.GetName]时刻准备着给你们提供帮助，幻想乡少女们。"
 14_gsk_FRIENDLY_GREETING: "§G<<检测到<转义:妖怪/神明>物种>>§!<启动外交欢迎子处理器，计算中...>$tt$结果: 我们很乐意倾听你们的声音，<幻想种>朋友"

