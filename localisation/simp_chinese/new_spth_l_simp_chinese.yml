 ag_psionic_mutation_ghost_of_damaku_DESC: "灵能结构使得舰船完整性即将崩溃时，能再度从虚境中汲取能量重构自身。"
 ag_psionic_mutation_ship_part_ran_computer_DESC: "泽洛文明升格派的意识碎片寄宿其中，能够准确的解算火控。"
 ag_psionic_mutation_phase_stealth_generator_DESC: "这种隐身发生器凭借灵能力量将自身存在的痕迹从现实中抹去。"
 ag_psionic_mutation_ship_part_lingli_afterburner_DESC: "诡异的灵能迷雾萦绕在孢子之中，为舰船提供额外的能量。"
 ag_psionic_mutation_ship_part_outworld_protector_DESC: "生物体内的灵能活动与灵力结合，提高了护盾与装甲的运行效率。"
