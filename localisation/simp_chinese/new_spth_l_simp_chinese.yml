 spth_story_crisis_titan_kinetic_weapon: "§B红夜「湮灭」§!"
 spth_story_crisis_titan_kinetic_weapon_DESC: "蕴含着血族力量的永恒之枪，为敌人带来纯粹的毁灭。"
 spth_story_crisis_titan_kinetic_weapon_effect: "血族祭祀: \n$tt$§R啖食敌人的血肉，于绯色月下尽情的狂欢吧§!\n绯红收割: 该武器所在舰船在战斗时若§Y击杀敌人§!，将会基于该武器§Y数量§!为自身恢复§Y20%-100%§!血量，并且在2£time£内提升少量舰船回血能力，该效果可以叠加。\n血之饥渴: \n在前者基础上增加该武器伤害49.50%，持续90£time£，武器伤害的增益可以持续累积。\n永恒神枪: 每天都有§Y32%§!概率为所在舰船提供回血效果，该效果可以随部件数量叠加且最高不超过§Y50%§!。"
 spth_story_crisis_titan_energy_weapon: "§B终焉「千桜华宴」§!"
 spth_story_crisis_titan_energy_weapon_DESC: "三千世界，终为冥土。彼世的华胥可以驭使亡灵为我们所用。"
 spth_story_crisis_titan_energy_weapon_effect: "狂樱之舞: \n$tt$§P此间盛开者，樱花缤纷胜仙境，不似人间景§! \n己方舰船损失时，为该武器所在舰船积攒樱点，不同数量的樱点将具有着不同效果，且樱点在战斗结束后将清空。\n樱点数量超过§Y32§!: 为舰船提供少量的额外维修能力，但是合金与能量币维护费增加。\n樱点数量超过§Y16§!: 提升舰船的['spth_word_concept_armor_shield_efficiency']。\n樱点数量每增加§Y1§!: 将会为该武器提供额外§Y+32%*该武器数量§!的伤害增益，该增益可以叠加且叠加上限为§Ymin(能量循环伤害/2, 7200%)§!\n被动效果: 如果当前季节为春季或者冬季，则额外增益自身追踪与该武器射速；反之则额外增益自身的命中与闪避；该效果不可叠加。"
 spth_story_weapon_sakura_point: "[This.spth_weapon_sakura_point]"
 spth_story_weapon_sakura_point_default: "0"
 spth_story_crisis_titan_generic_weapon: "§B乖离「无名迷雾」§!"
 spth_story_crisis_titan_generic_weapon_DESC: "这是来自旧夜神祗的馈赠，能够发动威力强大的爆发性攻击。"
 spth_story_crisis_titan_generic_weapon_effect: "旧夜馈赠: \n$tt$§B若问深闺中，山岩锐可断蛇身，寒渊冷气涌§! \n该武器在战斗时每5£time£都有几率获得持续3£time£额外增伤，且该武器§Y越多§!概率与倍率§Y越高§!。效果结束后将会导致该武器陷入严重虚弱2£time£。\n概率最高不超过§Y90%§!，倍率§Y不能超过乘算36倍§!。\n玛尔斯号角：装备$spth_story_crisis_extra_generic_weapon$时，该武器虚弱程度会从完全失去伤害减少为恢复正常伤害。"
 spth_story_crisis_extra_kinetic_weapon: "§B「红色不夜城」§!"
 spth_story_crisis_extra_kinetic_weapon_DESC: ""
 spth_story_crisis_extra_kinetic_weapon_effect: "该武器额外享受144%的动能循环伤害加成与20%的能量伤害转化来的射速加成，射速加成不能超过700%，在下半年会削弱为只转化16%，同时溢出的射速会100%转化为伤害。\n以下效果仅在进入战斗时生效一次:\n§B动能连携§!: 该武器可以根据$spth_story_crisis_large_kinetic_weapon$的数量额外提升自身伤害，无上限。"
 spth_story_crisis_extra_energy_weapon: "§B「西行庭千本桜図」§!"
 spth_story_crisis_extra_energy_weapon_DESC: ""
 spth_story_crisis_extra_energy_weapon_effect: "该武器额外享受144%的能量循环伤害加成与20%的动能伤害转化来的射速加成，射速加成不能超过700%，在上半年会削弱为只转化16%，同时溢出的射速会100%转化为伤害。\n以下效果仅在进入战斗时生效一次:\n§B能量连携§!: 该武器可以根据$spth_story_crisis_large_energy_weapon$的数量额外提升自身伤害，无上限。"
 spth_story_crisis_extra_generic_weapon: "§B「深海的玲珑谜团」§!"
 spth_story_crisis_extra_generic_weapon_DESC: ""
 spth_story_crisis_extra_generic_weapon_effect: "技能结束后，每天积攒一点点数。点数达到6时会将该武器射速提升至极限，持续4£time£同时清除点数。\n玛尔斯号角：装备$spth_story_crisis_titan_generic_weapon$后，交战当天会将该武器32%动能与能量射速加成转化给伤害，并且加算增加($spth_story_crisis_titan_generic_weapon$数量*100%)的伤害。"
