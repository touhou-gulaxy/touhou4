 # 从远古的母星走来，文明世界一度支配了整个室女座超星系团，影响力几乎遍布拉尼凯尼亚超星系团。
 # 然而谁又能想到，曾经以星系作为行政区划的文明，内战后彼此的认同彻底消亡于时间的长河中，最后只剩下小小的环形装置……
 #
 # 或许如今的宇宙之中，仍留存有它的一些遗民；又或许，曾经属于它的一切已然不在，泯灭在了和它那历史一样悠久的时光中。
 # 但那又怎样呢？
 # 宇宙不会止步不前。
 #
 # 在曾经的核心星域之上，新的文明诞生。
 # 他们从最初的钻木取火，再到登上星空。
 # 他们会愈发强大，愈发智慧。
 # 他们终会发现文明世界曾留下的些许痕迹，甚至重现昔日核心星系的繁荣强盛。
 spth_ag_data_selected_message: "叹息"
 spth_ag_data_selected_message_ag_a_desc: "昔日强大到遍布整个超星系团的文明，如今却仅剩下了些许残影。"
 spth_ag_data_selected_message_ag_b_desc: "这些堕落帝国也和古代文明的残余一样，停滞不前了。"
 spth_ag_data_selected_message_ag_c_desc: "很可惜，传统文明再也没有发展到五级奇点的希望了？"
 spth_ag_data_selected_message_ag_d_desc: "真是巧妙的思路，也许我以后可以捣鼓出类似的哦。"
 spth_ag_data_selected_message_ag_e_desc: "通过活体金属与纳米机器人进行快速修复，狡猾。"
 spth_ag_data_selected_message_ag_f_desc: "那么是谁把暮光之钥从博物馆里拉出来的呢～"
 spth_ag_data_selected_message_ag_g_desc: "狡猾的古代工程师设计的安全系统真是复杂哦。"
 spth_ag_data_selected_message_ag_h_desc: "注意一下，投影舰队所受伤害会和本体同步～"
 spth_ag_data_selected_message_ag_i_desc: "省流：太省钱了以至于引力武器都不装了，灵能抑制T34。"
