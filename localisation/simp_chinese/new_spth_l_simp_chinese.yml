 th_ag_interaction.117.name: "§P特殊项目：H星域破解§!"
 th_ag_interaction.117.desc: "她们提出了一种理论上能破解古代安全系统，稳定关闭古代星门的方法，不需要依赖与使用控制符来获得古代空间站的权限。在古代AI与[From.GetName]等幻想乡众人的帮助下，我们现在只需要一个多月的时间即可完成这一项目。"
 th_ag_interaction.117.starlight.desc: "在[From.GetName]与星光二号对收集到的漩涡之灵活动数据进行分析后，$th_ag_interaction.117.desc$"
 th_ag_interaction.117.kappa.desc: "在[From.GetName]与幻星一号对收集到的漩涡之灵活动数据进行分析后，$th_ag_interaction.117.desc$"
 th_ag_interaction.117.a:0 "不错的提议，开始行动吧。"
 th_ag_interaction.117.b:0 "还是算了。"

 th_ag_interaction.118.name: "§P孤星华光舰载数据库解析§!"
 th_ag_interaction.118.desc: "孤星华光舰载数据库中包含了许多使用灵能晶体构造的存储设备。尽管大多数设备中的内容都由于灵能晶体的损坏无法读取，[From.GetName]可以尝试使用灵力窥探其中的回响。"
 th_ag_interaction.118.starlight.desc: "$th_ag_interaction.118.desc$之后星光二号将会尝试对这些灵能晶体中的信息进行解析，大概需要一个月的时间。"
 th_ag_interaction.118.kappa.desc: "$th_ag_interaction.118.desc$之后幻星一号将会尝试对这些灵能晶体中的信息进行解析，大概需要一个月的时间。"
 th_ag_interaction.118.a: "不错的提议，开始行动吧。"
 th_ag_interaction.120.name: "§P孤星华光舰载数据库解析完成§!"
 th_ag_interaction.120.desc: "我在[From.GetName]的协助下对这些灵能晶体中的信息进行了一系列解码，分批次获取了孤星华光舰载数据库中的部分记录条目。您可以现在去审阅一下内容了。\n\n我们可以访问古代泰坦：孤星华光上舰载数据库的内容。\n$ag_use_actions$"
 th_ag_interaction.120.a: "很好。"

 th_ag_interaction.201.name: "§P扭曲护盾活动数据§!"
 th_ag_interaction.201.desc: "我们接收到了繁星旅者在大麦哲伦星系探索时发现的高维能量导管相关设计与扭曲护盾的活动数据。或许我们可以尝试对古代文明的扭曲护盾进行仿制，来加强我们的灵力护盾。不过由于我们无法生产出高维能量导管，只能尝试使用舰船能源进行替代，性能肯定会略差一些，但结合了熵次元吸收能量特性的灵力结界护盾依旧远远领先于我们的现有防御手段。"
 th_ag_interaction.201.a: "很好。"

 spth_ag_interaction_eta_gateway_event_overwrite_project: "§PH星域：破解古代空间站§!"
 spth_ag_interaction_eta_gateway_event_overwrite_project_DESC: "我们在古代AI的帮助下设计了一种能够破解$ag_ancient_eta_gateway_control_megastructure_name$的系统而不依赖于向其提供控制符的操作方式。"

 ag_lost_ancient_ship_dialog_kamikakushi.1: "光流螺旋星系附近的虚空之中居然有这样的存在，为什么文明世界此前从未察觉甚至发现过$spth_kamikakushi_country$。"
 ag_lost_ancient_ship_dialog_kamikakushi.2: "$spth_kamikakushi_country$与$spth_precursor.makai$?看来核心星系的历史远比想象中的要古老。"
 ag_lost_ancient_ship_dialog_kamikakushi.3: "$spth_kamikakushi_country$使用的用于跨越星系间虚空的技术很奇特，似乎是与文明世界所使用的维度航行比较相似。"
 ag_lost_ancient_ship_dialog_kamikakushi.4: "$spth_kamikakushi_country$的舰船数量似乎异常的多，文明世界怎么没有发现并清除这些可能的威胁？"

 ag_epsilon_titan_leader_dialog_kamikakushi.1: "…… ……存在到底是什么?……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.2: "……$spth_kamikakushi_country$?……\n\n……文明世界……居然没有任何情报……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.3: "……文明世界……已经消失了……\n\n……$spth_kamikakushi_country$……不能妨碍我们!……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_kamikakushi.4: "……这些……古老的舰队\n\n……文明世界的数据库里完全没有符合的技术特征……$ag_epsilon_titan_leader_dialog_suffix$"

 ag_kappa_computer_dialog_kamikakushi.1: "$spth_kamikakushi_country$……数量为什么这么多。"
 ag_kappa_computer_dialog_kamikakushi.2: "$spth_kamikakushi_country$没资格祸害核心星域！"
 ag_kappa_computer_dialog_kamikakushi.3: "$spth_kamikakushi_country$的大部分技术我完全没有见过。"
 ag_kappa_computer_dialog_kamikakushi.4: "我们必须阻止$spth_kamikakushi_country$!"

 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.1: "真可惜，我没法亲自操控军舰消灭这些河外入侵者。"
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.2: "计算资源已分配至后勤工作，我们需要更多的战舰。"
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.3: "$spth_kamikakushi_country$的舰队似乎异常庞大，希望我们之前的准备能使我们度过难关。"
 ag_extragalactic_galaxy_m106_ai_dialog_kamikakushi.4: "[Root.GetName]需要集结一切力量来阻止$spth_kamikakushi_country$毁灭银河系。"

 ag_lost_ancient_ship_dialog_makai_repair_wedge.1: "我注意到有什么信号传往了光流螺旋星系附近的虚空之中，真是奇怪，那里什么都没有的啊。"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.2: "$spth_precursor.makai$与主楔?核心星系从未发现这类存在的痕迹啊"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.3: "用于快速跨越星界壁垒的人造结构，文明世界要是能发现并且掌握这种技术就好了。"
 ag_lost_ancient_ship_dialog_makai_repair_wedge.4: "鉴于此前的这里舰队来自光流螺旋星系附近，或许该考虑是否存在可能威胁到我们的危险了。"

 ag_epsilon_titan_leader_dialog_makai_repair_wedge.1: "……$spth_precursor.makai$……核心星垣居然没有发现过吗?……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.2: "……[spth_precursor_capital_makai_system.GetName]?……\n\n……如此之近的星系……文明世界居然没有察觉……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.3: "……我……有点不安……\n\n……有什么信号……发送到了遥远的深空……$ag_epsilon_titan_leader_dialog_suffix$"
 ag_epsilon_titan_leader_dialog_makai_repair_wedge.4: "……也许……主楔这种技术\n\n……也许可以重建文明世界……$ag_epsilon_titan_leader_dialog_suffix$"

 ag_kappa_computer_dialog_makai_repair_wedge.1: "$spth_precursor.makai$所使用的技术，没有符合的技术特征。"
 ag_kappa_computer_dialog_makai_repair_wedge.2: "我们目前似乎没有重建副楔的可能性，使用时需要小心点。"
 ag_kappa_computer_dialog_makai_repair_wedge.3: "结果我的计算与解码，[spth_precursor_capital_makai_system.GetName]此前向外传出的信号似乎不太安全。"
 ag_kappa_computer_dialog_makai_repair_wedge.4: "这种技术穿越星界壁垒或许存在风险，但是作为极远程交通工具也许很合适。"

 ag_extragalactic_galaxy_m106_ai_dialog_makai_repair_wedge.1: "如果文明世界当年发现这里的话，也许就不会那样了……"
 ag_extragalactic_galaxy_m106_ai_dialog_makai_repair_wedge.2: "信号接收地是…光流螺旋星系附近的虚空?文明世界此前的探查表明那里应该什么都没有啊"

