 NAME_alice: "爱丽丝·玛格特洛依德"
 leader_trait_alice: "七色的人偶师"
 leader_trait_alice_desc: "拥有操控人偶程度的能力和操纵魔法程度的能力。作为人偶师，她的灵巧度在幻想乡中首屈一指,可以宛如活着一样地操纵人偶，但操纵人偶的时候，她须要全力以赴，因此行动缓慢并且战斗能力也低。"
 leader_trait_alice_effect: "指挥军用舰队进入战斗后: \n生成§G1-3§!个§R难以摧毁§!的幻象舰队，持续§G8-15§!£time£，冷却180£time£。"
