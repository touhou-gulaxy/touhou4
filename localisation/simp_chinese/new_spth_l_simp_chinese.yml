 spth_ag_ai_option_makai.1: "有[spth_precursor_capital_makai_system.GetName]中传出信号的线索吗？"
 spth_ag_ai_option_makai.2: "文明世界有$spth_precursor.makai$的数据吗？"
 spth_ag_ai_option_kamikakushi.1: "你了解$spth_kamikakushi_country$吗？"

 spth_ag_ai_option_makai.1.response: "根据分析，这段信号应该是传往光流螺旋星系附近的一处地方，但是文明世界确认过那里应该什么都没有才对。也可能确实存在着什么，只不过因为后面泽洛内战的爆发和文明世界被卷入，他们最后是无暇顾及调查了。\n\n这种数据信号并不符合文明世界数据库中的任何特征。"
 spth_ag_ai_option_makai.2.response: "没有，从未发现过$spth_precursor.makai$相关的遗迹。\n说实话我也很好奇，[spth_precursor_capital_makai_system.GetName]就在如此靠近核心星系的地方，为什么文明世界从来都没有察觉到。\n\n在[spth_precursor_capital_makai_system.GetName]中的设施和你们的记录表明，他们可能具备着异常先进的维度技术，不然他们也无法轻易的利用主楔突破星界壁垒。"
 spth_ag_ai_option_kamikakushi.1.response: "不了解。\n繁荣纪元的文明世界曾经观察到来自那里的什么能源波动，但是与灵能或者其他什么的完全不同，就算当时的他们也无法解析其中的内容。更诡异的是记录到原始数据的存储设备在第二天突然就不翼而飞了，但是事后调查却找不到任何线索。\n\n文明世界也尝试过对那片区域进行探索，却什么都无法发现。最后这件事情也随着文明世界被卷入泽洛文明内战而不了了之了。\n现在看来那里确实存在着什么神秘势力，根据你们的记录那里应该存在着维持庞大自动化舰队所需的设施，只不过我们无法探查到，或许存在什么先进的隐形场什么的。考虑到$spth_kamikakushi_country$与$spth_precursor.makai$都可能掌握着先进的维度相关技术，可能是他们用某种手段把设施隐藏起来了？"

 th_ag_interaction.17.name: "§P灵力理论学习§!"
 th_ag_interaction.17.desc: "在一段时间的调试后，我们成功将灵力理论相关的数据接入了星光二号。这位来自古代文明的先进人工智能现在获得了更强大的能力。"
 th_ag_interaction.18.name: "§P灵力理论学习§!"
 th_ag_interaction.18.desc: "在一段时间的调试后，我们成功将灵力理论相关的数据接入了幻星一号。这位来自古代文明的先进人工智能现在获得了更强大的能力。"
 th_ag_interaction.19.name: "§P灵力理论学习§!"
 th_ag_interaction.19.desc: "有了先前的经验，我们可以将灵力理论相关的数据快速兼容到其他的古代文明人工智能。"
 th_ag_interaction.ok: "很好"

 th_ag_interaction_trait_starlightII_sci: "§P灵力理论接口§!"
 th_ag_interaction_trait_starlightII_sci_desc: "§P星光二号，这位来自古代文明的先进人工智能，已经学习了我们灵力相关的知识理论，能够更好的运用于科研与行政管理。§!"
 th_ag_interaction_trait_starlightII_adm: "§P灵力理论接口§!"
 th_ag_interaction_trait_starlightII_adm_desc: "§P星光二号，这位来自古代文明的先进人工智能，已经学习了我们灵力相关的知识理论，能够更好的运用于舰队战斗之中。§!"
 th_ag_interaction_trait_Illustelia_sci: "§P灵力理论接口§!"
 th_ag_interaction_trait_Illustelia_sci_desc: "§P幻星一号，这位来自古代文明的先进人工智能，已经学习了我们灵力相关的知识理论，能够更好的运用于科研与行政管理。§!"
 th_ag_interaction_trait_Aurora_gov: "§P灵力理论接口§!"
 th_ag_interaction_trait_Aurora_gov_desc: "§P曙光之星，这位来自古代文明的先进人工智能，已经学习了我们灵力相关的知识理论，能够更好的运用于舰队战斗与行政管理之中。§!"
