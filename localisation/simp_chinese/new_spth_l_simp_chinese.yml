 spth_story_disapper_barrier_desc: "博丽大结界变得稀薄后与外界融合的幻想乡，科学世纪之后的太空时代与幻想乡的灵力相结合，迸发出了无限的可能。"
 START_SCREEN_SPTH_STORY_DISAPPER_BARRIER: "梦幻的科学世纪结束之后的某段时间，在某股未知力量灵力的影响下，博丽大结界逐渐消逝了，进而导致外界与幻想乡发生了融合。在太空时代科技力量和幻想力量的结合下，这个新生的文明在其母星系的恒星上建立了第一个大型空间站，正式迈入了浩瀚的银河深空..."
 spth_story_worse_env: "§U糟糕的环境§!"
 spth_story_worse_env_desc: "环太平洋垃圾袋、欧洲辐射带、雪山垃圾山、轨道碎片群...所有的这些都给新生的幻想乡人民带来了挑战。"
