 spth_story_crisis_dreadnought_computer: "§B异界作战电脑 - 星辰守秘人§!"
 spth_story_crisis_dreadnought_computer_DESC: "来自异界的敌人所使用的星区指挥作战电脑，其中似乎逸散着§R原初混沌§!的力量。"
 spth_story_crisis_dreadnought_computer_effect: "装配于不同舰船时有不同的效果。\n$spth_story_crisis_dreadnought_computer_command$\n$spth_story_crisis_dreadnought_computer_dreadought$\n携带该作战电脑的舰船将获得跨星系炮火支援引导信标。"
 spth_story_crisis_dreadnought_computer_command: "星区指挥舰 | §R生与死的境界§!\n能够有效提升己方舰船的防御与输出。\n所在舰队领袖死亡后，将会直接复活并且自动上岗，并在180£time£内提升所在舰队能量爆破与动能伤害+100%。"
 spth_story_crisis_dreadnought_computer_dreadought: "其他舰船 | §G人与妖的境界§!\n某些情况下能够有效提升己方舰船的防御与输出，且每次进入战斗时会获得+100%的能量爆破与动能伤害增益，持续120£time£且可以叠加"
