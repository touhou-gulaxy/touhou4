 spth_precursor.makai: "魔界"
 spth_precursor.lunar: "净土龙宫城"
 spth_precursor.shinki: "神绮"
 touhou_makai_chain_title: "§B被隐藏的历史——$spth_precursor.makai$§!"
 touhou_makai_chain_desc: "我们居然发现了星际间来自$spth_precursor.makai$的一些痕迹与文物。这个“$spth_precursor.makai$”虽然很多方面与我们的魔界比较相像，但是本质却大不相同。我们的$spth_precursor.makai$被结界封锁，还有很重的瘴气和妖气，几乎不适合任何生物生存，轻易无法进入；然而这个“$spth_precursor.makai$”势力拥有高度发达的魔法和文明，并且似乎相当的宜居。\n\n如果我们能从他们的文明遗迹中找到足够的信息，那么我们也许能精确定位他们母恒星系的位置。"
 touhou_makai_artifacts: "已发现的$spth_precursor.makai$线索"
 touhou_lunar_title: "§B被隐藏的历史——$spth_precursor.lunar$§!"
 touhou_lunar_desc: "我们的科研船在探索时发现了一些疑似月都风格的建筑，而在我们的认知中，月都应该已经灭亡了才对。但是更多的资料表明，他们似乎不再认同自己作为月人和月之都文明的身份，并且很多方面已经彻底改变了——比如他们现在自称为“$spth_precursor.lunar$”。\n\n如果我们能从他们的文明遗迹中发掘出足够的线索，那么我们也许能了解详细的历史，从中获取有用的知识。"
 touhou_lunar_artifacts: "已发现的$spth_precursor.lunar$线索"

 spth_precursor.continue: "继续"
 spth_precursor.research: "进行研究"
 spth_precursor.interest: "真是有趣。"
 touhou_makai_chain_poi.1: "$spth_precursor.makai$前哨站"
 touhou_makai_chain_poi.1.desc: "这里是神秘文明$spth_precursor.makai$的一处前哨站，这个文明起源于§M$spth_precursor.shinki$§!创造的另一个世界。科学家们认为可以利用前哨站中的设备创建一个可以锚定于$spth_precursor.makai$的时空裂口，以此来继续探索。"
 spth_precursor.100.name: "$spth_precursor.makai$"
 spth_precursor.100.desc: "我们在§Y[From.GetName]§!发现了一些具有魔力的遗物与残破建筑，并且该文明语言与我们的语言几乎完全一致。根据研究可知，这里居然属于一个自称为“$spth_precursor.makai$”的文明，并且与我们一样拥有着强大的魔法与灵力。据了解这个文明时常呆在由他们文明中一位强大的实体“§M$spth_precursor.shinki$§!”所创造的另一个世界中，而这里似乎是他们的一处前哨站。\n\n由于$spth_precursor.makai$与我们并不存在于一个现实，我们需要借助这颗星球上的一个特殊装置来打开一个空间裂口，通过这个通道进行探索。由于这个星系的现实结构较为特殊，预计我们的科研团队在数个月内就能打开裂隙。"
 spth_precursor.100.a: "继续。"
 spth_precursor.100.b: "惊了。"
 touhou_makai_chain_poi.2: "$spth_precursor.makai$裂隙"
 touhou_makai_chain_poi.2.desc: "利用前哨站设备与大量灵力制造出来的时空裂口，其只能锚定于$spth_precursor.makai$世界中的一小部分区域，但这是我们探索另一个世界的第一步，随着后续的进展一定可以进行更大规模的行动。"
 spth_precursor.101.name: "§Y[From.GetName]§!$spth_precursor.makai$裂隙"
 spth_precursor.101.desc: "研究团队们完成了对§Y[From.GetName]§!上遗物与设备的解析，通过合理的操纵与灵力灌输，我们成功的在§Y[From.GetName]§!之上打开了一道裂隙。一道空间的裂口展开于星球之上，我们感受到了充沛的灵力，看起来对面会非常的适合我们行动。接下来只需要派遣科学团队进入探索就可以了。\n\n由于资料不足，这个通往异世界的时空的裂隙只能锚定于$spth_precursor.makai$世界中的一小部分区域。我们相信随着对$spth_precursor.makai$秘密的发掘，可以逐步开始对$spth_precursor.makai$的更大范围的探索。"
 spth_precursor.101.a: "OK"
 spth_project_precursor_makai_locate: "$spth_precursor.makai$信息分析"
 spth_project_precursor_makai_locate_desc: "对我们收集到的$spth_precursor.makai$相关信息进行分析，力图定位更多的$spth_precursor.makai$遗迹。"
 tech_spth_precursor_makai_locate: "§M灵力信号分析§!"
 tech_spth_precursor_makai_locate_desc: "利用$spth_precursor.makai$特殊的灵力信号，对$spth_precursor.makai$遗迹进行定位。"
 unlock_spth_precursor_makai_locate: "解锁特性: $spth_precursor.makai$遗迹定位"
 unlock_spth_precursor_makai_locate_desc: "$tech_spth_precursor_makai_locate_desc$"
 spth_precursor_makai_locate_action: "$spth_precursor.makai$遗迹定位"
 spth_precursor_makai_locate_action_desc: "$tech_spth_precursor_makai_locate_desc$"
 spth_precursor_makai_locate_action_always_no: "还没有写完文案 所以暂时不给玩"
 spth_precursor_makai_locate_action_fail: "哦豁，好像没有更多的了..."
 spth_precursor_makai_locate_action_cooldown: "$spth_precursor.makai$遗迹定位冷却"
 spth_precursor_makai_locate_action_cooldown_desc: "我们必须过一段时间才能启动设备进行定位。"
 spth_precursor_makai_locate_capital_action: "§M定位：$spth_precursor.makai$母星系§!"
 spth_precursor_makai_locate_capital_action_desc: "我们已经收集了足够多了资料，可以对$spth_precursor.makai$的母星系进行定位了。"
 spth_precursor.102.name: "§M研究成果§!"
 spth_precursor.102.desc: "经过了一段时间的分析，我们的研究人员确定了$spth_precursor.makai$相关设施特有的灵力特征，并且基于此开发出了一套设备用于定位。\n\n(研究完科技后可以在文物行动里进行定位)"
 spth_precursor.102.a: "OK"
 spth_precursor.103.name: "§M异常信号§!"
 spth_precursor.103.desc: "我们在[From.GetName]上检测到了异常信号，这里或许存在着一处$spth_precursor.makai$的遗迹。\n\n初步研究表明当地存在着一片与众不同的结界，我们应该派遣科研人员进行调查。"
 spth_precursor.103.a: "真是有趣"
 spth_project_precursor_makai_arc_1: "§M$spth_precursor.makai$结界§!"
 spth_project_precursor_makai_arc_1_desc: "$spth_precursor.103.desc$"
 spth_precursor.104.name: "§M$spth_precursor.makai$研究基地§!"
 spth_precursor.104.desc: "我们的科研人员成功解除了笼罩着这里的结界，探测与先前发掘出的资料表明这里是$spth_precursor.makai$在现实中建立的一处研究基地，如果我们对这里进行调查或许可以发现$spth_precursor.makai$相关的知识。"
 spth_precursor.104.poi_desc: "笼罩在这里的奇异结界下是$spth_precursor.makai$在这里建立的一处研究基地，这里或许埋藏着什么关键信息。"
 spth_precursor.104.a: "进行调查吧。"
 site_spth_precursor_makai_base: "§M$spth_precursor.makai$研究基地§!"
 site_spth_precursor_makai_base_intro: "我们定位到这里存在着一定的异常灵力环境。探测与先前发掘出的资料表明这里是$spth_precursor.makai$在现实中建立的一处研究基地，如果我们对这里进行调查或许可以发现$spth_precursor.makai$相关的知识。"
 site_spth_precursor_makai_wedge: "§M人造结构§!"
 site_spth_precursor_makai_wedge_intro: "一座被称为“主楔”的残破结构，其已经失去了能源供应。\n我们可以派遣科研团队对其进行探索，以期找到有关$spth_precursor.makai$如何消失的线索。"
 # 配置：
 # spth_precursor.[id].name: 事件标题
 # spth_precursor.[id].desc: 初始事件描述
 # spth_precursor.[id].poi_desc: poi描述
 # spth_precursor.[id].after_desc: 完成研究项目后的描述
 # spth_project_precursor_[id]: 研究项目，需要配置
 # spth_project_precursor_[id]_desc: 研究项目，需要配置
 spth_precursor.105.name: "§M废弃的殖民地§!"
 spth_precursor.105.desc: "郁郁葱葱的森林星球[From.GetName]曾经是$spth_precursor.makai$在我们宇宙中的一处殖民地，但是由于未知原因废弃了。曾经或许繁荣的城市如今只剩一片断壁残垣，由于这里的灵力环境，动植物难以再此生存，因此出现了废墟外遍布植被而内部只有建筑残骸的奇景。星球表面似乎有着轨道轰炸的痕迹，我们难以想象这里发生过什么。\n\n研究人员认为研究这个被废弃的殖民地可以让我们获得更多$spth_precursor.makai$的资料与线索。"
 spth_precursor.105.poi_desc: "这里曾经是魔界在我们宇宙中的一处殖民地，但是遭到了废弃。星球表面似乎有着轨道轰炸的痕迹，我们难以想象这里发生过什么。"
 spth_precursor.105.after_desc: "我们的研究人员还原出了事件的真相：\n\n魔界曾经在这里进行了某种实验，但是一次意外引发了某种事故，迫使$spth_precursor.makai$政府不得不放弃这颗星球，并且对其进行了轨道轰炸。\n不过好在一些数据记录依旧完好，我们可以对$spth_precursor.makai$的相关信息开展进一步的研究。"
 spth_project_precursor_105: "探索：$spth_precursor.makai$殖民地"
 spth_project_precursor_105_desc: "这颗星球曾经是$spth_precursor.makai$在我们宇宙中的一处殖民地，但是遭到了废弃，我们需要调查这一切背后的原因。\n对这个星球进行探索可以让我们获得有关$spth_precursor.makai$的更多线索。"
 spth_precursor.106.name: "§M奇特的空间站§!"
 spth_precursor.106.desc: "[From.GetName]的地表上有一座坠毁的空间站，据信它曾经是$spth_precursor.makai$的一处星球轨道空间站。\n探测器发现了奇异的一幕：残破的船体在进行着相位转移，时而出现于我们的位面，时而消失隐于另一个位面。\n\n我们的科学家猜测它应该在[From.GetName]与$spth_precursor.makai$的某个锚点之间进行着相位转移，或许可以尝试进行现实稳定停止相位转移现象。他们认为研究这座空间站可以让我们获得更多$spth_precursor.makai$的资料与线索。"
 spth_precursor.106.poi_desc: "一座不断的进行着相位转移的坠毁空间站，我们的科学家推测它应该在[From.GetName]与$spth_precursor.makai$的某个锚点之间进行着相位转移。"
 spth_precursor.106.after_desc: "我们的科学家提出了一种可以稳定[From.GetName]相位的方式——可将星球的粒子场锁定在一个正常状态，阻止其在两个维度之间旋转。\n一道足够调谐的能源成功的将星球上的$spth_precursor.makai$空间站固定于我们的位面较长时间。\n\n因而我们得以下载了大部分的舰载数据库，但由于随后相位的不稳定，推测很快这座空间站将会彻底沉入魔界位面之中。好在我们拿到的信息足够进行更多的分析了。"
 spth_project_precursor_106: "探索：$spth_precursor.makai$空间站"
 spth_project_precursor_106_desc: "一座不断的进行着相位转移的坠毁$spth_precursor.makai$空间站。"
 spth_precursor.107.name: "§M古船残骸§!"
 spth_precursor.107.desc: "我们根据信号定位到了[From.GetName]，我们派出的无人机调查显示这颗星球上似乎存在着一个神秘的古船残骸。在其周围还散落着一些似乎是其他文明舰船的残骸。看起来是这里曾经爆发了一场恶战，使得这艘古代战舰不幸战沉。\n\n研究人员认为研究这个$spth_precursor.makai$古船残骸可以让我们获得更多魔界的资料与线索。但是由于未知原因产生的异常环境影响，探索行动可能会异常的危险。"
 spth_precursor.107.poi_desc: "一艘$spth_precursor.makai$战舰在与未知文明的战斗中坠毁，其残骸静静的躺在星球之上。"
 spth_precursor.107.after_desc: "我们的科考队员进行了大胆的登舰探索行动。虽然遭遇了空间异常造成了数人伤亡，但是他们成功通过关闭舰载反应堆消除了异常环境影响。\n根据对抢救出的数据的解码分析，这艘战舰是$spth_precursor.makai$当时正在开发的“楔”计划中的实验性战舰，在与一支自称“■间之里”势力的舰队的战斗中遭受重创而坠毁，由于被称作“副楔”的实验性装置严重异常导致这里空间扭曲现象的出现。\n\n在获得了更多数据之后或许我们可以尝试对这艘战舰进行修复工作。"
 spth_project_precursor_107: "探索：$spth_precursor.makai$战舰残骸"
 spth_project_precursor_107_desc: "一艘神秘的$spth_precursor.makai$战舰，周围充斥着奇特的空间异常。"
 spth_precursor_107_finish_effect: "获得§M古代$spth_precursor.makai$舰船核心§!。"
 spth_precursor.108.name: "§M灵力信号§!"
 spth_precursor.108.desc: "科考队员设法抵达了一股灵力信号的来源——深藏于[From.GetName]的地面之下。\n\n刚刚开始不久的遗址发掘工作，就已经表明这似乎是某种研发设施。这个地方到处都是多种科学设备原型。扫描发现在其下还有一个巨大空洞，似乎有着令人难以置信的大小，发掘工作正在进行当中。"
 spth_precursor.108.poi_desc: "一股神秘的灵力信号引导我们来到了这里，似乎$spth_precursor.makai$在此进行了某种重要实验。"
 spth_precursor.108.after_desc: "经过发掘工作，科学家们发现了一件古怪的事情——地下空间在表面上看非常巨大，然而进入后却发现非常狭小，与封闭时期的幻想乡大小相似。同时根据物理学家的测定——这里似乎是某种极度违反物理定律的空间——二又二分之一次元。\n\n地上对于实验记录的解读说明，这里也是“楔”计划的实验设施，似乎是在研究某种可以连接多种次元的装置。\n\n所以，这个“楔”到底是什么？"
 spth_project_precursor_108: "探索：$spth_precursor.makai$研发设施"
 spth_project_precursor_108_desc: "似乎是$spth_precursor.makai$的某种研发设施，且其下存在着一片难以想象的巨大空间。"
 spth_precursor.109.name: "§M恒星异象§!"
 spth_precursor.109.desc: "在天文部门对哨站收集的数据进行监视观测时，他们发现[From.Solar_System.GetName]恒星系的恒星上发生了某种异象：整颗恒星突然间熄灭了。\n\n但当调查团队赶赴现场时，他们目击观测到这颗恒星一切正常，但诡异的是传感器却检测不到任何的辐射、聚变反应等能说明这颗恒星存在的证据，且通讯装置也受到了一定程度的干扰。\n\n进行排查后发现了一种可能的干扰源——[From.GetName]，由于此前收集到的$spth_precursor.makai$星图上将这里标注为“高度保密”，科学团队建议我们对这个行星进行调查。"
 spth_precursor.109.poi_desc: "一处传感器与通讯系统运作受到了神秘干扰的星系。"
 spth_precursor.109.after_desc: "我们的科学家得到了结论——一个能干扰传感器与通讯系统运作的奇特装置，使仪器设备经常发生故障。根据其上至少是数万年前的影像记录显示，这里用于$spth_precursor.makai$测试一个被称为“副楔”的设备，其与“主楔”一起可以产生某种足以影响多个位面的作用。不过我们目前不知道这个所谓的“副楔”与“主楔”到底是什么，或许还需要进一步的调查。\n\n不过可以确认的是这里的位面相对的没有那么稳定？或许这才是所谓的“楔”的真正作用，对于设备的干扰只不过是副作用。"
 spth_project_precursor_109: "探索：$spth_precursor.makai$干扰源"
 spth_project_precursor_109_desc: "这个星系的恒星似乎出现了异常，但是在调查团队赶赴现场后发现是某种神秘的干扰源。"
 spth_precursor.110.name: "§M遥远回响§!"
 spth_precursor.110.desc: "根据一些报告指出，[From.GetName]上出现了时空紊乱的现象。一些似乎不属于这里的场景在此上演，而场景中的那些建筑等具有强烈的$spth_precursor.makai$风格。鉴于我们只能进行观测而无法产生实际影响，研究团队推测可能是某种回响现象，但是具体原因不明。\n\n这大概是对魔界进行研究的一次很好的机会？"
 spth_precursor.110.poi_desc: "来自过去的遥远回响出现于我们的一颗星球之上。"
 spth_precursor.110.after_desc: "这里曾经是$spth_precursor.makai$的一处核心殖民地。\n\n但是根据我们的了解，$spth_precursor.makai$应该主要存在于另一个位面，在我们这个位面基本上只有边境地区才有的设施。这一发现或许会改变我们对于$spth_precursor.makai$的认知，目前更多的资料尚在整理中。\n\n此外关于出现这一回响现象的原因已经得到了确认——某个远古文明的一次灵能武器试射产生的余波与这个星球上的灵力残留发生了一些未知反应，这才引发了这一切。"
 spth_project_precursor_110: "探索：$spth_precursor.makai$回响"
 spth_project_precursor_110_desc: "来自过去的遥远回响出现于我们的一颗星球之上。"
 # 裂隙
