 spth_precursor.215.name: "§H传入信号§!"
 spth_precursor.215.desc: "§R[This.GetName]§!，你们在干什么！\n\n……§H以太相引擎§!？你们怎么可以，随意的撕裂与虚境之间的屏障，既然你们执迷不悟，那我们只好动用武力了！\n我们会像当年消灭$spth_precursor.makai$的星界威胁一样，让你们从这个位面，彻底消失！。"
 spth_precursor.215.a: "老毕登，你早该滚回时间的洪流了！"
 spth_precursor.215.b: "关闭通讯。"
