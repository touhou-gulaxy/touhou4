 fxtz: "非想天则"
 fxtz_desc: "诹访子授意建造的巨型机器人，原本是招揽人气的吉祥物气球。全长109m重さ2t,比巨型战斗单元高到不知道哪里去了。"
 fairy_army: "妖精军团"
