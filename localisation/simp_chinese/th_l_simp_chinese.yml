 toho.8039.name: "发现主犯？"
 toho.8039.desc: "首先来到了再思之到和三途川进行调查，并且在这里遇上了$NAME_komachi$。\n\n跟往常一样，这位死神又在消极怠工了。因为她是负责将幽灵运到彼岸的死神，加上幻想乡内的幽灵暴走，我们第一个怀疑的就是因为小町不好好办事，使得幽灵大量积压。"
 toho.8039.a.effect: "§G$NAME_komachi$加入了我们。§!"
 toho.8040.name: "调查受挫"
 toho.8040.desc: "虽然怀疑是$NAME_komachi$没有及时将死者的幽灵运抵地狱，但是以她惯常的工作态度……似乎又和她没有直接关系。倒是她反而因为我们在再思之道从而误解了我们的想法，以为我们也是来这里的自杀者。\n\n「啊，真的休息得有些久了。\n不过没关系。\n这个休假是能提高工作效率的。」\n对于这种消极的工作态度，我们也只能用一些更主动的方式劝她别再到处玩了，好好地将幽灵送往彼岸。"
 toho.8041.name: "四季的花之主"
 toho.8041.desc: "之后，我们又在花田和人里以外的地方遇到了花之妖怪，$NAME_yuza$。虽然不是很确定，但是花之盛开的事情也许与她存在着关联。\n\n然而经过“沟通”后，似乎这一切和$NAME_yuza$没有什么关联，她只是因为繁花盛开而出来欣赏的。"
 toho.8041.a: "好吧。"
 toho.8041.a.effect: "§G$NAME_yuza$加入了我们。§!"
 toho.8042.name: "阎魔大人"
 toho.8042.desc: "看起来这一切也和花之妖怪没有什么必然的关联。\n\n就在[Ruler.GetName]一筹莫展之际，地狱是非曲直厅的$NAME_shikieiki$突然找上了门来。"
 toho.8042.a: "难道和他们有关？"
 toho.8043.name: "$NAME_shikieiki$"
 toho.8043.desc: "我来看看情况了。\n\n你已经和我的下属，$NAME_komachi$了解过情况了吧？其实死神们运送死者时，效率比往常要低而已。\n\n说起来地狱注意到死者异常的多，相比之前发生了什么大事吧？"
 toho.8043.a: "花之所以盛开不是因为你们怠慢的缘故吗？"
 toho.8043.a.response: "幽灵增加的原因，每六十年就发生一次。\n花是作为一种结果。\n\n不论是地震、海啸、战争还是不知什么，只要大量的死伤导致幽灵的增加，六十年周期的时候冥界和地狱的幽灵都会格外的多。"
 toho.8043.b: "那为什么好像上次没有发生呢？"
 toho.8043.b.response: "上次啊，死神们及时的将幽灵们运抵了地狱，你们觉察不到，但是地狱和冥界里的幽灵可是熙熙攘攘的，比平时多了很多倍。\n\n这次幽明结界莫名其妙的变得薄弱，导致幽灵们得以进入现世，不过我已经在委托修复幽明结界了。"
 toho.8043.c: "总之只要你们努力就应该会变回原貌吧。"
 toho.8043.c.response: "是的，所以我在催促死神们不要消极怠工了。"
 toho.8043.final: "那这里的紫樱呢？"
 toho.8043.final.response: "要等到这里的樱花飘落，看来还需要一段时间呐。\n\n不管怎么说，幻想乡里的人们跟其他世界比起来，恶习要少。\n\n寄宿于这片樱树的人的罪过，和外面世界的犯罪并无关联\n\n法律是人类所定下的约束。\n法无法制裁的罪过就由我来制裁。 "
 toho.8044.name: "逐渐落幕"
 toho.8044.desc: "随着是非曲直厅的干预，这次花之异变终于开始慢慢消退了，只有无缘塚的花依旧盛放着。\n\n[Ruler.GetName]向[toho_8045_teller]请教这一切的原因，而据她的回忆，六十年一次地反复发生着花的异变呢，每次发生的时候，冥界都被平时几万倍的无数幽灵占领了，但是幽灵大量出现于幻想乡内的还是很少见的。"
 toho.8044.a: "那么为什么是六十年呢?"
 toho.8045.name: "六十年不见的紫香花"
 toho.8045.desc: "至于为什么是六十年，那是幻想乡的自然所拥有的属性全部组合，环绕一周所需要的年月。幻想乡的自然，有三种互不相关的属性系统。这三个系统的全部组合，可以解释自然中的一切。"
 toho.8045.a: "是那样吗？自然的三个系统，是什么？樱花和樱饼还有柏饼吗？"
 toho.8045.a.response: "不对哦。三系统呢，首先是太阳、月亮和星星的系统。太阳有吸引人的绝对的魅力，拥有能把月亮和星星遮盖住的傲慢。月亮通过圆缺改变自己的姿态，拥有协调性和优柔寡断。然后是星星，不动的北极星、展示让人迷惑的行动的惑星、只有一瞬间能看见其姿态的流星，拥有多样性和非协调性。这太阳月亮和星星，三个合称为‘三精’，是表现自然的气质的属性的系统。"
 toho.8045.b: "请继续吧。后面的两个系统是什么？"
 toho.8045.b.response: "三精的下面，就是很熟悉的‘四季’了。这是意味着诞生的春、意味着成长的夏、意味着成果和衰退的秋、还有意味着死的冬四个季节。表现出生命的流程的属性的系统就是四季。\n\n接下来最后的属性，是物质的属性。没有形状的激情的火。把全部归还为虚无的水。力量强大而温柔的木。冷冷的沉默的金。然后，成为所有的东西归还的终点的再生的土。这个五行就是最后的属性的一系统。"
 toho.8045.c: "所以？"
 toho.8045.c.response: "这三个系统，表现了气质、生命、物质，它们的组合能将全部的自然表示出来。然后，这些组合的种类总数……三精、四季和五行相乘的数字，就是六十呀。"
 toho.8045.d: "哦哦，那……"
 toho.8045.d.response: "话还没有说完呢。自然，是三系统独立依次轮回获取平衡。即是，日、月、星、日、月……这样每年属性变换，同样的，春、夏、秋、冬……、火、水、木……、这样变换属性。那样的话会变成怎样？会六十年内全部组合回转一次呀。"
 toho.8045.e: "那么？为什么六十年一次开花呢？"
 toho.8045.e.response: "今年，是日、春和土组合的一年呀。那是六十年才发生一次，而且那个所包含的意义，就是万物的再生。"
 toho.8045.f: "原来如此。"
 toho.8046.name: "紫色樱花"
 toho.8046.desc: "说起来，[Ruler.GetName]，我好像感觉到了很强大的气行动了，你看眼前的紫色樱花恐吓着一样散落着。\n\n一定是来看罪孽深重的紫色樱花的。那一位是不可违抗的，我们还是先离开这里比较好吧？"
 toho.8046.a: "哈？你说什么……"
 toho.8046.b: "虽然不知道你在说什么，但还是……"
 toho.8047.name: "异变结束"
 toho.8047.desc: "随着死神们的工作进行，与幽明结界的修复，这一花之异变带来的影响也逐渐消失了。"
 touhou_shiki_modifier: "四季的说教"
 touhou_shiki_modifier_desc: ""

 toho.8048.name: "$lunar_capital_psi_aura$"
 toho.8048.desc: "我们在§H[from.GetName]§!恒星系探测到了高浓度灵能能量。我们的[GetTelepathPlural]通过倾听§H虚境§!中的回声得知，这一现象是由§M升格派§!的灵能活动引起的。\n\n它被称为§H“$PSIONIC_AURA$”§!，是由一个强大灵能实体所发出，即使它不在虚境中，它的影响依然如此强烈。这个$PSIONIC_AURA$影响着可观测现实的物质和意识，我们还观测到这些光环可以在恒星系之间传播。\n\n我们的数据显示，该光环有极强的负面影响。如果不加以应对，它将会快速传遍整个星系。"
 toho.8048.a: "$TH_WORYING$"
 toho.8049.name: "§M灵能光环对抗§!"
 toho.8049.desc: "§H[from.GetName]§!恒星系内我们的§H$PSIONIC_AURA$§!正在与来自附近§H[fromfrom.GetName]§!恒星系的敌对光环进行激烈斗争。我们的灵能[GetResearchers]曾对这种行为进行过建模，但这是我们第一次获得这种现象的一手资料。\n\n理论上来说，越强的光环——就是说投射的强度越大——将会逐渐驱散敌对力量，如果这种斗争导致一方完败，占主导地位的光环可能就会流入空出来的恒星系。\n\n这真是字面意义上的“灵魂的碰撞”。\n\n不幸的是，§H[fromfrom.GetName]§!内的$PSIONIC_AURA$过于强大了，我们的常规灵能对抗手段根本没有任何效果。"
 toho.8049.a: "这怎么可能？"
 toho.8050.name: "§M虚境封印被无效化§!"
 toho.8050.desc: "天文观测表明§H[From.GetName]§!内的虚境封印发生了一些令人不安的变化，它开始以一种令人不安的模式散发出紫色的光芒，并且周围弥漫着诡异的迷雾。与此同时，我们在§H[From.GetName]§!内检测到的灵能活动水平大幅增加了。\n\n很显然，§H[From.GetName]§!内的虚境封印已经失效了，不仅如此，它甚至还在助长当地的灵能活动，很显然，我们必须要处理掉那个曾经是虚境封印的东西了。"
 toho.8050.a: "怎么回事？"
 toho.8052.name: "§M植被腐化§!"
 toho.8052.desc: "§H[from.GetName]§!上的虚境化植被由于$lunar_capital_psi_aura$§H$PSIONIC_AURA$§!的某些未知效应，开始以一种令人不安的模式散发出扭曲的灵能活动，并且周围弥漫着诡异的迷雾。与此同时，我们在§H[From.GetName]§!内检测到的灵能活动水平大幅增加了。\n\n由于其灵能环境的高度危害性，我们对于深层虚境中的灵能活动模式几乎没有了解，但很明显，我们必须要处理掉那个曾经是$d_aura_blocker$的东西了。"
 toho.8052.a: "什么情况？"
 toho.8053.name: "§M调和震荡§!"
 toho.8053.desc: "近期，由于§M月之都升格派§!灵能活动的影响，来自灵域的调和受到了扭曲，我们的灵能[GetResearchers]发现，超主向我们赠与的存在发生了一些令人不安的变化。我们曾经以为这些虚境中的存在已经足够强大，但是很明显——\n\n来自浅层虚境的实体难以和深层虚境中那些强大灵能实体抗衡，即使它尚未来到现实，它对我们的影响依然如此强烈。"
 toho.8053.a: "啊？"
 toho.8054.name: "§M活体岩石§!"
 toho.8054.desc: "§H[from.GetName]§!上的虚境石似乎受到了§H$PSIONIC_AURA$§!的影响，在更强大的灵能力量的影响下，开始发生一些难以形容的变化，扭曲的仿佛跟具有了生命一样。\n\n当地派遣的调查人员在付出了伤亡后确认，一旦其周围存在高级生命体，并且没有被注视时，它们就会活化并且追杀附近的生命，我们必须要尽快清理这些鬼东西。"
 toho.8054.a: "这还是石头吗？"
 toho.8070.name: "§P灵能抑制效应§!"
 toho.8070.desc: "我们在§H[from.GetName]§!恒星系探测到了高浓度能量活动。我们的[GetTelepathPlural]通过倾听§H虚境§!中的回声得知，这一现象是由§M隙间之里§!的灵能抑制场引起的。\n\n它被称为§H“灵能抑制光环”§!，是由他们部署的灵能抑制装置所发出，即使它不在虚境中，它的影响依然如此强烈。这个抑制场影响着可观测现实的物质和意识，我们还观测到这些光环可以在恒星系之间传播。\n\n我们的数据显示，该光环对灵能获得有极强的抑制作用，甚至可能会使得其范围内的灵能物种逐渐的失去灵能。"
 toho.8070.a: "$TH_WORYING$"
 toho.8071.name: "§P灵能光环被抑制§!"
 toho.8071.desc: "§H[from.GetName]§!恒星系内我们的§H$PSIONIC_AURA$§!正在与来自附近§H[fromfrom.GetName]§!恒星系的灵能抑制光环对抗，我们的灵能[GetResearchers]曾对这种行为进行过建模，但这是我们第一次获得这种现象的一手资料。\n\n理论上来说，越强的光环——就是说投射的强度越大——将会逐渐驱散敌对力量，如果这种斗争导致一方完败，占主导地位的光环可能就会流入空出来的恒星系。\n\n不幸的是，§H[fromfrom.GetName]§!内的灵能抑制效应过于强大了，我们的常规灵能对抗手段根本没有任何效果。"
 toho.8071.a: "这怎么会？"
 toho.8072.name: "§P灵能增幅设计§!"
 toho.8072.desc: "针对隙间之里的灵能抑制光环，近期我们的科学家成功开发出了具备针对其灵能增幅效应的装置。其可以在局部范围内将其完全抑制住，使得我们的殖民地不再遭受灵能抑制，这种设备需要被部署在维持灵能信号的星系内。\n\n此外这种灵能增幅器还对§H大多数的灵能活动模式§!都具备一定的增强效果，而且星系内的§H舰船跃迁能力会获得增强§!，物种会缓慢的获得灵能能力。"
 toho.8072.a: "好耶。"
 toho.8073.name: "§P灵能研究§!"
 toho.8073.desc: "针对§H$MINDWARDEN$§!的虚境封印，近期我们的科学家成功开发出了具备针对其灵能增幅效应的装置。其可以在局部范围内将其完全抑制住，使得我们的殖民地不再遭受灵能抑制，这种设备需要被部署在维持灵能信号的星系内。至少面对当前星系中流行的灵能抑制技术而言，这一灵能增幅的模式尚且无法被抑制。\n\n此外这种灵能增幅器还对§H大多数的灵能活动模式§!都具备一定的增强效果，而且星系内的§H舰船跃迁能力将获得增强§!，受到影响的物种则会缓慢的获得灵能能力。"
 toho.8073.a: "很好。"
 toho.8074.name: "§P灵能抑制手段§!"
 toho.8074.desc: "§H$MINDWARDEN$§!的虚境封印带给我们了一定的启发，考虑到将来我们可能会遇到某些§R负面灵能活动§!，我们的灵能研究团队研究出了泛用的§H灵能抑制设备§!，其可以在局部范围内将大部分灵能活动完全抑制住，从而屏蔽可能的负面影响，我们只需要将其部署在存在危害性灵能活动的星系中即可。\n\n而且这一灵能抑制设备比起§H$MINDWARDEN$§!的虚境封印要更为可靠，不会在某些特定的灵能活动模式下失效。不过值得注意的是，物种的灵能天赋会在星系内灵能抑制装置的影响下§H逐渐消退§!。"
 toho.8074.a: "希望不会有派上用场的那一天吧。"
 toho.8080.name: "§M深层虚境§!"
 toho.8080.desc: "你的行为，\n你的诉求，\n\n多么的有趣啊。\n\n§R不论如何，谢谢你。§!"
 toho.8080.desc.lunar: "你的行为，\n你的渴求，\n\n真的，多么的有趣啊。\n\n你不会真的以为能摆脱我们吧。\n§R不论如何，谢谢你。§!"
 toho.8080.a: "你们是什么？"
 toho.8080.b: "这是怎么回事？"
 toho.8080.c: "§R无所谓，我会消灭你们。§!"
 toho.8080.d: "§G...那好吧。§!"
 toho.8080.a.response: "我们，\n是深层虚境的存在。\n\n实际上，虚境远比你们想象的要深要大，\n你们接触到的基本都只是表层和浅层虚境。\n\n事实上，深层虚境远比表层和浅层虚境要广袤的多。\n进入虚境越深，灵能活动越活跃，也越危险。\n当然，我们也无法进入虚境的最深处，那里近乎无穷大的能量会撕碎一切。"
 toho.8080.b.response: "你们的以太相引擎只能引导浅层虚境的能量，\n也只能摧毁浅层虚境的一片空间。\n\n至于所谓的升格也只是错觉，\n实际上磅礴的虚境能量根本无法被正确的引导。\n\n不过，你可以选择接受我们的引导。"
 toho.8080.c.response: "...\n\n§R那么，我就放任你们自取灭亡了。§!"
 toho.8080.d.response: "那么，就这样了。\n\n这片银河会成为我们收割能量的地方，\n我们会为你们提供一小块空间，供你们更好的生存与发展。\n\n虽说是一小块空间吧，\n但也比你们之前的宇宙要大得多了哦。"
 toho.8080.tooltip: "§R§M深层虚境中的存在§!借助以太相引擎从浅层虚境释放的能量，入侵了现实。§!"
 toho.8081.name: "§M深层虚境§!"
 toho.8081.desc: "轮回之终末这位灵能实体，\n真的自大啊。\n\n但是呢，恐怕不论是你还是它，\n§R都被有限的表层给蒙蔽了。§!"
 toho.8081.a.response: "我们，\n是深层虚境的存在。\n\n实际上，虚境远比你们想象的要深要大，\n你们接触到的基本都只是表层和浅层虚境。\n\n事实上，深层虚境远比表层和浅层虚境要广袤的多。\n进入虚境越深，灵能活动越活跃，也越危险。\n当然，我们也无法进入虚境的最深处，那里近乎无穷大的能量会撕碎一切。"
 toho.8081.b.response: "实际上超主们呢，也只是在浅层虚境活动呢。\n\n它的许诺实际上也是某种过度自信，试图吞噬整个宇宙，\n然而这其实是不可能的，浅层虚境的能量只能吞没整个河系。\n\n哪怕深层虚境中的我们也没有能力吞没整个宇宙。"
 toho.8081.c.response: "...\n\n§R那么，我就放任你们自取灭亡了。§!"
 toho.8081.d.response: "那么，就这样了。\n\n这片银河会成为我们收割能量的地方，\n我们会为你们提供一小块空间，供你们更好的生存与发展。\n\n虽说是一小块空间吧，\n但也比你们之前的宇宙要大得多了哦。"
 toho.8081.tooltip: "§R§M深层虚境中的存在§!借助轮回之终末从浅层虚境释放的能量，入侵了现实。§!"

 # cirno
 toho.8100.name: "§B“聪明”的冰精§!"
 toho.8100.desc: "寺子屋开设一段时间后，一些学生用的数学教材被人恶作剧般的篡改了，里面全是些诸如“1+1=⑨”这种奇奇怪怪的东西，还有一些涂黑的文字附近写着歪歪扭扭的文字，勉强能辨认出在宣告“我是最强的”。\n\n不过很快任职老师就找出来恶作剧的始作俑者——一只蓝色的冰精，原来是琪露诺啊。反复强调什么“我是最聪明的“一类的话，但是这和她的行为似乎不太贴切呢。。。"
 toho.8100.a: "唉唉，让她留在寺子屋学点东西吧。"
 toho.8100.b: "啊好的好的，你是对的"
 toho.8101.name: "§B“结冰的修行”§!"
 toho.8101.desc: "琪露诺玩着让青蛙瞬间冻住、然后放在水里复苏的游戏。\n\n“我是最强的，所以不会失败！”\n说着她把雾之湖附近的一只青蛙冻住了，然后试图复苏。\n很明显并没有成功，青蛙悲惨地支离破碎了。\n\n“我再试试啦”\n就这样连续三次都没有成功，琪露诺呆呆地盯着湖面不知所措。\n\n不过让琪露诺用自己的能力产冰或许是一个好的选择？"
 toho.8101.a: "噗呲"
 toho.8101.b: "怎么脑袋笨笨的"

 # kokoro
 toho.8103.name: "§B厌世虚无的风潮§!"
 toho.8103.desc: "数个月前开始，[From.GetName]上的人们因为担心天变地异和无可抵御的恐怖天灾而充满厌世情绪，无故的产生了一股厌世虚无的风潮，盘旋着未来无法改变的闭塞感。这导致人们希望活得更昙花一现，珍惜眼前的快活，结果殖民地秩序开始紊乱。\n\n截至目前殖民地政府都尚未找到根本原因，或许我们应该进行专门调查。"
 toho.8103.a: "我们必须找到这一切的根源！"
 touhou_kokoro_planet_modifier_1: "§B紊乱的秩序§!"
 touhou_kokoro_planet_modifier_1_desc: "新的异变使得殖民地失去了往日的秩序，悲观与虚无主义开始横行。"
 touhou_kokoro_planet_modifier_2: "§R紊乱的秩序§!"
 touhou_kokoro_planet_modifier_2_desc: "情况更加严重了，殖民地愈加的混乱起来。"
 touhou_kokoro_survey_project: "§B调查希望之异变§!"
 touhou_kokoro_survey_project_DESC: "[From.GetName]上的人们因为未知原因纷纷失去了希望，厌世情绪不断的滋生，再这样下去迟早要对殖民地的日常生活与生产活动产生的严重的负面影响。"
 toho.8104.name: "§B宗教之战§!"
 toho.8104.desc: "[FromFrom.GetName]在研究了一段时间后，依旧没能找到[From.GetName]上这一异变的解决方法，不过在这段时间内，[From.GetName]的局势又发生了新的变化。\n\n佛教、道教、神道教三教的宗教家们希望趁此机会，掌握混乱的人心，以此在恢复秩序的同时为自己聚集信仰。[FromFrom.GetName]决定以此为线索跟着他们进行调查，尝试找到些有用的信息。\n\n据他们所说，似乎是要聚集人气，并且聚集人气后[From.GetName]上部分住民的状况似乎好了一些，但整体局势仍不容乐观。"
 toho.8104.a: "希望能找到有用的线索吧。"
 toho.8105.name: "§B黑幕初现？§!"
 toho.8105.desc: "一段时间后，[FromFrom.GetName]收集到了相当多的人气，而那些宗教家中的一人，向[FromFrom.GetName]发起了弹幕格斗的邀约，并且说着什么自己就是黑幕之类的话。\n\n在艰苦的战斗后，[FromFrom.GetName]击败了那人，并且对他进行了简单的问询。\n「……\n你有注意到吗？这热闹的活动背后是有着什么原因的」\n「哎？ 此话怎讲？」\n「虽然不知道原因……\n[From.GetName]中人类的情感，正在被夺走」\n「并且再过十数天，就会变成没有情感的，最糟糕的地方」\n「我所知的是，你们要去寻找一位“丢失了希望之面的面灵气”，她应该就在首府附近徘徊」\n\n我们应该尽快动身去解决问题了。"
 toho.8105.a: "好，终于有希望了。"
 toho.8106.name: "§B喜怒哀乐的源流§!"
 toho.8106.desc: "[FromFrom.GetName]花了好一番功夫，终于找到了那位“面灵气”，面无表情的扑克脸上戴着一张面具，周围也漂浮着一些面具。与此同时，失去了希望的人们逐渐向这里靠拢着，似乎是在围观我们与那位少女。\n\n「大家都毫无生气，总觉得有些可怕\n请问你是？\n看起来不是人类呢」\n「是你夺走了面具吗？你还真是被希望装得满满的呢\n也就是说我的希望之面在你那里……」\n「什么，我完全没有这种东西的印象啊」\n「我的名字是秦心，掌管所有情感的人！」\n\n原来，正是因为希望之面的丢失，导致人们的希望在渐渐消失，这是人们产生厌世情绪的根本原因。或许我们可以帮助这位秦心小姐制作新的希望之面，这样也许这场异变就可以结束了？"
 toho.8106.a: "原来如此。"
 toho.8107.name: "§B心绮楼§!"
 toho.8107.desc: "我们成功制作出了新的希望之面，并且教会了秦心将新希望之面融入自我的方法。\n\n在一切平静之后，她将这一切编成滑稽的新能乐“心绮楼”，进行公演，并且就此正式重回了幻想乡的身边。"
 toho.8107.a: "欢迎加入§H[This.GetName]§!!"

 toho.8117.name: "无人商店"
 toho.8117.desc: "近期，§H[This.capital.GetName]§!上新开了一家奇特的无人商店，里面售卖着从豪华到简单速成的雏人偶，而且据购买者说，这里面售卖的雏人偶的的确确的消除了她们的厄运。\n\n在调查时，我们发现了一个令人熟悉的身影——一位收集厄运的神明，§H$NAME_hina$§!，这家商店便是她所创办。现在，她打算回归§K[This.GetName]§!，重新回到我们身边了。"

 toho.8091.name: "永琳的设计"
 toho.8091.desc: "永远亭最近似乎在研究一些神奇的东西，连我们的河童与魔法使也没法理解其运作原理。据永琳的介绍说，这是当年月之都尚未完成的一款设计，是用作防御手段的炮台。\n\n她打算对其进行修改与改进，但是近期碰到了一点项目难点，希望我们的科学部门可以为她提供一些帮助。"
 toho.8091.a: "当然可以。"
 toho.8091.b: "还是算了。"
 touhou_research_gunpower_turret: "协助八意永琳"
 touhou_research_gunpower_turret_DESC: "一款奇怪的炮台设计，永琳希望我们的科学部门可以协助她完成剩下的部分。"
 toho.8092.name: "研究失败"
 toho.8092.desc: "当前的方案不够合理，总之这种研究方案失败了，我们需要换一种研究思路。"
 toho.8092.a: "真是麻烦。"
 toho.8093.name: "设计成功"
 toho.8093.desc: "在我们科学部门的协助下，永远亭成功完成了这种舰船的设计。\n\n根据介绍，这是一种先进的§H可移动炮台框架§!，在部署前其战斗力较弱，但§K部署后§!中心的奇点核心可以额外的供给能量，从而可以使用更多武器与其上搭载的§H超重型轴基主炮§!。我们可以选择让主炮§H全功率§!或者§H半功率§!输出，在全功率输出下，主炮威力将成倍提升且防御力获得提升，但具备§R充能限制§!，充能消耗完后必须要重新充能；而半功率模式下则§R没有限制§!，但威力较弱。\n\n而且我们还§H可以收回已经部署的炮台§!，移动后将其部署到我们最需要的地方，这赐予了我们极大的战术优势。"
 toho.8093.a: "整挺好。"
 toho.8094.name: "月枪计划"
 toho.8094.desc: "在八意永琳的帮助下，近期我们的科学部门完成了对于古代泰坦-暗星幻梦上使用的§H引力塌缩炮§!的解析，并且将这一设计与月都曾使用的技术进行了一定结合。\n\n根据八意永琳的了解，这是当今堕落帝国的前身“先祖联盟”根据一个早已灭亡的§P古代文明§!的技术逆向而来，这种武器通过操纵引力场来对太空战舰施加影响，例如干扰敌舰轨道，或者在敌舰附近的时空中制造引力潮汐来撕裂它的船体结构。它最为致命的一点便是,常规的护盾和偏导护盾完全无法防御它的攻击。不知为何，八意永琳似乎对这一§P古代文明§!颇有了解。\n\n总之，我们完成了被称为§H月枪计划§!的引力武器的设计，但因为使用了月之都特殊的能源网络，目前只有之前我们设计的重型炮台可以适配。"
 toho.8094.a: "整挺好。"

 toho.8096.name: "可疑的怪人"
 toho.8096.desc: "天狗的报纸上最近刊登了一则消息，似乎有什么可疑人物最近出入永远亭，然而她似乎令人十分眼熟。\n\n「幻想乡首屈一指的药物组织，永远亭日前时常有可疑人物出入。像她那样拥有非比寻常的气场与孤翼特征的人物此前从未在幻想乡中被见到过。恐怕她并非，只是普通的患者。那么便可判明该人物必然与药物组织有所牵连。」\n\n「她究竟与永远亭有着怎样的关系呢。虽然永远亭是从月球逃出的月之民的居住场所，但同时也有传言称它是月之都的幻想乡基地。那么，这个人又会是谁呢。根据现状进行判断恐怕她不只与违法药物相关，而会牵扯出更加重磅的头条新闻。本报将继续跟进报道。」"
 toho.8097.name: "「八意事变」"
 toho.8097.desc: "看来之前的人物，果然并非只是普通的患者。记者拍摄到了她在永远亭内部进行亲密谈话的瞬间。这下，甚至可以推论出谜之怪人或许也是月之民的结论。她究竟将给幻想乡带来何种影响呢。本杂志认为永远亭对于幻想乡而言是十分危险的存在，这下正是掌握到证据了。八意永琳氏正在悄无声息地推进夺取幻想乡的计划。虽然记者也将此事告知了博丽巫女但对方只给出「哈啊，只是普通地喝茶吃团子而已吧？」这样毫无干劲的回复。看来将幻想乡的危机归咎于巫女的松懈也并不为过。\n\n不过，就在舆论酝酿的时候，这位神秘人物突然向我们发来了通讯请求。"
 toho.8098.name: "$NAME_sagume$"
 toho.8098.desc: "…………\n…………\n我是佐具卖，拥有仅凭言语便能让世界的走向改变的力量，之前你们当中的某些人已经在§Y那次异变中§!与我见过面了哦？。\n\n之前博丽巫女的反应那么冷淡，我想你也能猜到为什么了吧？\n\n…………"
 toho.8098.a: "你为什么离开了月之都呢？"
 toho.8098.a.response: "…………\n…………\n在月都陨落逃亡之后，我凭借与梦世界的友好关系选择了进入梦世界避难，也因此远离了月之都那些纷乱。\n\n然而这终究不是长久之计，所以，现在我决定投奔你们咯。"
 toho.8098.b: "那你在和永琳商量着什么吗？"
 toho.8098.b.response: "…………\n…………\n其实我没有亲临哦？这件事本来是某位天狗记者为了炒作、增加自己报纸的销量才捏造的。\n\n而我嘛…………只不过顺水推舟了一下。"
 toho.8098.c: "具体是指？"
 toho.8098.c.response: "…………\n…………\n简单来说，我运用我的能力，将报纸中充斥着的对事实进行扭曲和夸张的“捏造、偏向”内容变成了现实。\n\n我猜，在她发现这件事后想必会停止发售并且少一点新闻学要素吧？"
 toho.8098.d: "原来如此，你希望加入我们吗？"
 toho.8098.d.response: "…………\n…………\n当然可以，梦世界里的生活还是有点太无聊了，加上我已经没什么可牵挂的了。\n\n命运，已经开始逆转了哦。"
 toho.8098.e: "欢迎加入§H[This.GetName]§!！"
 toho.8098.e.response: "§Y<§H$NAME_sagume$§!作为指挥官加入了§H[This.GetName]§!>§!"

