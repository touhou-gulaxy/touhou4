#  th_card.29.a: "一切都是值得的"
 th_card.1001.name: "新力量"
 th_card.1001.desc: "我们将刚刚得到的知识整理后交给了科学家，我们的科学家一边翻阅学习一边直呼不可思议，相信我们马上就可以掌握这股知识所蕴藏的强大力量"
