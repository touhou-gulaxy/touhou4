 gensokyo_start.1152.desc: "§U由于一群愚蠢的四足食草动物为这片星海所设下的规则，幻想乡特殊领袖因为携带了$paragon_leader_trait$['concept_spth_gensokyo_sp_trait']而无法选择$leader_trait_great_researcher$这类$paragon_leader_trait$。\n右边会自动显示当前帝国已经拥有的特殊东方领袖，在选择领袖后即可进行设置。§!\n\n请在这里选择一位领袖。"
 gensokyo_start.1152.desc.selected: "§U由于一群愚蠢的四足食草动物为这片星海所设下的规则，幻想乡特殊领袖因为携带了$paragon_leader_trait$['concept_spth_gensokyo_sp_trait']而无法选择$leader_trait_great_researcher$这类$paragon_leader_trait$。\n右边会自动显示当前帝国已经拥有的特殊东方领袖，在选择领袖后即可进行设置。§!\n\n§H当前选择§!\n领袖：§Y[From.get_spth_leader_title]§!$t$[From.GetName]\n等级：§Y[From.get_spth_leader_level]§!(§Y+[From.get_spth_leader_level_bonus]§!)$tt$经验值：§Y[From.get_spth_leader_experience]§!\n年龄：§Y[From.GetAge]§!\n类型：§Y[From.GetClass]§!\n此前岗位：§Y[From.get_spth_leader_background_job]§!\n\n[From.get_spth_leader_desc]"
