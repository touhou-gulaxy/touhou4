 tech_touhou_system_warper: "先进隙间跃迁理论"
 tech_touhou_system_warper_desc: "曾经的一种理论认为，可以使用巨量的灵力与能源去开辟并维持一道星系级别的隙间裂口，从而跃迁整个星系。旋转随着我们技术水平的进步，可以尝试将这一梦想，变为现实了。"
 tech_touhou_system_warper_improved: "隙间技术改良"
 tech_touhou_system_warper_improved_desc: "改进我们的隙间相关的技术，从而消耗更少的能量进行跃迁。"
 mod_country_max_touhou_system_warper_add: "最大先进跃迁引擎数量"
 mod_country_touhou_system_warper_use_add: "先进跃迁引擎占用数量"
