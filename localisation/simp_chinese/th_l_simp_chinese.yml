 tech_yuyuko_barrier_desc: ""
 touhou_suika_aux: "「百万鬼夜行」"
 touhou_suika_aux_aura: "大地狱重锤"
 touhou_suika_aux_DESC: "这种灵力武器一定程度上借鉴了某位鬼族的能力，即操纵密和疏程度的能力，从而提升舰船的闪避与防御能力，同时还可以提升我们武器的穿透能力。正因如此，它还可以引导轨道轰炸，使其对星球护盾等防御手段具备穿透效应，从而更有效的造成破坏。"
 touhou_reisen_aux: "波符「虚幻之月」"
 touhou_reisen_aux_aura: "心灵之网"
 touhou_reisen_aux_aura_2: "月狂之枪"
 touhou_reisen_aux_tooltip: "通过干扰敌方传感器，该组件可以§Y极大的§!降低舰船被敌人攻击的可能性。"
 touhou_reisen_aux_DESC: "这种装置可以发挥操纵事物波长的能力，通过发射特殊波长来干扰敌方的传感器甚至是目视观测，从而扰乱认知并进行攻击。由于功率限制，这些波长的攻击不能直接损坏敌方舰船，但会作用于敌方的护盾与装甲，使其运作效率一定程度上下降。"
 touhou_flandre_aux_aura: "§P星弧破碎§!"
 touhou_flandre_aux_1: "禁弹「星弧破碎」"
 touhou_flandre_aux_1_DESC: "这种灵力武器可以凭借恶魔之妹能发现事物之"目"的能力，更快的发现敌方的缺陷，并且制造子空间扰动进行攻击。虽然这种程度的攻击不会直接作用于舰船结构，但是会使得敌方舰船变得更容易被锁定，同时其受到的毁伤也会被略微放大。"
 touhou_flandre_aux_2: "禁忌「笼中鸟」"
 touhou_flandre_aux_2_DESC: "这种灵力武器可以凭借恶魔之妹能发现事物之"目"的能力，更快的发现敌方的缺陷，并且制造子空间扰动进行攻击。结合了灵能的攻击可以产生一定的灵能势井，略微损害敌方舰船的某些性能，还能使其变得更容易被锁定，同时其受到的毁伤也会被略微放大。"
 touhou_flandre_aux_3: "禁忌「孤独的葬礼」"
 touhou_flandre_aux_3_DESC: "这种灵力武器可以凭借恶魔之妹能发现事物之"目"的能力，更快的发现敌方的缺陷，并且制造子空间扰动进行攻击。对于月之都技术的部分解读使得这种武器可以制造灵力势井，略微损害敌方舰船的某些性能与船体稳定性，还能使其变得更容易被锁定，同时其受到的毁伤也会被略微放大。"
 touhou_reimu_aux: "结界「幻想结界缝隙」"
 touhou_reimu_aux_aura: "博丽大结界的隙间"
 touhou_reimu_aux_DESC: "这种灵力装置能够在空中打开隙间，操纵灵气，利用其创造结界，可以有效的提升我方舰船的机动性，还可以协助进行自我修复。"
 touhou_reimilia_aux: "红魔「绯红恶魔」"
 touhou_reimilia_aux_aura: "红色不夜城"
 touhou_reimilia_aux_DESC: "汇聚暗夜力量，这种灵力武器虽然不能直接攻击敌方，但其制造的红雾可以扰乱敌方的火控系统与计算机，从而严重影响敌方的武器运转效率。"
 touhou_lumiya_aux: "夜符「绝对黑暗视界」"
 touhou_lumiya_aux_DESC: "由于能够操纵黑暗程度，这种武器可以产生特殊的灵力压制场，利用压制场生成一定的引力扭曲效应，从而有效地抑制与阻止敌方使用超空间引擎甚至跃迁引擎。"
