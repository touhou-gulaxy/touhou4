 ######################起源
 origin_gensokyo_city: "幻想之星"
 origin_gensokyo_city_desc: "经历了一系列的异变，幻想乡终于出现在现世面前，其奇特的存在颠覆了现世的世界观，人们以前所未有的热情进行了社会的改变并重塑了世界，如今我们的母星是全银河前所未有的奇观"
 origin_tooltip_gensokyo_effects: "初始星变为幻想星，建设一批专属区划，获得15年的人口速度增幅。"
 origin_th_hm_default: "红魔一统"
 origin_th_hm_default_desc: "在成为星际文明的大转变期间，红魔馆的大小姐因其敏锐的政治嗅觉、蓬勃的称霸野心、强劲的军事实力，伟大的帝国蓝图与威严的个人形象成为了整个文明的主人，整个文明正憋着一股劲迎接未来。"
 origin_tooltip_th_hm_default_effects: "初始人口增加1500人，获得部分初始建筑。"
 origin_gensokyo_resource: "幻想扩散"
 origin_gensokyo_resource_desc: "经历了一系列的异变，幻想乡终于出现在现世面前，在距离跨入星际时代只有临门一脚的时候，幻想乡的实权人物用其敏锐的嗅觉感觉到资源储存的重要性，在文明跨入太空之前，统一的世界开足了马力生产必要的资源，而在这期间我们也学会了运用灵力的建筑方法，至于因为幻想乡少女的现世而没必要存在的博丽大结界也因此停用，我们将省下来的这些灵力存入仓库，以待星际时代使用"
 origin_tooltip_gensokyo_resource_effects: "获得幻想乡线所有建筑科技，获得存储科技，获得10w灵力与符卡，1w合金与消费品，5000食物能量矿物，首都获得10年的人口增速buff"
 origin_th_hm_trad: "红魔一心"
 origin_th_hm_trad_desc: "在被蕾米莉亚·斯卡雷特统治整个斯卡雷特帝国之后，因大小姐的独特的个人魅力，整个文明都发自内心认为蕾米莉亚大小姐是最优秀的领导人，并会毫不犹豫地彻底执行一切蕾米莉亚发布的命令，彻底拧成一股绳的斯卡雷特帝国拥有其他文明想象不到的凝聚力"
 origin_tooltip_th_hm_trad_effects: "初始点满繁荣传统，首都获得25年的凝聚力产出与人口增速buff"
 spth_hm_start_grow: "红魔一心"
 spth_hm_start_grow_desc: "整个帝国目前是扩张热情最为高涨的时候，正在积极同化旧世界的生命"
 spth_gsk_start_grow: "新幻想乡"
 spth_gsk_start_grow_desc: "这是幻想乡全新的开始，我们正在努力建设国家"
 th_people_emmigration: "四通八达的异世界"
 th_people_emmigration_desc: "处于某种特殊原因，幻想乡与其他世界的“秘密通道”突然变得异常的多"
 origin_spth_story_gensokyo: "§B结界消逝§!"
 origin_spth_story_gensokyo_desc: "§U剧情起源§!\n一个与现世不太一样的太阳系，一个博丽大结界消逝后的幻想乡，一个与幻想乡接触了的外界，以及月球结界里侧陨落的月都...\n\n\n\n\n\n\n£touhou_origin_story_1£\n\n\n\n\n\n\n秘封二人更多的故事等待发掘..."
 origin_spth_story_gensokyo_effects: "- 使用幻想乡世界线的太阳系作为起源星系\n- 随着剧情推进可以改造月之都与修复鸟船\n- 拥有专属的的剧情设计与科技\n- §B可以发现更多真相...§!"
 origin_spth_story_gensokyo_neg_effects: "- §R这能有什么坏处呢？§!\n- §R会摧毁游戏中已存在的太阳系§!\n- 本起源一局游戏中只能存在一个，否则会引发bug"
 spth_story_sol_system_gensokyo: "§B幻想乡§!"
 spth_story_sol_system_gensokyo_NAME: "§B幻想乡§!"
 spth_story_sol_system_gensokyo_DESC: "一个与现世不太一样的太阳系，初始为陆地星球，月球替换为幻想城。\n§B剧情起源专用§!"
 origin_th_hiff: "§U科学世纪§!"
 origin_th_hiff_desc: "科学世纪时期，科学昌明而信息科技高度发达，人们能够平等地获取信息，而物理学也进入了解释和哲学的时代。相反的是，想象力灭绝了，而无法解释的事物则被当做一个错误抹煞，无法解释的神秘也被否定。而随着科技的发展，幻想乡也正式暴露与人们的视野之中，传说的存在重现于世无疑为人类注入了一股新的活力。"
 origin_th_hiff_effect: "- §G开局后即拥有$r_th_latency$，且获得一批初始科技§!\n- §G固定使用§U秘封俱乐部§!作为开局领袖§!\n- §G使用独特的太阳系开局§!"
 origin_th_hiff_neg_effect: "- §R无法使用幻想乡高级物种特质§!\n- §R['concept_guaranteed_colonies']：不会生成§!"
 spth_hiff_sol_system: "博丽大结界"
 spth_hiff_sol_system_home: "幻想乡"
 spth_hiff_sol_system_NAME: "博丽大结界"
 spth_hiff_sol_system_DESC: ""
 origin_lunar_capital: "陨落月都"
 origin_lunar_capital_desc: "曾经月之都的一个碎片，这一文明的诞生远早于星系中的当代列强。亿万年前的灾难使他们的帝国逐步沦为昔日辉煌的些微阴影。"
 origin_gensokyo_ringworld: "幻想星环"
 origin_gensokyo_ringworld_desc: "这个世界线的幻想乡起源暂时未知，总之生活在未知先驱们建造的§U幻想星环§!之中，从钻木取火，到觉醒力量，再到迈入星空。一经理解及修复完好，他们将获得巨大的力量。"
 origin_gensokyo_ringworld_effects: "- 能够对损坏的§U幻想星环§!进行修复工作\n- 该起源建造的§U幻想星环§!在规模上会更加巨大"
 origin_gensokyo_ringworld_neg_effects: "- §R这还能有什么坏处呢？§!"
 origin_gensokyo_ringworld_start_NAME: "破碎幻想星环"
 origin_gensokyo_ringworld_start_DESC: "有两个区段损坏的幻想星环，可以被修复。"
 d_gensokyo_ringworld: "不明裂隙"
 d_gensokyo_ringworld_desc: "通往§M未知位面§!的星界裂隙，但我们无法穿行。也许这是这座环形装置的建造者遗留的？"
 d_gensokyo_ringworld_ruin: "古代遗迹"
 d_gensokyo_ringworld_ruin_desc: "大概是环形装置设施建造者城市的遗迹，我们文明的发展正是从此开始，对我们提供了很多启发。"
 d_gensokyo_ringworld_city: "先驱之城"
 d_gensokyo_ringworld_city_desc: "先驱者铸造的庞大都市。"
 gensokyo_ringworld_modifier: "古代环形装置"
 gensokyo_ringworld_modifier_desc: "§M古代文明§!铸造的幻想星环，虽然处于未知原因建设速度更慢，但是可以同时开展更多的建设工作，并且还为殖民地提供了绝佳的防护。"
 START_SCREEN_THRW: "我们的朦胧过往已经被遗忘，只知道先祖们从这座巨大的环形装置上开始发展。起初的探索非常困难，环形装置带给我们过错误的认知。直到信息革命后，我们开始对设施建造者的信息与科技开始解读，极大的促进了科技发展与对我们自身力量——灵力——的认知。\n\n如果猜测正确，我们应该就是他们的后裔，或许群星中仍存在着远古先驱的遗迹，也可能存在着他们所面临的危机，但不管什么都无法阻止我们前进的步伐。"
 origin_gensokyo_koishi: "幻想之城"
 origin_gensokyo_koishi_desc: "经历了一系列的异变，幻想乡终于出现在现世面前，其奇特的存在颠覆了现世的世界观，人们以前所未有的热情进行了社会的改变并重塑了世界。在地底居民的帮助下，融合了科技与幻想的城市被打造了出来，作为我们迈入繁星的起点。"
 origin_gensokyo_koishi_effects: "- 初始星球变为幻想城\n- 15年内获得星球建设增幅"
 origin_gensokyo_koishi_neg_effects: "- 开局领袖被固定为地灵殿领袖组"
 spth_gsk_start_build: "$spth_gsk_start_grow$"
 spth_gsk_start_build_desc: "$spth_gsk_start_grow_desc$"
 d_spirit_power_spring_city: "$d_spirit_power_spring$"
 d_spirit_power_spring_city_desc: "$d_spirit_power_spring_desc$"
 origin_touhou_shell_world: "§P壳中世界§!"
 origin_touhou_shell_world_desc: "§R警告：该起源必须启用§P古代帝国MOD§!才能正常运作。§!\n\n我们的祖先似乎生来就在这个奇特的世界上发展着，这个巨大的人造结构由一层一层的，能够包裹下层天体的巨型人造宜居表面组成，但是最外层已经损坏了。这个巨大的人造结构曾经给我们对世界的认知带来了极大的阻碍，然而在我们发展出太空航行技术之后，设施建造者的信息与科技所留下的信息与科技，也许可以极大的加速我们的进步，也许还可以让我们了解自身的过往。\n\n\n\n\n\n\n£origin_touhou_shell_world_desc_pic£\n\n\n\n\n\n\n§B残缺的满月，幽邃的裂隙。§!"
 origin_touhou_shell_world_effects: "\n- §G母星将被替换为§H['touhou_shell_world']§!(规模：£planet_size£25)§!\n- §G母星上方将拥有一层星垣壳层与一层受损的['touhou_shell_world']§!\n- §G可以较早的获取£engineering_research£['touhou_shell_world']科技§!\n- §G开局时已完成考古传统§!"
 origin_touhou_shell_world_neg_effects: "- §R可能相较其他起源过于强力§!\n- §R潜在的虚无主义倾向§!\n- §R需要花费资源来维持母星的['touhou_shell_world_durability']§!\n- §R['concept_guaranteed_colonies']：不会生成§!"
 START_SCREEN_TOUHOU_SHELL_WORLD: "我们的朦胧过往已经被遗忘，只知道我们的祖先似乎生来就在这个奇特的人造结构上发展着。\n\n与其他文明相比我们的发展之路非常坎坷，这座§H壳世界§!带给我们过错误的认知，让我们长期的愚昧。直到发展出太空航行技术后，我们开始对设施建造者的信息与科技开始解读，开始对坠落于壳层中的星舰进行逆向，我们才初次窥见这个世界的全貌。\n\n如果不是我们自身的灵力能力，我们想必将会一辈子被困于壳层之下。针对那些舰船的初步逆向，我们成功开发出了超光速技术，正式的踏入星河。不过非常奇怪的是，这些舰船的安全系统似乎形同虚设，我们轻而易举的就通过了它们的生物验证，也许以后我们会找到原因。"
 origin_touhou_shell_world_system: "§P博丽大结界§!"
 origin_touhou_shell_world_system_planet: "幻想乡"
 origin_touhou_shell_world_system_NAME: "§P壳中世界§!"
 origin_touhou_shell_world_system_DESC: ""
 d_touhou_fallen_starship_lunar_capital: "§B陨落星舰§!"
 d_touhou_fallen_starship_lunar_capital_desc: "坠落在此地的数艘星舰，虽然已经完全无法修复了，但是我们还是可以对其进行研究。\n§R也许我们应该清理这片区域。§!"
 d_touhou_fallen_starship_makai: "§M陨落星舰§!"
 d_touhou_fallen_starship_makai_desc: "坠落在此地的数艘星舰，虽然已经完全无法修复了，但是我们还是可以对其进行研究。\n§R也许我们应该清理这片区域。§!"
 d_touhou_fallen_starship_lunar_capital_fixed: "§B星舰研究区§!"
 d_touhou_fallen_starship_lunar_capital_fixed_desc: "这些舰船的设计理念可以推进我们的研究。"
 d_touhou_fallen_starship_makai_fixed: "§M星舰研究区§!"
 d_touhou_fallen_starship_makai_fixed_desc: "这些舰船的设计理念可以推进我们的研究。"
 NAME_touhou_new_shell_world: "幻想星垣"
 touhou_megastructure_shell_world_damaged: "损坏的壳世界壳层"
 touhou_shell_world_built_title:0 "已建成§H壳世界§!"
 touhou_shell_world_built_desc: "§H[ag_shell_world_new_layer.GetName]§!已经建成。"
 toho.4021.name:0 "§H[ag_shell_world_new_layer.GetName]§!已建成"
 toho.4021.desc:0 "我们已经修建了我们的首个§H壳世界§!，由磁流体支撑的金属框架和人造表面已经完全覆盖了整个§H[ag_shell_world_base_layer_temp.GetName]§!，而§H[ag_shell_world_new_layer.GetName]§!的第一批居住者，已经在施工的过程中和工程完成后逐步在$pc_ag_shell_world$上定居了。\n\n§H[ag_shell_world_new_layer.GetName]§!的一砖一瓦都经过精心设计，它足够稳定且能提供广袤无垠的可居住空间，§H壳世界§!将会成为了我们的家园在浩瀚星海中的延申。"
 toho.4021.a:0 "好极了。"
