 th_yuyuko_butterfly_tt: "§Y同舰队其他舰船战沉或击杀敌方舰船时§!，都可以为该舰船上的全部§U返魂蝶§!增加额外§U2.00%§!的['concept_utsuho_bonus']，同时根据§U该武器的数量§!有几率获得§U1.00%§!['concept_utsuho_bonus']与§U1.00%§!射速加成。\n伤害与射速加成可以叠加。"
