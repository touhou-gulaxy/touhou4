 toho.16.name: "§U万宝槌§!"
 toho.16.desc: "§L万宝槌是鬼的法宝。\n实现愿望的同时，必会给予其同等的代价。\n过于巨大的愿望，其代价可能会在愿望本身实现之前就显现。§!\n\n我们可以消耗$r_touhou_magic_power$来拜托§H$NAME_shinmyoumaru$§!使用万宝槌，从而对我们的帝国产生各种各样的影响。我们可以选择要产生的影响种类与影响程度，也可以调整万宝槌的持续时间，最短为§Y30.00§!£time£，最长为§I360.00§!£time£。根据持续时间和影响程度的不同，万宝槌需要消耗§H对应数量§!的$r_touhou_magic_power$、$r_sr_lingli$与$r_sr_fuka$，并且在使用后§H需要对应的时间进行充能§!。\n§R但是需要注意，这并非没有代价。§!\n\n我们目前拥有$r_touhou_magic_power$: §H[Root.GetMagicPowerStockpile]§!\n我们目前$r_touhou_magic_power$收入: §H[Root.GetMagicPowerIncome]§!"
 toho.16.a: "§E妖剑「辉针剑」§!"
 toho.16.b: "§E小弹「小人的荆棘路」§!"
 toho.16.c: "§E「全小人族的绯想天」§!"
 toho.16.d: "§E狂槌符「狂视幻象」§!"
 toho.16.e: "§E小槌「变得更大吧」§!"
 toho.16.a.effect: "我方舰队进入战斗后，将对敌方舰队施加§Y+20.00%§!['concept_touhou_vulnerable']，且万宝槌的影响效率§Y每提升一级§!，额外提供§Y+10.00%§!['concept_touhou_vulnerable']，该效果持续§H10.00§!£time£。\n\n§R「辉针逆城之诅咒」§!\n万宝槌的影响结束后，在等同于上一次万宝槌启动的时间内，我们将遭受同样的负面效果。"
 toho.16.b.effect: "我方舰队进入战斗后，将使用被万宝槌增强的辉针之针对敌方的一支舰队发动攻击，使其在§Y4.00§!£time£内失去§R全部的护盾与装甲§!，并且万宝槌的影响效率§Y每提升一级§!，持续时间提升§Y2.00§!£time£。\n同一支舰队在§Y90.00§!£time£内只能触发一次。\n\n§R「辉针逆城之诅咒」§!\n万宝槌的影响结束后，在等同于上一次万宝槌启动的时间内，我们将遭受同样的负面效果。"
 toho.16.c.effect: "为全帝国提供§Y+40.00%§!§H岗位效率修正§!，且万宝槌的影响效率§Y每提升一级§!，额外提供§Y+10.00%§!§H岗位效率修正§!。\n\n§R「辉针逆城之诅咒」§!\n万宝槌的影响结束后，在等同于上一次万宝槌启动的时间内，我们将遭受§R-20.00%§!§H岗位效率修正§!，并且万宝槌的影响效率§Y每提升一级§!，额外提供§R-5.00%§!§H岗位效率修正§!。"
 toho.16.d.effect: "我方舰队进入战斗后，将使用被万宝槌增强的§UDisorder Eye§!对敌方的一支舰队发动攻击，施加持续§Y4.00§!£time£的['concept_terrify',§U恐惧§!]，并且万宝槌的影响效率§Y每提升一级§!，持续时间提升§Y1.00§!£time£。\n同一支舰队在§Y180.00§!£time£内只能触发一次，该效果对某些具备§H对抗效果§!的舰船无效。\n\n§R「辉针逆城之诅咒」§!\n万宝槌的影响结束后，在等同于上一次万宝槌启动的时间内，我方舰队在进入战斗时也将遭受同样的效果。"
 toho.16.e.effect: "我方舰队进入战斗后，将使用万宝槌对敌方的一支舰队发动攻击，施加['modifier:touhou_magical_mallet_e_modifier']，在一段时间内使其船体稳定性§R严重过载§!。\n同一支舰队在§Y90.00§!£time£内只能触发一次。\n\n§R「辉针逆城之诅咒」§!\n在持续时间内，我方舰队在进入战斗时也将遭受['modifier:touhou_magical_mallet_e_modifier']，不过效率只有§Y25.00%§!。"
