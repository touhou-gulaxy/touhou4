 tech_touhou_fe_union_escort_desc: "作为先祖联盟分裂后形成的势力——§H知识管理者§!——试图再现当年辉煌的孤注一掷的尝试，这种舰船融合了暗星计划、舰载四级奇点与月之都的技术，然而失去了大量关键技术的§H知识管理者§!最终变得无法继续建造如此先进的舰船了。"
 tech_touhou_fe_union_battle_cruiser_desc: "作为先祖联盟分裂后形成的势力——§H知识管理者§!——试图再现当年辉煌的孤注一掷的尝试，这种舰船融合了暗星计划、舰载四级奇点与月之都的技术，然而失去了大量关键技术的§H知识管理者§!最终变得无法继续建造如此先进的舰船了。"
