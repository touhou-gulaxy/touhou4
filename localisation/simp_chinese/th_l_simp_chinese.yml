 th_leader_sp.213.desc: "[From.GetName]在进入战斗后，古明地恋与秦心为了争夺希望之面，不慎让希望之面掉到了不知道什么地方，秦心由于希望之面丢失而力量暴走，发生了不好的事情。很明显舰船的安全部队无法阻止她们二人放弃指挥岗位、转而跑到太空中进行符卡战斗。。。"
 th_leader_sp.213.a: "？"
