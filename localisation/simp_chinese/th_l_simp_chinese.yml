 touhou_fe_union_titan_0: "古代泰坦 - $NAME_touhou_fe_union_titan_no_color$: 建造基址"
 touhou_fe_union_titan_0_DESC: "这个大型的平台存放的资源将会被用于建造古代泰坦：$NAME_touhou_fe_union_titan_no_color$。"
 touhou_fe_union_titan_0_MEGASTRUCTURE_DETAILS: "暗星计划与月之都技术结合的一种被称为§Y$NAME_touhou_fe_union_titan_no_color$§!的大型古代战舰。"
 touhou_fe_union_titan_1: "古代泰坦 - $NAME_touhou_fe_union_titan_no_color$"
 touhou_fe_union_titan_1_DESC: "建造进度：§S1/1§!\n建造古代泰坦 - $NAME_touhou_fe_union_titan_no_color$。"
 mod_shipsize_touhou_fe_union_titan_hull_mult: "古代泰坦-$NAME_touhou_fe_union_titan_no_color$船体值"
 tech_touhou_fe_union_titan: "古代泰坦 - $NAME_touhou_fe_union_titan_no_color$"
 tech_touhou_fe_union_titan_desc: "$NAME_touhou_fe_union_titan_orange$是暗星计划与月之都技术结合而设计的一种大型战舰，它似乎是由先祖联盟自主设计的古代战舰改装而来，原型为暗星计划中的泰坦级舰船，配置了一些月之都的设备与改造过的扭曲护盾。经过我们的设计重构，$NAME_touhou_fe_union_titan_orange$现在配置了灵力优化的舰载四级奇点核心，能够支持其执行额外的功能。\n\n作为先祖联盟崩溃前夜的一款设计，$NAME_touhou_fe_union_titan_orange$使用了比常规先祖联盟舰船更先进的技术，他们试图挽救自己行将就木的联盟，然而这些新技术并没能阻止他们不可避免地继续走向衰落。仅仅生产出了两条$NAME_touhou_fe_union_titan_orange$，先祖联盟就已然分裂，之后的那些势力也因为失去了大量关键技术而堕落了。\n\n由于舰船维护难度较高，我们和设计它的先祖联盟一样无法量产这种大型舰船。"
