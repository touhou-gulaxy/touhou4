 spth_mega_brief_report_prefix: "简报时间：[spth_get_year]/[spth_get_month]/[spth_get_day] [spth_get_season]"
 spth_mega.4001.name: "$mega_spth_space_shrine_station_platform$"
 spth_mega.4001.desc: "$spth_mega_brief_report_prefix$\n\n用于建设$spth_space_shrine_station$的深空建筑基址已经准备完毕，一旦相关资源就位，我们就可以开始下一个阶段的建设工作。"
 spth_mega.4002.name: "$mega_spth_space_shrine_station$"
 spth_mega.4002.desc: "$spth_mega_brief_report_prefix$\n\n我们的$spth_space_shrine_station$已经建设完成。注入了强大的灵力之后聚变堆开始了轰鸣，反应堆舱段的监控显示，在八尺鸦的力量下，一颗明亮的宛如人造恒星的火球正在熊熊燃烧，为这座巨型堡垒提供源源不断的庞大能源。隙间驱动器开始生成笼罩了大片宇宙空间的灵力迷雾。相关人员与式神们已经进驻并开展适应性训练，很快她就会进入正常状态。"
 spth_mega.4003.name: "外星$megastructures$"
 spth_mega.4003.desc: "$spth_mega_brief_report_prefix$\n\n天文观测与一系列活动表明了[From.GetName]正在[FromFrom.GetName]建设一座奇怪的$megastructures$。"
 spth_mega.4004.name: "外星$megastructures$完成"
 spth_mega.4004.desc: "$spth_mega_brief_report_prefix$\n\n我们收到报告，[From.GetName]在[FromFrom.GetName]建设的$megastructures$已经完成了。\n一场我们无法理解的$space_storm$在那里发生了，诡异的迷雾弥漫了数个星系。一个造型奇特的巨大堡垒在[fromfromfromfrom.GetName]之上停泊着...然后开始了缓慢移动。\n\n他们究竟制造了什么样的怪物？"
 toho.4006.name: "修复星界网络节点"
 toho.4006.desc: "我们已经成功解除了环绕在星界网络节点上的结界护盾，并且对其完成了初步修复。\n\n但由于安全系统的限制，它目前只能实现一些简单的功能，例如与常规的星门网络进行连接。按照魔界遗留的资料，我们还无法使用星界星门等功能，从原理上说，这种设施可以轻松的刺破星界壁垒——哪怕是在以往强度远比现在高的时候——从而借助穿越星界壁垒进行不同节点之间的快速航行。\n\n特别是因为他们不借助星门等常规手段使用的空间，安全性会更高。经过初步研究后，我们的研究团队确信他们找到了恢复其大部分功能的办法，不过由于魔界的技术与结构过于复杂，研究工作需要耗费较多的时间和资源。"
 toho.4007.name: "解除安全系统"
 toho.4007.desc: "经过研究后，我们的科研团队成功找到了解除星界网络安全系统的方法。\n\n总的来说，我们可以通过建造特殊的节点设施，来让舰船快速的通过星界壁垒穿梭于不同地方，同时这一过程还因为星界网络的一些特性，可以帮助我们修复通过的舰船。此外，他还可以借助梦世界次元短暂的生成一个双向端口，我们的舰船可以通过他前往端口另一侧的星系，这赋予了我们灵活机动的优势。\n\n不过有一件事让我们百思不得其解。理论上，魔界在河外星系中应该遗留有大量的星界网络节点，但奇怪的是，对星界网络导航系统的解读却并没有发现这些节点，不过这也代表我们大概不需要担心来自河外的威胁了。"
 toho.4008.name: "设置星界网络"
 toho.4008.desc: "星界网络作为魔界先进星界技术的产物，可以刺破星界壁垒，从而快速的进行不同地点的穿梭，甚至前往不同的位面。不过由于我们的技术与维护能力比不上魔界，其安全系统阻止了我们前往其他位面或者河外星系。\n\n当我们控制着主节点时，我们可以通过星界网络的节点去配置星界网络，不过由于技术限制，我们只能部署量子弹弓、梦世界传送门、接入银河星门与星界网络。好消息是在我们技术的改造下，我们现在也可以随时拆装超空间中继器与L星门模块。并且由于我们控制着我们星系的主节点，因此可以控制魔界星门网络的访问权限。\n\n根据推断，魔界所处的时间应该还不存在超空间航道与L星门，这也能解释为什么他们没有为自己的星界网络配置与之相关的模块。"
 toho.4008.a: "§G部署量子弹弓模块§!"
 toho.4008.b: "§G激活银河星门接口§!"
 toho.4008.c: "§G激活星界网络接口§!"
 toho.4008.d: "§G激活超空间中继器§!"
 toho.4008.e: "§G激活L星门网络接口§!"
 toho.4008.f: "§G生成梦世界端口§!"
 toho.4008.a.status: "已部署模块: [touhou_gateway_network_quantum_catapult_count]"
 toho.4008.a.effect: "这将部署一个拥有§H量子弹弓§!功能的模块，该量子弹弓§G无需前置充能且精确度较高§!。\n由于我们维护能力比不上魔界，因此我们只能最多同时维持§Y[touhou_gateway_network_quantum_catapult_max]§!个量子弹弓模块。"
 toho.4008.b.effect: "这将部署一个可以接入§H常规银河星门网络§!的模块，不过我们无法控制该星门网络的访问权限。"
 toho.4008.c.effect: "这将部署一个可以接入魔界使用的§H星界星门网络§!的模块，经过星界星门网络的舰船将修复全部的护盾，并且获得持续§G5.00§!£time£的船体修复能力加成。"
 toho.4008.d.effect: "这将部署一个§H超空间中继器§!模块，可以与其他的超空间中继器组成超空间中继器网络。"
 toho.4008.e.effect: "这将部署一个§HL星门§!模块，我们可以选择将其部署为L星团入口或者普通L星门。"
 toho.4008.f.effect: "这将生成一个通往梦世界的传送门，借助梦世界实现类似§H虫洞§!的点对点传输，该传送门能最长维持§G90§!£time£，且每§R360.00§!£time£只能生成一个传送门端口。"
