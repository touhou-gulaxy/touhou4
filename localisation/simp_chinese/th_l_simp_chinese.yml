 TOUHOU_SHIP_SYNTH_QUEEN_TITAN_SECTION: "哈气核心"
 TOUHOU_SYNTH_QUEEN_TITAN_MAIN_WPN: "审判之日"
 TOUHOU_SYNTH_QUEEN_TITAN_MAIN_WPN_DESC: ""
 touhou_ac_patron_shroud_buff_1: "造形之力"
