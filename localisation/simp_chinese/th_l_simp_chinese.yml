 gensokyo_start.200.desc: "我们母星所处的$touhou_shell_world$由于已经存在了§H上亿年§!之久，尽管其建造者按照§H近乎永恒§!的寿命对这座巨型结构进行设计，但在漫长的时间中难免会遭遇各种变故，因此这座$touhou_shell_world$的结构稳定性现在需要我们的维护。我们近些年掌握了有关这座$touhou_shell_world$的一些技术，工程部门根据各项指标的观测值汇总成了§H$touhou_shell_world_durability$§!这一指标。\n\n$touhou_shell_world_durability_desc$"
