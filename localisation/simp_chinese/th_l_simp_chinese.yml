##巨构##
 th_shrine_mega: "太空神社"
 th_shrine_mega_DESC: "位于恒星环绕轨道上的巨型复合式宗教建筑，除了宏伟和强行让参拜者塞钱外大概的确没有任何用处"
 th_shrine_mega_MEGASTRUCTURE_DETAILS: "在恒星旁建设的一座巨型神社用于宗教、军事、文化及各类弹幕试验活动"
 th_shrine_mega_1: "昴宿天守"
 th_shrine_mega_1_DESC: "昴宿守护的神社，七星笼罩下的安乐园，忧愁者的故乡"
 th_shrine_mega_1_close: "昴宿天守"
 th_shrine_mega_1_close_DESC: "昴宿守护的神社，七星笼罩下的安乐园，忧愁者的故乡 \n \n天守的结界将断开星系和银河的一切联系，并通过昴宿四魔法构建的传送通道互相连接。"
 th_shrine_mega_1_open: "昴宿天守-增十二"
 th_shrine_mega_1_open_DESC: "昴宿守护的神社，七星笼罩下的安乐园，忧愁者的故乡 \n \n天守的结界将断开星系和银河的一切联系，并通过昴宿四魔法构建的传送通道互相连接。 \n \n增十二星打开了通向外界的一条小径。"
 th_mega_tunnel: "昴宿四节点"
 th_shrine_mega_ruined: "被毁的$th_shrine_mega_1$"
 th_shrine_mega_ruined_DESC: "一个被摧毁的$th_shrine_mega_1$。尽管它已经年久失修，但这个庞然大物的基本结构大部分完好无损。通过必要的科技和大量的资源投入，我们就有可能修复好这个$th_shrine_mega_1$。"
 th_shrine_mega_restored: "$th_shrine_mega_1$"
 th_shrine_mega_restored_DESC: "$th_shrine_mega_1_DESC$"
 th_shrine_mega_2: "天鸟船大神社"
 th_shrine_mega_2_DESC: "魔雾弥漫在太空神社的内部，模仿着鸟船空间站相似的结局······\n集成了军事、宗教、文化、贸易功能的太空神社，目前成了保佑太空航行的吉祥物. \n妖怪们都诗意地栖居在长满青苔的天守神社内部,不仅把集市开到了太空中，个别家伙都已经在学着依靠太阳能种田了。"
