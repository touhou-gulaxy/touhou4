 toho.8030.name: "紫香花开"
 toho.8030.desc: "紫色的樱花开始在§H[This.GetName]§!上绽放，虽然这些妖怪樱妖艳且美丽，但一想到后面可能会发生的事情，人们都变得惶恐起来。"
 toho.8030.a: "真是可怕。"
 toho.8030.b: "知晓了，这类事情可以不再通知了。"
 toho.8031.name: "彼岸花开"
 toho.8031.desc: "彼岸花开始在§H[This.GetName]§!上绽放，开放着鲜红色花朵的彼岸花的毒素阻挡着人们再向前进的道路，这些异常的彼岸花阻碍了星球的日常活动。"
 toho.8031.a: "真是可怕。"
 toho.8031.b: "知晓了，这类事情可以不再通知了。"
 toho.8032.name: "幽灵暴走"
 toho.8032.desc: "此前幽灵暴走的事件开始在§H[This.GetName]§!上发生，极大的阻碍了星球的日常活动。"
 toho.8032.a: "真是可怕。"
 toho.8032.b: "知晓了，这类事情可以不再通知了。"
