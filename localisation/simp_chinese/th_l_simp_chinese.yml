 th_hellsing.0.desc: "这是献给夜之王女的七重奏乐，首都的工厂已经全面启动，渴望鲜血的王者将要进行点兵，她的子民将狂热地为之前往战场，惩戒胆敢将武器对准神枪的敌人。\n\n请选择想要召唤的舰船"
