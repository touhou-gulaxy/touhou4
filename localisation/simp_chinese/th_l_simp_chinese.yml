 toho.8120.name: "$touhou_fe_union_titan_0$"
 toho.8120.desc: "部署于生产设施附近的深空建筑基址已经准备完毕，一旦相关资源就位，我们就可以开始下一个阶段的建设工作。"
 toho.8121.name: "$touhou_fe_union_titan_1$"
 toho.8121.desc: "我们已经完成了$touhou_fe_union_titan_1$的建造，其在通过安全测试后已经可以交付部队了。"
 toho.8122.name: "外星巨型建筑"
 toho.8122.desc: "我们收到情报，[From.GetName]正在建造一艘他们复原的大型古代战舰，其似乎被称为$NAME_touhou_fe_union_titan_orange$。"
 toho.8123.name: "外星巨型建筑完成"
 toho.8123.desc: "我们收到情报，[From.GetName]建造的，被称为$NAME_touhou_fe_union_titan_orange$的大型战舰已经建造完成并交付部队。"
 toho.8123.a: "惊了。"

 touhou_th175_oil_hell_category: "§U黑水涌泉§!"
 touhou_th175_oil_hell_category_desc: "在科研船的扫描中，我们发现这颗星球的表面存在着奇特的景观，多处地方涌出来黑色的水，其中散发着异臭，沾在身上则会难以去除。"
 touhou_th175_oil_hell_chain_title: "§U黑水涌泉§!"
 touhou_th175_oil_hell_chain_desc: "一颗星球的表面存在着奇特的景观，多处地方涌出来黑色的水，其中散发着异臭，沾在身上则会难以去除，但是这些黑水似乎具备着一些奇特的性质。"
 touhou_th175_oil_hell_chain_build_station: "建设开采站"
 touhou_th175_oil_hell_chain_build_station_DESC: "在星球轨道上建立开采站以采集资源。\n\n§g(这个特殊项目在建造开采站后会自动完成喵)§!"
 touhou_th175_oil_hell_chain_build_station_tt: "§Y在星球轨道上建立开采站§!"
 touhou_th175_oil_hell_chain_research_oil: "研究黑水"
 touhou_th175_oil_hell_chain_research_oil_DESC: "研究这些黑水的性质，探究为什么会导致开采站上的工作人员纷纷情绪失控。"
 touhou_th175_oil_hell_chain_army_team: "派遣特遣队"
 touhou_th175_oil_hell_chain_army_team_DESC: "针对研究团队人员失踪的情况，或许我们应该派遣特遣队探查一下。"
 touhou_th175_oil_hell_chain_mdl_1: "研究解决异变的方法"
 touhou_th175_oil_hell_chain_mdl_1_DESC: "尝试找到这场异变的源头。"
 touhou_th175_oil_hell_chain_mdl_2: "讨伐秘神"
 touhou_th175_oil_hell_chain_mdl_2_DESC: "看起来秘神又在搞事了，快去后户之国讨伐她！"
 touhou_th175_oil_hell_chain_mdl_3: "发掘结界裂口"
 touhou_th175_oil_hell_chain_mdl_3_DESC: "发掘位于星球地壳深处的结界裂口，从而进入旧血池地狱，治退其中的真凶。"
 touhou_th175_oil_hell_chain_mdl_modifier_1: "混乱的四季"
 touhou_th175_oil_hell_chain_mdl_modifier_1_desc: "混乱的四季给我们的生产活动造成了极大的麻烦。"
 touhou_th175_oil_hell_chain_mdl_modifier_2: "妖精石樱化"
 touhou_th175_oil_hell_chain_mdl_modifier_2_desc: "不少妖精突然失去了生命力，变成了一座座石樱。"
 th_anomaly.40.name: "研究成果"
 th_anomaly.40.desc: "§H[This.GetName]§!对这些物质的研究表明，这种黑水是某种高能燃料，也可以作为化工用途，因此科学官们建议在这颗星球上§Y建造开采设施§!以采集这里的资源。\n\n不过§H[This.Leader.GetName]§!报告称她在这颗星球的地壳深层发现了某种时隐时现的奇特灵力活动，§R虽然这应该无伤大雅§!？"
 th_anomaly.41.name: "开采站建设完成"
 th_anomaly.41.desc: "我们成功的在§H[spth_temp_planet.GetName]§!的同步轨道上建立了开采站，并且开始开采这些奇特的黑水。"
 th_anomaly.42.name: "§R[spth_temp_planet.GetName]开采站上的骚乱§!"
 th_anomaly.42.desc: "§H[spth_temp_planet.GetName]§!轨道开采站上最近发生了骚乱事件，由于不明原因，开采站上的工作人员纷纷变得喜怒无常，就像是换了个人一样，不管是心理辅导还是治疗似乎都无法缓解她们的情绪问题。\n\n最终这一切导致了开采站上的局势失控——在一次反应堆维护作业中，维修团队因为一些小事而大打出手，可想而知，随后的弹幕战斗直接引发了反应堆的失控。由于局势无法挽回，我们只能考虑放弃这座开采设施了，在撤离了站上的工作人员后，整座站点在炫目的爆炸中化为了灰烬。\n\n在远离了那些黑水后，原本的那些工作人员们又恢复了正常。针对这一奇怪的情况，或许我们应该派遣特遣队加以调查。"
 th_anomaly.43.name: "突发变故"
 th_anomaly.43.desc: "研究团队传回的报告证实了这些黑水物质里存在某种灵力反应，会使得附近的生物变得相对焦躁不安，也许这就是之前开采站上发生的事故的原因。\n\n仅仅过了几天，更坏的消息传来了，§H[This.Leader.GetName]§!发来紧急通讯，§H[This.GetName]§!上的部分船员在探索黑水物质源头的深处时神秘失踪了，并且看起来是他们§R主动关闭了通讯与定位设备§!。随后，就在§H[This.Leader.GetName]§!亲自带队前往调查时，§H[This.GetName]§!向§H[This.Leader.GetName]§!报告称之前失踪的船员突然乘坐穿梭机抵达了§H[This.GetName]§!，并且劫持了这艘科研船。\n\n随后，§H[This.Leader.GetName]§!就看到这条船直直的坠入了这一切的源头之中。我们应该派遣运输船让专业人员去尝试搜救了§H[This.GetName]§!。"
 th_anomaly.44.name: "人员失踪"
 th_anomaly.44.desc: "事实证明我们的运输船也遭遇了类似的情况，并且这次大部分人员都失踪了。然而他们留下的信息表明，在深处所谓的“黑色之海”，存在着什么人物，他们选择了加入到她的行列之中。\n\n也许这次我们不应该派遣更多人员了，最好静待事情发展。"
 th_anomaly.46.name: "四季紊乱"
 th_anomaly.46.desc: "在§H[This.GetName]§!的夏日，§H[This.GetName]§!上神社的樱花却正在盛开，然而神社却无人造访。更奇怪的是，有些地方又在下雪，有些地方则是一片秋日景象。简而言之，§H[This.GetName]§!上的四季突然紊乱了，完全不符合§H[This.GetName]§!该有的气候。这对§H[This.GetName]§!上的生产效率带来了严重的负面影响。\n\n现在，整颗星球已被四季的景色所浸染，一切似乎和旧日幻想乡曾经发生的一场异变非常相像。然而这次，§H[This.GetName]§!当地政府完全没有异变相关的线索或是头绪，也许我们需要派遣专业团队去协助他们应对这次异变了。"
 th_anomaly.46.a: "什么，这回又发生什么了？"
 th_anomaly.47.name: "后户之门"
 th_anomaly.47.desc: "经过漫长的调查，在星球极点地下22.14km处，我们的联合调查组发现了可能的线索——一扇后户之门。\n\n然而就在她们尝试进入后户之门，去找某位贤者的麻烦时，这扇后门却突然的被关闭了。虽然不知道异变的缘由，但终归异常现象得到了解决，§H[This.GetName]§!恢复了正常。"
 th_anomaly.48.name: "石樱异变"
 th_anomaly.48.desc: ""
 th_anomaly.48.a: "又来？"
