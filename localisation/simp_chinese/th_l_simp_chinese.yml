 toho.8023.name: "§B星际搜索§!"
 toho.8023.desc: "在对§H[From.solar_system.GetName]§!周围进行了一段时间的调查后，§H[Root.GetName]§!成功找到了一些有意义的东西——一座疑似发射站的东西和一台位于顶部的大型射电望远镜。"
 toho.8023.a: "有意思。"
 toho.8024.name: "§B一无所获§!"
 toho.8024.desc: "在对§H[From.solar_system.GetName]§!周围进行了一段时间的调查后，§H[Root.GetName]§!最终得出结论——这里确实什么也没有。"
 toho.8024.a: "怎么这样。。。"
 site_touhou_astral_signals: "§B被遗忘的观星者§!"
 site_touhou_astral_signals_intro: "这颗星球上静静的矗立着一座由发射站与大型射电望远镜组成的建筑，$touhou_astral_signals$似乎就是从中传出。"

 # 六十年不见的紫香花
 toho.8026.name: "无缘塚的花开"
 toho.8026.desc: "最近，无缘塚中的地上盛开着彼岸花，周围生长着成片的紫之樱，彼岸花与紫之樱一起盛开的场景非常凄美。根据一些妖怪们的回忆，每60年这些紫之樱便会开放的格外繁盛，而当紫之樱盛开的时候，无缘塚的亡者会解开迷惘，踏上去往三途河的中有之道。\n\n然而，这次的情况有点出人意料。\n到了本该恢复的时候，这里的樱花花瓣并没有停止散落，也没有停止盛放。\n\n「说着马上就好，马上就好什么的。\n究竟到何时樱花才能变回原貌呀。」\n谁也说不清呢。"
 toho.8026.a: "也许很快就能恢复原状了吧。"
 toho.8027.name: "前兆"
 toho.8027.desc: "渐渐的，人们开始发现情况有点失控，幻想乡中全年的花都莫名其妙的盛开了，一些年长的妖怪则想起了曾经幻想乡内120季春天时的一场异变。\n\n虽然表象上只是花的数量异常增多还违反季节的盛开，但是在灵力强大的个体眼里，可就不一样了。\n「虽然被花给迷惑了，\n但仔细看看根本到处都是幽灵啊。」\n\n不过目前还没有引起什么太严重的事，所以大部分人还是当作无事发生。"
 toho.8028.name: "幽灵暴走"
 toho.8028.desc: "事情开始不对劲起来了，大量的幽灵突然出现在了各处，由于幽灵的体温非常低，各地开始出现了冻伤的报告。而且一些人从此前的沉默寡言变得充满了活力，一些人则变得忧郁起来。\n\n根据冥界的解释，幽灵的可怕在于能够影响附近居民的精神，精神力不强的人若遇到强力的幽灵，有可能会被精神破坏，但目前冥界对于这一幽灵暴走的情况也暂时没有对策。"
 toho.8029.name: "花之异变"
 toho.8029.desc: "针对这次异变，我们已经将其命名为花之异变，在[Root.GetRulerTitle]的带领下，我们开始了对这一异变的调查。不过奇怪的是，那些年长的妖怪们仿佛对此事无动于衷，也不愿意参与调查。"
 toho.8029.affect: "§H境内开始受到花之异变影响的星球: §!"
 touhou_flower_incident: "§B花之异变§!"
 touhou_flower_incident_title: "$touhou_flower_incident$"
 touhou_flower_incident_desc: "全年的花都莫名其妙的盛开了，而在其中紫香花与彼岸花尤其更甚。除此之外幽灵也开始在这些星球上爆发，我们需要想办法解决这次的异变。"
