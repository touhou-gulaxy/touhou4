 gensokyo_start.1145.desc: "§E$spth_time_info$\n$spth_season_info$\n§!§H本界面将提供对《东方繁星录》的设置调整功能，也可以在这里查询更新日志、相关概念等内容。§!\n§Y本mod仅在《Stellaris》的Steam创意工坊上§!§B免费§!§Y提供，任何收费获取本mod的来源均为盗版，请勿上当受骗。§!\n§E当前版本：$spth_version$§!\n§E正式更新时间：$spth_version_date$§!\n\n§Y更新内容：§!\n§L$spth_latest_update_info$§!\n\n§B往期更新日志§!：\n$spth_history_update_info$"
