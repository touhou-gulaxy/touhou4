 mod_country_touhou_system_warper_system_warp_cooldown: "跃迁冷却"
 mod_country_touhou_system_warper_attack_cooldown: "跨星系打击冷却"
 requires_no_existing_touhou_system_warper: "$TRIGGER_FAIL$我们无法建造更多的先进跃迁引擎。"
 touhou_system_warper_base: "隙间一型 - 先进跃迁引擎: 建造基址"
 touhou_system_warper_base_DESC: "这个大型的平台存放的资源将会被用于建造隙间一型 - 先进跃迁引擎。"
 touhou_system_warper_base_MEGASTRUCTURE_DETAILS: "这种先进的跃迁引擎是一种§Y试验性设计§!的产物，不过由于维护能力不足，我们只能最多建设§Y1§!台先进跃迁引擎。"
 touhou_system_warper_stage_1: "隙间一型 - 先进跃迁引擎: 隙间发生器"
 touhou_system_warper_stage_1_DESC: "建造这台巨型跃迁引擎的隙间发生器环带，使其可以初步的引导我们进行跃迁以及小功率的舰队投送。"
 touhou_system_warper_stage_2: "隙间一型 - 先进跃迁引擎: 灵力引导环"
 touhou_system_warper_stage_2_DESC: "建造这台巨型跃迁引擎的灵力引导环结构，让它可以更精确的控制更大的能量流，从而实现功率上的提升。"
 touhou_system_warper_stage_3: "隙间一型 - 先进跃迁引擎: 结构稳定壳层"
 touhou_system_warper_stage_3_DESC: "建造结构稳定壳层，维持其结构稳定性，使得我们可以向这台巨型跃迁引擎输入更多的灵力与能量。"
 touhou_system_warper_stage_4: "隙间一型 - 先进跃迁引擎: 引力发生器"
 touhou_system_warper_stage_4_DESC: "建造这台巨型装置的最后一部分，安装一系列的引力发生极，并且组成引力发生阵列，这些阵列可以用于更精确的控制这台跃迁引擎的功能，并且可以作为大规模杀伤性武器使用。"
 touhou_system_warper: "隙间一型 - 先进跃迁引擎"
 touhou_system_warper_DESC: "这种先进的巨型跃迁引擎可以协调引导我们舰船的跃迁与超光速能力，并且可以将舰队投射到§Y极远的地方§!。同时在特定的灵力环境下，其还可以消耗巨量的灵力和能源从而使§H整个星系§!转移进入§M隙间§!，并借此完成§Y移动星系§!的壮举。同时其还可以作为一种§H远程打击§!的武器，向遥远的星系投射毁灭性的§Y引力扭曲§!与§U灵力能量§!，重创其中的舰队或者引爆其恒星。"
 touhou_system_warper_system_jump: "隙间一型 - 先进跃迁引擎: 星系跃迁"
 touhou_system_warper_system_jump_DESC: "通过消耗巨量的灵力和能源从而使§H整个星系§!转移进入§M隙间§!，并借此完成§Y移动星系§!的壮举。"
 touhou_system_warper_self_jump: "隙间一型 - 先进跃迁引擎: 移动自身"
 touhou_system_warper_self_jump_DESC: "我们可以随时移动这座巨型跃迁引擎到我们想要的星系中去。"
 touhou_system_warper_attack: "隙间一型 - 先进跃迁引擎: 跨星系打击"
 touhou_system_warper_attack_DESC: "这座先进的巨型跃迁引擎也可以作为大规模杀伤性武器使用，其可以开辟隙间裂口，运用灵力接口和引力发生阵列，向遥远的星系投射毁灭性的§Y引力扭曲§!与§U灵力能量§!，重创其中的舰队或者引爆其恒星。"
 touhou_system_warper_cooldown: "$TRIGGER_FAIL$该功能冷却中。"
 touhou_system_warper_opened_function: "$TRIGGER_FAIL$先进跃迁引擎执行其他指令中。"
 toho.4200.desc: "该星系选择器用于选择§H跨星系攻击§!坐标，使用方法为将你的鼠标§H选中§!星系中的任意§H星球/舰队§!，然后点击确认按钮即可。"
 toho.4203.desc: "随着我们的§H巨型跃迁引擎§!完成了它熄灭星辰的任务，在狂暴的灵力能量流与引力扭曲作用下，§H[From.GetName]§!的亮度瞬间提升了数百倍，随后逐渐暗淡下去，传感器表明这颗星星已经塌缩成了一个奇点，大部分§H[From.GetName]§!毁灭时释放的致命的能量被§H[From.From.GetName]§!引导到用于彻底坍缩这个奇点，剩余的一小部分则被引导到了§H[From.solar_system.GetName]§!恒星系内的其他天体上，将这些星球炸的四分五裂。\n\n§H[From.GetName]§!死亡时发出的黯淡而又耀眼的光芒将作为象征着我们国家的实力的纪念碑，在之后的数千年间被无数文明持续观察到。"
 toho.4205.desc: "该星系选择器用于选择§H巨型跃迁引擎跃迁§!坐标，使用方法为将你的鼠标§H选中§!星系中的任意§H星球/舰队§!，然后点击确认按钮即可。"
 toho.4206.desc: "该星系选择器用于选择§H星系跃迁§!坐标，使用方法为将你的鼠标§H选中§!星系中的任意§H星球/舰队§!，然后点击确认按钮即可。"
 toho.4207.name: "§H星系跃迁§!"
 toho.4207.desc: "我们的巨型跃迁引擎可以开辟一个星系大小的隙间裂口，并且将星系传送进隙间，之后再传送到想要的目的地附近，但是由于我们隙间技术的不足，我们只能同时维持§Y1§!座先进跃迁引擎。\n\n你可以在这里控制将§H[FromFrom.GetName]§!星系跃迁到§H[From.GetName]§!星系附近时，二者之间的距离、方位角，以及是否要生成超空间航道。在确认跃迁之后，§H[FromFrom.GetName]§!星系将会瞬间跃迁到§H[From.GetName]§!星系附近指定的位置。\n\n每次跃迁由于需要§R巨大的能量§!，并且会给§M隙间空间§!带来额外的负担，因此我们的巨型跃迁引擎需要大约§Y[GetTouhouSystemWarperSystemJumpCooldown]§!£time£进行冷却。"
 toho.4207.a: "§G使用随机角度§!"
 toho.4207.b: "§G使用随机距离§!"
 toho.4207.c: "§G跃迁后生成航道§!"
 toho.4207.a.alt: "§R不使用随机角度§!"
 toho.4207.b.alt: "§R不使用随机距离§!"
 toho.4207.c.alt: "§R跃迁后不生成航道§!"
 toho.4207.d: "§E进行星系跃迁§!"
 toho.4207.e: "§L刷新冷却时间§!"
 touhou_system_warper_distance_fail_upper_limit: "$TRIGGER_FAIL$跃迁坐标与目标星系距离不得高于50。"
 touhou_system_warper_distance_fail_lower_limit: "$TRIGGER_FAIL$跃迁坐标与目标星系距离不得小于0。"
 touhou_system_warper_angel_fail_upper_limit: "$TRIGGER_FAIL$跃迁方位角不得高于360。"
 touhou_system_warper_angel_fail_lower_limit: "$TRIGGER_FAIL$跃迁方位角不得小于0。"
 touhou_system_warper_distance: "距离：[From.touhou_system_warper_distance]"
 touhou_system_warper_angel: "方位角：[From.touhou_system_warper_angel]"
 toho.4208.name: "§H星系跃迁完成§!"
 toho.4208.desc: "随着§H[From.GetName]§!星系中我们的§Y巨型跃迁引擎§!启动，巨量的灵力与能量被输入了其中心的§M隙间发生器§!核心，这座巨型结构上的所有工作人员都能听到轻微的嗡嗡声，这是§H现实§!与§M隙间§!之间的帷幕在星系尺度上被撕裂所产生的背景噪声——随着更多的能源涌入引力发生器，整个§H[From.GetName]§!星系正在缓慢的沉入§M隙间§!之中。\n\n在极短的时间后，在§H[FromFrom.GetName]§!附近的一片虚空中，现实再次被撕裂，尽管§H[From.GetName]§!内没有什么感觉，但来自§H[Root.GetName]§!其他星系中的天文观测报告表明§H[From.GetName]§!星系已经完成了跃迁，成功抵达了目标位置。\n\n这是我们首次见证§Y星系规模§!的§H隙间跃迁§!，星系在现实位置的改变产生了极大的引力扰动，这次事件产生的引力波将在将来的§Y数千乃至数万年内§!都能被星系中的其他文明观测到，这是§H[Root.GetName]§!科技实力的永恒体现。"
 toho.4208.desc.alt: "随着§H[From.GetName]§!星系中我们的§Y巨型跃迁引擎§!启动，巨量的灵力与能量被输入了其中心的§M隙间发生器§!核心，这座巨型结构上的所有工作人员都能听到轻微的嗡嗡声，这是§H现实§!与§M隙间§!之间的帷幕在星系尺度上被撕裂所产生的背景噪声——随着更多的能源涌入引力发生器，整个§H[From.GetName]§!星系正在缓慢的沉入§M隙间§!之中。\n\n如之前一样，在极短的时间后，在§H[FromFrom.GetName]§!附近的一片虚空中，现实再次被撕裂，尽管§H[From.GetName]§!内没有什么感觉，但来自§H[Root.GetName]§!其他星系中的天文观测报告表明§H[From.GetName]§!星系已经完成了跃迁，成功抵达了目标位置。\n\n我们再次成功进行了§Y星系规模§!的§H隙间跃迁§!，星系在现实位置的改变产生了极大的引力扰动，这次事件产生的引力波将在将来的§Y数千乃至数万年内§!都能被星系中的其他文明观测到，这是§H[Root.GetName]§!科技实力的永恒体现。"
 toho.4208.a: "棒极了。"
 toho.4208.b: "这将是[Root.GetAdj]科技实力的一次永恒见证。"
 toho.4211.name: "§H巨构跃迁完成§!"
 toho.4211.desc: "随着§H[From.GetName]§!星系中我们的§Y巨型跃迁引擎§!启动，巨量的灵力与能量被输入了其中心的§M隙间发生器§!核心，这座巨型结构上的所有工作人员都能听到轻微的嗡嗡声，这是§H现实§!与§M隙间§!之间的帷幕在大尺度上被撕裂所产生的背景噪声——随着更多的能源涌入引力发生器，这座§H巨大的跃迁引擎§!正在缓慢的进入§M隙间§!之中。\n\n在极短的时间后，在§H[FromFrom.GetName]§!的引力井边缘，现实再次被撕裂，巨大的先进跃迁引擎逐渐重新进入现实空间，§H这座巨型结构§!已经完成了跃迁，成功抵达了目标位置。"
 toho.4211.a: "棒极了。"
 toho.4211.b: "这将是[Root.GetAdj]科技实力的一次永恒见证。"
 toho.4212.name: "§H隙间一型 - 先进跃迁引擎: 建造基址§!"
 toho.4212.desc: "部署于§H[From.GetName]§!引力井边缘的深空建筑基址已经准备完毕，一旦相关资源就位，我们就可以开始这座奇迹般的巨型结构下一个阶段的建设工作。"
 toho.4212.a: "§Y千里之行，始于足下。§!"
 toho.4213.name: "§H外星巨型结构开始建设§!"
 toho.4213.desc: "我们的情报部门表明§H[From.GetName]§!正在§H[FromFrom.GetName]§!星系的引力井边缘建造一座被他们称为§Y“隙间一型 - 先进跃迁引擎”§!的奇迹巨构，他们似乎正在计划利用这座巨型结构进行§Y星系级别§!的跃迁。"
 toho.4214.name: "§H隙间一型 - 先进跃迁引擎: 隙间发生器§!"
 toho.4214.desc: "我们已经成功完成了这座奇迹般的巨型结构的核心结构，这部分负责使用能量与灵力从而开辟隙间进行航行，但是其功率尚且不足。\n\n因此接下来，我们需要建造这台巨型跃迁引擎的隙间发生器环带，使其可以初步的引导我们进行跃迁以及小功率的舰队投送。"
 toho.4215.name: "§H隙间一型 - 先进跃迁引擎: 灵力引导环§!"
 toho.4215.desc: "我们成功完成了隙间发生装置的安装与调试，现在这部分结构已经可以引导我们舰队进行航行了，甚至可以开辟隙间来小范围的投送我们的舰队。\n\n下一步就是建造这台巨型跃迁引擎的灵力引导环结构，让它可以更精确的控制更大的能量流，从而实现功率上的提升。"
 toho.4216.name: "§H隙间一型 - 先进跃迁引擎: 结构稳定壳层§!"
 toho.4216.desc: "随着巨大的环带开始环绕这座巨型结构中心运转，这座巨型结构的功率与功能得到了进一步的提升。接下来，建造结构稳定壳层，维持其结构稳定性，使得我们可以向这台巨型跃迁引擎输入更多的灵力与能量。"
 toho.4217.name: "§H隙间一型 - 先进跃迁引擎: 引力发生器§!"
 toho.4217.desc: "巨大的壳层笼罩在跃迁引擎的核心部分，现在这台奇迹般的巨型结构已经几乎有小半个星系大小了。这台巨型装置的最后一部分，便是安装一系列的引力发生极，并且组成引力发生阵列，这些阵列可以用于更精确的控制这台跃迁引擎的功能，并且可以作为大规模杀伤性武器使用。"
 toho.4218.name: "§H隙间一型 - 先进跃迁引擎: 完工§!"
 toho.4218.desc: "这座巨型结构最后一个部分，或者说，至少是进行§Y星系规模的跃迁§!所必须的最后一个部分，已经完成了。随后我们对这座§Y接近整个§H[From.GetName]§!星系大小§!的巨型结构的功能进行了初步的测试，确认了其隙间发生装置和引力控制单元可以正常运转。\n\n正如当初第一台能够跨恒星系航行的FTL引擎被创造出来的那个时刻一样，在这个值得庆祝的日子里，我们第一次获得了§Y移动整个星系§!的能力。如此巨大规模的跃迁必然要消耗磅礴的能量，不过这也代表了§H[Owner.Species.GetName]§!第一次获得了可以随意编辑河系及其引力结构的能力。"
 toho.4219.name: "§H外星巨型结构完工§!"
 toho.4219.desc: "我们的情报部门与天文部门的观测结果表明§H[From.GetName]§!在§H[FromFrom.GetName]§!星系的引力井边缘建造的巨型结构已经完成了。\n\n这座惊人的巨型结构的大小与质量似乎已经接近了§H整个星系§!，以至于产生了明显的引力扭曲。"

 toho.4220.name: "星界探索舰队：启航"
 toho.4220.desc: "在$spth_makai_wedge_0$这座先进的巨型结构的帮助下，我们的星界探索舰队已经做好了跨越§H现实§!与§H魔界位面§!之间§Y星界壁垒§!的准备。由于这两个位面之间的星界壁垒比正常情况下的要§I更厚§!，因此也只有§H$spth_precursor.makai$§!的技术能到办到这一点。\n\n随着大量的§Y星界丝缕§!与§Y暗物质§!被注入魔界遗留的巨构，一道§M空间裂隙§!短暂的被打开了，$spth_makai_wedge_0$上的所有工作人员都能听到轻微的噼啪声，这是现实与星界裂隙之间的帷幕被不断撕碎所产生的背景噪声，在我们输入的灵力作用下，这个裂隙刚好维持到足够支持我们的星界探索舰队全部进入其中。\n\n之后我们就只需要等待他们的好消息了。"
 toho.4220.a: "棒极了。"
 toho.4220.b: "也许以后我们也可以有如此先进的技术。"
 toho.4221.name: "魔界：超星系团投影"
 toho.4221.desc: "穿透星界壁垒抵达魔界位面后，我们的星界探索舰队立刻开始了天文学方面的观察。这个位面的物理定律似乎与现实位面的物理定律高度一致，考虑到§H$spth_precursor.makai$文明§!曾经大规模移民迁居到这一位面，应该是他们在§Y创造这一位面§!时进行的刻意设计。\n\n简单来说，这一位面的空间大小虽然远小于现实位面的可观测宇宙范围，但也几乎是大半个§H室女座超星系团§!的§Y1：1§!复刻了。创造如此浩大的位面所需的能量已经远超我们的想象，§H$spth_precursor.makai$文明§!的技术水平看起来远比我们设想的要更加先进。"
 toho.4221.a: "惊了。"
 toho.4222.name: "魔界：超大质量黑洞"
 toho.4222.desc: "我们的星界探索舰队来到了一颗星系中央的超大质量黑洞附近。\n\n奇特的是，这颗超大质量黑洞居然是一颗高速自转中的克尔-纽曼黑洞，按理说这种质量的纽曼黑洞正常应该无法自然形成，因此极有可能是§H$spth_precursor.makai$文明§!人为干预形成的。在这颗黑洞附近还存在着环绕黑洞运行的材料未知的反射镜与激光发射极，其似乎是给附近的一座大型人造结构供能的装置。\n\n如果我们科学团队的猜测没错的话，这应该是一座利用彭罗斯过程采集黑洞角动量的巨构，并且将收集的能量输送到附近的那个人造结构。"
 toho.4222.a: "有点意思。"
 toho.4223.name: "魔界：人造结构"
 toho.4223.desc: "这座人造结构不知道经过了多少年岁月的洗礼，但其主要功能似乎还运作正常。\n\n我们在其内部找到的档案显示，这座设施是§H$spth_precursor.makai$文明§!建造的一座能源设施，通过人工制造大质量的纽曼黑洞来进行储能，换句话说这就是一颗§Y“黑洞电池”§!。它的设计寿命在§Y10^44§!年以上，甚至足够坚持到最后一颗星辰的熄灭。\n\n档案中还提到了希望发现者能够打开这座设施中心的某个冷冻仓，“这是§H$spth_precursor.makai$文明§!重新崛起的最后希望了”。"
 toho.4223.a: "让我们去那里看看。"
 toho.4224.name: "魔界：冬眠设施"
 toho.4224.desc: "档案中提及的位置似乎没法直接进入，于是我们星界探索舰队的爆破团队选择了破开墙壁来进入。\n\n这片空间似乎比实际上看起来都要更大，我们的科学部门推测应该运用了某种维度科技来做到“里面比外面大”。巨大的管线连接到了房间中央的竖立放置的冬眠仓，透明遮罩后方似乎是一位衣着华丽、背后生出羽翼的少女。控制面板上记录着她的身份——§Y魔界之神，神绮§!。\n\n我们是否要解除冷冻仓的冬眠程序呢？"
 toho.4224.a: "§G执行复苏程序。§!"
 toho.4224.b: "§R一切都结束了，过往之事就放下吧。§!"
 touhou_unfreeze_makai_shinki: "§M解锁冬眠仓§!"
 touhou_unfreeze_makai_shinki_DESC: "解锁我们之前发现的魔界冬眠仓。"
 toho.4225.name: "§M创世的魔神§! §H神绮§!"
 toho.4225.desc: "呃？\n你好？\n\n你们是？"
 toho.4225.a: "我们是§H[Root.GetSpeciesName]§!。"
 toho.4225.b: "很不幸，他们似乎已经灭亡了，至少不再有相同的文明认同了。"
 toho.4225.c: "如果测量准确的话，大概过去了数亿年以上的光阴了。"
 toho.4225.d: "所以那个时期大概是个什么情况呢？"
 toho.4225.e: "那么你现在打算怎么办？"
 toho.4225.f: "不如来加入§H[Root.GetName]§!吧"
 toho.4225.a.response: "§H[Root.GetSpeciesName]§!...\n是没听说过的文化呢。\n\n不过看起来你们和我们一样，都是可以运用灵力的物种...\n魔界文化现在怎么样了？"
 toho.4225.b.response: "看起来是没法重新复兴整个文明了...\n对了，现在大概是什么时间？\n距离那些事情的发生过去了多久？\n\n整个宇宙感觉和那时相比发生了巨大的变化，星空不再如当年一样暗淡，重元素含量也比那时要高..."
 toho.4225.c.response: "如此之久吗...\n\n物是人非，想必那些与我们曾经存在利益纠葛的文化也早已灭亡了吧。"
 toho.4225.d.response: "那个时期的宇宙可以说还比较年轻，时间可以让尘埃中亮起温暖的恒星，也能让明亮的星辰变成连光也无法逃脱的奇点，按你们的说法叫“宇宙造星运动”吧？\n\n你们可能会觉得这些活动很浪漫吧？不过对于文明的发展来说，这简直是处处充满挑战。重元素含量低到导致第一批文明踏入星海花费的时间难以想象的漫长、没有超空间航道使得FTL异常困难等等。我们这些文明只有研发出跃迁科技后才能正式步入星空，当时银河系有着许多的文化，但最终只有三个文化幸存了下来——我们、月之都和一群隙间妖怪。\n\n在繁荣时期，我们这些幻想的文化甚至可以跨越河系级别的遥远距离，让我们的后代遍布整个超星系团...然而一切文明都会终结，很不幸我们先后的陨落了。"
 toho.4225.e.response: "说实话我也不知道...\n\n我的文化还在的时候，我可以忙忙碌碌的管理整个文明...但是现在这一切都过去了，闲下来后我也没什么明确的目标了。"
 toho.4225.f.response: "那也行，虽然现在银河系和那时比还很荒凉，但我有信心把§H[Root.GetName]§!建设到足以与曾经的我们媲美。"
 toho.4225.effect: "§Y$NAME_shinki$作为指挥官加入了§H[Root.GetName]§!。§!"
 toho.4226.name: "星界探索舰队：返航"
 toho.4226.desc: "随着我们的探索任务基本结束，星界探索舰队准备从魔界位面返航到现实空间了。"
 toho.4226.a: "OK"
 toho.4226.b: "了解了。"
