 toho.4010.name: "§H国家选择器§!"
 toho.4010.desc.whitelist: "我们可以在这里设置魔界星界网络的安全策略，使用右边的按钮可以更改选择状态，高亮的选项表明它被选中了，在完成设置后，点击“确认”即可保存。\n\n当前设置：§H白名单§!\n只有白名单上的国家才有进入魔界星界网络的权限，当白名单为空时，仅有我们自己可以出入魔界星界网络。\n\n为了保证我们的安全策略能够正常生效，我们必须保持对星界网络主节点的控制，否则魔界星界网络就会像常规的星门网络一样受其当前的拥有者控制。"
 toho.4010.desc.blacklist: "我们可以在这里设置魔界星界网络的安全策略，使用右边的按钮可以更改选择状态，高亮的选项表明它被选中了，在完成设置后，点击“确认”即可保存。\n\n当前设置：§H黑名单§!\n只有黑名单上的国家才会被拒绝进入魔界星界网络，当黑名单为空时，任何势力都可以随意出入魔界星界网络，除非我们向它们关闭了边境。\n\n为了保证我们的安全策略能够正常生效，我们必须保持对魔界星界网络主节点的控制，否则魔界星界网络就会像常规的星门网络一样受其当前的拥有者控制。"
