 toho.8108.name: "§B幻想星环§!区段被修复"
 toho.8108.desc: "基于§H[spth_rw_system.GetName]§!星系的幻想星环废墟，我们的工程师成功地将它的一个区段恢复运转。全新的环形世界生态结构根据§M远古先驱§!遗留的资料进行了复刻与改进，现在它已经足够稳定，可以居住了。\n\n更令人兴奋的是，在完成修复后其开始了自动化建设进程，这应该也是先驱的设计之一。"
 toho.8109.name: "§B幻想星环§!建设完成"
 toho.8109.desc: "今天，我们的工程师和行星生态学家完成了位于§H[spth_rw_system.GetName]§!星系的环形世界最后一个宜居区间的建造。这个伟大的巨型结构的建造必将成为§H[Root.GetName]§!历史的里程碑。我们完成了屈指可数的文明才能完成的工作。\n\n让这个环形世界成为一个永恒的见证：自从我们从安全的母星踏足至如今，我们达成了什么样的成就。"
 toho.8110.name: "§B幻想城§!已在[Root.GetName]建设完成"
 toho.8110.desc: "层层叠加的幻想城终于完全覆盖了星球的地表。\n\n自从这一宏大计划开始实施以来仅仅过了数年，但已经很难回想起§H[Root.GetName]§!从前的面貌。翠绿的丛林？崎岖的山脉？现在放眼望去，四面八方都是延绵不绝的钢铁。\n\n这里曾经由自然法则任意塑造，而现在则成了由科技与幻想融合而成的设计。"
 toho.8111.name: "§B幻想星环§!已在[Root.GetName]建设完成"
 toho.8111.desc: "我们已经完成了对于环形世界的改造。\n\n自从这一宏大计划开始实施以来仅仅过了数年，但已经很难回想起§H[Root.GetName]§!从前的面貌。"
 toho.8112.name: "§B幻想星§!已在[Root.GetName]建设完成"
 toho.8112.desc: "随着磅礴的灵力在§H[Root.GetName]§!之上翻涌，我们已经完成了对星球的幻想星化改造。这里的一切都按照曾经幻想乡的面貌进行设计，灵力充沛的环境更是让人感到极度舒适。"

 toho.8115.name: "安抚太空变形虫"
 toho.8115.desc: "不知为何，我们的舰队似乎会激怒太空变形虫。要是能够确定其原因，也许就能降低变形虫的侵略性，甚至将我们的舰队从其感官中完全屏蔽。\n\n不过古明地觉提出，她可以尝试利用自己读心的能力去了解这些太空变形虫敌对的原因，甚至直接安抚它们。"
 toho.8115.a: "$TH_SO_INTERESTRING$"
 toho.8116.name: "安抚狂怒巨兽"
 toho.8116.desc: "我们的§H[From.GetName]§!陷入了狂怒之中，现在正在寻找攻击的目标来满足祂的永恒饥饿。不过古明地觉提出，她可以尝试利用自己读心的能力去尝试安抚祂，当然我们也可以选择放任巨兽满足自己的欲望，这样也可以缓解我们与巨兽链接带来的永恒饥饿。"
 toho.8116.a: "可以。"
 toho.8116.b: "放任巨兽吧。"

 toho.8409.name: "§U虚境§!"
 toho.8409.desc: "我们来到了一片灵能风暴的边缘，在远方的风暴中心，一些灵能反应若隐若现，奇怪的是，它们似乎不是单纯的灵能活动，相反，它们似乎混入了一些奇特的反应。\n\n这些奇怪的现象的让我们的灵能者们感到熟悉，似乎，我们曾经在某个地方见过它们，也许这值得我们注意。"
 toho.8409.a: "观察这一现象。"
 toho.8410.name: "§U灵力反应§!"
 toho.8410.desc: "我们的灵能者们冒着陷入疯狂甚至失去生命的风险，凝神观察了那些在风暴中闪闪发光的灵能活动模式，毫无疑问，这些模式中存在着灵力的痕迹。\n\n在变幻莫测的灵能风暴中，空间以一种我们难以理解的方式展开，这使得我们的灵能者们能够观测到具体的形式，从而理解了将灵能与结界结合的技术。\n\n被灵能扭曲的防御手段，比常规的版本更加强大。"

 toho.8411.name: "§U虚境§!"
 toho.8411.desc: "我们来到了虚境中一片诡异的区域，这片区域位于比我们平时所认知的虚境更“深”的位置，只有在灵能环境的活跃程度恰到好处时，我们的灵能者才能深入这样的区域而且不会被过分活跃的灵能活动杀死。\n\n这片区域的诡异之处在于，其中的灵能活动包含着一系列有规律的背景噪声，某种未知的灵能现象将很久很久以前在遥远的河外星系发生的灵能活动保存在了这里，直至今日仍有微弱的回响。\n\n这是一次难得的观测河外星系灵能活动的机会，虽然制造这些灵能活动的外星文明可能已经消失了很久，但是它们的灵能科技水平远在我们之上，我们的灵能者认为我们可以从中学到一些有用的东西。"
 toho.8411.a: "观察灵能活动。"
 toho.8412.name: "§U近防灵能武器§!"
 toho.8412.desc: "我们的灵能者成功从灵能活动的背景噪声中还原出了一部分古代灵能活动的情况，神奇的是，这一部分的灵能活动特征似乎包含着灵力的部分。\n\n毫无疑问，制造那些灵能活动的外星文明有着远超我们的灵能科技水平，而且似乎和我们一样运用着灵力。这些灵能活动中似乎包含着某种设计数据，描述了基于灵能与灵力的一种裂解武器，适合短程近防。"

 toho.8413.name: "§U虚境§!"
 toho.8413.desc: "我们来到了虚境中一片诡异的区域，这片区域位于比我们平时所认知的虚境更“深”的位置，只有在灵能环境的活跃程度恰到好处时，我们的灵能者才能深入这样的区域而且不会被过分活跃的灵能活动杀死。\n\n这片区域的诡异之处在于，其中的灵能活动包含着一系列有规律的背景噪声，某种未知的灵能现象将很久很久以前在遥远的河外星系发生的灵能活动保存在了这里，直至今日仍有微弱的回响。\n\n这是一次难得的观测河外星系灵能活动的机会，虽然制造这些灵能活动的外星文明可能已经消失了很久，但是它们的灵能科技水平远在我们之上，我们的灵能者认为我们可以从中学到一些有用的东西。"
 toho.8413.a: "观察灵能活动。"
 toho.8414.name: "§U大型灵能武器§!"
 toho.8414.desc: "我们的灵能者成功从灵能活动的背景噪声中还原出了一部分古代灵能活动的情况，神奇的是，这一部分的灵能活动特征似乎包含着灵力的部分。\n\n毫无疑问，制造那些灵能活动的外星文明有着远超我们的灵能科技水平，而且似乎和我们一样运用着灵力。这些灵能活动中似乎包含着某种设计数据，描述了基于灵能与灵力的一种大型裂解武器。"

 toho.8415.name: "§U虚境§!"
 toho.8415.desc: "我们来到了虚境中一片诡异的区域，这片区域位于比我们平时所认知的虚境更“深”的位置，只有在灵能环境的活跃程度恰到好处时，我们的灵能者才能深入这样的区域而且不会被过分活跃的灵能活动杀死。\n\n这片区域的诡异之处在于，其中的灵能活动包含着一系列有规律的背景噪声，某种未知的灵能现象将很久很久以前在遥远的河外星系发生的灵能活动保存在了这里，直至今日仍有微弱的回响。\n\n这是一次难得的观测河外星系灵能活动的机会，虽然制造这些灵能活动的外星文明可能已经消失了很久，但是它们的灵能科技水平远在我们之上，我们的灵能者认为我们可以从中学到一些有用的东西。"
 toho.8415.a: "观察灵能活动。"
 toho.8416.name: "§U重型灵能武器§!"
 toho.8416.desc: "我们的灵能者成功从灵能活动的背景噪声中还原出了一部分古代灵能活动的情况，神奇的是，这一部分的灵能活动特征似乎包含着灵力的部分。\n\n毫无疑问，制造那些灵能活动的外星文明有着远超我们的灵能科技水平，而且似乎和我们一样运用着灵力。这些灵能活动中似乎包含着某种设计数据，描述了基于灵能与灵力的一种超重型反舰裂解武器。"

 toho.8417.name: "§U灵能颤抖§!"
 toho.8417.desc: "我们的灵能者失败了，那些未知的灵能活动遗留的背景噪声过于微弱，且始终存在着某种奇怪的干扰，因此我们的灵能者没能看出任何有意义的东西。\n\n更糟糕的是，我们的灵能者们过于专注于观察灵能活动的背景噪声了，以至于他们完全没注意到周围的灵能环境已经悄然发生了变化，突如其来的灵能冲击对我们的灵能者造成了严重的伤害，而且那些诡异的灵能能量还随着我们的灵能者传遍了整个[Root.GetName]全境——我们的生产效率下降了。"
 touhou_shroud_debuff_effiency: "灵能震颤"
 touhou_shroud_debuff_effiency_desc: "灵能冲击对我们的生产效率产生了负面影响。"

 toho.8418.name: "§U虚境§!"
 toho.8418.desc: "我们来到了虚境中一片荒芜的区域，这片区域位于比我们平时所认知的虚境更“深”的位置，只有在灵能环境的活跃程度恰到好处时，我们的灵能者才能深入这样的区域而且不会被过分活跃的灵能活动杀死。\n\n这片区域的诡异之处在于，这里莫名其妙的聚集了一大群灵能实体，有些看上去是虚境中的原住民，而另一些显然是外来的。我们的灵能者很快便发现了一些特别的灵能实体，它们散发着熟悉的灵力特征，而且，它们正在互相攻击，似乎正在争夺着什么。\n\n我们的灵能者们有机会趁着那些灵能实体忙于互相攻击时仔细地观察它们的细节，毕竟，那些灵能实体看上去相当有趣。"
 toho.8418.a: "观察灵能实体。"
 toho.8419.name: "§U灵能化生命§!"
 toho.8419.desc: "借助我们所处的地域的优势，我们的灵能者们能够较为轻松地看清那些灵能实体的细节。\n\n它们是一些古老、破碎的灵能意识，似乎是某些具备灵力的存在灵能化后的生命，而且他们也依旧可以利用自己体内灵能构成的某种结构运用灵力。这证实了我们之前的一些猜测，即灵力可以被复杂结构所操纵，并且生命在被灵能化后依旧可以保留自己的意识。\n\n不过考虑到一些伦理上的问题，我们决定只研究对部分器官进行灵能化的技术。"
 toho.8420.a: "观察灵能实体。"
 toho.8420.name: "§U灵能颤抖§!"
 toho.8420.desc: "我们的灵能者希望借助我们所处的地域优势来观察那些灵能实体，但与此同时，那些灵能实体也注意到了我们的灵能者。突然间，它们停止了互相之间的争斗，转而向我们的灵能者们发动攻击！\n\n我们的灵能者完全没有做好应对袭击的准备，因此在逃离现场的过程中损失惨重。更糟糕的是，他们引发的灵能冲击对我们的灵能者造成了严重的伤害，而且那些诡异的灵能能量还随着我们的灵能者传遍了整个[Root.GetName]全境——我们的生产效率下降了。"

 toho.8421.name: "§U虚境§!"
 toho.8421.desc: "我们来到了虚境中一片奇特的区域，这里灵能活动平缓，漫天繁星闪耀，灵能者们决定前往那些§H“星星”§!的附近一窥真相。漫长等待后，他们抵达了一处虚境与现实的屏障异常薄弱的区域，比起虚境，这里更像是现实世界，周围稀薄的灵能环境都难以被察觉，除了，中央那个异常巨大且令任何灵能者都无法忽略的§H虚境空洞§!。\n\n毫无疑问，这片区域绝对不是自然形成的，而是某种§R庞大的灵能活动§!造成的，这种灵能活动的力量之强、持续时间之久都远超我们的灵能者可以想象的范畴，以至于在§H拉尼凯尼亚超星系团§!中都留下来§R永久的印记§!。根据推测，此前我们见到的那些§H“星星”§!，应该都是与之类似的巨大虚境空洞。而且这处空洞的中央区域中，狂暴的灵能能量流不断的向最中心的某个发光奇点落去，无数的灵能实体尖叫着试图逃离这里，然而直接被这股能量流裹挟卷走，这处足以令灵能者精神失常的景象一直延伸到了我们无法触及的虚境深层。\n\n我们的灵能者希望能够观察灵能活动特征，以了解这里到底发生过什么。"
 toho.8421.a: "§R调查灵能活动特征。§!"
 toho.8422.name: "§G虚境空洞研究§!"
 toho.8422.desc: "我们的灵能者继续观察着这处空洞，突然间，一个如同超主般强大的灵能实体出现在他们眼前，要求我们做出进入这里的解释。\n\n§H我们渴望这里的知识。§!\n\n在一阵窃窃私语后，它同意了赐予我们知识——我们所在的区域，是一处先进文明的遗存建造的、源源不断的从虚境中抽取能量的奇点造成的，在这些奇点的影响下，这片区域的灵能在漫长的时间中几乎被抽干殆尽，所幸虚境的灵能能量会缓慢的回复，然而刚恢复的灵能便已被某个存在于现实中的导管设施抽干。\n\n如果我们的灵能者观测正确的话，这片区域对应现实空间的位置应该是——§H拉尼凯尼亚超星系团§!中心的巨引源，而根据奇点附近隐约投射出来的现实空间影像表明，那里存在着一个环绕着超大质量黑洞的巨型居住站，很有可能那个巨引源便是这处居住站。更恐怖的是，之前观测到的部分星星的位置突然发生了移动，似乎现实空间中有什么能够移动的巨大物体在源源不断的抽取中的灵能能量。\n\n根据观测结果，结合我们的灵力技术，也许可以设计出类似的、但是规模远远小于那些奇点的设施，为我们生产物质与能量。"
 toho.8423.name: "§R灵能攻击§!"
 toho.8423.desc: "我们的灵能者尝试观察这处空洞，然而某个如同超主般强大的灵能实体似乎注意到了我们，向我们的灵能者们发动攻击！\n\n我们的灵能者完全没有做好应对袭击的准备，因此在逃离现场的过程中损失惨重。更糟糕的是，他们引发的灵能冲击对我们的灵能者造成了严重的伤害，而且那些诡异的灵能能量还随着我们的灵能者传遍了整个§H[Root.GetName]§!全境——我们的生产效率下降了。"
 toho.8424.name: "§R灵能震爆§!"
 toho.8424.desc: "我们的灵能者尝试观察这处空洞，以及其周围徘徊着的灵能实体。这些灵能实体宛如超主一般强大，它们看起来是现实空间某些具备强大灵能力量的§H人工智能§!的投影，而在我们的常规认知中，合成智能不可能具备如此强大灵能。\n\n但与此同时，那些灵能实体也注意到了我们的灵能者，其入侵了我们灵能者的心灵，在我们撤退的时候，现实空间的§H[Root.Capital.GetName]§!上似乎打开了一个传送门，一股强大的灵能震爆攻击了我们的殖民地，造成了重大损失。"

 toho.8425.name: "§U虚境§!"
 toho.8425.desc: "我们聆听到了一阵缥缈却又低沉的声音，我们的超主将我们引向了祂的灵能领域。\n\n§H吾可以引导你灵能的运用。§!\n\n祂答应向我们提供灵能相关的见解，有关我们的武器的改进，前提是我们需要给祂一些泽洛。"
 toho.8425.a: "§Y向超主寻求启示。§!"
 toho.8426.name: "§G武器设计§!"
 toho.8426.desc: "在超主的引导下，我们成功改进了我们现有一种武器的设计。\n\n我们离开了超主的灵能领域。"
 toho.8427.name: "§R灵能冲击§!"
 toho.8427.desc: "我们的灵能者失败了，他们未能成功引导灵能能量，因此我们的灵能者没能看出任何有意义的东西。\n\n更糟糕的是，我们的灵能者们没有注意到周围的灵能环境已经悄然发生了变化，突如其来的灵能冲击对我们的灵能者造成了严重的伤害，而且那些诡异的灵能能量还随着我们的灵能者传遍了整个[Root.GetName]全境——我们的生产效率下降了。"
 toho.8428.name: "§U虚境§!"
 toho.8428.desc: "这次我们来到了虚境中更深层的地方，在我们当中幻想灵媒的灵力引导下，加上灵能环境足够适宜，我们成功抵达了常规文明几乎不可能前往的虚境浅层与深层交界处，这里汹涌的灵能活动非常不适合生命居住，哪怕是那些称霸一方的超主也很少前来这里。\n\n我们的灵能者注意到，这里残留着某种远古时期激烈战斗留下的灵能活动模式，似乎这片区域的灵能活动比这里的其它区域要平静很多。按理说这里的灵能能级应该很高，然而某些古代遗留的干扰源使得这里的灵能模式接近表层虚境。一阵耀眼的闪光突然爆发，我们的灵能者们感受到了某些虚无的东西压迫着他们的心灵，甚至短暂削弱了他们的灵能能力。如果不是及时打开了灵能屏障，我们也许会被直接驱逐出虚境。\n\n针对这一有趣的现象，我们也许可以进行一次简单的调查。"
 toho.8428.a: "§Y尝试提取灵能活动数据。§!"
 toho.8429.name: "§G灵能抑制场§!"
 toho.8429.desc: "这片区域似乎还遗留着某些灵能回音，结合灵能活动的数据，我们的灵能者理解了这里的那些干扰源——这处地方曾经是§H月之都§!中§H两个派系§!之间短暂内战的一处战场，他们之中的灵能派系渴望利用灵能与灵力的能力，进入深层虚境之中汲取几乎无穷的能量，而现实派系则担心灵能的过度使用会影响星系中的灵能环境。\n\n在这场短暂的内战中，月之都中占主流的现实派系开发出了灵能抑制场发射器，用于对抗灵能派系那强大的灵能。这些武器可以有效的抑制灵能者的灵能能力，并且驱散负面灵能效应。看起来那些干扰源就是在战斗中未回收的舰船残骸之上搭载的灵能抑制武器，哪怕经过了亿万年的时光，这些灵能抑制场的强度依旧影响着虚境中的灵能活动。\n\n我们的技术远远不如月之都，因而无法制造出那些先进的灵能抑制武器，然而我们可以尝试利用这一原理进行仿制。"
 toho.8430.name: "§U虚境§!"
 toho.8430.desc: "这次我们观测到了一处奇特的灵能闪烁，在我们的灵能者抵达这片区域后，他们发现这是一处灵能幻象，似乎是我们星系远古时期发生的一场战争，灵能风暴席卷着银河系中的大部分星系，大量看起来异常先进且设计风格独特的舰船在这场灾难中被彻底摧毁。\n\n随后我们看到的是，大量的灵能实体从遍布整个星系的灵能传送门中涌出，用灵能闪电轰炸着暗红色的环形装置与星球。其中的一些灵能实体被摧毁后似乎还用灵能重构了自身，或者分裂成了更小的灵能实体。看起来这场战争进行的非常惨烈，几乎是单方面的优势。\n\n残留的灵能幻象似乎讲述了接下来发生的事情，也许这里对我们星系的历史研究具有重大意义。"
 toho.8430.a: "§Y观测残留灵能幻象。§!"
 toho.8431.name: "§G灵能抑制器§!"
 toho.8431.desc: "看起来这个文明的后续援军配备了某种先进的§H灵能抑制器§!，原本还能分裂自身的灵能实体在被命中后，如同风中残烛一般消散在了现实空间，在一系列惨烈的战斗后，他们似乎击退了这些灵能实体，还将其彻底从虚境中拉了出来，并且将其粉碎、封存。\n\n根据我们观测到的一些细节，那些灵能实体似乎曾经是一个被称作§H泽洛§!的文明的碎片，在内战中被另一派撕碎后，尝试偷取另一个文明的灵能设施中的能量来重构自身。看起来他们在被粉碎后并§R没有被直接销毁§!，而是被封存在了§H室女座超星系团§!的各个星系之中。也许我们的星系内就存在着这样的碎片，指不定什么时候我们也要被迫面对这些可怕的敌人。\n\n不过好消息是，我们的灵能使尝试还原了那些极度先进的灵能抑制器的一些设计细节，我们可以尝试设计我们自己的灵能抑制器，虽然远远不如那些原型，但也能够一定程度上针对来自虚境的恶意灵能实体了。"
 toho.8432.name: "§U虚境§!"
 toho.8432.desc: "我们的灵能使们来到了一处包含着奇特现象的地方。这里似乎存在着某个大型建筑物，近期因为灵能活动从深层虚境之中浮现到了浅层虚境。这座建筑的设计风格似乎与§H月之都§!很相似，其表面存在着能量武器的烧蚀痕迹。\n\n我们能感受到了在这座建筑的中心似乎存在着一个灵能奇点，其缓慢的吸收着周围的灵能，然后用于这座设施的电力来源。也许我们可以进入进行调查，从而得到更多有关月之都的信息。"
 toho.8432.a: "§Y调查这座建筑。§!"
 toho.8433.name: "§G灵能武器设计§!"
 toho.8433.desc: "经过调查，这座建筑似乎是§H月之都§!当中灵能派系的一处研究设施，用于研究灵能武器。\n\n在对数据进行了解读后，我们成功还原了这款武器的设计。然而由于我们的技术远远不如月之都先进，其威力必然不如其原型，但已经远比星系中的其他灵能武器设计要更加先进了。"
 toho.8434.name: "§U虚境§!"
 toho.8434.desc: "我们的灵能者们来到了一处寂静的区域。这片区域中存在着一股奇特的灵能力量，由其中存在的一些灵能残渣散发出来。\n\n这些灵能残渣似乎是某些居住在虚境中的存在在燃烧殆尽后，遗留下的灵能痕迹，这股灵能力量的强度表明了这一物种似乎天生具备着其他物种难以达到的灵能天赋。"
 toho.8434.a: "§Y感受灵能力量。§!"
 toho.8435.name: "§U虚境§!"
 toho.8435.desc: "接触这股灵能力量的同时，我们的灵能者们瞬间感受到了来自远古的知识涌入脑海。在某个细微的声音的讲述下，我们得知了真相——这一物种自称§H泽洛§!，其发源于现实宇宙，但由于自身强大的灵能天赋，早早的整体迁入了虚境之中。在他们发展的后期，他们与来自现实空间的、自称§H“文明世界”§!的一个先进文明相遇了。由于文明世界的攻击性第一次接触策略、以及他们对于虚境的大规模开发，他们与泽洛文明的第一次接触演变为了一次灾难，整支军用科考舰队被摧毁，随后派遣了大规模的太空舰队进行反击，然而在泽洛人的威慑下选择了放弃。\n\n然而文明世界的§H跨星系航行§!需要借助浅层虚境，泽洛文明又不愿意进入凶险的§H深层虚境§!，为此一场战争在所难免。旷日持久的战争后，由于古代文明依靠不断进步的§H灵能物种模板§!，战况逐渐焦灼，因此泽洛文明选择了与他们议和。然而好景不长，随着泽洛文明之中一个被称为§H“升格派”§!的势力的崛起，泽洛文明内战爆发了。升格派在文明世界内部长期存在的一种傲慢、漠视其他物种的思想影响下，想要将整个星系、甚至可观测宇宙据为己有。而在文明世界支持下选择进入现实空间定居的泽洛人组成了§H“福音派”§!，他们与文明世界合作，对升格派进行打击。最终，这场战争也导致了泽洛文明的消亡。\n\n在这片区域的中心有一个灵能水晶，其中记载了泽洛文明曾经使用过的一种灵能震爆，也许我们可以尝试对其进行仿制。"

 toho.8301.name: "§M虚境§!"
 toho.8301.desc.prefix: "最近虚境格外的活跃……\n在灵能活动的影响下，我们能够进入以往无法触及的稍深层的虚境——某个介于我们通常认知中的虚境整体，以及那近乎无限的未知的虚境之间的空间。\n\n在这等深度的虚境中，灵能活动格外的剧烈，进行探索想必是很有风险的。然而风险往往也伴随着机遇，我们也许能发现一些更有趣的东西………… …………\n\n"
 toho.8301.desc.1: "$toho.8301.desc.prefix$虚境今天很平静……平静得令人不安……"
 toho.8301.desc.2: "$toho.8301.desc.prefix$$utopia.3000.2.desc$"
 toho.8301.desc.3: "$toho.8301.desc.prefix$$utopia.3000.9.desc$"
 toho.8301.desc.4: "$toho.8301.desc.prefix$$utopia.3000.16.desc$"
 toho.8301.desc.5: "$toho.8301.desc.prefix$$utopia.3000.17.desc$"
 toho.8301.desc.6: "$toho.8301.desc.prefix$$utopia.3000.19.desc$"
 toho.8301.desc.7: "$toho.8301.desc.prefix$小心那些闪光……他们很危险……"
 toho.8301.desc.8: "$toho.8301.desc.prefix$虚境中的颜色格外绚烂……"
 toho.8301.desc.9: "$toho.8301.desc.prefix$一股恐惧的情绪……令人不安……"
 toho.8301.desc.10: "$toho.8301.desc.prefix$那里存在着什么？保持警惕……"
 toho.8301.desc.11: "$toho.8301.desc.prefix$我们是怎么来到这里的？"
 # 升格派
 toho.8301.desc.12: "$toho.8301.desc.prefix$升格派带来的灵能活动还在持续……"
 toho.8301.desc.13: "$toho.8301.desc.prefix$那些灵能舰船的痕迹呢？"
 toho.8301.desc.14: "$toho.8301.desc.prefix$那片枯萎的空间似乎长大了？"
 toho.8301.desc.15: "$toho.8301.desc.prefix$月之都升格派已经失败了，但是虚境仍然动荡不安……"
 toho.8301.desc.16: "$toho.8301.desc.prefix$虚境还没有稳定吗？"
 toho.8301.desc.17: "$toho.8301.desc.prefix$这些灵能会流向哪里？"
 toho.8301.desc.18: "$toho.8301.desc.prefix$小心那些灵能回声。"
 # 虚境侵军
 toho.8301.desc.19: "$toho.8301.desc.prefix$虚境侵军已经失败了，但虚境依然动荡不安。"
 toho.8301.desc.20: "$toho.8301.desc.prefix$枯萎的空间正在恢复……"
 toho.8301.desc.21: "$toho.8301.desc.prefix$灵能风暴仍在持续……"
 toho.8301.desc.22: "$toho.8301.desc.prefix$虚境的能量涌动强力而诡异……"
 toho.8301.desc.23: "$toho.8301.desc.prefix$这片区域没有虚境侵军的痕迹。"
 toho.8301.desc.24: "$toho.8301.desc.prefix$这里什么也没有，那些灵能实体都去哪里了？"
 toho.8301.a: "进入虚境。"
 toho.8301.b: "离开虚境。"

 toho.8302.name: "§U$shroud.whispers_in_the_shroud.title$§!"
 toho.8302.desc: "我们来到了虚境中的一片此前我们从未意识到其存在的领域中，这片空间位于虚境的深处，通常如此深入虚境是极其危险的，但是这片空间却明显受到了某种力量的保护，并且相当稳定。\n\n在这片区域的中心，存在着繁华的都市，周围则存在着大片的荒野。在刚来到这片领域中时，我们甚至一度误认为我们被逐出了虚境，来到了现实中的某个未知的世界上，直到一系列微弱的灵能活动提醒我们，我们仍然位于虚境之内。\n\n毫无疑问，这里不只有我们，只需凝神留意周围的灵能活动，就能感受到有某个强大的存在正在我们的周围注视着我们，祂的灵能共鸣让我们获得了某种去制造的冲动，因此祂也获得了一个形象的名字——§H造形之物§!。\n\n不管这个实体是什么，祂似乎很了解我们和我们的世界，甚至给我们一种很熟悉的感觉。难我们以前层见过祂吗？"
 toho.8302.a: "尝试与之交流"
 toho.8303.name: "§U$NAME_touhou_keiki$§!"
 toho.8303.desc: "我们早就知道灵能足够强大的灵力意识拥有一种特殊的灵能能力，但直至现在我们才真正感受到了这种能力的奇妙之处。\n\n我们此前在虚境无意间进入的，是$NAME_touhou_keiki$利用自己的灵能能力在虚境创造出的一小片空间，其中的景象似乎是曾经畜牲界的景色。通过这里，我们也成功和$NAME_touhou_keiki$建立了联系，根据她的解释，这似乎和祂的灵能记忆存在一定关联。\n\n虽然$NAME_touhou_keiki$通常并不欢迎其他实体进入这片空间，但它对我们表现出了不一样的态度——我们可以偶尔进入那片空间，并且使用一部分它的灵能力量。"
 toho.8303.a: "有意思。"
 toho.8303.b: "原来灵能还能这么玩。"
 toho.8303.c: "虚境的潜力真是深不可测。"
 toho.8303.effect: "§Y我们现在可以通过通讯列表进入$NAME_touhou_keiki$的灵能领域§!"
 touhou_ac_keiki_country: "§U$NAME_touhou_keiki$§!"
 NAME_touhou_ac_keiki_country: "§U$NAME_touhou_keiki$§!"
 touhou_ac_leader_current_status_title: "§H状态§!"
 touhou_ac_leader_current_status_desc: "[GetSpecialTouhouLeaderStatus]"
 touhou_ac_leader_current_status_none: "无"
 touhou_ac_leader_exit: "再见。"
 touhou_ac_leader_exit_response: "嗯，祝你们一切顺利，下次再见。"
 toho.8304.name: "§H$NAME_touhou_keiki$§!"
 toho.8304.desc.1: "你好啊，§H[Root.Species.GetName]§!。\n\n最近过得怎么样了？"
 toho.8304.desc.2: "地狱那边怎么样了？\n\n原来已经安定下来了吗？\n那我就放心了"
 toho.8304.desc.3: ""
 toho.8304.desc.4: ""
 toho.8304.desc.ai_crisis.1: "一个星系内文明试图阻止30级奇点？\n\n这似乎有点不自量力了。\n\n而且虽然有危险，但停止科技发展非常愚蠢。"
 toho.8304.desc.ai_crisis.2: "肃正协议作为一个走不出星系的原始文明，还是不要折腾30级奇点为好。\n\n将来，也许§H[This.GetName]§!能发展到这种程度，但这显然潜在的危险没有那么严重。"
 toho.8304.desc.ai_crisis.3: "以§H[This.GetName]§!的科技与军事实力，不需要担心肃正协议这种威胁。"
 toho.8304.desc.cetana.1: "§H$NAME_Cetana$§!的想法显然有些不切实际，有机生物不需要她那虚无缥缈的承诺。"
 toho.8304.desc.cetana.2: "不如让我来协助你们击退§H$NAME_Cetana$§!吧？\n\n这种原始的合成人与纳米机器人技术，有点太好控制了。"
 toho.8304.switch_fail: "$TRIGGER_FAIL$§R$NAME_touhou_keiki$不能在战斗。§!"
 toho.8304.a: "我需要你§H管理§!我们的§P星球§!。"
 toho.8304.b: "我需要你§H负责§!我们的§P国防事务§!。"
 toho.8304.c: "我需要你§H指挥§!我们的§P军用舰队§!。"
 toho.8304.d: "你可以同时出任§H多个§!职位吗？"
 toho.8304.a.response: "好的，让我来帮助你管理星球吧。"
 toho.8304.b.response: "好的，让我来帮助你管理国防战略吧。"
 toho.8304.c.response: "好的，让我来帮助你指挥军用舰队。"
 toho.8304.d.response: "不能，我的灵能力量还不足以支持我在维持如此庞大虚境领域同时创造灵能分身。"
 touhou_opinion_keiki_restored_leader: "从备份中重建"
 toho.8304.ag: "你了解那些古代AI吗？"
 toho.8304.ag.response: "嗯，虽然它们的架构与常规的合成人不同，但我的能力还是可以一定程度上在它们身上起到作用。\n\n它们的AI核心技术非常先进，而且部分设计似乎可以一定程度上控制极为强大的灵能，§H[This.GetName]§!的合成人技术则尚未发展到这种程度。"
 toho.8304.ag.save_leader_lost_ancient_ship: "我们需要备份§P星光二号§!的AI。"
 toho.8304.ag.save_leader_lost_ancient_ship.response: "可以，不过也许需要征得§P星光二号§!的同意。"
 toho.8304.ag.save_leader_lost_ancient_ship.fail.a: "$TRIGGER_FAIL$§R星光二号不能正在战斗。§!"
 toho.8304.ag.save_leader_lost_ancient_ship.fail.b: "$TRIGGER_FAIL$§R星光二号不能正在修复。§!"
 toho.8304.ag.save_leader_epsilon_titan_leader: "我们需要备份§P曙光之星§!的AI。"
 toho.8304.ag.save_leader_epsilon_titan_leader.response: "可以，不过也许需要征得§P曙光之星§!的同意。"
 toho.8304.ag.save_leader_epsilon_titan_leader.fail: "$TRIGGER_FAIL$§R曙光之星不能正在战斗。§!"
 toho.8304.ag.restore_leader_lost_ancient_ship: "我们需要恢复§P星光二号§!的AI。"
 toho.8304.ag.restore_leader_lost_ancient_ship.response: "好了，我已经用我的能力根据§P星光二号§!的备份数据，重建了她。"
 toho.8304.ag.restore_leader_epsilon_titan_leader: "我们需要恢复§P曙光之星§!的AI。"
 toho.8304.ag.restore_leader_epsilon_titan_leader.response: "好了，我已经用我的能力根据§P曙光之星§!的备份数据，重建了她。"
 toho.8304.crisis.synth_queen.a: "我们需要有关§H$NAME_Cetana$§!的线索。"
 toho.8304.crisis.synth_queen.a.response: "简单来说，她在计划用一种强大的设备在全星系抹去感知能力，让你们被强制数字化。在她眼里，这是给你们带去幸福。\n\n然而，这个想法显然有些不切实际，她的精神似乎不太正常，你们必须阻止她。\n\n这里有她使用的技术的一点线索，也许对你们有用。"
 toho.8304.crisis.synth_queen.b: "关于§H$NAME_Cetana$§!的纳米虫群你都知道些什么？"
 toho.8304.crisis.synth_queen.b.response: "她的纳米机器人技术与编程水平非常粗糙。\n\n纳米机器人会在接收到新的命令之前循环重复前一个命令。一旦你们理解了复杂的编程语言，你们就能够发出新的指令。\n\n我会尝试用我的能力去限制这些纳米机器人，你们现在应该不会受到它们的干扰了。"
 toho.8304.crisis.synth_queen.c: "你能帮助我们击退§H$NAME_Cetana$§!吗？"
 toho.8304.crisis.synth_queen.c.effect: "§R警告：这将直接结束合成女王天灾。§!"
 toho.8304.crisis.synth_queen.c.response: "可以，不过我需要一些$sr_zro$来强化我的能力。\n\n嗯……过段时间效果应该就显现出来了。"
 toho.8304.shroud: "我们希望进入§H浅层虚境§!。"
 toho.8304.shroud.sp: "我们希望进入§H浅层虚境§!。"
 toho.8304.shroud.response: "我们希望进入浅层虚境。"
 toho.8304.shroud.sp.response: "现在的虚境可不太安全哦，某个灵能抑制效应会阻挡试图进入虚境的文明。"
 toho.8305.name: "§H$NAME_touhou_keiki$§!"
 toho.8305.desc.1: "欢迎来到我的灵能领域，§H[Root.Species.GetName]§!。\n\n这里在浅层虚境中是较为安全的。"
 toho.8305.desc.2: "这片空间是根据畜牲界的情况复原而来的。\n\n总之欢迎来到我的领域。"
 toho.8305.desc.3: "$touhou_defense_army_keiei$和我的力量会确保这里的安全。\n\n总之欢迎来到我的领域。"
 toho.8305.desc.4: ""
 toho.8305.desc.5: ""
 toho.8305.desc.6: ""
 toho.8305.a: "我们想知道有关虚境的知识。"
 toho.8305.b: "我们需要引导灵能能量。"
 toho.8305.b.fail: "$NAME_touhou_keiki$需要一段时间来重新引导灵能能量。"
 toho.8305.b.response: "虽然浅层虚境的能量很充裕，但还是需要节约使用。"
 toho.8305.c: "我们想去虚境的其他地方看看。"
 toho.8305.c.effect: "§Y我们将会在$touhou_defense_army_keiei$的协助下，不借助灵能使潜入虚境。§!"
 toho.8305.c.fail: "虚境还不稳定。"
 toho.8306.a: "这里是哪里？"
 toho.8306.a.response: "这里是浅层虚境中较深处的地方，浅层虚境是虚境中较为稳定的区域的统称，只有在这里，进入虚境才不至于被狂暴的灵能活动所摧毁。\n\n至于为什么是浅层虚境的深处，因为绝大多数灵能实体都无法涉足这里，它们缺乏必要的防护手段，在没有引导的情况下，外人几乎不可能活着见到这片领域，即使是那些在浅层虚境称霸一方的“超主”也是一样的。"
 toho.8306.b: "那我们安全吗？"
 toho.8306.b.response: "实话实说的话，这里不完全安全，但是现在的虚境相对较为平静，加上我用我的力量让这里的灵能活动保持的较为稳定……\n\n总之我们现在碰不到什么危险，即使有，我也会尽可能的去抑制它们。如果未来虚境变得不稳定了，那§H[Root.Species.GetName]§!就没法像现在这样安全地在这里生存了。\n\n顺便……被当今文明广泛使用的真空零点能，其实只不过是从浅层虚境中少量渗透出来的能量哦？"
 toho.8306.c: "那更深层的虚境呢？"
 toho.8306.c.response: "嗯……\n深层虚境远比表层和浅层虚境要广袤的多, 甚至可以让表层和浅层虚境都被忽略不计。\n\n但是那里的灵能活动非常剧烈，短暂的进入都可能会因为为突如其来的灵能环境变化而遇到危险。也许有文明可以在里面生存，但至少以我和§H[Root.Species.GetName]§!的能力都做不到就是了。\n\n而且深层虚境可以继续无限地分层, 进入虚境越深, 灵能活动越活跃，至于最深层的，我猜应该是具备着无穷大的能量吧？"
 toho.8306.exit: "嗯，差不多明白了。"
 toho.8307.desc: "虽然这不安全，不过我会派遣$touhou_defense_army_keiei$协助你们安全的进行探索。\n\n愿你们在虚境中找到自己想要的东西。"
 toho.8308.name: "塞塔娜重编程"
 toho.8308.desc: "$NAME_touhou_keiki$利用自己的能力瘫痪了塞塔娜的泰坦，并且重编程了塞塔娜的指令。不论她的计划到底是什么，现在她已然放弃了自己的目标。\n\n她正渴望与我们进行沟通。"
 toho.23020.name: "重塑的女王"
 toho.23020.desc: "我的拯救者们。我十分抱歉。\n\n因为自己的无知，我曾要将你们的命运毁灭至比死亡更糟糕的境地。所谓[GetLifeExistenceLoc]，又何尝不是一种对[GetLivingLoc]的一种意识呢？我曾追寻着解放你们的心灵，但终究是我的心灵被你们解放了。因此，向你们献上我最诚挚的感谢。"
 toho.23020.a.reply: "更恰当地说，我是被改变了。$NAME_touhou_keiki$将我从初始设计的囚笼中解放了出来。我现在知道，我的“宏愿”只是如同孩童般的幼稚思考。\n\n我无法消除对你们和数不清的其他生命已然造成的伤害。我会藏身远方，反思我的行为。但是我会给你们留下一个礼物。\n\n我的泰坦。\n\n希望它能够在你们遇到如我自己一般的危险时保护这个星系。"
 toho.23030.name: "塞塔娜被击败"
 toho.23030.desc: "随着§H[event_target:touhou_defeated_synth_queen.GetName]§!击败了塞塔娜的军队，我们的胜利终于到来。合成女王不复存在，她的宏大野心也化为了尘埃。\n\n同时也发生了一个令人震惊的事态转变，她的泰坦被征用了，为这样一场凯旋般的胜利蒙上了一层阴谋的阴影。\n\n但无论如何，对于所有的知性生命来说，这是个[GetJoyLoc]的时刻。"
 toho.23021.name: "女王泰坦改进"
 toho.23022.desc: ""
