 d_hakurajinjia: "博丽神社周边"
 d_hakurajinjia_desc: "安全级别较高的神社区域，无人参拜的神社也是众多妖怪爱造访的地方"
 d_mosen: "魔法森林"
 d_mosen_desc: "神奇魔力与黑暗瘴气并存的森林，随意取食五彩斑斓的野生菇可是会中毒的！"
 d_renli: "人里街道"
 d_renli_desc: "人里某条不知名的街道，即使外界苍海桑田，这里仍然保持着简单传统的人类劳动方式"
 d_yokai_mountain: "九天瀑布水系"
 d_yokai_mountain_desc: "秋天的落叶伴随着水流的虹光洒下山崖，连接着溪谷和风神之湖的九天瀑布在秋日的阳光下轻轻降下水幕"
 d_zhulin: "迷途竹林"
 d_zhulin_desc: "神秘安静的竹林，魔力跃动的土地并没有打扰月下的静谧，反而在带来生机的同时带来些许超越尘世的美丽"
 d_false_heaven_shield: "伪天棚"
 d_false_heaven_shield_desc: "驹草生长的高山雪地，野花点缀的白色间或许有人在诗意地栖居——排除那个赌场"
 d_sunshine_flower_field: "太阳花田"
 d_sunshine_flower_field_desc: "幻想乡深处的一片花田，一位意外进入的画家在此留下一副留着太阳血液的向日葵"
 d_wifi_tower: "废弃电波塔"
 d_wifi_tower_desc: "外界进入的废弃电塔，妖精们会向它许愿，将祝福致以远方的朋友"
 d_th_underway: "地底世界"
 d_th_underway_desc: "幻想乡地下的世界，黑暗中隐藏着比黑夜更可怕的未知"
 d_spirit_power_spring: "灵力之泉"
 d_spirit_power_spring_desc: "来源不明。"
 d_hakurei_shrine: "博丽神社"
 d_hakurei_shrine_desc: "位于幻想乡的东侧边境，坐落于外面世界和幻想乡之间的分界线上，是幻想乡内的著名赏樱景点和主要宴会场所，宴会举办十分频繁。"
 d_hakugyokurou: "白玉楼"
 d_hakugyokurou_desc: "曾经冥界的白玉楼的仿造景点，是赏樱的绝佳场地。"
 d_sakura_tree: "西行妖"
 d_sakura_tree_desc: "满开的西行妖，具备强大的灵力。"
 d_touhou_library: "魔法图书馆"
 d_chireiden: "地灵殿"
 d_yukari_home: "艮之境"
 d_myouren_temple: "命莲寺"
 d_touhou_library_desc: "红魔馆地下的魔法图书馆，有许多使魔协助魔导书的整理工作。"
 d_chireiden_desc: "地灵殿是位于旧地狱中心的一幢大型别墅建筑，属于古明地觉，其下方为灼热地狱遗址，遗址最深处是核聚变炉。"
 d_yukari_home_desc: "建立在幻想乡和外面世界的境界线上，是八云紫的家。屋内有许多来自外面世界的道具，有一些用途不明的机械、无法理解内容的书本杂志。"
 d_myouren_temple_desc: "白莲从魔界获得解放后，来到幻想乡，在守矢神社的协助下建立寺庙。在整平地基后，圣辇船降落到地面，幻化出飞仓，构成寺庙正殿。"

