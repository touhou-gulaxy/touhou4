 touhou_makai_empire_titan_1_chain_title: "§M来自星界的访客§!"
 touhou_makai_empire_titan_1_chain_desc: "随着信号站的开启，我们失去了信号站控制权的同时，还发现了一艘识别特征未知的舰船，开辟了一道临时星界裂隙来到了这片银河。目前其在漫无目的的航行同时，还放置了一些奇特的信标，这些设备似乎是某种信号发射器，不断的向那条古代舰船发射高度加密后的快子信号。"
 touhou_makai_empire_titan_1_chain_stage_1_title: "§M来自星界的访客§!"
 touhou_makai_empire_titan_1_chain_stage_1_desc: "此前发现的那艘古代舰船似乎来自于魔界位面，它通过一种可以无视星界壁垒进行传输的导管设备来获得近乎无穷的能量，因而几乎无法被完全摧毁。此外其似乎通过之前放置的信标，将某些存在于魔界位面的东西“拉”到了我们的位面中，并且对我们发动了攻击。\n\n我们尚不清楚这艘古代舰船在我们的星系中活动的原因和目的，但很显然它的活动正在对我们的星系造成伤害，无论出于我们自己，或者是我们所在的星系的利益的考量，我们都不应该放任这种事情发生。"
 touhou_makai_empire_titan_1_chain_stage_2_title: "§M魔界控制站§!"
 touhou_makai_empire_titan_1_chain_stage_2_desc: "我们发现了魔界隐藏起来的控制站，经过破译之后这些控制站应该可以向之前的信号站发送信号，进而阻止那条古代舰船的行动。每个信号都会包含一条由若干个由§Y↑↓←→§!符号组成的序列，我们需要在战斗时的§Y特定时机§!输入这些序列，从而瘫痪这条古代舰船。\n\n另外我们发现了另一组与操纵这条战舰的§Y魔界AI§!有关的控制系统，但是需要密码才能进行使用，据显示屏旁边贴的小纸条暗示——§Y我们需要跨越时间，在不远的将来获取密码的信息，从而回到现在，为将来的我们提供更多答案§!。"
