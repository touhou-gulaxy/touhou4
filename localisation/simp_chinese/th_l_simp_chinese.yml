 toho.491.name: "开局领袖"
 toho.491.desc: "游戏开局可以初始拥有幻想乡中各势力的领袖（其余陆续补上），其可能拥有各种强力特性与能力"
 toho.491.a: "红魔馆"
 toho.491.a.response: " \n\n\n\n\n\n£spth_leader_select_scarlet£\n\n\n\n\n\n拥有首领蕾米莉亚，总督十六夜咲夜，科学家帕秋莉与小恶魔，舰队上将芙兰朵露与陆军上将红美铃"
 toho.491.b: "白玉楼"
 toho.491.b.response: " \n\n\n\n\n\n£spth_leader_select_white_jade£\n\n\n\n\n\n拥有首领西行寺幽幽子，总督魂魄妖忌，八云蓝，科学家橙，舰队上将魂魄妖梦，八云紫，陆军上将蕾蒂"
 toho.491.c: "妖怪山"
 toho.491.c.response: " \n\n\n\n\n\n\n£spth_leader_select_moriya£\n\n\n\n\n\n\n拥有首领东风谷早苗，总督射命丸文，姬海棠果，科学家河城荷取，舰队上将八坂神奈子，泄矢诹访子与陆军上将犬走椛"
 toho.491.d: "地灵殿"
 toho.491.d.response: " \n\n\n\n\n\n£spth_leader_select_satori£\n\n\n\n\n\n拥有首领古明地觉，总督水桥帕露西，科学家火焰猫燐，舰队上将古明地恋，灵乌路空，陆军上将星熊勇仪"
 toho.491.e: "博丽神社"
 toho.491.e.response: " \n\n\n\n\n\n£spth_leader_select_reimu£\n\n\n\n\n\n拥有首领博丽灵梦，总督上白泽慧音，科学家稗田阿求，舰队上将雾雨魔理沙，茨木华扇，陆军上将伊吹萃香"
 toho.491.z: "不了，谢谢"
 toho.1011.name: "满身疮痍"
 toho.1011.desc: "biu~~我们的一个领袖去世了，沉痛哀悼（3秒后）\n\n新的自机已就绪"
 toho.1011.a: "残机-1"
 
 toho.60.name: "玩坏了的机器人"
 toho.60.desc: "斯卡雷特帝国的二小姐，芙兰朵露·斯卡雷特以不够聪明不能陪她玩的理由，将其姐姐送给她的机器人全部损坏了，我们的王极其愤怒，斥责并要求帝国科学院尽快做出更完美的机器人来给她妹妹提供娱乐。"
 toho.60.a: "在研了在研了"
 
 th_boss.100.name: "超级旗舰计划"
 th_boss.100.desc: "经过长时间的研究与筹划，我们已经可以尝试去制造前所未有的超大战舰了，我们的第一个目标是无限放大妖怪露米娅的能力使战舰能在战场上干扰对方感知，同时具备超强的防御与攻击能力"
 th_boss.100.a: "望眼欲穿"
 th_boss.10.name: "黯星异变"
 th_boss.10.desc: "在露米娅级旗舰完成的瞬间，整个首都的舰队人员都发现自己变得无法视物，随后是巨大的炮火声与爆破声，一些稍微能视物的强大少女们只发现那艘巨大的超级旗舰驶离了空港，超级旗舰因为不明原因失控了！！！！"
 th_boss.10.a: "不好！一定是无限放大露米娅的能力导致露米娅失去控制了！"
 th_boss.102.name: "露米娅级旗舰击毁"
 th_boss.102.desc: "我们经历了激烈的战斗付出了极为惨烈的代价终于击毁了失控的露米娅级旗舰，但这旗舰的强大战力已经经过了验证，当务之急是赶紧登上这艘旗舰将其拆除，以研究其失控的原因，为下次的建造做好准备"
 th_boss.104.name: "露米娅级旗舰击毁"
 th_boss.104.desc: "来自其他势力的舰队终于击毁了失控的露米娅级旗舰，但这旗舰的强大战力已经经过了验证，当务之急是赶紧登上这艘旗舰将其拆除，以研究其失控的原因，为下次的建造做好准备"
 th_boss.102.a: "真是太不容易了"
 th_boss.104.a: "真是太不容易了"

