 th_fallen_empire_union_power_core: "暗星二型 灵力能源核心"
 th_fallen_empire_union_power_core_DESC: "由舰载四级奇点核心供能的能源核心，还使用了灵力技术进一步提升反应堆功率。"
 th_fallen_empire_union_power_core_locked: "暗星二型 暗物质能源核心"
 th_fallen_empire_union_power_core_locked_DESC: "由暗物质供能的大型能源核心，还使用了灵力技术进一步提升反应堆功率。"
 th_fallen_empire_union_ftl_drive: "星河-03 舰载引擎"
 th_fallen_empire_union_ftl_drive_DESC: "这台舰载超光速引擎利用先进的空间控制技术来实现跨恒星系的长距离航行。"
 th_fallen_empire_union_sublight_drive: "暗星二型 空间扭曲引擎"
 th_fallen_empire_union_sublight_drive_DESC: "配合空间控制技术的先进无工质引擎组为舰船在恒星引力井内的移动提供了无与伦比的亚光速机动能力。"
 th_fallen_empire_union_sensor: "天眼-3 舰载传感器阵列"
 th_fallen_empire_union_sensor_DESC: "这种独特的快子传感器利用某种先进的亚空间位置变换技术来获得遥远的位置上近乎即时的信息。"
 th_fallen_empire_union_computer_titan: "量子T型 舰载计算核心"
 th_fallen_empire_union_computer_titan_DESC: "用于操作泰坦级舰船的半自主舰载AI。"
 th_fallen_empire_union_computer_largeship: "量子B型 舰载计算核心"
 th_fallen_empire_union_computer_largeship_DESC: "用于操作大型舰船的半自主舰载AI。"
 th_fallen_empire_union_computer_smallship: "量子E型 舰载计算核心"
 th_fallen_empire_union_computer_smallship_DESC: "用于操作小型舰船的半自主舰载AI。"
 th_fallen_empire_union_computer_station: "量子S型 舰载计算核心"
 th_fallen_empire_union_computer_station_DESC: "用于操作军用空间站的半自主舰载AI。"
 th_fallen_empire_union_computer_ignore: "量子C型 舰载计算核心"
 th_fallen_empire_union_computer_ignore_DESC: "半自主的舰载AI，其受到我们的直接控制。"
 th_fallen_empire_union_aux_1: "天星VA型 灵力重组核心"
 th_fallen_empire_union_aux_1_DESC: "这种先进的船体修复系统能够迅速重组船体受损的结构，使得许多低强度的攻击对这些战舰几乎无效。"
 th_fallen_empire_union_aux_2: "天星VB型 综合防御系统"
 th_fallen_empire_union_aux_2_tt: "$mod_ship_spth_shield_efficiency$: §G+0.8§!\n$mod_ship_spth_armor_efficiency$: §G+0.8§!"
 th_fallen_empire_union_aux_2_DESC: "这种设备能够有效提升己方防御手段的运转效率，并且抑制敌方战舰的穿透性武器，从而使得舰队在面对穿透性攻击时能够获得更好的防护。"
 th_fallen_empire_union_aux_3: "天星VC型 武器抑制系统"
 th_fallen_empire_union_aux_3_tt: "似乎与某些我们熟知的抑制系统具备相似的效果。"
 th_fallen_empire_union_aux_3_1: "武器抑制效应"
 th_fallen_empire_union_aux_3_DESC: "使用低功率的快子束照射目标所在区域并不能对任何舰船造成有效杀伤，但是被照射的舰船上的计算机却会因此受到一定程度的干扰。这样的干扰通常情况下并不明显，但是在长距离的战斗中，这些频繁随机出现的误差已经足够对武器造成相当严重的影响了。"
 th_fallen_empire_union_aux_4: "月华一型 防御反制系统"
 th_fallen_empire_union_aux_4_name: "翠华灯"
 th_fallen_empire_union_aux_4_DESC: "这种设备会在极远的距离攻击敌舰的护盾并从微观层面撕裂舰船的装甲，显著降低它们对抗穿透性武器的性能。"
 th_fallen_empire_union_aux_5: "暗光一型 超光速抑制器"
 th_fallen_empire_union_aux_5_DESC: "这种结合了月都技术的设备可以创造出局部无法安全进入超空间的区域，同时增加计算撤离航道的成本。"
 th_fallen_empire_union_aux_6: "冻星一型 空间挤压系统"
 th_fallen_empire_union_aux_6_name: "战栗的寒冷之星"
 th_fallen_empire_union_aux_6_DESC: "这种武器可以大规模的制造引力效应等现象，从而使得在其影响范围内的舰船不断遭受损伤。"
 th_fallen_empire_union_aux_7: "辉光一型 武器协调阵列"
 th_fallen_empire_union_aux_7_tt: "$MOD_SHIP_ARMOR_PENETRATION_MULT$: §G+100%§!\n$MOD_SHIP_SHIELD_PENETRATION_MULT$: §G+100%§!"
 th_fallen_empire_union_aux_7_DESC: "武器协调阵列用于武器的精细控制，这可以有效对抗敌方舰船对武器穿透作用的负面影响，从而提升武器的穿透能力。"
 th_fallen_empire_union_aux_8: "异界一型 结界缓冲核心"
 th_fallen_empire_union_aux_8_DESC: "这种先进的护盾充能设备能够持续给舰船的结界强化扭曲护盾供能，使得这些护盾更难被常规火力瘫痪。"
 th_fallen_empire_union_aux_9: "耀星一型 活性稳定层"
 th_fallen_empire_union_aux_9_DESC: "这种安置于覆盖战舰的活性中子装甲下方的特殊结构能够稳定受损的装甲，并在不影响整体装甲强度的前提下加快装甲的自我修复过程。"
 th_fallen_empire_union_aura_1: "迷梦一型 灵力压制矩阵"
 th_fallen_empire_union_aura_1_DESC: "基于灵力的特殊压制力场能够对敌方造成一定程度的压制。\n特定的情况下也可以为己方提供保护。"
 touhou_fe_union_build_failed: "§R我们必须使用特殊的船坞才能建造这种战舰。§!"
 touhou_fallen_empire_1_anomaly_category: "§U深空信号§!"
 touhou_fallen_empire_1_anomaly_desc: "气态行星的内部传来了奇特的信号，由于未知干扰传感器无法探测到是什么物体，我们需要组织一次调查。"
 th_anomaly.10.name: "§P气态巨行星内部的星舰§!"
 th_anomaly.10.desc: "调查团队对气态巨行星内部的探查表明，在其内核附近存在一条设计与现今堕落帝国相似的星舰，但是技术特征似乎更加先进，甚至使用了一些与我们相似的技术手段。\n\n不过，这条星舰上设计奇特的暗物质反应堆发生了泄漏，产生的辐射让对其内部的探索异常的困难，我们需要专门调派团队了。"
 touhou_fallen_empire_1_ship_project: "调查失事星舰"
 touhou_fallen_empire_1_ship_project_DESC: "对失事的星舰进行打捞与探索。"
 th_anomaly.11.name: "$NAME_touhou_fallen_empire_union$"
 th_anomaly.11.desc: "我们成功的将这一星舰打捞了起来，并且进行了初步修复。\n\n根据对航行日志的解析，其所有者自称为$NAME_touhou_fallen_empire_union$，这条舰船执行着将一批被标注为科技遗物的货物，运输到当今[get_touhou_fallen_empire_materialist_name]首都的任务，但是中途被其他势力攻击坠落至此。在其硬化中子镀层舰体上存在着难以想象的扭曲，明显超出了现有武器的功率。\n\n针对这批货物的来历，我们发现它们似乎来自——\n§H月之都§!"
 th_anomaly.11.effect: "我们获得了一条未完全修复的古代战舰。"
 th_anomaly.12.name: "[spth_target_fe.GetName]"
 th_anomaly.12.desc: "你好，[This.GetSpeciesNamePlural]。\n\n我们得知你方近期发现了一条我们曾经开发的实验性泰坦，$NAME_touhou_fe_union_titan$。这条舰船根据先祖的技术与你们相似的文明的技术相结合开发而来，这些技术在你们手里不一定是安全的，而且对现在的我们也非常重要，所以请把它交还给我们吧。\n\n作为交换，我们可以给你们一些补偿。"
 th_anomaly.12.a: "你们想要这条舰船做什么？"
 th_anomaly.12.a.response: "你们现在不需要知道这么多，你们只需要明白，只有我们才能安全的保存和利用这些技术。"
 th_anomaly.12.b: "成交。"
 th_anomaly.12.b.response: "非常感谢，这些技术就交予你们了。"
 th_anomaly.12.c: "这是我们发现的，不行。"
 th_anomaly.12.c.response: "为什么，你们根本不会合理的使用这些东西。\n\n你们怎么如此执迷不悟？"
 th_anomaly.12.d: "老东西，现在早就不是你们的时代了。"
 th_anomaly.12.d.response: "§R你说什么？§!\n\n你们根本没有见过我们当年的繁荣，根本不知道我们曾经抢救了什么宝贵的知识。"
 touhou_fe_union_refuse_to_return_ship: "§U拒绝归还古代战舰§!"
 touhou_fe_union_refuse_to_return_ship_bad: "§U他们甚至还敢侮辱我们§!"
 th_anomaly.13.name: "日志解析"
 th_anomaly.13.desc: "根据对舰船航行日志的解析，这条被称为$NAME_touhou_fe_union_titan$的舰船当初受到§H$NAME_touhou_fallen_empire_union$§!中一个自称教义执行者的派系攻击，他们崇拜虚境与“先祖”，仇视将月之都灵力技术与来自先祖的科技融合的行为。此外，这艘舰船还有一条姊妹舰“$NAME_touhou_fe_union_titan_hostile_2$”，但是在失落帝国们分裂的前夜，为了防止落入有心之人手中，她被驱动着航向了银河系之外。\n\n好在，我们中的月兔们对于§B月之都§!的科技较为熟悉，她们可以尝试使用自己伪装成兔耳的长程通讯器尝试将那条姊妹舰叫回来，也许对她的分析可以帮助我们完善这条舰船。"
 th_anomaly.13.a: "让我们试着把这艘船叫回来。"
 th_anomaly.13.a.effect: "向被$NAME_touhou_fallen_empire_union$称为$NAME_touhou_fe_union_titan_hostile_2$的古代战舰发送返航指令。"
 th_anomaly.13.b: "一切都已经结束了……"
 th_anomaly.14.name: "通讯回复"
 th_anomaly.14.desc: "这一方法奏效了，那条舰船在收到返航指令后，表明会返航到我们发现的那条古代战舰所在的位置。\n\n接下来，大概只需要静待佳音了吧？"
 th_anomaly.15.name: "超空间滑流"
 th_anomaly.15.desc: "我们的天文部门最近检测到了一条通往我们的星系的单向超空间滑流，滑流中有一个正在移动的小体积物体，很显然有什么东西正从我们的星系以外的地方前往我们的星系，不过这个位于超平面滑流中的物体体积太小，亚空间回声异常的模糊，因此我们无法准确判断它到底是什么。"
 th_anomaly.16.name: "$NAME_touhou_fe_union_titan_hostile_2$"
 th_anomaly.16.desc: "我们的天文部门此前观测到的那个物体，已经到达了§H[spth_target_system.GetName]§!，其识别特征与$NAME_touhou_fe_union_titan$的相似，我们成功的让这艘战舰回到了我们的星系。\n\n不幸的是，目前这艘古代战舰对我们的后续指令没有做出任何反应，尽管它也没有对靠近它的舰船表现出敌意，甚至完全不尝试进行任何行为。但是$NAME_touhou_fe_union_titan$的能量活动水平突然大幅度增加，其上的各种子系统前所未有的活跃起来，尝试修复自身的损伤。\n\n科学部门建议我们静观其变，但是准备好军用舰队以防万一。"
 th_anomaly.17.name: "不速之客"
 th_anomaly.17.desc: "我们的天文部门此前观测到的那个物体，已经到达了§H[spth_target_system.GetName]§!，我们的情报部门无法确认它属于哪个势力。这艘战舰对所有通讯信号都没有做出任何反应，它的内部也没有明显的生命信号，虽然直至目前它也没有对靠近它的舰船表现出敌意，但因为它的建造者拥有让这艘战舰跨越河系移动的能力，我们没有理由对其掉以轻心。"
 th_anomaly.18.name: "古船失控"
 th_anomaly.18.desc: "在$NAME_touhou_fe_union_titan$完成了对自身的修复后，$NAME_touhou_fe_union_titan_hostile_2$突然活跃了起来，与$NAME_touhou_fe_union_titan$进行了大量高度加密的通讯，我们的情报部门完全无法破解这些通讯的内容。\n\n但很快，我们检测到这两艘古代泰坦的武器系统正在启动，向星系内的其他舰船发动了无差别攻击。"
 th_anomaly.18.a: "？？？"
 th_anomaly.20.name: "摧毁古代战舰"
 th_anomaly.20.desc: "我们的舰队已经摧毁了§H[FromFrom.solar_system.GetName]§!内的古代泰坦，并回收了它们的残骸。\n\n对残骸的分析表明这两艘古代泰坦是当年§H$NAME_touhou_fallen_empire_union$§!结合自己的“§H暗星计划§!”与§B月之都§!科技尝试建造的试验品，但是不是很完善。不过其数据库中存储了有关某个§H古代文明§!的§H四级奇点技术§!的数据，也许我们可以尝试回收这些残骸，重新进行设计。\n\n那个§H古代文明§!的技术相当的先进，根据§H$NAME_touhou_fallen_empire_union$§!遗留的资料，他们一度将自己影响力扩张到了整个拉尼凯尼亚超星系团。而§H$NAME_touhou_fallen_empire_union$§!，或者说如今的那些失落帝国，认为自己是这群先驱的后人。当然，更合理的解释是，他们只不过是幸运的出生于那个文明的遗落星球之上。更有趣的是，根据资料分析，§B月之都§!的存在时间也许比§H那个文明§!更早，甚至极有可能是第一批诞生的文明。"
 th_anomaly.20.a: "有意思。"
 touhou_fe_union_rebuild_titan: "重构舰船设计"
 touhou_fe_union_rebuild_titan_DESC: "尝试重构古代舰船的设计，对其进行改进。"
 th_anomaly.21.name: "重构舰船设计"
 th_anomaly.21.desc: "经过一段时间的研究后，我们的研究部门已经大致能够重建这条舰船的设计资料了。\n\n由于我们对月之都相关科技的熟悉，她现在可以发挥比之前更加强大的战斗力。\n\n不幸的是，受限于[Root.GetName]舰队的维持能力，我们只能同时拥有一艘这种型号的大型战舰。"
 th_anomaly.21.a: "$TH_OK$"
 touhou_fe_union_titan_hostile: "§B古代战舰控制系统§!"
