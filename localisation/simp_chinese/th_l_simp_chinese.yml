 sr_barrier_power_crisis_description_title: "§U幻想涅槃§!"
 sr_barrier_power_crisis_description_intro: "星海共同体中那些希图在历史的长河中照见未来的人们长期以来一直设想会有一场将要降临的§R天灾§!——一场所有智慧生命的生死危机，唯有倚仗前所未有的万众一心与前仆后继方能克服——如果真有可能克服的话。\n\n流行的关于何为这场天灾的本质的预测相当异想天开，比如来自§M深层虚境§!的入侵者、§U梦境世界§!的战争波及而至、§H河外星系§!的自动舰队、来自§B月之都§!的威胁、未被处理完全的§P某些存在§!的碎片，但是……\n\n如今显而易见的是，§R我们§!将会有办法塑造一个安全的星系。"
