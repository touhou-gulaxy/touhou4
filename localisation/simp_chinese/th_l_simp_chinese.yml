 toho_41_result_b: "魔界咖啡"
 toho_41_result_c: "雾雨巴斯克"
 toho_41_result_d: "月之古酒"
 toho_41_result_e: "鲸之气息"
 toho_41_result_f: "超ZUN啤酒"
 toho_41_result_g: "十四夜"
 toho_41_result_h: "绯红恶魔"
 toho_41_result_i: "风祝"
 toho_41_result_j: "幻昙华"
 toho_41_result_k: "恋恋慕斯"
 toho_41_result_l: "三色团子"
 toho_41_result_m: "秘仪巧克力"
 toho_41_result_n: "樱落雪"
 toho_41_result_o: "天界桃子"
 toho_41_result_p: "蜜渍黄瓜"
 toho_41_result_q: "烤八目鳗"
 toho_41_result_r: "惊吓大冒险"
 toho_41_result_s: "彼岸汤"
 toho_41_result_t: "穷神汤"
 toho_41_status_1_desc: "少量的饮用让你更加清醒，也许。"
 toho_41_status_2_desc: "你醉了，敌人的机会来了。"
 toho_41_status_3_desc: "烂醉如泥了，除了鬼族，没人能动一下。"
 toho_41_status_4_desc: "「我是不是还在梦中？」"
 toho_41_status_5_desc: "「之后就一个人都没有了吗？」"
 toho_41_status_6_desc: "七美德……"
 toho_41_status_7_desc: "毫无生机之地……"
 toho_41_status_8_desc: "你感到很满足，很安心……"
 toho_41_status_9_desc: "至少，最澄澈的空与海……"
 toho_41_status_10_desc: "生活就像隙间里的漂流物，你永远不知道下一个掉出来的是什么。"
 toho_41_result_a_desc: "这种争议性美食和草莓味饺子一样，引发了绵延数个世代的争论。"
 toho_41_result_b_desc: "在魔界的烈酒里加入热咖啡，搅拌到融化后，再在顶部盖上一团细腻的奶油，由奶香到酒香再到咖啡香层次分明，口感醇厚，还能驱除一身的寒意。"
 toho_41_result_c_desc: "嗯，幸好不会导致什么东西突然失窃。"
 toho_41_result_d_desc: "让永琳动容的故乡陈酿。"
 toho_41_result_e_desc: "「鲵吞亭」只对访客开放。"
 toho_41_result_f_desc: "这是什么东西？你意识到这玩意似乎不应该出现的？"
 toho_41_result_g_desc: "比起十五夜的月亮是满月，也许更想留下十四夜时期待的心情。以这样的感觉酿造的高级清酒，也许只有它才配得上迷途竹林所见到的月亮吧。"
 toho_41_result_h_desc: "因血红的颜色让人联想到某洋馆的吸血鬼，故得此名。"
 toho_41_result_i_desc: "“好像是守矢的巫女从外面带过来的配方，堂而皇之地冠了自己的名字！说起来那家伙在外界能喝酒吗？啊，这玩意儿也完全不像酒就是了，怪不得她会喜欢，啧。”——不愿透露姓名的巫女"
 toho_41_result_j_desc: "生长在沼泽中的奇迹之花，非常珍贵。"
 toho_41_result_k_desc: "「诶——你看得到我吗？」"
 toho_41_result_l_desc: "麻薯、抹茶麻薯、樱饼制作成的团子，记得不要让某位冥界公主看到它。"
 toho_41_result_m_desc: "蕴含着生命力的巧克力，总之很好吃！"
 toho_41_result_n_desc: "高级寿司的一种，粉红色的高级生鱼片盖在白米饭上，就如樱花飘落在白雪上，有着不可思议的美感。"
 toho_41_result_o_desc: "产自天界的桃子，据说吃了可以暂时体验成为天人的感觉？"
 toho_41_result_p_desc: "河童的最爱，超级甜，大概算某种热量炸弹。"
 toho_41_result_q_desc: "某只不知名夜雀兜售的烤八目鳗，可以治疗夜盲症。"
 toho_41_result_r_desc: "「吓——」「诶，有被我吓到吗？」"
 toho_41_result_s_desc: "绝对不是孟婆汤！"
 toho_41_result_t_desc: "喝完这份料理，你突然感觉自己倒霉透了。"
 toho.70.name: "展品失窃"
 toho.70.desc: "在近期举办的月都万象展上，有一件珍贵的展品，在众目睽睽之下失窃了！然而我们先进的安防系统丝毫没有拍摄到嫌疑人的身影，现场也没有留下线索。\n\n对于这一事件，也许我们应该挑选由谁来带头解决异变了。"
 toho.71.name: "线索分析"
 toho.71.desc: "由于展品上携带的追踪信号留下了蛛丝马迹，因此分析这些可能的线索成为了当前我们唯一能做的事情。"
