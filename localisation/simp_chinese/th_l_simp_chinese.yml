 d_touhou_shell_world_broken_env_system: "损坏的古代环境系统"
 d_touhou_shell_world_broken_env_system_desc: "这片地区的古代环境控制系统损坏了，带来了各种各样的极端天气。"
 d_touhou_shell_world_ancient_lab: "古代实验室"
 d_touhou_shell_world_ancient_lab_desc: "似乎是先驱者研究用的实验室。"
 d_touhou_shell_world_arctic_planet: "冰刺之地"
 d_touhou_shell_world_arctic_planet_desc: "这片地区的气候被精心的控制，形成了壮观的冰刺与雪原。"
 d_touhou_shell_world_arid_planet: "微生荒原"
 d_touhou_shell_world_arid_planet_desc: "这片荒原上几乎没有什么作物与树木，只有一些藓类地衣层。"
 d_touhou_shell_world_astral_rift: "星界裂隙"
 d_touhou_shell_world_astral_rift_desc: "奇特的星界裂隙，直接形成在了星球引力井内。"
 d_touhou_shell_world_broken_shipyard: "损坏的古代船坞"
 d_touhou_shell_world_broken_shipyard_desc: "损坏了的古代地面船坞，我们应该可以尝试修复。"
 d_touhou_shell_world_fixed_shipyard: "古代地面船坞"
 d_touhou_shell_world_fixed_shipyard_desc: "地面船坞虽然不能直接协助我们建造舰船，但可以加快我们舰船的建造效率。"
 d_touhou_shell_world_broken_spire: "废弃的中央尖塔"
 d_touhou_shell_world_broken_spire_desc: "此区域中一座巨型居住用尖塔因其自身重量而坍塌，阻挡了进入的通路。在其仍屹立在地面上的时代，这座塔一定是行星上最为高大的构筑物之一。"
 d_touhou_shell_world_spire: "宏伟尖塔"
 d_touhou_shell_world_spire_desc: "这一塔状结构曾经作为行星的管理中心。其位于中央的位置和近乎无损的内部结构为研究星球上的遗迹提供了无与伦比的机会。"
 d_touhou_shell_world_city_ruins: "古代城市废墟"
 d_touhou_shell_world_city_ruins_desc: "大概是设施建造者城市的遗迹，我们现代文明的发展正是从此开始，对我们提供了很多启发。"
 d_touhou_shell_world_cold_barren_planet: "永夜冻土"
 d_touhou_shell_world_cold_barren_planet_desc: "这片地区的人工恒星熄灭了，使得这片地区陷入了永夜。"
 d_touhou_shell_world_drilling_for_gas: "先进天然气采集井"
 d_touhou_shell_world_drilling_for_gas_desc: "这片区域地下存在着设施建造着遗留的异星天然气库存，可以供我们采集。"
 d_touhou_shell_world_iron_rain: "铁雨"
 d_touhou_shell_world_iron_rain_desc: "壳世界的碎片不断从此落下，阻碍了我们对这片地区的开发。"
 d_touhou_shell_world_grand_canyon: "天之伤"
 d_touhou_shell_world_grand_canyon_desc: "一片数十公里长的壳世界碎片崩落，在此地形成了壮观的峡谷。"
 d_touhou_shell_world_microscopic_life: "微生物群"
 d_touhou_shell_world_microscopic_life_desc: "明显人工设计的微生物群，为我们的生物学研究提供了极大的启发。"
 d_touhou_shell_world_molten_planet: "穆斯塔法焦土"
 d_touhou_shell_world_molten_planet_desc: "一片焦土，可能是建造之初就存在的地形，其中存在着庞大的铸造厂结构。"
 d_touhou_shell_world_temp: "远古圣殿"
