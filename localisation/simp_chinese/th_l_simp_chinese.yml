 gensokyo_start.1161.desc: "由于一群愚蠢的四足食草动物为这片星海所设下的规则，幻想乡特殊领袖因为携带了$paragon_leader_trait$['concept_spth_gensokyo_sp_trait']而无法选择$leader_trait_great_researcher$这类$paragon_leader_trait$。此界面提供了进行选择第二个$paragon_leader_trait$的选项，请在右侧选择吧。\n幻想乡特殊领袖可以选择除了['concept_spth_gensokyo_sp_trait']以外的$paragon_leader_trait$。\n\n领袖：§Y[From.get_spth_leader_title]§!$t$[From.GetName]\n等级：§Y[From.get_spth_leader_level]§!(§Y+[From.get_spth_leader_level_bonus]§!)$tt$经验值：§Y[From.get_spth_leader_experience]§!\n年龄：§Y[From.GetAge]§!\n类型：§Y[From.GetClass]§!\n此前岗位：§Y[From.get_spth_leader_background_job]§!\n\n[From.get_spth_leader_desc]"
