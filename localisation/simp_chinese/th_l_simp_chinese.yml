 touhou_makai_empire_titan_1_chain_repair_ai_title: "§M星界信号特征§!"
 touhou_makai_empire_titan_1_chain_repair_ai_desc: "我们从§Y不远的未来§!获取了关键信息，从而得知了§Y控制古代战舰AI§!的方法。简单来说，每个控制站具备不同的信号特征，每个信号特征包含了三个特征序列，每个特征序列均包含了存储三个整数的三元组，而信号特征标识了§Y特定变换§!。为方便表示，我们的科研部门将这些值按颜色记录，并按照红、蓝、绿排序，其中绿色序列始终为§G(0, 0, 1)§!，一个示例为：\n$t$红色序列: §R(1, 0, 3)§!\n$t$蓝色序列: §B(0, 1, 4)§!\n$t$绿色序列: §G(0, 0, 1)§!\n\n我们尚且不知道这些特征的具体含义，但已知每个信号特征似乎可以对在信号站输入的§Y主特征值§!做出特定的变换，主特征值为包含两个整数的二元组，可以表示为§Y(X, Y)§!。目前已知每个信号站的特征值只会包含如下两种类型：\n$t$Α: 当§Y红色序列的前两个值为0, 1§!，且§Y蓝色序列的前两个值为1, 0§!时，这种变换表明将输入的主特征值§Y(X, Y)§!中前者与红色序列第三个值§Y相加§!，后者与蓝色序列的第三个值§Y相加§!。\n$t$Β: 当§Y红色序列除了第一个值均为零§!，§Y蓝色序列除了第二个值均为零§!时，这种变换表明将输入的主特征值§Y(X, Y)§!的前者与红色序列的§Y非零值相乘§!，后者与蓝色序列的§Y非零值相乘§!。\n\n将每个信号站的都§Y依次处理§!后，即可得到正确的特征密码。将特征密码输入到控制系统，我们应该就能§Y为更靠后时间线的我们§!解锁魔界AI的控制权限了。\n§Y<当然，我们也可以来让科研部门直接破解这些变换特征，只不过会稍微慢一点。>§!"
