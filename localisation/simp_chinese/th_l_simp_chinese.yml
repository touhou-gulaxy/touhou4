 th_weapon_mofashu_DESC: " \n\n\n\n\n\n£koakuma_and_knowledge£\n\n\n\n\n\n以大图书馆为之命名的舰载魔法防御系统"
 th_weapon_yuzhu: "天之御柱"
 th_weapon_yuzhu_DESC: " \n\n\n\n\n\n\n£th_yuzhu£\n\n\n\n\n\n\n可能是动能武器的极致，用大量能源通过神秘技术将御柱加速到接近光速的程度随后发射出去，如果击中将会造成巨大伤害，但是由于能量过于庞大导致操控极为困难，因此命中率堪忧"
 th_weapon_yuzhu_sp: "§U$th_weapon_yuzhu$§!"
 th_weapon_yuzhu_sp_DESC: "$th_weapon_yuzhu_DESC$"
 touhou_random_neg_pos_weapon_hit_effect: "§E先进防御反制§!：只有§R50.00%§!概率正常造成伤害，取而代之的是，有§G50.00%§!概率可以直接击穿超过§Y100.00%§!§H伤害减免§!的敌人的减伤防御，从而造成可怕的伤害。"
 touhou_weapon_yuzhu_hit_effect: "$t$$TH_EXTRA_DMG_CHANCE|Y$§Y%§!概率造成相当于§H最大装甲值§!$TH_EXTRA_DMG_PERC|Y$§Y%§!的§R百分比装甲伤害§!。\n$t$$TH_VULNERABLE_CHANCE|Y$§Y%§!概率施加$TH_VULNERABLE_VALUE|Y$§Y%§!['concept_touhou_vulnerable']，持续$TH_VULNERABLE_DURATION|Y$£time£。\n$TH_COOLDOWN|R$£time£内只能触发§Y1.00§!次。"
 th_weapon_yuzhu_ultra: "§R$th_weapon_yuzhu$§!"
 th_weapon_yuzhu_ultra_tooltip: "§U我们旗舰级舰船的主炮，用难以想象的能源消耗通过神秘技术将特化设计过的御柱加速到接近光速的程度随后发射出去，大部分舰船都会在其制造的耀眼新星爆发及能量爆发中毁灭，其命中时产生的时空效应与引力扭曲还能连带杀伤落点附近的舰船。§!\n§H实际射速: 8£time£§!"
 th_weapon_yuzhu_ultra_on_hit_tooltip: "§R几乎没有舰船能在这种武器的攻击下幸存\n其后续毁灭性的能量释放还可以造成难以想象的附带杀伤§!\n\n§L对落点附近§G80§!范围内造成§R12800§!点伤害，该伤害具有§G+100%§!装甲穿透与§G+100%大小倍率伤害§!。\n对落点附近§G200§!范围内造成相当于其所拥有护盾§R20%§!的护盾伤害，并产生负面效应使其获得持续8£time£的+100%['concept_touhou_vulnerable']。"
 th_weapon_yuzhu_ultra_DESC: " \n\n\n\n\n\n\n£th_yuzhu£\n\n\n\n\n\n\n我们的旗舰级舰船的主炮，用大量能源通过神秘技术将特化设计过的御柱加速到接近光速的程度随后发射出去，可以对大多数舰船造成§R难以想象§!的伤害。"
