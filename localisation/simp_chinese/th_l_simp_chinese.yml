 th_terakoya_books_edict_nature_DESC: "在魔法、天文、气象、物理、化学等方面安排专业人才开展从常识类到技术类的课本编写"
 th_terakoya_books_edict_math_DESC: "解决幻想乡内的数学问题，编写工作刻不容缓（指炖了所有的鸽子）"
 th_terakoya_books_edict_agriculture_DESC: "农业是乡内发展第一生产力，粮食才是硬道理！"
