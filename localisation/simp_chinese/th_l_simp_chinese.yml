 opinion_kamikakushi: "夺去了我们的记忆"
 opinion_enclave_gensokyo: "§B幻想的追忆§!"
 opinion_enclave_non_gensokyo: "§B平平无奇的异形§!"
 toho.9001.name: "神之手轻轻拂过"
 toho.9001.desc: "万象神隐计划非常成功，至高的境界扭曲了规则，浩瀚的妖力吞噬了万物。须臾之间，所有的存在都发生了不可逆的逆转——他们永远成为了幻想之城的一部分，永远无法逃离这片幻想。外界将再无他们的容身之所，他们曾经留下的任何痕迹都在这永远的须臾里消失殆尽。无人可知，无人可忆，无人可查···· \n \n 悲伤和无奈正在缓慢浸入到幻想乡内，各地都发现了部分从隙间中走出的迷茫的外界人，看来，他们也已经找不到来时的路了"
 toho.9001.aa: "浮生若梦，谁悲失路之人······"
 toho.9002.name: "神之手轻轻拂过"
 toho.9002.desc: "  §Y[kamikakushi_planet.GetName]§!的早晨自喧闹而起，人们陆陆续续走出家门，开始新一天的工作。\n\n淡紫色的迷雾退去，人群的回声仿佛远在星空之外······曾经辉煌的都城变的寂静无比\n\n在白昼落幕前，§Y[kamikakushi_planet.GetName]§!的表面再度恢复了平静······神隐结束了。"
