 gensokyo_start.1150.desc: "§U绀珠之药系统可以消耗一定的资源来清除特殊东方领袖的负面特质，也可以选择以一定的维护费为代价自动清除负面特质。\n右边会自动显示当前帝国已经拥有的特殊东方领袖，在选择领袖后即可进行设置。§!\n\n请在这里选择一位领袖。"
