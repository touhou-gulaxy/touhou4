 toho.40.desc: "在举办宴会之前，我们需要提前准备餐食和场地，为此我们需要花费少量的资源……"
 toho.41.name: "宴会举办"
 toho.41.desc: "在§Y[spth_get_year]/[spth_get_month]/[spth_get_day]§!这一天，和曾经处于博丽大结界内的幻想乡一样，我们在境内的每一个殖民地上举办了又一场盛大的宴会。"
 toho.41.a: "好好好。"
 toho.41.b: "哇多么好的机会啊……"
