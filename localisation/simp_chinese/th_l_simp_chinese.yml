 touhou_shell_world: "壳世界"
 touhou_shell_world_desc: "一个包裹下层天体的巨型人造表面，球壳本身及其下层的天体为其提供了合适的引力，而球壳本身则是一片广袤的宜居空间。\n壳世界能够层层嵌套，包裹下层天体的巨型人造宜居表面，它将会为§H$POP$§!和§H$BUILDING$§!提供大量空间，并且每一层提供的空间§H都要更大§!。但由于我们的工程技术水平，其存在§R最大壳层数量限制§!。"
