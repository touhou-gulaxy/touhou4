 toho.8312.name: "§U放弃超主§!"
 toho.8312.desc: "当我们抵达虚境时，我们通灵者的内心响起了一阵缥缈却又低沉的声音，这声音令我们为之一震——\n\n这股力量与我们的灵力产生了共鸣，似乎就是当初$r_th_latency$中那个神秘的存在的声音，那个我们永远都无法发现的境界线的一端。祂就是龙神，祂愿意和我们分享一些馈赠……\n\n不过，我们需要放弃一位超主，让祂的力量更好的介入。"
 toho.8312.aa: "放弃$whisperers_in_the_void$。"
 toho.8312.ab: "放弃$end_of_the_cycle$。"
 toho.8312.ac: "放弃$the_eater_of_worlds$。"
 toho.8312.ad: "放弃$name_cradle$。"
 toho.8312.ae: "放弃$name_instrument$。"
 toho.8312.af: "放弃$name_composer$。"
 toho.8312.b: "拒绝并离开。"
 toho.8310.name: "§U缥缈的存在§!"
 toho.8310.desc: "我们来到了虚境中的一片此前我们从未意识到其存在的领域中，这片空间位于虚境的深处，通常如此深入虚境是极其危险的，但是这片空间却明显受到了某种力量的保护，并且相当稳定。\n\n我们察觉到这里存在着某种虚无缥缈的存在，其仿佛一直在期待着我们的到来。"
 toho.8310.a: "接触祂。"
 TOUHOU_GREATE_PATRON_DRAGON_FC_PROJECT: "§H与缥缈的存在通灵§!"
 TOUHOU_GREATE_PATRON_DRAGON_FC_PROJECT_DESC: "我们正在召集精英灵能使集会，准备向虚境深处进军，与其中具有力量的势力交流。\n\n在知道这个实体的真名之前，我们会称之为§H缥缈的存在§!。"
 toho.8311.name: "§U龙神§!"
 toho.8311.desc: "让我们意想不到的是，这一缥缈却又低沉的声音，居然是§H龙神§!在虚境与界线之中的投影。\n\n祂的影响出现得非常迅速，我们感受到了灵力与灵能力量的快速增长，以及最重要的，知识。\n\n随着之前我们灵能能力的发掘，龙神也随之获得了越来越强大的灵能，以至于可以在浅层虚境中投射出巨大的灵能领域与灵能意识。"
 toho.8311.a: "有趣。"
 toho.8313.name: "§U签订契约§!"
 toho.8313.desc: "当我们抵达虚境时，我们通灵者的内心响起了一阵缥缈却又低沉的声音，这声音令我们为之一震——\n\n这股力量与我们的灵力产生了共鸣，似乎就是当初$r_th_latency$中那个神秘的存在的声音，那个我们永远都无法发现的境界线的一端。祂愿意和我们分享一些馈赠……\n\n§H只要我们同意让祂进入我们的意识。§!\n\n一个微不足道的代价，就像祂宣称的那样。我们感受到来自祂的善意。"
 toho.8313.a: "同意契约。"
 toho.8313.b: "拒绝契约。"
 toho.8315.name: "§U幻想之力§!"
 toho.8315.desc: "我们的[GetTelepathPlural]向超主祈求力量，祂呢喃着给出提案。\n\n他们内心响起了一阵缥缈却又低沉的声音，似乎是被处理过了。\n「我可以增进你们结界的力量，不过，只有在合适灵能环境影响下的地方才能做到，而且已经受到影响之处付出更大的代价。」\n\n「如何，你们考虑好了吗？」"
 toho.8315.a: "我们希望增强那些已经受到过影响的星球。"
 toho.8315.a.fail: "我们境内尚未有这样的星球。"
 toho.8315.b: "我们希望增强那些尚未受到过影响的星球。"
 toho.8315.b.fail: "我们境内尚未有这样的星球。"
 toho.8315.refuce: "嗯，现在还不行。"
 toho.8315.refuce.response: "「既然如此，这些东西就退还给你们了。」"
 toho.8316.name: "§U幻想之力§!"
 toho.8316.desc: "我们[GetTelepathPlural]的视线模糊起来，被一阵朦胧感所覆盖。\n在这种感觉消失后，在他们的面前浮现出了一系列星球的名称。\n\n「那么，你的选择是？」"
 toho.8316.a: "§M[touhou_great_patron_dragon_accord_4_planet_a.GetName]§!"
 toho.8316.b: "§G[touhou_great_patron_dragon_accord_4_planet_b.GetName]§!"
 toho.8316.c: "§U[touhou_great_patron_dragon_accord_4_planet_c.GetName]§!"
 toho.8316.d: "§H[touhou_great_patron_dragon_accord_4_planet_d.GetName]§!"
 toho.8316.e: "§Y[touhou_great_patron_dragon_accord_4_planet_e.GetName]§!"
 toho.8316.f: "§P[touhou_great_patron_dragon_accord_4_planet_f.GetName]§!"
 toho.8316.g: "§R[touhou_great_patron_dragon_accord_4_planet_g.GetName]§!"

 toho.8997.name: "§L虚境§!"
 toho.8997.desc: "某种强大的灵能抑制能量压制了整片我们熟知的虚境，往日那些灵能活动不再出现。\n\n我们所能见到的，\n只有一片死寂。\n\n估计要等到隙间之里那灵能抑制效应结束，才能正常的接触虚境了。"
 toho.8997.a: "这肯定就是终末。"
 toho.8997.b: "这就是灵能抑制对虚境的影响吗？"
 toho.8998.name: ""
 toho.8998.desc: ""
 toho.8998.a: ""
 toho.8999.name: "§L虚境§!"
 toho.8999.desc: "某种更强大的灵能力量压制了整片我们熟知的虚境，我们所能见到的，只有一片死寂。"
 toho.8999.a: "这肯定就是终末。"
 toho.8999.b: "这就是泽洛文明升格派的力量吗？"

 touhou_shroud_lower_level: "§M浅层虚境§!"
 toho.8200.name: "§U虚境中的灵力奇点§!"
 toho.8200.desc: "我们处在更深层的浅层虚境之中，这里灵能活动非常汹涌，因而不存在任何超主的痕迹。\n\n我们感觉到还有别的存在。一个§H$code_name_touhou_psionic_echo_sanae$§!正在侵蚀我们的意识，在周围掀起一场灵能风暴。\n\n一种深深的奇迹与希望被推入我们的集体心灵中。我们看到的是令人眼熟的灵能活动模式。\n\n不管这个实体是什么，它似乎很了解我们，难道它曾属于此地吗？"
 toho.8200.a: "尝试与其交流。"
 toho.8201.name: "§U显现原形§!"
 toho.8201.desc.intro: "这个被称为§H奇迹之物§!的遥远力量从虚境深处里用§H希望§!拥抱着我们的思想。祂沉默无声，但我们已经认出来是什么了——\n\n$toho.8201.desc.default$"
 toho.8201.desc.default: "祂是§H$NAME_sanae$§!的投影。\n\n我们曾经了解到灵能足够强大的实体可以在虚境中留下自己的投影，但是没想到灵力与灵能结合创造出了属于我们这位幻想灵媒的灵域。"
 toho.8201.a: "哇哦。"
