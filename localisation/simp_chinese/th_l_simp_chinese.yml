 spth_version: "2.4.0 §M奇迹巨构§!版本"
 spth_version_date: "2025.11.25"
 spth_latest_update_info: "1.新增超大型巨型结构“$touhou_system_warper$“，该巨构可以提供强力修正、量子弹弓，在不同星系之间跃迁、移动自身所在的星系以及进行跨星系打击。\n2.适配了4.2版本，修复了部分因为版本变动失效的效果与修正。\n3.新增建筑龙神圣所、铃奈庵，岗位铃奈庵书记官与古代档案管理员。\n4.新增东方领袖$NAME_kosuzu$、$NAME_hina$、$NAME_shinmyoumaru$与$NAME_sagume$。\n5.新增了六种能够通过灵潜抽出的武器/灵能抑制武器。\n6.调整了部分加成与岗位的数值。\n7.调整了部分领袖的数值与技能。\n8.部分武器特效进行了调整，使战斗更有观赏性。\n9.修改覆盖的rules同时提供了提供通用兼容修正：§Yshould_not_count_leader_cap§!与§Yshould_not_have_leader_upkeep§!。\n10.优化了脚本性能。\n11.新增舰船：支援重巡洋舰与一系列的支援组件。\n12.修改与加强了部分组件的数值。\n13.古代帝国联动起源：['civic:origin_touhou_shell_world']。\n14.为光环与雷场提供了专属特效，增加了战斗的观赏性。\n15.新增舰船类型：重型防御炮台。\n16.修复了已知BUG。"
 spth_history_update_info: "['spth_history_update_info_2_0_beta1']\n['spth_history_update_info_2_0_beta2']\n['spth_history_update_info_2_0_beta3']\n['spth_history_update_info_2_1_beta1']\n['spth_history_update_info_2_1_beta2']\n['spth_history_update_info_2_1_beta3']\n['spth_history_update_info_2_2_beta1']\n['spth_history_update_info_2_2_beta2']\n['spth_history_update_info_2_2_beta3']\n['spth_history_update_info_2_2_1']\n['spth_history_update_info_2_2_2']\n['spth_history_update_info_2_3_0']\n['spth_history_update_info_2_3_1']"
 spth_history_update_info_2_3_1: "2.3.1 §M虚境潜势§!版本"
 spth_history_update_info_2_3_1_desc: "2025.10.19$t$更新\n§L1.更新了幻想乡专属的灵潜事件，通过灵潜可以获得东方高级组件。\n2.更新了幻想乡上超主龙神、五位特殊统治者的灵能投影小超主、小超主埴安神袿姬。\n3.更新了领袖多多良小伞、埴安神袿姬，其中埴安神袿姬可以切换领袖类型。\n4.为超级航母更新了符卡系统。\n5.天灾获得自己的灵能光环，与对应的灵能抑制器/灵能增幅器。\n6.为部分岗位新增了灵能相关的产出，调整了法令。\n7.部分原版遗珍现在支持东方的特殊资源/动物舰船。\n8.完善了东方AI，现在更加善于运营和建造舰船。\n9.调整了部分武器的数值与武器聚焦，且大部分散射武器现在具备独特的命中效果。\n10.通过着色器移除了内阁投影效果与绿色滤镜，减少了自发光。\n11.部分已知bug修复与性能改进。\n12.新增堕落与月之都相关的小型事件链“§U深空信号§!”，可以获得一艘古代泰坦，在开启古代帝国MOD时将获得额外效果与古代舰船认证。\n13.古代帝国MOD联动特殊动作——灵力能源供应。§!"
 spth_history_update_info_2_3_0: "2.3.0 §M虚境潜势§!版本"
 spth_history_update_info_2_3_0_desc: "2025.9.22$t$更新\n§L1.完成了对4.1的适配。\n2.新增舰船类型：指挥无畏舰。\n3.新增灵能专属的护盾装甲组件。\n4.灵能专属武器-灵能裂解器。\n5.为幻想乡大部分组件添加了动物朋友版本。\n6.调整了部分武器特效。\n7.新增了两种幻想乡灵能高级政体与特殊领袖灵能特质。\n8.调整了整体的产能与武器数值。\n9.部分岗位不再能够自动化。\n10.幻想乡AI强化得到修复与改进。\n11.新增紫香花事件链，可以获得新的特殊领袖。\n12.新增主菜单链接按钮，可以直接打开本MOD的教程等。\n13.调整了一些视觉效果等可以增加代入感的内容。\n14.增强部分特殊领袖的特质。\n15.为超级航母的跨星系打击新增了可切换模式的功能。\n16.修复了幻想星区划的产出，同时幻想星现在可以享受岗位产出与维护费修正。\n17.部分幻想乡岗位可以吃到额外的加成，如幻想乡科研人员可以享受物理学家、生物学家、工程学家的加成。\n18.修复了部分已知的bug。\n19.优化了脚本性能。\n联动更新:\n$t$1.修复了古代帝国MOD诡异支援舰无法使用幻想乡支援脑的问题\n2.可能性空间科研船可以使用古代帝国MOD科研工程船的组件\n3.远程轰炸舰、指挥无畏舰可以使用古代帝国MOD的战术支援舰A槽。\n4.古代帝国MOD的舰载以太相引擎支持灵力循环。\n5.指挥无畏舰获得夸特MOD普通旗舰的认证。§!"
 spth_history_update_info_2_2_2: "§G2.2.2§! §C光耀珍宝§!版本"
 spth_history_update_info_2_2_2_desc: "2025.8.21$t$更新\n§L1.完成了对4.0.22的适配\n2.改动了灵力辅助反应室，现在提供+50%的反应堆能量\n3.普遍提高了幻想乡反应堆的能源\n4.改动了幻想乡作战电脑、反应堆、推进器的限制条件，只需要满足大小即可\n5.更新了月都天灾的模板，目前可以通过调试菜单呼叫天灾\n6.§M隙间之里§!、§R失控防御系统§!、§B升格派§!天灾现在均可无视超空间抑制器\n7.武器特效改动\n8.新增了两种SML槽武器和幻想乡导弹\n9.占用了custom_tech_1作为灵力科技\n10.上调远程轰炸舰的上限为20\n11.领袖等级上限修正统一为领袖有效等级\n12.为远程轰炸舰添加了四个额外a槽。\n13.索敌改动，现在远程轰炸舰更难被击毁\n14.先进灵力结界护盾/灵力活性零素装甲数值提高\n15.改动了部分组件的造价\n16.优化了脚本的性能表现\n17.现在可以查看天灾的配置，并且隙间之里守卫舰队的配置与天灾同步\n18.调整了部分东方岗位的产出与维护\n19.改动了部分领袖特质与物种特质\n20.新增两个起源，并且强化了幻想环\n21.修复了已知的bug\n22.联动更新: 夸特的部分建筑会提供幻想乡对应岗位的效率\n23.联动更新: 战斗神社将被视作夸特的宏大级，且可以通过特殊动作部署补给区与舰队，同时月都的指挥武库舰可以被视作夸特旗舰。§!"
 spth_history_update_info_2_2_1: "§G2.2.1§! §C光耀珍宝§!版本"
 spth_history_update_info_2_2_1_desc: "2025.7.21$t$更新\n§L1.新增了十多种幻想乡['concept_specimens']\n2.调整了部分武器数值，使其更加合理\n3.战列巡洋舰船体下调25%\n4.增加幻想乡系列舰船对['concept_biological_ship']的支持\n5.新增了残机触发的特效\n6.新增了舰船特殊动作功能，可以在舰船命令中触发；在伞暗蓝UI更新后也可以通过伞UI触发\n7.增加了幻想乡、隙间、魔界与月都舰船的map_icon与专属音效\n8.新增幻想城改造时智能转换区划首府建筑\n9.更新了部分科技图标与gateway\n10.幻想城现在可以通过区域特化将区划全部转为同一种类型\n11.调整了部分岗位的数值，增加了特殊岗位的稀有资源维护费\n12.下调了符卡建筑的数值，符卡铸造区域提供的岗位数量*2\n13.隙间存储仓库现在可以提供少量的文物上限，新增幻想乡星界节点\n14.新增三个法令\n15.新增幻想乡星环建筑\n16.更新部分建筑描述\n17.提高了幻想乡进攻部队的数值\n18.新增指挥上限覆盖为800\n19.增加了巨构建筑的产能基础值\n20.幻想城区划住房数量增加\n21.新增幻想乡平民岗位\n22.优化了天灾的性能\n23.修复了一些已知的bug\n24.联动更新: 虚境侵军的灵能攻击无法击杀部分幻想乡领袖，且部分幻想乡领袖在研究古代文明相关造物时自动被视作11级§!"
 spth_history_update_info_2_2_beta3: "§G2.2.beta3 §C陨落月都§!版本§!"
 spth_history_update_info_2_2_beta3_desc: "2025.6.14$t$更新\n§L1.将幻想城可用区划造价统一为2000矿物+500灵力\n2.修复已知bug\n3.添加了十几种区域特化\n4.月都故事线更新一个星域\n5.神隐星球获得25%岗效\n6.首府建筑提供的岗效削弱\n7.更新了幻想乡命名表\n8.调整月都武器数值\n9.现在可以获取月都的哨卫舰§!"
 spth_history_update_info_2_2_beta2: "§G2.2.beta2 §C陨落月都§!版本§!"
 spth_history_update_info_2_2_beta2_desc: "2025.5.31$t$更新\n§L1.调整与修正了部分数值\n2.新增幻想乡堡垒球与贸易球殖民地规划\n3.鸟船神社现在可以重新建造\n4.完善了部分月都剧情\n5.隙间仓库将额外提供人里行商岗位等修正\n6.兼容性：不再为夸特星港提供灵力生产区划\n7.修复了部分bug\n8.调整部分科技与国民理念的数值\n9.现在神社巨构将不会清理多余人口\n10.更正了部分文案\n11.特殊领袖现在将提供一定的建造队列上限修正\n12.灵力传统的灵力产出数值降低为20%\n13.真空灵力井喷器的数值合理的进行修改§!"
 spth_history_update_info_2_2_beta1: "§G2.2.beta1 §C陨落月都§!版本§!"
 spth_history_update_info_2_2_beta1_desc: "2025.5.6$t$更新\n§L1.初步适配了4.0\n2.调整了一些科技的费用\n3.修复bug\n4.补充本地化\n5.为超级航母主炮增加了aoe效果§!"
 spth_history_update_info_2_1_beta3: "§G2.1.beta3 §C隙间入侵§!版本§!"
 spth_history_update_info_2_1_beta3_desc: "2025.2.1$t$更新\n§L1.新增爱丽丝事件，击败隙间之里后一年触发。\n2.新增与古代帝国的联动。\n3.完成舰船生成器UI。\n4.现在通用特种工业区会在殖民地规划为堡垒星球时提供3个士兵岗位。\n5.部分可能引发索敌逻辑的问题修复。\n6.优化部分触发器。\n7.新增星球建筑隙间仓库。\n8.调整隙间之里extra难度的部分机制。\n9.经济数值调整。\n10.完成了幻想星的产出公式设计。\n11.修复了一系列bug。\n12.更新了一些小事件。\n13.完善部分剧情。§!"
 spth_history_update_info_2_1_beta2: "§G2.1.beta2 §C隙间入侵§!版本§!"
 spth_history_update_info_2_1_beta2_desc: "2025.1.26$t$更新\n§L1.修复了部分bug\n2.博物志卡池新增比那名居天子。\n3.新增了东方幻想日蚀的一套立绘。\n4.新增魔界防御系统事件。\n5.非幻想乡国家在场上不存在幻想乡非AI国家时可选择生成魔界母星系。\n6.部分本地化与图标缺失修复。\n7.新增了EXTRA难度设置。\n8.削弱了返魂蝶系列武器的基础数值。\n9.可能性空间科研船完成。\n10.新增与古代帝国的一些联动内容。\n11.削弱了超级航母被毁后的爆炸伤害。\n12.新增领袖手动复活界面。\n13.隙间之里可以生成恒星基地。\n14.博物志冷却结束时提示message。\n15.情报日志ui新增古代文明数据库。§!"
 spth_history_update_info_2_1_beta1: "§G2.1.beta1 §C隙间入侵§!版本§!"
 spth_history_update_info_2_1_beta1_desc: "2024.12.11$t$更新\n§L1.完成了魔界事件链，在完成修复主楔项目后将会引发一次中期天灾。\n2.古代帝国联动：古代计算机现在可以研究灵力武器循环。\n3.修复了部分本地化错误。\n4.修复了恋之瞳与觉之瞳的战斗事件。\n5.解锁难度调整功能。\n6.修复了博物志抽卡的无选项bug。\n7.更换了幻想乡国民理念的图标。\n8.优化了部分脚本性能。\n9.调整了灵力传统的数值。\n10.新增领袖立绘差分与重置功能。\n11.设置菜单神秘小按钮。§!"
 spth_history_update_info_2_0_beta3: "§G2.0.beta3 §C结界消逝§!版本§!"
 spth_history_update_info_2_0_beta3_desc: "2024.11.20$t$更新\n§L1.新增幻想乡政体统治者内阁与附庸类型\n2.增加了返魂蝶与弹幕的亡灵组件，与一些图片描述\n3.更换了弹窗事件UI，感谢滑稽提供的古代帝国弹窗UI。同时新增了来自月华社的音乐播放器音乐，感谢月华社提供的授权。\n4.新增建筑图标，削弱了部分产出，幻想城区划修正调整，新增突触机建筑与区划。\n5.修复了改造幻想乡星球时多一个大结界地块的bug。\n6.自动环世界适配古代帝国的规划类型，同时古代帝国的引力轰炸现在可以正确的将本mod的居住站炸成残骸。\n7.残机与其他战斗事件的修复与性能优化。\n8.修复了冈格尼尔维护费消耗过高的bug。\n9.部分本地化缺失修复。\n10.名称列表内容更新。\n11.由于蠢驴暗改，修复与改动了作战电脑的行为逻辑。\n12.击杀了原版的on_damage_taken触发的事件，以及捕获领袖事件。\n13.进一步性能优化与兼容性优化。§!"
 spth_history_update_info_2_0_beta2: "§G2.0.beta2 §C结界消逝§!版本§!"
 spth_history_update_info_2_0_beta2_desc: "2024.10.30$t$更新\n§L1.适配3.14版本群星\n2.修复了未建立结界时岗位无产出的bug\n3.新增幻想乡类型的附庸，及其相关事件\n4.更新了部分文案，增加了魔界先驱者，仍在制作中。\n5.为魔炮与冈格尼尔添加了吸血的武器属性\n6.增加了领袖图鉴，方便查询有什么领袖还没抽到。\n7.新增了国民理念与内阁类型，同时幻想乡所有内阁类型都可以取代原版的某个内阁了。\n8.新增巨构-神社空间站及其相关效果，原有巨构拥有了新的图标。\n9.自动环开放给非剧情起源，同时其建设模板更加智能，加入了对古代帝国一些殖民地类型的支持。\n10.修复了战斗系统等一些事件和效果的bug\n11.新增一系列领袖功能，以及单人游玩时超级航母可以展示血条。\n12.重做灵力反应堆的UI。\n13.增加了幻想乡共同体议案。\n14.调整了幻想星，同时巫女可以产出少量星界丝缕。§!"
 spth_history_update_info_2_0_beta1: "§G2.0.beta1 §C结界消逝§!版本§!"
 spth_history_update_info_2_0_beta1_desc: "2024.9.14$t$更新\n§L0.版本号记录方式修改。\n1.增加了剧情起源，目前尚在制作中，只放出了一部分内容。起源线将拥有一些产出加成、新科技、新舰船组件与新巨构等等。\n2.大幅度重做了经济系统，增加了大量建筑与区划，幻想城等星球重做，增添一些产出维护相关机制，同时去除了凝聚力产出减成修正。\n3.修改了武器索敌与数值，新增了两个g槽武器，对天之御柱进行了调整，同时新增t槽御柱。\n4.增加了新的舰船组件与两个事件实现的舰船修正（护盾效率、装甲效率）。\n5.增加了新武器特效，调整了部分武器特效。\n6.增加了两种舰船，幻想乡超级航母与远程轰炸舰，均拥有独立模型。\n6.战列巡洋舰新增一个巡洋舰艏区段，战巡舰艏的a槽会相较其他舰艏少一个。\n7.部分战斗系统在面对一些敌人时不会生效，减轻战斗时的性能压力，同时进行了性能上的优化。\n8.内阁效果修改与加强，现在贤者助手可以被视作国务卿。\n9.新增同化人口的星球决议，以及对应的自动补法令。\n10.物种特质大改，并更换更清晰的图标。\n11.增加了防止同化的物种特质。\n12.调整领袖特质，为所有幻想乡特殊领袖增加了出身职业。\n13.暂时移除了红魔线，之后会加回来。\n14.博物志调整，在科技抽完后可以抽取幻想乡g槽与两种新舰船科技。\n15.为部分特质、起源等的描述增加了图片。\n16.飞升进行了重制，现在飞升不再限制原版飞升。\n17.对原版一些内容进行覆盖，如本地化修复和舰船战斗改进。\n18.覆盖了原版的跃迁进入、是否准许轨道轰炸和物种组装的gamerules。\n19.太空神社调整，昂宿天守变为居住站实现，去除不稳定的删除航道功能。\n20.新增了轨道轰炸姿态：神隐轰炸，可以将星球炸成神隐星球，同时其上的人口会智能的同化并转移到玩家的殖民地上。\n21.优化了一些脚本与事件的性能与实现，将部分触发器替换为了VOP优化触发器。\n22.增加了人口同化与大结界搭建星球决议，移除了殖民地结界搭建星球决议。\n23.为上述两个决议添加了自动为殖民地补充的法令。\n24.增加了三首背景音乐。§!"
