 touhou_psionic_inhibitor_weapon_DESC: "根据记录复原的一款由月之都设计的灵能抑制场发射器，其可以发射灵能压制场，使得范围内的灵能活动被削弱，此外其运作产生的扭曲效应也可以用于杀伤敌方舰船。"
 touhou_anti_psionic_weapon_DESC: "某个远古文明早期与泽洛文明对抗时使用的灵能抑制器，在抑制灵能活动模式的同时还可以连带损伤敌舰，由于泽洛个体的灵能天赋极强，这种灵能抑制器的灵能抑制效应也格外显著。我们复原的版本不如其原型那么强大，但是融合了灵力技术的灵能抑制器依旧比星系内的类似武器要更加先进。"
 touhou_psionic_launcher_DESC: "我们复原的一款灵能能量发射器，据信这是月之都之中的升格派曾经使用的灵能武器，但由于我们的技术远远不如他们，威力不如其原型那般强大。"
 touhou_zro_psionic_lighting_DESC: "泽洛文明与另一个文明交战以及内战时期曾经使用的一种灵能武器，其发射出的灵能光束足以撕裂时空，常规的护盾硬化技术完全无法阻挡这种灵能震爆。我们复原的版本不如其原型那么强大，但是融合了灵力技术的光束依旧可以轻松撕裂敌方舰船。"
