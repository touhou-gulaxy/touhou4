################开局事件/更新内容#################
 gensokyo_start.100.name: "欢迎游玩《东方繁星录》2.0测试版！"
 gensokyo_start.100.desc: "当前您游玩的是该mod的测试版。该版本已经完成的和预计的改动包括但不限于：\n - 一套变化巨大的经济系统，特殊的经济发展思路和船新体验。\n - 内容丰富的故事线，各种小事件，以及正在绝赞制作中的红魔线重置/更多独特开局故事！\n - 毛玉散播到太空中了，并且在全宇宙内到处捣乱！\n - 模组专属的中/末期天灾正在制作当中~\n - And more...\n\n请注意，该mod的测试版存在部分素材缺失/复用，以及难以避免的遗留bug，如果您发现了任何问题，或者对于游戏内容有自己的想法，欢迎在创意工坊页面或者q群反馈！\n感谢您的游玩~"
 gensokyo_start.100.a: "知道啦，开玩！"
