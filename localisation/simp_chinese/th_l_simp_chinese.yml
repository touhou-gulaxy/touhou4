 auth_gensokyo: "幻想乡"
 auth_gensokyo_desc: "与现世隔绝的桃花源，妖怪，人类，吸血鬼，魔女等等和平生活在一起的世界"
 auth_gensokyo_tag0: "这曾是一个没有人类记下历史的封闭世界。妖怪们无法准确记住过去，幻想乡里见不到真实。"
 auth_gensokyo_tag1: "就在我开始写这本书的时候，幻想乡的历史就已经诞生了。"
 auth_gensokyo_tag2: "那么，请仔细阅读吧，愿您有一个安全美好的幻想乡生活。"
 auth_gensokyo_tag3: "第九代阿礼少女$tt$稗田阿求"
 auth_gensokyo_tp: "§U开局后: §!可以选择不同的幻想乡开局领袖组。"
 auth_gensokyo_psi: "尘世幻想乡"
 auth_gensokyo_psi_desc: "与现世隔绝的桃花源，妖怪，人类，吸血鬼，魔女等等和平生活在一起的世界。\n在灵能与灵力能力的双重加持下，彼此之间更加的和谐。"
 auth_scarlet_empire_vampire: "斯卡雷特帝国"
 auth_scarlet_empire_vampire_desc: "被红魔馆统一的幻想乡，但是社会的面貌仍旧没太大的变化，妖怪，人类，吸血鬼，魔女等等和平生活在一起的世界。"
 auth_scarlet_empire_vampire_psi: "全知红魔馆"
 auth_scarlet_empire_vampire_psi_desc: "$auth_scarlet_empire_vampire_desc$\n在灵能与灵力能力的双重加持下，彼此之间更加的和谐。"

 civic_gensokyo: "幻想乡"
 auth_gensokyo_corporate: "幻想乡巨企"
 civic_gensokyo_desc: "所谓幻想乡，是围绕着少女们的游戏、祭典、宴会发展起来的风流社会，丰富多彩的文娱活动消耗了大量的资源。人们热衷于在工作之余为自己的兴趣投入时间和精力，民间各式各样的同人社团和科技兴趣小组给社会的进步带来了出人意料的动力"
 auth_gensokyo_corporate_desc: "所谓幻想乡，是围绕着少女们的游戏、祭典、宴会发展起来的风流社会，丰富多彩的文娱活动消耗了大量的资源。在山童们的引领下，人们逐渐走向了经贸发展之路，整个国家也开始团结于幻想乡巨型企业的旗下。"
 civic_tooltip_gensokyo_effects: "$t$—解锁§Y幻想乡飞升§!路线\n$t$—能够在开局选择§Y初始势力领袖§!\n$t$—§Y人口增速§!与§Y幻想乡岗位产出§!会随着飞升路线的进行§G逐步提升§!\n$t$—£job_civilian£§Y$job_civilian_plural$§!可以被替换为§Y['spth_freelancer']§!\n$t$—£job_spth_freelancer£§Y$job_spth_freelancer$§!根据星球的§Y建设情况§!与§Y帝国思潮§!给予多种效果。"
 civic_the_wind_of_miracles: "奇迹之风"
 civic_the_wind_of_miracles_desc: "蕴藏着奇迹力量的风啊，在我面前显示你真正的力量"
 civic_spth_suwa: "遗忘之谷"
 civic_spth_suwa_desc: "诹访大社上，被外界所遗忘的用农作物、谷物进行占卜的神事。重新举行的御射山御狩神事将会带来古老的军神与乾坤的力量。"
 civic_guanyin: "送子观音"
 civic_guanyin_desc: "佛教明明是教人忍耐、行善的，怎么这么多人都来求子啊...但是奇怪的是好像确实有用呢"
 civic_scarlet_devil: "绯红恶魔"
 civic_tooltip_scarlet_devil_effects: "$t$—解锁§Y红魔飞升§!路线\n$t$—开局拥有§P红魔馆势力领袖§!\n$t$—§Y人口增速§!与§Y幻想乡岗位产出§!会随着飞升路线的进行§G逐步提升§!\n$t$—£job_civilian£§Y$job_civilian_plural$§!可以被替换为§Y['spth_freelancer']§!\n$t$—£job_spth_freelancer£§Y$job_spth_freelancer$§!根据星球的§Y建设情况§!与§Y帝国思潮§!给予多种效果。"
 civic_scarlet_devil_desc: "你还记得你吃过几片面包吗，我已经忘记我杀过多少人了"
 civic_river_child: "河童工业"
 civic_river_child_desc: "河童工业科技，世界第一！！！！"
 civic_river_child_corporate: "河童工程公司"
 civic_river_child_corporate_desc: "企业化的河童工业组织，与山童们联合了起来，一切为了利润！"
 civic_moon_science: "月都科技"
 civic_moon_science_desc: "堕落的月都是我们的警示，其存在将成为我们的借鉴，他的科技将成为我们的参考。"
 civic_yagokoro_medical: "八意药业"
 civic_yagokoro_medical_desc: "我没有拿你试药，我的药剂水平你还不懂吗，斐波那契数列的兔子也活不下来，你活着说明我对你很好了"
 civic_chireiden: "地灵殿"
 civic_chireiden_desc: "在是非曲直厅执行地狱轻量化计划，废弃旧地狱后，怨灵们便交给了地灵殿进行管理。"
 civic_chireiden_tooltip: "能够安抚$kedama$与$space_amoeba$"
 civic_yukari: "艮之境"
 civic_touhou_hiffu: "梦幻主义"
 civic_touhou_hiffu_desc: ""
 civic_lethargic_leadership_lunar: "暮气沉沉的领袖"
 civic_lethargic_leadership_lunar_desc: ""
 civic_empire_in_decline_lunar: "衰落的帝国"
 civic_empire_in_decline_lunar_desc: ""

 toho.1.name: "红魔馆庆功宴"
 toho.1.desc: "为了庆祝[officer.GetName]率领的舰队在[system.GetName]星系大获全胜，蕾米在红魔馆举办了盛大的宴会，[officer.GetName]被授予了红魔上将的皇家头衔"
 toho.2.name: "暗中来访：觉"
 toho.2.desc: "传言说上将[officer.GetName]在[system.GetName]的胜利是在古明地觉的帮助下得以全歼敌舰，大家都说看到过司令和不知名的小个子妖怪往来。"
 toho.3.name: "弃船舰长"
 toho.3.desc: "[officer.GetName]，即[ship.GetName]的舰长，最近在[system.GetName]星系的战斗中擅自离开飞船，在太空中用符卡向敌人射击。舰队指挥层对此非常恼火，但海军陆战队提议招募这一人才作为将领。"
 toho.4.name: "花肥"
 toho.4.desc: "[officer.GetName]，即[ship.GetName]的舰长，最近在[system.GetName]星系的战斗中表现杰出。[Root.Capital.GetName]的海军指挥部计划给她升职，但她以往的言论触怒了风见幽香，幽香扬言要亲自对其进行调教。"
 REMI: "希望这个勋章对她的指挥有所帮助"
 SATORI: "当事人不承认，我们也没必要深究了"
 HAKUREI: "这小子也许能拿来当巫女"
 YUUKA: "我没意见，花妈你别把人玩坏就行"
 sm_toho_yards: "神秘太空港"
 sm_toho_yards_desc: "河童们设计的太空港，集军工、商业、旅游为一体 — — 完善的造船产业链、水兵培训系统，可以急速扩充舰队"
 sm_th_spaceport_mana_factory: "真空灵力井喷器"
 sm_th_spaceport_mana_factory_desc: "在真空环境下使用灵力转换技术将巨量能源化为灵力喷出"
 sm_th_spaceport_sukima_warehouse: "隙间仓库"
 sm_th_spaceport_sukima_warehouse_desc: "假如忽略掉每次进出仓库都要承受一次san check的代价外，隙间用来存东西真是太方便不过了"
 sm_warper: "恒星灵力收集器"
 sm_warper_desc: "恒星其实都是上古时代的妖怪或神明，我们有办法将他们的能量转化成灵力"
 sm_shrine: "鸟船空间站"
 sm_shrine_desc: "空间站的额外生态区域，让我们在太空中也能过上舒适生活"
 sm_th_smelter: "无重力锻炉"
 sm_th_smelter_desc:0"失重环境下，生产泡沫结构合金的效率非常之高"
 sm_touhou_improved_gun_battery: "隙间强化炮台组"
 sm_touhou_improved_gun_battery_desc: "隙间强化的炮台组支持我们在有限的空间内堆叠超量的炮台数量，提升空间站结构稳定性的同时还融合了其他模块的功能。\n这将为空间站添加两个大型炮台与两个中型炮台。"
 sm_touhou_improved_missile_battery: "隙间鱼雷发射平台"
 sm_touhou_improved_missile_battery_desc: "隙间强化的鱼雷发射平台"支持我们在有限的空间内堆叠超量的鱼雷发射装置，提升空间站结构稳定性的同时还融合了其他模块的功能。\n这将为空间站添加四个鱼雷发射槽位。"
 sm_touhou_improved_hangar_bay: "隙间航空指挥塔"
 sm_touhou_improved_hangar_bay_desc: "隙间强化的航空指挥塔支持我们在有限的空间内堆叠舰载机机库与点防御设施，提升空间站结构稳定性的同时还融合了其他模块的功能。\n这将为空间站添加四个点防御槽位与一个机库。"
 sm_touhou_improved_extra_gun: "隙间大型武器浮动平台"
 sm_touhou_improved_extra_gun_desc: "隙间强化的武器浮动平台支持我们在有限的空间内装下原先不可能装备于空间站的轴基武器，虽然代价是略微影响了空间站的结构稳定性。\n这将为空间站添加一个大型轴基武器槽位与一个小型炮台。"
 sm_touhou_starbase_satori_eye: "$th_ship_part_satori$"
 sm_touhou_starbase_satori_eye_desc: "觉妖怪强大而读心能力可以感知到敌方的行动，从而精准的进行打击。"
 sm_touhou_starbase_satori_eye_effect: "§Y这将为空间站装备$th_ship_part_satori$组件。§!"
 sm_touhou_starbase_koishi_eye: "$th_ship_part_koishi$"
 sm_touhou_starbase_koishi_eye_desc: "反向运行觉妖怪的能力，彻底关闭眼睛后产生无意识存在的心灵干扰系统。"
 sm_touhou_starbase_koishi_eye_effect: "§Y这将为空间站装备$th_ship_part_koishi$组件。§!"
 sm_touhou_starbase_sakuya: "$th_ship_part_yueshiji$"
 sm_touhou_starbase_sakuya_desc: "斯卡雷特帝国稍微窥探到时间力量的证明，能稍微减缓对方时间的超现实技术。"
