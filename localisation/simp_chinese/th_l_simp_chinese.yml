 toho.4022.name: "组织$touhou_shell_world$探索"
 toho.4022.desc: "在我们摆脱黑暗蒙昧的时代，踏入星河之后，一些疑问一直在我们心中：\n\n这座巨型设施究竟是谁设计的？\n那些舰船究竟为何坠落至此？\n我们又如何起源？\n\n随着我们发展出了先进的技术，可以开始考虑对这座壳世界进行彻底的探索了。"
 toho.4022.a: "好极了。"
 toho.4023.name: "活体金属外壳"
 toho.4023.desc: "在对$touhou_shell_world_orange$的探索过程中，我们发现其使用的特殊合金中包含了活体金属的成分，也许我们对这些活体金属进行研究可以加快我们对这座特殊$touhou_shell_world_orange$的理解与认识，并且推测出哪些结构中可能潜藏有尚未发现的舱室与空间。"
 toho.4023.a: "批准这项计划。"
 toho.4023.b: "感觉不太现实。"
 toho.4024.name: "星界壳层"
 toho.4024.desc: "由于近期在星界技术上的突破，我们的研究团队结合一些奇特的特征，推测这座$touhou_shell_world_orange$中可能存在着被转移到了另一个位面之中的壳层。为此，研究团队申请调派一批资源用于打破星界壁垒，重新建立两个壳层之间的联系，其在提供额外的可用空间的同时，对我们的研究应该也有帮助。"
 toho.4024.a: "批准研究。"
 toho.4024.b: "我们没有足够的资源。"
 d_touhou_shell_world_astral_layer: "星界壳层"
 d_touhou_shell_world_astral_layer_desc: "这一奇特的壳层似乎不存在于我们的现实中，而是另一个位面内，我们成功打破星界壁垒重新建立了两个壳层之间的联系，现在我们可以获取到额外的空间了。"
 toho.4025.name: "第一壳层"
 toho.4025.desc: "我们的调查团队进入了第一壳层展开调查。\n\n作为最靠近我们母星的壳层，其在数十年前就已经被我们初步殖民，因此调查工作应该会相当轻松。在殖民过程中，我们曾经发现过一个维护工作区，但由于技术水平的不足，我们无法破解包裹着它的灵力护盾。不过随着当地政府与我们科学部门对这一护盾的长期研究，这一次探索团队成功破解了这一护盾。\n\n为什么一个普通的工作区周围要用护盾隔绝，也许里面别有洞天？"
 toho.4025.a: "有点意思。"
 toho.4026.name: "远古设施"
 toho.4026.desc: "经过一段时间的调查，我们的探索团队有了新的发现，这里似乎存在着一处$touhou_shell_world_orange$建造这遗留的大型设施，其建筑风格与我们早年间在古代城市所见到的档案馆类似，但规模要更加庞大。\n\n这处档案馆的安全权限也远比$touhou_shell_world_orange$上的其他古代设施要高，调查员们花费了很长时间才成功进入这座档案馆。"
 toho.4026.a: "了解了。"
 toho.4027.name: "古代AI"
 toho.4027.desc: "在调查员们进入档案馆之后，首先映入眼帘的就是一个悬浮在空中的暗蓝色球体，其上雕刻有华丽的淡粉色纹饰，其风格意外的和我们舰船常用的纹饰相似。\n\n经过测量分析后，调查团队推断出这是一个属于设施建造者的先进AI，其内部部分结构似乎不存在于我们的现实中，也许设施建造者将AI的核心处理单元用某种技术手段放置于了其他位面之中。在对这个古代AI提供了巨量的能源后，我们成功重启了它。通过交谈得知，它认定我们就是它的主人，并且向我们提供了这座设施的权限与大量信息记录。传输完成后这台古代AI终究没能抵抗过数亿年岁月的侵蚀，彻底的损坏了。\n\n早年间曾经有人猜测我们可能起源于这座设施的建造者，甚至可能就是他们的后裔，然而这种观点因为过于夸张且缺少证据而一直没有成为主流。现在，对古代AI提供信息的初步分析为这种学说提供了有力的证据。对于剩下信息的解码仍在进行中，我们的调查团队决定分出一拨人对整座设施进行全面调查。"
 toho.4027.a: "真是令人难以置信。"
 toho.4027.b: "那么，为什么我们会沦落至此？"
 toho.4028.name: "灵力之泉"
 toho.4028.desc: "另一队人马传回了消息，他们在这座设施的反应堆附近发现了一个神奇的灵力涌泉，其似乎是另一个位面与我们的单向通道，负责为反应堆供应其所需的输入。\n\n不过这一跨维度涌泉的供应量比反应堆的需求要高，因此我们可以从中获取一些额外的资源。"
 toho.4028.a: "还有这种好事。"
 toho.4029.name: "信息记录 - I"
 toho.4029.desc: "根据信息记录，这座$touhou_shell_world_orange$是最初由一个被称为§H月之都§!的势力修建的，作为§H月之都§!的一处物资生产中心。在与被称为§H魔界§!的势力战争中，来自§H魔界§!的一支分舰队与本地的星区防御舰队爆发了激烈的战斗，$touhou_shell_world_orange$的数个壳层被直接彻底摧毁，其部分残骸坠落在外层，又彻底损坏了一层壳层，剩余的则形成了飘荡在我们母星上空的那些残骸。\n\n然而在战斗最激烈的时候，某种变故使得这场战斗中的双方不得不停止敌对，进入还完好的壳层内躲避灾难。"
 toho.4029.a: "有趣。"
 toho.4030.name: "信息记录 - II"
 toho.4030.desc: "§H月之都§!与§H魔界§!两个文明曾经在数亿年前爆发过数次旷日持久的战争。根据我们天文部门的测算，那个时期宇宙中的较重元素含量较低，双方有可能是为了争夺有限的领土与资源爆发了争端。那个时期非常之早，以至于连超空间航道似乎都不曾存在，新生的文明一定花费了很长的时间才踏入星河。\n\n资料记录中，摧毁了这座$touhou_shell_world_orange$的战争爆发时，双方都已经开发出了跨星系航行技术，然而由于某些原因，§H魔界§!依赖的星界跃迁技术与星界穿梭技术不如以往好用了。根据他们的描述，星界壁垒开始变得难以穿透，他们的扩张再度放缓，而随着银河系数个伴星系得到开发的是其归属权问题，这也成为了战争的导火索。"
 toho.4030.a: "这么说，他们甚至可能是第一批文明？"
 toho.4031.name: "信息记录 - III"
 toho.4031.desc: "最后一部分信息也解密完成了，其大致说明了发生在这个星系中的灾难。\n\n由于§H月之都§!的坚决抵抗，§H魔界§!选择了使用自己的大规模杀伤性武器，引导巨量的灵力对这个星系进行攻击。然而此前派遣过来的分舰队由于星界跃迁引擎的故障无法离开这片星域，而月之都的舰队也因为攻击前的引力扭曲效应而无法跃迁离开。\n\n于是他们决定放下仇恨，躲入$touhou_shell_world_orange$。由于$touhou_shell_world_orange$的结构无法抵御接下来的攻击，他们选择引导整个舰队的护盾到最外层的壳层，并且利用本地的能源网络强化这一护盾的强度，最终幸存了下来。\n\n然而由于人数稀少且$touhou_shell_world_orange$的大量工业设施被破坏，加之缺少来自外部的援助，双方人员的科技水平经历了明显的技术倒退，这些人也就是我们的先祖。"
 toho.4031.a: "原来如此。"
 toho.4032.name: "远古数据库"
 toho.4032.desc: "在古代AI遗留的信息基本解码完成后，另一队传回了他们的新发现——一座远古数据库。如果没猜错的话，先祖应该将一些相当重要的技术储存在了这里，等待他们的后人发掘并且利用这些技术。\n\n由于其储存介质我们从未见过，甚至数据库的服务器有相当一部分处于另一个位面之中，我们需要花费大量的时间进行研究。"
 toho.4032.a: "希望数据保存的完好。"
 toho.4033.name: "魔界位面"
 toho.4033.desc: "在研究了先祖的星界技术之后，我们成功找到了穿越星界壁垒的方式，抵达了位于另一个位面的服务器本体。根据记录，这一位面被称为§H魔界§!，是由§H魔界文明§!一手创造出来的位面。可惜的是，我们的能源水平不足以支持我们在这片空间进行远距离的探索，难以想象前人究竟使用着何等功率的能源。\n\n在这里，我们找到了前人为我们遗留的技术文档，里面阐述了如何访问这一数据库，以及如何接入，接下来我们只需要等待科研团队进行读取和分析了。"
 toho.4033.a: "挺好。"
 toho.4034.name: "遗留数据"
 toho.4034.desc: "对于远古数据库一部分数据的解读已经完成了，其似乎包含了一种先进的防御手段设计，以及一组奇特的坐标，他们似乎指向了某个河外星系，在研究出跨星系航行的手段之前，也许我们都没法抵达那里吧。"
 toho.4034.a: "有趣。"
 toho.4035.name: "数据解析完成"
 toho.4035.desc: "我们已经完成了对§H魔界§!与§H月之都§!遗留数据的解析，他们留下了有关这座壳世界相当详细的文档，这些资料将协助我们完善这座$touhou_shell_world_orange$，很快我们就不再需要担心其结构稳定性有关的事情了。\n\n此外，其中还包含了一些先进的武器与舰船设计，这也许就是先驱给我们的全部馈赠了。"
 toho.4035.a: "一场伟大的胜利。"
 toho.4035.effect: "在将来，当我们研究了巨型结构有关的科技后，我们可以着手研究£engineering£['touhou_shell_world']。"
 toho.4036.name: "壳世界设计"
 toho.4036.desc: "随着技术的发展，我们对于展开星球级别的巨型结构建造已经有了一定的理解，考虑到前人遗留给我们的设计，我们可以准备着手设计自己的$touhou_shell_world_orange$了。"
 toho.4036.a: "多么好的机会啊。"
