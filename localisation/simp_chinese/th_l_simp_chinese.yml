 ###############神器
 r_th_latency: "燕石博物志"
 r_th_latency_desc: " \n\n\n\n\n\n£relic_hiff_in_ruined_park£\n\n\n\n\n\n\n这是我们在首都突然出现的遗址中发掘并修复的神秘物品。遗址内部的资料记载，它的创造者名为：玛艾露贝莉 赫恩。"
 r_th_yin_yang_orb: "阴阳玉"
 r_th_yin_yang_orb_tooltip: "提供基于当前年份、帝国规模、飞升数量的£sr_lingli£$sr_lingli$与£sr_fuka£$sr_fuka$产出。每激活一次$r_th_yin_yang_orb$，其£sr_lingli£与£sr_fuka£产出均会上升。\n同时根据等价于激活时能量、动能武器伤害中的最大值的50-100%，增幅灵力武器伤害。\n$relic_activation_cooldown$：£time£ §Y1800§!"
 r_th_yin_yang_orb_desc: "\n\n\n\n\n\n£relic_th_yin_yang_orb_bg£\n\n\n\n\n\n\n博丽神社的最大秘宝\n\n本体不明的玉，因为非常有灵力，让人觉得存有有某种灵魂，或者整个球就是生命体。 通常，对于灵体和有魔性的东西来说，如果使用的武器没有这种灵力，是不可能将其打倒的。"
 r_th_gap_kamikakushi: "§M雾霭的境界线§!"
 r_th_gap_kamikakushi_cooldown: "隙间启用冷却：§Y1800§!\n§R初次启用后即可持续的开启其中的力量§!"
 r_th_gap_kamikakushi_tooltip: "§M错乱的空间中隐藏着神秘的存在§!\n\n那些存在的力量可以为我们的殖民地提供§R额外的空间§!，代价是大量丝缕的维护。\n§R或许这并非明智之举。§!\n\n"
 r_th_gap_kamikakushi_desc: "\n\n\n\n\n\n\n\n£th_gap£\n\n\n\n\n\n\n\n感知崩坏的世界中潜伏着恐怖的谜团，你能感受到其通往的空间散发出的诡异力量。与之同时发现的还有两个信封，其中一个装的是用血画了魔法阵的图案，另一个则有着未知的力量所绽放的樱花瓣。"
 on_latency: "燕石博物志带来的黑暗"
 r_th_cannonball: "博丽阴阳玉"
 r_th_cannonball_desc: "根据考古发现复原的博丽秘宝——阴阳玉。是一个宏观级别的希格斯玻色子，通过特殊的方式旋转它，可以直接修改宇宙中的物理法则。"
 on_cannonball: "东方大炮弹"
 r_th_hakkero: "迷你八卦炉"
 r_th_hakkero_desc: "用最后的绯色金属仿造的迷你八卦炉，其对化学能量的应用效率堪比反物质反应堆。"
 on_hakkero: "大师级曲率点火"
 r_th_yakumo: "八云氏隙间驱动器"
 r_th_yakumo_desc: "重见天日的秘术，随意操纵境界程度的高等科学应用，它的存在重新定义了我们的宇宙旅行方式。"
 on_yakumo: "波与粒子的境界"
 r_th_spec1: "科幻飞船设定集——KNIGHT"
 r_th_spec1_desc: "描绘了各种精明凶悍的小型飞船"
 r_th_spec2: "科幻飞船设定集——GENERAL"
 r_th_spec2_desc: "描绘了各种宏伟坚固的战列舰"
 r_th_spec3: "科幻飞船设定集——KHAN"
 r_th_spec3_desc: "描绘了史前太空文明的统治者座舰"
