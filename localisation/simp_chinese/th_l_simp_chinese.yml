 th_ghost_of_damaku_tt: "该舰船击杀敌人后，有5%*组件数量几率['concept_ship_spth_extra_life_power_down']在60天内临时减少至其下限。"
 th_ghost_of_damaku_DESC: " \n\n\n\n\n\n£th_yuyuko_port£\n\n\n\n\n\n\n西行寺幽幽子的能力，有时能在擦过弹幕时将其消去亡灵不会害怕死亡。\n\n不，应该说不可能害怕\n擦弹指的是接受对死亡的恐惧\n对于不可能害怕死亡的亡灵来说擦弹无法造成任何威胁"
 ship_part_aura_touhou_minefield: "灵力扭曲武器"
 ship_part_aura_touhou_minefield_DESC: "$tech_ship_part_aura_touhou_minefield_desc$"
 ship_part_aura_touhou_minefield_name: "一型引力场"
 ship_part_aura_touhou_minefield_tooltip: "该雷场仅有§Y$ship_part_aura_touhou_minefield_name$§!会一直生效，其他的雷场仅有在具备联动效果的武器命中目标时条件生效。"
 ship_part_aura_touhou_minefield_starbase: "灵力星际雷场"
 ship_part_aura_touhou_minefield_starbase_DESC: "$tech_ship_part_aura_touhou_minefield_desc$\n恒星基地这样的大型平台可以携带威力更强的雷场，同时融合了功率更高的符卡。"
 ship_part_aura_touhou_minefield_starbase_name: "二型引力场"
 ship_part_aura_touhou_minefield_lunar: "净土三型 灵力扭曲武器"
 ship_part_aura_touhou_minefield_lunar_DESC: "$tech_ship_part_aura_touhou_minefield_desc$\n月之都使用的灵力扭曲武器在原理与功率上都要更加先进，并且可以制造出可以创造出局部无法安全进入超空间的区域，增加计算撤离航道的成本，甚至阻断跃迁引擎的正常运作。"
 ship_part_aura_touhou_minefield_lunar_name: "浅间一型 引力场"
 ship_part_aura_touhou_minefield_lunar_name_2: "引力井发生器"
 ship_part_aura_touhou_minefield_lunar_tooltip: "§H超光速抑制器§!- 敌方舰队一旦进入，将无法通过除进入航道以外的任何超空间航道驶离。"
 touhou_kamikakushi_supressor: "祈风「祝福铃音」 "
 touhou_kamikakushi_supressor_aura: "§E凶灾之符§!"
 touhou_kamikakushi_supressor_DESC: "这个组件能够一定程度上阻断隙间之里的远程信号通讯与能量传输，从而尽可能阻止其自动巡洋舰在被摧毁后折跃增援舰船。"
 touhou_crisis.1001.name: "抑制组件设计"
 touhou_crisis.1001.desc: "之前与隙间之里的交战报告里提及了在他们的§Y小型舰船被摧毁§!后似乎会折跃§Y额外的增援舰船§!，并且似乎有什么额外的能量源在给他们的舰船供能。针对这一现象，我们的科学部门最近成功研究出了针对其远程通讯与能量传输的抑制方案，只要§Y我们的舰队中有舰船携带了针对性的抑制组件§!，我们就可以一定程度上削减隙间之里舰船的战斗能力。\n\n此外一些临时性的改装也已经应用在了我们的舰队上，但效果没有针对性的抑制组件那么好。"
 touhou_crisis.1001.a: "真是个好消息。"
 tech_kamikakushi_supressor: "$touhou_kamikakushi_supressor_aura$"
 tech_kamikakushi_supressor_desc: ""
 touhou_yuyuko_barrier: "诱魂「灵体羽化」"
 touhou_yuyuko_barrier_aura: "§E彷徨的空蝉§!"
 touhou_yuyuko_barrier_DESC: "这个组件可以干扰深层虚境与升格派在现实世界投影之间的灵能联系，从而使其不再如先前一样难以被摧毁。"
