 r_th_yin_yang_orb: "Yin-Yang Orb"
 r_th_yin_yang_orb_tooltip: "Provides £sr_lingli£$sr_lingli$ and £sr_fuka£$sr_fuka$ production based on current year, empire size, ascension perks. Each time $r_th_yin_yang_orb$ is activated, both its £sr_lingli£ and £sr_fuka£ production increases.\nIncreases psychic weapon damage by 50-100% of the maximum value of energy and kinetic weapon damage when activated.\n$relic_activation_cooldown$: £time£§Y1800§!"
 r_th_yin_yang_orb_desc: "\n\n\n\n\n\n\n£relic_th_yin_yang_orb_bg£\n\n\n\n\n\n\n\nThe greatest secret treasure of Hakurei Shrine\n\nThe jade with an unknown body, because it is very spiritual, makes people feel that there is some kind of soul, or the whole ball is a living body. Usually, for spirits and demonic things, if the weapon used does not have this kind of spiritual power, it is impossible to defeat them."
