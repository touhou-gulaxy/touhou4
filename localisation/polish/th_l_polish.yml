 origin_gensokyo_ringworld: "Fantasy Ring"
 origin_gensokyo_ringworld_desc: "It's still unknown how the Gensokyo of this worldline originated. They just live in the §UFantasy Ring World§! built by unknown precursors. From drilling wood to make fire, to the awakening of power, and to the stars. Once the Ring World is understood and repaired, they will attain unprecedented power."
