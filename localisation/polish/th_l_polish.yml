 origin_th_hiff: "§UAge of Science§!"
 origin_th_hiff_desc: "In the Age of Science, science flourished and information technology reached extraordinary heights. People gained equal access to knowledge, while physics entered an era of interpretation and philosophy.\n\nYet imagination withered; the inexplicable was dismissed as mere error, and mystery itself was denied. But as technology advanced, Gensokyo was at last brought into the open. The reappearance of legendary beings in the world infused humanity with a new surge of vitality."
