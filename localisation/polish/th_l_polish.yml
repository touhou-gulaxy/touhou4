 toho.8210.name: "§U灵能爆发§!"
 toho.8210.desc: "我们中的灵能[GetResearchers]在对近期虚境活动数据的分析中发现，在更深处的$touhou_shroud_lower_level$中，这里按理说没有什么灵能实体能够涉足，即使是那些在浅层虚境称霸一方的超主也是如此。\n\n但是最近他们观测到爆发出了带有灵力特征的灵能活动模式，似乎有某种存在在向我们发出邀请，或许我们应该尝试潜入浅层虚境。"
 toho.8210.a: "Interesting."
 TOUHOU_INTO_DEEPER_LOWER_SHROUD: "$touhou_shroud_lower_level$深潜"
 TOUHOU_INTO_DEEPER_LOWER_SHROUD_DESC: "组织一次特别的灵能深潜，进入更深层的$TOUHOU_INTO_DEEPER_LOWER_SHROUD$，寻找我们发现的灵能活动模式源头。"
 toho.8073.name: "§P灵能研究§!"
 toho.8073.desc: "针对§H$MINDWARDEN$§!的虚境封印，近期我们的科学家成功开发出了具备针对其灵能增幅效应的装置。其可以在局部范围内将其完全抑制住，使得我们的殖民地不再遭受灵能抑制，这种设备需要被部署在维持灵能信号的星系内。至少面对当前星系中流行的灵能抑制技术而言，这一灵能增幅的模式尚且无法被抑制。\n\n此外这种灵能增幅器还对§H大多数的灵能活动模式§!都具备一定的增强效果，而且星系内的§H舰船跃迁能力将获得增强§!，受到影响的物种则会缓慢的获得灵能能力。"
 toho.8073.a: "很好。"
 toho.8074.name: "§P灵能抑制手段§!"
 toho.8074.desc: "§H$MINDWARDEN$§!的虚境封印带给我们了一定的启发，考虑到将来我们可能会遇到某些§R负面灵能活动§!，我们的灵能研究团队研究出了泛用的§H灵能抑制设备§!，其可以在局部范围内将大部分灵能活动完全抑制住，从而屏蔽可能的负面影响，我们只需要将其部署在存在危害性灵能活动的星系中即可。\n\n而且这一灵能抑制设备比起§H$MINDWARDEN$§!的虚境封印要更为可靠，不会在某些特定的灵能活动模式下失效。不过值得注意的是，物种的灵能天赋会在星系内灵能抑制装置的影响下§H逐渐消退§!。"
 toho.8074.a: "希望不会有派上用场的那一天吧。"
 TOUHOU_PSI_DOLL_DESC:0 " \n\n\n\n\n\n\n£koakuma_and_knowledge£\n\n\n\n\n\n\n特质魔法丝线操纵的战斗人形,可以拆下对面船只的能源模块为己方利用\n能够借助虚境短距离跃迁，虚无缥缈的航迹使其更难被拦截"
 TOUHOU_PSI_BOOK_DESC:0 " \n\n\n\n\n\n\n£koakuma_and_knowledge£\n\n\n\n\n\n\n不知道从哪里抽出来的魔导书\n能够借助虚境短距离跃迁，虚无缥缈的航迹使其更难被拦截"
 toho.8080.name: "§M深层虚境§!"
 toho.8080.desc: "你的行为，\n你的诉求，\n\n多么的有趣啊。\n\n§R不论如何，谢谢你。§!"
 toho.8080.desc.lunar: "你的行为，\n你的渴求，\n\n真的，多么的有趣啊。\n\n你不会真的以为能摆脱我们吧。\n§R不论如何，谢谢你。§!"
 toho.8080.a: "你们是什么？"
 toho.8080.b: "这是怎么回事？"
 toho.8080.c: "§R无所谓，我会消灭你们。§!"
 toho.8080.d: "§G...那好吧。§!"
 toho.8080.a.response: "我们，\n是深层虚境的存在。\n\n实际上，虚境远比你们想象的要深要大，\n你们接触到的基本都只是表层和浅层虚境。\n\n事实上，深层虚境远比表层和浅层虚境要广袤的多。\n进入虚境越深，灵能活动越活跃，也越危险。\n当然，我们也无法进入虚境的最深处，那里近乎无穷大的能量会撕碎一切。"
 toho.8080.b.response: "你们的以太相引擎只能引导浅层虚境的能量，\n也只能摧毁浅层虚境的一片空间。\n\n至于所谓的升格也只是错觉，\n实际上磅礴的虚境能量根本无法被正确的引导。\n\n不过，你可以选择接受我们的引导。"
 toho.8080.c.response: "...\n\n§R那么，我就放任你们自取灭亡了。§!"
 toho.8080.d.response: "那么，就这样了。\n\n这片银河会成为我们收割能量的地方，\n我们会为你们提供一小块空间，供你们更好的生存与发展。\n\n虽说是一小块空间吧，\n但也比你们之前的宇宙要大得多了哦。"
 toho.8080.tooltip: "§R§M深层虚境中的存在§!借助以太相引擎从浅层虚境释放的能量，入侵了现实。§!"
 toho.8081.name: "§M深层虚境§!"
 toho.8081.desc: "轮回之终末这位灵能实体，\n真的自大啊。\n\n但是呢，恐怕不论是你还是它，\n§R都被有限的表层给蒙蔽了。§!"
 toho.8081.a.response: "我们，\n是深层虚境的存在。\n\n实际上，虚境远比你们想象的要深要大，\n你们接触到的基本都只是表层和浅层虚境。\n\n事实上，深层虚境远比表层和浅层虚境要广袤的多。\n进入虚境越深，灵能活动越活跃，也越危险。\n当然，我们也无法进入虚境的最深处，那里近乎无穷大的能量会撕碎一切。"
 toho.8081.b.response: "实际上超主们呢，也只是在浅层虚境活动呢。\n\n它的许诺实际上也是某种过度自信，试图吞噬整个宇宙，\n然而这其实是不可能的，浅层虚境的能量只能吞没整个河系。\n\n哪怕深层虚境中的我们也没有能力吞没整个宇宙。"
 toho.8081.c.response: "...\n\n§R那么，我就放任你们自取灭亡了。§!"
 toho.8081.d.response: "那么，就这样了。\n\n这片银河会成为我们收割能量的地方，\n我们会为你们提供一小块空间，供你们更好的生存与发展。\n\n虽说是一小块空间吧，\n但也比你们之前的宇宙要大得多了哦。"
 toho.8081.tooltip: "§R§M深层虚境中的存在§!借助轮回之终末从浅层虚境释放的能量，入侵了现实。§!"
