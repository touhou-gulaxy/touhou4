 touhou_astral_signals_poi_5: "Signal - Void"
 touhou_astral_signals_poi_6: "Signal - Papillons"
 touhou_astral_signals_poi_7: "Signal - Memorandum"
 toho.8023.name: "§B星际搜索§!"
 toho.8023.desc: "在对§H[From.solar_system.GetName]§!周围进行了一段时间的调查后，§H[Root.GetName]§!成功找到了一些有意义的东西——一座疑似发射站的东西和一台位于顶部的大型射电望远镜。"
 toho.8023.a: "interesting."
 toho.8024.name: "§B一无所获§!"
 toho.8024.desc: "在对§H[From.solar_system.GetName]§!周围进行了一段时间的调查后，§H[Root.GetName]§!最终得出结论——这里确实什么也没有。"
 toho.8024.a: "how could it be..."
 site_touhou_astral_signals: "§BThe Forgotten Stargazer§!"
 site_touhou_astral_signals_intro: "A silent structure rises from the surface of this world -- a facility integrated with large radio telescopes.\n$touhou_astral_signals$ appear to originate from within."
 toho.8026.name: "无缘塚的花开"
 toho.8026.desc: "最近，无缘塚中的地上盛开着彼岸花，周围生长着成片的紫之樱，彼岸花与紫之樱一起盛开的场景非常凄美。根据一些妖怪们的回忆，每60年这些紫之樱便会开放的格外繁盛，而当紫之樱盛开的时候，无缘塚的亡者会解开迷惘，踏上去往三途河的中有之道。\n\n然而，这次的情况有点出人意料。\n到了本该恢复的时候，这里的樱花花瓣并没有停止散落，也没有停止盛放。\n\n「说着马上就好，马上就好什么的。\n究竟到何时樱花才能变回原貌呀。」\n谁也说不清呢。"
 toho.8027.name: "前兆"
 toho.8027.desc: "渐渐的，人们开始发现情况有点失控，幻想乡中全年的花都莫名其妙的盛开了，一些年长的妖怪则想起了曾经幻想乡内120季春天时的一场异变。\n\n虽然表象上只是花的数量异常增多还违反季节的盛开，但是在灵力强大的个体眼里，可就不一样了。\n「虽然被花给迷惑了，\n但仔细看看根本到处都是幽灵啊。」\n\n不过目前还没有引起什么太严重的事，所以大部分人还是当作无事发生。"
 toho.8028.name: "幽灵暴走"
 toho.8028.desc: "事情开始不对劲起来了，大量的幽灵突然出现在了各处，由于幽灵的体温非常低，各地开始出现了冻伤的报告。而且一些人从此前的沉默寡言变得充满了活力，一些人则变得忧郁起来。\n\n根据冥界的解释，幽灵的可怕在于能够影响附近居民的精神，精神力不强的人若遇到强力的幽灵，有可能会被精神破坏，但目前冥界对于这一幽灵暴走的情况也暂时没有对策。"
 toho.8029.name: "花之异变"
 toho.8029.desc: "针对这次异变，我们已经将其命名为花之异变，在[Root.GetRulerTitle]的带领下，我们开始了对这一异变的调查。不过奇怪的是，那些年长的妖怪们仿佛对此事无动于衷，也不愿意参与调查。"
 touhou_flower_incident: "§B花之异变§!"
 touhou_flower_incident_title: "$touhou_flower_incident$"
 touhou_flower_incident_desc: "全年的花都莫名其妙的盛开了，而在其中紫香花与彼岸花尤其更甚。除此之外幽灵也开始在这些星球上爆发，我们需要想办法解决这次的异变。"
 touhou_flower_incident_our_cherry_count: "§P境内紫香花盛开§!"
 touhou_flower_incident_our_flower_count: "§P境内彼岸花盛开§!"
 touhou_flower_incident_our_ghost_affect_planet: "§P境内受异变影响的星球§!"
 toho.8040.name: "调查受挫"
 toho.8040.desc: "虽然怀疑是$NAME_komachi$没有及时将死者的幽灵运抵地狱，但是以她惯常的工作态度……似乎又和她没有直接关系。倒是她反而因为我们在再思之道从而误解了我们的想法，以为我们也是来这里的自杀者。\n\n「啊，真的休息得有些久了。\n不过没关系。\n这个休假是能提高工作效率的。」\n对于这种消极的工作态度，我们也只能用一些更主动的方式劝她别再到处玩了，好好地将幽灵送往彼岸。"
 toho.8041.name: "四季的花之主"
 toho.8041.desc: "之后，我们又在花田和人里以外的地方遇到了花之妖怪，$NAME_yuza$。虽然不是很确定，但是花之盛开的事情也许与她存在着关联。\n\n然而经过“沟通”后，似乎这一切和$NAME_yuza$没有什么关联，她只是因为繁花盛开而出来欣赏的。"
 toho.8042.name: "阎魔大人"
 toho.8042.desc: "看起来这一切也和花之妖怪没有什么必然的关联。\n\n就在[Ruler.GetName]一筹莫展之际，地狱是非曲直厅的$NAME_shikieiki$突然找上了门来。"
 touhou_shiki_modifier: "四季的说教"
 touhou_shiki_modifier_desc: ""
 mod_weapon_type_spark_weapon_fire_rate_mult: "Master Spark Fire Rate"
 mod_weapon_type_spark_weapon_damage_mult: "Master Spark Damage"
 weapon_type_spark: "§HMaster Spark§!"
 th_leader_sp.213.name: "§P[From.GetName]上的异变§!"
 th_leader_sp.213.desc: "[From.GetName]在进入战斗后，古明地恋与秦心为了争夺希望之面，不慎让希望之面掉到了不知道什么地方，秦心由于希望之面丢失而力量暴走，发生了不好的事情。很明显舰船的安全部队无法阻止她们二人放弃指挥岗位、转而跑到太空中进行符卡战斗。。。"
 th_leader_sp.213.a: "？"
 th_leader_sp.213.aa: "？？？"
 th_leader_sp.213.b: "对，对吗？"
 toho.8100.name: "§B“聪明”的冰精§!"
 toho.8100.desc: "寺子屋开设一段时间后，一些学生用的数学教材被人恶作剧般的篡改了，里面全是些诸如“1+1=⑨”这种奇奇怪怪的东西，还有一些涂黑的文字附近写着歪歪扭扭的文字，勉强能辨认出在宣告“我是最强的”。\n\n不过很快任职老师就找出来恶作剧的始作俑者——一只蓝色的冰精，原来是琪露诺啊。反复强调什么“我是最聪明的“一类的话，但是这和她的行为似乎不太贴切呢。。。"
 toho.8100.a: "唉唉，让她留在寺子屋学点东西吧。"
 toho.8100.b: "啊好的好的，你是对的"
 th_weapon_needle: "Sealing Needle"
 th_weapon_needle_DESC: " \n\n\n\n\n\n\n£thndj_reimu_2£\n\n\n\n\n\n\nConsecutive firing massive Sealing Needle can rapidly overload enemy shields."
