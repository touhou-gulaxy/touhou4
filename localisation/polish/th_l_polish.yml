 origin_gensokyo_ringworld_neg_effects: "- §R What could go wrong? §!"
 origin_gensokyo_ringworld_start_NAME: "Shattered Fantasy Ring"
 origin_gensokyo_ringworld_start_DESC: "Two sections of the Fantasy Ring World are damaged and repairable."
 d_gensokyo_ringworld: "Unknown rift"
 d_gensokyo_ringworld_desc: "通往§M未知位面§!的星界裂隙，但我们无法穿行。也许这是这座环形装置的建造者遗留的？"
 d_gensokyo_ringworld_ruin: "古代遗迹"
 d_gensokyo_ringworld_ruin_desc: "大概是环形装置设施建造者城市的遗迹，我们文明的发展正是从此开始，对我们提供了很多启发。"
 d_gensokyo_ringworld_city: "City of Precursor"
 d_gensokyo_ringworld_city_desc: "A colossal city forged by the pioneers."
 gensokyo_ringworld_modifier: "Ancient Ring Construct"
 gensokyo_ringworld_modifier_desc: "Fantasy Ring World built by §Man ancient civilization§!. Although it's slower to build for unknown reasons, more construction tasks can be started simultaneously. It also provides excellent defense for the colony."
 START_SCREEN_THRW: "我们的朦胧过往已经被遗忘，只知道先祖们从这座巨大的环形装置上开始发展。起初的探索非常困难，环形装置带给我们过错误的认知。直到信息革命后，我们开始对设施建造者的信息与科技开始解读，极大的促进了科技发展与对我们自身力量——灵力——的认知。\n\n如果猜测正确，我们应该就是他们的后裔，或许群星中仍存在着远古先驱的遗迹，也可能存在着他们所面临的危机，但不管什么都无法阻止我们前进的步伐。"
 origin_gensokyo_koishi: "the Phantasm City"
 origin_gensokyo_koishi_desc: "After a series of incidents, Gensokyo finally emerged into the Outside World. Its unique presence challenged mundane outside worldviews. People have taken reformation in society and rebuilt the world with unprecedented enthusiasm. With the help of Underworld citizens, metropolises forged with technology and fantasy are constructed, as our first step to the stars."
 origin_gensokyo_koishi_effects: "-Homeworld:\n - ['pc_gensokyo_city', Gensokyo Ecumenopolis]\n - 15 years of increase in build speed. "
 origin_gensokyo_koishi_neg_effects: "- Starting faction is fixed to be Chirenden"
