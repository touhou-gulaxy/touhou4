 toho.8048.name: "$lunar_capital_psi_aura$"
 toho.8048.desc: "我们在§H[from.GetName]§!恒星系探测到了高浓度灵能能量。我们的[GetTelepathPlural]通过倾听§H虚境§!中的回声得知，这一现象是由§M升格派§!的灵能活动引起的。\n\n它被称为§H“$PSIONIC_AURA$”§!，是由一个强大灵能实体所发出，即使它不在虚境中，它的影响依然如此强烈。这个$PSIONIC_AURA$影响着可观测现实的物质和意识，我们还观测到这些光环可以在恒星系之间传播。\n\n我们的数据显示，该光环有极强的负面影响。如果不加以应对，它将会快速传遍整个星系。"
 toho.8048.a: "$TH_WORYING$"
 toho.8049.name: "§M灵能光环对抗§!"
 toho.8049.desc: "§H[from.GetName]§!恒星系内我们的§H$PSIONIC_AURA$§!正在与来自附近§H[fromfrom.GetName]§!恒星系的敌对光环进行激烈斗争。我们的灵能[GetResearchers]曾对这种行为进行过建模，但这是我们第一次获得这种现象的一手资料。\n\n理论上来说，越强的光环——就是说投射的强度越大——将会逐渐驱散敌对力量，如果这种斗争导致一方完败，占主导地位的光环可能就会流入空出来的恒星系。\n\n这真是字面意义上的“灵魂的碰撞”。\n\n不幸的是，§H[fromfrom.GetName]§!内的$PSIONIC_AURA$过于强大了，我们的常规灵能对抗手段根本没有任何效果。"
 toho.8049.a: "这怎么可能？"
 toho.8050.name: "§M虚境封印被无效化§!"
 toho.8050.desc: "天文观测表明§H[From.GetName]§!内的虚境封印发生了一些令人不安的变化，它开始以一种令人不安的模式散发出紫色的光芒，并且周围弥漫着诡异的迷雾。与此同时，我们在§H[From.GetName]§!内检测到的灵能活动水平大幅增加了。\n\n很显然，§H[From.GetName]§!内的虚境封印已经失效了，不仅如此，它甚至还在助长当地的灵能活动，很显然，我们必须要处理掉那个曾经是虚境封印的东西了。"
 toho.8050.a: "怎么回事？"
 toho.8052.name: "§M植被腐化§!"
 toho.8052.desc: "§H[from.GetName]§!上的虚境化植被由于$lunar_capital_psi_aura$§H$PSIONIC_AURA$§!的某些未知效应，开始以一种令人不安的模式散发出扭曲的灵能活动，并且周围弥漫着诡异的迷雾。与此同时，我们在§H[From.GetName]§!内检测到的灵能活动水平大幅增加了。\n\n由于其灵能环境的高度危害性，我们对于深层虚境中的灵能活动模式几乎没有了解，但很明显，我们必须要处理掉那个曾经是$d_aura_blocker$的东西了。"
 toho.8052.a: "什么情况？"
 toho.8053.name: "§M调和震荡§!"
 toho.8053.desc: "近期，由于§M月之都升格派§!灵能活动的影响，来自灵域的调和受到了扭曲，我们的灵能[GetResearchers]发现，超主向我们赠与的存在发生了一些令人不安的变化。我们曾经以为这些虚境中的存在已经足够强大，但是很明显——\n\n来自浅层虚境的实体难以和深层虚境中那些强大灵能实体抗衡，即使它尚未来到现实，它对我们的影响依然如此强烈。"
 toho.8053.a: "WHAT?"
 toho.8054.name: "§MLiving Rock§!"
 toho.8054.desc: "Shroud Rock on §H[from.GetName]§! seems to be affected by §H$PSIONIC_AURA$§!. It has undergone some unintelligible changes and twists as if it's alive, under the influence of intense psionic power.\n\nLocal investigators have suffered casualties and confirmed that these objects get alive and start to hunt down any nearby creatures as long as there are advanced life forms around and no one is looking at them. We need to purge these craps as soon as possible."
 toho.8054.a: "Is that still a rock?"
 toho.8070.name: "§P灵能抑制效应§!"
 toho.8070.desc: "我们在§H[from.GetName]§!恒星系探测到了高浓度能量活动。我们的[GetTelepathPlural]通过倾听§H虚境§!中的回声得知，这一现象是由§M隙间之里§!的灵能抑制场引起的。\n\n它被称为§H“灵能抑制光环”§!，是由他们部署的灵能抑制装置所发出，即使它不在虚境中，它的影响依然如此强烈。这个抑制场影响着可观测现实的物质和意识，我们还观测到这些光环可以在恒星系之间传播。\n\n我们的数据显示，该光环对灵能获得有极强的抑制作用，甚至可能会使得其范围内的灵能物种逐渐的失去灵能。"
 toho.8070.a: "$TH_WORYING$"
 toho.8071.name: "§P灵能光环被抑制§!"
 toho.8071.desc: "§H[from.GetName]§!恒星系内我们的§H$PSIONIC_AURA$§!正在与来自附近§H[fromfrom.GetName]§!恒星系的灵能抑制光环对抗，我们的灵能[GetResearchers]曾对这种行为进行过建模，但这是我们第一次获得这种现象的一手资料。\n\n理论上来说，越强的光环——就是说投射的强度越大——将会逐渐驱散敌对力量，如果这种斗争导致一方完败，占主导地位的光环可能就会流入空出来的恒星系。\n\n不幸的是，§H[fromfrom.GetName]§!内的灵能抑制效应过于强大了，我们的常规灵能对抗手段根本没有任何效果。"
 toho.8071.a: "这怎么会？"
 th_card.0.d: "尝试心灵上的交流"
 toho.8072.name: "§P灵能增幅设计§!"
 toho.8072.desc: "针对隙间之里的灵能抑制光环，近期我们的科学家成功开发出了具备针对其灵能增幅效应的装置。其可以在局部范围内将其完全抑制住，使得我们的殖民地不再遭受灵能抑制，这种设备需要被部署在维持灵能信号的星系内。\n\n此外这种灵能增幅器还对§H大多数的灵能活动模式§!都具备一定的增强效果，而且星系内的§H舰船跃迁能力会获得增强§!，物种会缓慢的获得灵能能力。"
 toho.8072.a: "好耶。"
