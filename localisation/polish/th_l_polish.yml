 toho.8108.name: "§BFantasy Ring World§! section repaired"
 toho.8108.desc: "Based on a Fantasy Ring World debris in §H[spth_rw_system.GetName]§! system, our engineers successfully restored functionality of one section. A brand new Ring World ecosystem replicated and improved from data left by §Mthe Ancient Precursor§! is now stable and available for residence.\n\nOne more exciting news is that it restarted automated construction progress after we finished repairs. It must also be one of the designs of precursors."
 toho.8109.name: "§BFantasy Ring World§! construction complete"
 toho.8109.desc: "今天，我们的工程师和行星生态学家完成了位于§H[spth_rw_system.GetName]§!星系的环形世界最后一个宜居区间的建造。这个伟大的巨型结构的建造必将成为§H[Root.GetName]§!历史的里程碑。我们完成了屈指可数的文明才能完成的工作。\n\n让这个环形世界成为一个永恒的见证：自从我们从安全的母星踏足至如今，我们达成了什么样的成就。"
 toho.8110.name: "§B幻想城§!已在[Root.GetName]建设完成"
 toho.8110.desc: "层层叠加的幻想城终于完全覆盖了星球的地表。\n\n自从这一宏大计划开始实施以来仅仅过了数年，但已经很难回想起§H[Root.GetName]§!从前的面貌。翠绿的丛林？崎岖的山脉？现在放眼望去，四面八方都是延绵不绝的钢铁。\n\n这里曾经由自然法则任意塑造，而现在则成了由科技与幻想融合而成的设计。"
 toho.8111.name: "§BFantasy Ring World§! has finished construction in [Root.GetName]"
 toho.8111.desc: "我们已经完成了对于环形世界的改造。\n\n自从这一宏大计划开始实施以来仅仅过了数年，但已经很难回想起§H[Root.GetName]§!从前的面貌。"
 toho.8112.name: "§BFantasy World§! has been terraformed on [Root.GetName]."
 toho.8112.desc: "随着磅礴的灵力在§H[Root.GetName]§!之上翻涌，我们已经完成了对星球的幻想星化改造。这里的一切都按照曾经幻想乡的面貌进行设计，灵力充沛的环境更是让人感到极度舒适。"
 gensokyo_start.1251.k: "§E强制启动升格派月都天灾§!"
 spth_history_update_info_2_2_1: "§G2.2.1§! §C光耀珍宝§!版本"
 spth_history_update_info_2_2_1_desc: "2025.7.21$t$更新\n§L1.新增了十多种幻想乡['concept_specimens']\n2.调整了部分武器数值，使其更加合理\n3.战列巡洋舰船体下调25%\n4.增加幻想乡系列舰船对['concept_biological_ship']的支持\n5.新增了残机触发的特效\n6.新增了舰船特殊动作功能，可以在舰船命令中触发；在伞暗蓝UI更新后也可以通过伞UI触发\n7.增加了幻想乡、隙间、魔界与月都舰船的map_icon与专属音效\n8.新增幻想城改造时智能转换区划首府建筑\n9.更新了部分科技图标与gateway\n10.幻想城现在可以通过区域特化将区划全部转为同一种类型\n11.调整了部分岗位的数值，增加了特殊岗位的稀有资源维护费\n12.下调了符卡建筑的数值，符卡铸造区域提供的岗位数量*2\n13.隙间存储仓库现在可以提供少量的文物上限，新增幻想乡星界节点\n14.新增三个法令\n15.新增幻想乡星环建筑\n16.更新部分建筑描述\n17.提高了幻想乡进攻部队的数值\n18.新增指挥上限覆盖为800\n19.增加了巨构建筑的产能基础值\n20.幻想城区划住房数量增加\n21.新增幻想乡平民岗位\n22.优化了天灾的性能\n23.修复了一些已知的bug\n24.联动更新: 虚境侵军的灵能攻击无法击杀部分幻想乡领袖，且部分幻想乡领袖在研究古代文明相关造物时自动被视作11级§!"
