 th_weapon_up.1.name: "P point - Upgrade"
 th_weapon_up.1.desc: "In recent battles, we collected the energy dropped by the enemy and converted it into P(ower) points that we were able to use, and the they were able to enhance the Spiritual Power weapons we used in all directions."
 th_weapon_up.1.a: "That's good."
 th_weapon_up.9.name: "Patchouli's contact"
 th_weapon_up.9.desc: "Remilia Scarlet's friend, the owner of the Scarlet Devil Mansion Library, and the magician of the Seven Elemental Magic - Patchouli Knowledge's recent behavior is a little wrong, although Remilia is very worried but can't find time to ask because of her busy affairs. But just today, Remilia was suddenly called to the Library by Patchouli."
 th_weapon_up.9.a: "What's the matter with me, Patchouli?"
 th_weapon_up.10.name: "七曜的魔法使 - $NAME_patchouli$"
 th_weapon_up.10.first.desc: "Remilia, do you think our weapons are still too weak? I have a bad feeling, that this galaxy will certainly not be safe all the time, and that we will definitely have a tough battle in the future. And with our current level of technology, it will be difficult to fight against the enemy in the future. I recently had some ideas to study with the P points collected before the empire, but I don't know if you will agree."
 th_weapon_up.10.had.desc: "Remilia, What's wrong? Now you're coming to me, so have you decided to use P points to study weapons?"
 th_weapon_up.10.a: "Well, my abilities also have this hunch."
 th_weapon_up.10.a.response: "If your ability to manipulate fate supports this hunch, then it can't be wrong. I will perform special repeatable technologies research, which §Gwill not take§! any of technologies research slots. But due to the amount limitation of Shikigami and Koakuma, I can only research the same technology no more than §G2§! times, and need to use 20% $r_society$, 20% $r_physics$ and 10% $r_engineering$ of our empire, so come to me if you want to do it."
 th_weapon_up.10.b: "I've decided to do weapons research."
 th_weapon_up.10.z: "Well, let me think about it a little more."
 th_weapon_up.11.desc: "Have you figured out which technology you want to do research? Because I'm just a magician, I can't make breakthroughs with pure physics technology, only the special weapons we have mastered.\n\nTechnology Researching: [get_th_weapon_up_tech]\nProgress: [get_th_weapon_up_progress] (+[get_th_weapon_up_base]) / [get_th_weapon_up_cost]"
 th_weapon_up.11.a: "Research the Gungnir"
 th_weapon_up.11.b: "Research the Sakuya's Knife"
 th_weapon_up.11.c: "Research the Philosopher's Stone"
 th_weapon_up.20.desc: "In that case, Remilia, you'd better think about it and come again. I can start at any time, and this is the little thing I can do for you.\n\n（When the conditions are met, you can come to Patchouli at the communication menu.)"
 th_weapon_up.20.a: "Then I'll come back to you later."
 th_weapon_up.21.desc: "Have you decided? Then just wait for my good news.\n\n(When the conditions are met, you can come to Patchouli at the communication menu.)"
 th_weapon_up.21.a: "Please, Patchouli."
