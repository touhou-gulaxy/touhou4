 spth_version: "2.3.0 §MThroud Latent§!"
 spth_version_date: "2025.9.21"
 spth_latest_update_info: "1.完成了对4.1的适配。\n2.新增舰船类型：指挥无畏舰。\n3.新增灵能专属的护盾装甲组件。\n4.灵能专属武器-灵能裂解器。\n5.为幻想乡大部分组件添加了动物朋友版本。\n6.调整了部分武器特效。\n7.新增了两种幻想乡灵能高级政体与特殊领袖灵能特质。\n8.调整了整体的产能与武器数值。\n9.部分岗位不再能够自动化。\n10.幻想乡AI强化得到修复与改进。\n11.新增紫香花事件链，可以获得新的特殊领袖。\n12.新增主菜单链接按钮，可以直接打开本MOD的教程等。\n13.调整了一些视觉效果等可以增加代入感的内容。\n14.增强部分特殊领袖的特质。\n15.为超级航母的跨星系打击新增了可切换模式的功能。\n16.修复了幻想星区划的产出，同时幻想星现在可以享受岗位产出与维护费修正。\n17.部分幻想乡岗位可以吃到额外的加成，如幻想乡科研人员可以享受物理学家、生物学家、工程学家的加成。\n18.修复了部分已知的bug。\n19.优化了脚本性能。\n联动更新:\n$t$1.修复了古代帝国MOD诡异支援舰无法使用幻想乡支援脑的问题\n2.可能性空间科研船可以使用古代帝国MOD科研工程船的组件\n3.远程轰炸舰、指挥无畏舰可以使用古代帝国MOD的战术支援舰A槽。\n4.古代帝国MOD的舰载以太相引擎支持灵力循环。\n5.指挥无畏舰获得夸特MOD普通旗舰的认证。"
