 touhou_shroud_lower_level: "§M浅层虚境§!"
 toho.8200.name: "§USpirit Power Singularity in the Shroud§!"
 toho.8200.desc: "我们处在更深层的浅层虚境之中，这里灵能活动非常汹涌，因而不存在任何超主的痕迹。\n\n我们感觉到还有别的存在。一个§H$code_name_touhou_psionic_echo_sanae$§!正在侵蚀我们的意识，在周围掀起一场灵能风暴。\n\n一种深深的奇迹与希望被推入我们的集体心灵中。我们看到的是令人眼熟的灵能活动模式。\n\n不管这个实体是什么，它似乎很了解我们，难道它曾属于此地吗？"
 toho.8200.a: "尝试与其交流。"
 toho.8201.name: "§U显现原形§!"
 toho.8201.desc.intro: "这个被称为§H奇迹之物§!的遥远力量从虚境深处里用§H希望§!拥抱着我们的思想。祂沉默无声，但我们已经认出来是什么了——\n\n$toho.8201.desc.default$"
 toho.8201.desc.default: "祂是§H$NAME_sanae$§!的投影。\n\n我们曾经了解到灵能足够强大的实体可以在虚境中留下自己的投影，但是没想到灵力与灵能结合创造出了属于我们这位幻想灵媒的灵域。"
 toho.8201.a: "Wow."
