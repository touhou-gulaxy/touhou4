 th_kappa_torpedo_lore_desc: "\n§L会从目标能源网络中传输部分能量用于增加自身的修复，同时利于导弹穿透护盾，命中后灵力反应将引发异常的引力效应等，从而造成额外的杀伤。§!"
 TH_weapon_gungnir_lore_desc: "\n§L发射出仿制冈格尼尔的重型射弹，由于获得了命运的眷顾和吸血鬼的力量，命中率出奇的高，在命中后还会进行嗜血啃咬来为舰船恢复状态。§!"
 TH_weapon_spark_lore_desc: "\n§L以璀璨的光束攻击目标，能够有效的过载护盾与烧蚀装甲，由于光束的作用范围很大因此实际上较为精准，这一光束还能传输敌人能源网络中的能量帮助舰船进行修复。§!"
 auth_gensokyo_corporate: "幻想乡巨企"
 auth_gensokyo_corporate_desc: "所谓幻想乡，是围绕着少女们的游戏、祭典、宴会发展起来的风流社会，丰富多彩的文娱活动消耗了大量的资源。在山童们的引领下，人们逐渐走向了经贸发展之路，整个国家也开始团结于幻想乡巨型企业的旗下。"
