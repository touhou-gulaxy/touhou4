<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      width: 512px;
      height: 512px;
      margin: 0;
      overflow: hidden;
      background: transparent;
    }

    .stage {
      position: relative;
      width: 512px;
      height: 512px;
      overflow: hidden;
      transform-style: preserve-3d;
    }

    .ship {
      position: absolute;
      left: -2px;
      top: 14px;
      width: 500px;
      height: 500px;
      transform-origin: 50% 54%;
      transform: perspective(700px) rotateX(5deg) rotateY(-22deg) rotateZ(-3deg) scale(.86);
      transform-style: preserve-3d;
    }

    .ship img,
    .surface-shade,
    .surface-light {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
    }

    .surface-shade,
    .surface-light {
      background-image: url("building_silent_auditorium_spire_canonical_512.png");
      background-position: center;
      background-repeat: no-repeat;
      background-size: 100% 100%;
      pointer-events: none;
    }

    .surface-shade {
      filter: brightness(.4) saturate(.72);
      opacity: .9;
      -webkit-mask-image: linear-gradient(90deg, transparent 30%, rgba(0, 0, 0, .2) 48%, #000 100%);
      mask-image: linear-gradient(90deg, transparent 30%, rgba(0, 0, 0, .2) 48%, #000 100%);
    }

    .surface-light {
      filter: brightness(1.34) saturate(.82);
      opacity: .28;
      mix-blend-mode: screen;
      -webkit-mask-image: linear-gradient(270deg, transparent 82%, #000 97%);
      mask-image: linear-gradient(270deg, transparent 82%, #000 97%);
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="ship">
      <img src="building_silent_auditorium_spire_canonical_512.png" alt="">
      <div class="surface-shade"></div>
      <div class="surface-light"></div>
    </div>
  </div>
</body>
</html>
