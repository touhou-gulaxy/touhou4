 ag_located_mu_area_DESC: "这个位置可能存在一个星系。"

 ag_mu.2.name: "§PΜ星域§!"
 ag_mu.2.desc: "§H[Root.GetName]§!在穿过超空间航道后，到达了一片没有星光的领域。奇怪的是，整个§H[From.GetName]§!内没有恒星或黑洞等大型天体，但是其引力中心存在某种引力源维持着整个星系的轨道。其中存在着大大小小、风格迥异的舰船残骸。\n\n我们的[Root.Owner.GetAstronomyDepartment]和§H[Root.GetName]§!都没有办法检测出§H[From.GetName]§!中心那个隐形的引力源到底是什么。在引力源的“上”方，存在着一个被护盾包裹的古代文明空间站，围绕着它公转的是数个风格奇特、闪烁着蓝色光芒的小型空间站，这种设计风格和我们此前见过的任何东西都不相像。\n\n位于§H[From.GetName]§!内的环形世界残骸上存在着数个小型结构，似乎是它们发射出的能量流维持着护盾的运转。虽然整个古代环形装置异常破损，但其表明仍有一小片地方勉强完好，§H[Root.GetName]§!上的科学团队猜测，在那里也许还能发现一些古代文明活动的痕迹，说不定可以揭开这片星域可能的秘密。"
 ag_mu.2.a: "有意思，让我们看看。"
 ag_mu.2.b: "只不过是一些尘土和垃圾而已。"
 ag_mu.2.b.tooltip: "§R结束与§!§P[ag_ancient_mu_star.GetName]§!§R有关的事件组。§!"
